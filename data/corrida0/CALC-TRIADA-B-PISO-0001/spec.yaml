# CALC-TRIADA-B-PISO-0001 -- cara mecanica de spec.md (ACTO GEN2-F5-CIERRE-Y-PANEL-1).
# Gobierna spec.md y, sobre el, la spec SELLADA forense/prereg-caja/TRIADA-B-PISO-spec-v1_0.md
# (`prereg-caja-TRIADA-B-PISO`). Las dos capas y medidor.py se congelan en el COMMIT-1;
# el COMMIT-2 sella. Los cuatro insumos YA existen al congelar, por eso spec.yaml se
# instancia aqui y no despues (a diferencia de CALC-B-MARCO-MAE-0001).
calc_id: CALC-TRIADA-B-PISO-0001
spec_md: spec.md
spec_md_sha256: e83615afc8d5b87085059c456847df28a51212930015c3aab38db9b766071f76
script: data/corrida0/CALC-TRIADA-B-PISO-0001/medidor.py
etiquetas:
  generacion: GEN2
  tipo: CORRIDA-DE-REGISTRO-TABLA-COMUN-TRIADA-CON-B
  familia: TRIADA-B-PISO
  cuenta_gen2: 'SI'
  cuenta_gen2_nota: >-
    Firma de contador con OBJETO embebida en el lanzamiento y escrita en data/corrida0/decisiones.tsv
    (precedencia 1 de _cuenta_gen2_resuelto). SE DECLARA lo que la firma pasa por encima: la regla E.1
    marca esta corrida envuelto_legacy = SI POR CADENA -- consume RESULT de CALC-B-MARCO-MAE-0001 y de
    CALC-TRIADA-0002, ambos lectores de corridas-R/ -- y sin firma el registro la resolveria NO.
    prereg-caja-B-MARCO §7.7 declino firmar sobre un envuelto; esta spec se aparta de ese precedente
    por decision explicita y mas reciente de mesa, y lo registra (sellada §5.10). Contar NO adopta.
  validacion_independiente: NO-HECHA
  spec_sellada: forense/prereg-caja/TRIADA-B-PISO-spec-v1_0.md
  spec_sellada_sha256: a1043b48b538fd6a4bfb76e5c80fb71cc55c920dabe9d423652b6c65bf09a256
  reglas_bajo_prueba: >-
    NINGUNA. No mueve ninguna regla del motor, no adjudica, no corona y no toca el veredicto de la
    triada (T9). El resultado es descriptivo: no refuta ni corrobora nada (sellada §4.2).
  contaminacion_declarada: >-
    ADR-46 -- contaminacion TOTAL declarada por el lanzamiento y re-declarada aqui: el propio encargo
    trae los cuatro MAE de la tabla comun (B 0.885 / L_CORPUS 1.223 / L_SOLO 1.481 / M 4.638) porque
    direccion los verifico antes de encargar, y esta sesion pudo ver y vio los cuatro insumos. No se
    finge ceguera. Lo que sostiene la corrida es que la regla NO admite alternativas: universo por
    interseccion, estadistico heredado (media simple de abs(err_pp)), brazo PERSISTENCIA por cobertura,
    columnas preexistentes. Ninguna decision de la spec depende de un valor observado (sellada §0.2).
  medidor_ejecutado_al_congelar: >-
    NO sobre datos reales -- medidor.py, spec.md, spec.yaml y la spec sellada congelados en el COMMIT-1;
    probado SOLO sobre datos SINTETICOS (pruebas-sinteticas.py, 18 aserciones: tres ramas del control,
    U_COMUN vacio, guardia de identidad, MAE sobre el universo recortado y contadores en cero)
