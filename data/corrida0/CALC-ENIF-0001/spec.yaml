universo: >-
  ENIF 2024 (INEGI). Poblacion de 18 anios y mas residente en viviendas
  particulares. Unidad: LA PERSONA ELEGIDA (una por hogar, la del cumpleanios
  inmediato posterior a la entrevista; cuestionario 2.7), llave LLAVEMOD, en
  la tabla TMODULO.csv. Ponderador FAC_PER. Periodo de referencia de los
  reactivos de ahorro: junio de 2023 a la fecha (ultimos 12 meses).
  UNA SOLA TABLA Y UN SOLO PONDERADOR -- Y AUN ASI NINGUN DENOMINADOR SE
  COMPARTE, salvo el par de la familia B, que lo comparte y lo dice.
  U_A_SIN, familia A sin seguridad social: filas con P3_13='7' y P4_10 en
  {1,2,3,4,5} y FAC_PER finito > 0.
  U_A_CON, familia A con seguridad social: filas con P3_13 en {1,2,3,4} y
  P4_10 en {1,2,3,4,5} y FAC_PER finito > 0.
  U_B, familia B (UNICO denominador compartido): TODAS las filas con FAC_PER
  finito > 0.
  U_C_CONOCE: filas con P5_20 != 'b'/'' y P5_23='1' y FAC_PER finito > 0.
  U_C_NO_CONOCE: filas con P5_20 != 'b'/'' y P5_23='2' y FAC_PER finito > 0.

filtros: >-
  Sale del universo, CONTADO y no imputado: P4_10 en {8,9} (A-N-P410-NSNR) y
  P4_10 blanco (A-N-P410-BLANCO); P3_13 en {5,6,9} o 'b' (A-N-FUERA-DEL-EJE,
  el complemento de 5.2 de la spec sellada); P5_20 = 'b'/'' (C-N-CON-CUENTA);
  P5_23 fuera de {1,2} (C-N-EJE-INVALIDO); ponderador no finito o <= 0
  (*-N-SIN-PONDERADOR).
  Se cuenta pero NO sale del punto: filas sin EST_DIS o sin UPM_DIS
  (*-N-SIN-DISENO) -- afectan al IC, no al estimador.
  CERO NUNCA SUSTITUYE FALTA DE DATO.
  Si falta una columna declarada -> NO-ESTIMABLE-COLUMNA-AUSENTE:<col>; si
  existe y no trae ningun valor valido -> NO-ESTIMABLE-COLUMNA-VACIA:<col>; si
  un universo queda vacio -> NO-ESTIMABLE-UNIVERSO-VACIO. Si TODA fila de un
  universo carece de diseno -> METODO-IC = NO-ESTIMABLE-DISENO-INCOMPLETO y
  los IC salen null, pero el punto se reporta igual.
  En la familia B un P5_6_j='b' NO es un 'No': es «no tiene esa cuenta». No
  aporta un 1 a formal_cualquiera, y se cuenta aparte (B-N-SIN-NINGUNA-CUENTA)
  para que el 0 de origen sea legible.

ponderador: >-
  FAC_PER, factor de expansion a nivel PERSONA, columna de TMODULO.csv
  (FD TMODULO:1483, rango declarado 126 - 106896). NO se usa FAC_VIV ni
  FAC_HOG: son otras unidades y otro denominador.

transformacion: >-
  d(A-CORTO) = 1 si P4_10 en {1,2}; 0 si P4_10 en {3,4,5}.   [PRIMARIO]
  d(A-CORTO-S1) = 1 si P4_10 = 1; 0 si P4_10 en {2,3,4,5}.   [SENSIBILIDAD]
  d(B-FORMAL) = 1 si ALGUN P5_6_j = 1 (j en 1..9); 0 si ninguno.
  d(B-INFORMAL) = 1 si ALGUN P5_1_k = 1 (k en 1..6); 0 si ninguno.
  d(C-DESCONFIA) = 1 si P5_20 = '03'; 0 si P5_20 en {01,02,04..10}.
  p(U) = suma(w*d)/suma(w) sobre U, sumas en ORDEN FIJO DE FILA.
  Los complementos se emiten como suma ponderada de la categoria contraria
  sobre el MISMO denominador, y ademas se emite la SUMA como prueba mecanica.
  LA SUMA DE B-FORMAL Y B-INFORMAL NO SE FUERZA A 1, NO SE NORMALIZA Y NO SE
  RE-ESCALA: formal e informal COEXISTEN (Astra 2.4; hallazgo 3.2 del lote
  ENVIPE). Si suma > 1, se REPORTA como diagnostico -- nunca se corrige.
  NO se promedia entre olas, no se ajusta tendencia, no se extrapola, no se
  imputa.

estimando: >-
  DESCRIPTIVO. (1) PRIMARIOS, los 8 RESULT: A-P-CORTO-SIN / A-P-NOCORTO-SIN
  (RES-0046/0047), A-P-CORTO-CON / A-P-NOCORTO-CON (RES-0048/0049),
  B-P-FORMAL / B-P-INFORMAL (RES-0057/0058), C-P-DESCONFIA-CONOCE /
  C-P-DESCONFIA-NOCONOCE (RES-0059/0060).
  (2) SECUNDARIOS DECLARADOS: la sensibilidad S1 del corte de la familia A
  (que es el corte de GEN1, declarado en la contaminacion); los cinco
  complementos de 5.2 de la spec sellada, cada uno con su denominador escrito
  y SIN rango de cantidad medida; la suma B-FORMAL+B-INFORMAL y el peso de
  B-AMBAS-VIAS, que es la prueba directa de la coexistencia; y el peso de
  A-FUERA-DEL-EJE, que contesta cuanto pesa la gente que P3_13 no alcanza.
  NINGUN RESULT ES CAUSAL: P4_10, P5_1_*, P5_6_*, P5_20 y P5_23 son
  declaraciones del informante en una seccion transversal, y P3_13 no es una
  asignacion aleatoria -- comparar celdas de la familia A es DESCRIPCION.

inputs:
  - id: enif_2024_enif_2024_bd_csv
    origen: manifiesto
  - id: IN-ENIF-SPEC-SELLADA
    origen: repo
    ruta: forense/prereg-caja/ENIF-AHORRO-spec-v1_0.md
    sha256: 697ab9e8084d5a7d8ae413778c9ef33303181a934c1c493980202f87580f10ab

seed:
  aplica: true
  valor: 20260909
  rng: numpy.PCG64

tolerancia:
  tipo: flotante
  abs: 1.0e-10
  razon: >-
    Bootstrap fijado por seed + rng declarados y sumas en ORDEN FIJO DE FILA:
    la unica diferencia esperable entre dos corridas del mismo arbol es
    redondeo de float64 al reasociar sumas ponderadas. Los enteros y los
    textos se comparan EXACTO. NO se afloja para que la adopcion de P3 pase:
    si el grano de milpa/ (seis decimales) no cabe, la cita no se escribe y
    eso es el hallazgo.

