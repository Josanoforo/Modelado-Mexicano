universo: 'DELITO con BP1_20 in {1,2} en tmod_vic ENVIPE 2025 (n=40280); cruzado por los cuatro pares
  de ejes. Es la ola RESERVADA: se abre aqui, en COMMIT-3.'
ponderador: FAC_DEL
filtros: BP1_20 en {1,2}; FAC_DEL positivo; EST_DIS y UPM_DIS presentes; ejes sexo,
  edad (18-96), escolaridad_proxy y dominio_urbano_rural con sus categorias validas.
transformacion: 'evade_norma = (BP1_20==2) AND (BP1_23 in {04,05,06,08}); R(a,b)
  es suma(FAC_DEL*evade_norma)/suma(FAC_DEL) en cada celda de los cuatro cruces.'
seed:
  aplica: true
  valor: 42
  rng: numpy.PCG64
estimando: R(a,b) por celda de los cuatro cruces (unico codigo autorizado a agrupar 2025 por dos variables);
  soporte definitivo (PUNTUADA si n>=200 en 2023,2024,2025; FUERA-DE-SOPORTE global si fallan >= round(k/3)
  del cruce); veredicto de C7/C-ENCOGIDA contra C1/C2 con las dos condiciones INDECIDIBLE verbatim; DeltaMAE
  con IC (propagado desde replicas de R) por cruce; B-bis por cruce y agregado.
parametros:
  n_minimo_celda: 200
  umbral_celdas_gana_fraccion: 0.75
  delta_mae_umbral_pp: 0.5
  bootstrap_replicas_r: 2000
  criterio_indecidible_verbatim: INDECIDIBLE si ambos caen dentro del IC de R o si |d_L-d_M| < 0.5*EE(R)
  criterio_indecidible_fuente: forense/CAREO-ADV-DUELO-diseno-v2-2026-08-19.md:38
guardia:
  allowlist_payloads:
  - envipe2025_csv
  exige_sello_de: CALC-TRA-EVADE-NORMA-CRUCES-ENCOGIDA-EMISIONES-0001
tolerancia:
  tipo: flotante
  abs: 1.0e-09
  razon: C2 recalculado debe reproducir el sellado; bootstrap determinista por semilla
