  demanda_que_releva: "Ninguna: completa el dominio de concentracion de 0001 por aclaracion de mesa."
  reglas_bajo_prueba: "Descripcion de saldos Afore; no valida planeacion, conducta ni causalidad."
  firma_de_contador: "PENDIENTE-DE-MESA; no autorizada adopcion ni contador."
  contaminacion_declarada: "NO-CIEGA: expuesta a resultados completos de 0001 y, antes de su COMMIT-1, a P9_10/P9_11 y al conteo preparatorio de 1660 agregados positivos parciales."

inputs:
  - {id: enfih2019_bd_csv_zip, origen: manifiesto}
  - {id: enfih2019_fd_xlsx, origen: manifiesto}
  - id: IN-ENFIH2019-SALDOS-AFORE-CONCENTRACION-SPEC
    origen: repo
    ruta: forense/prereg-caja/ENFIH2019-SALDOS-AFORE-CONCENTRACION-spec-v1_0.md
    sha256: df641f04d61ac8c0b850b6126d1ba296019fa986bccafec922a14250875a6c0e
  - id: IN-ENFIH2019-SALDOS-AFORE-0001-RESULTADOS
    origen: repo
