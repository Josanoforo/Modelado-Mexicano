universo: 'T = personas elegidas 18+ de TMODULO, regimen ARBITRO-2024, con formalidad declarada (no FUERA)
  en su propia ola: P3_13 en 1..7 (2024), P3_10 en 1..6 (2021). Ninguna fila se quita: fuera de T, cada
  eje vale FUERA -- el bootstrap sortea sobre el marco entero.'
filtros: 'ARBITRO-2024 (enif_lote.py::_universo, tipo=ARBITRO-2024): edad >= 18 y peso > 0 verificados,
  sin filtro de TLOC; ''fuera'' declarado por eje. T se deriva DESPUES, sobre las columnas de eje ya derivadas
  (formalidad != FUERA), nunca recortando filas.'
ponderador: ENIF 2021 = FAC_ELE; ENIF 2024 = FAC_PER. Toda proporcion es razon de totales ponderados dentro
  de T.
transformacion: Identica a la spec v1.0 (D9, los seis ejes) mas la restriccion a T por la columna 'formalidad'
  ya derivada. Piso C2 citado de CALC-C2-RESTRINGIDO (punto) + replicas re-derivadas (piso_log_aditivo,
  importado); P2/R1/R2/R3 con cruces_familia.py y lote_familia.py, importados, sin cambio de formula.
estimando: p(ahorra_solo_informal | eje_A, eje_B, T) -- proporcion ponderada [0,1] dentro de T, en las
  28 celdas de los 5 pares con formalidad; error en pp.
precision: 'Replicas compartidas por ola: n_h UPM con reemplazo por estrato, PCG64(42), estratos y UPM
  en orden lexicografico sobre el marco ARBITRO-2024 ENTERO (no recortado a T antes de sortear), 10000
  replicas; IC95 = percentiles 2.5/97.5. C2/P2/R1/R2/R3 combinan replica k con k. No cubre el error de
  especificacion de ningun candidato.'
dependencias_materiales:
- numpy
- pandas
- yaml
seed:
  aplica: true
  valor: 42
  rng: numpy.random.PCG64 (replicas compartidas por ola, marco ARBITRO-2024 entero)
tolerancia:
  tipo: bootstrap
  exacto_por_seed: true
  abs: 1.0e-10
  razon: 'seed 42 + mismo regimen ARBITRO-2024 + mismo universo T (formalidad != FUERA) que CALC-C2-RESTRINGIDO:
    replicas identicas bit a bit'
parametros:
  bootstrap_replicas: 10000
  umbral_soporte_n: 200
  lambda_r2: 0.5
  umbral_vence_pp: 0.5
  umbral_reserva_pp: 0.0
  tol_control_c2r_p: 1.0e-06
  r3_ipf:
    tol: 1.0e-12
    max_iter: 2000
  pares_t:
  - - formalidadxsexo
    - formalidad
    - sexo
  - - edadxformalidad
    - edad
    - formalidad
  - - escolaridadxformalidad
    - escolaridad
    - formalidad
  - - formalidadxlocalidad
    - formalidad
    - localidad
  - - cuenta_formalxformalidad
    - cuenta_formal
    - formalidad
  c2r_result_ids:
    formalidadxsexo:
      sin seguridad social:
        1 Hombre: RESULT-C2R-ENIF2024-AHORRA-SOLO-INFORMAL-FORMALIDADXSEXO-SIN-SEGURIDAD-SOCIAL-X-1-HOMBRE-P
        2 Mujer: RESULT-C2R-ENIF2024-AHORRA-SOLO-INFORMAL-FORMALIDADXSEXO-SIN-SEGURIDAD-SOCIAL-X-2-MUJER-P
      con seguridad social:
        1 Hombre: RESULT-C2R-ENIF2024-AHORRA-SOLO-INFORMAL-FORMALIDADXSEXO-CON-SEGURIDAD-SOCIAL-X-1-HOMBRE-P
        2 Mujer: RESULT-C2R-ENIF2024-AHORRA-SOLO-INFORMAL-FORMALIDADXSEXO-CON-SEGURIDAD-SOCIAL-X-2-MUJER-P
    edadxformalidad:
      18-29:
        sin seguridad social: RESULT-C2R-ENIF2024-AHORRA-SOLO-INFORMAL-EDADXFORMALIDAD-18-29-X-SIN-SEGURIDAD-SOCIAL-P
        con seguridad social: RESULT-C2R-ENIF2024-AHORRA-SOLO-INFORMAL-EDADXFORMALIDAD-18-29-X-CON-SEGURIDAD-SOCIAL-P
      30-44:
        sin seguridad social: RESULT-C2R-ENIF2024-AHORRA-SOLO-INFORMAL-EDADXFORMALIDAD-30-44-X-SIN-SEGURIDAD-SOCIAL-P
        con seguridad social: RESULT-C2R-ENIF2024-AHORRA-SOLO-INFORMAL-EDADXFORMALIDAD-30-44-X-CON-SEGURIDAD-SOCIAL-P
      45-59:
        sin seguridad social: RESULT-C2R-ENIF2024-AHORRA-SOLO-INFORMAL-EDADXFORMALIDAD-45-59-X-SIN-SEGURIDAD-SOCIAL-P
        con seguridad social: RESULT-C2R-ENIF2024-AHORRA-SOLO-INFORMAL-EDADXFORMALIDAD-45-59-X-CON-SEGURIDAD-SOCIAL-P
      60+:
        sin seguridad social: RESULT-C2R-ENIF2024-AHORRA-SOLO-INFORMAL-EDADXFORMALIDAD-60-X-SIN-SEGURIDAD-SOCIAL-P
        con seguridad social: RESULT-C2R-ENIF2024-AHORRA-SOLO-INFORMAL-EDADXFORMALIDAD-60-X-CON-SEGURIDAD-SOCIAL-P
    escolaridadxformalidad:
      hasta primaria:
        sin seguridad social: RESULT-C2R-ENIF2024-AHORRA-SOLO-INFORMAL-ESCOLARIDADXFORMALIDAD-HASTA-PRIMARIA-X-SIN-SEGURIDAD-SOCIAL-P
        con seguridad social: RESULT-C2R-ENIF2024-AHORRA-SOLO-INFORMAL-ESCOLARIDADXFORMALIDAD-HASTA-PRIMARIA-X-CON-SEGURIDAD-SOCIAL-P
      secundaria:
        sin seguridad social: RESULT-C2R-ENIF2024-AHORRA-SOLO-INFORMAL-ESCOLARIDADXFORMALIDAD-SECUNDARIA-X-SIN-SEGURIDAD-SOCIAL-P
        con seguridad social: RESULT-C2R-ENIF2024-AHORRA-SOLO-INFORMAL-ESCOLARIDADXFORMALIDAD-SECUNDARIA-X-CON-SEGURIDAD-SOCIAL-P
      media superior:
        sin seguridad social: RESULT-C2R-ENIF2024-AHORRA-SOLO-INFORMAL-ESCOLARIDADXFORMALIDAD-MEDIA-SUPERIOR-X-SIN-SEGURIDAD-SOCIAL-P
        con seguridad social: RESULT-C2R-ENIF2024-AHORRA-SOLO-INFORMAL-ESCOLARIDADXFORMALIDAD-MEDIA-SUPERIOR-X-CON-SEGURIDAD-SOCIAL-P
      superior:
        sin seguridad social: RESULT-C2R-ENIF2024-AHORRA-SOLO-INFORMAL-ESCOLARIDADXFORMALIDAD-SUPERIOR-X-SIN-SEGURIDAD-SOCIAL-P
        con seguridad social: RESULT-C2R-ENIF2024-AHORRA-SOLO-INFORMAL-ESCOLARIDADXFORMALIDAD-SUPERIOR-X-CON-SEGURIDAD-SOCIAL-P
    formalidadxlocalidad:
      sin seguridad social:
        menor de 15 000: RESULT-C2R-ENIF2024-AHORRA-SOLO-INFORMAL-FORMALIDADXLOCALIDAD-SIN-SEGURIDAD-SOCIAL-X-MENOR-DE-15-000-P
        15 000 y mas: RESULT-C2R-ENIF2024-AHORRA-SOLO-INFORMAL-FORMALIDADXLOCALIDAD-SIN-SEGURIDAD-SOCIAL-X-15-000-Y-MAS-P
      con seguridad social:
        menor de 15 000: RESULT-C2R-ENIF2024-AHORRA-SOLO-INFORMAL-FORMALIDADXLOCALIDAD-CON-SEGURIDAD-SOCIAL-X-MENOR-DE-15-000-P
        15 000 y mas: RESULT-C2R-ENIF2024-AHORRA-SOLO-INFORMAL-FORMALIDADXLOCALIDAD-CON-SEGURIDAD-SOCIAL-X-15-000-Y-MAS-P
    cuenta_formalxformalidad:
