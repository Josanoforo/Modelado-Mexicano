# CALC-ENCIG-0001 -- cara mecanica de spec.md (ACTO GEN2-LOTE-ENCIG-1).
# Gobierna spec.md y, sobre el, la spec SELLADA
# forense/prereg-caja/ENCIG-MORDIDA-spec-v1_0.md (`prereg-caja-ENCIG-MORDIDA`).
# Releva la demanda CORR-0002 (12 RESULT) bajo el registro GEN2.
# CONGELADO en el COMMIT-1, antes de abrir un solo conjunto_de_datos/*.csv.
calc_id: CALC-ENCIG-0001
spec_md: spec.md
spec_md_sha256: e7eaa10403612fd85f412016f0ab651bd2370c9d18d89ee4574e18dbbcb11232

script: data/corrida0/CALC-ENCIG-0001/medidor.py

etiquetas:
  generacion: GEN2
  tipo: TASA-BASE-DE-REGLA
  cuenta_gen2: SI
  validacion_independiente: NO-HECHA
  spec_sellada: forense/prereg-caja/ENCIG-MORDIDA-spec-v1_0.md
  spec_sellada_sha256: 00c7c4a67a4a579fff8a64c01979deefe2d458c75cfbaa630de21fa05d37cf8a
  demanda_que_releva: "CORR-0002 (ENCIG2025) -> los 12 RESULT: RES-0003/0004 (familia A), RES-0009..0016 (familia B, ramas CD y SD), RES-0021/0022 (familia C). NO releva CORR-0001 (ENCIG2023, sin payload): identidad pendiente con decision propia, ADENDA (3)."
  reglas_bajo_prueba: "NINGUNA cambia de cifra por esta corrida. tramite.mordida.discrecional (R3.1), tramite.mordida.con_registro (R3.2) y tramite.gobierno_digital.util_sin_coercion (R3.4) ya estan MEDIDAS y selladas en milpa/tramite.yaml. Este CALC monta la cadena E.2 sobre esas cantidades; la adopcion de P3 es CITA, no cambio de cifra, y su rama la deciden los RESULT *-ADOPCION."
  firma_de_contador: "FIRMA DE MESA 9/sep/2026 con OBJETO explicito, verbatim en el encargo archivado: «cuenta_gen2 = SI para el CALC que este acto selle». Estandar FP-367/368 satisfecho (autoridad + fecha + OBJETO). El merge de mesa la perfecciona."
  contaminacion_declarada: "ADR-46 -- al congelar, la sesion YA habia leido (a) los 12 valores GEN1 en el encargo y en demanda-resultados.tsv; (b) IC95, n, estratos, UPM y ponderador de las tres enmiendas en milpa/tramite.yaml; (c) LA CODIFICACION GEN1 COMPLETA (P8_3_1 con 1/2 y 9-fuera; P8_4 x P7_3 con presencial={1} y digital={3,4,5}; N_TRA=01 con adopta={4,5} sobre P7_3 en {1,2,4,5,6}); (d) el diagnostico de MAESTRA35-L1 sobre la deduplicacion de r1. Por eso las PRIMARIAS de esta spec NO son las de GEN1: familia A primaria SOLANY (los tres incisos del reactivo 8.3, no solo P8_3_1) y familia B primaria SD (sin deduplicar, por NT_TIPO del descriptor). Lo genuinamente desconocido al congelar: el peso residual de P7_3 fuera del par presencial/digital, el peso de {9,blanco} en P8_3_1, la cobertura del join sec_7 x sec_8, y si la llave declarada por el descriptor es la llave real -- ninguno aparece en fuente alguna leida."
  medidor_ejecutado_al_congelar: "NO -- escrito y congelado en el COMMIT-1, corrido en el COMMIT-2 del mismo acto"

inputs:
  - id: encig25_base_datos_csv
    origen: manifiesto
  - id: IN-ENCIG-SPEC-SELLADA
    origen: repo
    ruta: forense/prereg-caja/ENCIG-MORDIDA-spec-v1_0.md
    sha256: 00c7c4a67a4a579fff8a64c01979deefe2d458c75cfbaa630de21fa05d37cf8a

