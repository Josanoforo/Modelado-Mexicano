# CALC-DUELO-0001 -- cara mecanica de spec.md (ACTO GEN2-F5-DUELO-CALC).
# Gobierna spec.md y, sobre el, la spec SELLADA
# forense/prereg-duelo-v2/F5-duelo-contemporaneo-spec-v1_0.md
# (COMMIT-1 de ACTO GEN2-F5-RECAPTURA-L). Este acto EJECUTA esa spec, no la
# enmienda -- copia aqui, citandola por hash, la pareada primaria (b-bis), la
# secundaria, la escala EXHAUSTIVA, las tres fuentes de incertidumbre, la
# cobertura por brazo y la tolerancia, tal como su Sec.5-7 las fija.
# CONGELADO en el COMMIT-1 de este acto, antes de correr el medidor.
