    hallazgo: >
      LA SEPARACION QUE EL PAR R7.3/R7.6 AFIRMA NO APARECE. R7.3 -- que es
      [FUERTE] -- dice que sin monitoreo percibido del voto la agencia SE
      CONSERVA: recibir la transferencia no deberia mover a quien se vota. El
      dato dice que si la mueve, y casi tanto como donde el voto se percibe
