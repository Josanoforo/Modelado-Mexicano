variables:
  - {archivo: cide_cses2015_nacional_poselectoral.sav, variable: pcyc13, rol: "receptor de OFERTA", codigos: "1=Sí; 2=No; 9=Ns/NC"}
  - {archivo: cide_cses2015_nacional_poselectoral.sav, variable: pcyc13_1, rol: "partido oferente", codigos: "1..10/12 partidos; 97=Ninguno; 99=NS/NC"}
  - {archivo: cide_cses2015_nacional_poselectoral.sav, variable: pcyc14, rol: "receptor de AMENAZA", codigos: "1=Sí; 2=No; 9=Ns/NC"}
  - {archivo: cide_cses2015_nacional_poselectoral.sav, variable: pcyc14_1, rol: "partido amenazante", codigos: "1..10/12 partidos; 97=Ninguno; 99=NS/NC"}
  - {archivo: cide_cses2015_nacional_poselectoral.sav, variable: peledip, rol: "desenlace: voto emitido para diputados federales, 7-jun-2015"}
  - {archivo: cide_cses2015_nacional_poselectoral.sav, variable: PONDFIN, rol: "ponderador global", etiqueta: "Ponderador nacional"}
  - {archivo: cide_cses2015_nacional_poselectoral.sav, variable: dominio, rol: "estrato de diseño"}
  - {archivo: cide_cses2015_nacional_poselectoral.sav, variable: upmmn, rol: "UPM"}

universo: >-
  Adultos de CIDE-CSES 2015 nacional poselectoral que declaran pcyc13=1, para
  OFERTA, o pcyc14=1, para AMENAZA. Ramas separadas; una persona puede estar
  en ambas. Fuente completa 1200 filas; cada denominador realizado se publica.
filtros: >-
  Receptor=1; partido señalado resoluble; peledip observado; PONDFIN finito y
  positivo; dominio y upmmn observados. 97/99 en partido y faltantes se excluyen
  y cuentan. Los votos sin contraparte partidista son NO-ALINEADO, no faltante.
ponderador: "PONDFIN, etiqueta Ponderador nacional"
transformacion: >-
  ALINEADO por crosswalk oferente->voto; coalición peledip=29 acepta PRI o PVEM.
  NO-ALINEADO es el complemento dentro del universo analítico.
estimando: >-
  Por rama: P(ALINEADO), P(NO-ALINEADO), sus IC95 y Delta_comp = P(ALINEADO) -
  P(NO-ALINEADO), con tamaños brutos y sumas de peso. Descriptivo/asociativo.
dependencias_materiales: [numpy, pyreadstat]

parametros:
  fuente_acto: "ACTO GEN2-S6-S12-S13-SUCESORAS"
  input_id: cide_cses2015_nacional_poselectoral
  ponderador: PONDFIN
  estrato: dominio
  upm: upmmn
  desenlace: peledip
  ramas:
    - [OFERTA, pcyc13, pcyc13_1]
    - [AMENAZA, pcyc14, pcyc14_1]
  crosswalk_partido: {1: 1, 2: 2, 3: 4, 4: 8, 5: 9, 6: 19, 7: 34, 8: 35, 9: 36, 10: 37, 12: 10}
  coaliciones: {29: [2, 9]}
  bootstrap_replicas: 2000
  metodo_ic: "bootstrap percentil de UPM upmmn dentro de estrato dominio"

seed: {aplica: true, valor: 20260910, rng: numpy.PCG64}
tolerancia:
  tipo: flotante
  abs: 1.0e-10
  razon: "seed y RNG fijados; enteros y textos se comparan exactos"

