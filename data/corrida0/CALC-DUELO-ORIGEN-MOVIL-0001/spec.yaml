  ruta: data/corrida0/CALC-TRA-EVADE-NORMA-SXD-EMISIONES-0001/resultados.json
  sha256: 5d120c1f302c364639c5cdfaf82efec7a7a84cbb1a0d55c0825aa0188330c7c7
- id: evasion_norma_v11
  origen: repo
  ruta: data/corrida0/CALC-EVASION-NORMA-0001-v1_1/resultados.json
