        - {cat_pos: 2, etiqueta: "Jornalero(a) o peon(a)",   n: 987,  p: 0.2940}
      lectura: "brecha de 42.90pp entre empleado/obrero (72.30%) y jornalero/peon (29.40%), en la direccion que §3.1 predice. Evidencia de direccion, NO la condicional de la regla."
