  - {id: RESULT-ENSANUT-A-P-NO-LOGISTICA, tipo: proporcion, unidad: "proporcion ponderada de menciones con razon no logistica, CONTADA (nunca 1 - p)", permite_no_estimable: true}
  - {id: RESULT-ENSANUT-A-SUMA-UNO, tipo: texto, unidad: "SI / NO:<residuo> -- las dos proporciones dentro de tolerancia"}
  - {id: RESULT-ENSANUT-A-IC-LO, tipo: flotante, unidad: "percentil 2.5 del bootstrap de diseno", permite_no_estimable: true}
  - {id: RESULT-ENSANUT-A-IC-HI, tipo: flotante, unidad: "percentil 97.5 del bootstrap de diseno", permite_no_estimable: true}
  - {id: RESULT-ENSANUT-A-METODO-IC, tipo: texto, unidad: "IC-DE-DISENO / IC-CON-ESTRATOS-DE-UPM-UNICA / NO-ESTIMABLE-DISENO-INCOMPLETO / NO-ESTIMABLE-N-INSUFICIENTE"}
  - {id: RESULT-ENSANUT-A-DELTA-VS-GEN1, tipo: flotante, unidad: "A-P-LOGISTICA menos 0.777762, CON SIGNO", permite_no_estimable: true}
  - {id: RESULT-ENSANUT-A-REPRODUCE-GEN1, tipo: texto, unidad: "REPRODUCE / NO-REPRODUCE / NO-ESTIMABLE -- round(A-P-LOGISTICA,6) == 0.777762"}
