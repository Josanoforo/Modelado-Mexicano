universo: >-
  Identico al de las emisiones (spec humana §3.1): personas ELEGIDAS de 18 anos
  y mas del modulo TMODULO de ENIF 2024, una fila por persona seleccionada.
filtros: >-
  Los mismos tres, en el mismo orden: edad valida 18 <= edad_v <= 97 excluyendo
  los centinelas 98 y 99; tloc en {1,2,3,4}; fac_per presente y > 0. AQUI SI se
  construye la llave (localidad, edad) sobre ENIF 2024: es el objeto de este
  CALC y el commit en que la reserva se levanta. Las emisiones ya estaban
  selladas cuando esto corrio -- el orden del diff es el sello.
ponderador: fac_per -- Factor de expansion a nivel persona (FD 6,C,fac_per)
transformacion: >-
  R = p(ahorra_solo_informal | localidad, edad) en las 8 celdas de cruce de
  ENIF 2024, misma receta que el arbitro marginal: razon de totales ponderados,
  bootstrap de conglomerados estratificado (remuestreo con reemplazo de
  upm_dis dentro de est_dis), 10 000 replicas, seed 42, IC95 por percentiles
  2.5/97.5. R9 (nueve tipos) es el PRIMARIO; R7 (siete) es la SENSIBILIDAD y NO
  ADJUDICA. Adjudicacion por celda: error absoluto en puntos porcentuales
  contra R9; INDECIDIBLE por las dos condiciones verbatim del programa; skill
  1 - MAE/MAE(piso) que se reporta y no adjudica; conteo a nivel celda-D.
estimando: >-
  El arbitro R del cruce y la adjudicacion por celda de los candidatos ya
  emitidos y sellados. Diagnostico C5: |p_nacional - p_celda| por celda, solo
  descriptivo, fuera de toda competencia.
precision: >-
  R: IC95 muestral por bootstrap de conglomerados estratificado, 10 000
  replicas, seed 42. EE(R) = (IC95sup - IC95inf)/3.92, que es la escala del
  criterio INDECIDIBLE. La adjudicacion NO produce un IC propio: es un conteo
  sobre 8 celdas de una misma muestra, no independientes, y por eso el umbral
  es de conteo y no hay valor-p.

dependencias_materiales: [numpy, pandas]
seed: {aplica: true, valor: 42, rng: numpy.random.PCG64}
tolerancia:
  tipo: bootstrap
  exacto_por_seed: true
  abs: 1.0e-10
  razon: "mismo generador, mismo orden de consumo y misma semilla que el CALC de emisiones"

parametros:
  celdas: [L1xE1, L1xE2, L1xE3, L1xE4, L2xE1, L2xE2, L2xE3, L2xE4]
  desenlace_primario: D9
  desenlace_sensibilidad: D7
  desenlace_sensibilidad_adjudica: false
  localidad_L1_tloc: ["3", "4"]
  localidad_L2_tloc: ["1", "2"]
  edad_tramos: {E1: [18, 29], E2: [30, 44], E3: [45, 59], E4: [60, 97]}
  edad_centinela: ["98", "99"]
  codigos_informal_2024: [p5_1_1, p5_1_2, p5_1_3, p5_1_4, p5_1_5, p5_1_6]
  codigos_formal_D9_2024: [p5_6_1, p5_6_2, p5_6_3, p5_6_4, p5_6_5, p5_6_6, p5_6_7, p5_6_8, p5_6_9]
  codigos_formal_D7_2024: [p5_6_1, p5_6_2, p5_6_3, p5_6_4, p5_6_5, p5_6_8, p5_6_9]
  codigo_si: "1"
  bootstrap_replicas: 10000
  umbral_soporte_n: 200
  pisos: [C1, C2]
  challengers: [C3-LSOLO]
  challenger_diferido: C3-LCORPUS
  criterio_indecidible_verbatim: "si ambos caen dentro del IC de R o si |d_L-d_M| < 0.5*EE(R)"
  criterio_indecidible_fuente: "forense/CAREO-ADV-DUELO-diseno-v2-2026-08-19.md:38"
  ee_r_formula: "(IC95sup - IC95inf)/3.92"
  umbral_celdas_gana: 6
  umbral_celdas_puntuadas: 6
  precedencia: "si dos filas se satisfacen, manda INDECIDIBLE"
  paradas_admisibles: [ADJUDICADA, INDECIDIBLE, SIN-CANDIDATO-SUPERIOR, FUERA-DE-SOPORTE]
  b_bis_c1: "si nadie vence a C1 -> la persistencia queda corroborada como piso en DIN"
  b_bis_c2: "si nadie vence a C2 -> los candidatos ensayados no superaron este piso, bajo esta evaluacion, en estas ocho celdas. Eso es TODO lo que dice (H5): no identifica ausencia de interaccion, ni ausencia de informacion aprovechable por otros metodos, ni una propiedad de la poblacion."
  limite_de_la_evaluacion: "si el ganador se ELIGE con las ocho celdas, esa misma evaluacion no lo valida de forma independiente (H5, fila 7 de la tabla fundida). El resultado se reporta como seleccion mas desempeno conjunto, nunca como desempeno independiente del ganador."
  p_nacional_c5: 0.357153
  p_nacional_c5_fuente: "milpa/tramite.yaml:1312 -- clase DERIVADO, sin IC propio; no es MEDIDO"
  c5_rol: "COMPLEMENTO / diagnostico puro; fuera de la competencia porque el emisor es el arbitro con otro nombre (tramite.yaml:712)"
  champion: NINGUNO
  adopcion: NINGUNA

