  firma_de_contador: "Encargo GEN2-ENIF-POBLACION-Y-ADOPCION, 10/sep/2026, objeto explicito: cuenta_gen2=SI para CALC-ENIF-0002 al ejecutar D04/D05; el merge de mesa perfecciona la firma."
  medidor_ejecutado_al_congelar: NO

payloads:
  - id: enif_2024_enif_2024_bd_csv
    archivo: enif_2024_bd_csv.zip
    sha256: 00e4b0b42775276b2da236a5bba8c64dc5a92c289908a4727dec93dc7684f039
    miembro_usado: TMODULO.csv

codebook:
  - id: enif2024_fd_xlsx
    archivo: enif_2024_fd.xlsx
    sha256: 17e2ad86ce9e4fd5783ee54e9b51ee436b934e002d5736b82094070c74a25db2
    rol: "autoridad de nemonicos, codigos y blancos por secuencia"
  - id: enif2024_cuestionario_pdf
    archivo: enif_2024_cuestionario.pdf
    sha256: 32e37cc13da38691dee20fbffcef3637aeb87b8dac194e64f83bebed8b57ef8b
    rol: "autoridad de saltos 3.8 -> 3.9/3.10/3.14; 3.9 -> 3.10/3.14; 3.10=6 -> 3.14"

variables:
  - {archivo: TMODULO.csv, variable: P3_8, rol: "condicion de actividad; 1/2 trabajan; 8 pase directo a 3.14; 3..7/9 pasan por 3.9", codigos: "1..9"}
  - {archivo: TMODULO.csv, variable: P3_9, rol: "verificacion de actividad; 1..6 actividad; 7 ninguna actividad por ingreso; b por secuencia", codigos: "1..7,b"}
  - {archivo: TMODULO.csv, variable: P3_10, rol: "guardia de trabajador sin pago; 6 pasa a 3.14 y deja P3_13 blanco", codigos: "1..6,b"}
  - {archivo: TMODULO.csv, variable: P3_13, rol: "eje solo para trabajadores; con SS 1..4, sin SS 7, residual 5/6/9/b", codigos: "1..7,9,b"}
  - {archivo: TMODULO.csv, variable: P4_10, rol: "desenlace preguntado a toda la poblacion; corto 1/2; no corto 3/4/5; NS/NR 8/9", codigos: "1..5,8,9"}
  - {archivo: TMODULO.csv, variable: FAC_PER, rol: "factor de expansion de persona", codigos: "numerico positivo"}
  - {archivo: TMODULO.csv, variable: EST_DIS, rol: "estrato de diseno como texto opaco", codigos: "001..190"}
  - {archivo: TMODULO.csv, variable: UPM_DIS, rol: "UPM de diseno como texto opaco", codigos: "00001..02172"}

universo: >-
  ENIF 2024, personas elegidas de 18 anios y mas en viviendas particulares,
  TMODULO.csv. U_NT = (P3_8=8 o P3_9=7) y P4_10 en 1..5 y FAC_PER valido.
  Trabaja = P3_8 en 1/2 o P3_9 en 1..6. P3_13 nunca se imputa.
filtros: >-
  P4_10 8/9/blanco/invalido se cuenta como faltante y sale de las tasas; peso
  no finito o no positivo sale. La particion de actividad debe ser exhaustiva
  y disjunta sobre P4_10 valido o el medidor para.
ponderador: "FAC_PER de TMODULO.csv; unidad persona, nunca FAC_VIV/FAC_HOG"
transformacion: >-
  corto=1[P4_10 en {1,2}], no_corto=1[P4_10 en {3,4,5}]. La particion
  poblacional es trabaja-con-SS / trabaja-sin-SS / no-trabaja /
  trabaja-residual. El total es una razon directa, no promedio de tasas.
estimando: >-
  Descriptivo. Primario: p(horizonte corto | no trabaja). Secundarios:
  p(corto | trabajador residual), p(corto | poblacion 18+ con P4_10 valido),
  masas y cobertura. CALC-ENIF-0001 se reutiliza para las celdas trabajadoras
  A/A y no se vuelve a medir.

inputs:
