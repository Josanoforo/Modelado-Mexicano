universo: 'Personas ELEGIDAS de 18 anos y mas de TMODULO de ENIF, una fila por persona. Regimen PILOTO-1 (spec v1_0
  §1): filtros globales; ENIF 2021 completa; ENIF 2024 segun el punto de entrada.'
filtros: 'PILOTO-1 (spec v1_0 §1): (1) 18 <= edad <= 97 en las dos olas, 98/99 centinelas fuera y contados; (2)
  TLOC en {1,2,3,4}; (3) ponderador presente y > 0. Nada mas. Sobre ENIF 2024 en emisiones: una sola variable de
  agrupacion por lectura (guardia probada en cada corrida); el cruce solo en adjudicacion, por la unica funcion
  cruce() y solo sobre pares autorizados por el contrato.'
ponderador: ENIF 2021 = FAC_ELE (factor del elegido; FAC_PER no existe en 2021); ENIF 2024 = FAC_PER. Toda proporcion
  es razon de totales ponderados.
transformacion: 'D9 := alguna P5_1_k == ''1'' (k=1..6) Y ninguna via formal == ''1'' (2021: P5_7_1..9; 2024: P5_6_1..9).
  Ejes: sexo (1/2); edad en 4 tramos del arbitro; escolaridad por ETIQUETA del catalogo de cada ola (codigo sin
  etiqueta declarada -> PARO; ''No sabe'' -> fuera); localidad TLOC {1,2} vs {3,4}; formalidad P3_10 (2021: 1-5
  con, 6 sin) / P3_13 (2024: 1-6 con, 7 sin), blanco y 9 fuera; cuenta_formal alguna P5_4_k == ''1'' vs ninguna
  (todas en blanco -> fuera). Contendientes (spec v1_0 §4): C2 = expit(logit m24(a) + logit m24(b) - logit m24)
  con m24 SELLADOS (#971) e IC replica a replica; P2 = cruce 2021; R1 = expit(logit C2 + delta21); R2 = expit(logit
  C2 + 1/2 delta21); R3 = raking a tres vias de la tabla ponderada 2021 (a,b,D) a los margenes (a,D),(b,D) de 2024
  sellados.'
estimando: p(ahorra_solo_informal | eje_A, eje_B) -- proporcion ponderada [0,1] de personas elegidas 18+ de ENIF
  2024, en las 96 celdas de los 14 pares reservados, bajo D9; error en pp.
precision: 'Replicas compartidas por ola: n_h UPM con reemplazo por estrato, PCG64(42), estratos y UPM en orden
  lexicografico, 10 000 replicas; IC95 = percentiles 2.5/97.5 de las replicas definidas; C2/R1/R2/R3 combinan replica
  k con k (2024 con 2021, muestras independientes, sin covarianzas inventadas); delta-MAE por replica. No cubre
  el error de especificacion de ningun candidato.'
