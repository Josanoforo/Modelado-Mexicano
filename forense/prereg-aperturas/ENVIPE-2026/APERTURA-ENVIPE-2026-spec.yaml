# CALC-APERTURA-ENVIPE-2026-0001 -- contrato ejecutable del expediente de apertura (D-15), GEN2-APERTURAS-PREREGISTRADAS-1.
# NO CORRIDO. La apertura es copiar este archivo a data/corrida0/CALC-APERTURA-ENVIPE-2026-0001/spec.yaml;
# el primer resultado que produzca es el que se reporta. Derivado por expediente_apertura.escribe_contrato.
calc_id: CALC-APERTURA-ENVIPE-2026-0001
spec_md: ../../../forense/prereg-aperturas/ENVIPE-2026/APERTURA-ENVIPE-2026-spec-v1_0.md
spec_md_sha256: 13b6057d6ab0550cc9bda36bf160af6ef9b65496390ec708706a5efdf3c4a705
script: forense/prereg-aperturas/ENVIPE-2026/medidor_apertura_envipe_2026.py
dependencias_materiales:
- numpy
- pandas
etiquetas:
  generacion: GEN2
  uso_motor: NO-ADOPTA-NADA
  cuenta_gen2: 'NO'
  fuente_acto: GEN2-APERTURAS-PREREGISTRADAS-1
  tipo: APERTURA-PRE-REGISTRADA (COMMIT-3 de la ola reservada)
  agrupacion: UNA-SOLA-VARIABLE
  marca: PROSPECTIVA
  unidad_transferencia: PERSONA
  contendientes:
  - CALC-ENVIPE-PERCEPCION-2024-0001
  - CALC-MC2-ENVIPE2025-0001
  ola_reservada: ENVIPE 2026 (se abre sólo al correr este CALC)
  congelado: NO -- expediente; se congela cuando mesa firme su apertura
inputs:
- id: envipe2026_csv
  origen: manifiesto
  sha256: dd79f589eb6ed7d3675cc86e21ac9bbdbf269913963091d8698d6e28e0540a17
  funcion: DATO
  nota: 'ENVIPE 2026 datos abiertos CSV -- reserva RESTANTE: tper_vic1 (los dos contendientes) y tsdem.NIV como
    eje de persona elegida; tmod_vic (ya abierta por los duelos sellados) sólo para las celdas RETROSPECTIVAS de
    MC2, sin puntuar; sólo este medidor la lee'
- id: contendiente_medidor
