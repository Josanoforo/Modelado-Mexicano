universo: >-
  ENCUCI 2020 (INEGI), UNA sola ola. Poblacion mexicana de 15 ANIOS Y MAS
  residente en viviendas seleccionadas; dominios de estimacion declarados por
  el descriptor: nacional urbano, nacional rural y seis regiones. Los
  estimadores de esta spec son NACIONALES. Ventana de referencia de los
  reactivos 5.16/5.17/5.18: «los ultimos 12 meses, es decir, de agosto de 2019
  a la fecha» -- precede al confinamiento, aunque la entrevista ocurra dentro
  de el. AP7_3_5 es «alguna vez en su vida» y no tiene ventana.
  U_A, unidad PERSONA SELECCIONADA (tabla SEC_4_5): filas con FAC_SEL finito
  > 0, contacto declarado (_cod(AP5_16_k) == 1 para algun k en 1..10) y
  AP5_17 y AP5_18 AMBOS en {1,2}.
  U_A_POB, mismo archivo: filas con FAC_SEL finito > 0 que o bien NO declaran
  contacto (d = 0: 5.17 pregunta «DE ESOS contactos», asi que sin contacto no
  hay ocasion posible -- por eso el descriptor declara codigo `b` en 5.17/5.18
  y NO en 5.16; el 0 es la logica del instrumento, no una imputacion) o bien
  estan en U_A. Las filas con contacto y 9/blanco NO entran como 0: salen, y su
  peso va en A-P-RESIDUO-POBLACION. Prevalencia sobre la poblacion completa,
  secundaria declarada, NO adoptable.
  U_B, unidad PERSONA SELECCIONADA (SEC_6_7_8 emparejada con SEC_4_5 por
  ID_PER): filas con pareja, FAC_SEL finito > 0, AP7_3_5 en {1,2}, AP4_3_2 en
  {1,2} y DOMINIO en {U,C,R}. Eje CONGELADO: urbano = {U, C} (el descriptor
  llama a C «Complemento urbano»), rural = {R}.

filtros: >-
  Sale del universo, CONTADO y no imputado: AP5_17 o AP5_18 = 9 (A-N-NSNR-17 /
  A-N-NSNR-18), en blanco (A-N-BLANCO-17 / A-N-BLANCO-18) o fuera del dominio
  declarado (A-N-FUERA-DE-DOMINIO); ausencia de contacto (A-N-SIN-CONTACTO);
  AP7_3_5 = 9 o blanco (B-N-NSNR / B-N-BLANCO); AP4_3_2 fuera de {1,2}
  (B-N-AGRAVIO-NSNR); DOMINIO fuera de {U,C,R} (B-N-DOMINIO-FUERA); ponderador
  no finito o <= 0 (*-N-SIN-PONDERADOR); fila de SEC_6_7_8 sin pareja
  (B-N-SIN-PAREJA).
  Se cuenta pero NO sale del punto: filas sin EST_DIS o sin UPM_DIS
  (*-N-SIN-DISENO) -- afectan al IC, no al estimador.
  CERO NUNCA SUSTITUYE FALTA DE DATO.
  Si falta un miembro del ZIP -> NO-ESTIMABLE-MIEMBRO-AUSENTE:<m>; si falta una
  columna declarada -> NO-ESTIMABLE-COLUMNA-AUSENTE:<col>; si existe y no trae
  ningun valor valido -> NO-ESTIMABLE-COLUMNA-VACIA:<col>; si un universo queda
  vacio -> NO-ESTIMABLE-UNIVERSO-VACIO; si ID_PER no es unico en alguna de las
  dos tablas -> la familia B sale NO-ESTIMABLE-LLAVE-NO-UNICA y NO se elige
  otra llave sobre la marcha. Si TODA fila de un universo carece de diseno ->
  METODO-IC = NO-ESTIMABLE-DISENO-INCOMPLETO y los IC salen null, pero el punto
  se reporta igual.

ponderador: >-
  FAC_SEL en las dos familias -- el descriptor lo define como «Ponderador que se
  utiliza para estimar resultados de las preguntas que se refieren al informante
  seleccionado». NO se usa FAC_VIV (factor de vivienda, otra unidad). El
  descriptor declara FAC_SEL como Numerico de longitud 6 y el DBF lo declara
  N 19,10: manda el header, se lee como flotante tal cual y jamas se normaliza,
  ni se redondea, ni se trunca.

transformacion: >-
  _cod(v) = entero si el texto crudo, tras strip(), parsea como flotante finito
  de parte fraccionaria nula; None en cualquier otro caso. Asi '1' y
  '1.000000000000000' dan el mismo 1 sin apostar por un formato.
  d(SOLICITUD) = 1 si AP5_17=1, 0 si =2.
  d(ENTREGA)   = 1 si AP5_18=1, 0 si =2.
  d(CUALQUIERA)= 1 si AP5_17=1 o AP5_18=1; 0 si ambos =2  [codificacion GEN1].
  d(AMBAS)     = 1 si AP5_17=1 y AP5_18=1; 0 en otro caso.
  d(COMPLEMENTO) = 1 si AP5_17=2 y AP5_18=2 -- contado DIRECTAMENTE sobre el
  mismo denominador, nunca como 1 - p.
  d(B) = 1 si AP7_3_5=1, 0 si =2.
  p(U) = suma(w*d)/suma(w) sobre U, sumas en ORDEN FIJO DE FILA.
  Los IC de las diferencias B-DIF-C1 y B-DIF-C2 se toman de la MISMA replica
  bootstrap (diferencia por replica), no de dos bootstraps independientes.
  NO se promedia entre olas, no se ajusta tendencia, no se extrapola, no se
  imputa, no se re-escala. NINGUNA cifra se puentea a ENCIG 2025.

estimando: >-
  DESCRIPTIVO. (1) PRIMARIOS: A-P-ENTREGA y A-P-SOLICITUD (los dos reactivos de
  pago informal por separado, unidad PERSONA 15+ con contacto declarado) y las
  CUATRO celdas del eje entorno x agravio de la familia B. (2) CELDA ADOPTABLE
  de A: A-P-CUALQUIERA, la codificacion GEN1 -- se mide igual pero NO es la
  primaria por codebook. (3) SECUNDARIOS DECLARADOS: A-P-AMBAS,
  A-P-SOLICITUD-SIN-ENTREGA, A-P-CUALQUIERA-POBLACION (segundo denominador),
  el complemento con su denominador escrito, las cuatro celdas de la agrupacion
  alternativa de DOMINIO, los pesos residuales y todos los conteos de embudo.
  NINGUN RESULT ES CAUSAL: B-DIF-C1 y B-DIF-C2 van rotuladas ASOCIACION --
  entorno y agravio no se asignan al azar. La comparabilidad con ENCIG 2025
  queda DECLARADA COMO PREGUNTA ABIERTA, no como supuesto: mismo constructo no
  es mismo instrumento, y ninguna salida de esta spec los pone lado a lado.

dependencias_materiales: [numpy]

parametros:
  fuente_acto: "ACTO GEN2-LOTE-ENCUCI-1 · CUARTO LOTE DE LA CARTERA · CALC-ENCUCI-0001"
  firma_que_lo_autoriza: "Firma de mesa 9/sep/2026, verbatim en el encargo archivado: «Encargo f5 corriendo, revisa este de chatpgt y dame este encargo y los que siguen de Gen2, necesito que medes al menos 5 encargos a correr en claude code, no me separas los que te estoy pidiendo, dame 5 completos.» -- ordena el lote. Y, con OBJETO explicito sobre el contador, el parrafo del propio encargo: «cuenta_gen2 = SI para el CALC que este acto selle». Estandar FP-367/368 satisfecho."
  bootstrap_replicas: 2000
  umbral_replica_gen1: 1.0e-6
  grano_milpa_decimales: 6
  metodo_ic: "bootstrap de UPM_DIS CON REEMPLAZO dentro de EST_DIS, conservando el numero de UPM por estrato; percentiles 2.5/97.5; las diferencias se toman de la misma replica"
  regla_estrato_upm_unica: >-
    Un estrato con exactamente una UPM se re-muestrea a si mismo: aporta
    varianza cero. NO se colapsa (decision de diseno que esta spec no esta
    autorizada a tomar) y NO se descarta (sesgaria el punto). Si el conteo es
    > 0, METODO-IC sale IC-CON-ESTRATOS-DE-UPM-UNICA y el IC se lee como LIMITE
    INFERIOR de la anchura verdadera, nunca como IC exacto.
  llaves_opacas: >-
    EST_DIS y UPM_DIS se agrupan como CADENA CRUDA. Nunca se convierten a
    entero ni se re-rellenan a un ancho tomado del descriptor: el descriptor ya
    discrepa (declara EST_DIS de ancho 3; el DBF lo declara de ancho 7), y
    normalizarlas partiria o fusionaria estratos en silencio. El perfil
    observado se emite como RESULT de texto pre-declarado.
  ranura_no_preregistrada: >-
    Nadie pre-registro el metodo de IC para ENCUCI. Lo elige el ejecutor sobre
    ranura vacia, se declara y se eleva a mesa. Los ic95 [0.116323, 0.135544]
    de enmienda_encuci2020 NO se ponen lado a lado con estos (A-bis.3): su
    metodo no esta escrito en ningun artefacto reproducible. El control
    positivo es SOLO DEL PUNTO.
  tablas:
    sec_4_5: "ENCUCI_2020_SEC_4_5.dbf"
    sec_6_7_8: "ENCUCI_2020_SEC_6_7_8.dbf"
  miembros_zip_declarados:
  - "ENCUCI_2020_SD.dbf"
  - "ENCUCI_2020_SEC_4_5.dbf"
  - "ENCUCI_2020_SEC_6_7_8.dbf"
  - "ENCUCI_2020_SEC_9_10.dbf"
  - "ENCUCI_2020_VIV.dbf"
  codificacion:
    A_contacto_si: [1]
    A_incisos_contacto: [AP5_16_1, AP5_16_2, AP5_16_3, AP5_16_4, AP5_16_5, AP5_16_6, AP5_16_7, AP5_16_8, AP5_16_9, AP5_16_10]
    A_uno: [1]
    A_cero: [2]
    A_nsnr: [9]
    A_dominio_declarado: [1, 2, 9]
    B_uno: [1]
    B_cero: [2]
    B_nsnr: [9]
    B_agravio_si: [1]
    B_agravio_no: [2]
    B_dominio_urbano: [U, C]
    B_dominio_rural: [R]
    B_dominio_urbano_alt: [U]
    B_dominio_rural_alt: [R, C]
    B_dominio_declarado: [U, C, R]
  valores_gen1_referencia:
    RES-0005: 0.125822
    RES-0006: 0.874178
    RES-0061: 0.112192
    RES-0062: 0.091912
  n_gen1_referencia:
    U_A: 13435
    U_B: 20187
  criterio_adopcion_p3: >-
    CANTIDAD-MEDIDA (recibe cita corrida0_resultado_id + corrida0_generacion:
    GEN2 en milpa/tramite.yaml) si y solo si (1) su numerador es una categoria
    declarada del reactivo contada DIRECTAMENTE -- no 1 menos otra cosa -- y
    (2) round(medido, 6) == valor sellado. En otro caso
    NO-ADOPTABLE-POR-DISCREPANCIA / NO-ADOPTABLE-POR-GRANO /
    COMPLEMENTO-CON-DENOMINADOR-RECORTADO / NO-ADOPTABLE-NO-ESTIMABLE.
    RES-0006 falla la condicion (1) POR CONSTRUCCION: D1/NC-0108 ya lo declaro
    DERIVADO-NO-MEDIDO y esta spec lo obedece, no lo reabre -- se dice aqui,
    antes de medir, para que no parezca conclusion hallada a posteriori. El `p`
    del motor NO se mueve: la adopcion es CITA.
