  c2_funcion_de_referencia: "tests/test_celda_d_c2.py::piso_log_aditivo -- el medidor la IMPORTA"
  c2_punto_desde: "marginales sellados (parametros.marginales_sellados), citados y no recalculados"
  c2_ic_desde: "replicas compartidas de esos mismos marginales re-derivados por el modulo congelado, una variable por llamada"
  replica_sin_definir: "algun p_k en {0,1} -> replica descartada y contada; IC de las validas; 0 validas -> null; sin recorte ni sustitucion"
