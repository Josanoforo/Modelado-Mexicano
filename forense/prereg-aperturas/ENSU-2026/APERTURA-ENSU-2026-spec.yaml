universo: Persona seleccionada de 18+ de la tabla CB de ENSU 2026T1 (C01-C14) y 2026T2 (C15), FAC_SEL > 0, EST_DIS
  y UPM_DIS no vacíos (marco() del contendiente, era 2021T2+); universo de cada conducta en forense/analisis/seguridad-ensu/lista-cerrada-P1.md
  §3
filtros: Un eje a la vez (TOTAL, SEXO, EDAD, ENT, CIUDAD); nunca cruces (guardia E.6); de 2026T2 sólo se agrega
  C15-CORRUPCION-POLICIA
ponderador: FAC_SEL
transformacion: Recodificación del contendiente (CONDUCTAS/FILTRO del medidor sellado, lista-cerrada-P1 §3); columna
  ausente en el catálogo 2026 -> NO-ESTIMABLE (R None), sin recodificación ad hoc
estimando: R = Σw·y/Σw por conducta×eje×categoría en ENSU 2026 (trimestre siguiente de su cadencia); cobertura de
  R en el IC calibrado de persistencia del piso 2025T4 (regla sellada de CALC-ENSU-SERIE-0001 §6)
seed:
  aplica: false
  razon: R es un punto; la cobertura usa el IC ya sellado del contendiente
parametros:
  nominal: 0.95
  z: 1.959964
  regla: cobertura R en [lo, hi] del contendiente; Wilson 95%; NO-ESTIMABLE > SUBCUBRE > SOBRECUBRE > CALIBRADO
  columna_ausente_en_catalogo: NO-ESTIMABLE (sin recodificación ad hoc)
tolerancia:
  tipo: flotante
  abs: 1.0e-10
  razon: 'determinista: sumas float64 sin remuestreo'
