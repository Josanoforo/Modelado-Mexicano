  completo para las 5 reglas de ese lote), n_boot=10000, seed=42.
  recibe_dinero_familiares_para_vejez = p ponderado del desenlace=1 sobre
  n=11895. no_recibe_dinero_familiares_para_vejez = complemento CONTADO.

