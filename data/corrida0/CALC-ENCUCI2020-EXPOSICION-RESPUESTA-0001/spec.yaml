  - {archivo: ENCUCI_2020_SEC_4_5.dbf, variable: AP5_18, rol: entrega de dádiva; 1=Sí 2=No 9=NS/NR blanco=salto}
  - {archivo: ENCUCI_2020_SEC_4_5.dbf, variable: FAC_SEL, rol: ponderador de persona seleccionada}
  - {archivo: ENCUCI_2020_SEC_4_5.dbf, variable: EST_DIS, rol: estrato de diseño opaco como texto}
  - {archivo: ENCUCI_2020_SEC_4_5.dbf, variable: UPM_DIS, rol: UPM de diseño opaca como texto}
  - {archivo: ENCUCI_2020_SEC_4_5.dbf, variable: DOMINIO, rol: categoría nativa U/C/R}

universo: >-
  ENCUCI 2020, persona seleccionada de 15 años o más, una ola. Marco de
  estimación: todas las filas de SEC_4_5 con FAC_SEL finito y positivo.
  Exposición por inciso usa respuesta 1/2; cualquiera usa la lógica trivaluada
  congelada; conteo requiere diez respuestas 1/2; respuesta conjunta requiere
  contacto acreditado y AP5_17/AP5_18 ambos 1/2.
filtros: >-
  Ningún 9, blanco o código ajeno se convierte en No. Conteo exacto excluye
  cualquier vector incompleto. Los dominios de respuesta añaden sólo el filtro
  declarado de conteo o DOMINIO; no se cruzan. Denominador nulo queda null.
ponderador: FAC_SEL sin normalizar; unidad persona seleccionada.
transformacion: >-
  Contacto cualquiera: algún 1 => Sí; diez 2 => No; resto desconocido. Conteo:
  suma de 1 con diez códigos válidos. Conjunta AP5_17/AP5_18: ninguna 2/2,
  sólo solicitud 1/2, sólo entrega 2/1, ambas 1/1.
estimando: >-
  Proporciones descriptivas de exposición, conteo 0/1/2/3+, distribución
  conjunta y condicionales para total, conteos 1/2/3+ y DOMINIO U/C/R;
  contrastes asociativos 2-1 y 3+-1, nunca causales ni por trámite.
dependencias_materiales: [numpy]

parametros:
  bootstrap_replicas: 2000
  metodo_ic: bootstrap de UPM_DIS con reemplazo dentro de EST_DIS sobre marco completo; percentiles 2.5/97.5
  singleton: autorremuestreo; aporta varianza cero y se rotula
