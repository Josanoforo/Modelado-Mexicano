variables: []
universo: "las 648 capturas de forense/prereg-duelo-v2/corridas-L/*.json"
filtros: "el subuniverso que el marcador consume es el que NO trae estado_captura (424 de 648)"
ponderador: NO-APLICA
transformacion: >-
  censo y conteo por familia de esquema (solo params / solo modelo_real / ambas),
  por valor de params.modelo_id, params.fecha_congelacion y variante, sobre el
  subuniverso de 424; mas el censo de modelo_real (presente/no-nulo) sobre las 648.
estimando: >-
  ninguno: metadato de alcance del corpus de capturas que RESULT-C0D-ALCANCE-CORPUS-CAPTURA
  (CALC-C0D-MARCADOR, sellado, no se toca) muestreo de una sola captura -- NC-0078.
dependencias_materiales: []

parametros:
  discriminador_consumo_marcador: "ausencia de la llave estado_captura"
  fuente_acto: "ACTO GEN2-MANTENIMIENTO-3 \u00b7 NC-0078/NC-0242, deriva lo que forense/notas/2026-09-15-GEN2-MARCADOR-C0-D-A8-hueco.md \u00a74 ya midio en prosa"

seed:
  aplica: false

tolerancia:
  tipo: entero
  razon: >-
    Todos los RESULT numericos son conteos sobre un universo fijo (los 648 archivos
    presentes en el arbol) y se comparan EXACTO.

resultados:
