  archivo_de_ponderador: "conjunto_de_datos_tmod_vic_envipe2025.csv -- declarado como PARAMETRO y no como detalle: FAC_DEL_AM vive en el MISMO archivo y EST_DIS/UPM_DIS tienen homonimos cercanos (ESTRATO, UPM). Todo se resuelve por nombre LITERAL (A.15(c))."
