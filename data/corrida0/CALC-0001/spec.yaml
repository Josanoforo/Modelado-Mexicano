# CALC-0001 -- cara mecanica de spec.md (ACTO GEN2-E5-0 · SPECS EJECUTABLES).
# El texto que gobierna es spec.md, y sobre el la spec SELLADA
# forense/prereg-caja/S12-CSES-spec-v1_0.md. Este YAML no decide nada que
# aquellos no digan: solo llena las ranuras que S12 dejo "pendiente de
# codebook", con el codebook citado en spec.md.
# CONGELADO en el COMMIT-1 de GEN2-E5-0. No se ejecuta aqui: lo corre GEN2-E5.
calc_id: CALC-0001
spec_md: spec.md
spec_md_sha256: 69e66e163f7ce776995b761c92ef0b1f464bc464ed8415e8dadfb0db61d120de

script: data/corrida0/CALC-0001/medidor.py

etiquetas:
  generacion: GEN2
  tipo: FALSADOR-S12-CSES2015
  cuenta_gen2: PENDIENTE-DE-MESA
  validacion_independiente: NO-HECHA
  spec_sellada: forense/prereg-caja/S12-CSES-spec-v1_0.md
  spec_sellada_sha256: 870522a34d9538454b5b774ddc33e46f9cd8e8d62a20f31b2d972f9755447336
  reglas_bajo_prueba: "R7.3 · R7.6 (ninguna se mueve por este CALC)"
  medidor_ejecutado_en_e5_0: "NO -- escrito y congelado, nunca corrido (E5-0 no abre microdato)"

inputs:
  - id: cide_cses2015_nacional_poselectoral
    origen: manifiesto
  - id: cide_cses2015_nacional_preelectoral
    origen: manifiesto
  - id: cide_cses2015_estatal_preelectoral
    origen: manifiesto
  - id: IN-S12-SPEC-SELLADA
    origen: repo
    ruta: forense/prereg-caja/S12-CSES-spec-v1_0.md
    sha256: 870522a34d9538454b5b774ddc33e46f9cd8e8d62a20f31b2d972f9755447336

# ── Dimensiones sustantivas, todas DECLARADAS (P2) ────────────────────────
# Codigos verbatim del codebook (metadataonly), nunca adivinados. spec.md §1.
variables:
  - {id: pcyc13,   archivo: cide_cses2015_nacional_poselectoral, rol: "disparador zanahoria (OFERTA)", codigos: "1=Si · 2=No · 9=Ns/NC", dicotomiza: "1->1 · 2->0 · 9 y faltante fuera y contados"}
  - {id: pcyc14,   archivo: cide_cses2015_nacional_poselectoral, rol: "disparador garrote (AMENAZA)",  codigos: "1=Si · 2=No · 9=Ns/NC", dicotomiza: "1->1 · 2->0 · 9 y faltante fuera y contados"}
  - {id: pcyc13_1, archivo: cide_cses2015_nacional_poselectoral, rol: "partido oferente", codigos: "1=PAN 2=PRI 3=PRD 4=PT 5=PVEM 6=MC 7=NA 8=MORENA 9=PH 10=PES 12=Otro 97=Ninguno 99=NS/NC"}
  - {id: pcyc14_1, archivo: cide_cses2015_nacional_poselectoral, rol: "partido amenazante", codigos: "identicos a pcyc13_1"}
  - {id: peledip,  archivo: cide_cses2015_nacional_poselectoral, rol: "DESENLACE -- voto emitido, diputados federales 7-jun-2015", codigos: "1=PAN 2=PRI 4=PRD 8=PT 9=PVEM 10=OTRO 11=NINGUNO 12=NO SABE 13=BLANCO 14=ANULADO 19=MC 29=PRI-PVEM 34=NA 35=MORENA 36=PH 37=PES 39=INDEP"}
  - {id: pelegob,  archivo: cide_cses2015_nacional_preelectoral, rol: "DESENLACE de la fila replica -- voto emitido, OTRO CARGO (gobernador/pdte mun)", codigos: "identicos a peledip mas 38=OTRO PARTIDO"}
  - {id: pvoto1,   archivo: cide_cses2015_estatal_preelectoral, rol: "encuadre garantia institucional", codigos: "1=Si · 2=No · 9=Ns/Nc"}
  - {id: pvoto2,   archivo: cide_cses2015_estatal_preelectoral, rol: "encuadre violacion reportada",   codigos: "1=Si · 2=No · 9=Ns/Nc"}
  - {id: pvoto3,   archivo: cide_cses2015_estatal_preelectoral, rol: "encuadre neutral (referencia)",  codigos: "1=Si · 2=No · 9=Ns/Nc"}
  - {id: PONDFIN,  archivo: "los tres", rol: "ponderador global", etiqueta: "Ponderador nacional / Ponderador Global"}
  - {id: dominio,  archivo: "los tres", rol: "estrato", etiqueta: "Estratos de diseno muestral"}
  - {id: upmmn,    archivo: "los tres", rol: "UPM", etiqueta: "(sin etiqueta; nombre estable de la casa encuestadora)"}

universo: >-
  Adultos encuestados en cada levantamiento CSES 2015, POR SEPARADO y nunca
  agrupados (S12 §0.2: sha256 distintos, muestras distintas). Fila principal =
  cide_cses2015_nacional_poselectoral (1200 filas). Fila replica del DISPARADOR
  (no del desenlace) = cide_cses2015_nacional_preelectoral (2400). §2-bis =
  cide_cses2015_estatal_preelectoral (2400).

filtros: >-
  §1: pcyc13/pcyc14 en {1,2} (9=Ns/NC fuera del contraste y CONTADO en
  RESULT-...-N-NSNC) y partido oferente resoluble por el crosswalk (97 Ninguno y
  99 NS/NC son faltante del brazo, no cero). pcyc14 lo gatea el propio
  cuestionario a receptores de programa (bateria pcyc12/pcyc12a/pcyc12b): el
  denominador REALIZADO es dato de corrida, no supuesto de esta spec.
  §2-bis: pvoto* en {1,2}.

ponderador: >-
  PONDFIN en los tres archivos (etiquetado "Ponderador nacional" en
  poselectoral, "Ponderador Global" en los otros dos). NO se usan PONDOM,
  PONDDOM, PONDOM1, PONDOM2, PONDDOM1, PONDDOM2 (son por dominio, no globales)
  ni PONDSEX ni ponde (sin etiqueta: un nombre no es una etiqueta).

transformacion: >-
  OFERTA/AMENAZA = dicotomizacion 1->1, 2->0 de pcyc13/pcyc14.
  ALINEADO = 1 si el partido votado corresponde al partido oferente POR EL
  CROSSWALK CONGELADO en parametros.crosswalk_partido -- nunca por igualdad
  directa de codigo: los dos esquemas coinciden en 3,4,8,9,10,12 con partidos
  DISTINTOS (spec.md §2.1). CREE_QUE_DESCUBREN = dicotomizacion 1->1, 2->0 de
  pvoto*.

estimando: >-
  §1: Delta = P(ALINEADO=1 | T=1) - P(ALINEADO=1 | T=0), ponderado por PONDFIN,
  con IC95; una fila por (levantamiento x brazo), jamas sumadas ni promediadas.
  §2-bis: diferencia de proporcion de CREE_QUE_DESCUBREN entre cada encuadre y
  el neutral (pvoto3), solo si la guardia de diseno da SPLIT-BALLOT.

dependencias_materiales: [pyreadstat, numpy]

parametros:
  fuente_acto: "ACTO GEN2-E5-0 · SPECS EJECUTABLES · CALC-0001"
  ponderador: PONDFIN
  estrato: dominio
  upm: upmmn
  n_minimo_celda: 10          # cota de S12 §4: numerador <10 => NO-ESTIMABLE
  bootstrap_replicas: 2000
  archivo_encuadre: cide_cses2015_estatal_preelectoral
  variables_encuadre: [pvoto1, pvoto2, pvoto3]
  # Guardia de S12 §2-bis: split-ballot => ~1/3 de cobertura disjunta por
  # variable. Fuera de la banda, el contraste NO corre.
  cobertura_split_min: 0.20
  cobertura_split_max: 0.50
  brazos_principales:
    - [POSEL, cide_cses2015_nacional_poselectoral, peledip]
    - [PREEL, cide_cses2015_nacional_preelectoral, pelegob]
  pares_disparador:
    - [OFERTA,  pcyc13, pcyc13_1]
    - [AMENAZA, pcyc14, pcyc14_1]
  # Crosswalk oferente -> voto, congelado antes del dato (spec.md §2.1).
  crosswalk_partido: {1: 1, 2: 2, 3: 4, 4: 8, 5: 9, 6: 19, 7: 34, 8: 35, 9: 36, 10: 37, 12: 10}
  # Coalicion: un voto PRI-PVEM cuenta como alineado si el oferente fue PRI o PVEM.
  coaliciones: {29: [2, 9]}
  metodo_ic: "bootstrap de UPM (upmmn) dentro de estrato (dominio), percentil 2.5/97.5"
  ranura_no_preregistrada_por_S12: >-
    S12 §4 exige "IC95 de la diferencia" y NO pre-registra el metodo. El
    bootstrap de arriba es eleccion del ejecutor sobre una ranura vacia,
    declarada aqui y elevada a mesa -- no es una lectura de la spec sellada.

seed:
  aplica: true
  valor: 20260908
  rng: numpy.PCG64

tolerancia:
  tipo: flotante
  abs: 1.0e-10
  razon: >-
    El bootstrap es estocastico pero queda fijado por seed+rng declarados, de
    modo que dos corridas del mismo arbol coinciden salvo redondeo de float64
    al reasociar sumas ponderadas. 1e-10 deja pasar ese ruido y atrapa
    cualquier cambio real. Los enteros se comparan EXACTO.

