<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="1120" viewBox="0 0 1280 1120" role="img" aria-labelledby="title desc">
  <title id="title">Canal del último producto entre personas con tenencia fintech, ENIF 2021 y 2024</title>
  <desc id="desc">Dos diagramas de puntos para cuenta y crédito. Los puntos 2021 incluyen intervalos de confianza de 95 por ciento. Los triángulos 2024 son cifras ya publicadas sin intervalo. Cuenta tiene ruptura y crédito es comparable con deriva de ejemplos. ENIF 2018 no es estimable.</desc>
  <rect width="1280" height="1120" fill="#fbfaf7"/>
  <style>
    text { font-family: Inter, Arial, sans-serif; fill: #19242e; }
    .title { font-size: 25px; font-weight: 700; }
    .sub { font-size: 15px; fill: #4d5b66; }
    .panel { font-size: 20px; font-weight: 700; }
    .label { font-size: 14px; }
    .small { font-size: 12px; fill: #52616d; }
    .grid { stroke: #d9dddf; stroke-width: 1; }
    .ci { stroke: #176b87; stroke-width: 3; }
    .cap { stroke: #176b87; stroke-width: 2; }
    .p21 { fill: #176b87; }
    .p24 { fill: #d2633d; }
  </style>
  <text x="50" y="42" class="title">Canal del último producto entre personas con tenencia fintech</text>
  <text x="50" y="67" class="sub">ENIF · porcentaje ponderado · 2021 estimado con diseño; 2024 antecedente publicado</text>
  <rect x="50" y="84" width="1180" height="42" rx="7" fill="#ece8df"/>
  <text x="70" y="110" class="label"><tspan font-weight="700">2018: NO-ESTIMABLE.</tspan> El instrumento no identifica la categoría fintech ni el canal del último producto; no es un cero.</text>

  <circle cx="810" cy="105" r="6" class="p21"/><text x="822" y="110" class="small">2021 (IC95)</text>
  <path d="M930 112 l7 -14 l7 14 z" class="p24"/><text x="950" y="110" class="small">2024 publicado (sin IC)</text>

  <text x="50" y="160" class="panel">Cuenta — comparación lateral con ruptura; no calcular delta</text>
  <text x="50" y="181" class="small">2021: n=337, masa=2,257,763 · 2024: n=1,407, masa=8,919,712</text>
