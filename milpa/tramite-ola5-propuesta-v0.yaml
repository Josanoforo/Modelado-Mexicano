      dato: la situación "le ofrecen servicio de gobierno digital" y los
      disparadores "sin coerción / sin riesgo fiscal" se cumplen por
      CONSTRUCCIÓN DEL UNIVERSO -- se restringe a N_TRA=01 (pago ordinario
      del servicio de luz), único tipo del catálogo con canal digital de
      cobertura nacional (CFE), uso opcional y sin autoridad fiscal de por
