  casos: 1
  bloquea: []
  evidencia: "revision-publicacion-2026-07-30.md §8 (opción 1) y gobernanza-v1_12.md ADR-44(c): T14/T15/T16/T17 vigilan estado y gobernanza, ninguno vigila README — el defecto real de README:40 que esta sesión corrigió a mano (2 de 27, no 1 de 27) es el primer caso conocido de una cifra de portada que se corrigió sin que ningún test lo hubiera atrapado antes de publicarse. Molde: T16 (mismo mecanismo de _CAMBIO_FECHADO + comparación contra la corrida real), con prueba negativa de dos lados: (a) una cifra vigente que no cuadra debe fallar, (b) una cifra fechada/histórica marcada correctamente NO debe fallar aunque difiera de la corrida real"
  estado: abierto
