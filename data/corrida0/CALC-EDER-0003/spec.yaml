  - {id: RESULT-EDER-UNION-A-N-DIRECTO-SIN-PONDERAR, tipo: entero, unidad: "personas con primer codigo en DIRECTO (censo L7: 9643)"}
  - {id: RESULT-EDER-UNION-A-N-SIN-CLASIFICAR, tipo: entero, unidad: "personas cuyo primer codigo esta fuera de LIBRE y de DIRECTO, codigo 37 incluido (censo L7: 2)"}
  - {id: RESULT-EDER-UNION-A-CONTEOS-COINCIDEN-L7, tipo: texto, unidad: "COINCIDE / DIFIERE:<detalle> -- los tres conteos sin ponderar contra el censo de ACTO MAESTRA35-L7"}
