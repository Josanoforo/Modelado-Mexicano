variables:
  - {archivo: conjunto_de_datos_tmod_vic_envipe2025.csv, variable: BP1_20, rol: universo-y-desenlace-2025}
  - {archivo: conjunto_de_datos_tmod_vic_envipe2025.csv, variable: BP1_23, rol: desenlace-2025}
  - {archivo: conjunto_de_datos_tmod_vic_envipe2025.csv, variable: FAC_DEL, rol: ponderador-2025}
  - {archivo: conjunto_de_datos_tmod_vic_envipe2025.csv, variable: EST_DIS, rol: estrato-diseno-2025}
  - {archivo: conjunto_de_datos_tmod_vic_envipe2025.csv, variable: UPM_DIS, rol: upm-diseno-2025}
  - {archivo: conjunto_de_datos_tmod_vic_envipe2025.csv, variable: ID_PER, rol: llave-delito-persona-2025}
  - {archivo: conjunto_de_datos_tmod_vic_envipe2025.csv, variable: DOMINIO, rol: eje-dominio-2025}
  - {archivo: conjunto_de_datos_tsdem_envipe2025.csv, variable: ID_PER, rol: llave-persona-2025}
  - {archivo: conjunto_de_datos_tsdem_envipe2025.csv, variable: NIV, rol: eje-escolaridad-proxy-2025}

universo: >-
  DELITOS de tmod_vic ENVIPE 2025 con BP1_20 in {1,2} (n = 40 280, el del
  arbitro sellado), cruzados por escolaridad_proxy x dominio_urbano_rural
  sobre los delitos clasificables en ambos ejes. Es la ola RESERVADA: se abre
  aqui, en COMMIT-3, con las emisiones ya selladas.
filtros: >-
  Los de la spec humana §3.1, identicos a los de las emisiones: BP1_20 in
  {1,2}; FAC_DEL numerico > 0 (PARA); EST_DIS/UPM_DIS no vacios (PARA);
  ID_PER unica en tsdem (PARA); delitos sin persona se cuentan y quedan
  (fuera). Sin filtro de edad, sexo ni tipo de delito.
ponderador: "FAC_DEL. Toda proporcion es razon de totales ponderados sum(w*y)/sum(w)."
transformacion: >-
  evade_norma := (BP1_20 == "2") AND (BP1_23 in {04,05,06,08}). Ejes como en
  las emisiones (ESC_2DIG del arbitro; DOMINIO U/C/R). R(s,d) := p_2025(s,d)
  con punto e IC95 de wprop_ic_conglomerado. EE(R) := (IC95sup - IC95inf)/3.92.
  d_k := 100*|p_k - R| en pp para k in {C1,C2,C6,C7}, leidos del sello de las
  emisiones. Por celda PUNTUADA y por challenger contra cada piso:
  INDECIDIBLE si ambos caen dentro del IC95 de R o si |d_chal - d_piso| <
  0.5*EE(R)*100; si no, GANA-CHALLENGER si d_chal < d_piso, GANA-PISO en
  otro caso. Celda-D en el orden de la spec §5.5.
estimando: >-
  R = p(evade_norma | escolaridad_proxy, dominio_urbano_rural) en las 12
  celdas de ENVIPE 2025 (arbitro), y la adjudicacion de C6/C7 contra C1/C2
  celda por celda y de celda-D. Emite ademas el signo de la modulacion de
  cada candidato respecto del nacional 0.562774 y el diagnostico C5. NO adopta.
precision: >-
  IC95 de R por bootstrap de conglomerado estratificado por celda
  (wprop_ic_conglomerado, 10 000 replicas, seed 42) -- la receta del arbitro
  sellado, reproducida a 5e-7 en COMMIT-2. Skill y MAE se reportan sin
  intervalo: no adjudican.

dependencias_materiales: [numpy, pandas]
seed:
  aplica: true
  valor: 42
  rng: numpy.random.default_rng (wprop_ic_conglomerado, receta del arbitro)
tolerancia:
  tipo: bootstrap
  exacto_por_seed: true
  abs: 1.0e-10
  razon: >-
    seed 42 + default_rng + orden de consumo de wprop_ic_conglomerado sobre
    las filas de cada celda en orden de archivo. Enteros EXACTO; flotantes
    abs = 1e-10.

parametros:
  emisiones_corrida_id: CALC-TRA-EVADE-NORMA-SXD-EMISIONES-0001--2ff028319eed
  celdas: [S1xD1, S1xD2, S1xD3, S2xD1, S2xD2, S2xD3, S3xD1, S3xD2, S3xD3, S4xD1, S4xD2, S4xD3]
  rotulos_escolaridad: {S1: "hasta primaria", S2: "secundaria", S3: "media superior", S4: "superior"}
  rotulos_dominio: {D1: "Rural", D2: "Complemento urbano", D3: "Urbano"}
  codigos_bp1_23_numerador: ["04", "05", "06", "08"]
  universo_bp1_20: ["1", "2"]
  bootstrap_replicas: 10000
  umbral_soporte_n: 200
  pisos: [C1, C2]
  challengers: [C6, C7]
  criterio_indecidible_verbatim: "si ambos caen dentro del IC de R o si |d_L-d_M| < 0.5*EE(R)"
  criterio_indecidible_fuente: "forense/CAREO-ADV-DUELO-diseno-v2-2026-08-19.md:38"
  ee_r_formula: "(IC95sup - IC95inf)/3.92"
  escala_d: "puntos porcentuales: d = 100*|p - R|; el umbral 0.5*EE(R) se lleva a la misma escala (x100)"
  umbral_celdas_gana: 9
  umbral_celdas_puntuadas: 9
  umbral_fuera_de_soporte: 4
  orden_de_parada: "FUERA-DE-SOPORTE (>= 4 celdas sin soporte en alguna ola) -> INDECIDIBLE (PUNTUADA < 9 o todas INDECIDIBLES) -> ADJUDICADA (algun challenger vence a los dos pisos en >= 9 PUNTUADA) -> SIN-CANDIDATO-SUPERIOR"
  precedencia: "entre INDECIDIBLE y ADJUDICADA manda INDECIDIBLE; si los dos challengers cumplen, AMBOS-DECIDE-MESA"
  paradas_admisibles: [ADJUDICADA, INDECIDIBLE, SIN-CANDIDATO-SUPERIOR, FUERA-DE-SOPORTE]
  b_bis_c1: "persistencia anual corroborada en TRA (nadie vence a C1 en >= 9 celdas)"
  b_bis_c2: "'marginales actuales sin interaccion' es el estimador honesto de celda para esta familia; la interaccion de olas previas no aporta BAJO ESTOS CANDIDATOS -- resultado de programa, cambia el marcador. Solo eso dice (H5): no identifica ausencia de interaccion ni una propiedad de la poblacion"
  b_bis_c6_c7: "primer estimador por celda que explota interaccion"
  b_bis_c7_no_c6: "una ola sola trae ruido"
  limite_de_la_evaluacion: "si el ganador se ELIGE con las 12 celdas, esa misma evaluacion no lo valida de forma independiente (H5). Seleccion mas desempeno conjunto, nunca desempeno independiente."
  signo_modulacion: "respecto del nacional 0.562774: ESTABLE si todo el IC95 del candidato queda del mismo lado que R; AMBIGUA si lo cruza; CONTRARIA si queda del lado opuesto"
  p_nacional_c5: 0.562774
  p_nacional_c5_fuente: "milpa/tramite.yaml:497 -- clase MEDIDO, copia del arbitro (enmienda_envipe2025, firma b1)"
  c5_rol: "COMPLEMENTO / diagnostico puro; fuera de la competencia porque el emisor es el arbitro con otro nombre"
  champion: NINGUNO
  adopcion: NINGUNA

