- id: I-16
  titulo: "gobernanza:16 afirma en presente 'modelo v2 y glosario v5 consolidados' -- falso, el motor va en modelo v3.4 y glosario v5.6; congelado desde v1.1 sin que ninguna subida de versión lo tocara"
  clase: instrumento
  abierto: 2026-07-30
  casos: 1
  bloquea: []
  evidencia: "canon/gobernanza-v1_15.md:16, campo '**Estado del programa:**' de la cabecera: \"Ronda 4 cerrada y auditada; modelo v2 y glosario v5 consolidados; Fase 1 del simulador pospuesta.\" `git log -p --follow` sobre la serie `gobernanza-v1_*.md` muestra este texto verbatim, sin cambio, desde `gobernanza-v1_1` (línea añadida cuando `modelo` y `glosario` efectivamente estaban en v2/v5). Verificado contra el registro de artefactos vigente de este mismo documento (§2): `modelo-decision-v3_4.md` (modelo en **v3.4**, no v2) y `glosario-v5_6.md` (glosario en **v5.6** -- 'v5' es cierto como familia mayor pero la frase no distingue mayor de minor y el resto del documento sí cita minor exacto en todas partes). Barrido del resto de `canon/*.md`, `milpa/*.md` y `forense/*.md` buscando frases de estado equivalentes sin fecha (Ronda N cerrada/pospuesta/consolidado/completo): TODAS las demás menciones de 'Ronda 3/4', 'modelo v2', 'glosario v5' encontradas están fechadas o narran un evento pasado en pretérito ('el forense V2 lo declaró...', 'archivado desde la Ronda 4', 'ADR-XX incorporado') -- son citas de historia, correctas cuando se escribieron, no afirmaciones de estado vigente. `canon/estado-programa-v1_9.md:91` ('Fase 1 POSPUESTA por decisión') es la única otra frase de estado sin fecha explícita encontrada en el barrido y SIGUE SIENDO CIERTA -- Fase 1 del simulador continúa pospuesta, verificado contra `estado §HITO F` ('MILPA Fase 1 — POSPUESTO por decisión'). No se encontró ninguna otra frase de estado, sin fecha, que hoy sea falsa, aparte de la de gobernanza:16."
  consecuencia: "DISTINTO de I-12, deliberadamente. I-12 es SINTÁCTICO: un campo autodeclarado (número de versión) contra otro campo autodeclarado (nombre de archivo) -- comparación mecánica, T19 (propuesto en I-12) lo atrapa sin leer significado. Esto es SEMÁNTICO: una frase en prosa que describe dónde está el programa, correcta cuando se escribió (v1.1, cuando modelo y glosario SÍ iban en v2/v5) y falsa hoy porque el programa avanzó sin que nadie volviera a esa línea -- ningún test mecánico comparando dos campos puede saber que 'modelo v2' debía volverse 'modelo v3.4', porque no hay un segundo campo estructurado con el que compararlo; la única fuente de verdad es la tabla de §2 del propio documento, y comparar prosa libre contra una tabla exige entender qué dice la prosa, no solo extraer un número. T19 NO atraparía esto. Es la pregunta 8 del módulo de auditoría de rigor extremo (`hitoD-preregistro-v2_0.md`, '¿Dónde hay evidencia débil e intuición fuerte?' / '¿qué sería peligroso mal usado?') aplicada al propio documento que audita al resto del programa: una afirmación de estado sobreviviendo congelada en la cabecera del canónico de gobernanza, precisamente donde menos debería pasar desapercibida."
  estado: abierto
  nota_estado: "Abierta, sin resolver, por instrucción explícita del autor: NO se reescribe la frase -- decidir qué debe decir 'Estado del programa' hoy es decisión de contenido, no corrección mecánica, y queda para mesa. Candidato a instrumento (no test mecánico, por la razón de 'consecuencia' arriba): una checklist de sesión o una revisión periódica de toda frase de estado sin fecha en cabeceras canónicas, con la misma disciplina que ya se aplica a los ADR y las versiones -- pero eso es sección aparte, no T19."

- id: I-17
  titulo: "bitácora.py --cierra declara 'Antes' desde tests/baseline.json (cifras congeladas), no desde la corrida real ni desde lo declarado en `estado` -- tres fuentes, tres cifras, ninguna dice cuál mide qué"
  clase: instrumento
  abierto: 2026-07-30
  casos: 1
  bloquea: []
  evidencia: "Sesión de registro de I-01 caso 3 (2026-07-30): `tests/bitacora.py --cierra` imprimió 'Antes: 21 FAIL · 84 WARN (congelados en origin/main)' leyendo `tests/baseline.json` vía `git show origin/main:tests/baseline.json` (tests/bitacora.py:198-206), mientras la corrida real sobre el mismo HEAD (`python3 tests/check.py`) da 19 FAIL · 87 WARN y `canon/estado-programa-v1_9.md:212` declara vigente '19 FAIL · 87 WARN'. Tres números para el mismo momento del árbol -- baseline.json no se ha refrozen desde `a0ae0ad` (refreeze post-PR #1), varias sesiones y PRs después (#9, #10, #11, #12, #13); check.py --baseline sigue en VERDE porque la comparación es por clave, no por cifra total, así que el desfase entre el conteo congelado y el real no bloquea nada ni se declara en ningún lado. Misma familia que README:40 (I-06/I-07, cola.yaml): una cifra de estado que puede quedar desfasada de su fuente real sin que ningún test la vigile, porque el consumidor (aquí, el propio reporte de cierre de sesión) no declara de qué fuente sale cada número que imprime."
  estado: abierto
  nota_estado: "Registrada sin resolver, por instrucción del autor -- no se toca tests/bitacora.py en esta sesión. Candidato: que el bloque 'Delta de suite' rotule cada cifra con su fuente ('Antes (congelado en baseline.json, HEAD {hash}):' / 'Después (corrida real, HEAD actual):'), y que --cierra advierta explícitamente si baseline.json no fue refrozen desde el HEAD que compara -- hoy el reporte no distingue 'nadie ha vuelto a congelar' de 'nada cambió'."

- id: I-18
  titulo: "La clave de tests/baseline.json (mensaje sin número de línea) deduplica ocurrencias del mismo defecto congelado en líneas distintas -- 3 WARN nuevos del mismo patrón ya conocido quedaron invisibles a --baseline (VERDE), primera vez que se manifiesta con cifras"
  clase: instrumento
  abierto: 2026-07-30
  casos: 1
  bloquea: []
  evidencia: "Verificado 2026-07-30 contra la corrida real (HEAD 78d5d54, el mismo que --baseline declara VERDE): `check.py` imprime 87 WARN crudos, pero `_baseline_key()` (tests/check.py:763-764, quita el primer ':NNN ' del mensaje) reduce esos 87 a 84 claves únicas -- exactamente las 84 que trae congeladas `tests/baseline.json`. La diferencia de 3 es aritmética, no misteriosa: dos claves ya congeladas tienen ahora multiplicidad >1 en la corrida real -- ('T03', 'revision-publicacion-2026-07-30.md: cita `LICENSE-CORPUS.md`, que no existe') aparece 3 veces (líneas 392/452/455, antes probablemente 1) y ('T03', 'forense/censo-integridad-v1_1.md: cita `estado-programa-v1_8.md`, que no existe') aparece 2 veces (líneas 49/85) -- ambas claves ya presentes en `tests/baseline.json` bajo los buckets I-01/patrón-D-05 y 'historia real no cubierta por HISTORICOS' respectivamente (confirmado por lectura directa del archivo, ninguna es clave nueva). Verificado explícitamente que las 3 no son defectos nuevos antes de registrar esta entrada -- si lo hubieran sido, --baseline debería haber salido ROJO y no salió. El mecanismo: la clave de deduplicación (test, mensaje-sin-línea) existe para que un WARN nuevo en un archivo ya conocido no se pierda entre ruido (comentario en tests/check.py:750-762), pero el mismo diseño hace invisible la MULTIPLICACIÓN de un defecto ya congelado -- 1 cita de un archivo descartado que se vuelve 3 citas del mismo archivo descartado sigue comparando VERDE, porque set() colapsa las repeticiones a la misma clave en ambos lados de la comparación."
  estado: abierto
  nota_estado: "Registrada sin resolver, por instrucción del autor. Documentar la limitación (este mismo registro) no la mitiga -- sigue siendo cierto que --baseline no distingue '1 ocurrencia congelada' de 'N ocurrencias del mismo patrón'. Candidato: que --freeze/--baseline guarden y comparen también la cuenta por clave (Counter), no solo el conjunto de claves, y que ROJO se dispare tanto por clave nueva como por multiplicidad creciente de una clave ya conocida -- decisión de diseño para I-01/A1 y para esta entrada juntas, dado que ambas tocan _baseline_key()."
