  cuenta_gen2: PENDIENTE-DE-MESA
  validacion_independiente: PENDIENTE-DE-EJECUCION
  estado_adopcion: NO-ADOPTADO
  uso_motor: NINGUNO
  version_spec: "v1.0 serie (ACTO GEN2-ENIGH2024-SERIE-Y-COMMIT-1, P1); generalizacion parametrizada por ola de CALC-ENIGH2022-PERFIL-ESTRUCTURAL-0003 v1.2 -- oro=reproduccion byte-exacta de las 3 tablas de 2022, verificada en tests/test_enigh_serie_oro.py"
  contaminacion_declarada: "Se conocia la serie remesas>0 sellada 2016-2022 (CALC-B-0001) y los 3 RESULT sellados 2022 de PERFIL-ESTRUCTURAL/INTENSIDAD-REMESAS/REMESAS-CONTEXTO; no se conocia ningun marginal ni conjunta de personas de ENIGH 2020 al congelar."

inputs:
  - {id: enigh2020_nc_csv, origen: manifiesto}
