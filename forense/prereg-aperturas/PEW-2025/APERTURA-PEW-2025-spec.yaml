universo: Personas entrevistadas en México en Pew GAS Spring 2025 (código de `country` cuya etiqueta de valor es
  «Mexico»), weight finito > 0; edad 18-97 (RELIGION2024, MIGRACION) o >= 18 (PISOS), la regla de cada contendiente;
  IRIA-SIN-AUTORIZACION sólo entre quienes responden 1 a IRIA-A-VIVIR-A-EEUU
filtros: Un eje a la vez (TOTAL, SEXO, EDAD, ESCOLARIDAD donde el contendiente lo publica); nunca cruces (guardia
  E.6)
ponderador: weight
transformacion: Recodificación bin de cada contendiente con los códigos de la ola de su piso (spec §1); columna
  ausente en 2025 -> NO-ESTIMABLE (sin recodificación ad hoc)
estimando: R = Σw·y/Σw por contendiente×conducta×eje×categoría en Pew 2025 México; cobertura de R en el intervalo
  sellado del piso del contendiente (ICC si finito, si no IC de diseño)
seed:
  aplica: false
  razon: R es un punto; la cobertura usa el IC ya sellado del contendiente
parametros:
  nominal: 0.95
  z: 1.959964
  regla: cobertura R en [lo, hi] del contendiente; Wilson 95%; NO-ESTIMABLE > SUBCUBRE > SOBRECUBRE > CALIBRADO
  columna_ausente_en_catalogo: NO-ESTIMABLE (sin recodificación ad hoc)
tolerancia:
  tipo: flotante
  abs: 1.0e-10
  razon: 'determinista: sumas float64 sin remuestreo'
