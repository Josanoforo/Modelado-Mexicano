universo: 'DELITOS de tmod_vic ENVIPE 2025 con BP1_20 in {1,2} (n = 40 280, el del arbitro sellado), cruzados por
  escolaridad_proxy x dominio_urbano_rural sobre los delitos clasificables en ambos ejes. Es la ola RESERVADA: se
  abre aqui, en COMMIT-3, con las emisiones ya selladas.'
filtros: 'Los de la spec humana §3.1, identicos a los de las emisiones: BP1_20 in {1,2}; FAC_DEL numerico > 0 (PARA);
  EST_DIS/UPM_DIS no vacios (PARA); ID_PER unica en tsdem (PARA); delitos sin persona se cuentan y quedan (fuera).
  Sin filtro de edad, sexo ni tipo de delito.'
ponderador: FAC_DEL. Toda proporcion es razon de totales ponderados sum(w*y)/sum(w).
transformacion: 'evade_norma := (BP1_20 == "2") AND (BP1_23 in {04,05,06,08}). Ejes como en las emisiones (ESC_2DIG
  del arbitro; DOMINIO U/C/R). R(s,d) := p_2025(s,d) con punto e IC95 de wprop_ic_conglomerado. EE(R) := (IC95sup
  - IC95inf)/3.92. d_k := 100*|p_k - R| en pp para k in {C1,C2,C6,C7}, leidos del sello de las emisiones. Por celda
  PUNTUADA y por challenger contra cada piso: INDECIDIBLE si ambos caen dentro del IC95 de R o si |d_chal - d_piso|
  < 0.5*EE(R)*100; si no, GANA-CHALLENGER si d_chal < d_piso, GANA-PISO en otro caso. Celda-D en el orden de la
  spec §5.5.'
estimando: 'Re-adjudicacion del CALC-TRA-EVADE-NORMA-SXD-ARBITRO-CRUCE-0001 con C2 := RESULT -C2-P (y su IC) de
  CALC-ENVIPE2025-PISOS-EVADE-NORMA-SXD-0001, por id. Todo lo demas: el estimando del -0001, verbatim: R = p(evade_norma
  | escolaridad_proxy, dominio_urbano_rural) en las 12 celdas de ENVIPE 2025 (arbitro), y la adjudicacion de C6/C7
  contra C1/C2 celda por celda y de celda-D. Emite ademas el signo de la modulacion de cada candidato respecto del
  nacional 0.562774 y el diagnostico C5. NO adopta.'
precision: 'IC95 de R por bootstrap de conglomerado estratificado por celda (wprop_ic_conglomerado, 10 000 replicas,
  seed 42) -- la receta del arbitro sellado, reproducida a 5e-7 en COMMIT-2. Skill y MAE se reportan sin intervalo:
  no adjudican.'
seed:
  aplica: true
  valor: 42
  rng: numpy.random.default_rng (wprop_ic_conglomerado, receta del arbitro)
tolerancia:
  tipo: bootstrap
  exacto_por_seed: true
  abs: 1.0e-10
  razon: seed 42 + default_rng + orden de consumo de wprop_ic_conglomerado sobre las filas de cada celda en orden
    de archivo. Enteros EXACTO; flotantes abs = 1e-10.
parametros:
  emisiones_corrida_id: CALC-TRA-EVADE-NORMA-SXD-EMISIONES-0001--2ff028319eed
  celdas:
