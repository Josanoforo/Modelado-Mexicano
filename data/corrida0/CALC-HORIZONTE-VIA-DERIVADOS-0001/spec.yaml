  - {archivo: "data/corrida0/CALC-ENIF-0001/resultados.json", variable: "RESULT-ENIF-AHO-A-P-CORTO-CON-P", rol: "insumo -- horizonte_corto, trabaja con seguridad social", codigos: "flotante tal cual (esperado 0.373130)"}
