      reparto: "160 de 163 municipios con Δ positivo; los 3 negativos son del Edomex y pequenos (LUVIANOS -2.775, AMATEPEC -2.152, ALMOLOYA DE ALQUISIRAS -1.636); maximo ABASOLO Coahuila +22.790"
    lecturas_secundarias:
      federal_2024_por_crosswalk: "con el crosswalk seccion->municipio 2016 sobre el PREP presidencial 2024: federal2024 - local2023 = +7.6560 pp (Coahuila) y +9.2557 pp (Edomex), asi que el salto no depende de que boleta se mire. Secciones sin correspondencia en el crosswalk: 138 de 1777 (7.77%) en Coahuila, 406 de 6744 (6.02%) en Edomex."
