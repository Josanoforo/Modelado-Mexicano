- archivo: conjunto_de_datos_tmod_vic_envipe2026.csv
  variable: BP1_20
  rol: caso -- denuncia = BP1_20=1; universo BP1_20∈{1,2}
- archivo: conjunto_de_datos_tmod_vic_envipe2026.csv
  variable: BP2_1
  rol: eje -- cobertura de seguro, universo BP2_1∈{1,2} (1 asegurado, 2 no asegurado)
- archivo: conjunto_de_datos_tmod_vic_envipe2026.csv
  variable: FAC_DEL
  rol: ponderador de la unidad (delito)
- archivo: conjunto_de_datos_tmod_vic_envipe2026.csv
  variable: EST_DIS
  rol: estrato de diseño muestral -- llave opaca de texto
- archivo: conjunto_de_datos_tmod_vic_envipe2026.csv
  variable: UPM_DIS
  rol: unidad primaria de muestreo -- llave opaca de texto
universo: 'ENVIPE 2026, tmod_vic, BPCOD=''01'' ∧ BP1_20∈{1,2} ∧ BP2_1∈{1,2} ∧ FAC_DEL válido -- idéntico
  al universo de CALC-ARBITRO-MARGINALES-ENVIPE2025-0001, verificado por texto contra el FD 2026 (spec-v1_0.md
  §2). Dos celdas: asegurado (BP2_1=1), no_asegurado (BP2_1=2).'
filtros: 'Fuera del universo, contado en G-FILAS-ARCHIVO/G-FILAS-UNIVERSO: BPCOD != ''01''; BP1_20 fuera
  de {1,2}; BP2_1 fuera de {1,2}; FAC_DEL no finito o <= 0.'
ponderador: FAC_DEL, unidad DELITO
transformacion: 'R = proporción ponderada de BP1_20=''1'' dentro de cada celda BP2_1. Bootstrap de UPM
  con reemplazo dentro de EST_DIS (misma receta que wprop_ic_conglomerado, expuesta completa). Piso y
  retador (COMMIT-2) se combinan réplica a réplica vía tools/duelo/cruces_familia.py::adjudica -- candidatos
  como normal en logit con su EE (delta method), sorteo independiente; R con réplicas reales del bootstrap.
  ΔMAE = MAE(piso) − MAE(retador), IC95 percentiles 2.5/97.5. Vocabulario mapeado (spec-v1_0.md §3):
  VENCE-RETADOR→VENCE-AL-PISO, PROPUESTA-CON-RESERVA→(igual), NADIE-VENCE→NO-VENCE si ΔMAE>0 en punto
  o C-PISO-ADOPTADO si ΔMAE<=0, NO-ADJUDICABLE→INDECIDIBLE.'
estimando: 'Por celda (asegurado, no_asegurado): R real 2026 con su IC95; error con signo de piso y de
  retador contra R; cobertura cruzada (candidato dentro de IC de R, R dentro de IC de candidato); ΔMAE
  con IC95 por réplica; veredicto del vocabulario cerrado.'
seed:
  aplica: true
  valor: 42
  rng: numpy.PCG64
  n_replicas: 10000
  nota: 'Una réplica independiente de generador por celda (Generator(PCG64(42)) fresco); dentro de una
    celda, un solo stream: primero el bootstrap de R, luego el sorteo normal-en-logit de piso, luego el
    de retador, en ese orden -- reproducible desde el seed, sin covarianza forzada entre R/piso/retador
    más allá de compartir el índice de réplica k en la comparación (spec-v1_0.md §3).'
dependencias_materiales:
- numpy
- pandas
parametros:
  celdas:
  - ASEGURADO
  - NO-ASEGURADO
  bp2_1_codigo:
    ASEGURADO: '1'
    NO-ASEGURADO: '2'
  umbral_vence_pp: 0.5
  umbral_reserva_pp: 0.0
  umbral_cita: 'default de tools/duelo/cruces_familia.py::adjudica -- mismo umbral que el lote ENIF/duelo-1
    (forense/prereg-caja/DUELO-PROSPECTIVO-ENVIPE2026-spec-v1_0.md:67), heredado no inventado (spec-v1_0.md
    §3).'
