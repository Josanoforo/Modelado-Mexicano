# CALC-TRIADA-0001 -- cara mecanica de spec.md (ACTO GEN2-F5-TRIADA-CALC,
# ENCARGO 5/5). Gobierna spec.md y, sobre el, la spec SELLADA
# forense/prereg-duelo-v2/F5-contrato-triada-spec-v1_1.md. Este acto EJECUTA
# esa spec, no la enmienda: copia aqui, citandola por hash, U0, UR, la regla
# de U3, los tres contendientes, la agregacion L, el snapshot M, los arbitros,
# el MAE, las tres Delta pareadas, el bootstrap, delta=0.5 pp, la cobertura,
# la escala pareada, la escala global, la secundaria TRANSFERENCIA y el rol
# diagnostico de B. TODOS los RESULT quedan declarados abajo ANTES de calcular.
# CONGELADO en el COMMIT-1 de este acto; el medidor corre en el COMMIT-2.
