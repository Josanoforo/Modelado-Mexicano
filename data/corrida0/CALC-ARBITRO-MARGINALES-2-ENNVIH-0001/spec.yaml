etiquetas:
  generacion: GEN2
  tipo: ARBITRO-MARGINALES-POR-EJE
  cuenta_gen2: SI
  cuenta_gen2_nota: propuesto por el encargo GEN2-ARBITRO-MARGINALES-2 (P2, pieza ENNViH); no adopta
  acto: GEN2-ARBITRO-MARGINALES-2

inputs:
  - {id: ennvih2_2005_hogar_dta, origen: manifiesto}
  - {id: ennvih3_2009_hogar_dta, origen: manifiesto}
  - {id: ennvih2_2005_ponderador_transversal, origen: manifiesto}

variables:
  - {archivo: ehh05dta_b3b/iiib_pr.dta, variable: pid_link, rol: llave intra-persona ola 2}
  - {archivo: ehh05dta_b3b/iiib_pr.dta, variable: pr02, rol: "horizonte temporal 1-7 sustantivo; 8/98 excluidos"}
  - {archivo: ehh05dta_b3b/iiib_cr.dta, variable: cr27, rol: "tiene ahorros; 1=sí 3=no"}
  - {archivo: ehh05dta_b3b/iiib_cr.dta, variable: folio, rol: llave de hogar}
  - {archivo: ehh05dta_b3b/iiib_cr.dta, variable: ls, rol: llave de respondente dentro del hogar}
  - {archivo: ehh09dta_all/ehh09dta_b3b/iiib_pr.dta, variable: pid_link, rol: "llave intra-persona ola 3; posiciones [6:8) portan el código de ronda AP/BP/CP/CH"}
  - {archivo: ehh09dta_all/ehh09dta_b3b/iiib_pr.dta, variable: pr02, rol: horizonte temporal ola 3}
  - {archivo: ehh09dta_all/ehh09dta_b3b/iiib_cr.dta, variable: cr27, rol: tiene ahorros ola 3}
  - {archivo: ehh05w_all/ehh05w_b3b.dta, variable: fac_3b, rol: ponderador transversal libro 3b, ola 2}

universo: >-
  Individuos con pr02 y cr27 válidos en ambas olas (panel retenido vía
  pid_link, ronda C de ola 3 excluida antes de emparejar). n_pre_peso=6356
  (reproduce exacto el YAML). Con fac_3b finito y >0: n=5855 (GEN1 declara
  6028; ver spec.md §1 -- defecto de fuente en la tabla de ponderador, no de
  este medidor).
filtros: >-
  pr02 fuera de {1..7} o cr27 fuera de {1,3} en cualquiera de las dos olas
  excluye la fila del universo analítico. fac_3b nulo o <=0 excluye del
  universo final.
ponderador: fac_3b (ola 2) sin normalizar; unidad persona.
transformacion: >-
  ahorro = (cr27_ola2 == 1). Tasa base ponderada sobre el universo final.
estimando: >-
  Proporción ponderada descriptiva (tasa base), asociativo/no causal (A-bis 1).
dependencias_materiales: [numpy, pandas, pyreadstat]

parametros:
  bootstrap_replicas: 10000
  metodo_ic: "bootstrap por PERSONA con reemplazo (ENNViH SIN_DISENO_PUBLICADO, sin UPM/estrato); percentiles 2.5/97.5; rotulado IC-INFORMAL-SIN-DISENO-PUBLICADO"
  hash_medidor_sha256: b1544939a7a7d31cc017a58364e97a1c9e75ca2722fbf8a679324fe8cc3ddf38
