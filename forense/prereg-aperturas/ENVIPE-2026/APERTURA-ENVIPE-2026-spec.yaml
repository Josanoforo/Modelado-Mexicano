  funcion: DATO
  nota: 'piso 2024 sellado: P, IC-LO, IC-HI por celda'
- id: receta_pisos_salud
  origen: repo
  ruta: tools/dominios/salud/pisos_diseno.py
  sha256: b82a4fefbf073f247033f376b8bc34183a32db27de48f5d5cafd0d30bbc000c9
  funcion: CODIGO
  nota: lee_csv_zip, miembro_unico de la receta de pisos
- id: motor_pisos_confianza
  origen: repo
  ruta: tools/dominios/confianza/motor_pisos.py
  sha256: 7d0494f43052e0ea39ce0baf5f6505ccf889b386cfa3c0775b0dbdfb56ef958e
  funcion: CODIGO
  nota: prepara_diseno, recodifica, eje_mapa, eje_rango, num del motor de pisos
- id: guardia_apertura
  origen: repo
  ruta: forense/prereg-aperturas/guardia_apertura.py
  sha256: b9fee881070a00c46ad3238d9ee65f6d3cfd3028594b29ee055727f9501771c0
  funcion: CODIGO
  nota: auditoría AST, agregador de una variable, adjudicación
- id: expediente_apertura
  origen: repo
  ruta: forense/prereg-aperturas/expediente_apertura.py
  sha256: db003b18b9bc8213d0aba9bed900a9b7f5620ebc4e9a2173727f53356c7ef9f7
  funcion: CODIGO
  nota: esquema, salida y contrato comunes
variables:
- nombre: ESTADO-INSEGURO
  definicion: AP4_3_3 = 2 frente a 1 (spec contendiente §2)
- nombre: INSEGURO-CAMINAR-DE-NOCHE
  definicion: AP4_4_A ∈ {3,4} frente a {1,2} (spec contendiente §2)
- nombre: DEJO-PERMITIR-MENORES-SALIR-SOLOS
  definicion: AP4_10_02 = 1 frente a 2 (spec contendiente §2)
universo: Persona elegida de 18-97 años (EDAD), ENVIPE 2026, tabla tper_vic1; FAC_ELE > 0, EST_DIS y UPM_DIS no
  vacíos (universo del contendiente); NIV de tsdem por ID_PER
filtros: Un eje a la vez (TOTAL, SEXO, EDAD, ESCOLARIDAD, DOMINIO, ENTIDAD); nunca cruces (guardia E.6)
ponderador: FAC_ELE
transformacion: 'Recodificación del contendiente (spec COLA-ENVIPE-PERCEPCION §2: bin(col, UNO, CERO)); columna
  ausente en el catálogo 2026 -> NO-ESTIMABLE (R None), sin recodificación ad hoc'
estimando: R = Σw·y/Σw por conducta×eje×categoría en ENVIPE 2026; cobertura de R en el IC de diseño del piso 2024
seed:
  aplica: false
  razon: R es un punto; la cobertura usa el IC ya sellado del contendiente
parametros:
  nominal: 0.95
  z: 1.959964
  regla: cobertura R en [lo, hi] del contendiente; Wilson 95%; NO-ESTIMABLE > SUBCUBRE > SOBRECUBRE > CALIBRADO
  columna_ausente_en_catalogo: NO-ESTIMABLE (sin recodificación ad hoc)
tolerancia:
  tipo: flotante
  abs: 1.0e-10
  razon: 'determinista: sumas float64 sin remuestreo'
