inputs:
  - {id: enfih2019_bd_csv_zip, origen: manifiesto}
  - {id: enfih2019_fd_xlsx, origen: manifiesto}
  - id: IN-ENFIH2019-SALDOS-AFORE-SPEC
    origen: repo
    ruta: forense/prereg-caja/ENFIH2019-SALDOS-AFORE-spec-v1_0.md
