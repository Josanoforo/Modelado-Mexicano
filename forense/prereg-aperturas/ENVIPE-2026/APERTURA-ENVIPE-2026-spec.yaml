  nota: ENVIPE 2026 datos abiertos CSV -- reserva RESTANTE (tper_vic1 y tsdem.NIV como eje de persona elegida);
    tmod_vic ya consumida por los duelos sellados; sólo este medidor la lee
- id: contendiente_medidor
  origen: repo
  ruta: data/corrida0/CALC-ENVIPE-PERCEPCION-2024-0001/medidor.py
