universo: >-
  Delitos: filas de
  tmod_vic_envipe2025/conjunto_de_datos/conjunto_de_datos_tmod_vic_envipe2025.csv,
  miembro de envipe2025_csv.zip, que cumplen LAS TRES condiciones de la opcion A
  firmada: (1) BPCOD == '01' (robo total de vehiculo), (2) BP2_1 en el mapa de
  estratos, (3) BP1_20 en el mapa de desenlaces; y ademas FAC_DEL finito y > 0.
  Nada mas: NO hay filtro de edad, sexo, entidad, dominio ni ano de ocurrencia
  -- la opcion A no declara ninguno y esta spec no anade los que mesa no firmo.
  U se parte en DOS subuniversos disjuntos y exhaustivos dentro de U:
  U_CON (BP2_1 == '1') y U_SIN (BP2_1 == '2'). Que U_CON union U_SIN == U se
  COMPRUEBA contando (G-PARTICION-ESTRATOS), no se da por hecho.
  Unidad = DELITO: una misma persona puede aportar mas de una fila, y por eso
  el ponderador es FAC_DEL. ENVIPE 2025 es la UNICA ola de esta corrida: no hay
  serie que promediar y no se construye ninguna.
  Queda fuera todo BPCOD != 01, DELIBERADAMENTE: el OBJETO 10 la llama
  «apertura estrecha». Eso no es un defecto; es el estimando.

filtros: >-
  Sale de U, CONTADO y no imputado: fila con BPCOD != '01'
  (G-N-FUERA-DE-BPCOD-01); fila con BP2_1 fuera de {'1','2'}
  (G-N-SEGURO-INVALIDO, incluye el '9'); fila con BP1_20 fuera de {'1','2'}
  (G-N-DENUNCIA-INVALIDA); fila con FAC_DEL vacio, no finito o <= 0
  (G-N-SIN-PONDERADOR / G-N-PESOS-NO-POSITIVOS).
  Se cuenta pero NO sale del punto: fila del universo sin EST_DIS o sin UPM_DIS
  (G-N-SIN-DISENO) -- afecta al IC y al EE, no al estimador.
  CERO NUNCA SUSTITUYE FALTA DE DATO.
  Guardias que producen NO-ESTIMABLE en vez de una cifra: miembro ausente del
  ZIP con esa ruta exacta -> NO-ESTIMABLE-MIEMBRO-AUSENTE:<m> (y NO se cae al
  gemelo envipe2025/bd_envipe_2025_csv.zip); columna declarada ausente ->
  NO-ESTIMABLE-COLUMNA-AUSENTE:<col>; codigo en U ausente del catalogo del
  propio ZIP, o catalogo que contradice el mapa -> NO-ESTIMABLE-CODIGO-FUERA-DE-MAPA:<col>;
  ni ID_DEL ni ID_DEL+ID_VIV+ID_HOG+ID_PER unicas -> NO-ESTIMABLE-LLAVE-NO-UNICA;
  U, U_CON o U_SIN vacio -> NO-ESTIMABLE-UNIVERSO-VACIO:<subuniverso>.
  Si TODA fila del universo carece de diseno -> METODO-IC =
  NO-ESTIMABLE-DISENO-INCOMPLETO, los IC y EE salen null y los puntos se
  reportan igual. Un universo mas chico de lo esperado NO es una guardia: es un
  hallazgo y se reporta con su conteo.

ponderador: >-
  FAC_DEL leido de conjunto_de_datos_tmod_vic_envipe2025.csv. Flotante tal cual:
  sin normalizar, sin redondear, sin truncar. Ningun otro ponderador entra; en
  particular NO entra FAC_DEL_AM, que vive en el mismo archivo. El denominador
  de cada punto es la suma de pesos DE SU PROPIO ESTRATO, nunca la de U entero.

transformacion: >-
  Lectura con pandas.read_csv(encoding='latin-1', low_memory=False); BPCOD,
  BP2_1, BP1_20, EST_DIS y UPM_DIS con dtype=str. Los cuatro puntos, con
  w = FAC_DEL y sumas en orden fijo de llave:
  CON-P-DENUNCIA    = suma(w*[BP1_20=='1'])/suma(w) sobre U_CON;
  CON-P-NO-DENUNCIA = suma(w*[BP1_20=='2'])/suma(w) sobre U_CON;
  SIN-P-DENUNCIA    = suma(w*[BP1_20=='1'])/suma(w) sobre U_SIN;
  SIN-P-NO-DENUNCIA = suma(w*[BP1_20=='2'])/suma(w) sobre U_SIN.
  LOS COMPLEMENTOS SE CUENTAN DIRECTAMENTE, DENTRO DEL MISMO ESTRATO, NUNCA
  COMO 1 - p. Prohibido derivarlos: derivarlos haria que CON-SUMA-UNO y
  SIN-SUMA-UNO se cumplieran POR CONSTRUCCION y el control de particion no
  comprobaria nada; contandolos, un residuo fuera de tolerancia es un hallazgo
  (tipicamente un tercer codigo que se colo) en vez de un error invisible.
  Bootstrap: clave de conglomerado = (EST_DIS, UPM_DIS) como cadenas; UPM con
  reemplazo dentro de EST_DIS conservando el numero de UPM por estrato; estrato
  con UPM unica se re-muestrea a si mismo. IC = percentiles 2.5/97.5 de las
  replicas; EE = desviacion estandar de las replicas.
  NO se promedia entre estratos, no se imputa, no se re-escala, no se extrapola.

estimando: >-
  DESCRIPTIVO. (1) ADOPTABLE POR MESA: los CUATRO puntos con sus IC/EE de
  diseno -- CON-P-DENUNCIA (releva RES-0039), CON-P-NO-DENUNCIA (RES-0040),
  SIN-P-DENUNCIA (RES-0041), SIN-P-NO-DENUNCIA (RES-0042); es decir las dos
  probabilidades de denuncia por estrato de seguro Y SUS COMPLEMENTOS EXACTOS
  CONTADOS DENTRO DEL MISMO ESTRATO. (2) SECUNDARIO DECLARADO, NO adoptable:
  DELTA-CON-MENOS-SIN con signo y su IC de diseno.
  PROPOSITO, verbatim de la opcion A firmada: describir la asociacion
  seguro-denuncia en esa apertura, SIN INTERPRETACION CAUSAL Y SIN EXTRAPOLAR A
  OTROS DELITOS. Esto es normativo, no una nota al pie:
  (a) PROHIBIDO LEER CAUSALMENTE -- ningun RESULT esta rotulado causal y
  ninguno puede citarse como evidencia de que el seguro CAUSA la denuncia;
  DELTA-CON-MENOS-SIN es una diferencia descriptiva entre dos estratos
  observados, no un efecto: quien tiene seguro difiere de quien no en vehiculo,
  ingreso, lugar y mil cosas que esta corrida no mide ni ajusta.
  (b) PROHIBIDO EXTRAPOLAR FUERA DE BPCOD=01 -- ningun RESULT puede citarse
  como tasa de denuncia de «los delitos asegurables», del robo en general ni de
  Mexico; la restriccion es parte del estimando, no una limitacion que se supere
  promediando. (c) PROHIBIDO TRANSPORTAR ENTRE OLAS -- vale solo para 2025.
  (d) PROHIBIDO CRUZAR CON LA OTRA APERTURA -- estos cuatro RESULT no se suman,
  promedian ni comparan con los de prereg-caja-ENVIPE-DENUNCIA (razones de no
  denuncia): otra unidad, otro denominador, otra codificacion.
  Esta spec implementa la OPCION A de la propuesta y SOLO la A; la opcion B
  (redefinicion de motor: poblacion, unidad, tratamiento de cobertura,
  desenlace y uso en el motor) NO fue firmada por mesa y NO se toca. Si A
  resultara no medible, la consecuencia es NO-ESTIMABLE, nunca una migracion
  silenciosa a B.

dependencias_materiales: [numpy, pandas]

parametros:
