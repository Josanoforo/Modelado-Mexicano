# ══════════════════════════════════════════════════════════════════
# LOS 15 COEFICIENTES DE GENERADOR: todos asignados
# (Corregido 29/jul/2026: decía 14, contradiciendo el diagnostico de abajo,
#  que ya dice 15 -- suma real de la tabla `detalle` (G1:2+G2:2+G3:3+G4:4+
#  G5:3+G6:1=15). censo-integridad-v1_0.md C1-05.)
# ══════════════════════════════════════════════════════════════════

asignados_coeficiente:
  diagnostico: >
    Los 15 coeficientes son todos ASIGNADO, y por una razón estructural, no por
    descuido: un coeficiente es una ELASTICIDAD, y el corpus es transversal —
    da estados, no ritmos. Ninguna de las fuentes citadas (Pew, ENCIG, ENOE,
    ENIF, ENVIPE, ENSU, CEEY) publica elasticidades de disposición respecto a
    capa estructural. No existían para ser citadas.
  consecuencia: >
    Los generadores tienen el signo bien sostenido por el corpus y la magnitud
    sin sostener. Esto es lo que hace posible que un generador explique
    cualquier cosa si se le mueve el coeficiente — el riesgo de infalsabilidad
    que las instrucciones v2 marcan y que la prueba de generadores debe atacar.
  detalle:
    - {gen: G1, coefs: {confianza_institucional: -0.60, radio_confianza: -0.35}, signo: sostenido, magnitud: asignada}
    - {gen: G2, coefs: {sens_estatus: 0.55, aversion_riesgo: 0.20}, signo: sostenido, magnitud: asignada}
    - {gen: G3, coefs: {horizonte_temporal: -0.60, aversion_riesgo: 0.40, familismo_apoyo: 0.20}, signo: sostenido, magnitud: asignada}  # ADR-30: familismo_apoyo SE CONSERVA aquí (mecanismo: pooling ante volatilidad — la tanda). NO es doble conteo con G5.
    - {gen: G4, coefs: {exposicion_violencia: 0.70, confianza_institucional: -0.40, horizonte_temporal: -0.20, sens_estatus: -0.15}, signo: sostenido, magnitud: asignada}
    - {gen: G5, coefs: {familismo_apoyo: 0.50, familismo_obligacion: "signo negativo o no monotónico — SIN MAGNITUD", radio_confianza: 0.15}, signo: sostenido, magnitud: asignada}
    # ⚠ CHECK OBLIGATORIO (ADR-30): una configuración donde familismo_obligacion
    #   alto mejore TODOS los desenlaces se rechaza en compilación. Si el modelo
    #   no puede producir el caso en que la familia daña, el parámetro es adorno.
    # ⚠ AMBOS parámetros heredan marca (b): las escalas de familismo
    #   (Sabogal, Lugo Steidel, Knight, Calzada, Zeiders) están validadas en
    #   contextos migratorios. Nadie los ha medido en población EN México.
    - {gen: G6, coefs: {deferencia: 0.45}, signo: sostenido, magnitud: asignada}
  # `unico_calibrable_hoy` SE RETIRA (ADR-49, D1): la premisa de conducta
  # financiera vía ENOE es falsa a nivel de reactivo (forense/hallazgos.md,
  # 31/jul/2026). Lo único que sobrevivía -- el panel rotativo sigue al mismo
  # hogar cinco trimestres -- es cierto pero es propiedad del instrumento
  # ENOE, no una vía de calibración; no se vuelve a declarar aquí como campo
  # de coeficiente. Ningún coeficiente de generador tiene ruta hoy.

# ══════════════════════════════════════════════════════════════════
# RECLASIFICACIÓN v4.0 · Encargo W · 04/ago/2026 · primera estimación
# empírica (β̂) de tres coeficientes de generador -- NO condicionales θ_k(x)
# (eso es `condicionales_escalares`, arriba). Contador: 0 de 15 -> 3 de 15
# coeficientes de generador. `asignados_coeficiente.detalle` NO se toca --
# los valores ASIGNADO (-0.35/-0.60/0.20) siguen siendo lo que el modelo
# usa. Fuente única: forense/notas/2026-08-04-w-coeficientes-generador-
# paso1.md §3 (PR pendiente de fusionar).
# ⚠ ESCALA, no se repite bastante: β̂ es diferencia de proporciones
#   ponderada del desenlace (regresión de binario sobre binario), NO la
#   escala del índice del generador que usa el ASIGNADO. Sin función de
#   enlace declarada por el modelo, no hay conversión entre las dos.
#   Comparable entre sí (razón de magnitudes, mismo generador, misma
#   escala): SÍ. Comparable contra el valor ASIGNADO en magnitud: NO.
# ══════════════════════════════════════════════════════════════════
coeficientes_generador_medidos:
  G1_radio_confianza:
    clase: "MEDIDO·β̂(diferencia de proporciones), por ítem, marginal (sin condicionar sobre atributos)"
    antes: "ASIGNADO -- coeficiente de generador (G1 -0.35), sin estimación empírica"
    fuente: "ENCUCI 2020, SEC_4_5 (21519 filas) -- reactivo AP5_1_1/2/3 (dicotomizado >=6/10) x desenlace tramite.mordida.discrecional (AP5_17 o AP5_18='1', universo con contacto AP5_16_1..10) -- forense/notas/2026-08-04-w-coeficientes-generador-paso1.md §1.1, §3.1"
    n_util: "AP5_1_1: n=13375 (6430+6945) · AP5_1_2: n=13393 (10667+2726) · AP5_1_3: n=13365 (7644+5721), de universo con contacto=13435/21519"
    eje_condicionante: "EJECUTADO (Encargo X, forense/notas/2026-08-04-x-condicionamiento-y-forma.md §4.1) -- 3 ejes, uno a la vez (formalidad, edad, ingreso), 39 celdas (3 ítems x 3 ejes). El marginal NO SOBREVIVE: 33 de 39 celdas cambian a signo positivo (opuesto al marginal negativo) y las 9 celdas distinguibles de cero al 95% son todas positivas, sin excepción (recontado por ADR-61; el titular original de la nota decía 28/12, no reproduce contra sus propias tablas). X2 (§5.1): tasa por nivel 0-10 no monótona en los tres ítems, sin escalón visible en el corte >=6."
    beta_hat: "AP5_1_1: -0.0102 [IC95% -0.0292,0.0089] · AP5_1_2: -0.0113 [IC95% -0.0341,0.0114] · AP5_1_3: -0.0269 [IC95% -0.0465,-0.0072]"
    nota: >
      Escala de diferencia de proporciones del desenlace, NO la escala del
      índice del generador -- no comparable en magnitud contra el -0.35
      ASIGNADO (ver cabecera de esta sección). Signo coincide en los tres
      ítems (negativo). Solo AP5_1_3 (vecinos) es distinguible de cero al
      95%; AP5_1_1 y AP5_1_2 no lo son -- se reportan los tres, sin
      descartar los no significativos. Tres ítems por separado, no
      índice -- mismo criterio que condicionales_escalares.radio_confianza.
    marca_c3: >
      NO USAR para identificar cooperacion.confianza.puente_personal
      (mismo límite que condicionales_escalares.radio_confianza) --
      su desenlace observado es AP5_1_2, el propio reactivo de esta
      entrada. Esta entrada identifica G1 vía tramite.mordida.discrecional
      únicamente.
    adr57_a: >
      ADR-57 (a): la concordancia de signo entre este β̂ marginal y el
      ASIGNADO (G1 -0.35) NO corrobora el asignado -- condicionar
      (Encargo X, ver eje_condicionante arriba) mostró que el marginal no
      es estable (33 de 39 celdas invierten el signo, recontado por
      ADR-61 -- ver eje_condicionante). Asociar ≠ identificar.
    eje_policial: >
      EJECUTADO (Encargo W1-P, forense/notas/2026-08-04-w1-p-policial.md §8) --
      partición AP5_16_1='1' (estrato policial, n=4087, 88.2% con contacto
      adicional) vs. resto del universo de contacto (no-policial, n=9348), 6
      celdas (3 ítems x 2 estratos), n mínimo=30 alcanzado en las seis.
      COMPOSICIÓN POLICIAL DESCARTADA por la regla de precedencia
      pre-registrada en la ficha (2 de 3 ítems ESTABLE -- AP5_1_2 sin
      discrepancia significativa, AP5_1_3 mismo signo en ambos estratos; 1 de
      3 DISCREPANTE -- AP5_1_1 signos opuestos con el estrato policial
      significativo). El eje policial NO reproduce la reversión de signo que
      sí muestran formalidad/edad/ingreso (eje_condicionante arriba): donde
      hay señal significativa (AP5_1_1, AP5_1_3), el signo se mantiene
      negativo en el estrato policial, igual que el marginal y que el
      ASIGNADO. Prevalencia del desenlace: 27.30% [24.92,29.68] en policial
