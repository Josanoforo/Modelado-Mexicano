  ola posterior (seria fuga temporal), NO hay promedio, NO hay ajuste de
  tendencia, NO hay colapso de olas.
estimando: >-
  el punto p ya MEDIDO de la ola LOO, leido verbatim de serie_olas. Esta
  corrida no estima: selecciona una ola por una regla declarada y reporta el
  punto que esa ola ya traia.
