  - {id: RESULT-ENCUCI2020-ER-LLAVE-IDPER, tipo: texto, unidad: UNICA o NO-UNICA en el marco}
  - {id: RESULT-ENCUCI2020-ER-N-ESTRATOS, tipo: entero, unidad: EST_DIS distintos del marco}
  - {id: RESULT-ENCUCI2020-ER-N-UPM, tipo: entero, unidad: pares EST_DIS/UPM_DIS distintos del marco}
  - {id: RESULT-ENCUCI2020-ER-N-ESTRATOS-SINGLETON, tipo: entero, unidad: estratos con una UPM}
  - {id: RESULT-ENCUCI2020-ER-METODO-IC, tipo: texto, unidad: método inferencial efectivamente aplicable}
  - {id: RESULT-ENCUCI2020-ER-EXPOSICION-POR-TIPO, tipo: texto, unidad: tabla JSON de proporciones/IC/n/masa y desconocimiento para diez tipos}
