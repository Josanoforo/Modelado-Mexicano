ponderador: WEIGHT/weight por ola
transformacion: bin(col, UNO, CERO) / media(col, lo, hi); todo otro codigo fuera (lista-cerrada-P1.md
  §2).
estimando: Pisos por segmento PEW Mexico de 7 conductas en 6 olas; IC calibrado de persistencia en 4 series;
  2025 RESERVADA
