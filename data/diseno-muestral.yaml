    ''CONSAR'' aparece mencionado junto a ENIF en varias notas (p.ej. y2-operacionalizacion
    linea 7) pero es una fuente DISTINTA, no localizada en disco, mencionada solo como comparación
    descartada -- no se confundió con datos de diseño de ENIF. También se evitó tomar como evidencia
    de ENIF el mnemónico compartido `est_dis`/`upm_dis`/`fac_*` que aparece en notas sobre ENVIPE,
    ENCIG, ENCUCI, ENDIREH, ENUT, ENASEM (mismo patrón de nomenclatura INEGI, pero fuentes distintas)
    -- cada cita reportada aquí fue verificada en su contexto inmediato (encabezado de sección,
