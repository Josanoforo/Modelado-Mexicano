  orden_de_commits: "COMMIT-3 -- las emisiones ya estaban selladas y este directorio no existe en ningun commit anterior (git log --diff-filter=A)"
  medidor_ejecutado_al_congelar: "NO -- solo contra zips FABRICADOS y emisiones sinteticas"

inputs:
  - {id: envipe2025_csv, origen: manifiesto}
  - {id: emisiones_selladas, origen: repo,
