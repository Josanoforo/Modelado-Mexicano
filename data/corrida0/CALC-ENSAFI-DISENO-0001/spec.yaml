universo: >-
  ENSAFI 2023. Hogar para cuatro clases amplias de deuda y persona elegida
  de 18 anos y mas para atraso general y afrontamiento. Dominios y codigos
  exactos en la spec sellada; no hay segmentaciones exploratorias.
filtros: >-
  Respuesta 1/2 valida; cualquier otro codigo se reporta desconocido y sale
  del denominador. P6_8=1..4 define deuda; P6_9=2 define insuficiencia.
  Peso ausente, no finito o no positivo sale y se cuenta.
ponderador: >-
  FAC_HOG en THOGAR; FAC_ELE en TMODULO. Punto como razon de totales.
transformacion: >-
  Trece indicadores binarios. Estrategias y clases permanecen respuestas
  multiples/no excluyentes. No se suman ni se recodifican a una particion.
estimando: >-
  Cuatro prevalencias de atraso de hogar por clase, una prevalencia general
  de atraso de persona con deuda y ocho prevalencias de estrategias ante
  insuficiencia, todas descriptivas y con respuesta valida.
precision: >-
  Linealizacion de razon por UPM_DIS anidada en EST_DIS sobre muestra completa;
  varianza WR por estrato, IC95 t con gl=sum_h(m_h-1), truncado [0,1], sin FPC.
  Singleton no se agrupa ni aporta varianza/gl. Frontera, diseno incompleto o
  denominador nulo producen precision null con causa, nunca cero inventado.

