    origen: repo
    ruta: milpa/tramite-ola5-propuesta-v0.yaml
    sha256: 93dfa3f9aab250dabf9cbe8c93ccef2012cb763c5367d023f24dbfbd867fbc8f
    rol: >-
      marginales R con IC95 y n de los 7 ids `_ejes_` -- la UNICA entrada numerica por eje
  - id: IN-MOTOR-NACIONALES
    origen: repo
    ruta: milpa/tramite.yaml
    sha256: 4b635828c326a5f5e7e125254fe80c91f4416c27041bc88ba5322409b274922d
    rol: >-
      los cuatro nacionales por desenlace (citados, no recalculados); se LEE, no se edita
  - id: IN-MARCADOR-SEGMENTO
    origen: repo
    ruta: data/corrida0/marcador-segmento.tsv
    sha256: cd773ff3aa3e33d28aee2be5ddca654f900d93eb2029986ffd1f8173b07f32a0
    rol: >-
      los 22 cruces RESERVADA; se LEE, no se edita en este CALC
  - id: IN-SPEC-SELLADA
    origen: repo
    ruta: forense/prereg-caja/C2-COMPUESTO-RESERVADAS-spec-v1_0.md
    sha256: bacd82611e749a7d7e109e287b87430a19dc02ac7c3b31a2f87d93ad5a9b242b
    rol: >-
      spec congelada en el COMMIT-1, anterior a esta corrida
  - id: IN-FORMA-C2-SELLADA
    origen: repo
    ruta: tests/test_celda_d_c2.py
    sha256: 71878f9ca98698a4d770b77e583e5086875509dcd022ba6928b86caa976a12d9
    rol: >-
      `piso_log_aditivo`: la forma se importa de aqui, no se reimplementa
  - id: IN-CONTROL-C2-YA-SELLADO
    origen: repo
    ruta: data/corrida0/CALC-DIN-AHORRO-SOLO-INFORMAL-EMISIONES-0001/resultados.json
    sha256: 69ec9c6a21d259a76ae5617f2cff801e6165c351c750121125cc77e642f2d8c1
    rol: >-
      los 8 puntos C2 del par `localidad x edad` YA PILOTEADO -- control de reproduccion

variables: []
# Vacia a proposito y no por omision: `variables` es el contrato contra el
# INVENTARIO DE REACTIVOS, que cataloga columnas de MICRODATO. Este CALC no
# abre microdato -- sus seis inputs son archivos del repo -- asi que declarar
# ahi `celdas[].p` o `eje_o_par` produciria nueve FAIL de `spec-check` contra
# un inventario que, correctamente, no conoce esos nombres. Lo que se lee de
# cada archivo esta declarado en el `rol` de su input y en spec.md §1-§2.
universo: >-
  Los 22 cruces `RESERVADA` de data/corrida0/marcador-segmento.tsv, abiertos a
  36 filas (par x bloque de desenlace) porque el marcador colapsa los dos
  desenlaces de ENIF (`_camina_ejes` toma el max sobre bloques) y la firma de
  mesa emite POR desenlace. La celda unidad de la emision es (eje_a, eje_b) del
  par, dentro del universo de la regla del arbitro. El par `localidad x edad`
  de ENIF NO esta aqui: ya fue piloteado, y por eso sirve de control externo.

filtros: >-
  EMITIBLE exige las cinco condiciones de la spec §4 -- mismo desenlace, mismo
  universo, misma unidad, misma ola y mismo ponderador -- mas las dos guardias
  de la forma: ningun marginal sin punto y ninguno con p en {0,1}. Un eje con
  `universo_restringido: true` (A-bis 4) no compone con ejes de universo
  completo. Nada se recorta ni se sustituye: lo que no pasa queda NO-EMITIBLE
  con causa citada.

ponderador: >-
  Heredado del arbitro y no re-derivado: FAC_PER (ENIF 2024), FAC_TRA
  (ENCIG 2025), FAC_DEL (ENVIPE 2025). Este CALC no pondera nada: compone
  puntos ya ponderados.

transformacion: >-
  C2(a,b) = expit(logit p(a) + logit p(b) - logit p), con p el nacional del
  MISMO desenlace, misma ola, mismo universo y mismo ponderador. La funcion se
  IMPORTA de tests/test_celda_d_c2.py::piso_log_aditivo; no se reimplementa.
  Supuesto declarado: ausencia de interaccion en escala logit
  (`supuesto: sin-interaccion`). Rotulo PROHIBIDO: `independencia` -- C2 no
  identifica P(Y | a, b).

estimando: >-
  Un piso compuesto, en PROPORCION, por celda de cruce. Es un piso declarado y
  solo-marginal que un challenger debe vencer; NO es la conjunta medida y NO es
  un efecto. Asociacion dentro de una corrida (A-bis 1), nunca efecto (A-bis 2).
  Estado EMITIDA-SIN-EVALUAR: excluida de la estimacion adoptada del motor.

dependencias_materiales: [yaml]

parametros:
  fuente_acto: "ACTO GEN2-C2-COMPUESTO-RESERVADAS-1 · CALC-C2-COMPUESTO-RESERVADAS-0001"
  spec_sellada: forense/prereg-caja/C2-COMPUESTO-RESERVADAS-spec-v1_0.md
  spec_sellada_sha256: bacd82611e749a7d7e109e287b87430a19dc02ac7c3b31a2f87d93ad5a9b242b
  c2_forma: "log-aditiva: expit(logit(p_a) + logit(p_b) - logit(p))"
  c2_funcion_de_referencia: "tests/test_celda_d_c2.py::piso_log_aditivo -- el medidor la IMPORTA (via tools/c2_compuesto.py), no la reimplementa"
  c2_rotulo_supuesto: "ausencia de interaccion en escala logit"
  c2_rotulo_prohibido: "independencia"
  c2_rechazo: "SIN-DEFINIR si algun marginal es exactamente 0 o 1; la celda es NO-CONSTRUIBLE, sin recorte y sin sustitucion"
  supuesto: sin-interaccion
  estado_de_emision: EMITIDA-SIN-EVALUAR
  tipo_incertidumbre: NO-PROPAGADA-COVARIANZA-NO-SELLADA
  ic_por_que_no: >-
    Los marginales de una misma ola salen de la misma muestra; su covarianza NO
    esta sellada, y el IC de los C2 adoptados se obtuvo en caja replica por
    replica (IC95-BOOTSTRAP-REPLICA-POR-REPLICA-MARGINALES-COMPARTIDOS). Aqui no
    hay caja y no hay replicas: no se fabrica. Sucesor declarado: IC replica por
    replica con el modulo guardado de una sola variable de agrupacion.
  diagnostico_no_es_ic: >-
    Los RESULT-C2COMP-DIAG-INF-*/DIAG-SUP-* son el recorrido del punto al mover
    cada marginal a los extremos de SU IC95, una esquina a la vez. No es un
    intervalo de confianza: ignora la covarianza que lo haria uno y no tiene
    cobertura declarada. Nombre distinto a proposito.
  # ── control de reproduccion (spec §4 de spec.md, §7 de la spec sellada) ──
  input_control: IN-CONTROL-C2-YA-SELLADO
  prefijo_control: "RESULT-DIN-LXE8-C2-P-"
  desenlace_control: ahorra_solo_informal
  nacional_control: 0.357153
  umbral_control: 1.0e-12
  celdas_control_a: [L1, L2]
  celdas_control_b: [E1, E2, E3, E4]
  marginales_control:
    E1: 0.432063
    E2: 0.375709
    E3: 0.327505
    E4: 0.277317
    L1: 0.409255
    L2: 0.329868
  control_ramas: "REPRODUCE si |delta| <= 1e-12 en las 8 celdas; NO-REPRODUCE en otro caso, con el delta con signo y SIN ajustar nada -- no invalida las emisiones, invalida la afirmacion de que este medidor ejecuta la receta sellada; NO-EJECUTABLE si falta el resultados.json de control, que no es un NO-REPRODUCE piadoso"
  control_excluye: "las claves ...-C2-P-REDERIVADO-... re-derivan los marginales desde microdato en vez de citarlos y difieren del orden de 1e-3 por esa razon, no por la forma"

seed:
  aplica: false
  razon: >-
    Aritmetica determinista sobre marginales ya sellados: no hay remuestreo, no
    hay sorteo y no hay orden aleatorio. Dos corridas del mismo arbol dan los
    mismos bits.

tolerancia:
  tipo: flotante
  abs: 1.0e-12
  razon: >-
    Sin remuestreo, la unica diferencia esperable entre dos corridas del mismo
    arbol es redondeo de float64. Los enteros y los textos se comparan EXACTO.

