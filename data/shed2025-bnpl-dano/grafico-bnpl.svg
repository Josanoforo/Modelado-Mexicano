<svg xmlns="http://www.w3.org/2000/svg" width="960" height="410" viewBox="0 0 960 410" role="img">
<title>Proporciones ponderadas BNPL en SHED 2025</title>
<desc>Cuatro barras con universos distintos y denominadores explícitos. Estados Unidos; descripción no causal.</desc>
<rect width="960" height="410" fill="#ffffff"/>
<text x="40" y="38" font-family="sans-serif" font-size="24" font-weight="700">SHED 2025 · BNPL y daño</text>
<text x="40" y="64" font-family="sans-serif" font-size="14" fill="#444">Estados Unidos · proporciones ponderadas con weight · cada barra conserva su universo</text>
<text x="40" y="121" font-family="sans-serif" font-size="15">Uso de BNPL</text>
<rect x="390" y="105" width="148.40" height="24" rx="3" fill="#2b6cb0"/>
<text x="553.40" y="122" font-family="sans-serif" font-size="15" font-weight="700">16.49% · n válido=12,934</text>
<text x="40" y="191" font-family="sans-serif" font-size="15">Atraso BNPL entre usuarios</text>
<rect x="390" y="175" width="232.02" height="24" rx="3" fill="#2f855a"/>
<text x="637.02" y="192" font-family="sans-serif" font-size="15" font-weight="700">25.78% · n válido=2,004</text>
<text x="40" y="261" font-family="sans-serif" font-size="15">Cargo extra entre quienes afirmaron atraso</text>
<rect x="390" y="245" width="577.00" height="24" rx="3" fill="#b7791f"/>
<text x="982.00" y="262" font-family="sans-serif" font-size="15" font-weight="700">64.11% · n válido=487</text>
<text x="40" y="331" font-family="sans-serif" font-size="15">Sobregiro/NSF atribuido a BNPL en ruta elegible</text>
<rect x="390" y="315" width="349.02" height="24" rx="3" fill="#9b2c2c"/>
<text x="754.02" y="332" font-family="sans-serif" font-size="15" font-weight="700">38.78% · n válido=542</text>
<text x="40" y="390" font-family="sans-serif" font-size="13" fill="#555">Cargo: sólo atraso afirmativo. Sobregiro/NSF: sólo BNPL1=Yes y BK2_f=Yes. Sin transporte a México.</text>
</svg>
