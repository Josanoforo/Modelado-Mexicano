    tier: SELLADA  # corrige omision de MAESTRA34-N9 · PROPAGA-FIRMAS-Y-SELLOS (2/sep/2026): cargada a milpa/tramite.yaml por PR #449/ACTO MAESTRA34-N1, tier FUERTE, y este campo nunca se actualizo pese a que la cabecera de arriba ya decia SELLADA.
