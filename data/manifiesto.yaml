# data/manifiesto.yaml — procedencia de dato externo usado en el corpus
# Convención: se commitea el manifiesto y el checksum, nunca el payload.
# El payload (CSV/ZIP crudo) vive en data/raw/, ignorado por git.
#
# Esquema ampliado 2026-07-30 (tests/manifiesto.py, cola I-08):
#   archivo           ruta relativa dentro de data/raw/; sin este campo
#                     --verifica no puede localizar el payload.
#   entorno_descarga  derivado por --registra al momento de registrar, nunca
#                     pedido por parámetro. Las dos entradas de payload de
#                     abajo son anteriores a este campo y a este script (se
#                     registraron a mano el 29/jul); no se les fabrica un
#                     valor retroactivo que nadie derivó entonces.

