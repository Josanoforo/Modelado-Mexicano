- id: encargoEG_ruptura_enoe_y_descriptores_pendientes_navegador
  fecha: '2026-07-31'
  hecho: |-
    Encargo E-G (bajar ENOE y descriptores faltantes). Dos hechos de la fuente que quedan declarados aquí, no resueltos -- el pre-registro que decida cómo tratarlos no existe todavía:

    1) Ruptura de serie ENOE/ENOEN. Bajo el patrón datosabiertos/{año}/conjunto_de_datos_{prefijo}_{año}_{t}t_csv.zip, el naming real es: 'enoe' para 2019 trimestre 1 -- 2020 trimestre 1 (última edición antes de que el levantamiento se suspendiera en abril de 2020 por la contingencia sanitaria, declarado en la propia ficha del programa); hueco completo en 2020 trimestre 2 (sin levantamiento, no es ausencia de instrumento); 'enoen' (ENOE Nueva Edición) para 2020 trimestre 3 -- 2022 trimestre 4; y el naming vuelve a 'enoe' desde 2023 trimestre 1 en adelante (incluye 2026 trimestre 1, el más reciente publicado), aunque metodológicamente sigue siendo la Nueva Edición -- INEGI simplemente dejó de usar el sufijo 'n' en el nombre de archivo. Confirmado por Content-Type/Content-Length real contra cada URL (no por listado ni por JSON-LD, que en esta página solo trae un único ejemplo de 2020 trimestre 1 como muestra de plantilla). Las 28 entradas bajadas cubren 2019 trimestre 1 -- 2026 trimestre 1 completo salvo el hueco real de 2020 trimestre 2.

    2) Descriptores. Por script (patrones de URL /contenidos/programas/{prog}/{año}/doc/... y variantes), solo se localizó el de ENCIG 2015/2017/2021 (patrón encig{aa}_estructura_base_datos.pdf -- probado también para 2019 con más de media docena de variantes, sin éxito) y se registran en esta misma sesión. El de ENOE (ambas ediciones) no se localizó por ningún patrón probado: /programas/enoe/15ymas/ devuelve solo un shell HTML de SPA (~5.7 KB, sin enlaces reales -- los componentes se llenan por JS del lado del cliente), y el JSON-LD embebido solo trae un ejemplo de distribución (2020 trimestre 1, muestra de plantilla, no un índice real). Confirmado que esto es distinto de 'recurso ausente': INEGI sirve 'Página no encontrada' como HTTP 200, Content-Type text/html, 2263 bytes fijos, incluso para recursos claramente inexistentes (verificado contra 2026 trimestre 4 de ENOE, que no debería existir todavía) -- el shell de la SPA no es ese patrón, es contenido real que un script no puede atravesar.

    Los descriptores de ENIF (2018/2021/2024), ENVIPE (las ocho ediciones 2018-2025) y ENCIG 2019 -- que en un primer sondeo por script tampoco se localizaron -- SÍ se consiguieron y registran en esta misma sesión, bajados a mano desde la pestaña Microdatos de cada programa (mismo patrón ya documentado en este repo para ENCUCI/ENUT, ver id hitoD_fase1_ediciones_requieren_navegador arriba): 'no alcanzable por script' no es 'no existe', y aquí queda resuelto para estos tres. Sigue pendiente, por la misma razón, solo el descriptor de ENOE.
