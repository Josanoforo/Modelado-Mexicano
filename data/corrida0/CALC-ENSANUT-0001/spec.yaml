  - {id: RESULT-ENSANUT-A-DESGLOSE-RAZONES, tipo: texto, unidad: "'no_habia_vacunas:n;no_estaba_quien_aplica:n;no_derechohabiente:n;enfermo:n;otra_razon:n' (milpa declara 152;28;16;47;11)"}
  - {id: RESULT-ENSANUT-A-DESGLOSE-COINCIDE-GEN1, tipo: texto, unidad: "COINCIDE / DIFIERE:<detalle> -- los cinco conteos y el total contra lo que milpa declara"}
