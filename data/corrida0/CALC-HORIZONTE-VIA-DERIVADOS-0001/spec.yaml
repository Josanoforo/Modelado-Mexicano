# CALC-HORIZONTE-VIA-DERIVADOS-0001 -- cara mecanica de spec.md (ACTO GEN2-SPECS-DEMANDA-2).
# Gobierna spec.md y, sobre el, la spec SELLADA
# forense/prereg-caja/ENIF-HORIZONTE-VIA-DERIVADOS-spec-v1_0.md
# (`prereg-caja-ENIF-HORIZONTE-VIA-DERIVADOS`).
# Releva CORR-0015 COMPLETA (7 RESULT) bajo el registro GEN2, por
# aritmetica exacta sobre insumos ya sellados -- CORR-0015 dependia de que
# CORR-0009 (padre) estuviera relevada entera; lo esta, en este mismo acto.
calc_id: CALC-HORIZONTE-VIA-DERIVADOS-0001
spec_md: spec.md
spec_md_sha256: 8c04222fb218fe928f92d63bb380e9a88b226217f050836ebdc32f00e88e8f43

script: data/corrida0/CALC-HORIZONTE-VIA-DERIVADOS-0001/medidor.py

etiquetas:
  generacion: GEN2
  tipo: DERIVADO-DETERMINISTA-SOBRE-SELLADOS
  cuenta_gen2: PENDIENTE-DE-MESA
  validacion_independiente: NO-HECHA
  spec_sellada: forense/prereg-caja/ENIF-HORIZONTE-VIA-DERIVADOS-spec-v1_0.md
  spec_sellada_sha256: 8c04222fb218fe928f92d63bb380e9a88b226217f050836ebdc32f00e88e8f43
  demanda_que_releva: "CORR-0015 (7 RESULT, DERIVADOS peldano 3 de CORR-0009) -> COMPLETA: RES-0047, RES-0049, RES-0053, RES-0054, RES-0055, RES-0056, RES-0066. Condicion de encadenamiento (DEPENDE-DE-CORRIDA-PADRE) verificada cumplida: CORR-0009 quedo agotada en este mismo acto (ver spec.md §0)."
  repite_de: "NINGUNO -- primer CALC sobre estos 7 RESULT. No repite CALC-ENIF-0001 ni CALC-ENIF-0002: LEE sus RESULT sellados como insumo, no los re-ejecuta."
  por_que_no_es_duplicado: "Los 7 RESULT no tenian CALC propio (0 filas en data/corrida0/CALC-*/spec.yaml antes de este acto) -- el mapa-19 los marcaba BLOQUEADA/DEPENDE-DE-CORRIDA-PADRE, no EXISTE-SATISFACE."
  reglas_bajo_prueba: "NINGUNA cambia de cifra. Las cuatro reglas consumidoras (dinero.ahorro.horizonte_corto, .horizonte_no_corto_con_seguridad_social, .via_informal, .horizonte_no_trabajadores) conservan sus valores ASIGNADOS/DERIVADOS legacy exactos. Este CALC les da cadena E.2."
  firma_de_contador: "NO-FIRMADA. FP-367/368 no satisfecho -> cuenta_gen2 PENDIENTE-DE-MESA."
  contaminacion_declarada: "ADR-46 -- al congelar, la sesion ya habia leido milpa/tramite.yaml:1062-1113 (horizonte_corto sin/con seguridad social), :1328-1353 (horizonte_no_trabajadores), :631-684 (tiene_ahorros con sensibilidades A_solo_formal/B_solo_informal), y data/corrida0/CALC-ENIF-0001/resultados.json + CALC-ENIF-0002/resultados.json completos. NO es ciega: leerlos es lo que permite verificar la condicion de encadenamiento de P3 antes de congelar."
  medidor_ejecutado_al_congelar: "NO -- y el medidor tampoco se escribe aqui. Aunque esta derivacion es aritmetica pura (sin numpy/pandas/microdato, verificable en NUBE con la libreria estandar), el encargo de este acto declara en su propio perimetro CONTADOR: cero mediciones propias y no corre ningun CALC -- misma disciplina que CALC-L8-CONVERSION-0001, sin excepcion por facilidad tecnica. `corrida0.py preflight CALC-HORIZONTE-VIA-DERIVADOS-0001` reportara BLOQUEADO:script_ausente hasta que un acto posterior lo escriba y corra."

