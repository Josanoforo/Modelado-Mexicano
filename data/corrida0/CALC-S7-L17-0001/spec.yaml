  - {id: RESULT-S7L17-A-P-NO-LOGISTICA, tipo: proporcion, unidad: "1 - A-P-LOGISTICA, CONTADA via el complemento del mismo bootstrap (no recalculada aparte) -- releva RES-0064 (esperado 0.222238)", permite_no_estimable: true}
  - {id: RESULT-S7L17-A-IC-LO, tipo: flotante, unidad: "percentil 2.5 del bootstrap de conglomerado (esperado 0.672777)", permite_no_estimable: true}
  - {id: RESULT-S7L17-A-IC-HI, tipo: flotante, unidad: "percentil 97.5 del bootstrap de conglomerado (esperado 0.857561)", permite_no_estimable: true}
  - {id: RESULT-S7L17-A-VEREDICTO-BBIS, tipo: texto, unidad: "CORROBORADA / CONTRARIA / NO-DISCRIMINA / NO-ESTIMABLE (esperado CORROBORADA)"}
  - {id: RESULT-S7L17-A-DELTA-VS-SELLADO, tipo: flotante, unidad: "A-P-LOGISTICA menos 0.777762 (valor sellado en milpa/tramite.yaml), CON SIGNO", permite_no_estimable: true}
  - {id: RESULT-S7L17-A-RELEVA-SELLADO, tipo: texto, unidad: "SI / NO -- delta dentro de tolerancia (esperado SI, es transcripcion de la misma corrida)"}
