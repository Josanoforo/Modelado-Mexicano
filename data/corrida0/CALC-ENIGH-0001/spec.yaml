# CALC-ENIGH-0001 -- cara mecanica de spec.md (ACTO GEN2-SPECS-DEMANDA-1).
# Gobierna spec.md y, sobre el, la spec SELLADA
# forense/prereg-caja/ENIGH-REMESAS-R51-spec-v1_0.md
# (`prereg-caja-ENIGH-REMESAS-R51`).
# Releva la demanda CORR-0011 (2 RESULT) bajo el registro GEN2.
# CONGELADO en el COMMIT-1, en NUBE, antes de abrir un solo byte de microdato.
calc_id: CALC-ENIGH-0001
spec_md: spec.md
spec_md_sha256: d3700dc054e8408108b9ff380d520c75a7b26866cf3cd00a8f4480f19006b413

script: data/corrida0/CALC-ENIGH-0001/medidor.py

etiquetas:
  generacion: GEN2
  tipo: TASA-BASE-DE-REGLA
  cuenta_gen2: PENDIENTE-DE-MESA
  validacion_independiente: NO-HECHA
  spec_sellada: forense/prereg-caja/ENIGH-REMESAS-R51-spec-v1_0.md
  spec_sellada_sha256: e58b3901cc49e25500b01df19752ba57e46e862b925141d7a9714a22fc9a59e0
  demanda_que_releva: "CORR-0011 (ENIGH2022, payload enigh2022_nc_csv) -> los 2 RESULT: RES-0035 (familia.seguro.volatilidad_ausencia_estado:recibe_remesas) y RES-0036 (:no_recibe_remesas). NO releva ninguna otra ola ni ninguna otra corrida."
  repite_de: "CALC-B-0001 (ACTO GEN2-C0-B, spec sellada prereg-caja-B-REMESAS) para el PUNTO de la ola 2022: mismo payload, mismo miembro, mismo universo, mismo desenlace, mismo ponderador. RESULT-B-ENIGH-2022-P = 0.04569409956405095, IC95 = [0.043772848428537396, 0.047770249605883566], n = 90102, sello VALIDO. Los bytes de CALC-B-0001 no se tocan (E.3): esta corrida es un CALC nuevo, no una reescritura."
  por_que_no_es_duplicado: "CALC-B-0001 declara `tipo: ENSAYO-LINEA-BASE-TEMPORAL-B`, `cuenta_gen2: PENDIENTE-DE-MESA` y `reglas_bajo_prueba: NINGUNA ... T9, verbatim: es modelo nuevo y ninguna cifra suya entra a un veredicto`. El numero existe y NO puede usarse: el bloqueo de CORR-0011 es de AUTORIZACION, no de medicion. Esta spec no levanta T9 -- nace del lado de la regla, que es donde CALC-B-0001 declaro NO estar, y anade el complemento contado (que el ensayo no emite) y la via de adopcion (que el ensayo no puede tener)."
  reglas_bajo_prueba: "NINGUNA cambia de cifra por esta corrida. familia.seguro.volatilidad_ausencia_estado (R5.1) esta SELLADA en milpa/tramite.yaml:863 con p=0.045694 (GEN1) y conserva su cifra, su ic95 y su serie_olas intactos. La adopcion la decide mesa por merge."
  firma_de_contador: "NO-FIRMADA. El encargo de mesa (15/sep/2026) pide congelar specs ejecutables y NO declara OBJETO sobre el contador GEN2. Estandar FP-367/368 NO satisfecho -> cuenta_gen2 queda PENDIENTE-DE-MESA. Nota adicional: aunque mesa lo firmara, T9 sigue siendo suya y este CALC no la interpreta."
  contaminacion_declarada: "ADR-46 -- al congelar, la sesion YA habia leido: la serie GEN1 completa de las seis olas con sus IC95 y n (milpa/tramite.yaml:850-900, incluida la fila 2022: p=0.045694, ic95=[0.043754,0.047711], n=90102, ponderador factor); los RESULT de CALC-B-0001 para 2022 (punto, IC, n, nulos=0, sin-diseno=0); y la spec sellada prereg-caja-B-REMESAS entera, incluida su seccion 0.2 de contaminacion. NO es ciega, y en el caso de CALC-B-0001 ni siquiera podria serlo: leerlo es lo que A.8 obliga a hacer antes de escribir esta spec. Lo genuinamente desconocido al congelar: cuantos estratos con UPM unica hay en 2022, la anchura del IC bajo ESTA semilla (2000 replicas, seed 20260915, distinta de la del ensayo), el valor contado del complemento, y si A-P replica el punto del ensayo en la decima cifra o solo en la sexta."
  medidor_ejecutado_al_congelar: "NO -- y el medidor tampoco se escribe aqui. El encargo pide `md humana + spec.yaml` (D-15, dos capas); el medidor es del acto de CAJA que consuma este contrato. Consecuencia declarada: `corrida0.py preflight CALC-ENIGH-0001` reporta BLOQUEADO:script_ausente hasta que CAJA lo escriba."

inputs:
  - id: enigh2022_nc_csv
    origen: manifiesto
  - id: IN-ENIGH-SPEC-SELLADA
    origen: repo
    ruta: forense/prereg-caja/ENIGH-REMESAS-R51-spec-v1_0.md
    sha256: e58b3901cc49e25500b01df19752ba57e46e862b925141d7a9714a22fc9a59e0

variables:
  - {archivo: "conjunto_de_datos_concentradohogar_enigh2022_ns/conjunto_de_datos/conjunto_de_datos_concentradohogar_enigh2022_ns.csv", variable: remesas, rol: "DESENLACE -- ingreso corriente monetario del hogar por remesas", codigos: "numerica; recibe_remesas = 1 si remesas > 0, 0 si remesas == 0. LA RAMA NA NO EXISTE y no se fabrica: verificado en las seis olas por ACTO MAESTRA33-E18-P3 y re-confirmado en 2022 por CALC-B-0001 (N-NULOS-REMESAS = 0). Un nulo -> NO-ESTIMABLE-NULOS-INESPERADOS", direccion: "MAS ALTO = MAS HOGARES RECEPTORES"}
  - {archivo: "conjunto_de_datos_concentradohogar_enigh2022_ns/conjunto_de_datos/conjunto_de_datos_concentradohogar_enigh2022_ns.csv", variable: factor, rol: "PONDERADOR de hogar de la Nueva Serie. NO se hereda el nombre de otra ola: en 2012 y 2014 la columna se llama factor_hog y NO existe como `factor` (A.15(c), defecto medido)", codigos: "flotante tal cual, sin normalizar"}
  - {archivo: "conjunto_de_datos_concentradohogar_enigh2022_ns/conjunto_de_datos/conjunto_de_datos_concentradohogar_enigh2022_ns.csv", variable: est_dis, rol: "ESTRATO de diseno -- estratificacion del bootstrap (LLAVE DE TEXTO OPACA)", codigos: "cadena cruda (dtype=str), nunca a entero ni re-rellenada"}
  - {archivo: "conjunto_de_datos_concentradohogar_enigh2022_ns/conjunto_de_datos/conjunto_de_datos_concentradohogar_enigh2022_ns.csv", variable: upm, rol: "UPM -- conglomerado que se re-muestrea (LLAVE DE TEXTO OPACA)", codigos: "cadena cruda"}
  - {archivo: "conjunto_de_datos_concentradohogar_enigh2022_ns/conjunto_de_datos/conjunto_de_datos_concentradohogar_enigh2022_ns.csv", variable: folioviv, rol: "llave de vivienda (1/2 de la identidad del hogar)", codigos: "cadena cruda"}
  - {archivo: "conjunto_de_datos_concentradohogar_enigh2022_ns/conjunto_de_datos/conjunto_de_datos_concentradohogar_enigh2022_ns.csv", variable: foliohog, rol: "llave de hogar dentro de la vivienda (2/2)", codigos: "cadena cruda"}

universo: >-
  Hogares: universo COMPLETO de concentradohogar de ENIGH 2022 Nueva Serie,
  llave folioviv + foliohog, SIN filtro adicional -- la regla no declara
  ninguno, y el SI de modelo 3.5 es CIRCULAR con el desenlace (incluye `hogar
  con remesas` entre sus disparadores para medir recibir remesas), de modo que
  lo que se mide es la TASA BASE, no la condicional. UNA SOLA OLA: 2012, 2014,
  2016, 2018 y 2020 existen en corpus y quedan deliberadamente FUERA.
  Entran las filas con factor finito y > 0 y remesas no nula.

filtros: >-
  Sale del universo, CONTADO y no imputado: fila con factor vacio, no finito o
  <= 0 (A-N-SIN-PONDERADOR). Se cuenta pero NO sale del punto: fila sin est_dis
  o sin upm (A-N-SIN-DISENO) -- afecta al IC, no al estimador.
  CERO NUNCA SUSTITUYE FALTA DE DATO: si remesas trae algun nulo, la corrida
  NO lo trata como 0 -- sale NO-ESTIMABLE-NULOS-INESPERADOS.
  Guardias que producen NO-ESTIMABLE en vez de una cifra: miembro ausente del
  ZIP -> NO-ESTIMABLE-MIEMBRO-AUSENTE:<m>; columna declarada ausente ->
  NO-ESTIMABLE-COLUMNA-AUSENTE:<col>; llave folioviv+foliohog no unica ->
  NO-ESTIMABLE-LLAVE-NO-UNICA; universo vacio -> NO-ESTIMABLE-UNIVERSO-VACIO.
  Si TODA fila carece de diseno -> A-METODO-IC = NO-ESTIMABLE-DISENO-INCOMPLETO,
  los IC salen null y el punto se reporta igual.

ponderador: >-
  factor, leido del mismo archivo miembro que el desenlace. Flotante tal cual:
  sin normalizar, sin redondear, sin truncar. factor_hog (nombre del ponderador
  en 2012 y 2014) NO se usa y esas olas no entran.

transformacion: >-
  Lectura con pandas.read_csv(encoding='latin-1', low_memory=False); est_dis,
  upm, folioviv y foliohog con dtype=str. d = 1 si pd.to_numeric(remesas) > 0,
  0 si == 0. A-P = suma(w*d)/suma(w) sobre el universo, sumas en orden fijo de
  llave. A-P-COMPLEMENTO se cuenta DIRECTAMENTE sobre d == 0, nunca como
  1 - A-P: con 1 - p, una fila fuera del mapa es invisible por construccion.
  Bootstrap: clave de conglomerado = (est_dis, upm) como cadenas; upm con
  reemplazo dentro de est_dis conservando el numero de UPM por estrato;
  estrato con UPM unica se re-muestrea a si mismo. IC = percentiles 2.5/97.5.
  NO se promedia, no se imputa, no se re-escala, no se extrapola, no se ajusta
  tendencia.

estimando: >-
  DESCRIPTIVO. (1) ADOPTABLE POR MESA: A-P, proporcion ponderada de hogares con
  remesas > 0, con A-IC-LO/A-IC-HI de diseno; y A-P-COMPLEMENTO contado
  directamente. (2) SECUNDARIOS DECLARADOS: los conteos de embudo, el perfil de
  llaves opacas, y las DOS comparaciones que no se colapsan -- contra GEN1
  (delta y REPRODUCE/NO-REPRODUCE) y contra CALC-B-0001 (delta y
  REPLICA-RESULTADO/NO-REPLICA). NINGUN RESULT ES CAUSAL: R5.1 afirma
  `volatilidad / ausencia de Estado -> familia como seguro` y esto es la
  prevalencia del desenlace, no la flecha.

dependencias_materiales: [numpy, pandas]

parametros:
  fuente_acto: "ACTO GEN2-SPECS-DEMANDA-1 · CALC-ENIGH-0001 · celda de R5.1 sobre ENIGH 2022, del lado de la regla"
  firma_que_lo_autoriza: "Encargo de mesa del 15/sep/2026, verbatim en forense/encargos/2026-09-15-GEN2-SPECS-DEMANDA-1.md: «redactar y CONGELAR la spec ejecutable (md humana + spec.yaml, D-15, abriendo SOLO codebook y metadato -- E.5 lo permite en nube, microdato jamas)». La firma autoriza CONGELAR, no contar."
  bootstrap_replicas: 2000
  metodo_ic: "bootstrap de upm CON REEMPLAZO dentro de est_dis, conservando el numero de UPM por estrato; percentiles 2.5/97.5."
  regla_estrato_upm_unica: >-
    Un estrato con exactamente una UPM se re-muestrea a si mismo: aporta
    varianza cero. NO se colapsa y NO se descarta. Si el conteo es > 0,
    A-METODO-IC sale IC-CON-ESTRATOS-DE-UPM-UNICA y el IC se lee como LIMITE
    INFERIOR de la anchura verdadera.
  llaves_opacas: >-
    est_dis y upm se agrupan como CADENA CRUDA (dtype=str): normalizarlas
    partiria o fusionaria estratos en silencio. El perfil de anchos sale como
    RESULT de texto.
  replica_solo_sobre_el_punto: >-
    La semilla (20260915) y el numero de replicas (2000) de esta spec DIFIEREN
    de las del ensayo B (42 y 10000). Por eso A-REPLICA-B0001 se juega SOBRE EL
    PUNTO y nunca sobre los extremos del IC: dos bootstraps con semillas
    distintas no tienen por que coincidir en el quinto decimal del IC, y
    exigirlo fabricaria un falso NO-REPRODUCE.
  vocabulario_de_ejes: >-
    E.3, verbatim en su consecuencia: el mismo resultado con OTRO codigo es
    REPLICA-RESULTADO, no reproduccion. A-REPLICA-B0001 usa ese vocabulario y
    NUNCA `REPRODUCE`. A-REPRODUCE-GEN1, en cambio, compara contra una cifra
    GEN1 al grano que GEN1 publico (seis decimales).
  miembros_zip_declarados:
  - "conjunto_de_datos_concentradohogar_enigh2022_ns/conjunto_de_datos/conjunto_de_datos_concentradohogar_enigh2022_ns.csv"
  codebook_y_metadato_del_mismo_zip:
  - "conjunto_de_datos_concentradohogar_enigh2022_ns/diccionario_de_datos/diccionario_datos_concentradohogar_enigh2022_ns.csv"
  - "conjunto_de_datos_concentradohogar_enigh2022_ns/metadatos/metadatos_enigh_2022_ns.txt"
  codificacion:
    llave_hogar: [folioviv, foliohog]
    recibe_remesas_si: "remesas > 0"
  valores_gen1_referencia:
    A_P: 0.045694
    A_IC_LO: 0.043754
    A_IC_HI: 0.047711
  valores_b0001_referencia:
    P: 0.04569409956405095
    IC_LO: 0.043772848428537396
    IC_HI: 0.047770249605883566
    N: 90102
  n_gen1_referencia:
    U_A: 90102
  grano_gen1_decimales: 6
  criterio_adopcion: >-
    A-ADOPCION = LISTADO-PARA-MESA-REPRODUCE si A-REPRODUCE-GEN1 = REPRODUCE;
    LISTADO-PARA-MESA-NO-REPRODUCE en otro caso estimable;
    NO-ADOPTABLE-NO-ESTIMABLE si no hay punto. Este acto NO escribe cita en
    milpa/ bajo ninguna rama, y la restriccion T9 sobre CALC-B-0001 queda
    intacta: esta corrida no la invoca ni la levanta.

seed:
  aplica: true
  valor: 20260915
  rng: numpy.PCG64

tolerancia:
  tipo: flotante
  abs: 1.0e-10
  razon: >-
    Bootstrap fijado por seed + rng declarados y sumas en orden fijo de llave:
    la unica diferencia esperable entre dos corridas del mismo arbol es
    redondeo de float64 al reasociar sumas ponderadas. Los enteros y los textos
    se comparan EXACTO. Es tambien la tolerancia con la que A-REPLICA-B0001
    compara contra el punto de CALC-B-0001.

resultados:
  - {id: RESULT-ENIGH-G-N-MIEMBROS-ZIP, tipo: entero, unidad: "miembros del ZIP enigh2022_nc_csv.zip"}
  - {id: RESULT-ENIGH-G-N-FILAS-CONCENTRADOHOGAR, tipo: entero, unidad: "filas del miembro concentradohogar de 2022"}
  - {id: RESULT-ENIGH-G-N-COLUMNAS-CONCENTRADOHOGAR, tipo: entero, unidad: "columnas del miembro concentradohogar de 2022"}
  - {id: RESULT-ENIGH-G-LLAVE-HOGAR-UNICA, tipo: texto, unidad: "SI / NO -- folioviv+foliohog unica en el miembro"}
  - {id: RESULT-ENIGH-G-N-NULOS-REMESAS, tipo: entero, unidad: "filas con remesas nula (esperado 0; > 0 dispara NO-ESTIMABLE-NULOS-INESPERADOS)"}
  - {id: RESULT-ENIGH-G-PERFIL-EST-DIS, tipo: texto, unidad: "perfil de anchos del texto crudo de est_dis: 'ancho=k:n_filas;...'"}
  - {id: RESULT-ENIGH-G-PERFIL-UPM, tipo: texto, unidad: "perfil de anchos del texto crudo de upm"}
  - {id: RESULT-ENIGH-G-N-EST-DIS-DISTINTOS, tipo: entero, unidad: "estratos distintos en el universo"}
  - {id: RESULT-ENIGH-G-N-UPM-DISTINTAS, tipo: entero, unidad: "conglomerados (est_dis,upm) distintos en el universo"}
  - {id: RESULT-ENIGH-G-N-ESTRATOS-UPM-UNICA, tipo: entero, unidad: "estratos con exactamente una UPM"}
  - {id: RESULT-ENIGH-A-N-U, tipo: entero, unidad: "hogares del universo (GEN1 y CALC-B-0001 contaron 90102)"}
  - {id: RESULT-ENIGH-A-N-SIN-PONDERADOR, tipo: entero, unidad: "filas excluidas por factor vacio, no finito o <= 0"}
  - {id: RESULT-ENIGH-A-N-SIN-DISENO, tipo: entero, unidad: "filas del universo sin est_dis o sin upm (CALC-B-0001 conto 0)"}
  - {id: RESULT-ENIGH-A-P, tipo: proporcion, unidad: "proporcion ponderada de hogares con remesas > 0", permite_no_estimable: true}
  - {id: RESULT-ENIGH-A-P-COMPLEMENTO, tipo: proporcion, unidad: "proporcion ponderada de hogares con remesas == 0, CONTADA (nunca 1 - p)", permite_no_estimable: true}
  - {id: RESULT-ENIGH-A-SUMA-UNO, tipo: texto, unidad: "SI / NO:<residuo> -- A-P + A-P-COMPLEMENTO dentro de tolerancia"}
  - {id: RESULT-ENIGH-A-IC-LO, tipo: flotante, unidad: "percentil 2.5 del bootstrap de diseno", permite_no_estimable: true}
  - {id: RESULT-ENIGH-A-IC-HI, tipo: flotante, unidad: "percentil 97.5 del bootstrap de diseno", permite_no_estimable: true}
  - {id: RESULT-ENIGH-A-METODO-IC, tipo: texto, unidad: "IC-DE-DISENO / IC-CON-ESTRATOS-DE-UPM-UNICA / NO-ESTIMABLE-DISENO-INCOMPLETO"}
  - {id: RESULT-ENIGH-A-HOGARES-EXPANDIDOS, tipo: flotante, unidad: "suma de factor en el universo (CALC-B-0001 reporto 37560123.0)"}
  - {id: RESULT-ENIGH-A-DELTA-VS-GEN1, tipo: flotante, unidad: "A-P menos 0.045694, CON SIGNO", permite_no_estimable: true}
  - {id: RESULT-ENIGH-A-REPRODUCE-GEN1, tipo: texto, unidad: "REPRODUCE / NO-REPRODUCE / NO-ESTIMABLE -- round(A-P,6) == 0.045694"}
  - {id: RESULT-ENIGH-A-DELTA-VS-B0001, tipo: flotante, unidad: "A-P menos 0.04569409956405095, CON SIGNO", permite_no_estimable: true}
  - {id: RESULT-ENIGH-A-REPLICA-B0001, tipo: texto, unidad: "REPLICA-RESULTADO / NO-REPLICA / NO-ESTIMABLE -- |A-P - punto de CALC-B-0001| <= tolerancia. NUNCA se rotula REPRODUCE (E.3)"}
  - {id: RESULT-ENIGH-A-DELTA-IC-VS-B0001, tipo: flotante, unidad: "anchura de esta corrida menos la de CALC-B-0001, CON SIGNO -- lectura informativa: las semillas y las replicas difieren", permite_no_estimable: true}
  - {id: RESULT-ENIGH-A-ADOPCION, tipo: texto, unidad: "LISTADO-PARA-MESA-REPRODUCE / LISTADO-PARA-MESA-NO-REPRODUCE / NO-ADOPTABLE-NO-ESTIMABLE"}
