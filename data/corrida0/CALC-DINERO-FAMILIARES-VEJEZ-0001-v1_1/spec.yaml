# Lo UNICO que cambia respecto a la v1_0: (1) `script:` apunta al medidor.py de esta carpeta,
#   porque el script legado que la v1_0 nombra no expone `medir(inputs, contrato)` y el runner lo
#   declara NO-EJECUTABLE; el medidor REUTILIZA por import el cargador y el estimador de ese mismo
#   script legado (mismo codigo, misma semilla 42) y solo redirige la ruta al payload que preflight
#   resolvio (P1); (2) `spec.md` existe en la carpeta (la v1_0 lo declaraba por sha256 sin traerlo);
#   (3) `repite_de` en la raiz; (4) etiquetas de proceso (firma de contador del lanzamiento,
#   medidor congelado aqui). Universo, variables, ponderador, transformacion, estimando, parametros,
#   tolerancia e ids de RESULT: VERBATIM de la v1_0.
# CALC-DINERO-FAMILIARES-VEJEZ-0001 -- cara mecanica de spec.md (ACTO GEN2-SPECS-DEMANDA-2).
