  c5_cita: "milpa/tramite.yaml:497 -- evade_norma_envipe2025 p=0.562774 clase MEDIDO, copia del arbitro (enmienda_envipe2025, firma b1); diagnostico |0.562774 - R| por celda en COMMIT-3"
  p_nacional_c5: 0.562774
  l_estado: "NO-ENTRA por Firma 1 (`Sin L`)"
  criterio_indecidible_verbatim: "si ambos caen dentro del IC de R o si |d_L-d_M| < 0.5*EE(R)"
