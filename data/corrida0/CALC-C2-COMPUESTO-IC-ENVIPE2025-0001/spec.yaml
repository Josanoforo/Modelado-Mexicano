# CALC-C2-COMPUESTO-IC-ENVIPE2025-0001 -- cara mecanica de spec.md.
# ACTO GEN2-GUARDIAN-ENVIPE-EJES-IC-1 (20/sep/2026), P2 / COMMIT-1; corrida en COMMIT-2.
# Gobierna forense/prereg-caja/C2-COMPUESTO-IC-ENVIPE2025-spec-v1_0.md, congelada
# en el COMMIT-1 junto con la extension del guardian y el medidor, ANTES de abrir
# un solo byte de ENVIPE 2025 fuera del control (iii) de P1.
# La lista de RESULT por celda se GENERO desde c2-compuesto-emisiones-v1_0.tsv
# (38 filas ola = ENVIPE 2025), no se tecleo.
calc_id: CALC-C2-COMPUESTO-IC-ENVIPE2025-0001
spec_md: spec.md
