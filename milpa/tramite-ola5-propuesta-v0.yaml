    universo: "los 163 municipios de Coahuila (38) y del Estado de Mexico (125) presentes en los DOS anos con lista nominal > 0. Universo efectivo = universo nominal: 38 de 38 y 125 de 125, ninguno perdido. Excluidas y nombradas 7 filas que no son municipios (4 en Coahuila 2023, 3 en Edomex 2023); la exclusion se comprueba aritmeticamente: la suma de los 38 municipios de Coahuila 2023 (1343764 / 2355025) mas la fila VMRE_VA_VPPP reproduce exactamente el total que publica el IEC (1344882 / 2377964)."
