universo: >-
  ENIF 2021, persona elegida de 18 anos y mas. Cuenta y credito separados.
  Para cada familia: filtro fintech=1, canal en catalogo sustantivo y FAC_ELE
  finito positivo. Especiales de canal y filtro se cuentan fuera. 2018 no
  entra por ruptura; 2024 entra solo al guardia puntual ya publicado.
filtros: >-
  Canal 9, blanco o fuera de catalogo sale del denominador y se reporta.
  Ponderador ausente/no finito/no positivo sale y se cuenta. La falta de
  diseno no cambia el punto; se cuenta y sale de la varianza.
ponderador: FAC_ELE de TMODULO 2021; unidad persona. El control usa FAC_PER 2024.
transformacion: >-
  Distribucion nominal por codigo fisico de cada ola. No se fusionan canales.
  p_c=sum(FAC_ELE*I[c])/sum(FAC_ELE) sobre el denominador de familia.
estimando: >-
  Descriptivo: canal del ultimo producto de la familia entre personas con
  tenencia de la categoria fintech; no canal del producto fintech exacto.
precision: >-
  Linealizacion de razon por conglomerado ultimo, UPM_DIS dentro de EST_DIS,
  muestra completa para dominio; IC95 normal truncado [0,1]. Singleton se
  reporta y no aporta grados de libertad.

