  - {archivo: Mexico-2023-full-data.dta, variable: j15, rol: evento-licencia-operacion}

universo: >-
  El mismo del padre: establecimientos formales privados cubiertos por WBES
  Mexico 2023, con cinco o mas empleados y en sectores incluidos.
filtros: >-
  Exactamente los del padre. Clasificable si esta expuesto al compuesto y el
  desenlace compuesto es si/no; fuera del dominio aporta cero a la varianza.
ponderador: wmedian
transformacion: >-
  Razon de totales ponderados Y/X compartiendo observaciones; linealizacion
  de Taylor estratificada WR sobre muestra completa.
estimando: >-
  Los cinco puntos condicionados a clasificables ya publicados por el padre;
  esta corrida solo agrega precision muestral tipada.
precision: >-
  IC-APROXIMADO-CONDICIONAL-A-SUPUESTOS. Dos escenarios preespecificados:
  SINGLETON-CERTEZA y SINGLETON-AVERAGE; sin FPC; IC95 logit-t con
  gl=sum_h(n_h-1). Frontera p=0/1 no estimable.

dependencias_materiales:
  - scipy
seed: {aplica: false, valor: null, rng: NO-APLICA}
tolerancia:
  tipo: flotante
  abs: 1.0e-10
  razon: calculo determinista; puntos contrastados al grano de 12 decimales del padre

parametros:
  padre: CALC-WBES2023-CORRUPCION-DESCRIPTIVA-0001
  dominios: [TOTAL, PEQUENA, MEDIANA, GRANDE, EXTRA-GRANDE]
  estrato: strata
  unidad_muestreo: establecimiento-idstd
  escenarios_singleton: [SINGLETON-CERTEZA, SINGLETON-AVERAGE]
  fpc: NO-APLICADA
  intervalo: LOGIT-T-95
  output: forense/analisis/wbes2023-precision-1/wbes2023-precision.csv
  adopcion: NINGUNA

