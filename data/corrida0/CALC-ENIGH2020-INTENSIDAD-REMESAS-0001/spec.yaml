  - {id: IN-CALC-ENIGH2022-INTENSIDAD-REMESAS-0001-SPEC, origen: repo, ruta: data/corrida0/CALC-ENIGH2022-INTENSIDAD-REMESAS-0001/spec.md, sha256: e3e845dbc94b6834594f4aeeb4ea1e3d475ecf15ef3d47e8e3228d27a7e7195c}

variables:
  - {archivo: conjunto_de_datos_concentradohogar_enigh_2020_ns.csv, variable: folioviv, rol: primera parte de llave unica de hogar como texto}
  - {archivo: conjunto_de_datos_concentradohogar_enigh_2020_ns.csv, variable: foliohog, rol: segunda parte de llave unica de hogar como texto}
  - {archivo: conjunto_de_datos_concentradohogar_enigh_2020_ns.csv, variable: factor, rol: ponderador de hogar finito y positivo}
  - {archivo: conjunto_de_datos_concentradohogar_enigh_2020_ns.csv, variable: remesas, rol: ingreso trimestral por P041 en pesos de 2020}
  - {archivo: conjunto_de_datos_concentradohogar_enigh_2020_ns.csv, variable: ing_cor, rol: ingreso corriente trimestral que incluye remesas via transfer}
  - {archivo: conjunto_de_datos_concentradohogar_enigh_2020_ns.csv, variable: est_dis, rol: estrato de diseno como texto opaco}
  - {archivo: conjunto_de_datos_concentradohogar_enigh_2020_ns.csv, variable: upm, rol: conglomerado como texto opaco}

universo: "Marco completo de hogares del concentrado ENIGH 2020; dominio receptor remesas>0; dominio de participacion anade ing_cor>0 valido."
filtros: "Nulos, no finitos y negativos no se convierten en cero. Excluir ing_cor ausente/no finito, cero o negativo solo de participacion y reportar n y masa por motivo."
ponderador: "factor de hogar, sin normalizar, redondear, truncar ni winsorizar"
transformacion: "media remesas=sum(w*r)/sum(w); mediana=inversa izquierda CDF ponderada; media hogar=sum(w*r/y)/sum(w); agregada=sum(w*r)/sum(w*y); ge50=sum(w*I[r/y>=.5])/sum(w)"
estimando: "Cinco descriptores entre receptores; participacion estrictamente contable, transversal y no causal."
dependencias_materiales: [numpy]

parametros:
  miembro_estadistico: "conjunto_de_datos_concentradohogar_enigh_2020_ns/conjunto_de_datos/conjunto_de_datos_concentradohogar_enigh_2020_ns.csv"
  unidad_monetaria: pesos de 2020 por trimestre normalizado
  anualizacion: NO
  deflacion_propia: NO
  cuantila_ponderada: "menor valor con CDF ponderada acumulada >=0.5; sin interpolacion"
  tolerancia_componente_pesos: 0.01
  prevalencia_padre: 0.04377543852935772
  tolerancia_prevalencia: 1.0e-10
  bootstrap_replicas: 2000
  metodo_ic: "bootstrap de upm con reemplazo dentro de est_dis sobre marco completo; contribuciones cero fuera del dominio; tres cocientes completos por replica; percentiles 2.5/97.5"
  tratamiento_upm_unica: "se remuestrea a si misma, aporta variacion cero y se reporta; no se afirma cota inferior garantizada"

seed: {aplica: true, valor: 20260916, rng: numpy.PCG64}
tolerancia: {tipo: determinista, exacto_por_seed: true, abs: 0.0}

