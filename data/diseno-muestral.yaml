  procedencia: 'Descargas Manuales/F00010701-WVS7_Sample_Design_Mexico_2018.pdf (raíz descargas_mx,
    extraído con pdftotext -layout, documento completo de 45 líneas): "A multi-stage probability
    sampling was employed using the National Elections Institute (INE) list of electoral sections
    updated for the 2018 presidential elections and stratified by urban-rural-mixed categories by
    INE... A total of 496 electoral sections were selected... The dataset included a weight
    variable based on population distributions by sex, age, and education." Nombres de columna
    (W_WEIGHT, I_PSU, H_URBRURAL) confirmados abriendo WVS_Wave_7_Mexico_Stata_v5.1.dta con
    pandas.read_stata (variable_labels()), no están en el PDF de diseño (que no nombra columnas).'
  notas: 'Verificación cruda: W_WEIGHT, I_PSU, H_URBRURAL las tres 1741/1741 no vacías; I_PSU con
