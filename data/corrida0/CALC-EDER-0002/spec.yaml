  firma_de_contador: "FP-375, FIRMA DE MESA 15/sep/2026, verbatim: «Mesa, 15/sep/2026 · OBJETO: cuenta_gen2 = SI para las cuatro corridas selladas por el lote; no adopta al motor.» Estandar FP-367/368 satisfecho (autoridad + fecha + OBJETO) -> cuenta_gen2 = SI; fila FP-375 cerrada, ver forense/firmas-pendientes.tsv y data/corrida0/decisiones.tsv."
  contaminacion_declarada: "ADR-46 -- al congelar, la sesion YA habia leido: p=0.057531, ic95, n=9397, universo y embudo de C1 (94101/23831/16687/9397, distribucion de parentesco propio) y su reserva sobre factor_per; y todos los RESULT de CALC-EDER-0001 (291 est_dis, 3780 upm, 3 estratos de UPM unica, perfil est_dis ancho 3, factor_per +0.07 pp sobre la tasa de fase 1). Lo genuinamente desconocido al congelar: estratos y UPM que cubre el universo Jefe/Conyuge, cuantos quedan con UPM unica, la anchura del IC de diseno, el signo y tamano de factor_per - factor sobre ESTE estimando, cuantos ego carecen de factor_per."
