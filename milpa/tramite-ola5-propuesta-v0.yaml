    reserva: |-
      EL IC95 NO CRUZA CERO -- el intervalo entero esta por encima, y su extremo
      inferior son casi 10 puntos porcentuales. La reserva NO es de precision,
      es de IDENTIFICACION, y estaba escrita en el commit de spec ANTES de medir
