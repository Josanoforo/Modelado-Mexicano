- id: hitoD_fase1_ediciones_requieren_navegador
  fecha: '2026-07-30'
  hecho: >
    Corolario 2 del encargo (Hito D Fase 1, ampliación del Paso 4): distinguir "requiere navegador"
    de "no existe". Las siguientes ediciones SÍ existen (página real, no "Página no encontrada")
    pero no se bajaron por script -- no se forzó ningún mecanismo (login, formulario POST,
    SPA sin enlace estático). Se listan aquí para que quede constancia de qué se intentó y
    por qué no se completó, sin tratarlas como inexistentes:

    ENCIG: 2011, 2013 (sin JSON-LD ni patrón datosabiertos localizable) · 2025 (JSON-LD trae
    solo un placeholder de plantilla, sin distribución real -- probablemente aún no publicada,
    no confirmable por script).

    ENIF: 2012, 2015 (mismo patrón: sin distribución real localizable).

    ENIGH (modalidad nc): 2008, 2010 (sin distribución localizable) · 2024 (JSON-LD con placeholder
    de plantilla, no publicada aún).

    ENUT: 2009, 2014, 2019, 2024 -- ninguna edición expone zip estático bajo los patrones
    de nombre probados (datosabiertos/microdatos); 2024 tiene JSON-LD con placeholder de plantilla.

    Corrección, misma fecha, verificado por navegador por el autor: la premisa anterior era
    un límite del instrumento -- los patrones de URL que este script probó -- no una propiedad
    del portal real. El portal expone las cinco ediciones (2002, 2009, 2014, 2019, 2024),
    cada una con base, descriptor de archivos y diagrama entidad-relación, desde la pestaña
    Microdatos. Ninguna se ha descargado todavía -- sigue pendiente, ahora por razón distinta:
    existe y es alcanzable, falta bajarla, no falta localizarla (mismo patrón que D-06/regla
    v2.2 en cola.yaml -- una ausencia medida con un instrumento, heredada como propiedad del
    terreno). Ver cola.yaml D-08.

    ENCUCI: 2020 (sin distribución localizable). 2012 aparenta vivir en una ruta legada distinta
    de la plantilla actual -- no explorada más a fondo en esta sesión.

    Corrección, misma fecha: 2020 sí expone descarga directa desde la pestaña Microdatos --
    Descargar todos los archivos --, verificado por navegador por el autor, quien la bajó
    y esta sesión la registró (encuci2020_bd_dbf, encuci2020_fd_pdf). Deja de estar pendiente.
    2012 sigue sin explorar más a fondo -- sin cambio.

    ENSANUT: host real es ensanut.insp.mx (INSP), NO inegi.org.mx. Ediciones reales confirmadas
    por estructura de navegación propia: 2006, 2012, 2016, 2018, y ENSANUT Continua 2020-2024
    (2025/2026 solo tienen página de presentación, sin sección de descargas -- probablemente
    no publicadas). El portal expone un acordeón real de archivos por módulo, pero el nombre
    de archivo viaja codificado en un campo de formulario cuyo único <form action> apunta
    de vuelta a la misma página (POST autodirigido, no un GET estático) -- replicar ese envío
    sin más instrucción habría sido forzar el mecanismo, así que se clasifica "requiere navegador"
    para las seis ediciones con sección de descargas real.

    Ninguna de estas búsquedas abrió un cuestionario, diccionario de datos, manual de codificación
    ni base -- solo se verificó existencia de página (título) y presencia/ausencia de un enlace
    de archivo verificable por Content-Type/Content-Length.

