variables:
  - {archivo: "corridas-L/*__v1_3.json", variable: valor_extraido, rol: "cifra de la respuesta libre del corredor L, ya extraida por tools/extrae_l_v1_1.py sobre texto_crudo -- este medidor RE-EXTRAE de texto_crudo con el mismo extractor (valor_extraido de la captura cruda es siempre null, nunca poblado a la captura)", codigos: "flotante en [0,1] o null (NO-EXTRAIBLE)"}
  - {archivo: "corridas-L/*__v1_3.json", variable: id_celda, rol: "identidad de celda -- verificada contra el nombre de archivo (assert)", codigos: "CIV-M-01..13"}
  - {archivo: "corridas-L/*__v1_3.json", variable: variante, rol: "L-solo | L+corpus -- verificada contra el nombre de archivo (assert)", codigos: "texto"}
  - {archivo: "corridas-L/*__v1_3.json", variable: fuente_citada, rol: "campo estructurado de cita documental -- leido para la secundaria (b), siempre null en las 48 capturas L+corpus examinadas", codigos: "texto o null"}
  - {archivo: "CALC-R-CIV-M-*/resultados.json", variable: "RESULT-R-{id}-PUNTO / -EE", rol: "arbitro R y su error estandar, citados por id, no recalculados", codigos: "flotante en [0,1] / flotante > 0"}
  - {archivo: "corridas-M/M-*.json", variable: valor_punto, rol: "M (corredor de reglas), contexto sin poder de veto", codigos: "flotante en [0,1]"}

universo: >-
  Las 6 celdas de marco-M-sorteado-v1_3.tsv con arbitro R ya calculado
  (CIV-M-01, CIV-M-02, CIV-M-04, CIV-M-10, CIV-M-12, CIV-M-13 -- ENVIPE
  2012/2013/2015/2021/2023/2024, denuncia_con_miedo_o_desconfianza). Las
  otras 8 celdas del marco de 14 (DIN-M-01, FAM-M-01/05/06/07,
  TRA-M-02/03/07) NO tienen arbitro R y quedan fuera del universo pareado
  por construccion (spec sellada Sec.5: "con R/EE(R) computado y ambos
  brazos disponibles") -- se citan solo para la cobertura del marco
  completo (RESULT-DUELO-COBERTURA-*), nunca para la pareada.

filtros: >-
  Por celda y variante: de las 8 replicas, entran a la mediana solo las que
  el extractor marca EXTRAIBLE; las NO-EXTRAIBLE (el modelo se abstiene sin
  numero reconocible) NO se imputan ni se sustituyen -- si CERO de 8 son
  EXTRAIBLE, agregado(brazo) = null y esa celda no entra al universo
  pareado por ese brazo (permite_no_estimable declarado en el resultado).
  Ninguna celda de las 6 quedo asi en esta corrida (medido, no supuesto).

ponderador: NO-APLICA -- no hay ponderador muestral; el "peso" de cada
  celda en el bootstrap es 1 (remuestreo de celdas, no de personas).

transformacion: >-
  z_LSOLO = (agregado(L-solo) - R) / EE(R); z_LCORPUS = (agregado(L+corpus)
  - R) / EE(R); dif_abs_pareada = |z_LCORPUS| - |z_LSOLO|. Bootstrap de la
  MEDIA de dif_abs_pareada sobre el universo pareado, reutilizando SIN
  EDITAR generar_indices_bootstrap/derivar_seed_scope de
  scoring-adv1-m3.py, con scope_id="F5-DUELO-CALC-transferencia-pareada".
  agregado(brazo) = mediana (pipeline-L-adv1-m2.py::agregar_continua, sin
  editar). Precedencia de banda (delta=0.5) aplicada al numero bruto
  EXACTAMENTE como la spec sellada Sec.5 la fija -- ver RESULT-DUELO-
  PAREADA-VEREDICTO-BANDA-BRUTO. El veredicto ADOPTADO no sigue esa banda
  por el hallazgo de instrumento (ver arriba).

estimando: >-
  DESCRIPTIVO Y DIAGNOSTICO. (1) PRIMARIO declarado por la spec sellada:
  la pareada dif_abs_pareada -- este acto la CALCULA (transparencia) pero
  NO la ADOPTA como veredicto (RESULT-DUELO-PAREADA-VEREDICTO-ADOPTADO =
  INCONCLUSO, razon de instrumento). (2) DIAGNOSTICO, el hallazgo real de
  este acto: cuantas capturas carecen del encabezado que el extractor
  espera, y ejemplos verificados a mano de captura indebida. (3)
  SECUNDARIA (b) USO DOCUMENTAL: descriptiva, campo estructurado
  fuente_citada, acotada a las 6 celdas del panel. (4) COBERTURA: citada
  del manifiesto sellado de RECAPTURA-L, no recalculada. NINGUN RESULT
  adopta la pareada primaria como adjudicacion de la tesis del programa --
  esa adjudicacion queda para un sucesor con instrumento de extraccion
  validado.

dependencias_materiales: []

parametros:
  fuente_acto: "ACTO GEN2-F5-DUELO-CALC · CALC-DUELO-0001"
  firma_que_lo_autoriza: "Firma de mesa 9/sep/2026, verbatim en el encargo archivado: «Encargo f5 corriendo, revisa este de chatpgt y dame este encargo y los que siguen de Gen2, necesito que medes al menos 5 encargos a correr en claude code, no me separas los que te estoy pidiendo, dame 5 completos.» -- 5/5 del despacho. Y, con OBJETO explicito sobre el contador: «cuenta_gen2 = SI para el CALC del duelo que este acto selle»."
  bootstrap_seed: 42
  bootstrap_replicas: 10000
  nivel_ic: 0.95
  delta_banda: 0.5
  scope_id_bootstrap: "F5-DUELO-CALC-transferencia-pareada"
  k_replicas_l: 8
  celdas_universo_r: [CIV-M-01, CIV-M-02, CIV-M-04, CIV-M-10, CIV-M-12, CIV-M-13]

seed:
  aplica: true
  valor: 42
  rng: "random.Random (stdlib, via scoring-adv1-m3.py::generar_indices_bootstrap)"

tolerancia:
  tipo: flotante
  abs: 1.0e-9
  razon: >-
    Bootstrap fijado por seed + scope_id declarados, sumas en orden fijo de
    celda (mismo orden que CELDAS_R): la unica diferencia esperable entre
    dos corridas de este medidor es redondeo de float de la reasociacion de
    sumas. Los textos (veredictos, ids, fragmentos) se comparan EXACTO.

resultados:
