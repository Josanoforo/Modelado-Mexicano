  - {id: RESULT-ENCRIGE-DES-G-N-FILAS-SALIDA, tipo: entero, unidad: filas indicador-dominio}
  - {id: RESULT-ENCRIGE-DES-G-MAX-DELTA-FORMULA, tipo: flotante, unidad: tasa por 10000}
  - {id: RESULT-ENCRIGE-DES-G-MAX-DELTA-DOBLE-LECTURA, tipo: flotante, unidad: tasa por 10000}
  - {id: RESULT-ENCRIGE-DES-G-CSV-SHA256, tipo: texto, unidad: sha256}
