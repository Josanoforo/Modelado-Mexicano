etiquetas:
  generacion: GEN2
  tipo: ADJUDICACION-DEL-DUELO-PROSPECTIVO (COMMIT-3)
  cuenta_gen2: SI
  uso_motor: NO-ADOPTA-NADA
  fuente_acto: GEN2-ENIGH2024-DUELO-COMMIT-2-3 (22/sep/2026) -- pieza construida aqui porque
    ACTO GEN2-ENIGH2024-SERIE-Y-COMMIT-1 (#988) solo dejo EMISIONES y ORIGEN-MOVIL sellados
  diseno: forense/prereg-caja/DISENO-duelo-prospectivo-ENIGH2024-v1_0.md (Sec5 regla de
    adjudicacion, Sec6 B-bis, con la linea de adopcion de FP-260921-GEN2-ENIGH2024-RESERVA-Y-DISENO-1-b7ae-02)
  firma_vigente: FP-260921-GEN2-ENIGH2024-RESERVA-Y-DISENO-1-b7ae-02 (adopcion del diseno,
    asentada por este acto en su Sec2)
  medidor_ejecutado_al_congelar: "NUNCA sobre ENIGH 2024; este medidor compone RESULT ya
    sellados de CALC-ENIGH-DUELO-ORIGEN-MOVIL-0001 (real) y no ha visto ninguna cifra de 2024
    al escribirse -- congelado antes de que corra el run de CALC-ENIGH-DUELO-EMISIONES-0001"
  consume: CALC-ENIGH-DUELO-EMISIONES-0001 (a sellar en COMMIT-2 de este acto; sha fijado en
    COMMIT-3a) y CALC-ENIGH-DUELO-ORIGEN-MOVIL-0001 (ya sellado por #988)
  congelado: "SI -- preflight bloqueado solo por emisiones_selladas (aun no corrida;
    COMMIT-2/3a pendientes, ver parametros.commit_3a); origen_movil_sellado ya tiene sha real"

inputs:
- id: emisiones_selladas
  origen: repo
  ruta: data/corrida0/CALC-ENIGH-DUELO-EMISIONES-0001/resultados.json
  sha256: b604c4be9b16d7c0f73ad03840e2cc417439b343e1f994918ae058d4aaa1ebef
- id: origen_movil_sellado
  origen: repo
  ruta: data/corrida0/CALC-ENIGH-DUELO-ORIGEN-MOVIL-0001/resultados.json
  sha256: 3f9180a6055954db171136ca87c63e0d1a846bf95ae91662a46c5ce03851b944

variables:
- archivo: CALC-ENIGH-DUELO-EMISIONES-0001/resultados.json
  variable: RESULT-ENIGHEM-R-P / R-ESTADO / R-IC95-JSON / PREDICCIONES-JSON
  rol: punto de 2024 y las cinco predicciones ya emitidas (COMMIT-2), consumidas sin re-abrir el zip
- archivo: CALC-ENIGH-DUELO-ORIGEN-MOVIL-0001/resultados.json
  variable: 'RESULT-ENIGHDM-{CID}-MAE-PP / COBERTURA-R-EN-IC-CAND'
  rol: error medio absoluto y cobertura retrospectivos, ya sellados, por contendiente

universo: 'Una sola celda nacional (remesas>0, hogares), adjudicacion del duelo prospectivo
  ENIGH 2024 sobre el punto de 2024 emitido en COMMIT-2. Nivel cruce y marginal-por-eje:
  NO-CONSTRUIBLE (DISENO Sec3/Sec4.3) -- no hay historia de cruce ni de marginal-por-eje en
  ENIGH, se declara fijo, no se calcula.'
filtros: 'Ninguno propio: compone sobre RESULT ya sellados de los dos CALC de entrada, no lee
  microdato ni recalcula el punto de 2024 ni la retrospectiva.'
ponderador: NO-APLICA
transformacion: 'Por contendiente: error_pp = 100*(p_hat - R_2024) con signo; dentro_IC en las
  dos direcciones contra los IC95 ya sellados. Veredicto por retador (DISENO Sec5): VENCE-AL-PISO
  si |error| < |error(C-PISO)| en 2024 Y MAE-retrospectivo < MAE-retrospectivo(C-PISO); solo la
  primera condicion: PROPUESTA-CON-RESERVA; ninguna: NO-VENCE. Veredicto general: C-PISO-ADOPTADO
  si ningun retador VENCE. B-bis-1/2/3-4 con vocabulario cerrado, ver medidor.py docstring para
  la operacionalizacion de B-bis-2 (T2/T3/TS vs C-MEDIA con la misma regla de dos condiciones).'
estimando: 'Veredicto B-bis del duelo prospectivo ENIGH 2024 a nivel nacional (DISENO Sec5/Sec6);
  no adopta nada al motor (cuenta_gen2 = SI, no adopta, cabecera del encargo).'
precision: 'Ninguna propia: hereda el bootstrap UPM-en-estrato de EMISIONES (2000 replicas,
  seed 20260921) y el metodo delta de ORIGEN-MOVIL (ver tools/enigh_duelo_nacional.py). Esta
  CALC no re-muestrea ni re-estima nada, solo compone y adjudica.'
dependencias_materiales: [numpy]

parametros:
  ola_nueva: 2024
  contendientes: [C-PISO, C-T2, C-T3, C-TS, C-MEDIA]
  retadores: [C-T2, C-T3, C-TS, C-MEDIA]
  retadores_de_tendencia: [C-T2, C-T3, C-TS]
  commit_3a: 'antes de correr: escribir en inputs.emisiones_selladas.sha256 el sha256 de
    data/corrida0/CALC-ENIGH-DUELO-EMISIONES-0001/resultados.json SELLADO (COMMIT-2 de este
    acto); ninguna otra edicion'

seed: {aplica: false}
tolerancia: {tipo: determinista, exacto_por_seed: true, abs: 0.0, razon: 'composicion
  deterministica de resultados ya sellados; ningun muestreo propio'}

