    S2: secundaria
    S3: media superior
    S4: superior
  rotulos_dominio:
    D1: Rural
    D2: Complemento urbano
    D3: Urbano
  codigos_bp1_23_numerador:
  - '04'
  - '05'
  - '06'
  - 08
  universo_bp1_20:
  - '1'
  - '2'
  bootstrap_replicas: 10000
  umbral_soporte_n: 200
  pisos:
  - C1
  - C2
  challengers:
  - C6
  - C7
  criterio_indecidible_verbatim: si ambos caen dentro del IC de R o si |d_L-d_M| < 0.5*EE(R)
  criterio_indecidible_fuente: forense/CAREO-ADV-DUELO-diseno-v2-2026-08-19.md:38
  ee_r_formula: (IC95sup - IC95inf)/3.92
  escala_d: 'puntos porcentuales: d = 100*|p - R|; el umbral 0.5*EE(R) se lleva a la misma escala (x100)'
  umbral_celdas_gana: 9
  umbral_celdas_puntuadas: 9
  umbral_fuera_de_soporte: 4
  orden_de_parada: FUERA-DE-SOPORTE (>= 4 celdas sin soporte en alguna ola) -> INDECIDIBLE (PUNTUADA < 9 o todas
    INDECIDIBLES) -> ADJUDICADA (algun challenger vence a los dos pisos en >= 9 PUNTUADA) -> SIN-CANDIDATO-SUPERIOR
  precedencia: entre INDECIDIBLE y ADJUDICADA manda INDECIDIBLE; si los dos challengers cumplen, AMBOS-DECIDE-MESA
  paradas_admisibles:
  - ADJUDICADA
  - INDECIDIBLE
  - SIN-CANDIDATO-SUPERIOR
  - FUERA-DE-SOPORTE
  b_bis_c1: persistencia anual corroborada en TRA (nadie vence a C1 en >= 9 celdas)
  b_bis_c2: '''marginales actuales sin interaccion'' es el estimador honesto de celda para esta familia; la interaccion
    de olas previas no aporta BAJO ESTOS CANDIDATOS -- resultado de programa, cambia el marcador. Solo eso dice
    (H5): no identifica ausencia de interaccion ni una propiedad de la poblacion'
  b_bis_c6_c7: primer estimador por celda que explota interaccion
  b_bis_c7_no_c6: una ola sola trae ruido
  limite_de_la_evaluacion: si el ganador se ELIGE con las 12 celdas, esa misma evaluacion no lo valida de forma
    independiente (H5). Seleccion mas desempeno conjunto, nunca desempeno independiente.
  signo_modulacion: 'respecto del nacional 0.562774: ESTABLE si todo el IC95 del candidato queda del mismo lado
    que R; AMBIGUA si lo cruza; CONTRARIA si queda del lado opuesto'
  p_nacional_c5: 0.562774
  p_nacional_c5_fuente: milpa/tramite.yaml:497 -- clase MEDIDO, copia del arbitro (enmienda_envipe2025, firma b1)
  c5_rol: COMPLEMENTO / diagnostico puro; fuera de la competencia porque el emisor es el arbitro con otro nombre
  champion: NINGUNO
  adopcion: NINGUNA
  tol_oro_0001: 1.0e-10
secuencia_commits:
  commit_2: corrida0 run de CALC-ENVIPE2025-PISOS-EVADE-NORMA-SXD-0001; sello; asiento de replay; commit y push.
  commit_3a: 'commit aparte: rellena el sha256 de piso_c2_resultados y piso_c2_sello; preflight VERDE. Ninguna otra
    linea cambia.'
  commit_3: corrida0 run de este CALC; sello; celda-D; decisiones.tsv; asientos.
  preflight_esperado_antes_del_commit_3a: BLOQUEADO exactamente por los dos inputs del piso -- y por nada mas.
