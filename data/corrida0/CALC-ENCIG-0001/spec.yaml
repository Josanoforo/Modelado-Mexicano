  firma_que_lo_autoriza: "Firma de mesa 9/sep/2026, verbatim: «Encargo ACTO GEN2-R-SERIE-DBF corriendo PR's mergeados, dame los siguientes encargos.» -- ordena el lote. Y, con OBJETO explicito sobre el contador, el parrafo del propio encargo: «cuenta_gen2 = SI para el CALC que este acto selle». Estandar FP-367/368 satisfecho."
  bootstrap_replicas: 2000
  umbral_replica_gen1: 1.0e-6
  grano_milpa_decimales: 6
  metodo_ic: "bootstrap de UPM_DIS CON REEMPLAZO dentro de EST_DIS, conservando el numero de UPM por estrato; percentiles 2.5/97.5"
  regla_estrato_upm_unica: >-
    Un estrato con exactamente una UPM se re-muestrea a si mismo: aporta
    varianza cero. NO se colapsa (decision de diseno que esta spec no esta
    autorizada a tomar) y NO se descarta (sesgaria el punto). Si el conteo es
    > 0, METODO-IC sale IC-CON-ESTRATOS-DE-UPM-UNICA y el IC se lee como LIMITE
    INFERIOR de la anchura verdadera, nunca como IC exacto.
  llaves_opacas: >-
    EST_DIS y UPM_DIS se agrupan como CADENA CRUDA. Nunca se convierten a
    entero ni se re-rellenan a un ancho tomado del descriptor: normalizarlas
    partiria o fusionaria estratos en silencio (leccion de ACTO
    GEN2-LOTE-ENVIPE-1 §3.4, donde el descriptor iba desfasado respecto de su
    propio microdato).
  ranura_no_preregistrada: >-
    Nadie pre-registro el metodo de IC para estas series. Lo elige el ejecutor
    sobre ranura vacia, se declara y se eleva a mesa. NO se espera coincidencia
    digito a digito de los extremos con los IC95 GEN1.
  tablas:
    persona: "encig2025_01_sec1_A_3_4_5_8_9_10.csv"
    tramites_calidad: "encig2025_04_sec_7.csv"
    tramites_corrupcion: "encig2025_05_sec_8.csv"
  codificacion:
    A_sol1_uno: [1]
    A_sol1_cero: [2]
    A_incisos_solany: [P8_3_1, P8_3_2, P8_3_3]
    B_uno: [1]
    B_cero: [0]
    B_canal_presencial: [1]
    B_canal_digital: [3, 4, 5]
    B_canal_residuo: [2, 6, 7, 8, 9]
    C_adopta: [4, 5]
    C_no_adopta: [1, 2, 6]
    C_residuo: [3, 7, 8, 9]
    C_tipo_tramite: 1
    X_dio_algo: [2, 3, 4, 5, 6, 7]
    X_no_dio: [1]
  valores_gen1_referencia:
    A-P-SOL1: 0.085118
    B-P-PRE-CD: 0.116000
    B-P-DIG-CD: 0.027358
    B-P-PRE-SD: 0.141041
    B-P-DIG-SD: 0.029868
    C-P-ADOPTA: 0.673393
  complementos_gen1_referencia:
    RES-0004: 0.914882
    RES-0010: 0.884000
    RES-0012: 0.972642
    RES-0014: 0.858959
    RES-0016: 0.970132
    RES-0022: 0.326607
  criterio_adopcion_p3: >-
    CANTIDAD-MEDIDA (recibe cita corrida0_resultado_id + corrida0_generacion:
    GEN2 en milpa/tramite.yaml) si y solo si (1) su numerador es una categoria
    declarada del reactivo contada DIRECTAMENTE -- no 1 menos otra cosa -- y
    (2) round(medido, 6) == valor sellado. En otro caso
    COMPLEMENTO-CON-DENOMINADOR-RECORTADO: SIN cita y con fila NC de
    advertencia (patron NC-0085 del lote ENVIPE). La medicion decide, no la
    lista: si el residuo de un par pesa exactamente 0, su complemento SI es
    cantidad medida.
  adopcion_p3:
    consumidores:
      RES-0003: "milpa/tramite.yaml:tramite.mordida.discrecional:paga_mordida_encig2025 <- A-P-SOL1"
      RES-0009: "…:tramite.mordida.con_registro:paga_mordida_encig2025_presencial <- B-P-PRE-CD"
      RES-0011: "…:paga_mordida_encig2025_digital <- B-P-DIG-CD"
      RES-0013: "…:paga_mordida_encig2025_presencial_r2 <- B-P-PRE-SD"
      RES-0015: "…:paga_mordida_encig2025_digital_r2 <- B-P-DIG-SD"
      RES-0021: "…:tramite.gobierno_digital.util_sin_coercion:adopta_encig2025_luz <- C-P-ADOPTA"
    nota: >-
      La celda que se cita NO es siempre la primaria de esta spec. Para la
      familia A la primaria es SOLANY y la adoptable es SOL1: son
      codificaciones distintas y adoptar la primaria cambiaria en silencio el
      significado del parametro del motor. La unica celda con la MISMA
      codificacion que el valor ya materializado es la que se cita.
