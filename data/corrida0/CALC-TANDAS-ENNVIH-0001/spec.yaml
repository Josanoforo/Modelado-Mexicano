  - {archivo: iiib_cr.dta, variable: cr05c_2, rol: "2002/2005 monto por recibir", codigos: "pesos nominales"}
  - {archivo: iiib_cr.dta, variable: cr05_1, rol: "2009 indicador de monto recibido o por recibir", codigos: "1=monto"}
  - {archivo: iiib_cr.dta, variable: cr05_2, rol: "2009 monto recibido o por recibir", codigos: "pesos nominales"}
  - {archivo: iiib_cr.dta, variable: cr05a_1, rol: "2009 unidad de duracion", codigos: "1=dias; 2=semanas; 3=meses; 8=NS"}
  - {archivo: iiib_cr.dta, variable: cr05a_21, rol: "2009 duracion en dias", codigos: "numero"}
  - {archivo: iiib_cr.dta, variable: cr05a_22, rol: "2009 duracion en semanas", codigos: "numero"}
  - {archivo: iiib_cr.dta, variable: cr05a_23, rol: "2009 duracion en meses", codigos: "numero"}
  - {archivo: iiib_cr.dta, variable: folio, rol: "identidad oficial del hogar dentro de la ola", codigos: "llave"}
  - {archivo: iiib_cr.dta, variable: ls, rol: "identidad oficial individual dentro de la ola", codigos: "llave"}
  - {archivo: iiib_portad.dta, variable: edad, rol: "cortes descriptivos y guardia de universo 15+", codigos: "15-120 valido para cortes"}
  - {archivo: iiib_portad.dta, variable: folio, rol: "identidad oficial del hogar dentro de la ola", codigos: "llave"}
  - {archivo: iiib_portad.dta, variable: ls, rol: "identidad oficial individual dentro de la ola", codigos: "llave"}
  - {archivo: ehh02w_b3b.dta, variable: fac_3b, rol: "factor persona Libro IIIB 2002", codigos: "finito y positivo"}
  - {archivo: ehh05w_b3b.dta, variable: fac_3b, rol: "factor puntual persona Libro IIIB 2005-06", codigos: "finito y positivo"}
  - {archivo: ehh09w_b3b.dta, variable: fac_3b, rol: "factor puntual persona Libro IIIB 2009-12", codigos: "finito y positivo"}

universo: >-
  Por ola, personas de 15 anos o mas que respondieron el Libro IIIB, con
  cr04 en {1,3} y fac_3b puntual de esa ola finito y positivo. Unidad persona.
  Ventana del reactivo: ultimos 12 meses. Las tres olas se estiman por separado.
filtros: >-
  cr04 fuera de {1,3} se cuenta y excluye; fac_3b ausente, no finito o <=0 se
  cuenta y excluye. Edad invalida solo excluye del corte etario. Montos y
  duracion no finitos o negativos se cuentan y excluyen; cero no se imputa.
ponderador: >-
  fac_3b puntual del Libro IIIB y de la misma ola, enlazado por folio+ls.
  No se usan factores longitudinales porque no se estima entrada/salida.
transformacion: >-
  p=sum(fac_3b*1[cr04=1])/sum(fac_3b). Edad: 15-29, 30-49, 50+.
  Medianas ponderadas por primer valor cuya masa acumulada alcanza 50%.
  Duracion 2009: dias*1, semanas*7, meses*(365.25/12). No hay deflacion.
estimando: >-
  Descriptivo: prevalencia individual de participacion en tanda en los ultimos
  12 meses, por ola y edad; montos nominales y duracion como secundarios.
  No identifica conocimiento de organizadora, impago, sancion ni causalidad.
dependencias_materiales: [numpy, pandas]
parametros:
  llave_join: [folio, ls]
  codigos_cr04: {"si": 1, "no": 3}
  grupos_edad: [15-29, 30-49, 50+]
  meses_a_dias: 30.4375
  metodo_ic: NO-ESTIMABLE-SIN-UPM-ESTRATO-REPLICAS
  control_codebook: "2002 2469/17333; 2005-06 1505/18952; 2009-12 2497/20960"
seed: {aplica: false}
tolerancia:
  tipo: flotante
  abs: 1.0e-10
  razon: "sumas deterministas en orden de fila; textos y enteros exactos"

