universo: DELITOS de tmod_vic ENVIPE 2025 con BP1_20 in {1,2} (el de las emisiones y el arbitro); cada eje sobre
  su denominador valido.
filtros: Los de mr.carga_ola (FAC_DEL > 0, EST_DIS/UPM_DIS no vacios, ID_PER unica en tsdem), ejecutados desde sus
  bytes.
ponderador: FAC_DEL
transformacion: evade_norma = BP1_20 == 2 y BP1_23 in {04,05,06,08}; S1..S4 escolaridad_proxy (NIV), D1..D3 = Rural/Complemento
  urbano/Urbano.
estimando: C2(s,d) = expit(logit p25(s) + logit p25(d) - logit p25) en las 12 celdas escolaridad x dominio; marginales
  de un eje de ENVIPE 2025; IC 2.5/97.5 de la composicion replica a replica.
seed:
