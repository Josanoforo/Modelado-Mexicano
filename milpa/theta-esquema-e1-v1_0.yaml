# DERIVADO DEL CENSO E1 §3 — NO EDITAR VALORES DE procedencia.yaml
#
# Capa separada del esquema E1, sellada por ADR-531 rama B ("Esquema E1:
# capa separada"). `milpa/procedencia.yaml` es archivo GEN1 SELLADO: sus
# valores no se reescriben (E.1). Esta capa es METADATO SOBRE esos valores
# —escala, universo, identificación— y no crea, corrige ni sustituye ninguno.
#
# CÓMO SE DERIVA. Los 43 nombres son EXACTAMENTE el conjunto de llaves de
# `Theta.desde(cargar()).entradas` (`milpa/src/theta.py`), derivado por
# código contra el árbol, no copiado de la nota. Los tokens son los que el
# censo E1 §3 asigna, fila por fila; cada entrada lleva el veredicto del
# censo verbatim en `*_segun_censo` para que la traducción sea auditable.
#
# A.15 — NO SE ADIVINA. Donde el censo describe el campo pero declina
# asignarle token ("de facto ... pero sin token"), el campo lleva
# `NO-CENSADO` y se cuenta. Donde el censo declara el campo ausente, lleva
# `NO-DECLARADO-EN-CANON` (escala) o `NO-DECLARADO` (universo).
#
# ESTE ARCHIVO NO CARGA NINGUNA θ. `theta.valor()` sigue lanzando
# `ThetaNoDisponible` para los 43 nombres; eso no cambia aquí.

