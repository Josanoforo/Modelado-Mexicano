universo: 'Identico al de las emisiones (spec humana §3.1): personas ELEGIDAS de 18 anos y mas del modulo TMODULO
  de ENIF 2024, una fila por persona seleccionada.'
filtros: 'Los mismos tres, en el mismo orden: edad valida 18 <= edad_v <= 97 excluyendo los centinelas 98 y 99;
  tloc en {1,2,3,4}; fac_per presente y > 0. AQUI SI se construye la llave (localidad, edad) sobre ENIF 2024: es
  el objeto de este CALC y el commit en que la reserva se levanta. Las emisiones ya estaban selladas cuando esto
  corrio -- el orden del diff es el sello.'
ponderador: fac_per -- Factor de expansion a nivel persona (FD 6,C,fac_per)
transformacion: 'R = p(ahorra_solo_informal | localidad, edad) en las 8 celdas de cruce de ENIF 2024, misma receta
  que el arbitro marginal: razon de totales ponderados, bootstrap de conglomerados estratificado (remuestreo con
  reemplazo de upm_dis dentro de est_dis), 10 000 replicas, seed 42, IC95 por percentiles 2.5/97.5. R9 (nueve tipos)
  es el PRIMARIO; R7 (siete) es la SENSIBILIDAD y NO ADJUDICA. Adjudicacion por celda: error absoluto en puntos
  porcentuales contra R9; INDECIDIBLE por las dos condiciones verbatim del programa; skill 1 - MAE/MAE(piso) que
  se reporta y no adjudica; conteo a nivel celda-D.'
estimando: 'Re-adjudicacion del CALC-DIN-AHORRO-SOLO-INFORMAL-ARBITRO-CRUCE-0001 con C2 := RESULT -C2-P (y su IC)
  de CALC-ENIF2024-PISOS-AHORRO-INFORMAL-LXE-0001, por id. Todo lo demas: el estimando del -0001, verbatim: El arbitro
  R del cruce y la adjudicacion por celda de los candidatos ya emitidos y sellados. Diagnostico C5: |p_nacional
  - p_celda| por celda, solo descriptivo, fuera de toda competencia.'
precision: 'R: IC95 muestral por bootstrap de conglomerados estratificado, 10 000 replicas, seed 42. EE(R) = (IC95sup
  - IC95inf)/3.92, que es la escala del criterio INDECIDIBLE. La adjudicacion NO produce un IC propio: es un conteo
  sobre 8 celdas de una misma muestra, no independientes, y por eso el umbral es de conteo y no hay valor-p.'
