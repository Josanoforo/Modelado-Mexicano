universo: Personas entrevistadas en México en Latinobarómetro 2024 (idenpa = 484), wt finito > 0, edad >= 18 (la
  regla de los dos contendientes)
filtros: Un eje a la vez (TOTAL, SEXO, EDAD, ESCOLARIDAD, TAMLOC, CLASE-SUBJETIVA); nunca cruces (guardia E.6)
ponderador: wt
transformacion: Recodificación bin de cada contendiente con los códigos de 2023 (spec §1); columna ausente en 2024
  -> NO-ESTIMABLE; nombre presente con otro texto de pregunta -> re-sello previo (spec §5)
estimando: R = Σw·y/Σw por contendiente×conducta×eje×categoría en Latinobarómetro 2024 México; cobertura de R en
  el IC de diseño sellado del piso 2023 (IC-LO/IC-HI)
seed:
  aplica: false
  razon: R es un punto; la cobertura usa el IC ya sellado del contendiente
parametros:
  nominal: 0.95
  z: 1.959964
  regla: cobertura R en [lo, hi] del contendiente; Wilson 95%; NO-ESTIMABLE > SUBCUBRE > SOBRECUBRE > CALIBRADO
  columna_ausente_en_catalogo: NO-ESTIMABLE (sin recodificación ad hoc)
tolerancia:
  tipo: flotante
  abs: 1.0e-10
  razon: 'determinista: sumas float64 sin remuestreo'
