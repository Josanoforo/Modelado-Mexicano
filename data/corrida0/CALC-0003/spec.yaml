  col_fac_3b: fac_3b
  col_fac_3b_px: fac_3b_px
  col_fac_3a_px: fac_3a_px
  codigos_si_no: "1=Si · 3=No · 8=NS (solo bx) -- el codigo 0 NO EXISTE (ehh02cb_b3b.pdf pag. 8)"
  ventanas: "es09=de por vida (q pag.5) · ec01=alguna vez (q pag.10) · ce01=ultimas 4 semanas (q pag.12) · hs01=ultimos 12 meses (q pag.18); en las 4 celdas el desenlace NO cubre al disparador -> co-ocurrencia, no secuencia"
  n_minimo_celda: 10
  bootstrap_replicas: 2000
  metodo_ic: "bootstrap de hogares (folio) dentro de estrato (c_portad.estrato), percentil 2.5/97.5 -- S6 §3.5"
  tabla_A: {hs02a: PUBLICO, hs02b: PUBLICO, hs02c: PUBLICO, hs02d: PUBLICO, hs02g: PUBLICO, hs02e: PRIVADO, hs02f: PRIVADO, hs02h: OTRO, hs02i: OTRO, hs02j: OTRO, hs02k_1: OTRO}
  tabla_B: {hs02a: PUBLICO, hs02b: PUBLICO, hs02c: PUBLICO, hs02d: PUBLICO, hs02g: PUBLICO, hs02i: PUBLICO, hs02k: PUBLICO, hs02e: PRIVADO, hs02f: PRIVADO, hs02l: PRIVADO, hs02h: OTRO, hs02j: OTRO, hs02m: OTRO, hs02n_1: OTRO}
  tabla_C: {ce04a: PUBLICO, ce04b: PUBLICO, ce04c: PUBLICO, ce04d: PUBLICO, ce04g: PUBLICO, ce04i: PUBLICO, ce04k: PUBLICO, ce04e: PRIVADO, ce04f: PRIVADO, ce04l: PRIVADO, ce04h: OTRO, ce04j: OTRO, ce04m: OTRO, ce04n_1: OTRO}

seed:
  aplica: true
  valor: 20260908
  rng: numpy.PCG64

tolerancia:
  tipo: flotante
  abs: 1.0e-10
  razon: >-
    Bootstrap fijado por seed+rng declarados; entre dos corridas del mismo arbol
    solo cabe redondeo de float64 al reasociar sumas ponderadas. Los enteros se
    comparan EXACTO.

