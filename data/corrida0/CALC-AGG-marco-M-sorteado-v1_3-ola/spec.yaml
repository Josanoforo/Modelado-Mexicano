estimando: >-
  ninguno: dos vistas informativas (por regla y por segmento) sobre celdas ya
  emitidas, mas el conteo de los puntos por eje que existen del lado del
  arbitro y que ninguna celda del marcador consume.
dependencias_materiales: []

parametros:
  columna_elegible: elegible_v1_1
  fuente_acto: "ACTO GEN2-T9 · EL MOTOR ES LA MATRIZ · P3(d)"

seed:
  aplica: false

tolerancia:
  tipo: entero
  razon: >-
    Todos los RESULT numericos son conteos y se comparan EXACTO. No hay
    flotante porque no hay estimacion: la corrida cuenta y agrupa.

