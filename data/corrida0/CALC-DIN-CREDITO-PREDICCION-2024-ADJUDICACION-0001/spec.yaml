universo: "Persona elegida 18-70 (mismo recorte que P0-a) en las 9 conductas de la lista blanca CONDUCTAS_AUTORIZADAS -- ninguna otra columna de TMODULO 2024 es alcanzable desde este codigo."
filtros: "abre_conducta_2024 exige conducta_id in CONDUCTAS_AUTORIZADAS (str exacto, nunca lista ni comodin) antes de leer el ZIP; EDAD (edad_v) filtrada a [18,70] igual que -RECORTE1870-0001."
