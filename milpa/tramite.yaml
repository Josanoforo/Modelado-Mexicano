  #
  # UNICA transformacion sobre el verbatim, declarada antes de correr en
  # forense/notas/2026-08-31-lote-nube-1-spec.md §P0(c): `si.disparadores`
  # venia como la cadena PENDIENTE-DE-MESA, que rompe
  # emisor.cargar_reglas con AttributeError (str no tiene .items()). Va
  # como mapping vacio -- que es lo que la propia propuesta explica: p es
  # una tasa base INCONDICIONAL -- y el marcador literal viaja en el campo
  # hermano `disparadores_estado`. Los campos `si` siguen PENDIENTE-DE-MESA
  # porque canon/modelo-decision-v4_0.md §2.1-2.2 (lineas 428-473, 46
  # examinadas) no trae NINGUN texto SI-ENTONCES citable: 0 coincidencias
  # del patron, 0 de 'denuncia', 0 de 'vejez'. Las 49 reglas SI-ENTONCES
  # viven en §3.B (linea 491), fuera del alcance que el encargo autoriza.
  # No se inventa.
  # ══════════════════════════════════════════════════════════════════

  - id: civico.denuncia.miedo_desconfianza
    situacion: PENDIENTE-DE-MESA
    si:
      disparadores: {}  # PENDIENTE-DE-MESA (ver disparadores_estado) -- el dato no dicta una condicion logica
        # de disparo (sancion_creible/quien_observa, etc.) -- p viene de una
        # tasa base incondicional en un universo ya seleccionado (victimas
        # no denunciantes), no de una condicional del motor.
      disparadores_estado: PENDIENTE-DE-MESA  # sin cita SI-ENTONCES en canon/modelo-decision-v4_0.md:428-473 (§2.1-2.2); NO se inventa (spec §P0(c))
    entonces:
      - {conducta: denuncia_con_miedo_o_desconfianza, p: 0.294313, clase: "MEDIDO·p(tasa base ponderada)"}
      - {conducta: denuncia_por_otra_razon, p: 0.705687, clase: "MEDIDO·p(tasa base ponderada)"}
    porque: {generador: [G4], mecanismo: PENDIENTE-DE-MESA}
      # mecanismo causal no re-derivado por este acto (fuera de perimetro);
      # el generador G4 (exposicion_violencia/confianza_institucional[justicia])
      # ya trae mecanismo declarado en canon/modelo-decision-v4_0.md, no se
      # inventa uno nuevo aqui.
    tier: PENDIENTE-DE-MESA
    falsable_si: PENDIENTE-DE-MESA
    fuente: ["ENVIPE2025", "coeficientes_generador_medidos.G4_exposicion_violencia"]
    ola_calibracion: "ENVIPE 2025 (unica ola disponible para este universo)"
    ic95: [0.282822, 0.306570]
    n: 13023
    ponderador: FAC_ELE
    universo: "personas 18+ victimas de AP7_3_XX=1 (XX en 05..15) que no denunciaron (BP1_20=2) -- procedencia.yaml:997, re-verificado contra microdato 2026-08-31"
    sha256_payload: "8a7a99fd90ce9d03229759ba0ad84db4fba98b5bb1f5c85eef7d718b007816fa"
    payload_manifiesto_id: envipe2025_csv

