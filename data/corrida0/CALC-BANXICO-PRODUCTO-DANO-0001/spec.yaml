universo: >-
  Por ola, tenedores del producto con filtro=1; reclamacion condicionada a
  problema=1. Personas mexicanas de 18-70 en localidades de 50 mil o mas.
filtros: >-
  Codigos validos exactos de spec.md. Faltantes, saltos, NS/NC, codigos
  invalidos y pesos no positivos se separan; no hay imputacion.
ponderador: ponderador finito y positivo; punto como razon de masas por celda.
transformacion: >-
  Atraso e imposibilidad se conservan separados y tambien se ofrece su union.
  Costo 0..10 no se colapsa; olas y productos no se suman.
estimando: >-
  Distribucion de pago, atraso/imposibilidad, problemas, reclamacion filtrada,
  conjunta costo-pago y dano 2024 por cada nivel de costo; descriptivos.
precision: >-
  No disponible: los insumos no acreditan UPM, estrato o procedimiento de
  varianza. No se inventan EE/IC a partir del ponderador solo.

