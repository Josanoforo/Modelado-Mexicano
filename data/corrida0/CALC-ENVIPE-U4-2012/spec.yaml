  - {archivo: "tper_vic.dbf", variable: TOT_PER, rol: "total de personas del hogar -- guardia de cardinalidad (filas por hogar == TOT_PER)", codigos: "C2, 01..21"}
  - {archivo: "tper_vic.dbf", variable: FAC_ELE, rol: "PONDERADOR de U4 -- 'Factor de personas elegidas ... poblacion de 18 anios y mas' (FD hoja TPer_Viv fila 975-976); resuelto POR HOGAR por la regla §3.1", codigos: "C6, 000001..999999, texto crudo convertido despues"}
  - {archivo: "tper_vic.dbf", variable: EST, rol: "estrato de diseno -- LLAVE OPACA de texto", codigos: "C3 segun la cabecera del DBF (FD: 001..303)"}
  - {archivo: "tper_vic.dbf", variable: UPM, rol: "UPM -- LLAVE OPACA de texto", codigos: "C5 segun la cabecera del DBF"}
  - {archivo: "tsdem.DBF", variable: CONTROL, rol: "llave de hogar (1/3)", codigos: "C6"}
  - {archivo: "tsdem.DBF", variable: VIV_SEL, rol: "llave de hogar (2/3)", codigos: "C2"}
  - {archivo: "tsdem.DBF", variable: HOGAR, rol: "llave de hogar (3/3)", codigos: "C1"}
  - {archivo: "tsdem.DBF", variable: N_REN, rol: "numero de renglon del integrante -- el join declarado: N_REN == R_SEL (FD hoja TSDem fila 21-22)", codigos: "C2, 01..30; comparacion numerica"}
  - {archivo: "tsdem.DBF", variable: EDAD, rol: "edad del integrante que calzo -- SOLO contada (< 18 es hallazgo, no filtro)", codigos: "C2: 00..96 anios, 97 = 97 o mas, 98/99 = no especificada"}

universo: >-
  ENVIPE 2012 (delitos de 2011). U1 (delito), homologado a ENVIPE-DENUNCIA con
  el bloque personal de esta ola: filas de Tmod_Vic.DBF con BPCOD en {04..14},
  BP1_20 = 2, BP1_23 en {01..08} y FAC_DEL finito > 0. U4 (PERSONA): personas
  seleccionadas (CONTROL, VIV_SEL, HOGAR, R_SEL) con >= 1 delito en U1 cuyo
  R_SEL coincide con el del hogar en tper_vic, con FAC_ELE resuelto por hogar
  (regla §3.1: valor unico; si no, unica fila valida; si no, ambiguo -> fuera)
  finito > 0, y con EXACTAMENTE UNA fila de tsdem.DBF con N_REN == R_SEL en su
  hogar. Colapso GEN1: d(persona) = max de d(delito) sobre sus delitos de U1.

filtros: >-
  Sale de U1, CONTADO: BP1_23 blanco / 99 / fuera de catalogo, BPCOD fuera del
  bloque personal, BP1_20 != 2, FAC_DEL no valido. Sale de U4, CONTADO y no
  imputado: delito con R_SEL blanco (N-DELITOS-R-SEL-BLANCO), hogar ausente en
  tper_vic (N-DELITOS-HOGAR-SIN-TPER-VIC), R_SEL discordante
  (N-DELITOS-R-SEL-DISCORDA), FAC_ELE ambiguo (N-U4-FAC-ELE-AMBIGUO), cero o
  mas de una fila en tsdem con N_REN == R_SEL (N-U4-TSDEM-0 / -MULTI). Se
  cuenta pero NO sale: EDAD < 18 o no especificada; sin diseno (entra al punto,
  no al IC). CERO NUNCA SUSTITUYE FALTA DE DATO. Miembro o columna ausente ->
  ESTADO NO-ESTIMABLE-*; sin candidatas -> NO-ESTIMABLE-UNIVERSO-VACIO; con
  candidatas y ninguna que calce en tsdem -> NO-ESTIMABLE-JOIN-VACIO.

ponderador: >-
  FAC_ELE (tper_vic.dbf) para U4, resuelto por hogar. FAC_DEL (Tmod_Vic.DBF)
  solo para el control de lectura P-C1-U1. Texto crudo convertido a flotante
  despues. NO se usa FAC_VIV.

transformacion: >-
  Lector DBF inline (cabecera + descriptores del propio archivo, latin-1,
  borrados excluidos y contados). Llaves de hogar como texto strip en las tres
  tablas; R_SEL y N_REN comparados como enteros; EST/UPM como texto strip
  (nunca int). d(C1) = 1 si BP1_23 en {01,02,06}; d(C2) = 1 si en {01,02,06,08};
  colapso max por persona. p = suma(w*d)/suma(w) en orden fijo de fila.
  Bootstrap de UPM con reemplazo dentro de EST conservando el numero de UPM
  por estrato, 2000 replicas, percentiles 2.5/97.5; estrato de UPM unica se
  re-muestrea a si mismo. Taylor de cotejo con aproximacion declarada de
  lonely.psu=adjust. NO se promedia, no se imputa, no se extrapola.

estimando: >-
  DESCRIPTIVO. PRIMARIO DE LA PIEZA: P-C2-U4 con IC de diseno (la particion
  GEN1 en unidad persona, 2012). SECUNDARIOS: P-C1-U4, complemento, P-C1-U1 de
  control, el embudo entero de la ruta (cardinalidades del join). NINGUN RESULT
  ES CAUSAL. No hay valor GEN1 de 2012 en unidad persona: no se declara
  REPRODUCE-GEN1 para U4 y no se compara con el 0.294313 de 2025.

