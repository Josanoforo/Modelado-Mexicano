universo: >-
  Hogares: el universo COMPLETO de concentradohogar (folioviv + foliohog) de cada ola, SIN filtro adicional -- el
  mismo de CALC-B-0001 y de corridas-R/FAM-M-05. UNA OLA A LA VEZ. Universo de la serie B: olas 2014 (predecesora,
  Nueva Construccion de Variables) y 2016 (objetivo, Nueva Serie). Esta es la extension hacia atras que prereg-caja-B-REMESAS
  §0.1 dejo explicitamente a un acto sucesor; NO reescribe CALC-B-0001 (2016->2022 sigue siendo suyo) y 2012 queda
  FUERA (no es predecesora inmediata de ningun objetivo).
filtros: >-
  Entran las filas con ponderador finito y > 0 y con remesas no nula. La rama NA NO existe: si N-FUERA-CODIGO (=
  nulos de remesas) > 0 en una ola, esa ola sale NO-ESTIMABLE-NULOS-INESPERADOS (guardia §1.1 de B-REMESAS, heredada).
  Sin est_dis o upm -> IC null y NO-ESTIMABLE-DISENO-INCOMPLETO. Guardia de producto: p exactamente 0.0 o 1.0 ->
  NO-ESTIMABLE-P-DEGENERADA.
ponderador: >-
  factor_hog en 2014 y factor en 2016 -- el ponderador de hogar de cada ola bajo el nombre que su diccionario le
  da.
transformacion: >-
  Dicotomizacion pre-registrada de dos ramas (ver `codificacion`); p_ola = suma(w*y)/suma(w) sobre el universo valido
  de la ola, una ola a la vez. Sobre esa serie corre el selector B (tools/baseline_temporal.py) sin modificarlo,
  para cada ola objetivo y dos brazos que difieren SOLO en `disponible_desde`: OPERATIVO usa la fecha de version
  de la ola en corpus (Modified del CSV; mtime del miembro DBF cuando el payload no trae metadatos/); PERSISTENCIA
  usa periodo_fin de la ola (el contrafactico «si cada ola hubiera estado disponible el dia que cerro su levantamiento»).
  Periodos = anio calendario de la ola (anio de encuesta, que es el `ola` del marco); fecha_corte(objetivo) = (objetivo
  - 1)-12-31. Regla fija, tonta y pre-declarada: persistencia de la ULTIMA ola de la MISMA serie disponible al corte.
  Nada de promediar, ajustar tendencia, interpolar ni imputar.
estimando: >-
  DESCRIPTIVO, en dos capas -- las mismas de CALC-B-0001. (1) p_ola por ola con IC95. (2) La linea base: por objetivo
  y brazo, P_B (la prediccion de B para la celda) y su contraste contra la observada propia de la ola objetivo (ERROR
  con signo, ERROR-ABS, DENTRO-IC, MARGEN-AL-BORDE), escala [0,1]. Este CALC NO lee R: el error frente al arbitro
  de la celda (err_pp, A-bis.3) y el control positivo viven en CALC-B-MARCO-MAE-0001. NO es una estimacion de regla:
  ninguna cifra entra a un veredicto (T9).
