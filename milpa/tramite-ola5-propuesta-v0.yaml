  #
  # Cargada VERBATIM a milpa/tramite.yaml, campo por campo, sin
  # reinterpretar. tier propagado a FUERTE (lectura de direccion de D1-a,
  # ver cabecera gemela arriba). Esta entrada NO se borra ni se edita.
  # ══════════════════════════════════════════════════════════════════
  - id: dinero.planeacion.formal_estable
    situacion: PENDIENTE-DE-MESA
    si:
      disparadores: PENDIENTE-DE-MESA  # NO por limite de perimetro, sino por
        # ausencia medida del instrumento: barrido exhaustivo de las 16 tablas
        # / 664 columnas de ENFIH 2019 con patron
        # SEG|IMSS|ISSSTE|PREST|CONTRAT|FORMAL|AFIL -> 2 hits, ambos seguro de
        # vida (C_SEGVID/V_SEGVID), ninguno de formalidad laboral; control
        # positivo del mismo barrido con patron AFORE -> 2 hits. ENFIH 2019 no
        # trae `segsoc` ni `contrato` ni `pres_8`, asi que la condicional de
        # §3.1 no es construible aqui NI POR UN ACTO SUCESOR sobre esta fuente.
    entonces:
      - {conducta: tiene_afore, p: 0.538502, clase: "MEDIDO·p(tasa base ponderada)"}
      - {conducta: no_tiene_afore, p: 0.461498, clase: "MEDIDO·p(tasa base ponderada)"}
    porque: {generador: PENDIENTE-DE-MESA, mecanismo: PENDIENTE-DE-MESA}
      # §3.1 declara el mecanismo en prosa ("el ingreso estable baja el costo
      # esperado de comprometerse a un instrumento de horizonte largo") pero NO
      # nombra un generador G#. No se le asigna uno: eso es de mesa.
    tier: PENDIENTE-DE-MESA
    falsable_si: PENDIENTE-DE-MESA
    fuente: ["ENFIH2019", "data/raw/enfih2019/enfih_2019_fd.xlsx hoja TConcentradora", "canon/modelo-decision-v4_0.md §3.1"]
    ola_calibracion: "ENFIH 2019 (unica ola de ENFIH en el corpus)"
    ic95: [0.526700, 0.550616]
    n: 17765
    ponderador: FAC_HOG
    universo: "hogares -- los 17765 de TCONCENTRADORA.csv (llave FOLIO+VIV_SEL+HOGAR), sin filtro adicional. Desenlace tiene_afore = C_AFORE, que el FD define como `Condicion de tenencia de cuenta de ahorro para el retiro o Afore`, 0=No tiene / 1=Si tiene, ya dicotomica sin recodificar."
    robustez:
      - {variante: "universo restringido a hogar principal (H_PPAL=1)", p: 0.540091, ic95: [0.528375, 0.552262], n: 17386, lectura: "diferencia de 0.16pp con el universo completo, muy dentro del IC95 de ambos: la eleccion de universo no mueve la cifra"}
    descriptivo_no_sellado:
      # NO es la p de la regla y NO se sella. CAT_POS es posicion en el trabajo
      # de la persona de referencia; un empleado puede ser informal, asi que
      # CAT_POS NO es formalidad y usarlo como disparador seria inventar la
      # operacionalizacion que (f) de la spec declara ausente. Se registra solo
      # porque muestra si la DIRECCION de §3.1 se sostiene en el dato.
      variable: "CAT_POS (categoria de posicion en el trabajo de la persona de referencia)"
      tasas_ponderadas_afore:
