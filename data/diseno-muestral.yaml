    diseño de una etapa sobre marco de empresas, no vivienda/UPM como en las encuestas de
    hogares); nodo <weight> (offset 29269) da la fórmula del factor de expansión f_dh =
    N_dh/n_dh por estrato-dominio, sin nombrar la columna. El archivo de datos descargado
    (conjunto_de_datos_enafin_2024_csv.zip/diccionario_de_datos/) confirma que las columnas
    entregadas (C_0, C_1a, D_1a... ) son ya AGREGADOS por dominio de estudio, no casos
