  - {archivo: tmodulo.csv, variable: "P6_11_01..P6_11_14 + P6_11A_nn_1..4", rol: "ítems 6.11 (Sí y cuatro tiempos); NUCLEO/MIN/TODOS según ITEMS"}
  - {archivo: tmodulo.csv, variable: "P6_12_01..P6_12_12 + P6_12A_nn_1..4", rol: "ítems 6.12"}
