universo: Persona elegida de 18 a 70 años (diseño de ENIF 2012) con desenlace definido y diseño válido; K6-PR sobre productos formales tenidos con variable de atraso; K6-P-TENEDORES sobre tenedores de al menos un producto cubierto; sin eje de formalidad (NO-CONSTRUIBLE por texto). Cada eje conserva su denominador válido.
filtros: 'FAC_PER positivo y diseño válido (EST_DIS, UPM_DIS no vacíos); sin filtro de edad ni de otro eje; K8 y K2-bancaria no se leen (FP-404); K4 y K7 no se emiten; K3 sin el ítem 6.1.1 (caja entre amigos: otro referente).'
ponderador: FAC_PER
transformacion: Desenlaces dicotómicos de las conductas con veredicto MISMO-INSTRUMENTO o CAMBIO-MENOR en la fila K·2012 de data/credito-comparabilidad-texto-v1_1.tsv, con las variables y códigos del mapa DIN-CREDITO-PISOS-HISTORIA-mapa-v1_0.tsv (spec §2); ejes con los cortes del medidor sellado de -0003 y la rejilla de las tablas de identidad GEN2; marco combinado persona+producto con un solo plan de réplicas; matiz de cada conducta emitido como texto
estimando: 'Proporciones marginales ponderadas ENIF 2012 de las conductas de crédito comparables por texto, por celda de eje, con IC95 bootstrap, unidad P o PR declarada por conducta: piso histórico conmensurable con CALC-DIN-CREDITO-PISOS-ENIF2021-0001 (mismo marco; población 18-70 declarada)'
seed:
  aplica: true
  rng: numpy.PCG64
  valor: 42
parametros:
  ola: '2012'
  bootstrap_replicas: 10000
  metodo_ic: bootstrap UPM estratificado; percentiles 2.5/97.5; réplicas compartidas por todas las conductas y celdas (una sola llamada a _estimate)
  n_soporte: 200
  tolerancia_coherencia: 1e-6 x den_w de la referencia; si se excede el medidor PARA
  conductas_emitidas: 9
  eje_formalidad: NO-CONSTRUIBLE-POR-TEXTO
dependencias_materiales:
- numpy
- pandas
