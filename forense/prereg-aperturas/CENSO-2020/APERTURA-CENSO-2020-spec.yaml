universo: 'Muestra censal 2020: viviendas particulares habitadas de la tabla VIVIENDAS (EIC15: TIPOHOG en 1,2,3,5,6;
  CCPV10: universo de cada conducta en su spec §2) y personas 60+ de PERSONAS (PER60-*); FACTOR > 0, ESTRATO y UPM
  no vacíos'
filtros: 'Un eje a la vez (EIC15: TOTAL, JEFATURA, TAMLOC, ENTIDAD; CCPV10 hogar: TOTAL, SEXO-JEFE, EDAD-JEFE, ESCOLARIDAD-JEFE,
  TLOC, ENT; persona: TOTAL, SEXO, EDAD, TLOC, ENT); nunca cruces (guardia E.6)'
ponderador: FACTOR (VIVIENDAS para hogar; PERSONAS para PER60-*)
transformacion: Recodificación de cada contendiente con los nombres y códigos de su ola (EIC 2015; muestra 2010);
  columna ausente en 2020 (p. ej. tam_loc, parent) -> vacía -> NO-ESTIMABLE, sin recodificación ad hoc
estimando: R = Σw·y/Σw por conducta×eje×categoría en la muestra censal 2020 (media ponderada en HOG-TAMANO-MEDIO);
  cobertura de R en el IC de diseño de cada piso (EIC 2015, CCPV 2010)
seed:
  aplica: false
  razon: R es un punto; la cobertura usa el IC ya sellado del contendiente
parametros:
  nominal: 0.95
  z: 1.959964
  regla: cobertura R en [lo, hi] del contendiente; Wilson 95%; NO-ESTIMABLE > SUBCUBRE > SOBRECUBRE > CALIBRADO
  columna_ausente_en_catalogo: NO-ESTIMABLE (sin recodificación ad hoc)
tolerancia:
  tipo: flotante
  abs: 1.0e-10
  razon: 'determinista: sumas float64 sin remuestreo'
