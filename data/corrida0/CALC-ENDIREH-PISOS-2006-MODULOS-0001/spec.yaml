universo: Mujeres 15+ por cuestionario MC/MD/MS; pareja MS con P23=1/2, sin pareja P23=3 fuera.
filtros: Codigos especificos 2006 en spec.md; 1/2 vs 3 para pareja MC/MD, 1/2 en otros actos.
ponderador: FAC_PER positivo, sin normalizar
transformacion: Union de actos por modulo; resultados de ayuda y decisiones separados.
estimando: Prevalencias descriptivas ENDIREH 2006 por cuestionario, sin serie automatica.
dependencias_materiales:
- numpy==2.3.5
parametros:
  bootstrap_replicas: 200
  metodo_ic: UPM ZUPM completas dentro de CVE_ENT+ZEST, percentiles 2.5/97.5
  n_minimo: 100
  upm_minimas: 5
  ancho_ic_maximo: 0.2
  cv_maximo: 0.3
  hash_medidor_sha256: eda9a979a4124ef147dc885dbfa46360021dc14b233a1c4d7ebbfd05f2a763d2
  hash_prueba_sha256: 4aed07f152233b3a2c1dfba728e6c9c285da67113ce6322d06e4c15ca28f87fc
