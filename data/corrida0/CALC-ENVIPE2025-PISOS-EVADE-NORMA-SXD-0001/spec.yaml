  valor: 42
  rng: numpy.random.PCG64 (replicas compartidas) + numpy.random.default_rng (wprop_ic_conglomerado)
tolerancia:
  tipo: bootstrap
  exacto_por_seed: true
  abs: 1.0e-10
  razon: misma semilla y mismo modulo congelado que las emisiones
