variables:
- archivo: data/corrida0/<CALC-B>/resultados.json
  variable: RESULT-*-P
  rol: P_B por celda y brazo, y P observada de la ola objetivo (citas de RESULT sellados)
- archivo: forense/prereg-duelo-v2/corridas-R/<celda>.json
  variable: R
  rol: arbitro GEN1 de la celda (insumo LEGACY declarado)
- archivo: forense/prereg-duelo-v2/marco-M-sorteado-v1_3.tsv
  variable: id
  rol: las 14 celdas del marco (guardia de identidad)
universo: >-
  Las 14 celdas de marco-M-sorteado-v1_3.tsv. Cubiertas: las que tienen B (10 esperadas bajo PERSISTENCIA); no-construibles:
  4, con razon citada, sin rellenar.
filtros: >-
  Una celda entra al MAE de un brazo si y solo si su CALC de serie emite P_B en ese brazo (no null) y R esta sellado.
  Nada se imputa.
ponderador: NO-APLICA (media simple de |err_pp| sobre celdas, como MAE_pp del duelo).
transformacion: >-
  err_pp = 100·(P_B − R) por celda y brazo; MAE_pp = media de |err_pp| sobre celdas cubiertas, en orden fijo de
  id; control positivo delta = P_obs − R en tres ramas (1e-10, 1e-6).
estimando: >-
  DESCRIPTIVO: cobertura de B antes/despues, err_pp por celda, control positivo por celda, MAE_pp(B) por brazo CON
  su n y su lista. No es una estimacion de regla y no compara contra MAE de otros corredores (A-bis.4).
