variables:
- nombre: CONSUMO-<conducta>
  definicion: '34 conductas PART-*/HOG-* de CONSUMO-0002 (spec CONSUMO-ENIGH-PISOS v1.1 §2): concentradohogar, hogares,
    gastoshogar'
- nombre: PDR1-PRIV
  definicion: hogar con gasto G1 en inscripción/colegiatura (E001-E007) de un integrante en escuela privada (poblacion.tipoesc
    = 2)
- nombre: PDR1-ASIPRIV
  definicion: hogar con integrante que asiste a escuela privada
- nombre: PDR1-CARGA
  definicion: Σw·gasto_tri(PRIV) / Σw·ing_cor entre hogares PRIV con ing_cor > 0
universo: 'Hogares de ENIGH 2024 NS en concentradohogar con factor > 0, est_dis y upm no vacíos (prepara() de los
  sellados); PDR1: hogares con al menos un integrante que asiste a la escuela (asis_esc = 1)'
filtros: 'Un eje a la vez: CONSUMO por TOTAL, SEXO-JEFE, EDAD-JEFE, ESCOLARIDAD-JEFE, TLOC, DECIL y ENTIDAD (sólo
  conductas marcadas); PDR1 por decil y bloque dentro de cada ámbito pre-registrado (TOTAL, URBANO, RURAL: restricción
  de universo) y PRIV por TLOC, SEXO-JEFE, EDAD-JEFE; nunca cruces libres'
ponderador: 'factor (concentradohogar); PART-* y CARGA: razón de totales con peso factor×denominador'
transformacion: Recodificación de los contendientes (specs CONSUMO-ENIGH-PISOS v1.1 §2 y PDR1-ENIGH2022 §2); MEDIA-*
  y DIF-* fuera de la primaria; columna ausente -> NO-ESTIMABLE
estimando: R = Σw·y/Σw (o razón de totales) por conducta×eje×categoría en ENIGH 2024; cobertura de R en el ICC 2022
  de CONSUMO-0002 y en el IC95 de diseño 2022 de PDR1
seed:
  aplica: false
  razon: R es un punto; la cobertura usa el IC ya sellado del contendiente
parametros:
  nominal: 0.95
  z: 1.959964
  regla: cobertura R en [lo, hi] del contendiente; Wilson 95%; NO-ESTIMABLE > SUBCUBRE > SOBRECUBRE > CALIBRADO
  columna_ausente_en_catalogo: NO-ESTIMABLE (sin recodificación ad hoc)
tolerancia:
  tipo: flotante
  abs: 1.0e-10
  razon: 'determinista: sumas float64 sin remuestreo'
