    LO CONTADO y la discrepancia se reporta como hallazgo.
  criterio_adopcion: >-
    ADOPCION = LISTADO-PARA-MESA-REPRODUCE si REPRODUCE-GEN1 = REPRODUCE, es
    decir si los cuatro round(p, 6) igualan 0.790900 / 0.209100 / 0.672000 /
    0.328000; LISTADO-PARA-MESA-NO-REPRODUCE en otro caso estimable;
    NO-ADOPTABLE-NO-ESTIMABLE si falta cualquiera de los cuatro puntos.
    NO-REPRODUCE no autoriza tocar el medidor. Este acto NO escribe cita en
    milpa/ bajo NINGUNA rama: las entradas civico.denuncia.con_seguro y
    civico.denuncia.sin_seguro quedan intactas y la adopcion la decide mesa por
    merge.

