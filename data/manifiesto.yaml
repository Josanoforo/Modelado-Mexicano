- id: nota_metodologica_rotulo_pareada
  fecha: '2026-07-29'
  hecho: >
    Durante el análisis de hitoD-R3.2, una cifra reportada como "brecha pareada por N_TRA"
    resultó estar mal rotulada: era una brecha agrupada (pooled) restringida a los tipos de
    trámite con ambas modalidades observadas, no una brecha pareada ni estandarizada -- no
    reponderaba los tipos restantes a una mezcla común entre presencial y digital. Detectado
    por aritmética (n1 global vs. n1 dentro de la tabla "pareada": la diferencia era exactamente
    el n presencial del único tipo de trámite excluido). Corregido con estandarización directa
    (ver hitoD-R3.2 §2.3). Se deja esta nota porque la cifra mal rotulada circuló en el análisis
    antes de corregirse y el error de nomenclatura -- no solo el número -- es parte de la
    procedencia del dato.

- id: ennvih_mxfls_licencia
  fecha: '2026-07-30'
  hecho: >
    ENNViH/MxFLS declara sus datos de dominio público en su propia página de inicio: "La ENNViH
    es de dominio público. Los datos y la documentación de la encuesta se pueden descargar
    sin costo alguno para el usuario." Verificado por fetch directo de https://ennvih-mxfls.org
    (portada), 30/jul/2026. Sin login, sin formulario, sin términos que aceptar; los enlaces
    de descarga de las tres olas (ENNVIH-1/2/3) van directo al .zip de datos -- confirmado
    independientemente desde otra sesión/máquina (Ubuntu local, http=200 contra el host) el
    mismo día. Corrige revision-publicacion-2026-07-30.md:88/403/444, que marcaba los términos
    de ENNViH como "reporta el valor" (sin verificar en esa sesión). No cambia el estado del
    payload: ningún archivo de ENNViH se ha descargado ni se registra aquí -- CAL-G3 sigue
    sin ejecutarse.

