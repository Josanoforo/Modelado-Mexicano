    linea_cerrada: "firma e1: no se adquiere mas para esta linea; Hidalgo 2024 y Veracruz 2025 no mueven el veredicto"
    estampa_A10_n9: {sha_redaccion: "e1afa2a", acto: "MAESTRA35-N9", fecha: "2026-09-02"}
    falsable_si: >
      Congelado en §1.9 de la spec ANTES de medir, sobre el IC95 wild cluster
      por entidad, que es el conservador y el que la spec designo para decidir:
      CORROBORADA si beta_pres > 0 con IC que excluye 0 Y beta_int < 0 con IC
      que excluye 0; ACOTADA si solo una se sostiene; NO-DISCRIMINA si ambos IC
      contienen 0; CONTRARIA si alguno sale con signo opuesto e IC fuera de 0,
      con CONTRARIA por encima de ACOTADA. Los dos IC contienen 0, asi que el
      veredicto es NO-DISCRIMINA.
    cobertura:
      entidades_en_el_panel: 6
      entidades_tratadas_medibles: 5     # Coahuila, Nayarit, Zacatecas, Baja California, Chihuahua
      entidades_tratadas_identificadas_por_P0: 14
      meta_declarada_del_encargo: 8      # NO alcanzada: P3 corre ACOTADO y lo dice
      municipios: 187
      observaciones_municipio_x_transicion: 540
      transiciones: 15
      conglomerados: 6
      p_minimo_alcanzable_wild_cluster: 0.03125   # 2 / 2^6
      transiciones_por_tipo:
        STAY_identifican_alpha: 2                  # Baja California 2016-2019, Durango 2016-2019
        SWITCH_a_presidencial_identifican_beta_pres: 3   # Chihuahua, Coahuila, Zacatecas -> 2018
        SWITCH_a_intermedia_identifican_beta_int: 2      # Baja California 2019-2021, Nayarit 2017-2021
        CAMBIO_DE_TIPO_identifican_beta_pres_menos_beta_int: 8
    variante_sin_alpha:
      beta_pres_pp: 2.259506
      beta_int_pp: -1.775800
      por_que: >
        La spec (§0.3) fijo el umbral ANTES de medir: si el panel queda con menos
        de 3 transiciones STAY, alpha se declara identificada con reserva y la
        variante sin alpha se reporta PASE LO QUE PASE. El panel quedo con 2.
    reserva_alpha: >
      alpha esta identificada por SEIS observaciones: los 5 municipios de Baja
      California (2016->2019) y UNO de Durango (2016->2019, la capital, porque
      el archivo que el IEPC publica para 2016 solo cubre ese municipio).
      Estimada solo de esas dos transiciones da -1.8436 pp/anio; estimada
      conjuntamente con todo el panel da -0.4447. La tabla de identificacion de
      P0 (data/l3-tabla-identificacion-v1_0.tsv) midio que en TODO el universo
      del calendario solo hay 5 transiciones STAY, y dos de ellas son de
      entidades cuyo denominador no se pudo adquirir (Aguascalientes, Hidalgo).
      Es una limitacion del universo, no de este acto.
    reserva: >
      (i) NO-DISCRIMINA no es lo mismo que cero. beta_pres vale +3.15 pp, su IC
      de municipio [+2.48, +3.83] excluye cero, su signo es el mismo en las SEIS
      columnas de sensibilidad (+2.76 a +4.20) y las tres transiciones de "local
      sola -> presidencial" del panel dan +2.14 (Coahuila), +2.52 (Zacatecas) y
      +2.82 (Chihuahua), en tres entidades distintas con tres anios de partida
      distintos. El extremo inferior de su IC conservador es -0.196: falla por
      dos decimas. (ii) beta_int es otra cosa: no es falta de potencia, CAMBIA DE
      SIGNO entre subconjuntos (-2.98 en el panel de L6, +2.67 en las entidades
      nuevas) y lo identifican DOS transiciones que se contradicen -- Nayarit
      2017->2021 da -6.77 y Baja California 2019->2021 da +7.60. (iii) El
      procedimiento designo el wild cluster para decidir y el bootstrap por
      municipio discrepa (llevaria a CORROBORADA); la discrepancia se declara y
      manda el wild cluster, como se fijo antes de medir. (iv) 2021 es, en esta
      ventana, a la vez la eleccion intermedia y la de la pandemia: beta_int
      carga las dos cosas y este diseno no las separa. Se escribio en §1.10 de la
      spec antes de medir. (v) El diseno no separa el tipo de boleta de la
      jerarquia del cargo ni de cualquier choque nacional que coincida con los
      anios de ese tipo. (vi) ALCANCE: P0 identifico 14 entidades tratadas; la
      meta declarada eran 8; P1 alcanzo 5. ACOTADO, declarado, sin imputar nada.
    lo_que_si_queda_medido: >
      Un resultado sobre el DISENO, que sobrevive al veredicto del falsador. El
      beta ~ 0 de MAESTRA34-L6 no era un cero: era el promedio de dos efectos de
      signo contrario. Y L6 midio que quitando Coahuila su beta se desplomaba a
      -5.69; bajo la correccion c1, quitar Coahuila NO desploma nada -- beta_pres
      pasa de +3.15 a +4.20 y beta_int de -0.92 a -0.97. La inestabilidad que L6
      encontro era un artefacto de su especificacion de un solo beta. Ademas, la
      tabla de identificacion de P0 midio que la correccion c1 RESCATA 54
      transiciones del universo que L6 usaba como controles puros: las entidades
      siempre concurrentes hacen presidencial -> intermedia -> presidencial y
      bajo DeltaD = 0 no informaban, mientras que bajo DeltaD_pres/DeltaD_int SI
      identifican beta_pres - beta_int. Esa es, medida, la razon mecanica de la
      contaminacion de gamma que L6 §11 anticipo sin poder cuantificar.
    descomposicion_del_delta_de_L4:
      delta_L4_pp: 10.4790
      transicion_equivalente: "2023 sin federal -> 2024 presidencial, hueco 1, dDpres +1, dDint 0"
      alpha_por_hueco_pp: -0.444685
      beta_pres_pp: 3.154166
      suma_explicada_pp: 2.709480
      resto_no_identificado_pp: 7.769520
      porcentaje_explicado: 25.9
    benchmarks:
      alemania_leininger_rudolph_zittlau_2018_pp: 10
      eeuu_hajnal_lewis_2003_pp: 36
      maestra34_l4_entre_anios_pp: 10.4790
      maestra34_l6_concurrencia_sin_tipo_pp: 0.0149
      tepjf_1991_2018: NO-OBTENIDO
      lectura: >
        Ninguno de los dos benchmarks externos cae dentro de ninguno de los dos
        intervalos: el +10 aleman queda fuera del IC de beta_pres [-0.20, +6.50]
        y fuera del de beta_int [-3.78, +1.93]. El TEPJF sigue NO-OBTENIDO (P0 de
        este acto no lo adquirio, mesa no lo deposito) y NO se cita de memoria.
