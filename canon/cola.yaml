- id: D-11
  titulo: "El perímetro de 27 fichas del Hito D mezcla falsación de reglas con calibración de coeficientes, sin marca -- ninguna ficha declara cuál de las dos es"
  clase: decision
  abierto: 2026-07-30
  casos: 1
  bloquea: []
  evidencia: "ADR-47 (gobernanza) fija el distingo entre FALSAR UNA REGLA (¿existe el patrón?, veredicto binario, exige poder para resolver en ambas direcciones) y CALIBRAR UN COEFICIENTE (¿cuánto vale?, magnitud con banda, no exige poder refutador), a partir de CAL-G3 (cola.yaml D-09/D-10, hitoD-preregistro-v2_0.md Nota 8/Nota 9): el criterio de falsación de CAL-G3 resultó estructuralmente asimétrico -- puede confirmar G3, no puede refutarlo -- porque se le exigía a una tarea de calibración de magnitud un aparato de falsación binaria que nunca necesitó. Las 27 fichas del perímetro (R1.1 a R10.3, hitoD-preregistro-v2_0.md) usan todas el mismo vocabulario A/B/C/D sin declarar si cada una pregunta '¿existe el patrón?' o '¿cuánto vale?' -- CAL-G3 lo destapó por vivir fuera del namespace R, pero nada en el diseño del perímetro impide que una ficha R-numerada tenga el mismo defecto sin haberlo notado todavía."
  consecuencia: "Revisar las 27 y clasificar cada una como falsación o calibración (o mixta, con las dos preguntas separadas) es trabajo pendiente. Puede cambiar cuántas de las 27 son realmente falsables con el vocabulario A-D tal como está, y puede exigir partir alguna ficha del mismo modo que D-09 partió CAL-G3. ADR-47 fija el distingo pero deliberadamente NO reclasifica ninguna de las 27 -- ese trabajo queda aparte."
  estado: abierto
  nota_estado: "Abierta, sin resolver, por instrucción explícita del encargo que cierra D-09/D-10. No se revisan las 27 fichas en esta sesión."

