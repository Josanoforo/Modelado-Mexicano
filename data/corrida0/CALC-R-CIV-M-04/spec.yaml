seed:
  aplica: true
  valor: 20260909
  rng: numpy.PCG64
  nota: La semilla solo gobierna el bootstrap del estimando SECUNDARIO. El punto primario, su EE y su
    IC son deterministas. Es la misma semilla de la ola 2025 y del trio CSV, para que el metodo sea el
    mismo y no solo se parezca.
tolerancia:
  tipo: flotante
  abs: 1.0e-10
  razon: 'Punto y varianza deterministas, bootstrap fijado por seed y rng declarados, y sumas en orden
    fijo de fila. Los enteros y los textos se comparan EXACTO. NO se afloja para que el control positivo
    contra GEN1 pase: si no reproduce, eso es el hallazgo.'
resultados:
- id: RESULT-R-CIV-M-04-N-FILAS-TABLA
  tipo: entero
  unidad: filas activas de la tabla del modulo, unidad DELITO, antes de todo filtro (registros borrados
    del DBF excluidos y contados en PERFIL-DBF)
- id: RESULT-R-CIV-M-04-N-BP1-23-01-09
  tipo: entero
  unidad: filas con BP1_23 en {01..09} -- universo candidato de R, antes del filtro de ponderador
- id: RESULT-R-CIV-M-04-N-BP1-23-99
  tipo: entero
  unidad: 'filas con BP1_23 = 99 (No sabe / no responde): categoria real del instrumento que el universo
    de R excluye'
- id: RESULT-R-CIV-M-04-N-BP1-23-BLANCO
  tipo: entero
  unidad: filas con BP1_23 en blanco (campo de puros espacios) -- NO imputadas a cero, fuera de todo universo
- id: RESULT-R-CIV-M-04-N-SIN-PONDERADOR
  tipo: entero
  unidad: filas del universo candidato con FAC_DEL no finito o <= 0 -- contadas y excluidas
- id: RESULT-R-CIV-M-04-N-SIN-DISENO
  tipo: entero
  unidad: filas de U_R sin estrato o sin UPM -- entran al punto y forman pseudo-estrato de llave vacia
    en la varianza
- id: RESULT-R-CIV-M-04-N-CODIGO-FUERA-DE-CATALOGO
  tipo: entero
  unidad: filas con un codigo de BP1_23 que el catalogo de la ola NO declara (ni 01..09, ni 99, ni blanco)
    -- guardia de catalogo
- id: RESULT-R-CIV-M-04-N-INCONSISTENTES-BP1-20
  tipo: entero
  unidad: filas con BP1_23 en {01..09} y BP1_20 != 2 -- mide la diferencia entre la ruta de universo implicita
    de codificacion-R y la explicita de U1; NO cambia el estimando
- id: RESULT-R-CIV-M-04-N-BPCOD-HOGAR
  tipo: entero
  unidad: de U_R, delitos del bloque HOGAR de ESTA ola -- el tramo que U1 excluye
- id: RESULT-R-CIV-M-04-N-BPCOD-PERSONALES
  tipo: entero
  unidad: de U_R, delitos del bloque PERSONAL de ESTA ola -- el tramo del que sale U1
- id: RESULT-R-CIV-M-04-MASA-FAC-DEL
  tipo: flotante
  unidad: suma de FAC_DEL sobre U_R (delitos expandidos)
  permite_no_estimable: true
- id: RESULT-R-CIV-M-04-PUNTO
  tipo: proporcion
  unidad: '[PRIMARIO] R = proporcion ponderada de U_R con BP1_23 en {01,02,06}, unidad DELITO, ponderador
    FAC_DEL, escala [0,1], MAS ALTO = MAS PESO DEL MIEDO/DESCONFIANZA como razon principal'
  permite_no_estimable: true
- id: RESULT-R-CIV-M-04-EE
  tipo: flotante
  unidad: '[PRIMARIO] error estandar de diseno de R por conglomerado ultimo (tests/svystat.py:prop_ultimate_cluster),
    en proporcion'
  permite_no_estimable: true
- id: RESULT-R-CIV-M-04-IC-LO
  tipo: flotante
  unidad: '[PRIMARIO] limite inferior IC95 de R (p +- 1.959963985*EE, recortado a [0,1])'
  permite_no_estimable: true
- id: RESULT-R-CIV-M-04-IC-HI
  tipo: flotante
  unidad: '[PRIMARIO] limite superior IC95 de R'
  permite_no_estimable: true
- id: RESULT-R-CIV-M-04-N
  tipo: entero
  unidad: 'n NO PONDERADO de U_R: filas con BP1_23 en {01..09} y FAC_DEL valido'
- id: RESULT-R-CIV-M-04-CV
  tipo: flotante
  unidad: coeficiente de variacion EE/R, en proporcion (0.30 = 30%)
  permite_no_estimable: true
- id: RESULT-R-CIV-M-04-VEREDICTO-CV
  tipo: texto
  unidad: CV-ACEPTABLE / SKIP-POR-CV (regla CV >= 30% de PROCEDIMIENTO-R v1.0 §1, FP-79) / NO-ESTIMABLE
- id: RESULT-R-CIV-M-04-N-ESTRATOS
  tipo: entero
  unidad: estratos distintos presentes en U_R
- id: RESULT-R-CIV-M-04-N-UPM
  tipo: entero
  unidad: pares (estrato, UPM) distintos presentes en U_R
- id: RESULT-R-CIV-M-04-N-ESTRATOS-UPM-UNICA
  tipo: entero
  unidad: estratos de U_R con una sola UPM -- si es > 0 el IC es LIMITE INFERIOR de la anchura verdadera
- id: RESULT-R-CIV-M-04-METODO-IC
  tipo: texto
  unidad: IC-ULTIMATE-CLUSTER / IC-CON-ESTRATOS-DE-UPM-UNICA / NO-ESTIMABLE-DISENO-INCOMPLETO
- id: RESULT-R-CIV-M-04-PERFIL-DISENO
  tipo: texto
  unidad: 'perfil OBSERVADO de las llaves opacas sobre U_R: longitudes de estrato y de UPM con su conteo,
    y cuantas traen espacios en los bordes'
- id: RESULT-R-CIV-M-04-PERFIL-DBF
  tipo: texto
  unidad: 'perfil de la cabecera del DBF leido: registros que declara, longitud de registro y de cabecera,
    numero de campos, codepage, registros BORRADOS excluidos, registros truncados y registros efectivamente
    leidos'
- id: RESULT-R-CIV-M-04-PERFIL-BPCOD
  tipo: texto
  unidad: distribucion de BPCOD codigo por codigo, SIN ponderador y ANTES de todo filtro -- reporte ESTRUCTURAL
    que falsa el corrimiento de catalogo sin usar ningun resultado
- id: RESULT-R-CIV-M-04-N-U1
  tipo: entero
  unidad: 'n NO PONDERADO de U1, universo homologado a prereg-caja-ENVIPE-DENUNCIA: BPCOD del bloque personal
    de la ola, BP1_20 = 2, BP1_23 en {01..08}, FAC_DEL valido'
- id: RESULT-R-CIV-M-04-MASA-FAC-DEL-U1
  tipo: flotante
  unidad: suma de FAC_DEL sobre U1
  permite_no_estimable: true
- id: RESULT-R-CIV-M-04-P-C1-U1
  tipo: proporcion
  unidad: '[SECUNDARIO HOMOLOGADO -- PUNTO DE SERIE] proporcion ponderada de U1 con BP1_23 en {01,02,06},
    unidad DELITO, FAC_DEL, escala [0,1]. Mismo universo y misma codificacion que el punto de la ola 2025'
  permite_no_estimable: true
