universo: >-
  El de carga() del arbitro (tools/medidor_ahorro_enif24.py): TODAS las filas
  de TMODULO.csv (una por persona elegida 18+), sin un filtro mas. Guardias
  que PARAN: EDAD_V no numerica o < 18; FAC_PER no numerico positivo; alguna
  persona con las 15 variables de la seccion 5 en blanco; EST_DIS/UPM_DIS
  vacios; columnas de eje ausentes. El nacional es la ola entera. Por eje,
  las filas (fuera) se cuentan y no entran a ninguna celda.
filtros: >-
  Ninguno propio. Una celda es {eje == categoria} sobre la columna que el
  arbitro derivo; nunca se combinan dos ejes (guardia en codigo, R3/R4).
ponderador: >-
  FAC_PER. Toda proporcion es razon de totales ponderados sum(w*y)/sum(w),
  en el punto y en cada replica.
transformacion: >-
  Ejes por Eje.deriva del arbitro (EJES_P2 + EJE_CUENTA_PRINCIPAL, importados).
  ahorra_solo_informal := alguna P5_1_1..6 == "1" AND ninguna P5_6_1..9 == "1";
  informal_cualquiera := alguna P5_1_1..6 == "1" (desenlaces() del arbitro).
  Replicas compartidas por ola: n_h UPM con reemplazo por estrato, PCG64(42),
  10 000, orden lexicografico (receta de marginales_reproduccion.py:256-286).
  C2 punto := piso_log_aditivo(p_a sellado, p_b sellado, p_nac citado).
  C2_k := expit(logit p_k(a) + logit p_k(b) - logit p_k) sobre la replica k
  de los tres marginales; replica valida <=> los tres en (0,1) y definidos;
  IC95 := percentiles 2.5/97.5 (numpy.percentile) de las validas si son
  >= umbral_replicas_validas; si no, IC-NO-CONSTRUIBLE con causa.
estimando: >-
  IC95 del piso compuesto C2 (proporcion) por celda de cada par EMITIBLE de
  ENIF 2024, bajo el supuesto de ausencia de interaccion en escala logit. Mide
  ruido muestral de ese estimador; NO mide el error del supuesto. No es la
  conjunta, no es un efecto, no adopta. Estado EMITIDA-SIN-EVALUAR.
precision: >-
  (1) Punto e IC95 de cada marginal: wprop_ic_conglomerado (importada; seed
  42, 10 000, default_rng) -- la receta del arbitro, para el control 2.
  (2) IC95 de C2: replicas compartidas por ola (PCG64(42), 10 000), C2_k
  replica a replica. Cubre el ruido muestral; no cubre el error de
  especificacion del supuesto sin-interaccion.

dependencias_materiales: [numpy, pandas, yaml]
seed:
  aplica: true
  valor: 42
  rng: numpy.random.PCG64 (replicas compartidas) + numpy.random.default_rng (wprop_ic_conglomerado, receta del arbitro)
tolerancia:
  tipo: bootstrap
  exacto_por_seed: true
  abs: 1.0e-10
  razon: >-
    seed 42 + orden de consumo fijado en la spec humana §3 y en el medidor
    (un generador por ola, estratos y UPM en orden lexicografico, replicas
    0..9999). Enteros EXACTO; flotantes abs = 1e-10.

parametros:
