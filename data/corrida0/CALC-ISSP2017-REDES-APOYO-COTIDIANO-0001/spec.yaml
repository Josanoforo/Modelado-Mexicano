  P2 familia=1+2 y contraste mujeres-hombres; P3 conteo de v=7 y matriz de
  coocurrencia sobre quienes tienen cinco respuestas válidas.
estimando: >-
  Primera persona declarada a quien acudiría en cinco situaciones cotidianas;
  no apoyo recibido, disponibilidad, dinero, calidad del vínculo, causalidad,
  soledad, aislamiento, depresión ni capital social validado.
