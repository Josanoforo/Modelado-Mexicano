# Celda-D del TERCER piloto, registrada en estado SPEC-CONGELADA por
# ACTO GEN2-CELDA-D-PILOTO-3-COMMIT-1-v1_1 (20/sep/2026, CAJA). Nace con este acto
# Re-congelada por ACTO GEN2-CELDA-D-PILOTO-3-COMMIT-1-v1_2 (21/sep/2026, CAJA, FP-407):
# solo cableado del spec.yaml de los dos CALC (preflight VERDE); spec humana v1.1,
# sidecar, medidor.py y adjudicacion.py byte a byte iguales a 826bf3a1; mismos CALC-id.
# Congelada como SELLABLE por ACTO GEN2-CELDA-D-PILOTO-3-COMMIT-1-v1_3 (21/sep/2026, CAJA, ADR-589 -- renumerado 588 -> 589, PR #947 fusiono primero --,
# FP-260921-GEN2-CELDA-D-PILOTO-3-COMMIT-2-3-v1_2-a6f5-01 FIRMADA): permite_no_estimable en 292/565
# ids de EMISIONES-0002 y 174/349 de ADJUDICACION-0001; corrida0._valida_outputs vacia y cero no
# finitos en ocho caminos (celda rara incluida); ejecucion previa de #951 asentada (E.5); control
# 60-96 se recupera al cierre del COMMIT-3 como aritmetica derivada. .py, spec humana v1.1 y sidecar
# siguen byte a byte iguales a 826bf3a1; mismos CALC-id. Sucesor: COMMIT-2/3a/3 en OTRA sesion.
# porque el COMMIT-1 v1.0 (#903) no pudo registrarla (contrato de unidad, FP-393).
#
# ESTADO: SPEC-CONGELADA. Ninguna corrida sellada, ningún veredicto. El campo
# `estado_operativo: PENDIENTE` es el del contrato; el rótulo SPEC-CONGELADA viaja
# en `resultado` de cada candidato y en `veredicto`. Los COMMIT-2 (emisiones) y
# COMMIT-3 (R y adjudicación) los ejecuta OTRA sesión (F3, FP-400) y son los que
# llenan `adjudicacion_por_celda`, `margen_material`, `fecha/commit_adjudicacion`.
#
# FIRMAS DE MESA (20/sep/2026), verbatim en el encargo archivado
# `forense/encargos/2026-09-20-GEN2-CELDA-D-PILOTO-3-COMMIT-1-v1_1.md`:
#   FP-399 (S2): 97 es edad real censurada y se mantiene fuera del universo del
#     cruce; el COMMIT-2 lo cuenta con una sola variable; >1 % de la banda 60+ →
#     marca RESERVA-S2, no detiene.
#   FP-400 (herencia): el v1.1 hereda VERBATIM estimando, rejilla, PUNTUADA,
#     candidatos, λ, soporte, adjudicación, lectura secundaria y B-bis de la v1.0;
#     cambian sólo cuerpo, semántica de S2 y validación de «congelado».
#   Vigentes también: F1-bis (FP-389, rejilla 60-96 y residuo fuera del universo)
#   y F3 (quien congela no ejecuta).
#
# UNIDAD (FP-393 FIRMADA 21/sep/2026, GEN2-TRAMITE-FIRMAS-3 §2 4.2, opción
# «a»): `evento` entró a UNIDADES_OBJETIVO (tests/test_celdas_d.py). La regla
# `tramite.gobierno_digital.util_sin_coercion` modela la conducta de una
# PERSONA que paga; el instrumento la observa por TRÁMITE (sec_7, FAC_TRA) y
# el universo queda RESTRINGIDO A PAGOS DE LUZ REALIZADOS, declarado (A-bis 4;
# spec §1) -- quien hizo doce trámites contribuye doce veces: es un EVENTO, no
# una persona. Se sigue el precedente de
# `TRA.evade_norma.envipe2025.escolaridad_x_dominio` (unidad del modelo en
# `unidad_objetivo`; unidad del dato en `universo_instrumento`). No toca la
# celda-D `TRA…` (delito, envipe2025): queda listada como pregunta aparte
# (no se decide aquí qué unidad le corresponde).
# ─────────────────────────────────────────────────────────────────────────────
# AVISO FECHADO · 2026-09-21 · ACTO GEN2-CELDA-D-PILOTO-3-COMMIT-2-3-v1_3 (CAJA)
# EL PILOTO CORRIÓ. Emisiones selladas y en origin (d2488a98) ANTES del COMMIT-3a
# (704d5289, dos líneas sha256 en el spec.yaml del árbitro) y del COMMIT-3
# (CALC-GOB-DIGITAL-EXE-ADJUDICACION-0001--704d52894c2f). El orden del diff es el sello.
#
#   VEREDICTO B-bis (spec v1.1 §4.2, palabras de la spec): FALSADOR DÉBIL.
#   Nadie vence: Sλ vence a C2 en 3/15 PUNTUADA, S½ en 3/15 (umbral ¾ = 12);
#   12 INDECIDIBLE cada uno. ΔMAE = MAE(C2) − MAE(j): Sλ 1.465 pp IC95 [0.439, 2.115],
#   S½ 1.101 pp IC95 [0.256, 1.484] — los dos IC admiten > 0.5 pp, así que no cabe
#   «corroborada». MAE vs R: C2 3.411 · Sλ 1.946 · S½ 2.310 · C1a 10.654 · C1b 10.519 pp.
#   Soporte 2025: 15/15 PUNTUADA con n ≥ 200 (SOPORTE-FALLAN = 0; CON-SOPORTE);
#   18-29 × HASTA-PRIMARIA FUERA-DE-SOPORTE ex ante (n₂₀₂₅ = 67). S2: SIN-RESERVA
#   (1 trámite con código 97; fracción 0.00022 en 60+). C2 reproducido a 0.0.
#   `champion_actual` sigue NINGUNO: ESTE ACTO NO ADOPTA NADA. Un piso no vencido
#   se adopta salvo veto de mesa (A-bis 6): esa decisión es de mesa, no de aquí.
#
# LOS VALORES DE ABAJO SE ACTUALIZAN sólo en los campos que el cierre autoriza:
# `resultado` por candidato, `momentos_holdout_refs`, `estado_decidibilidad`,
# `margen_material`, `veredicto`, `output_nativo.valor_ref` y las dos estampas de
# adjudicación. El cuerpo firmado NO se edita. Cifras completas:
#   data/corrida0/CALC-GOB-DIGITAL-EXE-EMISIONES-0002/ · CALC-GOB-DIGITAL-EXE-ADJUDICACION-0001/
#   forense/notas/2026-09-21-GEN2-CELDA-D-PILOTO-3-COMMIT-2-3-v1_3-cierre.md
