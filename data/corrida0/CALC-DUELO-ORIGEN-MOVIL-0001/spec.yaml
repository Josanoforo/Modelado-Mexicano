etiquetas:
  generacion: GEN2
  unidad_transferencia: DELITO
  uso_motor: NO-ADOPTA-NADA
  cuenta_gen2: SI
  fuente_acto: GEN2-DUELO-ENVIPE2026-COMMIT-1 (21/sep/2026)
  diseno: forense/prereg-caja/DISENO-duelo-prospectivo-ENVIPE2026-v1_0.md (sha e88d3192) + enmienda v1_1
  firma_vigente: F7 (A)(B)(C) + D-22 ampliada + regla v0.3 + respuesta de mesa 'Ola anterior = 2024' (21/sep/2026), verbatim en la enmienda v1_1
  medidor_ejecutado_al_congelar: sintetico (tests/test_duelo_prospectivo.py, zips fabricados) y ensayo sobre olas abiertas (2023-2025); NUNCA sobre ENVIPE 2026
  tipo: VALIDACION-DE-ORIGEN-MOVIL (P3 ii)
  congelado: SI -- solo insumos versionados con sha
inputs:
- id: serie_nd
  origen: repo
  ruta: data/corrida0/envipe-serie-denuncia-v1_0.tsv
  sha256: 78e83b95710924ea12b51a5a9ed10ed8e84cb4184c9ff55ee4133e433a883993
- id: emisiones_piloto2
