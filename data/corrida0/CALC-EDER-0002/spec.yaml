  sucesor_de: "familia.corresidencia.adulto_familiar_actual -- re-especificacion de ventana ACTUAL (ACTO MAESTRA33-C1 · RESPEC-CORRESIDENCIA, 31/ago/2026, FP-204): p=0.057531, ic95=[0.051297,0.063913] (bootstrap simple de filas, seed 42), n=9397, ponderador factor. Sellada SIN CARGA en milpa/tramite-ola5-propuesta-v0.yaml:192-210 (MAESTRA38-SELLO-3). Producida por tools/tasas_base_corresidencia_actual.py bajo forense/notas/2026-08-31-c1-respec-corresidencia-spec.md. Los sellos viejos quedan intactos (E.3)."
