universo: >-
  U4, unidad persona de 18 años o más con al menos un delito personal no
  denunciado elegible en U1 (BPCOD 05..15, BP1_20=2, BP1_23 en 01..08),
  agregada por ID_PER y ponderada con FAC_ELE. Es exactamente el universo del
  RESULT padre; esta corrida no vuelve a construirlo desde microdatos.

filtros: >-
  No hay filtro nuevo. Se rechaza el padre si su unidad no es persona U4, si
  algún id apunta a U1, si VEREDICTO no es TASA-REPORTADA, si punto/IC/masa o
  denominador no son estimables, o si 0 <= IC_lo <= p <= IC_hi <= 1 no se
  cumple. Null, NS/NR y textos de no-estimabilidad no se convierten en cero.

ponderador: "FAC_ELE heredado del padre; no se accede a pesos ni microdatos."

transformacion: >-
  q=1-p; IC_lo(q)=1-IC_hi(p); IC_hi(q)=1-IC_lo(p). La clasificación padre a
  nivel persona es max(d_delito) sobre delitos elegibles: q=1 sólo cuando
  ningún delito elegible de la persona pertenece a C2={01,02,06,08}.

estimando: >-
  Proporción ponderada de personas U4 sin ningún delito elegible clasificado
  en el bloque padre C2. Es complemento dependiente, no tasa por delito, no
  probabilidad de denunciar, no categoría 09 Otra y no evidencia muestral
  independiente. Escala [0,1].

