      - data/inventario-reactivos-descargas-mx-v1_2.tsv líneas 47019, 47089, 47101, 47124
      - milpa/tramite.yaml regla familia.apoyo.recibe_dinero_familiares
    dependencias_pendientes:
      - codebook integrado ZA6980 que ligue valores de v26 con las categorías del formulario nacional
      - exclusión del duelo ciego actual o familia nueva no expuesta; la exposición observada no se revierte con una firma
      - regla M preexistente o enlace de constructo firmado antes de R; no transformar recepción en intención post hoc

