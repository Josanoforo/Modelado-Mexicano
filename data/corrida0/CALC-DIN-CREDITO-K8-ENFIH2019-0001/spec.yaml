universo: Créditos vigentes de nómina (TNomina) y personales (TPersonal) de la persona seleccionada del hogar, ENFIH 2019, con destino definido (códigos 1-8) y diseño válido; unidad PR = crédito
filtros: FACTOR positivo y diseño válido (EDIS, UPM_DIS no vacíos); 9 No sabe y blanco fuera del denominador (contados); sin filtro de edad ni de familia; ENSAFI 2023 no se lee (NO-ESTIMABLE por texto); tarjetas, automotriz, vivienda, educativo, grupal y 8.7 (informal) no se leen (sin destino o unidad P multirrespuesta)
ponderador: FACTOR (de la tabla del crédito)
transformacion: 'Diez desenlaces dicotómicos por crédito sobre el destino principal (spec §2: consumo=3, emergencia=5, emergencia+salud=5,6, refinanciar deuda=4, lista de mesa=3,4,5, vivienda=1, vehículo=2, salud=6, educación=7, otro=8); celdas nacional y por familia; un solo plan de réplicas; negocio NO-ESTIMABLE emitido como texto'
estimando: Proporciones ponderadas de créditos vigentes de nómina y personales (ENFIH 2019) por destino principal, con IC95 bootstrap, unidad PR, rotuladas CAMBIO-DE-INSTRUMENTO frente a K8 de mesa y sin serie con ENIF ni ENSAFI
seed:
  aplica: true
  rng: numpy.PCG64
  valor: 42
parametros:
  bootstrap_replicas: 10000
  metodo_ic: bootstrap UPM estratificado; percentiles 2.5/97.5; réplicas compartidas (una sola llamada a _estimate)
  n_soporte: 200
  tolerancia_coherencia: 1e-6 x den_w nacional; si se excede el medidor PARA
dependencias_materiales:
- numpy
- pandas
