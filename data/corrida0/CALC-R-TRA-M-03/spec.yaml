universo: 'de los 33000 registros de la tabla (roster de vivienda+persona), 4617 son menores de 18 (FAC_P18<=0, correctamente
  fuera del universo 18+); de los 28383 restantes (18 anios y mas), 22653 (79.8%) tienen respuesta individual valida en la
  seccion VIII y 5730 (20.2%) quedan en blanco en P8_3 pese a que la vivienda muestra R_DEF=00 (entrevista de vivienda completa)
  -- no-respuesta a nivel PERSONA (R_ELE con codigo distinto de 01 en su mayoria), distinta de la no-respuesta a nivel vivienda;
  arbitra.py los excluye igual que a cualquier codigo invalido (blanco no calza ''1'' ni ''2''), tratamiento estandar de no-respuesta.
  R se calcula sobre los 22653 adultos con respuesta valida. Este patron NO aparece en 2017/2021 (~0.2-0.4% en blanco): las
  tablas de datos abiertos de esas olas ya vienen filtradas al informante entrevistado, mientras que la tabla de 2013 conserva
  una fila por cada miembro del hogar en el roster, responda o no la seccion VIII -- diferencia de estructura de tabla entre
  olas, no de universo pretendido (las tres apuntan a poblacion de 18 anios y mas)'
filtros: solo los implícitos en la codificacion sellada; sin filtro adicional
ponderador: FAC_P18
transformacion: y=1 si P8_3=='1' (Si); y=0 si=='2' (No); 9 (No sabe / no responde) fuera
estimando: proporcion ponderada descriptiva definida por la fila sellada
dependencias_materiales:
