etiquetas:
  generacion: GEN2
  tipo: SERIE-POR-EJE
  cuenta_gen2: SI
  firma_de_contador: "Propuesta de dirección, encargo §2 (21/sep/2026), verbatim: «Las corridas de GEN2-ENUT-PISOS-Y-SERIE-1 cuentan (cuenta_gen2 = SI), sea cual sea el error que le encuentren a la persistencia.» CABECERA: «CONTADOR: sella corridas; cuenta_gen2 = SI (§2); no adopta»."
  validacion_independiente: NO-HECHA
  spec_sellada: forense/prereg-caja/ENUT-NUCLEO-ejes-spec-v1_0.md
  spec_sellada_sha256: f8481b8a0eaf1c4dc987215d8358f5b496e3bf60f2c635242af3e4dd825201cf
  estimando_autorizado_por_mesa: "Opción A (mesa, 21/sep/2026, en respuesta a la pregunta §6 del encargo): «Núcleo común + CON_CP 2024 como secundario». horas_cuidado_nucleo (C2) y nucleo_min (C3) son estimandos NUEVOS; CON_CP (C1) sólo en 2024 y secundario."
  contaminacion_declarada: "ADR-46: al congelar, la sesión había leído el dictamen ADR-557 (2019 vs 2024 por texto), CALC-ENUT-0001/spec.yaml y resultados.json (A-R = 0.2215, n = 29 181 hogares), tools/medidor_cuidado_enut.py, las 10 medias sexo_edad del marcador (R de ENUT 2024) y los FD/RNM de las cuatro olas. Ningún registro de microdato de ninguna ola. Lo genuinamente desconocido: si la suma de ítems crudos reproduce *_CON_CP (fórmula INEGI), el nivel del núcleo en cada ola y por eje, la anchura de los IC, cuántos ítems «Sí» vienen sin tiempo, y si el pasivo sin presencia de 2019 pesa más o menos que el pasivo presente de 2024."
  medidor_ejecutado_al_congelar: "SÍ, sobre datos sintéticos (tests/test_enut_nucleo_conducto.py: cuatro olas sintéticas, _valida_outputs contra este spec.yaml, respuesta conocida, celda rara, guardia y 11 mutaciones). Ningún dato real abierto."
