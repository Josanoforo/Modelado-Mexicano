script: data/corrida0/CALC-C2-COMPUESTO-RESERVADAS-0001/medidor.py

etiquetas:
  generacion: GEN2
  tipo: EMISIONES-C2-COMPUESTO-SOBRE-CRUCES-RESERVADA
  unidad_transferencia: "POR FILA (DELITO / TRAMITE / PERSONA elegida 18+) -- ningun numero cruza unidad"
  uso_motor: NO-ADOPTA-NADA
  cuenta_gen2: SI  # PROPUESTO -- nace PENDIENTE-DE-MESA salvo firma; `adoptados_activos` no se mueve
  estado_de_emision: EMITIDA-SIN-EVALUAR
  validacion_independiente: CONTROL-DE-REPRODUCCION-CONTRA-EL-C2-YA-SELLADO-DEL-PAR-PILOTEADO (RESULT-C2COMP-CONTROL-ARBITRO) + CONTRATO-C2-PINADO-EN-tests/test_celda_d_c2.py + tests/test_c2_compuesto.py (T32-ter en tests/check.py)
  fuente_acto: GEN2-C2-COMPUESTO-RESERVADAS-1
  firma_vigente: "mesa 19/sep/2026, verbatim en forense/encargos/2026-09-19-GEN2-C2-COMPUESTO-RESERVADAS-1.md; el careo adjunto que la firma cita NO esta en el arbol (0 de 5769 archivos) -- sha256/16 NO-VERIFICABLE-AQUI, ver spec §0"
  microdato_abierto: "NO -- ninguna ola reservada se abre; data/raw ausente en este entorno y no se pidio"
  orden_de_commits: "COMMIT-1 spec + dictamen (sin una sola emision) -> COMMIT-2 este CALC"

