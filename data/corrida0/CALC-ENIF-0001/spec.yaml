dependencias_materiales: [numpy]

parametros:
  fuente_acto: "ACTO GEN2-LOTE-ENIF-1 · TERCER LOTE DE LA CARTERA · CALC-ENIF-0001"
  firma_que_lo_autoriza: "Firma de mesa 9/sep/2026, verbatim: «Encargo ACTO GEN2-R-SERIE-DBF corriendo PR's mergeados, dame los siguientes encargos.» -- ordena el lote. Y, con OBJETO explicito sobre el contador, el parrafo del propio encargo: «cuenta_gen2 = SI para el CALC que este acto selle». Estandar FP-367/368 satisfecho."
  bootstrap_replicas: 1000
  umbral_replica_gen1: 1.0e-6
  grano_milpa_decimales: 6
  metodo_ic: "bootstrap de UPM_DIS CON REEMPLAZO dentro de EST_DIS, conservando el numero de UPM por estrato; percentiles 2.5/97.5"
  semilla: 20260909
  regla_estrato_upm_unica: >-
    Un estrato con exactamente una UPM se re-muestrea a si mismo: aporta
    varianza cero. NO se colapsa (decision de diseno que esta spec no esta
    autorizada a tomar) y NO se descarta (sesgaria el punto). Si el conteo es
    > 0, METODO-IC sale IC-CON-ESTRATOS-DE-UPM-UNICA y el IC se lee como
    LIMITE INFERIOR de la anchura verdadera, nunca como IC exacto.
  llaves_opacas: >-
    EST_DIS y UPM_DIS se agrupan como CADENA CRUDA. Nunca se convierten a
    entero ni se re-rellenan a un ancho tomado del descriptor: normalizarlas
    partiria o fusionaria estratos en silencio (leccion de ACTO
    GEN2-LOTE-ENVIPE-1, y de EST_DIS/UPM_DIS como llaves opacas).
  no_comparabilidad_de_ic: >-
    A-bis.3. Fase 1 (FP-201) midio SIN diseno; esta corrida SI lo estima. Los
    IC NO son comparables y NO se comparan: el control positivo compara SOLO
    el punto, y ninguna salida pone los dos IC lado a lado.
  encoding: >-
    Los .zip de INEGI mezclan UTF-8 y latin-1. La lectura prueba utf-8-sig y
    cae a latin-1, DECLARANDO cual uso. Todos los reactivos usados son codigos
    ASCII, asi que el encoding no puede cambiar ningun estimando; si lo
    cambiara, la guardia G-D5 (dominio de codigos) lo atrapa.
  guardias_que_paran:
    G-C1: "P5_23 no debe traer 'b' ni vacio: el FD dice que no lo trae. Si el archivo lo trae, el descriptor miente y el eje NO es una particion de la poblacion -> NO-ESTIMABLE-EJE-NO-ES-PARTICION, la familia C no se estima."
    G-C2: "{filas con P5_20 != b} debe ser subconjunto de {filas sin ninguna cuenta declarada en 5.4}. El flujo del cuestionario lo exige. Si no se cumple -> NO-ESTIMABLE-DENOMINADOR-C-NO-VERIFICADO."
    G-D1: "EST_DIS, UPM_DIS y FAC_PER existen en TMODULO.csv. Si falta una -> NO-ESTIMABLE-COLUMNA-AUSENTE."
    G-D2: "FAC_PER numerico y > 0 en toda fila usada; si no, se cuenta y se saca."
    G-D3: "Estratos con una sola UPM: se cuentan y se pesan; el IC sale rotulado, no se colapsa."
    G-D4: "EST_DIS y UPM_DIS se leen como TEXTO. Si el lector las entrega como numero -> PARO."
    G-D5: "El conjunto de valores distintos de cada reactivo usado debe ser subconjunto de los codigos del FD (mas '' y 'b'). Cualquier valor fuera -> se reporta con su conteo."
    G-P1: "EDAD_V minima observada debe ser >= 18 y su maxima > 70. Si la maxima fuese <= 70, la poblacion SI seria 18-70 y la premisa P2 del encargo tendria razon: se reporta y se corrige la escala."
  tablas:
    modulo: "TMODULO.csv"
  codificacion:
    A_corto_primario: ["1", "2"]
    A_nocorto_primario: ["3", "4", "5"]
    A_corto_s1: ["1"]
    A_nocorto_s1: ["2", "3", "4", "5"]
    A_p410_faltante: ["8", "9"]
    A_con_ss: ["1", "2", "3", "4"]
    A_sin_ss: ["7"]
    A_fuera_del_eje: ["5", "6", "9"]
    B_informal_items: [P5_1_1, P5_1_2, P5_1_3, P5_1_4, P5_1_5, P5_1_6]
    B_formal_items: [P5_6_1, P5_6_2, P5_6_3, P5_6_4, P5_6_5, P5_6_6, P5_6_7, P5_6_8, P5_6_9]
    B_si: ["1"]
    C_desconfia: ["03"]
    C_otras_razones: ["01", "02", "04", "05", "06", "07", "08", "09", "10"]
    C_conoce: ["1"]
    C_no_conoce: ["2"]
  valores_gen1_referencia:
    RES-0046: 0.3306
    RES-0047: 0.6694
    RES-0048: 0.1734
    RES-0049: 0.8266
    RES-0057: 0.284927
    RES-0058: 0.56192
    RES-0059: 0.06078
    RES-0060: 0.054767
  expectativa_del_control_declarada_antes_de_correr: >-
    Se ESPERA NO-REPRODUCE en la familia A (RES-0046..0049): el corte primario
    de esta spec es P4_10 en {1,2} y el de GEN1 es P4_10 = {1}. La
    sensibilidad S1 se emite precisamente para que la discrepancia sea
    ATRIBUIBLE y no misteriosa. NO-REPRODUCE no invalida la corrida, no
    autoriza tocar el medidor y no se ajusta hacia atras.
  criterio_adopcion_p3: >-
    CANTIDAD-MEDIDA (recibe cita corrida0_resultado_id + corrida0_generacion:
    GEN2 en milpa/tramite.yaml) si y solo si (1) su numerador es una categoria
    declarada del reactivo contada DIRECTAMENTE -- no 1 menos otra cosa -- y
    (2) el estimando no salio NO-ESTIMABLE. En otro caso
    COMPLEMENTO-CON-DENOMINADOR-RECORTADO: SIN cita y con fila NC de
    advertencia (patron NC-0085 del lote ENVIPE). La medicion decide, no la
    lista.
  adopcion_p3:
    consumidores:
      RES-0046: "milpa/tramite.yaml:dinero.ahorro.horizonte_corto:horizonte_corto <- A-P-CORTO-SIN"
      RES-0047: "…:dinero.ahorro.horizonte_corto:horizonte_no_corto <- A-P-NOCORTO-SIN"
      RES-0048: "…:dinero.ahorro.horizonte_no_corto_con_seguridad_social:horizonte_corto <- A-P-CORTO-CON"
      RES-0049: "…:dinero.ahorro.horizonte_no_corto_con_seguridad_social:horizonte_no_corto <- A-P-NOCORTO-CON"
      RES-0057: "…:dinero.ahorro.via_informal:formal_cualquiera <- B-P-FORMAL"
      RES-0058: "…:dinero.ahorro.via_informal:informal_cualquiera <- B-P-INFORMAL"
      RES-0059: "…:dinero.ahorro.seguro_deposito_enif2024:desconfianza_como_razon_principal_conoce_proteccion_enif2024 <- C-P-DESCONFIA-CONOCE"
      RES-0060: "…:dinero.ahorro.seguro_deposito_enif2024:desconfianza_como_razon_principal_no_conoce_enif2024 <- C-P-DESCONFIA-NOCONOCE"
    nota: >-
      RES-0047 y RES-0049 son los complementos aritmeticos de RES-0046 y
      RES-0048 dentro de su celda; PERO en esta spec se cuentan DIRECTAMENTE
      (P4_10 en {3,4,5}), no como 1 menos el otro, asi que satisfacen el
      criterio (1) y SI son cantidad medida. RES-0057 y RES-0058 NO son
      complementos entre si: son dos tasas que coexisten sobre el mismo
      denominador. RES-0059 y RES-0060 NO son complementos entre si: son dos
      tasas sobre denominadores distintos.
