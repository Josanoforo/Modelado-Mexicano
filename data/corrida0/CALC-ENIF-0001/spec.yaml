  spec_sellada_sha256: 697ab9e8084d5a7d8ae413778c9ef33303181a934c1c493980202f87580f10ab
  demanda_que_releva: "CORR-0009 (ENIF2024) -> los 8 RESULT que el encargo nombra: RES-0046..RES-0049 (familia A, horizonte por eje de seguridad social), RES-0057/RES-0058 (familia B, via formal e informal), RES-0059/RES-0060 (familia C, desconfianza por eje de conocimiento de la proteccion). NO releva RES-0031/RES-0032 (misma corrida, sellados por ACTO MAESTRA35-N1, fuera del encargo)."
  rotulo_de_corrida_corregido: "El encargo dice CORR-0017. CORR-0017 es S7-L17 (ENSANUT, vacunacion), 2 RESULT, entorno INDECIDIBLE-SIN-PAYLOAD-DECLARADO. La plaza ENIF2024 es CORR-0009. Se obedece la IDENTIDAD (los 8 RESULT por id, todos en CORR-0009 con payload enif_2024_enif_2024_bd_csv), no el rotulo."
  reglas_bajo_prueba: "NINGUNA cambia de cifra por esta corrida. dinero.ahorro.horizonte_corto, dinero.ahorro.horizonte_no_corto_con_seguridad_social, dinero.ahorro.via_informal y dinero.ahorro.seguro_deposito_enif2024 ya estan MEDIDAS y selladas en milpa/tramite.yaml (verificado con tools/ya_medido.py en el ARRANQUE). Este CALC monta la cadena E.2 sobre esas cantidades; la adopcion de P3 es CITA, no cambio de cifra."
  firma_de_contador: "FIRMA DE MESA 9/sep/2026 con OBJETO explicito, verbatim en el encargo archivado: «cuenta_gen2 = SI para el CALC que este acto selle». Firma que ordena el lote, verbatim: «Encargo ACTO GEN2-R-SERIE-DBF corriendo PR's mergeados, dame los siguientes encargos.» Estandar FP-367/368 satisfecho (autoridad + fecha + OBJETO). El merge de mesa la perfecciona."

