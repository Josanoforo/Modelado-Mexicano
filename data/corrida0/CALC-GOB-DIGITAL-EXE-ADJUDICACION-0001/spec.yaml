secuencia_commits:
  fuente: 'FP-407 (b), firmada 21/sep/2026; escrita por ACTO GEN2-CELDA-D-PILOTO-3-COMMIT-1-v1_2. Precedente de la casa: piloto 1, 16/sep/2026 -- c169edc9 (COMMIT-2, emisiones selladas, R no existe) -> 39bf1af3 (COMMIT-3a, contrato del arbitro fija el sha256 de las emisiones ya selladas, antes de correr) -> 18b99142 (COMMIT-3, R y adjudicacion). E.6 se conserva: R se deriva DESPUES de fijar el arbitro.'
  commit_2: 'OTRA sesion (F3): corrida0 run CALC-GOB-DIGITAL-EXE-EMISIONES-0002; sella; vista y replay (E.7); commit y push; git ls-remote confirma que el sello esta en origin antes de seguir.'
  commit_3a: 'La misma sesion del COMMIT-2, en commit aparte y ANTES de derivar R: escribe en ESTE spec.yaml la llave sha256 de los inputs emisiones_resultados y emisiones_sello (huellas de los archivos recien sellados, derivadas en la sesion), y verifica corrida0 preflight CALC-GOB-DIGITAL-EXE-ADJUDICACION-0001 = VERDE. Ninguna otra linea de este archivo cambia. Es la unica edicion admitida de un spec.yaml despues del COMMIT-1 v1.2, y no rompe ningun sello: este CALC aun no tiene corrida.'
  commit_3: 'corrida0 run CALC-GOB-DIGITAL-EXE-ADJUDICACION-0001: deriva R(a,b), soporte 2025, adjudicacion por celda, regla de 3/4, delta-MAE con IC; sella; vista y replay.'
  commit_3_cierre_control_60_96: 'ACTO GEN2-CELDA-D-PILOTO-3-COMMIT-1-v1_3 (firma de mesa 21/sep/2026): al cierre del COMMIT-3, las CUATRO restas |C2 del piloto - control de la casa| para las celdas 60-96 x {HASTA-PRIMARIA, SECUNDARIA, MEDIA-SUPERIOR, SUPERIOR}, entre dos numeros ya sellados -- RESULT-GOB-EXE15-2025-60-96-<esc>-C2-P (CALC-GOB-DIGITAL-EXE-EMISIONES-0002) y RESULT-C2COMP-ADOPTA-ENCIG2025-LUZ-EDADXESCOLARIDAD-60-X-<esc> (CALC-C2-COMPUESTO-RESERVADAS-0001; mismo universo, 60 <= edad <= 96 por tools/ejes_maestra35_l1.py:60; solo cambia el rotulo) -- se asientan en la nota de cierre rotuladas ARITMETICA DERIVADA, no como RESULT de corrida ni en resultados.json. Sustituyen a RESULT-GOB-EXE15-2025-60-96-<esc>-CONTROL-C2COMP-P y -C2-VS-CONTROL-ABS, que quedan null declarados (permite_no_estimable). El cierre lista ademas cada null emitido, por familia de id.'
  preflight_esperado_antes_del_commit_3a: 'BLOQUEADO exactamente por input_repo_ausente=emisiones_resultados, input_repo_no_commiteado=emisiones_resultados, input_repo_ausente=emisiones_sello, input_repo_no_commiteado=emisiones_sello -- y por nada mas.'
