# tests/procedencia.yaml — Auditoría de procedencia de los 144 números (eran 107 en v0.1.0)
#
# QUÉ ES. El Bloque A obliga a marcar la procedencia de la EVIDENCIA.
# Nadie obligaba a marcar la procedencia de los NÚMEROS. Este archivo lo hace:
# para cada valor del modelo, de dónde salió realmente.
#
# CLASES DE PROCEDENCIA
#   MEDIDO     — transcripción directa de un dato publicado y verificable
#   DERIVADO   — aritmética sobre un MEDIDO (típicamente su complemento a 1)
#   ORDINAL→CARDINAL — conversión de una etiqueta cualitativa de la ficha
#                      ("alto", "corto", "muy baja") a un número. La etiqueta
#                      tiene respaldo; el número concreto no.
#   ASIGNADO   — juicio informado. La fuente citada sostiene la DIRECCIÓN,
#                no la magnitud. Coherente con el corpus, no medido.
#   AJUSTADO   — reproduce los momentos observados (media, varianza,
#                transición) de un dato real; NO está identificado
#                causalmente. Contesta CUÁNTO, nunca SI EL PATRÓN EXISTE
#                (ADR-47). Exige campo `ruta:` con uno de: pseudo_panel |
#                momentos | composicion | transversal_con_seleccion.
#                Rutas: procedimiento sellado por ADR-102 (18/ago/2026) en
#                forense/metodologia-identificacion-vs-ajuste-v0_1.md §4
#                (v1.0 — SELLADA; ADR-49 sella la clase, ADR-102 el cómo).
#                `ruta: composicion` exige la regla de descomposición
#                DECLARADA ANTES de ver los datos; inventada después es
#                post-hoc (Bloque C, validación forense). Sellada por
#                ADR-49 (D2): nace VACÍA, cero números AJUSTADO hoy;
#                ningún ASIGNADO se reclasifica por este cambio.
#   MEDIDO·PARCIAL(x) — sexta clase, sellada 3/ago/2026. Condicional medida
#                empíricamente (distribución sobre desenlaces, no media
#                puntual) sobre un subconjunto DECLARADO x de los ejes de
#                atributos de `modelo §1.1.A` — nunca los seis a la vez.
#                (x) lista los ejes efectivos entre paréntesis. Distinta de
#                MEDIDO (que implicaría condicionar sobre los 6 ejes) y de
#                ASIGNADO/PENDIENTE (que implicarían cero medición). Hueco
#                de taxonomía señalado sin resolver por
#                `forense/notas/2026-08-03-cal-conf-faseb-medicion.md` §4
#                ("no 'MEDIDO' pleno... ni 'ASIGNADO'/'PENDIENTE'"); esta
#                sesión lo sella y reclasifica sus primeros tres usos, ver
#                `condicionales_confianza_institucional` abajo.
#   MEDIDO·NACIONAL — séptima clase, sellada 13/ago/2026 (ADR-79(a), D-A,
#                firma de mesa verbatim: "crear una clase séptima para
#                marginales medidas sin eje"; escrita por `PROC-10-bis`).
#                Condicional medida empíricamente (distribución sobre
#                desenlaces, no media puntual) SIN eje condicionante
#                declarado -- marginal nacional, x = ∅. Distinta de
#                MEDIDO·PARCIAL(x): ahí (x) lista un subconjunto DECLARADO
#                de los ejes de `modelo §1.1.A`, nunca vacío -- x = ∅ es
#                precisamente lo que MEDIDO·PARCIAL(x) no admite (hueco de
#                taxonomía verificado y declarado, no ejecutado, por
#                `ACTO PROC-10`, `forense/notas/2026-08-13-proc-10.md`
#                §1-§3). Distinta también de ASIGNADO/PENDIENTE (que
#                implicarían cero medición). NO HABILITA SEGMENTACIÓN:
#                admitir una θ a esta clase no abre su condicional POR eje
#                -- quien la necesite corre la medición condicionada aparte
#                (puerta **D3-B**, dueño "acto futuro por θ", nombrada y no
#                ejecutada aquí; ver `forense/notas/2026-08-13-proc-11.md`
#                §5). Sus primeros usos, ver
#                `condicionales_escalares_medido_nacional` abajo.
#   EVIDENCIA_EXPERIMENTAL_TERCEROS — octava clase, sellada 25/ago/2026
#                (FP-144, ejecuta la PROPUESTA-SELLADA de FP-131,
#                `forense/notas/2026-08-25-eval-compartamos.md` §7.1;
#                ACTO PACK-NUBE2-CIERRE-R101, ADR-184). Un número
#                sostenido por evidencia identificada de un EXPERIMENTO
#                ALEATORIZADO DE TERCEROS -- la clase (iii) de
#                `ADR-57(c)`, distinta de ASIGNADO (que no exige que la
#                fuente sea ella misma un diseño aleatorizado) y de
#                AJUSTADO (que reproduce momentos, no cita un
#                experimento). Dos campos obligatorios, cada valor con
#                su propia cita: `cita` (referencia bibliográfica o
#                identificador del paquete de réplica) y `llave_id`
#                (fila de `forense/registro-llaves-identificacion-v1_0.md`
#                que ejerce esa evidencia -- sin llave no hay dónde
#                anclar la procedencia, y esta clase no admite "llave
#                pendiente"). Nació VACÍA 25/ago/2026; primer consumo
#                26/ago/2026 (FP-164 opción (b), ADR-204,
#                `evidencia_experimental_terceros` abajo, llave_id
#                EXP-COMPARTAMOS-1). Las dos citas de `Progresa_RCT` que
#                ya vivían en
#                el corpus (`asignados_probabilidad` abajo y
#                `milpa/refutations.yaml` `ref.A.05.no_saben_planear`)
#                NO se reclasifican aquí: no existe fila de llave para
#                `Progresa_RCT` en el registro de llaves (solo existe
#                `EXP-COMPARTAMOS-1`, un paquete distinto), así que
#                falta el `llave_id` obligatorio -- quedan declaradas
#                EXCEPCIÓN FECHADA 25/ago/2026 en su propio sitio, no
#                movidas sin llave.
#
# ADVERTENCIA DE LECTURA. Que 96% de los números no sea MEDIDO no es un
# escándalo por los estándares del campo: los ABM asignan parámetros de forma
# rutinaria. El escándalo sería no poder distinguir cuál es cuál. Este archivo
# convierte un problema invisible en uno visible — que es todo lo que se le
# puede pedir hoy, y el prerrequisito de arreglarlo mañana.

version: "0.2.0"
estado: >-
  verificado contra canon/modelo-decision-v3_4.md en ce0658c (31/jul/2026):
  asignados_probabilidad tiene 13 entradas/29 valores (confirmado por conteo
  directo) y el resumen declara 39 -- consistente (4 MEDIDO + 6 DERIVADO + 29
  ASIGNADO = 39). El motor v3.4 declara 49 reglas SI-ENTONCES en §3.B, no 43
  como cita el comentario de la línea de abajo (resumen.desglose,
  probabilidades_de_regla): ese denominador quedó de una versión anterior del
  motor y no se corrige aquí (no es número de esta sesión, ver ADR de la
  mesa). De esas 49, solo 15 llevan algún valor numérico (4 MEDIDO + 1
  vacunación-cuasi-medido en DERIVADO + 13 entradas ASIGNADO repartidas sobre
  10 reglas propias); 34 reglas no tienen ningún valor -- MEDIDO, DERIVADO
  ni ASIGNADO -- ni en este archivo ni en canon. CORREGIDO 31/jul/2026
  (decisión de mesa, D4): decía "18 con valor, 31 sin" -- ese conteo trataba
  las 18 ENTRADAS de asignados_probabilidad como 18 reglas distintas, pero
  tres pares de esas entradas apuntan a la MISMA regla (las dos mitades
  condicionales de un bullet: dinero.ahorro.informal_sin_puente +
  con_puente_y_respaldo; tramite.gobierno_digital.coercitivo +
  util_sin_coercion; civico.denuncia.sin_seguro + con_seguro). Contando
  reglas, no entradas: 15 con valor, 34 sin -- ver forense/cobertura-motor.md
  para el detalle línea por línea. Sin cobertura alguna: los 4 dominios
  completos de trabajo (§3.2),
  familia (§3.5), tiempo (§3.6), cooperación (§3.8) y comunicación (§3.10) --
  20 reglas -- y 3 de las 4 de información/creencia (§3.9). Aún requiere
  verificación de primaria: las 4 entradas MEDIDO. Pendiente aparte: los ids
  "dominio.categoria.nombre" de asignados_probabilidad (p.ej.
  dinero.ahorro.informal_sin_puente) no existen literalmente en
  canon/modelo-decision-v3_4.md -- el motor describe sus 49 reglas en prosa,
  sin id estable -- así que el cruce por dominio de arriba es lo más fino que
  se puede derivar sin adivinar a qué bullet corresponde cada id.

# ══════════════════════════════════════════════════════════════════
# CAMBIOS v0.1.0 → v0.2.0  ·  28 de julio de 2026
# ══════════════════════════════════════════════════════════════════
# El archivo se quedó en el esquema del modelo v1 mientras el modelo pasaba
# a v2. Cuatro correcciones:
#
#   1. ADR-30 — `familismo` se desdobla en `familismo_apoyo` y
#      `familismo_obligacion`. El v0.1.0 tenía UN parámetro monotónico
#      positivo, que es exactamente la forma funcional que la refutación
#      ref.A.23 tumbó.
#      ⚠ `familismo_apoyo` SE CONSERVA EN G3 (corrección de mesa a la
#      propuesta original de ADR-30): en G3 el mecanismo es pooling ante
#      volatilidad —la tanda—, y §3.1 enruta el ahorro informal por ahí.
#      En G5 es seguro ante Estado ausente. No hay doble conteo.
#   2. Cambio 7 del modelo v2 — G1 se desdobla en G1a (adopción por canal
#      personal) y G1b (difusión radial). G1b está CONTRADICHO por su propio
#      registro (Nu, Kueski, Aplazo difundieron sin puente personal): sus
#      coeficientes quedan A REVISIÓN, no asignados.
#   3. Conteo total 107 → 144. Recomputado, no estimado. Desglose abajo.
#   4. DEUDA NUEVA Y VISIBLE — los 90 parámetros de dispersión de ADR-28.d.
#      Este archivo es el que debe listarlos. Hoy no los tiene, y por eso el
#      check de varianza intraperfil del modelo §1.2 NO PUEDE CORRER.
# ══════════════════════════════════════════════════════════════════

resumen:
  total_numeros: 144          # era 107 en v0.1.0 (esquema del modelo v1)
  medido: 4
  derivado: 6
  ordinal_a_cardinal: 60      # +6 · familismo_obligacion en los 6 perfiles
  asignado: 74                # +30 vector confianza · +1 coef familismo_obligacion
  porcentaje_no_medido: "97.2%"
  desglose:
    probabilidades_de_regla: 39      # 18 reglas implementadas de 43; recuento
                                     # pendiente cuando existan los 10 rules/*.yaml
    coeficientes_de_generador: 15    # era 14
    params_base_de_perfil: 90        # era 54 · 15 params × 6 perfiles

  delta_v1_v2:
    params_base: "+36 · 9 → 15 parámetros por perfil"
    familismo_desdoblado: "+6 · ORDINAL→CARDINAL (la etiqueta medio/alto existe en modelo §1.1)"
    confianza_institucional_vector: "+30 · ASIGNADO. ⚠ SIN POBLAR: modelo §1.3 declara el vector de 6 componentes (seguridad · educación · salud · electoral · justicia-policía · financiera) y da porcentajes NACIONALES, no valores por perfil. Nadie ha medido confianza en la Marina por perfil. (Fila del esquema v3.4/tabla-de-perfiles. Bajo `modelo` v4.0 tres de los seis componentes se reclasifican como condicionales `MEDIDO·PARCIAL(x)`, no como celdas de esta tabla — ver `condicionales_confianza_institucional` abajo. El conteo de 144/30 de esta fila no cambia: es del esquema viejo, congelado.)"
    coeficiente_nuevo: "+1 · familismo_obligacion en G5, ASIGNADO y SIN MAGNITUD (spec: 'signo negativo o no monotónico')"
    disparadores_de_dominio: "0 · los 42 NO cuentan: entran como booleanos de contexto, no como parámetros calibrables (adenda a ADR-26)"

# ══════════════════════════════════════════════════════════════════
# RECLASIFICACIÓN v4.0 · 3 de 6 componentes de confianza_institucional pasan
# a MEDIDO·PARCIAL(x) — condicionales del reencuadre perfiles→atributos
# (`modelo §1.1.F`, contador "condicionales medidas sobre atributos"), NO
# celdas de la tabla de perfiles vieja de arriba. Autorizada por el encargo
# que sella la clase MEDIDO·PARCIAL(x) (ver CLASES DE PROCEDENCIA arriba).
# Fuente única: forense/notas/2026-08-03-cal-conf-faseb-medicion.md §1-5
# (PR #50 fusionado). Los otros 3 componentes (seguridad-FFAA, electoral-
# partidos, justicia-policía) NO se tocan aquí: siguen ASIGNADO/SIN POBLAR,
# candidata adyacente sin confirmar (hitoE-campana-medicion-v2_0.md §12).
# CORREGIDO 3/ago/2026: los tres restantes se reclasifican en la sección
# siguiente (ola 2) — ya no están sin tocar.
# ══════════════════════════════════════════════════════════════════
condicionales_confianza_institucional:
  salud:
    clase: "MEDIDO·PARCIAL(edad)"
    antes: "ASIGNADO, dentro de confianza_institucional_vector, SIN POBLAR"
    fuente: "ENCIG 2021, P11_1_3 'Confianza en hospitales públicos' — forense/notas/2026-08-03-cal-conf-faseb-medicion.md §1.1, §3.1, §4"
    n_util: 38458
    eje_condicionante: "edad (18–29 · 30–44 · 45–59 · 60+)"
    nota: >
      Proporción ponderada (FAC_P18) + IC95% por conglomerado último
      (UPM_DIS/EST_DIS), condicionada solo a edad -- formalidad, urbanización,
      ingreso y acceso digital NO DISPONIBLES en este instrumento (nota §1.1).
      No es MEDIDO pleno (implicaría los 6 ejes de x) ni ASIGNADO.
  educación:
    clase: "MEDIDO·PARCIAL(formalidad,edad,urbanización,ingreso,acceso_digital)"
    antes: "ASIGNADO, dentro de confianza_institucional_vector, SIN POBLAR"
    fuente: "ENCUCI 2020, AP5_2_6 'Confianza en universidades públicas' — forense/notas/2026-08-03-cal-conf-faseb-medicion.md §1.2, §3.2, §4"
    n_util: 18771
    eje_condicionante: "formalidad × edad (conjunto) + urbanización, ingreso, acceso digital (marginales, un eje a la vez); migración NO DISPONIBLE"
    nota: >
      No cruza los seis ejes de x simultáneamente (§1.4 de la nota) -- es
      condicional genuina sobre un subconjunto declarado, no una media
      puntual.
  financiera:
    clase: "MEDIDO·PARCIAL(formalidad,edad,urbanización,migración,ingreso)"
    antes: "ASIGNADO, dentro de confianza_institucional_vector, SIN POBLAR"
    fuente: "ENIF 2024, índice P11_1_1-P11_1_5 — forense/notas/2026-08-03-cal-conf-faseb-medicion.md §1.3, §3.3, §4"
    n_util: 10264
    eje_condicionante: "formalidad × edad (conjunto) + urbanización, migración, ingreso (marginales, un eje a la vez); acceso digital NO VERIFICADO"
    nota: >
      Mismo límite de alcance que educación (§1.4 de la nota): condicional
      genuina sobre un subconjunto declarado de x, no sobre los seis ejes
      a la vez.

# ══════════════════════════════════════════════════════════════════
# RECLASIFICACIÓN v4.0 · ola 2 · 3/ago/2026 · los 3 componentes restantes
# de confianza_institucional pasan a MEDIDO·PARCIAL(x) — completa el
# vector: 6 de 6 componentes de confianza_institucional ahora
# MEDIDO·PARCIAL(x). CAL-CONF Fase B, segunda ola. Fuente única:
# forense/notas/2026-08-03-cal-conf-faseb-medicion-ola2.md §1-5.
# Matiz declarado por la nota (§5, cierre), que instruye explícitamente que
# viaje aquí: a diferencia de salud/educación/financiera (un solo reactivo
# o índice por componente), estos tres quedan medidos POR INSTITUCIÓN
# dentro del componente — instituciones/ítems separados, sin colapsar a un
# escalar único. El contador de una sola línea de `modelo` no captura este
# matiz; este archivo sí.
# ══════════════════════════════════════════════════════════════════
  seguridad-FFAA:
    clase: "MEDIDO·PARCIAL(edad,dominio), por institución"
    antes: "ASIGNADO, dentro de confianza_institucional_vector, SIN POBLAR"
    fuente: "ENVIPE 2025, TPer_Vic1 (91 182 filas) — AP5_4_04 (Guardia Nacional) · AP5_4_08 (Ejército) · AP5_4_09 (Fuerza Aérea) · AP5_4_10 (Marina), cada una condicionada a identificar la institución (AP5_3_XX=1) — forense/notas/2026-08-03-cal-conf-faseb-medicion-ola2.md §1.2, §3.1, §5"
    n_util: "91182 filas de tabla; base efectiva por institución (identifica) = 71742 GN · 75260 Ejército · 31963 FA · 56181 Marina"
    eje_condicionante: "edad (18–29·30–44·45–59·60+) y dominio (urbano/complemento urbano/rural), por institución"
    nota: >
      MEDIDO·PARCIAL(x), por institución: 4 instituciones separadas, no un
      escalar único (1 eje conjunto de 6 celdas + 1 marginal, por
      institución). El universo efectivo de cada reactivo AP5_4_XX es
      "quienes identifican esa institución" -- no-aplicabilidad
      estructural (blanco = no aplica), no imputada, no no-respuesta.
  justicia-policía:
    clase: "MEDIDO·PARCIAL(edad,dominio), por institución"
    antes: "ASIGNADO, dentro de confianza_institucional_vector, SIN POBLAR"
    fuente: "ENVIPE 2025, TPer_Vic1 (misma tabla) — AP5_4_01 (Tránsito) · AP5_4_02 (Preventiva) · AP5_4_03 (Estatal) · AP5_4_05 (Ministerial/Judicial) · AP5_4_06 (MP y Fiscalías Estatales) · AP5_4_07 (FGR) · AP5_4_11 (Jueces) — forense/notas/2026-08-03-cal-conf-faseb-medicion-ola2.md §1.3, §3.2, §5"
    n_util: "91182 filas de tabla; base efectiva por institución (identifica) de 18398 (Jueces, 20.2%) a 59383 (Policía Estatal, 65.1%)"
    eje_condicionante: "edad (18–29·30–44·45–59·60+) y dominio (urbano/complemento urbano/rural), por institución"
    nota: >
      MEDIDO·PARCIAL(x), por institución: 7 instituciones separadas, mismo
      tratamiento de no-aplicabilidad estructural que seguridad-FFAA. La
      celda más pequeña del acto es Jueces x 60+ con 2328 casos -- ninguna
      celda cae bajo el mínimo de soporte (30).
  electoral-partidos:
    clase: "MEDIDO·PARCIAL(formalidad,edad,dominio), por ítem"
    antes: "ASIGNADO, dentro de confianza_institucional_vector, SIN POBLAR"
    fuente: "ENCUCI 2020, SEC_4_5 (21 519 filas, mismo join que educación en la primera ola) — AP5_2_5 (Partidos políticos) · AP5_3_6 (Senadores y diputados federales) · AP5_3_7 (Diputados locales) · AP5_3_8 (Instituto Nacional Electoral) — forense/notas/2026-08-03-cal-conf-faseb-medicion-ola2.md §1.4, §3.3, §5"
    n_util: "21519 filas de tabla; útiles por ítem entre 19398 (Diputados locales) y 19859 (INE)"
    eje_condicionante: "formalidad × edad (conjunto, 8 celdas) + dominio (marginal), por ítem"
    nota: >
      MEDIDO·PARCIAL(x), por ítem: 4 ítems separados (2 ejes conjuntos +
      1 marginal cada uno), no un escalar único. La celda más frágil de
