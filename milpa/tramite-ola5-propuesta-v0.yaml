        # remesas P041" entre sus propios disparadores, y el desenlace que
        # aqui se mide ES recibir remesas: condicionar seria vacuo
        # (p(remesas|remesas)). Se mide la tasa base incondicional sobre el
        # universo completo de hogares y se declara la circularidad, en vez
