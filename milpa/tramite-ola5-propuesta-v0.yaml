    hallazgo: "p=99.6% es un techo casi saturado -- artefacto del diseno 'alguna vez en la vida' (colapso sobre ~38 filas-año por persona x 5 variables): con una probabilidad de acierto pequeña por fila, la probabilidad de al menos un acierto en 190 oportunidades se satura cerca de 1. Se reporta tal cual sale del procedimiento -- 'el primer resultado que produzca este procedimiento es el que se reporta' -- no se filtra ni se recorta a una definicion mas estricta sin que mesa lo pida."
    sha256_payload: "bcc7eb90c2d016976fd8ba24528ce614bf4db0c29a1e3e0cf674bdfb024de0e3"
