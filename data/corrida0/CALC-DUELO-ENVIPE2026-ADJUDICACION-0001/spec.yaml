universo: 'DELITOS (una fila por delito de tmod_vic). EN: BP1_20 in {1,2}, unidad DELITO, FAC_DEL (prereg-caja-ENVIPE-EVASION-NORMA). ND: delitos personales (BPCOD personales) con BP1_20 == 2 y BP1_23 en
  catalogo, el universo del medidor sellado de la serie. La ola nueva se abre SOLO por el guardian (tools/celda_d/marginales_reproduccion.py): un eje por firma en emisiones; cruces en adjudicacion.'
filtros: 'Los del guardian, identicos en todas las olas: BP1_20 in {1,2} (las demas filas se cuentan y salen); FAC_DEL numerico > 0 si no PARA; EST_DIS/UPM_DIS no vacios si no PARA; ID_PER unica en tsdem
  si no PARA; delitos sin persona se cuentan y quedan (fuera) de escolaridad; edad fuera de 18..96 y sexo fuera de {1,2} van a (fuera). Serie ND: solo olas con comparabilidad == NINGUNA-EN-C1-U1 (2011 fuera).'
ponderador: FAC_DEL (Factor delito, Numerico 6). Toda proporcion es razon de totales ponderados sum(w*y)/sum(w).
transformacion: 'evade_norma := (BP1_20 == ''2'') AND (BP1_23 a dos digitos in {04,05,06,08}). Ejes del guardian (ESC_2DIG de NIV; DOMINIO U/C/R; SEXO; tramos_edad). Nacional: K = p_{t-1}; T3/T5/TC = OLS
  en logit sobre ola_encuesta, IC por propagacion delta de los EE por ola. E+ = expit(logit p_eje,t-1 + logit T* - logit p_nac,t-1). Cruces: familia de la spec §4 (C2, P, S1, SL, AP) en logit, replica k
  con k.'
estimando: R nacional (ND, EN), R marginal por eje y R de los cruces SXD/EXD en la ola nueva; errores en pp por contendiente; regla v0.3 por par; lectura mecanica del B-bis nacional. Reproduce las emisiones
  antes de abrir R o PARA.
precision: Replicas compartidas por ola (PCG64(42), n_h UPM con reemplazo por estrato, orden lexicografico, 10 000); IC95 percentil 2.5/97.5; IC del arbitro por wprop_ic_conglomerado (importada) en P y
  R; IC de T* por propagacion delta; E+ con sorteo normal en logit del termino T*. No cubre el error de especificacion de ningun candidato.
dependencias_materiales:
- numpy
- pandas
seed:
  aplica: true
  valor: 42
  rng: numpy.random.PCG64 (replicas compartidas por ola; generador propio para E+); la serie ND en adjudicacion usa el medidor sellado con su seed 20260909
tolerancia:
  tipo: bootstrap
  exacto_por_seed: true
  abs: 1.0e-10
  razon: seed 42 + orden de consumo fijado por el guardian (un generador por ola, estratos y UPM lexicograficos, replicas 0..9999) y por la serie sellada; enteros exactos, flotantes abs 1e-10
parametros:
  bootstrap_replicas: 10000
  umbral_soporte_n: 200
  serie_nd_input: serie_nd
  comparabilidad_homogenea: NINGUNA-EN-C1-U1
  control_tol_p: 1.0e-06
  constante_motor_evade_norma: 0.562774
  constante_motor_tol: 1.0e-06
  constante_motor_cita: 'milpa/tramite.yaml:497 evade_norma_envipe2025 p: 0.562774'
  regla_v0_3: dMAE = MAE(C2) - MAE(retador) sobre PUNTUADAS, IC95 por replica; VENCE-RETADOR si IC95inf > 0.5 pp; PROPUESTA-CON-RESERVA si 0 < IC95inf <= 0.5; NADIE-VENCE si incluye 0; retador primario
    SL
  umbral_vence_pp: 0.5
  umbral_reserva_pp: 0.0
  familia:
    C2: expit(logit m_t(a) + logit m_t(b) - logit m_t)
    P: x_t'(a,b)
    S1: expit(logit C2 + Ibar)
    SL: expit(logit C2 + lambda*Ibar), lambda = tau2/(tau2+sigma2), momentos
    AP: expit(logit x_t'(a,b) + logit m_t - logit m_t')
  nacionales:
    K: p_{t-1} con IC sellado
    T3: OLS logit ultimas 3
    T5: OLS logit ultimas 5
    TC: OLS logit todas (>= 6)
  l_estado: NO-ENTRA -- este acto no corre LLM (spec §5)
  punto_de_entrada: adjudicacion
  prefijo_result: RESULT-DUELO26-ADJ
  ola_nueva: 2026
