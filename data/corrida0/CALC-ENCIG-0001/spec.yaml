  - {archivo: "encig2025_01_sec1_A_3_4_5_8_9_10.csv", variable: P8_3_1, rol: "DESENLACE A -- 8.3 inciso 1: servidor(a) publico(a) intento apropiarse o solicito de forma directa", codigos: "Numerico(1): 1=Si, 2=No, 9=No sabe/no responde", direccion: "1 si P8_3_1=1; 0 si =2. MAS ALTO = MAS SOLICITUD DECLARADA."}
  - {archivo: "encig2025_01_sec1_A_3_4_5_8_9_10.csv", variable: P8_3_2, rol: "DESENLACE A -- 8.3 inciso 2: tercera persona o coyote", codigos: "Numerico(1): 1=Si, 2=No, 9=No sabe/no responde", direccion: "entra en SOLANY, no en SOL1"}
  - {archivo: "encig2025_01_sec1_A_3_4_5_8_9_10.csv", variable: P8_3_3, rol: "DESENLACE A -- 8.3 inciso 3: insinuo o genero las condiciones", codigos: "Numerico(1): 1=Si, 2=No, 9=No sabe/no responde", direccion: "entra en SOLANY, no en SOL1"}
  - {archivo: "encig2025_01_sec1_A_3_4_5_8_9_10.csv", variable: FAC_P18, rol: "ponderador de la unidad A (persona 18+)", codigos: "Numerico"}
  - {archivo: "encig2025_01_sec1_A_3_4_5_8_9_10.csv", variable: EST_DIS, rol: "estrato de diseno -- estratificacion del bootstrap (LLAVE DE TEXTO OPACA)", codigos: "Alfanumerico -- NO se convierte a entero ni se re-rellena"}
  - {archivo: "encig2025_01_sec1_A_3_4_5_8_9_10.csv", variable: UPM_DIS, rol: "UPM -- conglomerado que se re-muestrea (LLAVE DE TEXTO OPACA)", codigos: "Alfanumerico"}
  - {archivo: "encig2025_04_sec_7.csv", variable: ID_TRA, rol: "llave del join hacia sec_8", codigos: "Alfanumerico"}
  - {archivo: "encig2025_04_sec_7.csv", variable: NT_TIPO, rol: "numero de evento del tramite (descriptor: «Numero de tramite / Ultimo evento»), 01-03 -- lo que hace que ID_TRA NO sea unico", codigos: "Alfanumerico 01-03"}
  - {archivo: "encig2025_04_sec_7.csv", variable: N_TRA, rol: "tipo de tramite -- filtro de universo de la familia C (01 = pago ordinario del servicio de luz)", codigos: "Numerico(2), 01..23E", direccion: "NO-APLICA (nominal)"}
  - {archivo: "encig2025_04_sec_7.csv", variable: P7_3, rol: "CANAL -- 7.3 tipo de lugar o medio al que acudio/recurrio", codigos: "Numerico(1): 1=Instalaciones de gobierno, 2=Banco/supermercado/tienda/farmacia, 3=Lineas de atencion telefonica, 4=Internet (web/app), 5=Cajero automatico o kiosco inteligente, 6=Modulos/clinicas/oficinas temporales o moviles, 7=No se ha podido concluir, 8=Otro, 9=NS/NR, b=blanco", direccion: "B: presencial={1}, digital={3,4,5}, residuo={2,6,7,8,9,b}. C: adopta={4,5}, no-adopta={1,2,6}, residuo={3,7,8,9,b}."}
  - {archivo: "encig2025_04_sec_7.csv", variable: FAC_TRA, rol: "ponderador de la unidad tramite (familias B y C)", codigos: "Numerico"}
  - {archivo: "encig2025_04_sec_7.csv", variable: EST_DIS, rol: "estrato de diseno de B y C (LLAVE DE TEXTO OPACA)", codigos: "Alfanumerico"}
  - {archivo: "encig2025_04_sec_7.csv", variable: UPM_DIS, rol: "UPM de B y C (LLAVE DE TEXTO OPACA)", codigos: "Alfanumerico"}
  - {archivo: "encig2025_04_sec_7.csv", variable: CVE_ENT, rol: "componente de la llave primaria DECLARADA por el descriptor (guardia G-2)", codigos: "Numerico(2) 01..32"}
  - {archivo: "encig2025_04_sec_7.csv", variable: UPM, rol: "componente de la llave primaria DECLARADA (guardia G-2)", codigos: "Alfanumerico"}
  - {archivo: "encig2025_04_sec_7.csv", variable: V_SEL, rol: "componente de la llave primaria DECLARADA (guardia G-2)", codigos: "Numerico 1-10"}
  - {archivo: "encig2025_04_sec_7.csv", variable: R_ELE, rol: "componente de la llave primaria DECLARADA (guardia G-2)", codigos: "Alfanumerico 01-30"}
  - {archivo: "encig2025_05_sec_8.csv", variable: ID_TRA, rol: "llave del join desde sec_7 (guardia G-4: unicidad)", codigos: "Alfanumerico"}
  - {archivo: "encig2025_05_sec_8.csv", variable: P8_4, rol: "DESENLACE B -- 8.4 en cual de los tramites se suscitaron las anteriores circunstancias", codigos: "Numerico(1): 1=Si, 0=No, b=blanco  (OJO: el 'no' es 0, no 2)", direccion: "1 si P8_4=1; 0 si P8_4=0. MAS ALTO = MAS MORDIDA EN ESE TRAMITE."}
  - {archivo: "encig2025_05_sec_8.csv", variable: P8_6, rol: "familia X (hallazgo, NO consumidor) -- cantidad de la que se apropiaron", codigos: "Numerico(1): 1=No le dio nada, 2=Hasta $200, 3=$201-500, 4=$501-1000, 5=$1001-5000, 6=Mas de $5000, 7=Otros, 9=NS/NR, b=blanco", direccion: "DIO-ALGO = 1 si P8_6 en {2..7}; 0 si =1"}
  - {archivo: "encig2025_05_sec_8.csv", variable: FAC_P18, rol: "ponderador de la familia X (el que trae la tabla sec_8)", codigos: "Numerico"}

universo: >-
  ENCIG 2025 (INEGI). Poblacion de 18 anos y mas residente en ciudades de 100
  mil habitantes o mas -- 82 areas urbanas, estampa del manifiesto: NINGUN
  estimador de esta spec es nacional. Periodo de referencia 2025 (el reactivo
  8.3 dice «Durante 2025»).
  U_A, unidad PERSONA: filas del archivo persona con P8_3_1 en {1,2} y FAC_P18
  finito > 0. U_SOLANY: ademas, si ningun inciso de 8.3 es 1 y alguno es
  9/blanco, la fila SALE (contada) -- un 9 no borra un 1 en otro inciso, pero
  impide afirmar el 0.
  U_B, unidad EVENTO DE TRAMITE: filas de sec_7 emparejadas con sec_8 por
  ID_TRA, con P8_4 en {0,1} y FAC_TRA finito > 0. Rama SD (PRIMARIA) sin
  deduplicar; rama CD deduplicando sec_7 por ID_TRA (primera fila en orden de
  archivo). Canal presencial = P7_3=1; digital = P7_3 en {3,4,5}; el residuo
  P7_3 en {2,6,7,8,9,blanco} se cuenta y se pesa, NO se reasigna.
  U_C, unidad TRAMITE tipo 01 (pago ordinario del servicio de luz): filas de
  sec_7 con N_TRA=1, P7_3 en {1,2,4,5,6} y FAC_TRA finito > 0, SIN deduplicar.
  Residuo P7_3 en {3,7,8,9,blanco} contado y pesado.
  U_X, familia de hallazgo: filas de sec_8 con P8_6 en {1..7} y FAC_P18 valido.

filtros: >-
  Sale del universo, CONTADO y no imputado: P8_3_1 = 9 (A-N-P831-NSNR) y
  P8_3_1 blanco/no numerico (A-N-P831-BLANCO); P8_4 blanco/no numerico
  (B-N-P84-BLANCO); P7_3 fuera del par de cada familia (B-N-RESIDUO-CANAL /
  C-N-RESIDUO); ponderador no finito o <= 0 (*-N-SIN-PONDERADOR).
  Se cuenta pero NO sale del punto: filas sin EST_DIS o sin UPM_DIS
  (*-N-SIN-DISENO) -- afectan al IC, no al estimador.
  CERO NUNCA SUSTITUYE FALTA DE DATO.
  Si falta una columna declarada -> NO-ESTIMABLE-COLUMNA-AUSENTE:<col>; si
  existe y no trae ningun valor valido -> NO-ESTIMABLE-COLUMNA-VACIA:<col>; si
  un universo queda vacio -> NO-ESTIMABLE-UNIVERSO-VACIO; si la llave del join
  no es unica -> NO-ESTIMABLE-LLAVE-NO-UNICA y las ramas de B no se estiman
  (no se elige otra llave sobre la marcha). Si TODA fila de un universo carece
  de diseno -> METODO-IC = NO-ESTIMABLE-DISENO-INCOMPLETO y los IC salen null,
  pero el punto se reporta igual.

ponderador: >-
  FAC_P18 en la familia A (y en X, que es el factor que trae sec_8). FAC_TRA en
  las familias B y C -- el factor de los tramites captados en la seccion VI,
  descriptor §1.4. NO se usa FAC_VIV (factor de vivienda, otra unidad).

transformacion: >-
  d(SOL1) = 1 si P8_3_1=1, 0 si =2.
  d(SOLANY) = 1 si alguno de P8_3_1/P8_3_2/P8_3_3 = 1; 0 si los tres = 2; la
  fila sale de U_SOLANY si ninguno es 1 y alguno es 9/blanco.
  d(B) = 1 si P8_4=1, 0 si P8_4=0.
  d(C) = 1 si P7_3 en {4,5}, 0 si P7_3 en {1,2,6}.
  d(X) = 1 si P8_6 en {2..7}, 0 si P8_6=1.
  p(U) = suma(w*d)/suma(w) sobre U, sumas en ORDEN FIJO DE FILA.
  Los complementos se emiten como suma ponderada de la categoria contraria
  sobre el MISMO denominador, y ademas se emite la SUMA como prueba mecanica.
  NO se promedia entre olas, no se ajusta tendencia, no se extrapola, no se
  imputa, no se re-escala.

estimando: >-
  DESCRIPTIVO. (1) PRIMARIOS: A-P-SOLANY (solicitud de soborno por cualquiera
  de los tres incisos del reactivo 8.3, unidad PERSONA); B-P-PRE-SD y
  B-P-DIG-SD (mordida por canal, unidad EVENTO DE TRAMITE, sin deduplicar);
  C-P-ADOPTA (uso de canal digital/autoservicio en el pago de luz, unidad
  TRAMITE). (2) SECUNDARIOS DECLARADOS: A-P-SOL1 (la celda GEN1) y su delta
  contra SOLANY -- lo que vale restringir 8.3 a su primer inciso; B-P-PRE-CD y
  B-P-DIG-CD (rama deduplicada, celdas GEN1 base) y el conteo de eventos que la
  deduplicacion borra; los complementos con su denominador escrito; los pesos
  residuales que contestan si cada par es exhaustivo o solo lo parece bajo el
  recorte; y la familia X (pago efectivo), que NO releva a ningun consumidor.
  NINGUN RESULT ES CAUSAL: B-DIFERENCIA-PRE-DIG-SD y B-RAZON-PRE-DIG-SD van
  rotuladas ASOCIACION -- la eleccion de canal y la elegibilidad por canal
  confunden la comparacion.

dependencias_materiales: [numpy]

parametros:
