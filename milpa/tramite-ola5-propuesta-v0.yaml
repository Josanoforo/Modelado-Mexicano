# ADR-270 + TRA-M-03/05/07 (ya públicas) + TRA-M-08..12 (este acto).
# CUERPO INTACTO en tramite.yaml (ADR-68(a), motor congelado) — este
# acto solo documenta la refutación, no edita el motor. La entrada de
# abajo (`_encig_serie`) es la que SUSTITUYE candidata, a diferencia de
# la entrada `tramite.mordida.discrecional` de arriba (ENCUCI2020, FP-200=b,
# ADR-236) que CONVIVE con el 0.62 sin sustituirlo — distinción explícita
# del encargo (D2-b).
