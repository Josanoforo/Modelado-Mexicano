etiquetas:
  generacion: GEN2
  tipo: MEDICION-DESCRIPTIVA-ENCUESTA-TRANSVERSAL
  cuenta_gen2: SI
  cuenta_gen2_firma: >-
    Encargo 43 GEN2-SHED-BNPL-DANO-UNIVERSOS, 11/sep/2026: autoriza
    explícitamente abrir y congelar la spec de CALC-SHED2025-BNPL-DANO-0001,
    calcular cinco salidas reales y entregar CALC/RESULT. Cuenta un CALC
    científico, no cinco muestras ni la descarga documental; el merge de mesa
    perfecciona la firma.
  validacion_independiente: VERIFICACION-DIRIGIDA-POST-SELLO
  demanda_que_releva: >-
    Extiende la cobertura SHED de #734 con cinco estimandos descriptivos. La
    evidencia permanece estadounidense y NC-0164 conserva el residual mexicano,
    contractual y causal.
  uso_motor: DESCRIPTIVO-NO-CALIBRA-NI-ADOPTA
  medidor_ejecutado_al_congelar: NO

inputs:
  - {id: gen2_federal_reserve_shed_2025_public_csv, origen: manifiesto}
  - {id: gen2_federal_reserve_shed_2025_codebook, origen: manifiesto}
  - {id: gen2_federal_reserve_shed_2025_appendix_a_questionnaire, origen: manifiesto}

variables:
  - {archivo: public2025.csv, variable: shedid, rol: llave persona, codigos: texto no vacío y único}
  - {archivo: public2025.csv, variable: weight, rol: ponderador transversal, codigos: flotante finito positivo}
  - {archivo: public2025.csv, variable: weight_pop, rol: control de identidad no usado en puntos, codigos: flotante finito positivo}
  - {archivo: public2025.csv, variable: BK1, rol: filtro de cuenta bancaria, codigos: "Yes=1;No=0"}
  - {archivo: public2025.csv, variable: BK2_f, rol: sobregiro previo y filtro BNPL1A, codigos: "Yes=1;No=0;vacio=no aplica si BK1=No"}
  - {archivo: public2025.csv, variable: BNPL1, rol: uso BNPL último año, codigos: "Yes=1;No=0"}
  - {archivo: public2025.csv, variable: BNPL3, rol: atraso BNPL último año, codigos: "Yes=1;No=0;Refused=rechazo"}
  - {archivo: public2025.csv, variable: BNPL3A, rol: cargo extra por atraso, codigos: "Yes=1;No=0;vacío=no aplica o falta según ruta"}
  - {archivo: public2025.csv, variable: BNPL1A, rol: cargo sobregiro o NSF atribuido a BNPL, codigos: "Yes=1;No=0;vacío=no aplica o falta según ruta"}
  - {archivo: public2025.csv, variable: BNPL4_e, rol: única forma de poder pagar, codigos: "Yes=1;No=0"}

universo: >-
  Personas adultas de Estados Unidos en SHED 2025; corte transversal de
  12,934 personas. Cada estimando conserva el subuniverso del cuestionario.
filtros: >-
  Uso: BNPL1 válido. Atraso: BNPL1=Yes. Cargo: BNPL1=Yes y BNPL3=Yes; la
  ruta BNPL3 rechazada se reporta aparte. Sobregiro: BNPL1=Yes, BK1=Yes y
  BK2_f=Yes. Asociación: BNPL1=Yes y BNPL4_e/BNPL3 válidos. Vacíos no son No.
ponderador: >-
  weight, ponderador transversal de postestratificación escalado al tamaño
  muestral. Punto como razón de masas; weight_pop sólo control de identidad.
transformacion: >-
  Traducción exacta de etiquetas CSV Yes/No; Refused, Don't know y vacío se
  conservan como faltantes distintos. No se crean ceros fuera de ruta.
estimando: >-
  Cuatro proporciones ponderadas (uso, atraso, cargo condicional, sobregiro
  condicional) y una tabla 2x2 con diferencia descriptiva de atraso entre
  motivo de asequibilidad sí/no. Estados Unidos; ninguna afirmación causal.
dependencias_materiales: []
seed: {aplica: false, valor: null, rng: NO-APLICA}
tolerancia:
  tipo: flotante
  abs: 1.0e-10
  razon: sumas deterministas redondeadas a 12 decimales; enteros y textos exactos
parametros:
  filas_esperadas: 12934
  columnas_esperadas: 815
  miembro_csv: public2025.csv
  periodo: 2025
  pais: Estados Unidos
  precision: NO-CALCULADA-SIN-DISENO-COMPLETO-ACREDITADO
  adopcion: NINGUNA
  residual: NC-0164-ABIERTO

