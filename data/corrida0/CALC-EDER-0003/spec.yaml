  - {id: RESULT-EDER-UNION-A-DELTA-VS-GEN1, tipo: texto, unidad: "NO-APLICA-ESTIMANDO-DISTINTO -- constante declarada, NO se calcula: GEN1 mide ENADID 2023 (situacion conyugal actual), esta corrida mide EDER 2017 (tipo de primera union)"}
  - {id: RESULT-EDER-UNION-A-ADOPCION, tipo: texto, unidad: "LISTADO-PARA-MESA / NO-ADOPTABLE-NO-ESTIMABLE"}
