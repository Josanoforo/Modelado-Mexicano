- numpy
- pandas
etiquetas:
  generacion: GEN2
  unidad_transferencia: TRAMITE
  uso_motor: NO-ADOPTA-NADA
  cuenta_gen2: SI
  cuenta_gen2_nota: 'propuesto por el encargo (CONTADOR: cuenta_gen2 SI); no adopta retadores'
  fuente_acto: GEN2-DUELO-ENCIG2025-CIERRE-1
  firmas: FP-260923-GEN2-DUELO-ENCIG2025-CIERRE-1-657c-01 FIRMADA (§2 del encargo, mesa 23/sep/2026)
  orden_de_commits: COMMIT-1 (spec+codigo+D22) -> COMMIT-2 emisiones -> COMMIT-3a sha de emisiones -> COMMIT-3 R
    y adjudicacion
  celda_d: GOB.gobierno_digital.encig2025.edad_x_sexo y .escolaridad_x_sexo (se registran en COMMIT-3)
  tipo: ARBITRO-CRUCE-Y-ADJUDICACION-CELDA-D
  commit: COMMIT-3
  condicion: SE NIEGA A CORRER si la auditoria de su codigo no sale limpia, sin los sellos de las dos emisiones
    (sha256 verificado) o con un input fuera de la lista
  medidor_ejecutado_al_congelar: SI -- fixtures sinteticos y oro ENCIG 2023 (tests/test_encig_duelo_2025.py); NUNCA
    sobre 2025
secuencia_commits:
  commit_2: corrida0 run de las dos emisiones; sello; asiento de replay; commit y push.
  commit_3a: 'misma sesion, commit aparte y ANTES de derivar R: escribe aqui el sha256 de los cuatro inputs emisiones_*;
    preflight VERDE. Ninguna otra linea cambia.'
  commit_3: 'corrida0 run de este CALC: R por celda de los dos cruces, soporte, adjudicacion, DeltaMAE con IC, B-bis,
    cobertura, IC de C2; sello; celdas-D; asientos.'
  preflight_esperado_antes_del_commit_3a: BLOQUEADO exactamente por input_repo_ausente e input_repo_no_commiteado
    de emisiones_edadxsexo_resultados, emisiones_edadxsexo_sello, emisiones_escolaridadxsexo_resultados y emisiones_escolaridadxsexo_sello
    -- y por nada mas.
