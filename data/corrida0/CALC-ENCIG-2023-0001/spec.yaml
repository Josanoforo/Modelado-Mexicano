# CALC-ENCIG-2023-0001 -- cara mecanica de spec.md (ACTO GEN2-FIRMAS-MESA-1, OBJETO 4).
# Gobierna spec.md y, sobre el, la spec SELLADA
# forense/prereg-caja/ENCIG-MORDIDA-2023-spec-v1_0.md (`prereg-caja-ENCIG-MORDIDA-2023`).
# SUCESORA de CALC-ENCIG-0001 (familia B): MISMO estimando, otra ola. No reescribe su sello.
# CONGELADO en el COMMIT-1, en NUBE, antes de abrir un solo byte de microdato.
calc_id: CALC-ENCIG-2023-0001
spec_md: spec.md
spec_md_sha256: 1b832ce674a743d8a0ecaa8cbb25ace1c5c49d3b4c9fcef78b07d5eccd5b0a16

script: data/corrida0/CALC-ENCIG-2023-0001/medidor.py

etiquetas:
  generacion: GEN2
  tipo: TASA-BASE-DE-REGLA
  cuenta_gen2: PENDIENTE-DE-MESA
  validacion_independiente: NO-HECHA
  spec_sellada: forense/prereg-caja/ENCIG-MORDIDA-2023-spec-v1_0.md
  spec_sellada_sha256: ea4379e5d659e5b103b6d8d20db2a166bdbfc93caa27a3408efe771c6b76bda6
  demanda_que_releva: "CANDIDATURA PARA MESA, NO RELEVO CONSUMADO. CORR-0001 (ENCIG2023, payload encig23_base_datos_csv) lista 4 RESULT: RES-0001/RES-0002 (tramite.mordida.discrecional:paga_mordida / :tramite_normal, 0.62/0.38, ASIGNADO) y RES-0007/RES-0008 (tramite.mordida.con_registro:tramite_normal / :paga_mordida, 0.88/0.12, ASIGNADO). Esta spec NO mide la familia A, asi que RES-0001/RES-0002 quedan intactos. RES-0007/RES-0008 son ASIGNADO SIN PARTIR POR CANAL y lo que esta spec produce SI esta partido por canal: cual brazo (o que agregacion) sustituye a un ASIGNADO sin canal es decision de mesa y esta spec NO la toma. Decirlo es el entregable; darlo por concedido seria el error. NO releva CORR-0002 (ENCIG2025, ya relevada por CALC-ENCIG-0001) ni ninguna otra corrida."
  reglas_bajo_prueba: "NINGUNA cambia de cifra por esta corrida. tramite.mordida.con_registro (R3.2) conserva TODAS sus cifras selladas en milpa/tramite.yaml:170-188 (paga_mordida 0.12 ASIGNADO; _encig2025_presencial 0.116000; _digital 0.027358; _presencial_r2 0.141041; _digital_r2 0.029868) y tramite.mordida.discrecional (R3.1) no se toca en absoluto. Este CALC monta la cadena E.2 sobre la ola 2023, que hoy no tiene MEDIDO. La adopcion la decide mesa por merge, no este acto: esta spec NO escribe cita en milpa/ bajo ninguna rama y NO crea conducta nueva."
  firma_de_contador: "NO-FIRMADA. La firma de mesa del 15/sep/2026 («Si a todas.», OBJETO 4 de la HOJA DE FIRMAS DE MESA 2026-09-15) autoriza MEDIR ENCIG 2023 con spec sucesora -- «Spec aqui; corrida en caja» -- y NO declara OBJETO sobre el contador GEN2. El OBJETO 1 de la misma hoja SI declara cuenta_gen2 = SI, pero solo para las corridas que MEDICION-DEMANDA selle sobre CORR-0011/0012/0013/0014, y este CALC no es ninguna de ellas. Estandar FP-367/368 (autoridad + fecha + OBJETO explicito sobre el contador) NO satisfecho aqui -> cuenta_gen2 queda PENDIENTE-DE-MESA, y se dice en vez de darselo por concedido."
  contaminacion_declarada: "ADR-46 -- al congelar, la sesion YA conocia (a) los dos puntos GEN2 de la ola 2025 con toda su precision: RESULT-ENCIG-MOR-B-P-PRE-SD = 0.1410407168724654 (n=11167 eventos, 381 estratos, 2996 UPM) y RESULT-ENCIG-MOR-B-P-DIG-SD = 0.029867554626649372 (n=7219, 362 estratos, 2518 UPM), con su lectura «razon ~4.2x, IC95 sin traslape» (milpa/tramite.yaml:185,187,216); (b) las cifras GEN1 selladas de milpa/tramite.yaml reglas tramite.mordida.*: 0.116000/0.884000, 0.027358/0.972642, 0.141041/0.858959, 0.029868/0.970132, 0.085118/0.914882, y los ASIGNADO de CORR-0001 (0.62/0.38, 0.88/0.12); (c) la codificacion completa de 2025: P8_4 en {0,1} con el 'no' en 0, presencial={1}, digital={3,4,5}, FAC_TRA como ponderador de evento, la distincion SD/CD y el papel de NT_TIPO; (d) los rotulos rol_uso: proxy_descriptivo y NO-ADOPTAR-NC-0107 sobre esas celdas. NO es ciega, y aqui la coincidencia de codificacion es DELIBERADA Y OBLIGATORIA: el OBJETO 4 pide una SUCESORA -- el mismo estimando sobre otra ola -- y elegir otra codificacion convertiria la sucesora en un estimando nuevo, que la firma no autoriza. Lo genuinamente desconocido al congelar: cuantos estratos y cuantas UPM hay en U_B de 2023 y cuantos estratos quedan con UPM unica; el soporte observado de P8_4 en 2023 (si el 'no' sigue siendo 0 y no 2, y cuanto pesa el blanco); el soporte observado de P7_3 en 2023 y el peso del residuo de canal; si ID_TRA es unica en sec_8 de 2023 y si la llave de control empareja el mismo conjunto de filas, es decir SI EL JOIN ES SIQUIERA EXACTO; la cobertura del join sec_7 x sec_8 en esta ola; y la anchura del IC bajo esta semilla. Ninguno de los seis aparece en fuente alguna leida: el inventario indexa nombres de columna, no valores, y declara ademas que ENCIG esta entre los 102 instrumentos con texto_reactivo vacio al 100%."
  medidor_ejecutado_al_congelar: "NO -- y el medidor tampoco se escribe aqui. El OBJETO 4 dice, verbatim, «Spec aqui; corrida en caja»; el encargo pide las dos capas (D-15: md humana + spec.yaml) abriendo SOLO codebook y metadato -- E.5 lo permite en nube, microdato jamas, y en esta sesion data/raw/ NO EXISTE y numpy/pandas/pyreadstat estan AUSENTES. Consecuencia declarada: `python3 tools/corrida0.py preflight CALC-ENCIG-2023-0001` reporta BLOQUEADO:script_ausente hasta que CAJA escriba el medidor, y eso es CORRECTO, no un defecto de esta spec."

