variables:
  - {archivo: "encig2023_04_sec_7.csv", variable: P7_3, rol: "CANAL -- reactivo 7.3, tipo de lugar o medio al que acudio/recurrio para el tramite; vive SOLO en sec_7, y por eso la medicion exige el join", codigos: "Numerico(1), mapa heredado verbatim de prereg-caja-ENCIG-MORDIDA v1.0 §2.2: 1=Instalaciones de gobierno, 2=Banco/supermercado/tienda/farmacia, 3=Lineas de atencion telefonica, 4=Internet (web/app), 5=Cajero automatico o kiosco inteligente, 6=Modulos/clinicas/oficinas temporales o moviles, 7=No se ha podido concluir, 8=Otro, 9=NS/NR, b=blanco. El mapa es del descriptor de 2025: si 2023 exhibe soporte fuera de {1..9,blanco} -> NO-ESTIMABLE-CODIGO-FUERA-DE-MAPA:P7_3, NO se reinterpreta", direccion: "presencial={1}, digital_registrado={3,4,5}, residuo={2,6,7,8,9,b} contado y pesado, NUNCA reasignado"}
  - {archivo: "encig2023_04_sec_7.csv", variable: FAC_TRA, rol: "PONDERADOR de evento de tramite -- se toma de ESTE archivo, no de sec_8, donde el ponderador que existe es FAC_P18 sobre OTRO universo (A.15(c)). Ver parametros.archivo_de_ponderador: es PARAMETRO, no detalle", codigos: "Numerico; flotante tal cual, sin normalizar ni redondear ni truncar"}
  - {archivo: "encig2023_04_sec_7.csv", variable: EST_DIS, rol: "ESTRATO de diseno -- estratificacion del bootstrap (LLAVE DE TEXTO OPACA); se toma del lado sec_7, el que corresponde a la unidad del ponderador", codigos: "Alfanumerico -- cadena cruda (dtype=str), nunca a entero ni re-rellenada"}
  - {archivo: "encig2023_04_sec_7.csv", variable: UPM_DIS, rol: "UPM -- conglomerado que se re-muestrea (LLAVE DE TEXTO OPACA); lado sec_7", codigos: "Alfanumerico -- cadena cruda"}
  - {archivo: "encig2023_04_sec_7.csv", variable: ID_TRA, rol: "LLAVE PRIMARIA DEL JOIN hacia sec_8 -- la misma que uso CALC-ENCIG-0001 sobre 2025, elegida por CONTINUIDAD DEL ESTIMANDO", codigos: "Alfanumerico -- cadena cruda"}
  - {archivo: "encig2023_04_sec_7.csv", variable: NT_TIPO, rol: "numero de evento del tramite -- lo que distingue la rama SD de la CD; existe en sec_7 de 2023 (verificado en el inventario) y NO existe en sec_8", codigos: "Alfanumerico"}
  - {archivo: "encig2023_04_sec_7.csv", variable: ID_VIV, rol: "componente 1/4 de la LLAVE DE CONTROL del join (guardia G-5)", codigos: "Alfanumerico"}
