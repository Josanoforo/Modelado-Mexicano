# forense/prereg-caja/EDER-CORRESIDENCIA-ACTUAL-DISENO-spec-v1_0.md
# (`prereg-caja-EDER-CORRESIDENCIA-ACTUAL-DISENO`).
# Sucesor con diseno de familia.corresidencia.adulto_familiar_actual (MAESTRA33-C1, FP-204).
# Hermano de CALC-EDER-0001 (mismo lector y misma varianza; otro estimando).
# CONGELADO en el COMMIT-1, antes de leer un solo VALOR del microdato.
