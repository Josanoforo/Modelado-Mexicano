  spec_sellada_sha256: 97254a0f8f8440ad4dd41ba293bada845ffb97c76a37b33b6ffca9a223c69449
  spec_hermana: forense/prereg-caja/EDER-CORRESIDENCIA-DISENO-spec-v1_0.md
