    INT-1 (PR #148) ya habia estableciendo que el archivo de 102MB es estructuralmente INTEGRO (25 miembros, testzip() limpio) y clasificado como NO_COINCIDE (hash), no CORRUPTO. MAP-1b habia planteado "hipotesis: carrera, no truncacion". Esta re-baja no puede distinguir entre (a) el valor original 784410e6/2895872 fue una lectura parcial de ESTA MISMA descarga capturada a medio camino, o (b) la URL servia un archivo genuinamente distinto el 2026-08-05 que ya no esta disponible -- ambas hipotesis quedan abiertas para mesa. Lo que SI establece con certeza: el contenido que esta URL sirve HOY, bajado en serie sin solape, es el de 102349631 bytes -- no el de 2895872.

