  - {archivo: "Tmod_Vic.DBF", variable: VIV_SEL, rol: "llave de hogar (2/3)", codigos: "C2, 01..99"}
  - {archivo: "Tmod_Vic.DBF", variable: HOGAR, rol: "llave de hogar (3/3)", codigos: "C1, 1..9"}
