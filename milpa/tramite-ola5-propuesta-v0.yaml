    hallazgo: >
      El mecanismo G3 / informal_sin_puente sobrevive en DOS ejes y se
      rompe en los demás, y la rotura es informativa. Contra el desenlace
      PRINCIPAL (ahorro exclusivamente informal), localidad y formalidad
      salen CORROBORADAS con IC95 sin traslape y en el signo
      pre-registrado. Escolaridad sale CONTRARIA por la regla de
      precedencia de la spec: sus celdas EXTREMAS sí van en el signo
      esperado (0.3516 en hasta-primaria vs 0.2604 en superior), pero el
      par hasta-primaria -> secundaria va limpio en sentido opuesto
      (0.3516 -> 0.4156, IC95 sin traslape), el eje es NO MONÓTONO y
      CONTRARIA manda. Leer solo los extremos habría dado CORROBORADA: la
      regla de precedencia atrapó exactamente el caso para el que se
      escribió. Contra el desenlace SECUNDARIO (ahorro informal de
      cualquier tipo, que NO está anidado en la tenencia de cuenta y por
      eso es el falsable), el mecanismo se cae entero: escolaridad,
      formalidad y cuenta salen las tres CONTRARIA, y localidad
      NO-DISCRIMINA. Quien tiene cuenta ahorra informalmente MÁS (0.5979
      vs 0.4935), no menos; quien tiene seguridad social por su trabajo
      también (0.6447 vs 0.6041); y el ahorro informal SUBE con la
