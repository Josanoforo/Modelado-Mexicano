  hash_payload_ola3_sha256: 00a7649a1839a3523be22612c2fa3555d5e743cf5329d6bcdc432b901e98bd15
  hash_payload_peso_sha256: 34ee12b0c0d71e76676197089b5fd6048c0fdaa590a220f440d95526b1f4713b
  hash_prereg_sha256: 28e403d646fa550de7d7c538b81c50bcca1f11fe96b52e5eb6b51657ecc97752
  hash_encargo_sha256: c5e520076a339bf48c747ccea190595a1430d642f4423feb96d580b830ef00e1

seed: {aplica: true, valor: 42, rng: numpy.PCG64}
tolerancia:
  tipo: flotante
  abs: 1.0e-10
  razon: misma semilla y sumas deterministas; enteros/textos comparan exacto

resultados:
  - {id: RESULT-ARB2-ENNVIH-N-UNIVERSO-ANALITICO, tipo: entero, unidad: "personas con pr02 y cr27 válidos en ambas olas"}
  - {id: RESULT-ARB2-ENNVIH-N-CON-PONDERADOR, tipo: entero, unidad: "subconjunto anterior con fac_3b finito y >0"}
  - {id: RESULT-ARB2-ENNVIH-P-TIENE-AHORROS, tipo: proporcion, unidad: "proporción ponderada [0,1]", permite_no_estimable: true}
  - {id: RESULT-ARB2-ENNVIH-DETALLE, tipo: texto, unidad: "tabla JSON: conteos de cada filtro, IC95, oro GEN1, delta, veredicto REPRODUCE/NO-REPRODUCE"}
