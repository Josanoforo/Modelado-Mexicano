name: Verificación del corpus

# Endurecido 7/ago/2026 tras tres fallos de CI en la misma ventana de ~30 min
# (PR #149, #150, #151), ninguno de contenido:
#   · #151 murió en "Set up job" con Service Unavailable bajando la definición
#     de la action, antes de ejecutar una línea de código.
#   · #150 y #149 quedaron atascados y GitHub los auto-canceló a los ~15 min.
# Verificado el 7/ago sobre los merge refs exactos que GitHub prueba
# (refs/pull/{139,149,150,151}/merge → 76fc590, d88fdad, 62a3e31, 0b10fd4),
# en entorno replicado del runner (checkout depth=1, sin data/raw, venv limpio
# SIN PyYAML, env despojado): los dos pasos dan exit 0 en los cuatro.
#
# Dos cambios, y los dos atacan el modo de falla medido, no uno concebible:
#   1. CERO actions del marketplace. El repo es público: el checkout se hace
#      con git plano, sin token y sin descargar nada de la CDN que falló.
#      También sale actions/setup-python: ubuntu-latest ya trae Python 3.12.
#   2. timeout-minutes: un job atascado muere en 10 min en vez de colgar 15
#      y morir auto-cancelado, que es un estado que se lee como rojo.
#
# CORRECCIÓN (ACTO GEN2-E3-1 · READINESS-DEL-RUNNER, 8/sep/2026): el
# comentario de arriba decía "nadie importa yaml" -- ya no es cierto desde
# `ACTO GEN2-E3 · AUTOMATIZA-GEN2-1` (7/sep/2026): `tools/corrida0.py`
# importa `yaml` en su cabecera, y `python3 tests/check.py --baseline` SÍ
# lo ejercita (T32 · T-CORRIDA0 corre `tests/test_corrida0.py`, que importa
# `tools/corrida0.py`). Que el runner de `ubuntu-latest` traiga PyYAML
# preinstalado (o no) nunca fue una garantía declarada -- `pip install -r
# requirements.txt` explícito, abajo, deja de depender de lo que el runner
# traiga por su cuenta.

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

# Un run vivo por PR: los re-lanzamientos cancelan al anterior en vez de
# apilarse en una cola degradada.
concurrency:
  group: verify-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  suite:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout sin marketplace (repo público — cero descargas de action)
        run: |
          set -euo pipefail
          git init -q .
          git remote add origin "https://github.com/${{ github.repository }}.git"
          if [ -n "${{ github.event.pull_request.number }}" ]; then
            REF="+refs/pull/${{ github.event.pull_request.number }}/merge:refs/remotes/origin/ci"
          else
            REF="+${{ github.ref }}:refs/remotes/origin/ci"
          fi
          git -c protocol.version=2 fetch -q --depth=1 --no-tags origin "$REF"
          git checkout -q refs/remotes/origin/ci
          git log -1 --format="HEAD=%H %s"

      - name: Intérprete del runner (crudo, para que quede en el log)
        run: python3 -VV

      - name: Instala dependencias (requirements.txt — explícito, nunca lo que traiga el runner)
        # PyYAML: tests/manifiesto.py y tools/corrida0.py (import directo,
        # nunca opcional) la usan; markdown: tools/tablero_vista.py.
        run: python3 -m pip install -r requirements.txt

      - name: Suite de verificación (modo línea base — verde = no empeoraste)
        run: time python3 tests/check.py --baseline --parallel

      - name: Transporte paralelo, compuerta y semántica del baseline (bloqueante)
        run: |
          python3 tests/test_check_parallel.py
          python3 tests/test_suite_warn_estado.py

  adicionales:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout sin marketplace (repo público — cero descargas de action)
        run: |
          set -euo pipefail
          git init -q .
          git remote add origin "https://github.com/${{ github.repository }}.git"
          if [ -n "${{ github.event.pull_request.number }}" ]; then
            REF="+refs/pull/${{ github.event.pull_request.number }}/merge:refs/remotes/origin/ci"
          else
            REF="+${{ github.ref }}:refs/remotes/origin/ci"
          fi
          git -c protocol.version=2 fetch -q --depth=1 --no-tags origin "$REF"
          git checkout -q refs/remotes/origin/ci
          git log -1 --format="HEAD=%H %s"

      - name: Intérprete del runner (crudo, para que quede en el log)
        run: python3 -VV

      - name: Instala dependencias (requirements.txt — explícito, nunca lo que traiga el runner)
        run: python3 -m pip install -r requirements.txt

      - name: svystat.py — validación independiente (bloqueante)
        run: python3 tests/test_svystat.py

      - name: sidecars de forense/encargos y forense/notas — sello de cuerpo (bloqueante)
        # ACTO GEN2-TUBERIA-SIDECAR-CUERPO-1 (21/sep/2026), firma D-a4.
        # Dos pasos, no uno: el test cubre la regla por mutación sobre
        # fixtures, el verificador la corre sobre el árbol real. Sin él, un
        # `.cuerpo.sha256` roto no lo vería nadie hasta el próximo careo —
        # que es exactamente cómo #932 llegó a tener un sidecar que fallaba
        # durante un día entero. `tests/check.py` no auto-descubre
        # `tests/test_*.py`, así que el test va cableado a mano como los
        # demás. Stdlib puro: sin red, sin corpus, y el verificador nunca
        # escribe.
        run: |
          python3 tests/test_verifica_sidecars.py
          python3 tools/verifica_sidecars.py

      - name: emite_m — resolver de ola_calibracion por conducta (bloqueante)
        # ACTO MAESTRA38-M13 · M-POR-CELDA v1.3, §5 ("PRUEBA PERMANENTE
        # JUSTIFICADA"). El defecto que cubre es material: si
        # `cita_ola_calibracion` vuelve a resolver por REGLA en vez de por
        # conducta, F-DD cambia y puede decidir si una celda puntúa. Sin este
        # paso la prueba existiría pero nada la correría: `tests/check.py`
        # cablea su lista en `main()` y no auto-descubre `tests/test_*.py`.
        # No añade dependencias: el runner ya trae PyYAML por requirements.txt
        # y `tools/emite_m.py` ya dependía de yaml vía milpa/src/emisor.py.
        run: python3 tests/test_emite_m_calibracion.py

      - name: Baseline temporal — corte y compatibilidad del estimando
        run: python3 tests/test_baseline_temporal.py

      - name: T-CRON — huella del cron y no-regresión de baseline (bloqueante)
        # ACTO ADQ-CRON-V2 · DISPARO-PERSISTENTE-Y-RUNNER-IDEMPOTENTE (P1,
        # 7/sep/2026). Mismo motivo que la prueba de arriba: sin este paso
        # de CI, `prueba_senal_no_genera_delta_baseline` (la que demuestra
        # que T31 dejó de poder volver ROJO un PR ajeno) nunca correría en
        # automático. Stdlib puro, sin red ni corpus.
        run: python3 tests/test_t_cron.py

      - name: adq_config.py — lector de data/adq-config.yaml (bloqueante)
        # ACTO ADQ-CRON-V2 (P6). Fixture propia en un temporal, nunca lee
        # el data/adq-config.yaml real -- un id de PDN nuevo no puede
        # romper esta prueba.
        run: python3 tests/test_adq_config.py

      - name: adq_doctor.py — clasificación de lock/crontab (bloqueante)
        # ACTO ADQ-CRON-V2 (P4). No ejercita el reporte completo (mezcla
        # red y /mnt/c reales) -- cubre la lógica de clasificación que sí
        # puede fallar en silencio: "sin crontab" vs. "no se pudo
        # preguntar", y detección de lock tomado por otro proceso.
        run: python3 tests/test_adq_doctor.py

      - name: adq_investigacion.py — proyección de demanda no se queda atrás (bloqueante)
        # ENCARGO GEN2-DEMANDA-VIGENTE-ANTES-DESPACHO (15/sep/2026). Fixture
        # propia con un `origin` bare local desechable (nunca GitHub, nunca
        # el corpus real): cierra una NC, corre `publica_proyeccion_demanda`
        # y comprueba que se publica con SHA correcto, que repetirlo sin
        # cambios no genera un segundo commit, y que un fallo del escritor
        # no deja el árbol sucio.
        run: python3 tests/test_adq_demanda_vigente.py

      - name: Fuentes financieras — unidades, faltantes y duplicados (bloqueante)
        # Fixtures puras: no requieren corpus ni red. Las tablas reales se
        # reproducen en CAJA con tools/extrae_fuentes_financieras.py --verifica.
        run: python3 tests/test_fuentes_financieras.py

      - name: N34 — producto, costo y daño (bloqueante)
        # Fixtures stdlib: separan asociación/causalidad y prueban la extracción
        # de la tabla CFPB sin requerir los payloads externos en CI.
        run: python3 tests/test_n34_producto_dano.py

      - name: motor ejecutable — procedencia→B→evaluar() sobre las celdas-D del disco (bloqueante)
        # El nombre decía «las tres celdas-D» y quedó vencido el 17/sep/2026,
        # cuando ACTO GEN2-CELDA-D-CAREO-1 registró la primera celda del piloto
        # (3 -> 4). Es el MISMO defecto que el `igual(len(semillas), 3)` que ese
        # acto tuvo que corregir dentro del test: un conteo literal sobre un
        # directorio que el contrato declara creciente. Se corrige aquí también,
        # porque un nombre de paso que miente en el log de CI cuesta la próxima
        # media hora de quien lo lea.
        # ACTO AUTO-MOTOR-1 · RECUPERA-Y-EJERCITA, NC-0023 (PR #615, ACTO
        # GEN2-T9). El motor matricial sellado por ADR-91 dejó de arrancar
        # sin que nada lo notara porque nada lo corría en CI. Misma razón
        # que la prueba de arriba: sin este paso, `tests/test_motor_*.py`
        # existe pero nada la corre -- `tests/check.py` no auto-descubre
        # `tests/test_*.py` nuevos. Ejerce las entradas reales versionadas;
        # sin corpus, sin red, sin escribir producción.
        run: python3 tests/test_motor_ejecutable.py

      - name: contrato sintético de C2 — piloto celda-D (bloqueante)
        # ACTO GEN2-CELDA-D-CAREO-1 (ADR-533), correctivo pre-emisión del
        # 17/sep/2026, en respuesta a la devolución de revisión sobre PR #827.
        # Pinan el contrato que `C2` debe cumplir ANTES de emitir: rango [0,1]
        # por construcción, casos límite con rechazo explícito (nunca recorte),
        # el mismo identificador de desenlace en entradas y salida, la
        # incertidumbre cuando la muestra es compartida, el soporte por cotas
        # de Fréchet (no por el producto de márgenes) y una parada que admite
        # «sin ganador». Misma razón que el paso de arriba: `tests/check.py`
        # no auto-descubre `tests/test_*.py`, y un test que nadie corre es
        # decoración. Fixtures sintéticos; cero microdato, cero cifras del
        # modelo, cero derivación del cruce reservado.
        run: python3 tests/test_celda_d_c2.py

      - name: consumidor de celda-D — piloto 2, fila M05 derivada (bloqueante)
        # NC-0331 (ACTO GEN2-GUARDIAS-1, 17/sep/2026): `tests/check.py` no
        # auto-descubre `tests/test_*.py` y este archivo no corría en CI desde
        # que `ACTO GEN2-CELDA-D-PILOTO-2` lo creó -- un test que nadie corre
        # es decoración (regla del piloto 1, NC-0331). Stdlib puro, sin
        # numpy: `unittest` corre el módulo directo.
        run: python3 -m unittest tests.test_celda_d_piloto2_consumidor -v

      - name: marcador por segmento — tabla derivada y guardias (bloqueante)
        # ACTO GEN2-MARCADOR-REDISENO-1 (19/sep/2026): mismo motivo que el
        # paso de arriba (NC-0331) -- un test nuevo que nadie cablea a CI es
        # decoración. `tests/test_marcador_segmento.py` corre las tres
        # guardias del diseño (T-RESERVA/T-EMISOR-NO-COMPARA/
        # T-PISO-NO-CIRCULAR) + los dos universos derivados (97/20);
        # `tests/test_estimadores_segmento.py` corre P2 (motor.estimar_segmento).
        run: |
          python3 tests/test_marcador_segmento.py
          python3 tests/test_estimadores_segmento.py

      - name: tubería de ids y union — T15 por mutación, guarda de salto de línea, gramática de FP (bloqueante)
        # ACTO GEN2-TUBERIA-SUCESOR-1 (21/sep/2026), D-21: mismo motivo que
        # los pasos de arriba (NC-0331) -- un test que nadie cablea es
        # decoración, y una guarda que no se puede disparar no es guarda.
        # Ejerce POR MUTACIÓN las tres aserciones de T15 (firma D-3), la
        # guarda T46 de salto de línea final en archivos `merge=union`
        # (incluida la reproducción del defecto con git de verdad en un repo
        # temporal) y la gramática de id `FP` de las dos épocas (firma D-2),
        # con un id de CADA época pinado en el mismo caso. Stdlib puro, cero
        # microdato, cero red.
        run: python3 tests/test_tuberia_ids_union.py

      - name: comparabilidad por texto de crédito ENIF — forma de la tabla K1-K8 × 5 olas (bloqueante)
        # ACTO GEN2-DIN-CREDITO-COMPARABILIDAD-TEXTO-1 (20/sep/2026): mismo
        # motivo que los pasos de arriba (NC-0331) -- un test que nadie cablea
        # es decoración. Corre PRIMERO el caso sintético (D-22) y después la
        # tabla real `data/credito-comparabilidad-texto-v1_0.tsv`: 40 filas,
        # veredictos en lista cerrada, toda fila negativa con texto buscado.
        # Stdlib puro, cero microdato. Desde ACTO GEN2-DIN-CREDITO-HISTORIA-1
        # (21/sep/2026, P1) el mismo archivo verifica también la sucesora
        # `data/credito-comparabilidad-texto-v1_1.tsv` (cuestionarios 2012/2015
        # ya en el corpus: cero NO-VERIFICABLE-AQUÍ, 24 filas heredadas verbatim).
        run: python3 tests/test_credito_comparabilidad_texto.py

      - name: comparabilidad por texto de ahorro ENIF — forma de la tabla 8 objetos × 5 olas (bloqueante)
        # ACTO GEN2-DIN-LOTE-ENIF2024-A (21/sep/2026) · P1. Hermano del paso de
        # arriba, mismo motivo (NC-0331). Corre PRIMERO el caso sintético (D-22:
        # una tabla mínima válida y cinco mutaciones que deben fallar) y después
        # la tabla real `data/ahorro-comparabilidad-texto-v1_0.tsv`: 40 filas =
        # 2 componentes del desenlace + 6 ejes, × {2012, 2015, 2018, 2021, 2024};
        # veredictos en lista cerrada; toda fila con componente no estimable cita
        # el texto buscado (A.15). Stdlib puro, cero microdato.
        run: python3 tests/test_ahorro_comparabilidad_texto.py

      - name: comparabilidad por texto del canal de pago de luz ENCIG — forma de la tabla 1 conducta × 6 olas (bloqueante)
        # ACTO GEN2-ENCIG-SERIE-Y-TENDENCIA-1 (21/sep/2026), P1: misma forma y
        # verificador que la tabla de crédito, otra rejilla (2015-2025, ancla
        # 2021). Sintético primero (D-22), luego `data/encig-canal-
        # comparabilidad-texto-v1_0.tsv`. Stdlib puro, cero microdato.
        run: python3 tests/test_encig_canal_comparabilidad_texto.py

      - name: métrica rectora — celdas_validadas en la primera línea del tablero (bloqueante)
        # ACTO GEN2-SENAL-1 (21/sep/2026) · P1. `celdas_validadas` es la métrica
        # rectora por firma de mesa del 20/sep/2026. El test pina los DOS
        # defectos que el acto encontró en el árbol: (1) las 89 filas IDENTICO
        # tienen M == R por EMISOR=ARBITRO -- el mismo número copiado, no una
        # predicción validada; (2) el CALC de DIN guarda el error en PROPORCIÓN
        # y el de TRA en PUNTOS PORCENTUALES, y fundirlos da un factor 100 en la
        # métrica rectora del programa. Se cablea aquí (D-21) para que el job
        # `guardias` no lo cuente como huérfano.
        run: python3 tests/test_celdas_validadas.py

      - name: descargador por id de manifiesto — arnés HTTP local (bloqueante)
        # ACTO GEN2-NUBE-PILOTO-1-bis (21/sep/2026), perímetro de cierre
        # permanente (D-21): el COMMIT-1 rescatado de PR #930 congeló el
        # descargador y su arnés pero no llegó a cablearlo, porque el acto
        # paró por PARO (e) antes del cierre. Mismo motivo que los pasos de
        # arriba (NC-0331): `tests/check.py` no auto-descubre
        # `tests/test_*.py`, y un test que nadie corre es decoración.
        # Levanta un `http.server` de la stdlib en 127.0.0.1 y corre
        # `tests/manifiesto.py --descarga` por subproceso, de punta a punta,
        # con su propio --root y su propio manifiesto sintético: 26 PASS.
        # Cero red externa, cero microdato, cero escritura en data/raw del
        # repo. NO toca los dos archivos congelados.
        run: python3 tests/test_descarga_manifiesto.py
      - name: cargador de linaje — los tres caminos del id superado (bloqueante)
        # ACTO MOTOR-LINAJE-1 (21/sep/2026) · P1/P4 + D-21. Defecto real que
        # atrapa (NC-0401/NC-0400): `cargar_indice_linaje_emision` colapsaba
        # «una vigente», «más de una vigente» y «cero vigentes» en una sola
        # excepción de carga, y la tercera hacía incargable el índice entero
        # por un `resultado_id` que ningún consumidor pin-ea (222 de 10 542 en
        # la vista, derivado por tools/delta_pin_superado.py). Condición de la
        # firma de mesa del 21/sep: el cargador NO sigue la sucesión en
        # silencio — nombra al sucesor y no lo resuelve. Fixtures sintéticos
        # en tmp; cero microdato, cero cifras del modelo.
        run: python3 tests/test_linaje_superado.py

  # ACTO GEN2-CI-GUARDIAS-VIVAS-1 (20/sep/2026): 97 de 122 tests/test_*.py
  # no aparecian ni aqui ni en tests/check.py -- nadie los corria. Este job
  # descubre tests/test_*.py por patron, resta los que `suite` y
  # `adicionales` ya cablean arriba, y ejecuta el resto con el invocador
  # que el censo declara (forense/analisis/ci-guardias/censo-tests.tsv,
  # derivado por tools/ci_guardias.py --censo -- leido, nunca adivinado).
  # Falla si un test nuevo no tiene fila en el censo: asi ningun test
  # vuelve a nacer huerfano. Los NECESITA-CORPUS y NECESITA-DEPENDENCIA
  # (numpy/pandas/scipy/pytest -- FP de mesa, ver requirements.txt) y los
  # FALLA-DE-VERDAD ya conocidos (NC abiertas, no se arreglan en este acto
  # -- D-14: no se arreglan tests rotos aqui) se saltan en voz alta, nunca
  # en silencio: una linea `SKIP <archivo>: <razon>` por cada uno y el
  # conteo en el resumen final.
  guardias:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout sin marketplace (repo público — cero descargas de action)
        run: |
          set -euo pipefail
          git init -q .
          git remote add origin "https://github.com/${{ github.repository }}.git"
          if [ -n "${{ github.event.pull_request.number }}" ]; then
            REF="+refs/pull/${{ github.event.pull_request.number }}/merge:refs/remotes/origin/ci"
          else
            REF="+${{ github.ref }}:refs/remotes/origin/ci"
          fi
          # ACTO MOTOR-LINAJE-1 (21/sep/2026) · P4 / D-23: fetch COMPLETO,
          # no `--depth=1`. NC-0402 y NC-0397 clasificaban
          # `tests/test_motor_holdout.py` y
          # `tests/test_celda_d_piloto_consumidor.py` como
          # FALLA-DE-VERDAD; en clon completo dan 6/6 y 9/9. La causa
          # era este clon superficial: pinan firmas contra el commit
          # de sello y no hay historia que leer a profundidad 1. Una
          # herramienta de verificacion no verifica un arbol que ella
          # misma mutilo (D-23).
          git -c protocol.version=2 fetch -q --no-tags origin "$REF"
          git checkout -q refs/remotes/origin/ci
          git log -1 --format="HEAD=%H %s"

      - name: Intérprete del runner (crudo, para que quede en el log)
        run: python3 -VV

      - name: Instala dependencias (requirements.txt — explícito, nunca lo que traiga el runner)
        run: python3 -m pip install -r requirements.txt

      - name: Guardias huérfanas — censo + invocador correcto por archivo (bloqueante)
        run: python3 tools/ci_guardias.py --ejecuta-huerfanos

  # ACTO GEN2-TUBERIA-PREFLIGHT-CI-1 (21/sep/2026). `corrida0 preflight` sobre
  # los CALC SIN SELLO que este cambio añade o toca — y sólo sobre ésos.
  #
  # Defecto que atrapa, tres veces en una semana y siempre el mismo: un CALC
  # se fusiona en un estado en que el runner no podría correrlo (#781 sin
  # `spec.md`, #903 sin `seed`, #926 con `spec_md` escrito como ruta desde la
  # raíz), y lo topa la ejecución del día siguiente en vez del PR que lo
  # introdujo. D-14: el chequeo tarda segundos, no necesita corpus, y cuesta
  # menos que uno solo de esos paros.
  #
  # CLON PROPIO, `--depth=2`: el job necesita LA BASE para saber qué CALC toca
  # el cambio, y el primer padre de la ref de merge es la punta de main. Los
  # otros jobs no la tienen y D-23 prohíbe que este haga `fetch` dentro del
  # clon de otro. `PYTHONDONTWRITEBYTECODE`: un `__pycache__` recién escrito
  # sería `working_tree_dirty` fabricado por el propio chequeo.
  preflight-calc:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - name: Checkout con la base (clon propio — D-23, no se toca el de otro job)
        run: |
          set -euo pipefail
          git init -q .
          git remote add origin "https://github.com/${{ github.repository }}.git"
          if [ -n "${{ github.event.pull_request.number }}" ]; then
            REF="+refs/pull/${{ github.event.pull_request.number }}/merge:refs/remotes/origin/ci"
          else
            REF="+${{ github.ref }}:refs/remotes/origin/ci"
          fi
          git -c protocol.version=2 fetch -q --depth=2 --no-tags origin "$REF"
          git checkout -q refs/remotes/origin/ci
          git log -1 --format="HEAD=%H %s"
          git rev-parse refs/remotes/origin/ci^1 > /dev/null
          git log -1 --format="BASE=%H %s" refs/remotes/origin/ci^1

      - name: Intérprete del runner (crudo, para que quede en el log)
        run: python3 -VV

      - name: Instala dependencias (requirements.txt — explícito, nunca lo que traiga el runner)
        run: python3 -m pip install -r requirements.txt

      - name: Prueba por mutación del chequeo (bloqueante — D-21, el acto cablea su test)
        run: python3 tests/test_preflight_calc_tocados.py

      - name: preflight sobre los CALC sin sello que este cambio toca (bloqueante)
        run: |
          python3 tools/preflight_calc_tocados.py \
            --base refs/remotes/origin/ci^1 \
            --cabeza refs/remotes/origin/ci

  # ACTO GEN2-TUBERIA-RES-LLAVE-1 (P6) · las seis guardas de identidad
  # RES/llave logica. Job PROPIO con su PROPIO clonado, porque G1 y G3
  # comparan contra el registro de la ref BASE y `tools/ci_guardas_res.py`
  # no hace `fetch` nunca: una herramienta de verificacion no muta el clon
  # que verifica (D-23). G2, G4, G5 y G6 no necesitan historia.
  guardas-res:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout sin marketplace, con la ref base (repo público)
        run: |
          set -euo pipefail
          git init -q .
          git remote add origin "https://github.com/${{ github.repository }}.git"
          if [ -n "${{ github.event.pull_request.number }}" ]; then
            REF="+refs/pull/${{ github.event.pull_request.number }}/merge:refs/remotes/origin/ci"
          else
            REF="+${{ github.ref }}:refs/remotes/origin/ci"
          fi
          # Fetch COMPLETO (D-23) y, ademas, la rama BASE del PR: G1 y G3
          # la necesitan y aqui es donde se trae, no dentro de la suite.
          git -c protocol.version=2 fetch -q --no-tags origin "$REF"
          BASE="${{ github.event.pull_request.base.ref || 'main' }}"
          git -c protocol.version=2 fetch -q --no-tags origin "+refs/heads/$BASE:refs/remotes/origin/base"
          git checkout -q refs/remotes/origin/ci
          git log -1 --format="HEAD=%H %s"
          git log -1 --format="BASE=%H %s" refs/remotes/origin/base

      - name: Intérprete del runner (crudo, para que quede en el log)
        run: python3 -VV

      - name: Instala dependencias (requirements.txt)
        run: python3 -m pip install -r requirements.txt

      - name: G1..G6 — identidad RES/llave lógica (bloqueante)
        run: python3 tools/ci_guardas_res.py --base refs/remotes/origin/base

      - name: Mutaciones de las seis guardas (cada una prueba SU guarda)
        run: python3 tests/test_guardas_res.py

  # ACTO GEN2-TUBERIA-ENRUTAMIENTO-PR-1 (P2) · qué tipo de merge es este PR,
  # derivado de su diff, escrito en el RESUMEN del job para que mesa lo lea
  # en la pestaña Checks sin abrir el diff. Job PROPIO con su PROPIO clonado
  # que traiga la base (D-23: una herramienta de verificación no muta el clon
  # que verifica; `clasifica_pr.py` nunca hace fetch).
  #
  # NO está en `needs` de `check`, y es a propósito: la clase INFORMA, no
  # adjudica (D-16). Un PR no se bloquea por la clase que le toque -- el
  # merge es de mesa. Este job no fusiona, no etiqueta y no tiene permisos
  # de escritura.
  enrutamiento-pr:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout sin marketplace, con la ref base (repo público)
        run: |
          set -euo pipefail
          git init -q .
          git remote add origin "https://github.com/${{ github.repository }}.git"
          if [ -n "${{ github.event.pull_request.number }}" ]; then
            REF="+refs/pull/${{ github.event.pull_request.number }}/merge:refs/remotes/origin/ci"
          else
            REF="+${{ github.ref }}:refs/remotes/origin/ci"
          fi
          git -c protocol.version=2 fetch -q --no-tags origin "$REF"
          BASE="${{ github.event.pull_request.base.ref || 'main' }}"
          git -c protocol.version=2 fetch -q --no-tags origin "+refs/heads/$BASE:refs/remotes/origin/base"
          git checkout -q refs/remotes/origin/ci
          git log -1 --format="HEAD=%H %s"
          git log -1 --format="BASE=%H %s" refs/remotes/origin/base

      - name: Intérprete del runner (crudo, para que quede en el log)
        run: python3 -VV

      - name: Los casos sintéticos, uno por clase (bloqueante — D-21)
        run: python3 tests/test_clasifica_pr.py

      - name: Clase de este PR, al resumen del job (nunca falla por la clase)
        run: |
          python3 tools/clasifica_pr.py \
            --base refs/remotes/origin/base \
            --cabeza refs/remotes/origin/ci \
            --resumen "$GITHUB_STEP_SUMMARY"

  # Conserva el nombre requerido por protección. always() es indispensable:
  # un job fallido/omitido/cancelado debe llegar a una compuerta que NO aprueba.
  check:
    # `enrutamiento-pr` (ACTO GEN2-TUBERIA-ENRUTAMIENTO-PR-1, 21/sep/2026):
    # entra a `needs` porque la guarda de `tests/test_check_parallel.py`
    # DERIVA el conjunto del workflow -- TODO job menos el gate es requerido.
    # Esto NO hace que la clase adjudique: `tools/clasifica_pr.py` sale 0
    # clasifique lo que clasifique (probado en `tests/test_clasifica_pr.py`,
    # caso 8), así que lo único que este job puede poner en rojo es su
    # propio test o su clonado -- nunca la clase que le toque a un PR. Ver
    # §PREMISA-CAÍDA de la nota de cierre del acto.
    needs: [suite, adicionales, guardias, preflight-calc, guardas-res, enrutamiento-pr]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 1
    steps:
      - name: Todos los grupos requeridos terminaron correctamente
        env:
          SUITE_RESULT: ${{ needs.suite.result }}
          ADICIONALES_RESULT: ${{ needs.adicionales.result }}
          GUARDIAS_RESULT: ${{ needs.guardias.result }}
          GUARDAS_RES_RESULT: ${{ needs['guardas-res'].result }}
          PREFLIGHT_CALC_RESULT: ${{ needs['preflight-calc'].result }}
          ENRUTAMIENTO_PR_RESULT: ${{ needs['enrutamiento-pr'].result }}
        run: |
          set -euo pipefail
          printf 'suite=%s adicionales=%s guardias=%s preflight-calc=%s guardas-res=%s enrutamiento-pr=%s\n' "$SUITE_RESULT" "$ADICIONALES_RESULT" "$GUARDIAS_RESULT" "$PREFLIGHT_CALC_RESULT" "$GUARDAS_RES_RESULT" "$ENRUTAMIENTO_PR_RESULT"
          test "$SUITE_RESULT" = success
          test "$ADICIONALES_RESULT" = success
          test "$GUARDIAS_RESULT" = success
          test "$GUARDAS_RES_RESULT" = success
          test "$PREFLIGHT_CALC_RESULT" = success
          test "$ENRUTAMIENTO_PR_RESULT" = success
