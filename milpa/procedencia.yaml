    fuente: "ENIF 2024, TMODULO, P9.9 '¿con qué piensa cubrir su vejez?' -- seis ítems (p9_9_1..6); p9_9_4 ('dinero de familiares') es el que opera el constructo, los otros cinco son contexto del mismo menú -- forense/notas/2026-08-03-cal-conf-faseb-pos5-6-radio-familismo.md §1.2, §3.2, §4"
    n_util: "12379 filas (universo efectivo filtro_s9_1=2, <71 años -- 91.7% de TMODULO); p9_9_4 útiles=8221 tras cruce formalidad×edad"
    eje_condicionante: "formalidad × edad (conjunto, 8 celdas) + tloc/urbanización (marginal), por ítem; NO se cruzan migración ni ingreso en este acto (declarado, §1.2 de la nota)"
    nota: >
      MEDIDO·PARCIAL(x), por ítem: 6 ítems del menú medidos por separado,
      uno (p9_9_4) opera familismo_apoyo, los otros cinco (gobierno /
      pensión-Afore / venta de bienes / seguir trabajando / otro) se
      reportan como contexto del mismo menú de opción múltiple, no como
      parte del constructo. Universo efectivo excluye 71+ años por
      no-aplicabilidad estructural del cuestionario (blanco != no-respuesta,
      cruce perfecto verificado contra filtro_s9_1).
    marca_c3: >
      NO USAR para identificar G5·familismo_apoyo (canon/modelo-decision-v4_0.md:465):
      el desenlace de G5 en ENIF es familia.seguro.volatilidad_ausencia_estado,
      observado con la misma batería P9_9_1..6 -- circular (P2 §2.d,
      inventario:171). Sí identifica G3·familismo_apoyo (desenlace distinto,
      dinero.ahorro.volatilidad_horizonte_corto vía P4_10).

# ══════════════════════════════════════════════════════════════════
# RECLASIFICACIÓN v4.0 · ADR-57 (e), 04/ago/2026 · confianza_institucional
# [genérico-servidores-públicos] -- ESCALA PROPIA, fuera del vector de
# ADR-28.b (`modelo` §1.3) y fuera del denominador D (`modelo` §1.1.F): el
# reactivo ENCIG batería XI ítem 23 (P11_1_23, "servidores(as)
# públicos(as) o empleados(as) de gobierno") no mapea a ninguno de los
# seis componentes nombrados de condicionales_confianza_institucional
# (arriba) -- verificado por CAL-CONF Fase B, posición 8
# (forense/notas/2026-08-04-cal-conf-faseb-pos8-encig-battxi.md §2): los
# seis componentes se resuelven con los ítems 1/2/3/14/16/17/19/20/21/22
# de la misma batería de 25; financiera queda NO CUBIERTO en ENCIG por
# completo. Misma clase que condicionales_escalares (arriba) -- sección
# propia porque tampoco este es componente del vector. No se funde con
# justicia-policía ni con ningún otro componente (ADR-57 (e)).
# ══════════════════════════════════════════════════════════════════
condicionales_escalares_confianza_generica:
  confianza_institucional_generico_servidores_publicos:
    clase: "MEDIDO·PARCIAL(edad,formalidad,sexo,escolaridad,estrato), por atributos"
    instrumento: "ENCIG 2023, encig2023_01_sec_11 (batería XI, sección 'Confianza en instituciones') unido por ID_PER a encig2023_02_residentes_sec_2 (roster) -- forense/notas/2026-08-18-cond-atrib-confianza-generico.md §1"
    item: "P11_1_23 -- 'servidores(as) públicos(as) o empleados(as) de gobierno' (ítem 23 de 25), dicotomizado confía={1,2}/no confía={3,4}"
    universo: "Personas 18+ de ENCIG 2023 (ciudades de 100 000+ habitantes por diseño del instrumento) con P11_1_23 válido -- n=37845 (de 38966, excluidos código 5 'No aplica' n=20 y código 9 'No sabe' n=1101). No se reconcilia contra un marginal de otra fuente (A-bis regla 4)."
    fuente: "forense/notas/2026-08-18-cond-atrib-confianza-generico.md (ACTO COND-ATRIB, spec §1 congelada antes de correr, resultados §2, interpretación §3); ponderador FAC_P18, diseño EST_DIS/UPM_DIS, tests/svystat.py::diff_ultimate_cluster (sin modificar), un eje a la vez, nivel vs. resto del mismo eje"
    n_util: "Edad n=37670 (4 celdas) · Formalidad(POS) n=26502 (5 celdas, blanco estructural excluido) · Sexo n=37845 (2 celdas) · Escolaridad(NIV) n=37845 (3 celdas) · Estrato(EST) n=37845 (4 celdas)"
    eje_condicionante: >
      EJECUTADO, un eje a la vez -- Edad: 4/4 celdas distinguibles de cero
      al 95%, patrón en U (18-29 y 60+ por encima del resto, +4.4pp/+4.6pp;
      30-44 y 45-59 por debajo, -4.7pp/-3.2pp). Formalidad (POS): 4/5
      distinguibles (jornalero no, IC cruza cero pese a n=282); sin patrón
      ordenado por formalidad -- sin-pago más confiado (+15.7pp), patrón
      menos confiado (-6.6pp). Sexo: partición binaria, d_hat antisimétrico
      por construcción (Hombre -1.8pp, Mujer +1.8pp, ambos apenas
      distinguibles de cero) -- propiedad mecánica, no hallazgo de
      robustez. Escolaridad (NIV): solo Superior distinguible de cero
      (-2.5pp), Básica-o-menos y Media-superior-técnica no. Estrato (EST):
      0/4 celdas distinguibles de cero -- sin patrón. Cuatro ejes
      canónicos de modelo §1.1.A declarados NO DISPONIBLES en ENCIG 2023,
      no forzados: urbanización/tamaño de localidad (universo restringido
      a ciudades 100 000+), ingreso, migración, acceso digital (ninguno
      localizado en las 6 tablas del instrumento).
    nota: >
      Antes: solo existía el β̂ MARGINAL del reactivo, registrado en
      coeficientes_generador_medidos.G1_confianza_institucional (marca_c2)
      -- una medición DISTINTA (β̂ asociación con tramite.mordida.discrecional,
      ya condicionada por Encargo X sobre edad únicamente). Esta entrada
      mide algo distinto: θ(P11_1_23 | x), la prevalencia del propio
      reactivo condicionada por atributos poblacionales -- análogo a sus
      hermanas condicionales_escalares.radio_confianza/.familismo_apoyo.
      No identifica nada causalmente (A-bis regla 2) -- asociación
      condicionada. No comparable en escala contra el β̂ de
      G1_confianza_institucional (regla 3) -- desenlaces distintos, mismo
      reactivo. No mueve el contador de coeficientes de generador en
      escala del modelo (sigue 0 de 15) -- P11_1_23 genérico no es
      componente nombrado del vector de ADR-28.b (ADR-57(e), arriba). Si
      una mesa futura promueve el genérico a componente del vector, es
      cambio MAYOR con su propia derivación (ADR-57 (e)).

# ══════════════════════════════════════════════════════════════════
# RECLASIFICACIÓN v4.0 · CAL-CONF Fase B, posición 4 · Encargo K (mesa #18,
# 4/ago/2026) · exposicion_violencia pasa a MEDIDO·PARCIAL(x). Cierra la
# "búsqueda abierta" que ADR-52 A había sellado -- por medición exitosa
# (segundo acto de búsqueda, forense/notas/2026-08-04-envipe-tper-vic2-tmod-
# vic-paso1.md, encontró candidato válido), NO por agotar los tres actos de
# la condición de caducidad, que sigue intacta como criterio. Fuente única:
# forense/notas/2026-08-04-medicion-exposicion-violencia-envipe.md §2-6
# (Encargo K fusionado). CP-1 (decisión de mesa, cerrada este mismo encargo):
# ENVIPE es el reactivo, ENDIREH queda como complemento con dos funciones
# nombradas (ventana de vida, desdoble tipo×ámbito) -- nunca se suman ni
# promedian, universos y constructos distintos.
# ══════════════════════════════════════════════════════════════════
condicionales_escalares_exposicion_violencia:
  exposicion_violencia:
    clase: "MEDIDO·PARCIAL(edad,dominio,formalidad,ESTRATO)"
    antes: >
      ASIGNADO -- coeficiente de generador (G4 0.70, canon/modelo-decision-v4_0.md:396),
      sin condicional base medida. Reactivo anterior (ENVIPE BP1_20/23/28)
      retirado por PR #57: medía conducta de denuncia condicionada a
      victimización, no exposición a violencia (hitoE §15).
    fuente: >
      ENVIPE 2025, TPer_Vic2 (91182 filas, universo persona seleccionada 18+,
      sin condicionar a RESUL_H, cero blancos), Sección VII -- núcleo
      AP7_3_10 (amenaza) · AP7_3_11 (agresión física con lesión) ·
      AP7_3_12 (secuestro) · AP7_3_13 (agresión sexual) · AP7_3_14
      (violación); condicional con AP7_3_09 (extorsión) reportada aparte,
      fuera del núcleo por su matiz patrimonial no resuelto --
      forense/notas/2026-08-04-medicion-exposicion-violencia-envipe.md §2-6.
    n_util: >
      91182 filas de tabla, cero blancos en las seis variables (AP7_3_09 a
      AP7_3_14). Join a TSDem por ID_PER para el eje de formalidad: 91182 de
      91182 coinciden (100%); de esos, 56829 (62.3%) tienen AP3_8="trabajó"
      y AP3_10 válido -- el n aguanta el marginal de formalidad.
    eje_condicionante: >
      edad (18-29 · 30-44 · 45-59 · 60+) × dominio (U/C/R), conjunto (12
      celdas) + formalidad (AP3_8/AP3_10 vía join a TSDem, marginal, proxy
      rugoso de posición en la ocupación -- jornalero/empleado/cuenta
      propia/patrón/sin pago, NO verificación de registro formal ante
      seguridad social, mismo límite que TPer_Vic1) + ESTRATO de área
      (marginal, no ingreso individual). Acceso digital y migración NO
      DISPONIBLES en este instrumento (mismo límite que TPer_Vic1).
    estimador: >
      Binario "sufrió al menos uno de los cinco del núcleo, durante 2024" +
      condicional con AP7_3_09 sumado; ponderado por FAC_ELE (factor de
      personas elegidas, no FAC_ELE_AM que es del área urbana de interés);
      dispersión por conglomerado último (método de razón, Woodruff/
      "ultimate cluster": EST_DIS como estrato, UPM_DIS como PSU, 746
      estratos con ≥2 UPM usados, cero estratos singleton). Periodo: 2024,
      12 meses (enero-diciembre) -- ventana de eventos consumados, NO
      ventana de vida; distinto de ENDIREH, nunca se suma ni promedia con
      ella (CP-1).
    distribucion: >
      Sin AP7_3_09 (núcleo): 5.675% ponderado [IC95% 5.427%-5.924%], n
      crudo=4822 de 91182, población=5 436 874 de 95 795 780 (tasa 5675.5
      por 100 mil). Con AP7_3_09 (extorsión sumada): 9.668% ponderado
      [IC95% 9.358%-9.977%], n crudo=8464, población=9 261 225 (tasa 9667.7
      por 100 mil). Desglose por ítem (ponderado, tasa/100k): AP7_3_09
      (extorsión) 4750.4 · AP7_3_10 (amenaza) 3472.5 · AP7_3_11 (lesión)
      1340.3 · AP7_3_12 (secuestro) 77.6 · AP7_3_13 (agresión sexual)
      1473.7 · AP7_3_14 (violación) 128.2. Por DOMINIO: U 6.861% · C 5.104%
      · R 2.868%. Por ESTRATO (marginal, área no ingreso individual): 1
      3.776% · 2 5.464% · 3 6.757% · 4 6.733%. Por banda de edad: 18-29
      9.680% · 30-44 6.277% · 45-59 4.056% · 60+ 2.022%. Por posición en la
      ocupación (formalidad, solo ocupados): jornalero 2.230% · empleado/
      obrero 6.683% · cuenta propia 6.336% · patrón 6.015% · sin pago
      5.168%.
    validacion_estimador: >
      Contrastado contra caso conocido publicado: "violación sexual, 279
      delitos por cada 100 mil MUJERES, 2024" (INEGI, presentación nacional
      ENVIPE 2025, slide "Delitos sexuales", tema Caracterización del
      delito). Reproducido con el mismo pipeline (FAC_ELE, universo
      TPer_Vic2, SEXO=2) usando incidencia (suma ponderada de AP7_4_14,
      frecuencia): 279.3 por 100 mil mujeres -- diferencia relativa 0.09%,
      dentro del redondeo publicado. La prevalencia (AP7_3_14=1, víctimas)
      da 197.4 -- más baja que la incidencia, como se espera cuando hay
      revictimización; INEGI no publica prevalencia por tipo de delito a
      nivel nacional, solo incidencia, así que la validación usa incidencia
      y el constructo de este acto usa prevalencia (binario), misma
      mecánica de ponderación ya validada. NEGATIVO DESCARTADO, declarado
      para que no se reintente: RESUL_H='A' ponderado por FAC_ELE da
      26 114.8 por 100 mil (publicado: 24 135, +8.2%) -- RESUL_H es
      resultado de la visita al HOGAR, no un flag de víctima a nivel
      persona (contamina con victimización de otros integrantes vía Sección
      VI), no sirve como ancla de validación aunque el nombre del catálogo
      ("con/sin victimización") sugiera lo contrario.
    marca_c3: >
      LIMPIO. Verificado variable por variable (forense/notas/2026-08-04-
      envipe-tper-vic2-tmod-vic-paso1.md §7 + re-verificación independiente
      esta sesión, grep sobre forense/notas/2026-07-31-inventario-
      segmentacion.md): ninguna de AP7_3_09-14 aparece en las 41 filas de
      Tabla B. Único hit de mnemónico es AP7_1 de ENCUCI (trabajo
      voluntario/comunidad) -- colisión de nombre entre encuestas
      distintas, ya documentada, no es la AP7_1 de ENVIPE de este acto.
    limite_c2: >
      SELLADO, no resuelto -- decisión de este acto (§3.4 del encargo,
      opción (b), argumentada: resolverlo exigiría decidir que
      comunicacion.inseguridad.ver_oir_callar no usará BP1_23, y esa es una
      adjudicación que corresponde a quien opere ese desenlace, no a un
      acto de medición). BP1_23 (candidato Parcial de
      comunicacion.inseguridad.ver_oir_callar, hitoE §15,
      canon/modelo-decision-v4_0.md ~:517) solo se pregunta a quien ya
      disparó el Instrumento B, es decir a quien contestó AP7_3_XX=1 (o
      AP6_6=1) en TPer_Vic2 -- dependencia ESTRUCTURAL de aplicación del
      cuestionario, no de contenido (C3 pasa limpio, arriba). Si
      exposicion_violencia (este reactivo) y comunicacion.inseguridad.
      ver_oir_callar (si se llegara a operacionalizar con BP1_23) entran
      juntas a la misma ecuación, NO son independientes por diseño --
      declarado por forense/notas/2026-08-04-envipe-tper-vic2-tmod-vic-
      paso1.md §8, sellado aquí para que viaje con el número, mismo
      tratamiento que la marca C3: quien adjudique cualquiera de las dos
      variables lo encuentra aquí.
    periodo: >
      2024, 12 meses (enero-diciembre de 2024) -- ventana de referencia de
      eventos consumados durante el año, NO ventana de vida. Distinto de
      ENDIREH, que trae ventana de vida para algunos tipos de violencia;
      nunca se suman ni promedian entre sí (CP-1, decisión de mesa cerrada
      este encargo): son constructos distintos (ENDIREH incluye violencia
      de pareja y familiar, fuera del mecanismo de G4) sobre universos
      distintos (ENVIPE: persona 18+ ambos sexos, n=91182; ENDIREH: mujeres
      15+, universo más estrecho).

# ══════════════════════════════════════════════════════════════════
# SÉPTIMA CLASE · MEDIDO·NACIONAL · 13/ago/2026 · ADR-79(a), ejecutada por
# `PROC-10-bis` — marginales medidas sin eje condicionante (x = ∅), hueco
# de taxonomía que `ACTO PROC-10` (PR #220) verificó y dejó declarado, no
# ejecutado (`forense/notas/2026-08-13-proc-10.md` §1-§3). Primer uso:
# `norma_de_género` (ENASIC 2022 P7_12_7, renombrada desde
# `familismo_obligacion` por ADR-75(b)/`ACTO PROC-11`, 13/ago/2026).
# Contador: numerador 9 → 10 (`PROC-10-bis`), denominador intacto en 15 (ya
# movido a 15 por `ACTO PROC-11`, ADR-75(b) -- objeto distinto, ver ADR-79(h)).
# Segundo uso, 13/ago/2026, `ACTO PROD-P638`: `obligación_medida` (ENASIC
# 2022 P6_38, tabla TPOB_CUI) -- la segunda θ marginal nacional de la misma
# familia, celda-D registrada por `ACTO PROC-11`, reproducida por el motor
# formal (prepare->produce->integrate, hashes_analista_confiados: false) y
# verificada contra las cinco proporciones e IC de `forense/notas/2026-08-13-
# enasic-split-verificacion.md` §2.2. Numerador 10 → 11.
# ══════════════════════════════════════════════════════════════════
condicionales_escalares_medido_nacional:
  norma_de_género:
    clase: "MEDIDO·NACIONAL"
    antes: >
      PROXY declarado, pendiente de medición -- `modelo` (entonces :271,
      hoy la fila «Proxy declarado, pendiente de medición» de §1.1.F Paso
      5) citaba "ENUT 6.11/6.11a, carga de cuidado a nivel persona
      (ADR-51(c), M2)" hasta que `ACTO PROC-11` (13/ago/2026) corrigió la
      cita: ENUT es la capa CONDUCTUAL del constructo pre-split (ADR-67(b)),
      no una operacionalización de `norma_de_género` -- proxy obsoleto,
      citado aquí como historia, no vigente.
    fuente: >
      ENASIC 2022, P7_12_7, tabla TPER_ELE (persona elegida, 15-60 años,
      una por hogar, nacional) -- expediente `ESP-OPACA-B-d13ec4fe`, fila
      `PROD-cca3ea0bccd54d70083728b2` de
      `data/curacion-registro/produccion-modelo.tsv`; verificación en
      `forense/notas/2026-08-13-enasic-split-verificacion.md` §2.1 y en
      `data/curacion-registro/celdas-d/G5.familismo_obligacion.actitud.yaml`
      (celda-D no renombrada -- la pregunta del nombre de generador/
      coeficiente queda reservada a mesa, entra a la cascada de MOTOR-1).
    n_util: 5579
    theta_ic95: >
      0.6933, IC95% [0.6725, 0.7140] -- "De acuerdo (Sí)", una de las cuatro
      categorías oficiales (De acuerdo/Desacuerdo/No responde/No sabe), todas
      con ESTIMACION_SUSTENTADA, cero blancos. IC95 por linealización de
      Taylor sobre conglomerados últimos (EST_DIS/UPM_DIS), ponderador
      FAC_ELE.
    eje_condicionante: >
      ∅ -- marginal nacional, sin eje declarado. Exactamente el hueco de
      taxonomía que `MEDIDO·PARCIAL(x)` no admite (x nunca vacío) y que esta
      clase séptima existe para nombrar.
    limite_de_constructo: >
      Verbatim de ADR-75(a), Decisión A (`canon/gobernanza-v1_15.md:874`):
      "la θ representa acuerdo con una norma de deber de cuidado
      diferenciada por sexo, no obligación familiar genérica" -- no borrado
      el encuadre de género, acotado. Mismo límite que `supuesto_transporte`
      de la celda-D registra ("ACOTADO-CON-SUPUESTO"). No se declara
      EXISTE-SATISFACE.
    nota: >
      Admitir esta θ a la clase MEDIDO·NACIONAL no abre su condicional POR
      eje: quien necesite `norma_de_género` condicionada a un eje de
      `modelo §1.1.A` corre la medición condicionada aparte (puerta D3-B,
      dueño "acto futuro por θ" -- ver `forense/notas/2026-08-13-proc-11.md`
      §5, nombrada y no ejecutada aquí). `MEDIDO·NACIONAL` describe lo que
      esta θ ES (marginal, sin eje), no una promesa de que nunca se
      condicionará.
  obligación_medida:
    clase: "MEDIDO·NACIONAL"
    antes: >
      Registrada por `ACTO PROC-11` (13/ago/2026) como celda-D
      (`G5.obligacion_medida.conducta.yaml`), pero sin clase de procedencia:
      la fila «Medida sin clase de procedencia — decisión D3 pendiente» de
      `modelo` §1.1.F Paso 5, contada aparte de `MEDIDO·NACIONAL` aunque la
      clase séptima ya existiera desde `PROC-10-bis`, porque el expediente
      de producción propio (celda calculada por `ENASIC-SPLIT`, no
      reproducida todavía por el motor formal) era el encargo separado de
      `ACTO PROD-P638`.
    fuente: >
      ENASIC 2022, P6_38, tabla TPOB_CUI (población cuidadora, `FILTRO
      6.10`) -- expediente `ESP-OPACA-D-d800e103`, fila
      `PROD-ea28cc177894157ca113388b` (fila 12) de
      `data/curacion-registro/produccion-modelo.tsv`; celda-D en
      `data/curacion-registro/celdas-d/G5.obligacion_medida.conducta.yaml`.
      Cálculo original y pre-registro del método en
      `forense/notas/2026-08-13-enasic-split-verificacion.md` §1.5/§2.2
      (`tests/svystat.py::prop_ultimate_cluster`); reproducción
      independiente por el motor formal
      (`tools/curador_registro/produce.py::taylor_distribution`,
      `hashes_analista_confiados: false`) en
      `forense/notas/2026-08-13-prod-p638.md` §1-§2.
    n_util: 5677
    theta_ic95: >
      Categórica de 5 vías, elección única (no binaria como la celda
      hermana): obligación 0.0765 IC95[0.0661,0.0868] (n=479) · decisión
      familiar 0.0671 IC95[0.0579,0.0763] (n=366) · ser la (el) única(o) que
      podía 0.0356 IC95[0.0286,0.0426] (n=193) · petición de quien necesita
      el cuidado 0.0123 IC95[0.0083,0.0162] (n=72) · iniciativa propia
      0.8086 IC95[0.7918,0.8254] (n=4,567). Idéntico a 4 decimales entre el
      motor formal (z=1.96) y `svystat.py` (z=1.959963985, declarado en
      §1.5 como no comparable dígito a dígito) -- verificado que la
      diferencia de cuantil no mueve ninguna cifra a esta precisión. IC95
      por linealización de Taylor sobre conglomerados últimos
      (EST_DIS/UPM_DIS), ponderador FAC_CUI.
    eje_condicionante: >
      ∅ -- marginal nacional, sin eje declarado. Mismo hueco de taxonomía
      que `norma_de_género` (arriba); ambas comparten clase por la misma
      razón, no por ser el mismo constructo.
    limite_de_constructo: >
      Verbatim de `forense/notas/2026-08-13-enasic-split-verificacion.md`
      §2.2 (Bloque A-bis regla 3): "el 7.65% de P6_38 (motivo propio, entre
      cuidadores ya identificados, ventana de una semana) y el 69.33% de
      P7_12_7 (acuerdo con una norma general, población elegida completa,
      sin ventana retrospectiva) no se restan ni se comparan como si fueran
      la misma escala -- universos distintos, preguntas distintas, escalas
      distintas". Periodo de referencia también distinto: "la semana
      anterior a la fecha de referencia" (`obligación_medida`) vs. momento
      de la entrevista, sin ventana retrospectiva (`norma_de_género`). No se
      declara EXISTE-SATISFACE.
    nota: >
      Segunda entrada de la clase séptima, no una reapertura de D3: la
      clase y su definición (arriba) ya estaban selladas por `PROC-10-bis`
      (ADR-79(a)); este acto (`PROD-P638`) solo añade la segunda θ de la
      misma familia que ya estaba nombrada en la propia definición de la
      clase (adenda B.5.3 de `forense/notas/2026-08-13-proc-11.md`).
      Admitir esta θ tampoco abre su condicional POR eje -- mismo criterio
      que `norma_de_género`, misma puerta D3-B nombrada y no ejecutada.

# ══════════════════════════════════════════════════════════════════
# DEUDA BLOQUEANTE — los 90 parámetros de dispersión (ADR-28.d)
# ══════════════════════════════════════════════════════════════════
deuda_dispersion:
  estado: ABIERTA
  severidad: S2
  que_falta: >
    ADR-28.d obliga a que cada params_base sea una DISTRIBUCIÓN, no un punto,
    y modelo §1.2 rechaza en compilación toda configuración con varianza
    intraperfil cero. Eso implica 90 parámetros de dispersión —uno por cada
    params_base— que hoy NO EXISTEN en archivo y NO TIENEN familia declarada.
  consecuencia: >
    Mientras falten, el check de compilación de §1.2 no puede correr. Es un
    principio declarado sin artefacto de salida: el patrón que explica casi
    todos los fallos de este programa.
  requisito_de_salida: >
    Esta sección debe listar, para cada uno de los 90 params_base, su familia
    de distribución y su parámetro de dispersión, con clase de procedencia.
    Si no están, el conteo real no es 144 sino 234, y 90 números son invisibles.
  por_que_importa_el_esencialismo: >
    Con valores puntuales el modelo produce seis clases de mexicano — la forma
    estadística del esencialismo que este corpus combate, y la que el validador
    no atrapa porque revisa estructura, no dispersión.

# ══════════════════════════════════════════════════════════════════
# HALLAZGO PRINCIPAL: la categoría que no estaba prevista
# ══════════════════════════════════════════════════════════════════

hallazgo_ordinal_cardinal:
  descripcion: >
    Los 54 params_base no son ni medidos ni asignados al azar: son la
    CUANTIFICACIÓN de etiquetas ordinales de la ficha canónica §1. La ficha
    dice que el perfil 1 tiene horizonte "mixto→largo"; el YAML dice 0.70.
    La etiqueta tiene respaldo en el corpus. El 0.70 no tiene ninguno.
  por_que_importa: >
    La fórmula central es params = base(perfil) + Σ(coef × intensidad). Si la
    base es una cardinalización arbitraria de un ordinal Y los coeficientes son
    asignados, entonces la aritmética conserva el ORDEN pero no la MAGNITUD.
    Sumar 0.70 y -0.60 produce un número con dos decimales y cero significado
    métrico. Esto coincide exactamente con la deuda ya declarada en la
    gobernanza: "el simulador será confiable en dirección, no en magnitud".
    La novedad es que ahora se sabe DÓNDE entra esa imprecisión.
  implicacion: >
    Mientras los params_base sean ordinales disfrazados de cardinales, ninguna
    salida del simulador debe reportarse con precisión decimal. Las salidas
    deben ser rangos o categorías, no cifras.

# ══════════════════════════════════════════════════════════════════
# LAS 4 ÚNICAS ENTRADAS MEDIDAS (y sus reservas)
# ══════════════════════════════════════════════════════════════════

medidos:
  - valor: 0.06
    donde: civico.voto.agencia_con_secreto → voto_clientelar
    fuente: "Ascencio & Chang: probabilidad de voto clientelar con secreto percibido"
    reserva: ninguna
    confianza: alta

  - valor: 0.63
    donde: civico.voto.clientelar_si_observable → voto_clientelar
    fuente: "Ascencio & Chang: probabilidad con observabilidad percibida"
    reserva: ninguna
    confianza: alta
    nota: "El par 0.06→0.63 es el número mejor sostenido de todo el modelo."

  - valor: 0.13
    donde: civico.participacion.contingente → vota
    fuente: "INE, elección judicial 2025"
    reserva: >
      DISCREPANCIA ABIERTA: el transfer y el YAML dicen 12.86%; el modelo §7.3
      dice 13%. Fijar una cifra y su fuente antes de usarla en un backtest.
    confianza: alta

  - valor: 0.93
    donde: civico.denuncia.sin_seguro → no_denuncia
    fuente: "ENVIPE, cifra negra"
    reserva: >
      RIESGO DEFINICIONAL. La cifra negra de ENVIPE agrega delitos no
      denunciados MÁS delitos denunciados sin averiguación previa. Usarla como
      P(no denuncia) confunde dos cantidades distintas y probablemente
      sobreestima la no-denuncia. El propio modelo §3.7 arrastra la confusión al
      escribir "no denuncia (cifra negra)". Verificar contra la tasa de denuncia
      publicada, que es la magnitud que la regla realmente necesita.
    confianza: media

derivados:
  - {valor: 0.94, de: 0.06, donde: civico.voto.agencia_con_secreto, tipo: complemento}
  - {valor: 0.37, de: 0.63, donde: civico.voto.clientelar_si_observable, tipo: complemento}
  - {valor: 0.87, de: 0.13, donde: civico.participacion.contingente, tipo: complemento}
  - {valor: 0.07, de: 0.93, donde: civico.denuncia.sin_seguro, tipo: complemento}
  - valor: 0.89
    donde: salud.vacunacion.disponible → acepta_vacuna
    de: "cobertura COVID en adultos 86–89%"
    tipo: "extremo superior de un rango, con SALTO DE DOMINIO"
    reserva: >
      El dato es cobertura de vacunación COVID en ADULTOS; la regla lo aplica a
      aceptación de vacuna en general, incluida la infantil, que es el caso del
      backtest. El salto es plausible pero no está justificado.
  - {valor: 0.11, de: 0.89, tipo: complemento}

