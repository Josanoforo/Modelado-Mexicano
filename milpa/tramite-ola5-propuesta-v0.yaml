      tier MEDIA, situacion APARCADA-HASTA-IDENTIFICACION; NO se carga al
      motor. Razón verbatim de MAESTRA34-L4 (reserva de la propia medición,
      no de mesa): "correlación limpia, confundida con el año presidencial"
      -- el diseño entre años (local 2023 no concurrente vs local 2024
      concurrente) no separa el efecto de concurrencia del de jerarquía del
      cargo (gubernatura 2023 vs ayuntamiento 2024) ni del de calendario
      (elección presidencial de por medio). Benchmark externo declarado por
      DC1: Alemania ≈10 pp (Leininger, Rudolph & Zittlau 2018) y EE.UU. 36 pp
      (Hajnal & Lewis 2003) de efecto de concurrencia electoral sobre
      participación -- la cifra medida (+10.48 pp) es del orden del caso
      alemán, muy por debajo del caso estadounidense. El sucesor es el
      diseño escalonado de la homologación 2015-2021 (MAESTRA34-L6), con el
      libro del TEPJF "Elecciones concurrentes y participación electoral en
      México, 1991-2018" como benchmark.
    falsable_si: PENDIENTE-DE-MESA
