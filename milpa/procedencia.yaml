# tests/procedencia.yaml — Auditoría de procedencia de los 144 números (eran 107 en v0.1.0)
#
# QUÉ ES. El Bloque A obliga a marcar la procedencia de la EVIDENCIA.
# Nadie obligaba a marcar la procedencia de los NÚMEROS. Este archivo lo hace:
# para cada valor del modelo, de dónde salió realmente.
#
# CLASES DE PROCEDENCIA
#   MEDIDO     — transcripción directa de un dato publicado y verificable
#   DERIVADO   — aritmética sobre un MEDIDO (típicamente su complemento a 1)
#   ORDINAL→CARDINAL — conversión de una etiqueta cualitativa de la ficha
#                      ("alto", "corto", "muy baja") a un número. La etiqueta
#                      tiene respaldo; el número concreto no.
#   ASIGNADO   — juicio informado. La fuente citada sostiene la DIRECCIÓN,
#                no la magnitud. Coherente con el corpus, no medido.
#   AJUSTADO   — reproduce los momentos observados (media, varianza,
#                transición) de un dato real; NO está identificado
#                causalmente. Contesta CUÁNTO, nunca SI EL PATRÓN EXISTE
#                (ADR-47). Exige campo `ruta:` con uno de: pseudo_panel |
#                momentos | composicion | transversal_con_seleccion.
#                Rutas argumentadas (propuesta sin sello, no canon) en forense/metodologia-identificacion-vs-ajuste-v0_1.md §4.
#                `ruta: composicion` exige la regla de descomposición
#                DECLARADA ANTES de ver los datos; inventada después es
#                post-hoc (Bloque C, validación forense). Sellada por
#                ADR-49 (D2): nace VACÍA, cero números AJUSTADO hoy;
#                ningún ASIGNADO se reclasifica por este cambio.
#   MEDIDO·PARCIAL(x) — sexta clase, sellada 3/ago/2026. Condicional medida
#                empíricamente (distribución sobre desenlaces, no media
#                puntual) sobre un subconjunto DECLARADO x de los ejes de
#                atributos de `modelo §1.1.A` — nunca los seis a la vez.
#                (x) lista los ejes efectivos entre paréntesis. Distinta de
#                MEDIDO (que implicaría condicionar sobre los 6 ejes) y de
#                ASIGNADO/PENDIENTE (que implicarían cero medición). Hueco
#                de taxonomía señalado sin resolver por
#                `forense/notas/2026-08-03-cal-conf-faseb-medicion.md` §4
#                ("no 'MEDIDO' pleno... ni 'ASIGNADO'/'PENDIENTE'"); esta
#                sesión lo sella y reclasifica sus primeros tres usos, ver
#                `condicionales_confianza_institucional` abajo.
#
# ADVERTENCIA DE LECTURA. Que 96% de los números no sea MEDIDO no es un
# escándalo por los estándares del campo: los ABM asignan parámetros de forma
# rutinaria. El escándalo sería no poder distinguir cuál es cuál. Este archivo
# convierte un problema invisible en uno visible — que es todo lo que se le
# puede pedir hoy, y el prerrequisito de arreglarlo mañana.

version: "0.2.0"
estado: >-
  verificado contra canon/modelo-decision-v3_4.md en ce0658c (31/jul/2026):
  asignados_probabilidad tiene 13 entradas/29 valores (confirmado por conteo
  directo) y el resumen declara 39 -- consistente (4 MEDIDO + 6 DERIVADO + 29
  ASIGNADO = 39). El motor v3.4 declara 49 reglas SI-ENTONCES en §3.B, no 43
  como cita el comentario de la línea de abajo (resumen.desglose,
  probabilidades_de_regla): ese denominador quedó de una versión anterior del
  motor y no se corrige aquí (no es número de esta sesión, ver ADR de la
  mesa). De esas 49, solo 15 llevan algún valor numérico (4 MEDIDO + 1
  vacunación-cuasi-medido en DERIVADO + 13 entradas ASIGNADO repartidas sobre
  10 reglas propias); 34 reglas no tienen ningún valor -- MEDIDO, DERIVADO
  ni ASIGNADO -- ni en este archivo ni en canon. CORREGIDO 31/jul/2026
  (decisión de mesa, D4): decía "18 con valor, 31 sin" -- ese conteo trataba
  las 18 ENTRADAS de asignados_probabilidad como 18 reglas distintas, pero
  tres pares de esas entradas apuntan a la MISMA regla (las dos mitades
  condicionales de un bullet: dinero.ahorro.informal_sin_puente +
  con_puente_y_respaldo; tramite.gobierno_digital.coercitivo +
  util_sin_coercion; civico.denuncia.sin_seguro + con_seguro). Contando
  reglas, no entradas: 15 con valor, 34 sin -- ver forense/cobertura-motor.md
  para el detalle línea por línea. Sin cobertura alguna: los 4 dominios
  completos de trabajo (§3.2),
  familia (§3.5), tiempo (§3.6), cooperación (§3.8) y comunicación (§3.10) --
  20 reglas -- y 3 de las 4 de información/creencia (§3.9). Aún requiere
  verificación de primaria: las 4 entradas MEDIDO. Pendiente aparte: los ids
  "dominio.categoria.nombre" de asignados_probabilidad (p.ej.
  dinero.ahorro.informal_sin_puente) no existen literalmente en
  canon/modelo-decision-v3_4.md -- el motor describe sus 49 reglas en prosa,
  sin id estable -- así que el cruce por dominio de arriba es lo más fino que
  se puede derivar sin adivinar a qué bullet corresponde cada id.

# ══════════════════════════════════════════════════════════════════
# CAMBIOS v0.1.0 → v0.2.0  ·  28 de julio de 2026
# ══════════════════════════════════════════════════════════════════
# El archivo se quedó en el esquema del modelo v1 mientras el modelo pasaba
# a v2. Cuatro correcciones:
#
#   1. ADR-30 — `familismo` se desdobla en `familismo_apoyo` y
#      `familismo_obligacion`. El v0.1.0 tenía UN parámetro monotónico
#      positivo, que es exactamente la forma funcional que la refutación
#      ref.A.23 tumbó.
#      ⚠ `familismo_apoyo` SE CONSERVA EN G3 (corrección de mesa a la
#      propuesta original de ADR-30): en G3 el mecanismo es pooling ante
#      volatilidad —la tanda—, y §3.1 enruta el ahorro informal por ahí.
#      En G5 es seguro ante Estado ausente. No hay doble conteo.
#   2. Cambio 7 del modelo v2 — G1 se desdobla en G1a (adopción por canal
#      personal) y G1b (difusión radial). G1b está CONTRADICHO por su propio
#      registro (Nu, Kueski, Aplazo difundieron sin puente personal): sus
#      coeficientes quedan A REVISIÓN, no asignados.
#   3. Conteo total 107 → 144. Recomputado, no estimado. Desglose abajo.
#   4. DEUDA NUEVA Y VISIBLE — los 90 parámetros de dispersión de ADR-28.d.
#      Este archivo es el que debe listarlos. Hoy no los tiene, y por eso el
#      check de varianza intraperfil del modelo §1.2 NO PUEDE CORRER.
# ══════════════════════════════════════════════════════════════════

resumen:
  total_numeros: 144          # era 107 en v0.1.0 (esquema del modelo v1)
  medido: 4
  derivado: 6
  ordinal_a_cardinal: 60      # +6 · familismo_obligacion en los 6 perfiles
  asignado: 74                # +30 vector confianza · +1 coef familismo_obligacion
  porcentaje_no_medido: "97.2%"
  desglose:
    probabilidades_de_regla: 39      # 18 reglas implementadas de 43; recuento
                                     # pendiente cuando existan los 10 rules/*.yaml
    coeficientes_de_generador: 15    # era 14
    params_base_de_perfil: 90        # era 54 · 15 params × 6 perfiles

  delta_v1_v2:
    params_base: "+36 · 9 → 15 parámetros por perfil"
    familismo_desdoblado: "+6 · ORDINAL→CARDINAL (la etiqueta medio/alto existe en modelo §1.1)"
    confianza_institucional_vector: "+30 · ASIGNADO. ⚠ SIN POBLAR: modelo §1.3 declara el vector de 6 componentes (seguridad · educación · salud · electoral · justicia-policía · financiera) y da porcentajes NACIONALES, no valores por perfil. Nadie ha medido confianza en la Marina por perfil. (Fila del esquema v3.4/tabla-de-perfiles. Bajo `modelo` v4.0 tres de los seis componentes se reclasifican como condicionales `MEDIDO·PARCIAL(x)`, no como celdas de esta tabla — ver `condicionales_confianza_institucional` abajo. El conteo de 144/30 de esta fila no cambia: es del esquema viejo, congelado.)"
    coeficiente_nuevo: "+1 · familismo_obligacion en G5, ASIGNADO y SIN MAGNITUD (spec: 'signo negativo o no monotónico')"
    disparadores_de_dominio: "0 · los 42 NO cuentan: entran como booleanos de contexto, no como parámetros calibrables (adenda a ADR-26)"

