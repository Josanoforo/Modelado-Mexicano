  - {archivo: ZA6980_v2-0-0.dta, variable: doi, rol: identidad-doi}
  - {archivo: ZA6980_v2-0-0.dta, variable: version, rol: identidad-version}
  - {archivo: ZA6980_v2-0-0.dta, variable: country, rol: filtro-pais-numerico}
  - {archivo: ZA6980_v2-0-0.dta, variable: c_alphan, rol: filtro-pais-alfanumerico}
  - {archivo: ZA6980_v2-0-0.dta, variable: CASEID, rol: llave-no-publicada}
  - {archivo: ZA6980_v2-0-0.dta, variable: SEX, rol: dominio-y-reconstruccion}
  - {archivo: ZA6980_v2-0-0.dta, variable: AGE, rol: control-universo-adulto}
  - {archivo: ZA6980_v2-0-0.dta, variable: WEIGHT, rol: ponderador}
  - {archivo: ZA6980_v2-0-0.dta, variable: v26, rol: respuesta-q8a}

universo: Personas de 18 años o más en la muestra nacional de México, ISSP 2017.
filtros: >-
  c_alphan=MX y country=484, con studyno=6980, doi=10.4232/1.13322 y
  version=2.0.0. Total incluye SEX no clasificable; hombres SEX=1; mujeres SEX=2.
ponderador: >-
  WEIGHT, numérico, finito y positivo; sin recorte de extremos. El formulario
  mexicano documenta WEIGHT=1 No weighting.
transformacion: >-
  Para cada dominio y código 1..7, razón de masa de la categoría sobre masa
  de respuestas válidas 1..7. Cobertura = masa válida / masa elegible con peso
  utilizable. Contraste = proporción código 1 mujeres menos hombres.
estimando: >-
  Distribución descriptiva completa de a quién o dónde acudiría primero para
  pedir prestada una gran suma de dinero, total y por sexo; no recepción real,
  no apoyo familiar exclusivo y no efecto causal de género.
precision: EE-IC-NO-DISPONIBLES-DISENO-NO-ACREDITADO

dependencias_materiales: []
seed: {aplica: false, valor: null, rng: NO-APLICA}
tolerancia:
  tipo: flotante
  abs: 1.0e-10
  razon: sumas y razones deterministas; control independiente con misma tolerancia

parametros:
  instrumento: ISSP 2017 Social Networks and Social Resources, México, Q8a
  version: ZA6980 v2.0.0
  periodo: "2017"
  codigos_sustantivos: [1, 2, 3, 4, 5, 6, 7]
  no_puede_elegir: [8]
  no_respuesta: [9, system_missing]
  dominios: [TOTAL, HOMBRES, MUJERES]
  salidas:
