    bloques de 50; contrato conservador
  diseno: 'por ola: STRATUM_MEX/PSU(_MEX) donde existen; si la UPM falta en alguna fila, sin conglomerados'
  ola: 2013,2015,2017,2018,2023,2024
tolerancia:
  tipo: flotante
  abs: 1.0e-10
  razon: bootstrap determinista por semilla; mismo payload y sumas float64
