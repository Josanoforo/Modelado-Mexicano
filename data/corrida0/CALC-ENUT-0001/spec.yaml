  - {id: RESULT-ENUT-A-SHARE-POBLACIONAL-MUJERES-40MAS, tipo: proporcion, unidad: "participacion ponderada de las mujeres 40+ en la poblacion del universo -- CONTEXTO OBLIGATORIO: la regla se lee comparando A-R contra esto, no contra cero (GEN1 publica 0.2657)", permite_no_estimable: true}
  - {id: RESULT-ENUT-A-R-MENOS-SHARE-POBLACIONAL, tipo: flotante, unidad: "A-R menos A-SHARE-POBLACIONAL-MUJERES-40MAS, CON SIGNO", permite_no_estimable: true}
