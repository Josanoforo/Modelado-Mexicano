  funcion: CODIGO
  nota: esquema, salida y contrato comunes
variables:
- nombre: ESTADO-INSEGURO
  definicion: AP4_3_3 = 2 frente a 1 (spec contendiente §2)
- nombre: INSEGURO-CAMINAR-DE-NOCHE
  definicion: AP4_4_A ∈ {3,4} frente a {1,2} (spec contendiente §2)
- nombre: DEJO-PERMITIR-MENORES-SALIR-SOLOS
  definicion: AP4_10_02 = 1 frente a 2 (spec contendiente §2)
- nombre: MC2-DEJO-SALIR-NOCHE
  definicion: AP4_10_01 = 1 frente a 2; piso ENVIPE 2024 (spec MC2 §1; PROSPECTIVA; unidad PERSONA)
- nombre: MC2-PREOC-<tema>
  definicion: AP4_2_<código de PREOC> = 1, entre quienes no marcaron AP4_2_99; once temas; piso ENVIPE 2024 (spec
    MC2 §1; PROSPECTIVA; unidad PERSONA)
- nombre: MC2-INSEGURO-<espacio>
  definicion: AP4_4_<código de AP44> = 2 frente a 1; cinco espacios; piso ENVIPE 2024 (spec MC2 §1; PROSPECTIVA;
    unidad PERSONA)
- nombre: MC2-DUPLICADA-EDO-INSEGURO-2025-<segmento>
  definicion: AP4_3_3 = 2 frente a 1; mismo estimando que ESTADO-INSEGURO de PERCEPCION, que la puntúa; R sin puntuar
    (unidad PERSONA)
- nombre: MC2-RETROSPECTIVA-DEL-<indicador>-<segmento>
  definicion: DENUNCIA (BP1_20 = 1 o BP1_21 = 1), CIFRA-NEGRA, CARPETA-DADA-DENUNCIA (BP1_24 = 1), EXT-TELEFONICA
    (BP1_5A_2, BPCOD = 9) sobre tmod_vic; RETROSPECTIVA, R sin puntuar (unidad DELITO)
universo: 'PERCEPCION: persona elegida de 18-97 años (EDAD), ENVIPE 2026, tabla tper_vic1; FAC_ELE > 0, EST_DIS
  y UPM_DIS no vacíos; NIV de tsdem por ID_PER. MC2: el de su medidor sellado -- persona elegida de tper_vic1 con
  FAC_ELE > 0 y UPM_DIS no vacía (sin tope de EDAD); delitos de tmod_vic con FAC_DEL > 0 (celdas RETROSPECTIVAS,
  no puntúan)'
filtros: 'Un eje a la vez (PERCEPCION: TOTAL, SEXO, EDAD, ESCOLARIDAD, DOMINIO, ENTIDAD; MC2: un segmento NAC/SEXO/DOMINIO/EDAD/SINALOA
  por llamada); nunca cruces (guardia E.6)'
ponderador: FAC_ELE (persona elegida); FAC_DEL sólo en las celdas RETROSPECTIVAS de MC2 (delito)
transformacion: 'Recodificación de cada contendiente, sin tocar: PERCEPCION (spec COLA-ENVIPE-PERCEPCION §2: bin(col,
  UNO, CERO)); MC2 (frame_del/frame_per de su medidor sellado, con la ola 2026 en la ranura de la última ola de
  cada estimando). Columna ausente en el catálogo 2026 -> NO-ESTIMABLE (R None), sin recodificación ad hoc'
estimando: 'R = Σw·y/Σw por celda en ENVIPE 2026; cobertura de R en el IC del contendiente (PERCEPCION: IC de diseño
  del piso 2024; MC2: IC95 bootstrap de su última ola). Una sola primaria sobre todas las celdas puntuadas (todas
  de unidad PERSONA)'
seed:
  aplica: false
  razon: R es un punto; la cobertura usa el IC ya sellado del contendiente
parametros:
  nominal: 0.95
  z: 1.959964
  regla: cobertura R en [lo, hi] del contendiente; Wilson 95%; NO-ESTIMABLE > SUBCUBRE > SOBRECUBRE > CALIBRADO
  columna_ausente_en_catalogo: NO-ESTIMABLE (sin recodificación ad hoc)
tolerancia:
  tipo: flotante
  abs: 1.0e-10
  razon: 'determinista: sumas float64 sin remuestreo'
