# Celda-D del primer piloto, registrada por ACTO GEN2-CELDA-D-CAREO-1 (17/sep/2026).
#
# CONTENIDO VERBATIM del diseño vigente de dirección, v1.1 §9
# (`forense/notas/insumos-direccion/CELDA-D-PILOTO-diseno-direccion-v1_1-post-careo-2026-09-17.md`,
# sha256 del cuerpo `68a794936ef2ca47cf052b3a1e64ca002c87fb7d9e8cefb8ae998220c99f19cb`),
# bajo la firma de mesa del 17/sep/2026 que el encargo pega verbatim.
#
# ÚNICA CORRECCIÓN, y es de sintaxis, no de contenido (el encargo lo autoriza en
# esos términos y exige reportarlo): el diseño §9 no trae `fecha_adjudicacion` ni
# `commit_adjudicacion`, que `tests/test_celdas_d.py::REQUIRED_TOP_FIELDS` exige.
# Se añaden con el valor "NO-APLICA" — el mismo que llevan las tres celdas ya
# selladas mientras no hay adjudicación (G5.familismo_obligacion.actitud.yaml:136-137,
# G5.obligacion_medida.conducta.yaml:161-162). No se decide nada con eso: esta celda
# no adjudica hoy, y por diseño no puede hacerlo antes del COMMIT-3 del piloto.
#
# NO SE DERIVA NADA AQUÍ. `momentos_holdout_refs` marca la reserva de evaluación:
# las 8 celdas de cruce `localidad × edad` de ENIF 2024 NO ESTÁN DERIVADAS, y
# derivarlas antes de que las emisiones estén selladas destruye la reserva.
# ─────────────────────────────────────────────────────────────────────────────
# AVISO FECHADO · 2026-09-17 · ACTO GEN2-CELDA-D-CAREO-1 (ADR-533)
# CORRECTIVO PRE-EMISIÓN, tras la devolución de revisión del 16/sep sobre PR #827.
#
#   ESTA CELDA NO ES EMISIBLE TODAVÍA. `estado_operativo: PENDIENTE` y
#   `requiere_decision_mesa: true` ya lo decían; esto dice POR QUÉ, con nombre.
#
# Seis hallazgos materiales sobre el diseño ejecutable, con su corrección y las
# decisiones que faltan, en:
#   forense/notas/2026-09-17-GEN2-CELDA-D-CAREO-1-CORRECTIVO-PRE-EMISION.md
#
#   H1 · El desenlace de C2 NO es el de R ni el de C1. R/C1 usan los SIETE
#        códigos comunes; el marginal público que alimenta C2 usa los NUEVE.
#        Ser proporciones [0,1] no las hace medidas del mismo evento. → D1
#   H2 · La fórmula de C2, `p_l*p_e/p`, NO garantiza una probabilidad
#        (sintético: .8×.8/.5 = 1.28). Propuesta: piso log-aditivo, con rechazo
#        explícito en los casos límite y sin recorte silencioso. → D2
#   H3 · La incertidumbre de C2 se propaga «bajo independencia», pero los tres
#        marginales salen de la MISMA muestra. → D3
#   H4 · El soporte del cruce NO está acreditado: el producto de márgenes es un
#        punto bajo un supuesto. Cotas de Fréchet sobre los n publicados: las
#        OCHO cotas inferiores son 0, contra el «≈980» que el diseño afirmaba.
#        `n` queda DESCONOCIDO hasta el paso autorizado que lo calcula.
#   H5 · «Nadie vence a C2 → la interacción no aporta información» no se sigue,
#        y la parada no puede exigir un ganador: admite INDECIDIBLE,
#        SIN-CANDIDATO-SUPERIOR y FUERA-DE-SOPORTE, sin adopción forzada.
#   H6 · La búsqueda negativa acredita que el cruce no está en el árbol; NO que
#        nadie lo haya visto. La reserva es OPERACIONAL, no cegamiento absoluto.
#
# LOS VALORES DE ABAJO NO SE EDITAN, y es deliberado: son los que mesa firmó
# (diseño v1.1 §9, verbatim). Corregirlos aquí sería adoptar D1-D3 sin firma.
# El contrato que C2 debe cumplir está pinado en `tests/test_celda_d_c2.py`
# con fixtures sintéticos, y la función de referencia vive ahí — no en
# `milpa/` — por la misma razón.
# ─────────────────────────────────────────────────────────────────────────────
# ─────────────────────────────────────────────────────────────────────────────
# AVISO FECHADO · 2026-09-16 · ACTO GEN2-CELDA-D-PILOTO-1 (PR pendiente)
# EL PILOTO CORRIÓ. La reserva se levantó en el COMMIT-3, después de que las
# emisiones estuvieran selladas — y el registro lo prueba, no el ejecutor:
# `CALC-DIN-AHORRO-SOLO-INFORMAL-EMISIONES-0001` lleva en su propio sello
# `RESULT-DIN-LXE8-G-R-EXISTE-AL-CERRAR = "NO"`.
#
#   VEREDICTO: SIN-CANDIDATO-SUPERIOR. `champion_actual` sigue NINGUNO y este
#   acto NO ADOPTA NADA. Adoptar es de mesa.
#
# LO QUE CAMBIÓ RESPECTO DEL DISEÑO QUE MESA FIRMÓ EL 17/sep, y por qué:
# la `FP-379 · ENMIENDA` (mesa, 16/sep/2026) ratificó, contra el FD de las dos
# olas, que el reactivo «guardó o ahorró en la cuenta tipo k» viaja en
# `P5_7_k` en ENIF 2021 y en `p5_6_k` en ENIF 2024 — el `P5_6_k` de 2021
# pregunta por TARJETA DE DÉBITO, otro evento. Los NUEVE códigos SÍ existen en
# 2021. `H1` quedó disuelta y la «definición por siete códigos comunes»
# VENCIDA POR PREMISA FALSA. Rige `D9` (nueve tipos) como desenlace primario en
# C1, C2, C3 y R; `D7` (siete) se emite como SENSIBILIDAD que NO ADJUDICA, y su
# brecha medida contra `D9` es de 0.50 pp como máximo sobre las 8 celdas.
#
# LOS VALORES DE ABAJO SE ACTUALIZAN sólo en los cinco campos que el encargo
# autoriza tocar al cerrar: `resultado` por candidato, `momentos_holdout_refs`,
# `estado_decidibilidad`, `margen_material` y `champion_actual`, más las dos
# estampas de adjudicación. El resto del cuerpo firmado NO se edita.
# Cifras completas, receta y falsadores:
#   forense/prereg-caja/DIN-ahorro-solo-informal-lxe8-spec-v1_2.md
#   data/corrida0/CALC-DIN-AHORRO-SOLO-INFORMAL-EMISIONES-0001/
