etiquetas:
  generacion: GEN2
  cuenta_gen2: SI
  cuenta_gen2_nota: "propuesto por el encargo GEN2-PISOS-DOMINIOS-Y-REGLAS-1; no adopta"
  acto: GEN2-PISOS-DOMINIOS-Y-REGLAS-1
  tipo: PISO-DESCRIPTIVO-RETROSPECTIVO
  temporalidad: RETROSPECTIVA

inputs:
  - {id: enut2024_bd_csv, origen: manifiesto}
  - {id: enut2019_bd_csv, origen: manifiesto}

lectura_de_estructura_previa: "FD enut2024_fd_xlsx (TMODULO, TVAR_CREA, TVIVIENDA), FD enut2019_fd_xlsx (TModulo), cuestionario enut2024 (texto) y cabeceras de tmodulo.csv/tvar_crea.csv/tsdem.csv (2024) y enut_2019/TMODULO.csv; ningún registro leído antes del COMMIT-1"

variables:
  - {archivo: tvar_crea.csv, variable: TRAB_NO_REM_VOL, rol: "trabajo no remunerado doméstico, de cuidados y voluntario (FD TVAR_CREA fila 35); blanco/no numérico = inválido"}
  - {archivo: tvar_crea.csv, variable: TRAB_NO_REM_CON_CP, rol: "cuidado a integrantes del hogar con pasivos (fila 44); participación = >0"}
  - {archivo: tvar_crea.csv, variable: ACTIV_PROD_CON_CP, rol: "tiempo total de trabajo (fila 28)"}
  - {archivo: tvar_crea.csv, variable: MENOR10, rol: "1 = localidad de 1 a 9 999 hab. (fila 157)"}
  - {archivo: tvar_crea.csv, variable: COND_IND, rol: "autoadscripción indígena 1 sí 2 no; 9 fuera (fila 164)"}
  - {archivo: tmodulo.csv, variable: "P6_17_3, P6_17A_3_1..4", rol: "6.17 servicios gratuitos para la comunidad (tequio, faena...) 1 Sí 2 No; horas"}
  - {archivo: tmodulo.csv, variable: "P6_21_1..4, P6_21A_i_1..4", rol: "6.21 convivencia (4 ítems) Sí/No y horas"}
  - {archivo: tmodulo.csv, variable: "P6_22_1..6, P6_22A_i_1..4", rol: "6.22 entretenimiento/medios (6 ítems) Sí/No y horas"}
  - {archivo: tmodulo.csv, variable: P4_1, rol: "4.1 habla lengua indígena 1 Sí 2 No"}
  - {archivo: tmodulo.csv, variable: "SEXO, EDAD_V, TLOC", rol: "segmentos sexo, edad (12-17..60+), rural = TLOC 4"}
  - {archivo: tmodulo.csv, variable: "FAC_PER, EST_DIS, UPM_DIS, LLAVEMOD", rol: "ponderador, estrato, UPM, llave 1:1 con tvar_crea"}
  - {archivo: enut_2019/TMODULO.csv, variable: "P6_17_2, P4_1, TLOC, FAC_PER, EST_DIS, UPM_DIS", rol: "ola previa 2019 de 6.17 (mismo texto literal), base nacional"}

universo: "Persona de 12+ en la tabla del módulo de la base nacional (ENUT 2024 tmodulo.csv; ENUT 2019 enut_2019/TMODULO.csv, sólo para 6.17)."
filtros: "Variables creadas inválidas y códigos fuera de 1/2 salen del denominador (contados en DIAG-*), nunca se imputan; tiempo de ítem en blanco = 0; sin tope a 168 h."
ponderador: FAC_PER sin normalizar
transformacion: "Ver spec humana §1-§2: INT = E(h|h>0), MEDIA = E(h), PART = P(h>0) o P(Sí); brechas y diferencias a − b en la misma réplica."
estimando: "Medias y proporciones ponderadas por celda con IC95 de diseño; descriptivo, RETROSPECTIVO; dictámenes por la regla B-bis §3 de la spec humana."
dependencias_materiales: [numpy, pandas]

parametros:
  bootstrap_replicas: 2000
  metodo_ic: bootstrap de UPM_DIS con reemplazo dentro de EST_DIS, un plan por ola; percentiles 2.5/97.5
  singleton: autorremuestreo; varianza cero; contado en DIAG-N-ESTRATOS-UPM-UNICA
  hash_medidor_sha256: 20fe5389cd48b4279fcd33f0c4301d524eaba11cc8309b49a83e0b9d80c3d6d0
  hash_payload_sha256: "enut2024_bd_csv 25f35626464053441b367b24001d255dbca408b5f576e614e0e09ac58691c4ba; enut2019_bd_csv d3da76a02cdd36229ab8d744a951b18b545e261959d9b8f1ca1161591bd5856d"
  hash_prereg_sha256: f4a396d6f22e3a97c9e40ff1f27bd2c5861c57af856061aa1cde53c8fbf13c32
  hash_encargo_sha256: 0f3f0bdf5be8c0591ab1edd22fb77381ac67c8666b8a00fb5238bedd02f322ee

