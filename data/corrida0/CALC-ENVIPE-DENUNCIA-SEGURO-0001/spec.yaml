  firma_que_lo_autoriza: "Firma de mesa verbatim «Si a todas.», 15 de septiembre de 2026, sobre la HOJA DE FIRMAS DE MESA 2026-09-15 archivada en forense/encargos/2026-09-15-GEN2-FIRMAS-MESA-1.md. OBJETO 10 verbatim: «NC-0088 -- apertura estrecha ENVIPE-DENUNCIA-SEGURO-v1_0 para RES-0039..0042. Spec aqui; corrida en caja.» La firma autoriza CONGELAR la spec y correrla EN CAJA; no autoriza contar el GEN2 (ver firma_de_contador) ni adoptar."
