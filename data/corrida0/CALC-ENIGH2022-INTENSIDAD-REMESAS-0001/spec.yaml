  cuenta_gen2: PENDIENTE-DE-CASCADA-DIFERIDA
  validacion_independiente: NO-HECHA
  estado_adopcion: NO-ADOPTADO
  contaminacion_declarada: "Se conocia la prevalencia ponderada del padre 0.04569409956405095; no se conocian los montos ni cocientes reales al congelar. No es estudio ciego ni confirmatorio."

inputs:
  - {id: enigh2022_nc_csv, origen: manifiesto}
  - {id: enigh2022_descripcion_base_pdf, origen: manifiesto}
  - {id: enigh2022_nota_tecnica_pdf, origen: manifiesto}
