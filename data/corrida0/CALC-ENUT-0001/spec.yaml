  - {id: RESULT-ENUT-G-N-FILAS-TVAR-CREA, tipo: entero, unidad: "filas (personas) de tvar_crea.csv"}
  - {id: RESULT-ENUT-G-N-COLUMNAS-TVAR-CREA, tipo: entero, unidad: "columnas de tvar_crea.csv (el FD declara 60 para TVAR_CREA)"}
  - {id: RESULT-ENUT-G-FAC-HOG-EN-TVAR-CREA, tipo: texto, unidad: "AUSENTE / PRESENTE -- se espera AUSENTE; PRESENTE invalidaria el hallazgo A.15 de esta spec y debe reportarse, no taparse"}
  - {id: RESULT-ENUT-G-FAC-HOG-TSDEM-IGUAL-THOGAR, tipo: texto, unidad: "IGUAL / DIFIERE:<n_hogares> -- FAC_HOG de tsdem.csv contra el de thogar.csv, hogar por hogar. Guarda nueva de este acto"}
  - {id: RESULT-ENUT-G-FAC-PER-NO-CONSTANTE-EN-HOGAR, tipo: texto, unidad: "CONFIRMADO / REFUTADO:<n> -- re-verifica el motivo por el que la unidad es hogar y el ponderador no es FAC_PER"}
  - {id: RESULT-ENUT-G-DISENO-CONSTANTE-EN-HOGAR, tipo: texto, unidad: "SI / NO:<n_hogares> -- EST_DIS y UPM_DIS constantes dentro de LLAVEHOG"}
