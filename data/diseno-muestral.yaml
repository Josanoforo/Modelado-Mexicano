    varianza)
  upm: UPM_DIS (unidad primaria de muestreo / PSU de diseño, tratada como "ultimate cluster"
    en el estimador de dispersión; comparte llave UPM+VIV_SEL+HOGAR+R_SEL entre TPer_Vic1/TPer_Vic2/TMod_Vic)
