        - {cat_pos: 3, etiqueta: "Patron(a) o empleador(a)", n: 390,  p: 0.5688}
        - {cat_pos: 4, etiqueta: "Trabajador(a) por su cuenta", n: 3428, p: 0.4161}
        - {cat_pos: 0, etiqueta: "Persona no ocupada",       n: 4354, p: 0.3831}
        - {cat_pos: 5, etiqueta: "Trabajador(a) familiar sin pago", n: 452, p: 0.3519}
        - {cat_pos: 2, etiqueta: "Jornalero(a) o peon(a)",   n: 987,  p: 0.2940}
      lectura: "brecha de 42.90pp entre empleado/obrero (72.30%) y jornalero/peon (29.40%), en la direccion que §3.1 predice. Evidencia de direccion, NO la condicional de la regla."
    hallazgo: "Tres supuestos del encargo corregidos contra el FD oficial: (1) la tenencia es C_AFORE y no V_AFORE, que es el MONTO en pesos (0-108264000) -- medir sobre V_AFORE>0 habria dado 29.6% sin ponderar, un numero de otra cosa y sin senial de error; (2) el universo es de hogares, no de personas 18+; (3) el ponderador es FAC_HOG, ni FACTOR ni FAC_PER existen. Los otros dos brazos del ENTONCES de §3.1 (seguro, hipoteca) tienen candidata en la MISMA tabla -- C_SEGVID y SERV_HIPO -- pero quedan fuera de este lote por mandato del encargo; se anotan para el acto sucesor, no se miden."
