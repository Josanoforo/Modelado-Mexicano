# ══════════════════════════════════════════════════════════════════
# LOS 15 COEFICIENTES DE GENERADOR: todos asignados
# (Corregido 29/jul/2026: decía 14, contradiciendo el diagnostico de abajo,
#  que ya dice 15 -- suma real de la tabla `detalle` (G1:2+G2:2+G3:3+G4:4+
#  G5:3+G6:1=15). censo-integridad-v1_0.md C1-05.)
# ══════════════════════════════════════════════════════════════════

asignados_coeficiente:
  diagnostico: >
    Los 15 coeficientes son todos ASIGNADO, y por una razón estructural, no por
    descuido: un coeficiente es una ELASTICIDAD, y el corpus es transversal —
    da estados, no ritmos. Ninguna de las fuentes citadas (Pew, ENCIG, ENOE,
    ENIF, ENVIPE, ENSU, CEEY) publica elasticidades de disposición respecto a
    capa estructural. No existían para ser citadas.
  consecuencia: >
    Los generadores tienen el signo bien sostenido por el corpus y la magnitud
    sin sostener. Esto es lo que hace posible que un generador explique
    cualquier cosa si se le mueve el coeficiente — el riesgo de infalsabilidad
    que las instrucciones v2 marcan y que la prueba de generadores debe atacar.
  detalle:
    - {gen: G1, coefs: {confianza_institucional: -0.60, radio_confianza: -0.35}, signo: sostenido, magnitud: asignada}
    - {gen: G2, coefs: {sens_estatus: 0.55, aversion_riesgo: 0.20}, signo: sostenido, magnitud: asignada}
    - {gen: G3, coefs: {horizonte_temporal: -0.60, aversion_riesgo: 0.40, familismo_apoyo: 0.20}, signo: sostenido, magnitud: asignada}  # ADR-30: familismo_apoyo SE CONSERVA aquí (mecanismo: pooling ante volatilidad — la tanda). NO es doble conteo con G5.
    - {gen: G4, coefs: {exposicion_violencia: 0.70, confianza_institucional: -0.40, horizonte_temporal: -0.20, sens_estatus: -0.15}, signo: sostenido, magnitud: asignada}
    - {gen: G5, coefs: {familismo_apoyo: 0.50, familismo_obligacion: "signo negativo o no monotónico — SIN MAGNITUD", radio_confianza: 0.15}, signo: sostenido, magnitud: asignada}
    # ⚠ CHECK OBLIGATORIO (ADR-30): una configuración donde familismo_obligacion
    #   alto mejore TODOS los desenlaces se rechaza en compilación. Si el modelo
    #   no puede producir el caso en que la familia daña, el parámetro es adorno.
    # ⚠ AMBOS parámetros heredan marca (b): las escalas de familismo
    #   (Sabogal, Lugo Steidel, Knight, Calzada, Zeiders) están validadas en
    #   contextos migratorios. Nadie los ha medido en población EN México.
    - {gen: G6, coefs: {deferencia: 0.45}, signo: sostenido, magnitud: asignada}
  # `unico_calibrable_hoy` SE RETIRA (ADR-49, D1): la premisa de conducta
  # financiera vía ENOE es falsa a nivel de reactivo (forense/hallazgos.md,
  # 31/jul/2026). Lo único que sobrevivía -- el panel rotativo sigue al mismo
  # hogar cinco trimestres -- es cierto pero es propiedad del instrumento
  # ENOE, no una vía de calibración; no se vuelve a declarar aquí como campo
  # de coeficiente. Ningún coeficiente de generador tiene ruta hoy.

# ══════════════════════════════════════════════════════════════════
# RECLASIFICACIÓN v4.0 · Encargo W · 04/ago/2026 · primera estimación
# empírica (β̂) de tres coeficientes de generador -- NO condicionales θ_k(x)
# (eso es `condicionales_escalares`, arriba). Contador: 0 de 15 -> 3 de 15
# coeficientes de generador. `asignados_coeficiente.detalle` NO se toca --
# los valores ASIGNADO (-0.35/-0.60/0.20) siguen siendo lo que el modelo
# usa. Fuente única: forense/notas/2026-08-04-w-coeficientes-generador-
# paso1.md §3 (PR pendiente de fusionar).
# ⚠ ESCALA, no se repite bastante: β̂ es diferencia de proporciones
