    de ENIF 2024 que CALC-C2-COMPUESTO-RESERVADAS-0001 sello sin IC, cuando
    los tres marginales de cada celda se remuestrean JUNTOS?
  consumidor: "las emisiones EMITIDA-SIN-EVALUAR de ENIF 2024 en data/corrida0/c2-compuesto-emisiones-v1_0.tsv (sin IC); sucesor de nube: que el marcador lea el IC de este CALC (una linea)"
  desviacion_autorizada: "mesa, 19/sep/2026, respuesta a la pregunta de alcance P0 (opcion 'Desviacion escrita: medidor con guardia propia'): guardia de una variable propia con la misma semantica; universo/desenlaces/ejes importados del arbitro; marginales_reproduccion.py intacto. Verbatim en forense/prereg-caja/C2-COMPUESTO-IC-ENIF2024-spec-v1_0.md §0"
  regla: dinero.ahorro.via_informal_ejes_enif2024
  ola: "ENIF 2024"
  payload_manifiesto_id: enif_2024_enif_2024_bd_csv
  payload_archivo: enif_2024_bd_csv.zip
  payload_tabla: TMODULO.csv
  ejes_admitidos: [sexo, edad, escolaridad, localidad, cuenta_formal, nacional]
  eje_no_admitido: "formalidad -- NO-EMITIBLE, universo restringido (A-bis 4); no se rescata"
  desenlaces: [ahorra_solo_informal, informal_cualquiera]
  bootstrap_replicas: 10000
  umbral_replicas_validas: 9900
  control_punto_tol: 1.0e-12
  control_arbitro_tol_p: 1.0e-6
  control_arbitro_tol_ic: 1.0e-4
  control_arbitro_n_exacto: true
  control_ramas: "los dos controles REPRODUCE -> IC publicado; cualquiera NO-REPRODUCE -> todos los IC null, IC-ESTADO=IC-NO-PUBLICADO:<causa>, G-IC-PUBLICADO=NO, se sella igual y no se ajusta nada"
  c2_forma: "log-aditiva: expit(logit p_a + logit p_b - logit p)"
  c2_funcion_de_referencia: "tests/test_celda_d_c2.py::piso_log_aditivo -- el medidor la IMPORTA para el punto; las replicas se vectorizan en numpy y su coincidencia con la referencia se mide (G-C2-VECTORIZADO-VS-REFERENCIA-DELTA-MAX)"
  c2_rotulo_supuesto: "ausencia de interaccion en escala logit"
  c2_rotulo_prohibido: "independencia"
  c2_rechazo: "replica con algun marginal en {0,1} o sin denominador: EXCLUIDA y contada, sin recorte ni sustitucion; punto SIN-DEFINIR -> IC-NO-CONSTRUIBLE:PUNTO-SIN-DEFINIR"
  tipo_incertidumbre: IC95-BOOTSTRAP-REPLICA-POR-REPLICA-MARGINALES-COMPARTIDOS
  percentiles: [2.5, 97.5]
  guardia_reserva: "marginal_enif(ola, grupo: str): UN eje por firma (TypeError con lista o dos posicionales), whitelist (ValueError), huella de la ola (ReservaRota); sin cruce(); auditoria_ast() R1-R8 corrida por medir() antes de abrir el zip y por tests/test_c2_ic_enif2024_guardia.py con un control positivo por regla"
  nacionales_citados: "tools/c2_compuesto.py::NACIONALES -- ahorra_solo_informal p=0.357153 (DERIVADO, sin IC; milpa/tramite.yaml:1312), informal_cualquiera p=0.561920 ic95=[0.549922, 0.573502] (MEDIDO; milpa/tramite.yaml:1317)"
  adopcion: NINGUNA
  marcador_actualizado: NO

