# ══════════════════════════════════════════════════════════════════
  # ══════════════════════════════════════════════════════════════════
  # SELLADA · D1-a (mesa, 1/sep/2026) · ACTO MAESTRA34-N1 · SELLA-REGLAS-ACTIVOS-2
  #
  # Cargada VERBATIM a milpa/tramite.yaml, campo por campo, sin
