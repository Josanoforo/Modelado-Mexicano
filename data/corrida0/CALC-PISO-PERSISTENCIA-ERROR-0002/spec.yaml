universo: 'Celdas marginales por eje ENLAZADAS: toda fila MARGINAL de marcador-segmento.tsv con estado SOLO-PISO,
  es decir con un piso PERSISTENCIA(t-1) sellado detrás por la tabla de identidad. Una celda SIN-PISO no entra:
  no hay resta que hacer.'
filtros: Unidad y universo deben coincidir entre piso y R (tabla `unit` vs payload del árbitro); si no, la celda
  sale NO-COMPARABLE con causa y no se fuerza (A-bis 3-4). Las cuatro NO-CONSTRUIBLE de la tabla quedan fuera con
  la causa que la tabla escribe.
ponderador: NO-APLICA
transformacion: d = (R - piso) * 100, en puntos porcentuales; ambos lados son proporciones ponderadas en [0,1] ya
  selladas. Es la única transformación de escala.
estimando: Diferencia por celda entre el R sellado de la ola objetivo y el piso de persistencia t-1 de la misma
  celda, en puntos porcentuales, con su IC95 y su clase (PERSISTE si el IC incluye 0, CAMBIA si lo excluye).
seed:
  aplica: false
  motivo: 'procedimiento determinista: no remuestrea nada, resta valores ya estimados'
parametros:
  z95: 1.959964
  metodo_ic: 'ee aproximado por simetría normal desde cada IC95 sellado (ee = (sup-inf)/(2*1.959964)); olas tratadas
    como muestras INDEPENDIENTES; ee_d = sqrt(ee_R^2 + ee_piso^2). Pérdidas declaradas en spec §3: la asimetría
    del bootstrap por percentiles y la correlación por marco muestral compartido.'
  agregacion: 'por (instrumento x desenlace) y por (instrumento x eje), y por instrumento entero. NUNCA entre instrumentos:
    ENVIPE 1 año, ENCIG 2, ENIF 3.'
tolerancia:
  tipo: flotante
  abs: 1.0e-10
  nota: 'procedimiento determinista sin remuestreo: la re-derivacion debe reproducir bit a bit salvo redondeo de
    punto flotante.'
