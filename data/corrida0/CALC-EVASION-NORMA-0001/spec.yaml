# CALC-EVASION-NORMA-0001 -- cara mecanica de spec.md (ACTO GEN2-SPECS-DEMANDA-2).
# Gobierna spec.md y, sobre el, la spec SELLADA
# forense/prereg-caja/ENVIPE-EVASION-NORMA-spec-v1_0.md
# (`prereg-caja-ENVIPE-EVASION-NORMA`).
# Releva 2 de los 8 RESULT de CORR-0007 (RES-0025/RES-0026) bajo el registro GEN2.
# Registra en D-15 una medicion QUE YA CORRIO (ACTO MAESTRA34-L5, sellada por
# ACTO MAESTRA35-N1, 2/sep/2026) -- no re-mide.
calc_id: CALC-EVASION-NORMA-0001
spec_md: spec.md
spec_md_sha256: 69605ea4c355b480acef91fe2419ac6b6223468e71e528e2769097b12817cefa

script: tools/medidor_evasion_norma_envipe25.py

etiquetas:
  generacion: GEN2
  tipo: TASA-BASE-DE-REGLA-YA-EJECUTADA
  cuenta_gen2: PENDIENTE-DE-MESA
  validacion_independiente: NO-HECHA
  spec_sellada: forense/prereg-caja/ENVIPE-EVASION-NORMA-spec-v1_0.md
  spec_sellada_sha256: 69605ea4c355b480acef91fe2419ac6b6223468e71e528e2769097b12817cefa
  demanda_que_releva: "CORR-0007 (payload envipe2025_csv) -> 2 de 8 RESULT: RES-0025 (tramite.evasion_norma:evade_norma_envipe2025), RES-0026 (:cumple_norma_envipe2025). Residuo declarado (no relevado por esta pieza): RES-0039..0042, DECISION-DE-MESA-PENDIENTE (NC-0088, ver spec.md §3). RES-0027/RES-0028 ya relevados por CALC-ENVIPE-0001 (otra pieza, otra regla)."
  repite_de: "NINGUN CALC previo -- mismo script y misma corrida que YA sello milpa/tramite.yaml (ACTO MAESTRA34-L5, tools/medidor_evasion_norma_envipe25.py; cargada por ACTO MAESTRA35-N1, firma b1, 2/sep/2026). Este CALC no re-ejecuta: registra esa corrida en D-15/GEN2, que no existia."
  por_que_no_es_duplicado: "milpa/tramite.yaml:464-522 trae la cifra sellada (tier FUERTE) pero SIN spec.yaml ni corrida0_resultado_id -- el mismo hueco FALTA-CAPA-2 que CORR-0017, mal etiquetado por el mapa-19 original como EXISTE-NO-SATISFACE/no-tienen-nada (corregido en spec.md §0.2)."
  reglas_bajo_prueba: "NINGUNA cambia de cifra. tramite.evasion_norma conserva evade_norma_envipe2025=0.562774 y cumple_norma_envipe2025=0.437226 exactos, IC95=[0.551982,0.573448], n=40280 (milpa/tramite.yaml:474-475,505-511). Este CALC solo les da cadena E.2 en el registro GEN2."
  firma_de_contador: "NO-FIRMADA. El encargo de mesa (15/sep/2026, forense/encargos/2026-09-15-GEN2-SPECS-DEMANDA-2.md) pide congelar specs ejecutables y no declara OBJETO sobre el contador GEN2. FP-367/368 no satisfecho -> cuenta_gen2 PENDIENTE-DE-MESA."
  contaminacion_declarada: "ADR-46 -- al congelar, la sesion ya habia leido milpa/tramite.yaml:464-522 completo (la regla, la enmienda_envipe2025, universo/ponderador/IC95/n/estratos/UPM, las dos reservas de estimando, las sensibilidades pre-declaradas) y tools/medidor_evasion_norma_envipe25.py (cabecera y estimador). NO es ciega: leerlos es lo que A.8 exige antes de registrar esta capa 2. Nada nuevo se mide."
  medidor_ejecutado_al_congelar: "SI, PERO NO EN ESTA SESION. Corrio en CAJA (ACTO MAESTRA34-L5) contra envipe2025_csv (sha256=8a7a99fd90ce9d03229759ba0ad84db4fba98b5bb1f5c85eef7d718b007816fa). Esta sesion (NUBE, sin corpus) NO lo re-corre -- lee milpa/tramite.yaml y forense/notas/2026-09-02-MAESTRA34-L5-P3-spec.md. `corrida0.py preflight CALC-EVASION-NORMA-0001` reportara BLOQUEADO:resultados_ausente (no script_ausente: el script existe) hasta que un acto de registro transcriba resultados.json -- transcripcion mecanica, no medicion nueva, deliberadamente diferida por la misma disciplina de dos-commits-minimo que el resto de este acto."

inputs:
  - id: envipe2025_csv
    origen: manifiesto
  - id: IN-EVASIONNORMA-SPEC-SELLADA
    origen: repo
    ruta: forense/prereg-caja/ENVIPE-EVASION-NORMA-spec-v1_0.md
    sha256: 69605ea4c355b480acef91fe2419ac6b6223468e71e528e2769097b12817cefa

variables:
  - {archivo: "tmod_vic_envipe2025", variable: BP1_20, rol: "DISPARADOR -- denuncio (1) / no denuncio (2) el delito", codigos: "{1,2}; universo = delitos con BP1_20 en {1,2}"}
  - {archivo: "tmod_vic_envipe2025", variable: BP1_23, rol: "DESENLACE -- razon principal de no denuncia, normalizada a dos digitos", codigos: "evade_norma=1 ssi BP1_20==2 Y BP1_23 en {04,05,06,08}; 0 en cualquier otro caso"}
  - {archivo: "tmod_vic_envipe2025", variable: FAC_DEL, rol: "PONDERADOR de delito", codigos: "flotante tal cual"}
  - {archivo: "tmod_vic_envipe2025", variable: EST_DIS, rol: "ESTRATO de diseno", codigos: "llave de conglomerado"}
  - {archivo: "tmod_vic_envipe2025", variable: UPM_DIS, rol: "UPM de diseno", codigos: "llave de conglomerado"}

universo: >-
  Delitos (unidad delito, no persona) con BP1_20 en {1,2} en tmod_vic_envipe2025.
  n=40280, sin perdida. Poblacion expandida = 35595875 delitos.

filtros: >-
  Ninguno mas alla del universo declarado. La CONJUNTA (no la condicional):
  BP1_23 solo se pregunta a quien no denuncio -- la condicional
  P(evade | norma percibida inutil) NO es estimable con esta fuente
  (reserva heredada, spec.md §2, NO resuelta por este CALC).

ponderador: "FAC_DEL, mismo diseno que CALC-ENVIPE-0001 sobre el mismo payload (unidad delito)."

transformacion: >-
  wprop_ic_conglomerado (tools/calibracion_mordida_encig_serie.py,
  reutilizada por tools/medidor_evasion_norma_envipe25.py): bootstrap de
  conglomerado (EST_DIS,UPM_DIS) con reemplazo, n_boot=10000, seed=42.
  evade_norma_envipe2025 = p ponderado del numerador (21761) sobre n=40280.
  cumple_norma_envipe2025 = complemento CONTADO (1-p, identico aqui porque
  la particion es binaria sin tercera categoria: denuncio, o no denuncio
  por razon de norma, o no denuncio por otra razon -- las dos ultimas ya
  colapsadas en el propio desenlace binario declarado arriba).

estimando: >-
  DESCRIPTIVO/ASOCIACION, sin causalidad. (1) ADOPTABLE POR MESA via carga
  ya sellada: evade_norma_envipe2025=0.562774, IC95=[0.551982,0.573448];
  cumple_norma_envipe2025=0.437226 (complemento). (2) SECUNDARIOS citados
  en milpa/ pero NO releados por este CALC (fuera de su RES-id): las dos
  sensibilidades pre-declaradas (A_mas_codigo_02_extorsion,
  B_solo_delitos_personales) y la segmentacion por ejes (sexo/escolaridad/
  ruralidad) -- ninguna tiene RES-id en demanda-resultados.tsv bajo
  CORR-0007, no se les asigna uno aqui.

dependencias_materiales: [pandas]

parametros:
  fuente_acto: "ACTO GEN2-SPECS-DEMANDA-2 · CALC-EVASION-NORMA-0001 · registro D-15/GEN2 de una medicion YA CORRIDA por ACTO MAESTRA34-L5"
  firma_que_lo_autoriza: "Encargo de mesa del 15/sep/2026, verbatim en forense/encargos/2026-09-15-GEN2-SPECS-DEMANDA-2.md, P2: «CORR-0007 (EXISTE-NO-SATISFACE) -> sucesion que releve la corrida entera, o declaracion explicita de que parte no puede y por que». Esta pieza es la sucesion parcial (2/8); la declaracion explicita del residuo (4/8) vive en spec.md §3."
  bootstrap_replicas: 10000
  seed_original: 42
  numerador: 21761
  estratos: 739
  upm: 10694
  poblacion_expandida: 35595875
  sensibilidades_no_releadas:
    A_mas_codigo_02_extorsion: {p: 0.569696, ic95: [0.559419, 0.579881], n: 40280}
    B_solo_delitos_personales_BPCOD_5_15: {p: 0.560515, ic95: [0.547948, 0.572800], n: 24762}
  residuo_declarado: "RES-0039..0042 (denuncia condicionada a seguro): DECISION-DE-MESA-PENDIENTE, NC-0088, ver spec.md §3. No forma parte de este CALC."

seed:
  aplica: true
  valor: 42
  rng: numpy.random.default_rng (wprop_ic_conglomerado, verbatim del estimador de la casa)

tolerancia:
  tipo: flotante
  abs: 1.0e-6
  razon: >-
    Transcripcion, no re-medicion. Tolerancia fijada para una eventual
    re-ejecucion futura del mismo script/payload/semilla: unica diferencia
    esperable es redondeo de float64 en la suma ponderada del bootstrap.

resultados:
  - {id: RESULT-EVASIONNORMA-G-N-DELITOS, tipo: entero, unidad: "delitos con BP1_20 en {1,2} (esperado 40280)"}
  - {id: RESULT-EVASIONNORMA-G-NUMERADOR, tipo: entero, unidad: "delitos con evade_norma=1 (esperado 21761)"}
  - {id: RESULT-EVASIONNORMA-A-P-EVADE, tipo: proporcion, unidad: "p ponderado de evade_norma -- releva RES-0025 (esperado 0.562774)", permite_no_estimable: true}
  - {id: RESULT-EVASIONNORMA-A-P-CUMPLE, tipo: proporcion, unidad: "complemento contado, 1-A-P-EVADE -- releva RES-0026 (esperado 0.437226)", permite_no_estimable: true}
  - {id: RESULT-EVASIONNORMA-A-SUMA-UNO, tipo: texto, unidad: "SI/NO:<residuo> -- A-P-EVADE + A-P-CUMPLE dentro de tolerancia"}
  - {id: RESULT-EVASIONNORMA-A-IC-LO, tipo: flotante, unidad: "percentil 2.5 del bootstrap (esperado 0.551982)", permite_no_estimable: true}
  - {id: RESULT-EVASIONNORMA-A-IC-HI, tipo: flotante, unidad: "percentil 97.5 del bootstrap (esperado 0.573448)", permite_no_estimable: true}
  - {id: RESULT-EVASIONNORMA-A-DELTA-VS-SELLADO, tipo: flotante, unidad: "A-P-EVADE menos 0.562774 (valor sellado en milpa/tramite.yaml), CON SIGNO", permite_no_estimable: true}
  - {id: RESULT-EVASIONNORMA-A-RELEVA-SELLADO, tipo: texto, unidad: "SI / NO -- delta dentro de tolerancia (esperado SI, transcripcion de la misma corrida)"}
