variables:
- nombre: P5_1_1..P5_1_6
  definicion: vías informales de ahorro; desenlace informal_cualquiera
- nombre: P5_6_1..P5_6_9
  definicion: vías formales (sólo para las guardias de carga() del árbitro)
- nombre: P5_4_1..P5_4_9
  definicion: tenencia de cuenta; eje cuenta_formal
- nombre: SEXO
  definicion: eje sexo
- nombre: EDAD_V
  definicion: eje edad y guardia >= 18
- nombre: NIV
  definicion: eje escolaridad
- nombre: TLOC
  definicion: eje localidad
- nombre: FAC_PER
  definicion: ponderador
- nombre: EST_DIS
  definicion: estrato (sólo identidad)
- nombre: UPM_DIS
  definicion: UPM (sólo identidad)
universo: Personas elegidas de 18 años y más de TMODULO de ENIF 2024, universo de carga() del árbitro (EDAD_V numérica
  >= 18, FAC_PER > 0, alguna de las 15 variables de la sección 5 no en blanco; cualquier violación PARA). Una fila
  por persona.
filtros: 'Ninguno adicional al árbitro. Por par, la persona entra a la celda si sus dos ejes caen en categorías
  de la rejilla ((fuera) en cualquiera de los dos -> fuera de ese par) y la celda está en CELDAS_AUTORIZADAS. Soporte:
  celda con n < 200 personas sin ponderar -> R NO-ESTIMABLE (no puntúa).'
ponderador: FAC_PER
transformacion: 'informal_cualquiera = alguna P5_1_1..P5_1_6 == ''1'' (árbitro desenlaces(), SECUNDARIO). Ejes del
  árbitro: sexo SEXO; edad EDAD_V en 18-29/30-44/45-59/60+ (60-96; 97+ fuera); escolaridad NIV por ESC_ENIF (99
  fuera); localidad TLOC {1,2}=15 000 y mas, {3,4}=menor de 15 000; cuenta_formal alguna P5_4_k == ''1'' vs ninguna
  (todas en blanco fuera). Etiqueta de celda = <PAR>-<slug(a)>-X-<slug(b)>, UNA variable de agrupación.'
estimando: R(a,b) = Σ FAC_PER·informal_cualquiera / Σ FAC_PER por celda de los 9 pares (68 celdas), proporción [0,1]
  de personas elegidas 18+; cobertura de R en el IC95 por réplica del piso C2 (primaria); error absoluto medio punto-del-piso
  vs R (descriptivo)
seed:
  aplica: false
  razon: R es un punto; la cobertura usa el IC ya sellado del contendiente
parametros:
  nominal: 0.95
  z: 1.959964
  regla: cobertura R en [lo, hi] del contendiente; Wilson 95%; NO-ESTIMABLE > SUBCUBRE > SOBRECUBRE > CALIBRADO
  columna_ausente_en_catalogo: NO-ESTIMABLE (sin recodificación ad hoc)
tolerancia:
  tipo: flotante
  abs: 1.0e-10
  razon: 'determinista: sumas float64 sin remuestreo'
