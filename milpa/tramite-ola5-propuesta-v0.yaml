    hallazgo: "El resultado mas informativo de la pieza no estaba buscado: el ahorro INFORMAL casi duplica al FORMAL (0.561920 contra 0.284927, IC95 sin traslape ni de lejos). De la union 0.642080 se sigue que 0.205 de los adultos ahorran por ambas vias y 0.357 ahorran UNICAMENTE por vias informales -- tandas, guardar en casa, con familiares, cajas de ahorro del trabajo. Es apoyo directo para la familia dinero.ahorro.informal_sin_puente / con_puente_y_respaldo del modelo, que hoy no tiene p medida; esta pieza NO las mide ni las reclama, solo deja anotado donde esta el dato. La comparacion acervo-contra-acervo que si valdria requeriria un reactivo que ENIF 2024 no tiene limpio: P4_10 fusiona 'menos de una semana' con 'no tiene ahorros'."
