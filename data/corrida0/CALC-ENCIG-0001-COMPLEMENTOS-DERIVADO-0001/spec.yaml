universo: >-
  El de cada primario del padre, sin cambio: A = usuarios con tramite
  discrecional (P8_3_1 recortado), B = tramites con registro por canal
  (presencial / digital registrado, sin deduplicar), C = tramite N_TRA=01.
  Esta corrida no vuelve a construirlos desde microdatos.

filtros: >-
  No hay filtro nuevo. Se rechaza el padre si su cadena sellada no cubre los
  bytes leidos, si VEREDICTO no es TASA-REPORTADA, si el metodo de IC es
  NO-ESTIMABLE, o si 0 <= IC_lo <= p <= IC_hi <= 1 no se cumple.

ponderador: "Heredado del padre; no se accede a pesos ni microdatos."

transformacion: >-
  q=1-p; IC_lo(q)=1-IC_hi(p); IC_hi(q)=1-IC_lo(p); restas en Decimal sobre
  la representacion JSON publicada del padre.

estimando: >-
  Complemento dependiente q=1-p de cada primario, dentro del mismo recorte
  del padre (exhaustivas y excluyentes solo bajo el recorte; residuos
  medidos en NC-0108). No es tasa poblacional ni evidencia independiente.
  Escala [0,1], unidad del padre.

