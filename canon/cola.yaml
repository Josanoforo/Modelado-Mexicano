- id: I-05
  titulo: "F7.b — un PR puede tocar baseline.json, check.py y el defecto en el mismo diff, y el CI pasa igual"
  clase: instrumento
  abierto: 2026-07-30
  casos: 0
  bloquea: []
  evidencia: "protocolo §4 regla 2 (\"no se congela una línea base en la misma corrida que cambió el medidor\") lo prohíbe como disciplina de sesión, pero nada en .github/workflows/verify.yml ni en tests/check.py lo hace mecánico: el único gate de CI es `check.py --baseline`, que compara contra el propio baseline.json que el mismo diff pudo haber movido. Falta: (1) regla escrita para PRs de terceros (hoy solo cubre sesiones propias vía protocolo), (2) job informativo de CI que corra la suite completa sin --baseline y publique el delta, para que un baseline movido en el mismo diff que introduce el defecto sea visible aunque no bloquee. Sin caso real conocido todavía — riesgo estructural derivado de leer check.py y verify.yml, no un incidente ocurrido"
  estado: abierto

