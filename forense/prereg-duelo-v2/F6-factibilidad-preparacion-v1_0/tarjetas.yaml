    escala: {valor: proporcion_0_1, error: puntos_porcentuales}
    regla_consumidora: familia.apoyo.recibe_dinero_familiares / recibe_dinero_familiares_para_vejez
    definicion:
      estado: CODIFICACION-INTEGRADA-NO-ACREDITADA
      razon: >-
        El formulario mexicano acredita Q8a y sus códigos; el inventario
        acredita que v26 tiene la etiqueta Q8a, pero falta codebook integrado
        que demuestre las etiquetas de valor de v26 sin inferir correspondencia.
    enlace_M:
      estado: CANDIDATO-NO-ELEGIBLE
      razon: >-
        Recepción efectiva de dinero familiar para vejez no es intención de
        acudir primero a familiares o amigos por un préstamo grande.
    reserva:
      estado: EXPUESTA-OBJETIVO
