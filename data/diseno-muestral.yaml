    estimación de varianza -- son nombres de campo distintos que conviven en el mismo instrumento;
    el censo reporta `UPM_DIS` como la UPM de diseño porque es la que las notas usan explícitamente
    para el estimador de conglomerado último. Se descartó como falso positivo cualquier mención
    de ENCIG que fuera solo de paso (ej. comparaciones de universo con TMod_Vic/ENVIPE en hitoD-R7_2-veredicto-v1_0.md:180,
