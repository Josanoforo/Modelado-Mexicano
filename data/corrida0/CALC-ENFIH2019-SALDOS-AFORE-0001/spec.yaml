  reglas_bajo_prueba: "Apoya descriptivamente dinero.planeacion.formal_estable; no valida conducta, formalidad ni causalidad."
  firma_de_contador: "PENDIENTE-DE-MESA; el encargo autoriza medir y publicar, no inventar firma ni adopcion."
