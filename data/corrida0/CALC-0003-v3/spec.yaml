# CALC-0003-v3 -- cara mecanica de spec.md (ACTO GEN2-SPECS-SUCESORAS).
#
# 🛑 UNICA diferencia OPERATIVA con CALC-0003-v2, declarada y no absorbida
# (spec.md §0): el bootstrap remuestrea LOCALIDADES (`id_loc` de c_portad.dta)
# dentro de estrato, no HOGARES (`folio`) dentro de estrato. Es lo que
# S6 v1.3 §3.5 pre-registra al corregir la premisa falsa de v1.2 (FP-351: la
# localidad SI esta en los archivos; c_portad trae edo/mpio/loc/id_loc, y es
# el mismo archivo del que la spec ya tomaba `estrato`).
#
# NO cambia el estimando, el universo, el ponderador, las tres tablas de
# clasificacion, el umbral n<10, la pareja de ponderadores del bx, la `seed`
# (20260908) ni las replicas (2000). Es un cambio de ESTIMADOR DE VARIANZA y
# solo eso: los DELTA, DELTA-SENS, P-T1/P-T0, N-T1/N-T0, N-UNIVERSO, los
# cuatro niveles de LUGAR, N-PONDERADOR-VALIDO, JOINS, LLAVE-UNICA-*,
# DHS-N-EPISODIOS-* y T2-N-VARIABLES deben reproducir IDENTICOS los de v2
# (control de regresion, spec.md §4). Solo IC-LO / IC-HI / VEREDICTO pueden
# moverse.
#
# Los 128 RESULT de v2 se reproducen con los MISMOS ids. Se anaden 14, todos
# diagnostico de esta unica diferencia y ninguno un Delta, un IC o un
# veredicto: CONGLOMERADO-LOCALIDAD, CONGLOMERADO-ANIDAMIENTO y, por cada una
# de las 6 filas efectivas, N-CONGLOMERADOS y N-SIN-CONGLOMERADO. Total 142.
#
# `repite_de: CALC-0003-v2` es el campo que el codigo LEE
# (tools/corrida0.py:2699): deriva SUPERADO→ en registro() y es lo unico que
# autoriza repetir los 128 ids. Cadena: CALC-0003 (PARO, FP-355) ->
# CALC-0003-v2 (SELLADA) -> CALC-0003-v3. Los bytes de las dos anteriores
# quedan INTACTOS.
#
# 🛑 La discrepancia que v2 tuvo que declarar contra su spec sellada
# DESAPARECE: S6 v1.3 §1 ya escribe «T1 = 0 si es09 == 3» (FP-349). Papel y
# codigo coinciden por primera vez en esta cadena.
#
# Gobierna spec.md y, sobre el, la spec SELLADA
# forense/prereg-caja/S6-L16-spec-v1_3.md. CONGELADO en el COMMIT-1 de este
# acto; lo corre el COMMIT-2 del MISMO acto. AQUI NO SE CALCULA NADA.
