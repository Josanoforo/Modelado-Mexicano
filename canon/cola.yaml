  estado: abierto

- id: D-05
  titulo: "«Prueba de falsación corrida» no tiene un referente único en el programa — tres poblaciones confundidas sin marca, más una autocontradicción interna de modelo sobre si G1a está falsado"
  clase: decision
  abierto: 2026-07-30
  casos: 1
  bloquea: [I-07]
  evidencia: "Derivado al intentar propagar la corrección de README:40 (2 de 27, R1.1 → D · R3.2 → B) al canon. Tres poblaciones distintas de 'prueba de falsación', cada una con su propio vocabulario de veredicto, mezcladas sin marca en cinco líneas: (1) HITO D / 27 reglas del perímetro — vocabulario `RX.Y → veredicto A-D`, única fuente el bloque append-only de hitoD-preregistro-v2_0.md, hoy 2 corridas (R1.1→D, R3.2→B); estado-programa-v1_9.md:192/:194 ya lo reflejan bien. (2) HITO C / 7 generadores — vocabulario ✅ probado / ⚠️ contradicho-contestado / ⬜ sin falsar, de forense/hitoC-prueba-generadores.md: G3 ✅ PROBADO Y SOBREVIVE (modelo-decision-v3_3.md:159), G1b ⚠️ YA CONTRADICHO (modelo:157, evidencia Nu/Kueski/Aplazo), G2 contestado, G1a/G4/G5/G6 sin falsar — declarado explícito en modelo-decision-v3_3.md:164 ('cuatro sin falsar: G1a, G4, G5, G6'). (3) Ejercicio suelto de glosario-v5_6.md §6/§10 (líneas 153 y 306), fechado 27/jul/2026 — ANTES de que Hito D Paso 2 existiera (28/jul) — sobre el generador G1a ('utilidad + fricción baja > confianza'), origen declarado FORENSE, veredicto informal 'B: candidato irresuelto en seguro agrícola, techo estructural'; nunca pasó por el protocolo de ADR-40 ni entró al bloque archivado. Las cinco líneas ambiguas invocan estas poblaciones sin distinguirlas: estado-programa-v1_9.md:93 ('Una prueba de falsación pre-registrada corrida, veredicto B' — sin dominio, podría leerse como Hito D desactualizado o como el ejercicio 3) · estado-programa-v1_9.md:118 ('48 de 49 reglas sin prueba de falsación pre-registrada' — mismo conteo indeterminado, arrastra el mismo error si se ancla a cualquiera de las tres poblaciones) · modelo-decision-v3_3.md:46 ('De 49 reglas, una tiene prueba de falsación corrida' — la palabra 'reglas' es un error de categoría: el símbolo ✅ que la oración introduce se usa 113 líneas después exclusivamente para GENERADORES, G3 en modelo:159, no para ninguna regla R-numerada) · modelo-decision-v3_3.md:390 (describe inconfundiblemente el ejercicio 3 — dominio seguro agrícola, criterio utilidad+fricción — y CONTRADICE a modelo:164 DEL MISMO ARCHIVO, que declara G1a sin falsar 226 líneas antes) · gobernanza-v1_12.md:359 (tabla de deuda: repite el conteo de modelo:390 y además lo etiqueta explícitamente 'Es el Hito D', que es la conflación más directa de las cinco: el ejercicio 3 no tiene ID de regla, no está en el bloque append-only, y es anterior a que Hito D existiera). Capa adicional sin resolver: el criterio de G1a (canal personal vs. impersonal, modelo:156) no es idéntico al de 'utilidad+fricción>confianza' del ejercicio 3, pero ambos usan la MISMA evidencia (Nu/Kueski/Aplazo) que modelo:157 usa para declarar G1b 'YA CONTRADICHO' — dos vocabularios de veredicto sobre evidencia que se solapa, con conclusiones que no coinciden (uno dice 'irresuelto, sin contraejemplo', el otro dice 'ya contradicho'). Se pausó la sesión de portada (F2) sin editar ninguna de las cinco líneas — decisión del usuario, 2026-07-30: esto se resuelve en mesa, con las tres poblaciones a la vista, no en una sesión de portada"
  cierre: "ADR-45 (gobernanza-v1_13.md), 2026-07-30. Vocabulario fijado: (1) denominador 27/49 siempre etiquetado; (2) veredicto D cuenta como corrida, la letra viaja con el conteo; (3) Hito D / Hito C / ejercicio de glosario se reportan separados, nunca sumados ni uno etiquetado como otro. Corregidas: estado-programa-v1_9.md:93/:118, modelo-decision-v3_4.md (renombrado desde v3_3 por ADR-36) §0.1/§7, gobernanza-v1_13.md:359 (renombrado desde v1_12), glosario-v5_6.md:153/:306. bloquea [I-07] se mantiene como linaje del hallazgo; I-07 sigue abierta, es instrumento, no vocabulario."
  estado: cerrado

- id: D-06
  titulo: "C2 del plan maestro era una premisa falsa: no hay registro en ENNViH"
  clase: decision
  abierto: 2026-07-30
  casos: 1
  bloquea: []
  evidencia: "La ENNViH es de dominio público; los datos y la documentación se descargan sin costo, sin login, sin formulario y sin términos que aceptar. Los enlaces de las tres olas van directo al .zip de Stata. Fuente: ennvih-mxfls.org, portada y página de ENNVIH-3 (2009-2012), consultada el 30/jul/2026 desde Ubuntu local, que alcanza el host (http=200). Corroborado independientemente esta misma sesión (fetch directo de https://ennvih-mxfls.org, mismo día): «La ENNViH es de dominio público. Los datos y la documentación de la encuesta se pueden descargar sin costo alguno para el usuario.» — registrado en data/manifiesto.yaml, id `ennvih_mxfls_licencia`."
  consecuencia: "El plan maestro tenía \"C2 · registro en ENNViH, lo hace el autor, bloquea C3\" como dependencia humana. No existe. CAL-G3 nunca estuvo bloqueado por un trámite: solo depende de C1 y de esta máquina. Es el mismo patrón que la regla v2.2 cataloga — una restricción supuesta que le dio forma al orden del trabajo y que nadie había medido."
  estado: cerrado
  nota_cierre: "Cerrada por verificación. No requiere acción."
  correccion_2026_07_30: "CITA TRUNCADA. El texto original de esta entrada se conserva íntegro arriba y no se borra: describe con exactitud lo que esa sesión observó. Lo que no describe con exactitud es lo que el sitio DICE. La frase citada de introduccion.html se corta a la mitad; continúa: «...se pueden descargar sin costo alguno para el usuario UNA VEZ QUE SE HAYA CUMPLIDO CON EL PROCEDIMIENTO DE REGISTRO». Además, faq.html describe el flujo de registro en cuatro pasos, verbatim: «1. Dar clic en el nombre del archivo que desea descargar. 2. Llenar la información requerida en el registro de usuarios. 3. Dar clic, nuevamente, en el nombre del archivo... 4. Dar clic en la opción de su preferencia». Verificado el 30/jul/2026 al ejecutar la Fase A de CAL-G3 (descarga real de los 27 paquetes, no sólo lectura de portada). LA DISTINCIÓN QUE IMPORTA, con estas palabras: el requisito de registro EXISTE y está publicado; lo que se verificó es que NO ESTÁ APLICADO en los enlaces /assets/, que responden HTTP 200 con content-type application/zip sin sesión, sin cookie y sin redirección. 'No está aplicado' no es lo mismo que 'no existe'. Ningún formulario se llenó en ninguna sesión. ORIGEN DEL ERROR: nació en una sesión de chat que citó media frase de la portada y dedujo de ahí la ausencia del trámite; el título de esta entrada ('no hay registro en ENNViH') hereda esa media frase. La consecuencia operativa de la entrada NO cambia -- CAL-G3 efectivamente no estuvo bloqueado por ningún trámite, y la Fase A se completó sin él --, pero la razón sí: no porque el trámite no exista, sino porque el servidor no lo exige. Misma familia que la regla v2.2: aquí el rótulo era 'no hay registro' y describía un servidor, no una política."

- id: E-02
  titulo: "Contaminación declarada: una sesión de chat leyó la estructura de libros de ENNViH ola 3 el 30/jul"
  clase: evidencia
  abierto: 2026-07-30
  casos: 1
  bloquea: []
  evidencia: "Al verificar si existía registro, esa sesión abrió la página de ENNVIH-3 y leyó la lista de secciones por libro. NO leyó variables, ni preguntas, ni valores, ni cuestionarios, ni manuales de codificación: solo nombres de sección. Cinco de ellas (TB, CRH, AH, SE, CR) ya estaban nombradas en la ficha de CAL-G3, así que ahí no hubo información nueva. Tres NO se buscaban y sí son nuevas para esa sesión: CO-Confianza, RG-Riesgo, DH-Decisiones en el hogar."
  consecuencia: "Esa conversación NO debe escribir fichas de falsación que dependan de esas tres secciones. No afecta a R3.1 ni R3.4 (trámite y Estado, sin relación con ENNViH). Sí afectaría a cualquier ficha futura sobre confianza, riesgo o decisiones del hogar medidas en ENNViH, y a conf.06 si se resolviera con esa fuente."
  estado: abierto
  nota_estado: "Abierta como restricción permanente sobre esa sesión, no como tarea — no es un pendiente de trabajo. Se cierra sola cuando la ficha correspondiente la escriba otra sesión."

- id: I-08
  titulo: "El esquema de data/manifiesto.yaml no tenía campo para localizar el payload real en data/raw/"
  clase: instrumento
  abierto: 2026-07-30
  casos: 1
  bloquea: []
  evidencia: "Al escribir tests/manifiesto.py (--registra/--verifica) se encontró que ninguna entrada de data/manifiesto.yaml tenía un campo que apuntara al archivo real dentro de data/raw/ -- el id no coincide con el nombre de archivo (id `encig23_base_datos_csv`, archivo real `encig23_base_datos_csv.zip`), así que --verifica no podía saber qué abrir. No es hallazgo del encargo: se descubrió al implementar. Añadido campo `archivo` al esquema (data/manifiesto.yaml:19, :31) y retrocompletado en las dos entradas de payload existentes -- sin fabricar sha256/tamano_bytes/entorno_descarga retroactivos, solo la ruta, que es un hecho verificable contra disco."
  estado: cerrado
  nota_cierre: "Cerrada en el mismo commit que la abre -- ver tests/manifiesto.py y data/manifiesto.yaml."

- id: D-07
  titulo: "Desvío de alcance en tests/manifiesto.py: --registra no descarga, registra un payload que ya está en data/raw/"
  clase: decision
  abierto: 2026-07-30
  casos: 1
  bloquea: []
  evidencia: "El encargo de C1 pedía que --registra descargara el archivo desde --url-origen. Lo construido registra un archivo ya presente en data/raw/ -- no abre socket, no valida TLS. Revisión de PR (2026-07-30) marcó el desvío como no declarado en ninguna parte hasta ese momento."
  consecuencia: "Defendible: un script de este repo bajando de una URL con TLS sin verificar es el mismo tipo de riesgo que el proyecto ya trata con sospecha (proxy de egreso bloqueado contra inegi.org.mx, forense/notas/2026-07-29-d-bloqueo-encig.md). Pero es un desvío real, no una lectura literal del encargo. Lo que queda sin cubrir: el momento de la descarga sigue sin instrumentar -- ahí nacieron los dos hashes tecleados a mano en data/manifiesto.yaml (encig23_*, 2026-07-29, anteriores a este script). Con el diseño actual, un archivo recién bajado por fuera del script sigue necesitando que alguien teclee su sha256 antes de que --registra pueda registrarlo. Ver I-09 -- --contrasta es el paso que permitiría probar esto de verdad, sin descargar dentro del script."
  estado: cerrado
  nota_cierre: "Declarado en el docstring de tests/manifiesto.py y aquí, mismo commit que lo declara. No cambia el diseño -- la decisión de no descargar se mantiene."

- id: I-09
  titulo: "tests/manifiesto.py no tiene modo para contrastar un payload nuevo contra una entrada YA registrada sin sobreescribirla"
  clase: instrumento
  abierto: 2026-07-30
  casos: 1
  bloquea: []
  evidencia: "--registra rechaza un id que ya existe (por diseño, para no sobreescribir en silencio); --verifica solo lee el archivo que la propia entrada declara. Ninguno de los dos modos cubre el caso real que se anticipó como primera prueba de --registra: bajar encig23_estructura_base_datos.pdf (hoy AUSENTE de data/raw/) y comparar su hash contra el que ya está en data/manifiesto.yaml (eb89820c...), sin tocar la entrada existente."
  consecuencia: "Falta un tercer modo (--contrasta o similar): toma un payload nuevo, lo compara contra una entrada existente por id, reporta COINCIDE / DISCREPANCIA -- sin escribir nada. Una DISCREPANCIA es un HALLAZGO (el archivo cambió, o el hash original estaba mal, o la fuente cambió de contenido), no un conflicto que el script resuelva en silencio sobreescribiendo. No se implementa en esta sesión para no alargar el PR de C1."
  estado: cerrado
  nota_cierre: "--compara implementado en tests/manifiesto.py (mismo commit que cierra esta entrada). Prueba negativa de dos lados corrida contra copia temporal: candidato idéntico bajo nombre distinto al registrado → COINCIDE, exit 0; mismo candidato con un byte alterado → DISCREPANCIA, exit 1. Verificado contra dato real del repo (encig23_base_datos_csv) sin escribir nada en data/manifiesto.yaml."

- id: E-03
  titulo: "Inhabilitación de fichas por descarga de microdatos — alcance exacto de la tanda del 30/jul (Hito D Fase 1, ampliación del Paso 4)"
  clase: evidencia
  abierto: 2026-07-30
  casos: 1
  bloquea: []
  evidencia: "Decisión de mesa del autor (30/jul): bajar TODAS las olas disponibles de ENCIG (no solo 2023), y la serie completa de cualquier encuesta de la tanda que publique varias ediciones con microdatos. Se derivó la lista real desde inegi.org.mx (no del encargo) y se descargaron por script, registradas en data/manifiesto.yaml con sha256/tamaño/entorno_descarga: ENCIG 2015/2017/2019/2021/2023(datosabiertos) + la ya existente de 2023(microdatos-tab); ENIF 2018/2021/2024; ENVIPE 2018/2019/2020/2021/2022/2023/2024/2025 (serie completa, 8 de 8); ENIGH nueva-construcción 2012/2014/2016/2018/2020/2022. NO se descargó nada de ENUT, ENCUCI ni ENSANUT -- las tres existen pero ninguna edición expuso un enlace de archivo estático verificable por script sin forzar un mecanismo (formulario/SPA/login); quedan marcadas 'requiere navegador' en data/manifiesto.yaml (id hitoD_fase1_ediciones_requieren_navegador), no 'no existe' -- corolario 2 del encargo."
  consecuencia: "[TEXTO ORIGINAL, 30/jul/2026 -- ver corrección fechada abajo] Esta máquina queda INHABILITADA para pre-registrar contra las encuestas efectivamente descargadas -- mismo patrón que E-02 (contaminación por tocar la fuente, aquí por descarga en vez de por lectura). Alcance exacto: R3.1 inhabilitada (ENCIG, ya lo estaba también R3.2 -- archivada). R1.2 inhabilitada (ENIF). R7.2 inhabilitada (ENVIPE). R5.1 inhabilitada (ENIGH). NO inhabilitadas por esta sesión: R5.2 (ENUT, nada se bajó), R8.3 (ENCUCI, nada se bajó), R4.2 (ENSANUT, nada se bajó) -- estas tres siguen abiertas a pre-registro desde esta máquina, precisamente porque no se tocó su fuente. R3.4 tampoco se toca aquí (Banxico/SPEI no forma parte de esta tanda; sigue bloqueada por el gate de ADR-37, razón distinta)."
  correccion_2026-07-30b: >
    Corregido por encargo de una sesión distinta de la que descargó los datos (ver E-04 sobre por
    qué eso importa). El texto original erraba en dos direcciones a la vez (gobernanza ADR-46):
    (a) demasiado amplio -- "esta máquina" INHABILITADA trata el hardware como si retuviera
    contexto entre sesiones; una sesión nueva arrancada en frío en la misma máquina no ha leído
    nada y está tan limpia como una en la nube; (b) demasiado estrecho -- lo que contamina no es
    dónde corrió el proceso, sino qué puede LEER una sesión nueva en ese entorno: los payloads de
    data/raw/ y la bitácora que describe qué se exploró de la estructura del portal.


    Unidad de contaminación: LA SESIÓN (su contexto de lectura), no la máquina ni el modelo.
    Condición verificable (ADR-46): una sesión puede pre-registrar contra una fuente si NO ha
    leído data/raw/ de esa fuente, NI la bitácora de la tanda que la bajó, NI ningún registro de
    exploración de su estructura.


    Nivel de contaminación por encuesta, derivado de forense/bitacora.md (bloques de cierre del
    30/jul, rama claude/hitod-perimetro-compara) y de data/manifiesto.yaml
    (id hitoD_fase1_ediciones_requieren_navegador): NINGÚN caso de esta tanda fue descarga ciega.
    Las cuatro encuestas efectivamente descargadas (ENCIG/R3.1, ENIF/R1.2, ENVIPE/R7.2,
    ENIGH-nc/R5.1) requirieron EXPLORACIÓN DE ESTRUCTURA para encontrarlas: la bitácora declara
    "lista real derivada de inegi.org.mx, no del encargo (título de página real vs 'Página no
    encontrada'; Content-Type/Content-Length de un zip real vs el shell de 2263 bytes)" -- eso es
    probar patrones de nombre por edición (p. ej. ENVIPE 2021/2022 con 'ENVIPE' en mayúsculas,
    ENIGH-nc con cuatro convenciones de nombre distintas entre 2012 y 2022), no un url conocido de
    antemano. R3.1/R1.2/R7.2/R5.1 siguen bloqueadas para cualquier sesión que haya leído esa
    bitácora o esos payloads -- el motivo cambia (exploración de estructura, no descarga), la
    consecuencia no.


    Hallazgo que el texto original no declaraba y que el conservador obliga a declarar: ENUT/R5.2,
    ENCUCI/R8.3 y ENSANUT/R4.2 NO están libres de contaminación como afirmaba el original. La
    entrada hitoD_fase1_ediciones_requieren_navegador registra, para las tres, exploración real de
    estructura sin descarga -- ediciones probadas por patrón de nombre, JSON-LD leído para
    distinguir placeholder de plantilla vs distribución real, navegación del acordeón de ENSANUT
    (host ensanut.insp.mx, distinto de inegi.org.mx) para confirmar seis ediciones con sección de
    descargas real. Es exploración parcial, no descarga -- por eso R5.2/R8.3/R4.2 NO quedan en el
    mismo nivel que R3.1/R1.2/R7.2/R5.1 (que además tienen payload en data/raw/), pero tampoco
    quedan libres: cualquier sesión que lea esa entrada de manifiesto.yaml o la bitácora del 30/jul
    queda igual de alcanzada por la condición verificable de arriba para R5.2/R8.3/R4.2. No se
    pudo distinguir, dentro de esta exploración, si en algún punto se llegó a ver más que
    título/JSON-LD/nombre de acordeón por encuesta -- ante la duda, se trata como exploración de
    estructura completa para las tres, no como caso menor.
  estado: abierto
  nota_estado: "Abierta como restricción permanente por SESIÓN (no por máquina) para las siete fichas listadas en la corrección -- se cierra por ficha cuando la escriba una sesión que no haya leído data/raw/ de esa fuente, ni la bitácora de la tanda que la bajó, ni ningún registro de exploración de su estructura (condición de ADR-46)."

- id: E-04
  titulo: "La corrección de E-03 la hizo una sesión distinta de la que bajó los datos -- separación deliberada, no accidental"
  clase: evidencia
  abierto: 2026-07-30
  casos: 1
  bloquea: []
  evidencia: "Encargo de corrección de E-03 (30/jul/2026, gobernanza ADR-46), ejecutado por una sesión que no participó en la tanda de descarga de Hito D Fase 1 Paso 4 (rama claude/hitod-perimetro-compara, commits feaf38e/d0d9e07/ce3c284/33b412f) ni abrió data/raw/ ni ningún payload en el curso de esta corrección -- restricción explícita del encargo, verificada contra el propio alcance de este PR (solo canon/cola.yaml y canon/gobernanza-v*.md tocados)."
  consecuencia: "Quien bajó ENCIG/ENIF/ENVIPE/ENIGH y escribió el E-03 original no debía ser quien redefine qué significa estar contaminado por bajarlo: esa sesión ya tenía un incentivo estructural (aunque no consciente) para trazar el criterio de forma que el trabajo que acababa de hacer quedara del lado limpio -- el mismo problema que un auditor auditándose a sí mismo. Separar autoría del hallazgo (E-03) de autoría del criterio (ADR-46) es la misma disciplina que D-05/ADR-45 aplicó al vocabulario de falsación: la mesa fija el criterio antes de ver si conviene, no después. No implica que el E-03 original estuviera escrito de mala fe -- el error (a)/(b) que ADR-46 corrige es plausible en cualquier sesión, incluida esta; el punto es que la corrección no la firme la misma mano que tiene algo en juego en el resultado."
  estado: cerrado
  nota_cierre: "Cerrada por declaración -- no requiere trabajo adicional. Se registra como precedente de proceso, no como pendiente."

- id: E-05
  titulo: "ENCIG 2023 'datos abiertos' (26MB) y la pestaña 'microdatos' (38MB) son productos distintos del mismo levantamiento -- R3.2 se midió contra el de 38MB"
  clase: evidencia
  abierto: 2026-07-30
  casos: 1
  bloquea: []
  evidencia: "Hallazgo de tests/manifiesto.py --compara en su primer uso real (bitácora 30/jul, rama claude/hitod-perimetro-compara): encig2023_datosabiertos_csv (data/manifiesto.yaml, tamano_bytes 26171769, url_origen .../encig/2023/datosabiertos/encig2023_csv.zip) dio DISCREPANCIA contra la entrada ya registrada encig23_base_datos_csv (tamano_bytes 38309647, url_origen .../encig/2023/#microdatos) -- distintos por tamaño y por hash, no una redundancia. hitoD-R3_2-veredicto-v1_0.md:11 y hitoD-preregistro-v2_0.md:474 declaran que el veredicto de R3.2 se corrió contra las tablas encig2023_04_sec_7 y encig2023_05_sec_8 -- procedencia de la pestaña 'microdatos' (el paquete de 38MB), no del zip de 'datos abiertos' (26MB) que se descargó por separado el 30/jul."
  consecuencia: "No cambia el veredicto de R3.2 (B, hitoD-preregistro, sin tocar). Lo que falta, y que este hallazgo deja registrado para que una reproducción futura no tropiece con el mismo desconcierto: cuál paquete se usó no estaba escrito en ningún lado hasta este ADR-46 -- alguien que reproduzca R3.2 partiendo del zip de 'datos abiertos' (26MB, la ruta más visible del portal) encontraría una estructura de columnas distinta a la que describe encig23_estructura_base_datos.pdf y no tendría explicación de por qué. Se deja constancia aquí, en data/manifiesto.yaml (ya lo tenía por id/url_origen) y no se toca ninguna ficha ni se abre ningún payload para escribir esta entrada -- la discrepancia ya estaba registrada por --compara, esto solo la nombra y la conecta con R3.2."
  estado: cerrado
  nota_cierre: "Cerrada por declaración -- documenta un hecho de procedencia ya medido por D-07/I-09 (--compara), no abre trabajo nuevo. Ver también I-09 (cerrada) para el diseño de --compara que produjo la DISCREPANCIA original."

- id: D-08
  titulo: "La premisa 'sin distribución localizable' para ENCUCI 2020 y para las cuatro ediciones citadas de ENUT era un defecto del instrumento de sondeo por script, no una propiedad real del portal"
  clase: decision
  abierto: 2026-07-30
  casos: 1
  bloquea: []
  evidencia: "data/manifiesto.yaml, id hitoD_fase1_ediciones_requieren_navegador (escrita 30/jul, corolario 2 del encargo de esa sesión): clasificó ENCUCI 2020 como 'sin distribución localizable' y ENUT 2009/2014/2019/2024 como que 'ninguna edición expone zip estático bajo los patrones de nombre probados'. Ese sondeo se hizo por script, contra patrones de URL (datosabiertos/microdatos) que funcionaron para ENCIG/ENIF/ENVIPE/ENIGH. El mismo día, el autor navegó ambos portales a mano y reporta: ENCUCI 2020 expone descarga directa desde la pestaña Microdatos -> 'Descargar todos los archivos' (la bajó y la registró esta sesión, ids encuci2020_bd_dbf/encuci2020_fd_pdf); ENUT expone las CINCO ediciones -- 2002, 2009, 2014, 2019, 2024, la primera no estaba ni siquiera en la lista original -- cada una con base, descriptor de archivos y diagrama entidad-relación, también desde la pestaña Microdatos. Ninguna de las cinco de ENUT se ha descargado todavía (queda para otra sesión). Este hallazgo no lo verificó ninguna sesión/script navegando el portal -- viene declarado por el autor; se transcribe, no se explora."
  consecuencia: "Mismo patrón que D-06 (regla v2.2): una ausencia medida con un instrumento -- aquí, patrones de URL probados por script -- se había heredado como si fuera una propiedad del terreno. Corregido en data/manifiesto.yaml (id hitoD_fase1_ediciones_requieren_navegador, párrafos de ENUT y ENCUCI): se preserva el texto original (qué se probó y con qué instrumento) y se añade la corrección fechada, sin borrar el registro de lo que se intentó. ENCUCI 2020 deja de estar pendiente (bajada y registrada esta sesión). Las cinco ediciones de ENUT siguen pendientes de descarga, pero por razón distinta a partir de ahora: existen y son alcanzables, falta bajarlas, no falta localizarlas."
  estado: cerrado
  nota_cierre: "Corregida en el mismo commit que la abre -- ver data/manifiesto.yaml, id hitoD_fase1_ediciones_requieren_navegador."

- id: E-06
  titulo: "Criterio corregido de contaminación: descarga ciega (registrar un payload que un humano ya bajó) vs exploración de estructura (una sesión tocando el portal en vivo) -- alcance de ESTA sesión para ENCUCI 2020"
  clase: evidencia
  abierto: 2026-07-30
  casos: 1
  bloquea: []
  evidencia: "Esta sesión recibió dos archivos ya bajados por el autor vía navegador (pestaña Microdatos de https://www.inegi.org.mx/programas/encuci/2020/ -> 'Descargar todos los archivos'), colocados en /mnt/c/Users/PC0/Descargas MX/. Esta sesión los copió a data/raw/ sin renombrar y los registró con tests/manifiesto.py --registra (sha256/tamaño derivados del archivo real en disco, nunca tecleados). En ningún momento esta sesión hizo una petición de red a inegi.org.mx ni a ningún otro portal -- ni para verificar la URL de origen (la dio el autor) ni para confirmar la existencia de las ediciones de ENUT (también la dio el autor, ver D-08). No se abrió el ZIP ni se leyó el PDF -- solo se hasheó. Esta entrada se redactó (id original E-04) antes de conocer la corrección de E-03 por ADR-46/E-04 -- se renumera a E-06 al fusionar con origin/main para no chocar de ID; el contenido no se reescribe, solo se renombra y se referencia."
  consecuencia: "Criterio corregido frente a E-02/E-03 (texto original, pre-ADR-46): 'exploración de estructura' es una sesión/script tocando el portal en vivo por cuenta propia (fetch de red, lectura de página) y aprendiendo del terreno por sí misma -- eso SÍ contamina, es lo que inhabilitó R3.1/R1.2/R7.2/R5.1 en E-03 y las tres secciones de ENNViH en E-02. 'Descarga ciega' es registrar un payload que un canal humano (navegador) ya obtuvo fuera de esta sesión, sin que esta sesión toque la red -- esta sesión hizo solo eso. La distinción no exime al PAYLOAD de la restricción que ya aplica a todo dato registrado con sha256: el archivo de ENCUCI 2020 queda efectivamente registrado en data/manifiesto.yaml en esta sesión -- mismo hecho consumado que en E-03, aunque el canal fue distinto (navegador del autor, no script de esta máquina). Por consistencia con ese precedente, R8.3 (ENCUCI) queda INHABILITADA para pre-registro desde esta sesión en adelante -- ya bloqueada además por conf.06 (D-06). R5.2 (ENUT) NO queda inhabilitada: nada se descargó ni registró de ENUT esta sesión; la corrección de premisa en D-08 es un reporte transcrito del autor, no una exploración propia. R4.2 (ENSANUT) sin cambios -- el autor declaró que otra sesión la está bajando por script; esa sesión, cuando cierre, declarará su propio alcance. Coincide, de forma independiente, con la unidad de contaminación que fija ADR-46 (la sesión, no la máquina) -- no se reescribe este texto para adoptar ese vocabulario; queda como constancia de que dos sesiones distintas llegaron al mismo criterio por caminos separados."
  estado: cerrado
  nota_cierre: "Cerrada en la misma sesión que la abre -- no hay acción pendiente derivada, el registro queda para que otra sesión sepa qué tocó esta antes de pre-registrar R8.3. Renumerada de E-04 a E-06 al resolver el conflicto de merge contra origin/main (PR #8 ya había tomado E-04 y E-05)."

- id: D-09
  titulo: "CAL-G3: el criterio pre-registrado puede confirmar G3 pero no puede refutarlo — qué se hace con CAL-C y 9b"
  clase: decision
  abierto: 2026-07-30
  casos: 1
  bloquea: [CAL-G3-FaseC]
  evidencia: "Chequeo CAL-X del punto 9a corrido ANTES de abrir microdatos, como la propia ficha ordena (tests/calx_g3.py, insumos sólo codebook). Denominadores = folio de la sección CRH del Libro II: 8,046 (2002) / 8,134 (2005-06) / 9,092 (2009-12). Tasa base de 'algún acceso formal' (Banco + afores voluntarias, mapeo de Adenda 1 (c)): 9.59-9.94% / 7.70-7.95% / 7.08-7.23%. RESULTADO POR CELDA -- CAL-A: ALCANZABLE, un criterio en razón tiene techo p_max/p_min y RR>=1.5 sólo exige p(jefe informal)<=66.67%, holgura 7x/8x/9x; el modo de falla de R3.2 (gate en pp por encima del techo observado) no se repite. CAL-B: ALCANZABLE, celda residual. CAL-C: NO ALCANZABLE POR CONSTRUCCIÓN -- no acota un nivel sino una PRECISIÓN; con RR puntual=1 y p=7.23% hacen falta 1,981 hogares por brazo (3,962 con el contraste; por ola 1,398 / 1,786 / 1,981), y el techo duro de hogares discordantes en el desenlace entre olas 1 y 3 es 800+657=1,457, con el cual SE(log RR)=0.1877 y el mejor IC95% superior alcanzable es 1.445 contra el <1.25 exigido. 9b (nulo estricto con poder): NO ALCANZABLE, la banda [0.80,1.25] exige SE(log RR)<0.1139 y el techo permite 0.1877. La cota de 1,457 es deliberadamente generosa: supone traslape cero, supone que todo hogar con ahorro formal es hogar panel presente en ambas olas, y no descuenta todavía el cambio de formalidad del jefe, ni la atrición, ni la exclusión de las observaciones levantadas en EE.UU. que el punto (6) ordena. El número real será materialmente menor y aun así 1,457 < 3,962. Narrado en hitoD-preregistro-v2_0.md, Nota 8 (a)."
  consecuencia: "Con las tasas base del codebook, el criterio puede CONFIRMAR G3 pero no puede REFUTARLO. Un criterio que sólo admite confirmación no es un falsador. El punto 9a manda re-declarar el criterio EN MESA antes de abrir microdatos, nunca descubrirlo después ni archivarlo como un B accidental. Correr la Fase C contra el criterio tal como está sellado produciría un CAL-A o un CAL-B que no significaría lo que aparenta."
  opciones_a_considerar: "NINGUNA ELEGIDA -- se listan para la mesa, no se recomienda ninguna. (1) Re-declarar la banda de ruptura a lo que el poder efectivamente alcance, y declarar explícitamente que el diseño no tiene poder para nulos estrictos. (2) Declarar CAL-X sobre la mitad refutadora del criterio y archivar la ficha como ejecutable para DESCRIBIR pero no para FALSAR. (3) Partir el entregable: dejar la elasticidad como resultado descriptivo, sin veredicto de falsación asociado."
  estado: cerrado
  nota_estado: "Decisión de mesa. Esta sesión NO elige: registrar la decisión es el entregable. Bloquea la Fase C de CAL-G3."
  nota_cierre: "Cerrada por decisión de mesa del autor, 30/jul/2026: opción 3. La elasticidad se estima como resultado descriptivo, con su banda, sin veredicto de falsación asociado -- CAL-G3 no emite CAL-A/B/C/X y no entra al conteo de corridas archivadas (bloque append-only de hitoD-preregistro-v2_0.md, ADR-40). Razón: el criterio no puede refutar (verificado sobre las dos transiciones del panel, robusto a cualquier ICC, falla incluso con ICC=0 -- tests/calx_g3.py, forense/notas/2026-07-30-calx-g3-salida.txt), pero el motivo de fondo es que CAL-G3 nunca fue una tarea de falsación: G3 no está en duda como dirección, está en duda su magnitud, y un veredicto binario es la herramienta equivocada para eso. Ver gobernanza ADR-47 (distingo FALSAR REGLA vs. CALIBRAR COEFICIENTE) y hitoD-preregistro-v2_0.md Nota 9. Fase C queda desbloqueada con alcance reducido (ver D-10) y NO se corre en esta sesión. ADR-47 no reclasifica las otras 26 fichas del perímetro -- ver entrada nueva abierta sin resolver."

- id: D-10
  titulo: "CAL-G3: la premisa de comparabilidad del módulo TB es falsa — cómo se armoniza la exposición entre olas"
  clase: decision
  abierto: 2026-07-30
  casos: 1
  bloquea: [CAL-G3-FaseC]
  evidencia: "El punto (4) de CAL-G3 afirma que 'el módulo TB es idéntico en las tres olas (verificado contra la documentación de las tres)'. No lo es. El set de opciones de TB33 (trabajo principal) es de 8 opciones en 2002 (tb33p_a..h), 9 en 2005-06 (tb33p_a..i) y 11 en 2009-12 (tb33p_a..k, añadiendo '10. Incapacidad/enfermedad' y '11. Otro'). La ola 1 carece por completo de '9. Ninguna de las anteriores' -- no aparece en ningún punto del Libro IIIA de 2002, verificado por barrido sobre el manual completo. ARITMÉTICA QUE LO DELATA, sobre la categoría 3 ('Contrato verbal o de palabra (no tiene contrato)'), que es la que el punto (4) usa para definir INFORMAL: ola 1 cat3=6,044 con cat9 AUSENTE; ola 2 cat3=1,772 y cat9=3,798, cat3+cat9=5,570; ola 3 cat3=1,470 y cat9=5,198. La suma de la ola 2 (5,570) reconstruye el 6,044 de la ola 1 con 8% de holgura; el 1,772 aislado no lo reconstruye de ninguna manera (-71%). Sin opción 'ninguna', la categoría 3 de 2002 funciona como residual atrapa-todo y en 2005 el instrumento la parte en dos. Narrado en hitoD-preregistro-v2_0.md, Nota 8 (b)."
  consecuencia: "Bajo la definición literal del punto (4) ('INFORMAL si reporta contrato verbal o de palabra sin IMSS'), un jefe de hogar SIN NINGÚN CAMBIO REAL en su situación se codifica INFORMAL en 2002 y SALE del contraste en 2005, recodificado 'ninguna', que no es ni formal ni informal. El diseño identifica con transiciones dentro-de-unidad y el instrumento las FABRICA. Sesgo sin dirección declarable a priori -- no se puede argumentar que va contra encontrar el efecto, como sí se pudo con el supuesto del jefe en el punto (4) y con la atrición en el punto (6)."
  opciones_a_considerar: "NINGUNA ELEGIDA. (1) Restringir la muestra analítica a las olas 2-3, donde el set de opciones sí es comparable en la parte que importa, pagando el costo de perder la línea basal. (2) Construir un equivalente de 'ninguna de las anteriores' en 2002 y declararlo como supuesto explícito, con su sesgo nombrado y su dirección declarada antes de estimar."
  nota_adicional: "Desliz de nombre, aparte y menor, registrado para que no se descubra al ejecutar: el punto (4) cita 'tb33p_d categorías 1-2' y 'tb33p_d categoría 4'. tb33p_* es una batería multi-selección de binarias separadas, una por opción (tb33p_a=cat1, tb33p_b=cat2, tb33p_c=cat3, tb33p_d=cat4 IMSS y sólo IMSS); no existe 'tb33p_d categorías 1-2'. Misma familia que el defecto catalogado en Adenda 1 (g). La intención es construible sin ambigüedad (FORMAL = tb33p_a OR tb33p_b OR tb33p_d): nombre mal, intención bien. NO requiere decisión de mesa; se registra porque el cuerpo de la ficha no se edita."
  estado: cerrado
  nota_estado: "Decisión de mesa. Esta sesión NO elige. Bloquea la Fase C de CAL-G3."
  nota_cierre: "Cerrada por decisión de mesa del autor, 30/jul/2026: opción 1. La muestra analítica de CAL-G3 se restringe a las olas 2-3, donde el set de opciones de TB33 es comparable en la parte que importa. Razón: la ola 1 carece de '9. Ninguna de las anteriores' y su categoría 3 opera como residual atrapa-todo, así que el instrumento fabrica transiciones en un diseño que identifica con transiciones dentro-de-unidad -- opción 2 (imputar un equivalente en 2002) descartada, exige un supuesto sobre datos que no existen y cuyo sesgo no tiene dirección declarable. El costo aparente se elimina con el cálculo de poder apilando las dos transiciones del panel completo (tests/calx_g3.py, forense/notas/2026-07-30-calx-g3-salida.txt): el escenario B (olas 2-3) da IC95%sup 1.461 contra 1.401 del escenario C (olas 1 y 3) -- ninguno de los dos alcanza el <1.25 que exige CAL-C, y el mejor caso posible de toda la matriz (tres olas apiladas, ICC=0) da 1.281, tampoco alcanza. Restringir a olas 2-3 NO sacrifica poder útil: ese poder no existía con tres olas tampoco. Ver gobernanza ADR-47 y hitoD-preregistro-v2_0.md Nota 9. Fase C queda desbloqueada con este alcance reducido y NO se corre en esta sesión."

- id: I-10
  titulo: "Colisión de IDs en la serie D-: 'D-06' nombra dos cosas distintas en el canon"
  clase: instrumento
  abierto: 2026-07-30
  casos: 2
  bloquea: []
  evidencia: "El identificador 'D-06' tiene dos referentes distintos y ninguno de los dos es erróneo en su propio contexto: (1) canon/cola.yaml:132 -- 'C2 del plan maestro era una premisa falsa: no hay registro en ENNViH', clase decision, estado cerrado. (2) forense/hitoD-preregistro-v2_0.md:322 y canon/estado-programa-v1_9.md:182 -- fila de la tabla de defectos del pre-registro, 'D-06 | R8.3 | Depende de conf.06, abierto: ninguna cifra de confianza interpersonal es usable'. Son DOS NUMERACIONES D- PARALELAS sin espacio de nombres declarado: la de cola.yaml (D- = clase decision, junto a I- instrumento y E- evidencia) y la del pre-registro (D- = defecto de redacción numerado). Detectado el 30/jul/2026 al ejecutar la Fase B de CAL-G3, cuando un encargo de chat pidió 'corregir cola.yaml D-06' y la verificación previa contra archivo tuvo que descartar primero el otro referente. Ya circuló en encargos de chat que citaron 'D-06' creyendo que era una sola entrada."
  consecuencia: "Misma familia que D-05 y ADR-45: un identificador sin referente único. La diferencia con D-05 es que allí el problema era vocabulario de veredicto mezclando tres poblaciones; aquí es el ID mismo. Riesgo concreto: un encargo, un test o una propagación al canon que resuelva 'D-06' contra el registro equivocado. CANDIDATO A TEST, no implementado aquí: ningún ID de cola debe aparecer con dos referentes distintos en el canon -- comprobable cruzando los ids de canon/cola.yaml contra las tablas de defectos de forense/ y canon/estado-programa."
  estado: registrado
  nota_estado: "REGISTRADA, NO ABIERTA -- por instrucción explícita del autor (30/jul/2026): se deja constancia, no se resuelve en esta sesión y no se abre como tarea. DESVÍO DE VOCABULARIO, declarado en vez de quedar implícito: este archivo sólo usaba dos valores de `estado` (abierto, cerrado) y esta entrada introduce un tercero. Se eligió así porque 'abierto' la convertiría en tarea (lo que la instrucción prohíbe) y 'cerrado' afirmaría en falso que está resuelta. Si la mesa prefiere conservar el vocabulario de dos valores, esta entrada pasa a `abierto` con esta misma nota y no se pierde nada."

- id: I-11
  titulo: "Un checkout compartido entre sesiones de escritura se bloquea sin que ninguna sesión haga nada mal -- .git/HEAD es del directorio, no de la sesión"
  clase: instrumento
  abierto: 2026-07-30
  casos: 2
  bloquea: []
