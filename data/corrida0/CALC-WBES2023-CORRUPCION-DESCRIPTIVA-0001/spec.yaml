  - {id: RESULT-WBES2023-DES-G-N-EXPUESTOS-TOTAL, tipo: entero, unidad: establecimientos}
  - {id: RESULT-WBES2023-DES-G-N-CLASIFICADOS-TOTAL, tipo: entero, unidad: establecimientos}
  - {id: RESULT-WBES2023-DES-G-PESO-EXPUESTOS-TOTAL, tipo: flotante, unidad: establecimientos expandidos}
  - {id: RESULT-WBES2023-DES-PUNTO-TOTAL, tipo: proporcion, unidad: proporcion de respuesta observada}
  - {id: RESULT-WBES2023-DES-MASA-DESCONOCIDA-TOTAL, tipo: proporcion, unidad: proporcion de expuestos}
  - {id: RESULT-WBES2023-DES-LIMITE-INFERIOR-TOTAL, tipo: proporcion, unidad: proporcion de expuestos}
