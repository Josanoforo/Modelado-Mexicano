      del de calendario, y este acto no reclama identificacion causal.
      B-bis, tambien escrito antes de mirar: si el IC hubiera cruzado cero, la
      regla habria quedado ACOTADA y no refutada. No es el caso.
      Lo que falta para separar los efectos, nombrado y no rodeado: variacion de
