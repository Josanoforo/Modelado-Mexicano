  generacion: GEN2
  tipo: IC-REPLICA-POR-REPLICA-PARA-EMISIONES-C2-COMPUESTO
  unidad_transferencia: DELITO
  uso_motor: NO-ADOPTA-NADA
  cuenta_gen2: SI  # PROPUESTO -- nace PENDIENTE-DE-MESA salvo firma; adoptados_activos no se mueve
  estado_de_emision: EMITIDA-SIN-EVALUAR
  validacion_independiente: CONTROL-A-PUNTO-CONTRA-CALC-C2-COMPUESTO-RESERVADAS-0001 + CONTROL-B-REPLICA-BASE-CONTRA-R-SELLADO-DEL-ARBITRO-EN-CINCO-EJES-(cotejo) + GUARDIA-DE-UNA-VARIABLE-EN-tools/celda_d/marginales_reproduccion.py (tests/test_marginales_una_variable.py, 22 casos) + tests/test_c2_ic_envipe2025_guardia.py (AST)
  fuente_acto: GEN2-GUARDIAN-ENVIPE-EJES-IC-1
  sucede_a: "GEN2-C2-COMPUESTO-IC-ENVIPE2025-1 (PR #907, PARO-PREMISA, 0 de 38, NC-0361)"
  firma_vigente: "mesa 20/sep/2026, verbatim «2 si extendemos», en forense/encargos/2026-09-20-GEN2-GUARDIAN-ENVIPE-EJES-IC-1.md"
  guardian_extendido: "tools/celda_d/marginales_reproduccion.py gana sexo y edad (EJES) y PARES_VETADOS[2025] = {edad, dominio_urbano_rural} (NC-0328); firmas, defaults y salidas previas intactas; verify de las dos corridas del piloto 2 REPRODUCE con el modulo extendido"
  desviacion_declarada: "SEXO/EDAD se cargan de tmod_vic (COLUMNAS_TMOD), la tabla de la que el arbitro las leyo (medidor_evasion_norma_envipe25.py:188; tramite-ola5-propuesta-v0.yaml:1680), no de tsdem como decia el encargo -- fila NO-CORRIDO"
  cruce_llamado: "NO -- cruce() no se invoca en este medidor; la guardia se prueba con zips fabricados en tests/test_marginales_una_variable.py"
  medidor_ejecutado_al_congelar: "NO -- cero microdato en COMMIT-1 (E.5)"
  orden_de_commits: "COMMIT-1 guardian extendido + spec + medidor + tests (sin microdato) -> COMMIT-2 esta corrida, registro y replay"

