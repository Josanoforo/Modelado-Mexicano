- id: I-07
  titulo: "Una cifra corregida en la portada (README:40) sobrevivió intacta en el canon porque el encargo nombró un archivo, no una afirmación — mismo patrón que ADR-29, un piso más arriba"
  clase: instrumento
  abierto: 2026-07-30
  casos: 1
  bloquea: []
  evidencia: "sesión de propagación de F2 (2026-07-30, misma rama que PR #3): el encargo que corrigió README:40 nombró ese archivo específico; el mismo defecto (conteo de corridas de falsación fuera del bloque append-only, sin derivarse de él) seguía vivo en canon/estado-programa-v1_9.md:93/:118, canon/modelo-decision-v3_3.md:46/:390 y canon/gobernanza-v1_12.md:359 — ninguno se tocó porque ninguno estaba nombrado. ADR-29 ya declaró esta familia (hallazgo correcto que no baja a todos los consumidores del hecho); esto es el mismo patrón un nivel más arriba: ni siquiera hace falta que el hallazgo original fuera incompleto, basta con que el encargo apunte a un archivo. Candidato a test: ninguna afirmación de conteo de veredictos o de corridas de falsación debe existir fuera de `## Registro de veredictos archivados` sin derivarse mecánicamente de él (extensión de T18/ADR-40 a todo canon/, no solo hitoD-preregistro)"
  estado: abierto

- id: D-05
  titulo: "«Prueba de falsación corrida» no tiene un referente único en el programa — tres poblaciones confundidas sin marca, más una autocontradicción interna de modelo sobre si G1a está falsado"
  clase: decision
  abierto: 2026-07-30
  casos: 1
  bloquea: [I-07]
  evidencia: "Derivado al intentar propagar la corrección de README:40 (2 de 27, R1.1 → D · R3.2 → B) al canon. Tres poblaciones distintas de 'prueba de falsación', cada una con su propio vocabulario de veredicto, mezcladas sin marca en cinco líneas: (1) HITO D / 27 reglas del perímetro — vocabulario `RX.Y → veredicto A-D`, única fuente el bloque append-only de hitoD-preregistro-v2_0.md, hoy 2 corridas (R1.1→D, R3.2→B); estado-programa-v1_9.md:192/:194 ya lo reflejan bien. (2) HITO C / 7 generadores — vocabulario ✅ probado / ⚠️ contradicho-contestado / ⬜ sin falsar, de forense/hitoC-prueba-generadores.md: G3 ✅ PROBADO Y SOBREVIVE (modelo-decision-v3_3.md:159), G1b ⚠️ YA CONTRADICHO (modelo:157, evidencia Nu/Kueski/Aplazo), G2 contestado, G1a/G4/G5/G6 sin falsar — declarado explícito en modelo-decision-v3_3.md:164 ('cuatro sin falsar: G1a, G4, G5, G6'). (3) Ejercicio suelto de glosario-v5_6.md §6/§10 (líneas 153 y 306), fechado 27/jul/2026 — ANTES de que Hito D Paso 2 existiera (28/jul) — sobre el generador G1a ('utilidad + fricción baja > confianza'), origen declarado FORENSE, veredicto informal 'B: candidato irresuelto en seguro agrícola, techo estructural'; nunca pasó por el protocolo de ADR-40 ni entró al bloque archivado. Las cinco líneas ambiguas invocan estas poblaciones sin distinguirlas: estado-programa-v1_9.md:93 ('Una prueba de falsación pre-registrada corrida, veredicto B' — sin dominio, podría leerse como Hito D desactualizado o como el ejercicio 3) · estado-programa-v1_9.md:118 ('48 de 49 reglas sin prueba de falsación pre-registrada' — mismo conteo indeterminado, arrastra el mismo error si se ancla a cualquiera de las tres poblaciones) · modelo-decision-v3_3.md:46 ('De 49 reglas, una tiene prueba de falsación corrida' — la palabra 'reglas' es un error de categoría: el símbolo ✅ que la oración introduce se usa 113 líneas después exclusivamente para GENERADORES, G3 en modelo:159, no para ninguna regla R-numerada) · modelo-decision-v3_3.md:390 (describe inconfundiblemente el ejercicio 3 — dominio seguro agrícola, criterio utilidad+fricción — y CONTRADICE a modelo:164 DEL MISMO ARCHIVO, que declara G1a sin falsar 226 líneas antes) · gobernanza-v1_12.md:359 (tabla de deuda: repite el conteo de modelo:390 y además lo etiqueta explícitamente 'Es el Hito D', que es la conflación más directa de las cinco: el ejercicio 3 no tiene ID de regla, no está en el bloque append-only, y es anterior a que Hito D existiera). Capa adicional sin resolver: el criterio de G1a (canal personal vs. impersonal, modelo:156) no es idéntico al de 'utilidad+fricción>confianza' del ejercicio 3, pero ambos usan la MISMA evidencia (Nu/Kueski/Aplazo) que modelo:157 usa para declarar G1b 'YA CONTRADICHO' — dos vocabularios de veredicto sobre evidencia que se solapa, con conclusiones que no coinciden (uno dice 'irresuelto, sin contraejemplo', el otro dice 'ya contradicho'). Se pausó la sesión de portada (F2) sin editar ninguna de las cinco líneas — decisión del usuario, 2026-07-30: esto se resuelve en mesa, con las tres poblaciones a la vista, no en una sesión de portada"
  cierre: "ADR-45 (gobernanza-v1_13.md), 2026-07-30. Vocabulario fijado: (1) denominador 27/49 siempre etiquetado; (2) veredicto D cuenta como corrida, la letra viaja con el conteo; (3) Hito D / Hito C / ejercicio de glosario se reportan separados, nunca sumados ni uno etiquetado como otro. Corregidas: estado-programa-v1_9.md:93/:118, modelo-decision-v3_4.md (renombrado desde v3_3 por ADR-36) §0.1/§7, gobernanza-v1_13.md:359 (renombrado desde v1_12), glosario-v5_6.md:153/:306. bloquea [I-07] se mantiene como linaje del hallazgo; I-07 sigue abierta, es instrumento, no vocabulario."
  estado: cerrado

- id: D-06
  titulo: "C2 del plan maestro era una premisa falsa: no hay registro en ENNViH"
  clase: decision
  abierto: 2026-07-30
  casos: 1
  bloquea: []
  evidencia: "La ENNViH es de dominio público; los datos y la documentación se descargan sin costo, sin login, sin formulario y sin términos que aceptar. Los enlaces de las tres olas van directo al .zip de Stata. Fuente: ennvih-mxfls.org, portada y página de ENNVIH-3 (2009-2012), consultada el 30/jul/2026 desde Ubuntu local, que alcanza el host (http=200). Corroborado independientemente esta misma sesión (fetch directo de https://ennvih-mxfls.org, mismo día): «La ENNViH es de dominio público. Los datos y la documentación de la encuesta se pueden descargar sin costo alguno para el usuario.» — registrado en data/manifiesto.yaml, id `ennvih_mxfls_licencia`."
  consecuencia: "El plan maestro tenía \"C2 · registro en ENNViH, lo hace el autor, bloquea C3\" como dependencia humana. No existe. CAL-G3 nunca estuvo bloqueado por un trámite: solo depende de C1 y de esta máquina. Es el mismo patrón que la regla v2.2 cataloga — una restricción supuesta que le dio forma al orden del trabajo y que nadie había medido."
  estado: cerrado
  nota_cierre: "Cerrada por verificación. No requiere acción."

- id: E-02
  titulo: "Contaminación declarada: una sesión de chat leyó la estructura de libros de ENNViH ola 3 el 30/jul"
  clase: evidencia
  abierto: 2026-07-30
  casos: 1
  bloquea: []
  evidencia: "Al verificar si existía registro, esa sesión abrió la página de ENNVIH-3 y leyó la lista de secciones por libro. NO leyó variables, ni preguntas, ni valores, ni cuestionarios, ni manuales de codificación: solo nombres de sección. Cinco de ellas (TB, CRH, AH, SE, CR) ya estaban nombradas en la ficha de CAL-G3, así que ahí no hubo información nueva. Tres NO se buscaban y sí son nuevas para esa sesión: CO-Confianza, RG-Riesgo, DH-Decisiones en el hogar."
  consecuencia: "Esa conversación NO debe escribir fichas de falsación que dependan de esas tres secciones. No afecta a R3.1 ni R3.4 (trámite y Estado, sin relación con ENNViH). Sí afectaría a cualquier ficha futura sobre confianza, riesgo o decisiones del hogar medidas en ENNViH, y a conf.06 si se resolviera con esa fuente."
  estado: abierto
  nota_estado: "Abierta como restricción permanente sobre esa sesión, no como tarea — no es un pendiente de trabajo. Se cierra sola cuando la ficha correspondiente la escriba otra sesión."

- id: I-08
  titulo: "El esquema de data/manifiesto.yaml no tenía campo para localizar el payload real en data/raw/"
  clase: instrumento
  abierto: 2026-07-30
  casos: 1
  bloquea: []
  evidencia: "Al escribir tests/manifiesto.py (--registra/--verifica) se encontró que ninguna entrada de data/manifiesto.yaml tenía un campo que apuntara al archivo real dentro de data/raw/ -- el id no coincide con el nombre de archivo (id `encig23_base_datos_csv`, archivo real `encig23_base_datos_csv.zip`), así que --verifica no podía saber qué abrir. No es hallazgo del encargo: se descubrió al implementar. Añadido campo `archivo` al esquema (data/manifiesto.yaml:19, :31) y retrocompletado en las dos entradas de payload existentes -- sin fabricar sha256/tamano_bytes/entorno_descarga retroactivos, solo la ruta, que es un hecho verificable contra disco."
  estado: cerrado
  nota_cierre: "Cerrada en el mismo commit que la abre -- ver tests/manifiesto.py y data/manifiesto.yaml."

- id: D-07
  titulo: "Desvío de alcance en tests/manifiesto.py: --registra no descarga, registra un payload que ya está en data/raw/"
  clase: decision
  abierto: 2026-07-30
  casos: 1
  bloquea: []
  evidencia: "El encargo de C1 pedía que --registra descargara el archivo desde --url-origen. Lo construido registra un archivo ya presente en data/raw/ -- no abre socket, no valida TLS. Revisión de PR (2026-07-30) marcó el desvío como no declarado en ninguna parte hasta ese momento."
  consecuencia: "Defendible: un script de este repo bajando de una URL con TLS sin verificar es el mismo tipo de riesgo que el proyecto ya trata con sospecha (proxy de egreso bloqueado contra inegi.org.mx, forense/notas/2026-07-29-d-bloqueo-encig.md). Pero es un desvío real, no una lectura literal del encargo. Lo que queda sin cubrir: el momento de la descarga sigue sin instrumentar -- ahí nacieron los dos hashes tecleados a mano en data/manifiesto.yaml (encig23_*, 2026-07-29, anteriores a este script). Con el diseño actual, un archivo recién bajado por fuera del script sigue necesitando que alguien teclee su sha256 antes de que --registra pueda registrarlo. Ver I-09 -- --contrasta es el paso que permitiría probar esto de verdad, sin descargar dentro del script."
  estado: cerrado
  nota_cierre: "Declarado en el docstring de tests/manifiesto.py y aquí, mismo commit que lo declara. No cambia el diseño -- la decisión de no descargar se mantiene."

- id: I-09
  titulo: "tests/manifiesto.py no tiene modo para contrastar un payload nuevo contra una entrada YA registrada sin sobreescribirla"
  clase: instrumento
  abierto: 2026-07-30
  casos: 1
  bloquea: []
  evidencia: "--registra rechaza un id que ya existe (por diseño, para no sobreescribir en silencio); --verifica solo lee el archivo que la propia entrada declara. Ninguno de los dos modos cubre el caso real que se anticipó como primera prueba de --registra: bajar encig23_estructura_base_datos.pdf (hoy AUSENTE de data/raw/) y comparar su hash contra el que ya está en data/manifiesto.yaml (eb89820c...), sin tocar la entrada existente."
  consecuencia: "Falta un tercer modo (--contrasta o similar): toma un payload nuevo, lo compara contra una entrada existente por id, reporta COINCIDE / DISCREPANCIA -- sin escribir nada. Una DISCREPANCIA es un HALLAZGO (el archivo cambió, o el hash original estaba mal, o la fuente cambió de contenido), no un conflicto que el script resuelva en silencio sobreescribiendo. No se implementa en esta sesión para no alargar el PR de C1."
  estado: cerrado
  nota_cierre: "--compara implementado en tests/manifiesto.py (mismo commit que cierra esta entrada). Prueba negativa de dos lados corrida contra copia temporal: candidato idéntico bajo nombre distinto al registrado → COINCIDE, exit 0; mismo candidato con un byte alterado → DISCREPANCIA, exit 1. Verificado contra dato real del repo (encig23_base_datos_csv) sin escribir nada en data/manifiesto.yaml."

- id: E-03
  titulo: "Inhabilitación de fichas por descarga de microdatos — alcance exacto de la tanda del 30/jul (Hito D Fase 1, ampliación del Paso 4)"
  clase: evidencia
  abierto: 2026-07-30
  casos: 1
  bloquea: []
  evidencia: "Decisión de mesa del autor (30/jul): bajar TODAS las olas disponibles de ENCIG (no solo 2023), y la serie completa de cualquier encuesta de la tanda que publique varias ediciones con microdatos. Se derivó la lista real desde inegi.org.mx (no del encargo) y se descargaron por script, registradas en data/manifiesto.yaml con sha256/tamaño/entorno_descarga: ENCIG 2015/2017/2019/2021/2023(datosabiertos) + la ya existente de 2023(microdatos-tab); ENIF 2018/2021/2024; ENVIPE 2018/2019/2020/2021/2022/2023/2024/2025 (serie completa, 8 de 8); ENIGH nueva-construcción 2012/2014/2016/2018/2020/2022. NO se descargó nada de ENUT, ENCUCI ni ENSANUT -- las tres existen pero ninguna edición expuso un enlace de archivo estático verificable por script sin forzar un mecanismo (formulario/SPA/login); quedan marcadas 'requiere navegador' en data/manifiesto.yaml (id hitoD_fase1_ediciones_requieren_navegador), no 'no existe' -- corolario 2 del encargo."
  consecuencia: "Esta máquina queda INHABILITADA para pre-registrar contra las encuestas efectivamente descargadas -- mismo patrón que E-02 (contaminación por tocar la fuente, aquí por descarga en vez de por lectura). Alcance exacto: R3.1 inhabilitada (ENCIG, ya lo estaba también R3.2 -- archivada). R1.2 inhabilitada (ENIF). R7.2 inhabilitada (ENVIPE). R5.1 inhabilitada (ENIGH). NO inhabilitadas por esta sesión: R5.2 (ENUT, nada se bajó), R8.3 (ENCUCI, nada se bajó), R4.2 (ENSANUT, nada se bajó) -- estas tres siguen abiertas a pre-registro desde esta máquina, precisamente porque no se tocó su fuente. R3.4 tampoco se toca aquí (Banxico/SPEI no forma parte de esta tanda; sigue bloqueada por el gate de ADR-37, razón distinta)."
  estado: abierto
  nota_estado: "Abierta como restricción permanente sobre esta máquina para las cuatro fichas listadas, no como tarea -- mismo patrón que E-02. Se cierra sola cuando la ficha correspondiente la escriba otra sesión/máquina que no haya tocado esa fuente."

- id: D-08
  titulo: "La premisa 'sin distribución localizable' para ENCUCI 2020 y para las cuatro ediciones citadas de ENUT era un defecto del instrumento de sondeo por script, no una propiedad real del portal"
  clase: decision
  abierto: 2026-07-30
  casos: 1
  bloquea: []
  evidencia: "data/manifiesto.yaml, id hitoD_fase1_ediciones_requieren_navegador (escrita 30/jul, corolario 2 del encargo de esa sesión): clasificó ENCUCI 2020 como 'sin distribución localizable' y ENUT 2009/2014/2019/2024 como que 'ninguna edición expone zip estático bajo los patrones de nombre probados'. Ese sondeo se hizo por script, contra patrones de URL (datosabiertos/microdatos) que funcionaron para ENCIG/ENIF/ENVIPE/ENIGH. El mismo día, el autor navegó ambos portales a mano y reporta: ENCUCI 2020 expone descarga directa desde la pestaña Microdatos -> 'Descargar todos los archivos' (la bajó y la registró esta sesión, ids encuci2020_bd_dbf/encuci2020_fd_pdf); ENUT expone las CINCO ediciones -- 2002, 2009, 2014, 2019, 2024, la primera no estaba ni siquiera en la lista original -- cada una con base, descriptor de archivos y diagrama entidad-relación, también desde la pestaña Microdatos. Ninguna de las cinco de ENUT se ha descargado todavía (queda para otra sesión). Este hallazgo no lo verificó ninguna sesión/script navegando el portal -- viene declarado por el autor; se transcribe, no se explora."
  consecuencia: "Mismo patrón que D-06 (regla v2.2): una ausencia medida con un instrumento -- aquí, patrones de URL probados por script -- se había heredado como si fuera una propiedad del terreno. Corregido en data/manifiesto.yaml (id hitoD_fase1_ediciones_requieren_navegador, párrafos de ENUT y ENCUCI): se preserva el texto original (qué se probó y con qué instrumento) y se añade la corrección fechada, sin borrar el registro de lo que se intentó. ENCUCI 2020 deja de estar pendiente (bajada y registrada esta sesión). Las cinco ediciones de ENUT siguen pendientes de descarga, pero por razón distinta a partir de ahora: existen y son alcanzables, falta bajarlas, no falta localizarlas."
  estado: cerrado
  nota_cierre: "Corregida en el mismo commit que la abre -- ver data/manifiesto.yaml, id hitoD_fase1_ediciones_requieren_navegador."

- id: E-04
  titulo: "Criterio corregido de contaminación: descarga ciega (registrar un payload que un humano ya bajó) vs exploración de estructura (una sesión tocando el portal en vivo) -- alcance de ESTA sesión para ENCUCI 2020"
  clase: evidencia
  abierto: 2026-07-30
  casos: 1
  bloquea: []
