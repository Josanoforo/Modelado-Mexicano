universo: "Las 32 celdas ENIF de ARBITRO-MARGINALES-metadatos-v1_0.tsv. Cambio entre olas: persona elegida 18-70 (2018: el marco; 2021: dominio sobre el marco entero); piso y R en su universo sellado (18+)."
filtros: "Ponderador positivo y diseño válido; desenlace definido; códigos inválidos fuera sólo del eje afectado; 2018: blanco en P5_9_k por pase (P5_4 = 2 y P5_5 = 2) = No."
ponderador: "FAC_PER (2015, 2018); FAC_ELE (2021)"
transformacion: "Marginales armonizados 2018 y 2021 (informal cualquiera; D9 como D8, vías formales sin la 8) por celda; Δ = logit h2021 - logit h2018; τ² por grupo desenlace × eje = media de Δ² sin centrar; IC calibrado = expit(logit p2021 ± 1.959964·√(ee_muestral² + τ²)); cobertura de R 2024 con Wilson por celda y por conglomerado; 2015 sólo descriptivo (spec §2-§5)."
estimando: "Intervalo de persistencia calibrado (muestral + cambio-entre-olas) por celda marginal ENIF y su cobertura de R 2024, RETROSPECTIVA-MECÁNICA."
seed: {aplica: true, valor: 42, rng: numpy.PCG64}
parametros:
  bootstrap_replicas: 10000
  metodo_ic: "bootstrap UPM estratificado; percentiles 2.5/97.5; un plan de réplicas por ola (estimador sellado de -0003)"
  z95: 1.959964
  pooling: "grupo = desenlace × eje (12 grupos); τ² = media de Δ² sin centrar ni restar ruido"
  par_de_olas: "2018 -> 2021 (2015 descriptivo)"
  umbral_x_fp: 0.80
  umbral_piso: 0.50
  tolerancia_oro: 1.0e-10
dependencias_materiales: [numpy, pandas]
tolerancia:
  tipo: flotante
  abs: 1.0e-10
  razon: mismo estimador, misma semilla y mismo marco; replay bit a bit salvo redondeo de punto flotante
