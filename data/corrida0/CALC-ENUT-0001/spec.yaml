  - {id: RESULT-ENUT-A-N-HOGARES, tipo: entero, unidad: "hogares del universo (GEN1 conto 29181)"}
  - {id: RESULT-ENUT-A-N-HOGARES-COINCIDE-GEN1, tipo: texto, unidad: "COINCIDE / DIFIERE:<delta> -- contra 29181"}
  - {id: RESULT-ENUT-A-N-PERSONAS, tipo: entero, unidad: "personas de tvar_crea.csv en el universo"}
  - {id: RESULT-ENUT-A-N-HOGARES-CON-CARGA, tipo: entero, unidad: "hogares con den > 0 (alguna hora de cuidado registrada)"}
  - {id: RESULT-ENUT-A-N-HOGARES-SIN-MUJER-40MAS, tipo: entero, unidad: "hogares sin ninguna mujer 40+ (aportan 0 al numerador, sin salir del denominador)"}
  - {id: RESULT-ENUT-A-N-HOGARES-SIN-FAC-HOG, tipo: entero, unidad: "hogares de tvar_crea.csv sin FAC_HOG en tsdem.csv (ACTO MAESTRA35-L7 conto 0)"}
  - {id: RESULT-ENUT-A-N-UPM, tipo: entero, unidad: "conglomerados (EST_DIS,UPM_DIS) distintos (GEN1 conto 4200)"}
