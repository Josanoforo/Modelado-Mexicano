# CALC-HORIZONTE-VIA-DERIVADOS-0001-v1_1 -- SUCESION v1.1 de CALC-HORIZONTE-VIA-DERIVADOS-0001 (ACTO GEN2-MEDICION-DEMANDA-2, CAJA, 15/sep/2026).
# La v1_0 (ACTO GEN2-SPECS-DEMANDA-2, PR #781) queda INTACTA y SUPERADA: E.3 prohibe editarla.
# Por que hay v1_1: la v1_0 era INEJECUTABLE por construccion -- declaraba
#   `sha256: LEER-AL-EJECUTAR -- ...` en sus dos inputs `origen: repo` (preflight lo lee como DISCORDA
#   y bloquea siempre) y `script:` a un medidor.py que no existia. Lo que cambia respecto a la v1_0:
#   (1) sha256 REALES de los resultados.json sellados de CALC-ENIF-0001 y CALC-ENIF-0002;
#   (2) los tres insumos que la v1_0 leia de milpa/tramite.yaml (tiene_ahorros_enif2024, A_solo_formal,
#       B_solo_informal) se toman de RESULT SELLADOS en corrida0 con el MISMO valor: tiene_ahorros y su
#       complemento de CALC-TIENE-AHORROS-0001-v1_1 (el padre CORR-0009, sellado en este acto ANTES de
#       congelar esta spec -- el encadenamiento DEPENDE-DE-CORRIDA-PADRE queda mecanico, por sha256),
#       y A_solo_formal/B_solo_informal de CALC-ENIF-0001 (RESULT-ENIF-AHO-B-P-FORMAL-P / -INFORMAL-P,
#       que milpa/tramite.yaml:1214-1215 cita como su propia fuente corrida0). milpa/ no es input: no se
#       puede pinear por sha (cambia acto a acto) y E.3 manda leer sellados;
#   (3) `parametros.insumos_esperados` hace explicitos los seis valores que la v1_0 escribia en prosa
#       («esperado …») para que la guardia NO-ESTIMABLE-INSUMO-CAMBIO sea mecanica (tolerancia 1e-6:
#       tiene_ahorros sellado sin redondear = 0.6420795666 vs 0.642080 en milpa/, |delta| 4.3e-7);
#   (4) `script:` al medidor.py de esta carpeta, `spec.md` presente, `repite_de` en la raiz, etiquetas
#       de proceso. Transformacion, estimando, tolerancia e ids de RESULT: VERBATIM de la v1_0.
# CALC-HORIZONTE-VIA-DERIVADOS-0001 -- cara mecanica de spec.md (ACTO GEN2-SPECS-DEMANDA-2).
# Gobierna spec.md y, sobre el, la spec SELLADA
