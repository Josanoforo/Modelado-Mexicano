# LOTE REGLAS-ACTIVOS-L1 · ACTO MAESTRA33-E18-P3 · 1/sep/2026
#
# NOMBRE DEL LOTE, corregido por direccion: el encargo nacio como
# "REGLAS-OLA6-ACTIVOS-L1" y el archivo de encargo conserva ese nombre
# (A.3 no edita un verbatim). La direccion corrigio el nombre en el
# Mensaje 2 del encargo MAESTRA33-S2, verbatim: «en P3 los lotes se
# nombran REGLAS-ACTIVOS-L1/L2/L3 (no REGLAS-OLA6-ACTIVOS): son reglas
# nuevas dentro de los 4 dominios ya ACTIVOS, no apertura de dominio
# (eso lo evaluo E14 y es otra cosa). Anade esa aclaracion en la
# cabecera de cada lote.» ACLARACION, tambien verbatim: «"ACTIVOS" =
# reglas nuevas dentro de los 4 dominios ya activos (tramite, civico,
# dinero, familia). No es apertura de Ola 6; E14/ADR-265 sigue vigente.»
# Esta cabecera es esa aclaracion. Por eso estas entradas NO viven en un
# archivo "ola6" propio: viven aqui, en el acumulador unico -- que es
# ademas donde MAESTRA33-S2 declara que las buscara al relanzarse
# (forense/notas/2026-09-01-maestra33-s2-sella-2-reglas-activos-cierre.md
# lineas 47-52, condicion (a) de relanzamiento).
#
# ESTE ES EL "PR DE EJECUCION" QUE S2 ESPERABA. S2 corrio con P1 SIN
# INSUMO porque lo unico fusionado era el lote REDACTADO (PR #443, sin p
# medida): «la compuerta se cumplio por letra, no por sustancia». Este
# acto aporta la sustancia -- p medida contra microdato real en Ubuntu.
# Falta todavia la condicion (b) de S2: firma de mesa POR REGLA, fuera
# de corchetes. Este acto no la puede dar; por eso las dos entradas van
# situacion: PENDIENTE-DE-MESA.
#
# METODO, distinto del de la fase 1 de este mismo archivo y declarado:
# el IC95 NO sale del bootstrap simple por fila (tools/tasas_base_fase1.py)
# sino del bootstrap por CONGLOMERADO ESTRATIFICADO (remuestreo de UPMs
# dentro de estrato, 10k replicas, seed 42), porque las dos fuentes de
# este lote SI traen campos de diseno y se verificaron presentes antes de
# calcular: ENIGH est_dis+upm en las 6 olas; ENFIH2019 EDIS+UPM_DIS (407
# estratos, cero singletons). Es lo que 2026-08-31-reglas-fase1-spec.md
# §(c)4 previo y no pudo hacer. Precedente del estimador:
# tools/medicion_familismo.py:274-301 (ACTO MAESTRA32-E16, ADR-235).
# Medidores: tools/tasas_base_ola6_activos.py (R1/R2),
# tools/censo_encup_participacion.py (R3). Spec:
# forense/notas/2026-09-01-MAESTRA33-E18-P3-L1-spec.md.
#
# El motor sigue sin cargar este archivo: `grep -rn "tramite-ola"
# milpa/src/ tests/` -> 0 lineas, contra control positivo `grep -rn
# "tramite.yaml" milpa/src/` -> 3 lineas (emisor.py:18,48,87).
# ADR-68(a) vigente.
# ══════════════════════════════════════════════════════════════════
  # ══════════════════════════════════════════════════════════════════
  # SELLADA · D1-a (mesa, 1/sep/2026) · ACTO MAESTRA34-N1 · SELLA-REGLAS-ACTIVOS-2
  #
  # Cargada VERBATIM a milpa/tramite.yaml, campo por campo, sin
  # reinterpretar. tier propagado a FUERTE (lectura de direccion de D1-a:
  # el motor no tiene el token "tier FUERTE-MEDIDO"; §3.1 y §3.5 de
  # canon/modelo-decision-v4_0.md ya declaran FUERTE para R1.2/R5.1). Esta
  # entrada NO se borra ni se edita: sigue siendo el registro de la
  # propuesta que la carga cita.
  # ══════════════════════════════════════════════════════════════════
  - id: familia.seguro.volatilidad_ausencia_estado
    situacion: PENDIENTE-DE-MESA
    si:
      disparadores: PENDIENTE-DE-MESA  # el SI de §3.5 nombra "hogar con
        # remesas P041" entre sus propios disparadores, y el desenlace que
        # aqui se mide ES recibir remesas: condicionar seria vacuo
        # (p(remesas|remesas)). Se mide la tasa base incondicional sobre el
        # universo completo de hogares y se declara la circularidad, en vez
        # de fabricar un disparador. Los disparadores no circulares que la
        # regla si nombra (`segsoc`=2, `residencia` in {EUA, Otro pais}) NO
        # existen en concentradohogar: exigirian cruzar con el modulo de
        # personas, fuera del perimetro de este lote.
    entonces:
      - {conducta: recibe_remesas, p: 0.045694, clase: "MEDIDO·p(tasa base ponderada)"}
      - {conducta: no_recibe_remesas, p: 0.954306, clase: "MEDIDO·p(tasa base ponderada)"}
    porque: {generador: [G5], mecanismo: PENDIENTE-DE-MESA}
      # generador G5 declarado por el propio §3.5 ("PORQUE G5"); el mecanismo
      # causal no se re-deriva en este acto (fuera de perimetro).
    tier: PENDIENTE-DE-MESA
    falsable_si: PENDIENTE-DE-MESA
    fuente: ["ENIGH2022", "ENIGH2012", "ENIGH2014", "ENIGH2016", "ENIGH2018", "ENIGH2020", "canon/modelo-decision-v4_0.md §3.5"]
    ola_calibracion: "ENIGH 2022 (mas reciente de 6 olas bienales disponibles; las otras 5 van en serie_olas, NO promediadas)"
    ic95: [0.043754, 0.047711]
    n: 90102
    ponderador: factor
    universo: "hogares -- universo completo de concentradohogar (folioviv+foliohog) de ENIGH 2022 Nueva Serie, sin filtro adicional (la regla no declara ninguno). Desenlace recibe_remesas = 1 si concentradohogar.remesas > 0, 0 si = 0. La rama NA de la dicotomizacion NO existe: `remesas` trae cero nulos en las 6 olas (verificado, no supuesto)."
    serie_olas:
      # p por ola, cada una con su propio IC95 de conglomerado. NO se
      # promedian: promediar 6 cortes transversales sin ponderacion entre
      # olas no tiene interpretacion declarada y no se inventa una.
      # OJO: el ponderador CAMBIA DE NOMBRE entre series -- `factor_hog` en
