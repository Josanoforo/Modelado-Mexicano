filtros: "columna elegible_v1_1 == SI"
ponderador: NO-APLICA
transformacion: >-
  seleccion leave-one-out de ola: la mas cercana DISTINTA de la del arbitro,
  empate -> la anterior. NO hay promedio, NO hay ajuste de tendencia, NO hay
  colapso de olas.
estimando: >-
  el punto p ya MEDIDO de la ola LOO, leido verbatim de serie_olas. Esta
  corrida no estima: selecciona una ola por una regla declarada y reporta el
  punto que esa ola ya traia.
dependencias_materiales: []

parametros:
  columna_elegible: elegible_v1_1
  regla_de_seleccion: "min(|ola - ola_arbitro|) con ola != ola_arbitro; empate -> ola menor"
  fuente_acto: "ACTO GEN2-T9 · EL MOTOR ES LA MATRIZ · P3(c)"

seed:
  aplica: false

tolerancia:
  tipo: flotante
  abs: 1.0e-10
  razon: >-
    Seleccionar una ola no es estocastico y el punto se copia verbatim de
    serie_olas. La tolerancia cubre solo el redondeo float64 al serializar.

