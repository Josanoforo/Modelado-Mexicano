variables:
  - {archivo: encig2023_04_sec_7.csv, variable: ID_TRA, rol: llave primaria de union}
  - {archivo: encig2023_04_sec_7.csv, variable: NT_TIPO, rol: multiplicidad de evento; no deduplicar}
  - {archivo: encig2023_04_sec_7.csv, variable: P7_3, rol: descomposicion de canal}
  - {archivo: encig2023_04_sec_7.csv, variable: FAC_TRA, rol: ponderador de evento}
  - {archivo: encig2023_04_sec_7.csv, variable: EST_DIS, rol: estrato de diseno como texto opaco}
  - {archivo: encig2023_04_sec_7.csv, variable: UPM_DIS, rol: conglomerado como texto opaco}
  - {archivo: encig2023_05_sec_8.csv, variable: ID_TRA, rol: llave unica de union}
  - {archivo: encig2023_05_sec_8.csv, variable: P8_4, rol: desenlace binario observado}
  - {archivo: ambos, variable: ID_VIV+ID_PER+ID_TRA+N_TRA, rol: llave de control}
  - {archivo: encig2023_05_sec_8.csv, variable: FAC_P18, rol: columna verificada y no usada}

universo: "PRIMARIO=eventos sec_7 unidos con P8_4 en {0,1} y FAC_TRA finito >0, sin restriccion de P7_3 y sin deduplicar; PREDIG=subconjunto PRE={1} o DIG={3,4,5}"
filtros: "P8_4 blanco queda fuera y nunca equivale a cero; P7_3 se descompone en PRE, DIG, OTRO={2,6,7,8,9}, FALTANTE; soporte fuera de mapa para"
ponderador: "FAC_TRA de encig2023_04_sec_7.csv; FAC_P18 no se usa"
transformacion: "q se cuenta directamente como masa P8_4=0/denominador; IC(q)=[1-IC_hi(p),1-IC_lo(p)]"
estimando: "p=sum(FAC_TRA*I[P8_4=1])/sum(FAC_TRA); q=sum(FAC_TRA*I[P8_4=0])/sum(FAC_TRA), por universo"
dependencias_materiales: [numpy]

parametros:
  blanco_literal: ["", b, NA]
  canal_pre: [1]
  canal_dig: [3, 4, 5]
  canal_otro: [2, 6, 7, 8, 9]
  bootstrap_replicas: 2000
  metodo_ic: bootstrap de UPM_DIS con reemplazo dentro de EST_DIS; cociente completo en cada replica
  tratamiento_upm_unica: se remuestrea a si misma, aporta varianza cero y se reporta; no se rotula automaticamente cota inferior
  consumidores_posibles: [RES-0007, RES-0008]
  consumidores_fuera: [RES-0001, RES-0002]

seed:
  aplica: true
  valor: 20260915
  rng: numpy.PCG64

tolerancia:
  tipo: bootstrap
  exacto_por_seed: true
  abs: 0.0

