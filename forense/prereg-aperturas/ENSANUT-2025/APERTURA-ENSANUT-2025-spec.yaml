universo: 'Personas de ENSANUT 2025: adultos 20+, integrantes (todas las edades), utilizadores, adolescentes 10-19;
  ponde_f > 0 con est_sel y upm no vacíos (prepara() de PISOS-SALUD). Celdas MC2-*: el universo de cada celda del
  medidor sellado de MC2 (integrantes con necesidad de salud en 3 meses; adultos 20+ con diabetes diagnosticada
  y en tratamiento), mismo filtro de diseño'
filtros: 'Un eje a la vez (TOTAL, SEXO, EDAD, ESTRATO, ESCOLARIDAD 20+); nunca cruces (guardia E.6). MC2-*: una
  llamada por celda sellada, agrupada por su indicador de pertenencia; 7 diferencias y 4 duplicados de PISOS-SALUD
  apartados sin abrir'
ponderador: ponde_f
transformacion: Recodificación del contendiente (forense/analisis/salud-bienestar/lista-cerrada-P1.md §2); columna
  ausente o con texto/códigos distintos en el catálogo 2025 -> NO-ESTIMABLE
estimando: R = Σw·y/Σw por celda en ENSANUT 2025; cobertura de R en el IC del contendiente (ICC del piso 2024 de
  PISOS-SALUD; IC95 de diseño 2024 de MC2), una sola primaria sobre todas las celdas
seed:
  aplica: false
  razon: R es un punto; la cobertura usa el IC ya sellado del contendiente
parametros:
  nominal: 0.95
  z: 1.959964
  regla: cobertura R en [lo, hi] del contendiente; Wilson 95%; NO-ESTIMABLE > SUBCUBRE > SOBRECUBRE > CALIBRADO
  columna_ausente_en_catalogo: NO-ESTIMABLE (sin recodificación ad hoc)
tolerancia:
  tipo: flotante
  abs: 1.0e-10
  razon: 'determinista: sumas float64 sin remuestreo'
