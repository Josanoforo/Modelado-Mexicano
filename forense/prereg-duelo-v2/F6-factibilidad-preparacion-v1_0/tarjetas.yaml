schema_version: F6-factibilidad-preparacion-v1_0
estado: PREPARADA-PARA-MESA · NO AUTORIZA EMISIONES NI R
llamadas_autorizadas: false
base_repo: 9dffd6455c67e2ca99740e79f90be59a13f250e1
lista_cerrada:
  familias: [R01-CIV-MOCIBA-DENUNCIA, R09-FAM-ISSP-APOYO-DINERO]
  maximo_familias: 2
  maximo_celdas: 4
  sustituciones_permitidas: false
firma:
  estado: PENDIENTE-DE-MESA
  alcance: >-
    La firma posterior debe nombrar tarjetas, snapshot M, modelo/versión,
    cliente, presupuesto y autorización de llamadas. Este archivo no la suple.
identidad_ejecucion:
  snapshot_M:
    ruta: milpa/tramite.yaml
    sha256: f6c0082b2717b4a88fdcc1234f19764f3551f491adf56418c528b5d5e1f5051b
    estado: CONGELADO-PARA-PREFLIGHT-NO-PARA-EMISION
  proveedor: POR-FIRMAR
  modelo_version: POR-FIRMAR
  endpoint: POR-FIRMAR
  cliente_version: POR-FIRMAR
  cuenta_proyecto_sin_secretos: POR-FIRMAR
  mensajes_y_plantilla_sha256: POR-FIRMAR
  herramientas_habilitadas: POR-FIRMAR
  temperatura_top_p_seed: POR-FIRMAR
  ventana_y_limite_salida: POR-FIRMAR
  politica_truncacion: POR-FIRMAR
  orden_posiciones: POR-FIRMAR
  ventana_horaria: POR-FIRMAR
  parser: POR-FIRMAR
dieta:
  M:
    permitido:
      - tarjeta de la celda sin valor R
      - snapshot M preexistente con hash
      - semántica preexistente de la regla consumidora
    prohibido:
      - microdatos y resultados R de MOCIBA o ZA6980
      - frecuencias, marginales o tabulados del desenlace
      - transformaciones elegidas después de R
      - MOCIBA 2024/2025 e ISSP ZA5900 u otros módulos reservados
  L_SOLO:
    replicas_por_celda: 8
    permitido:
      - tarjeta textual cerrada de la celda
      - definición de escala y formato de respuesta
    prohibido:
      - corpus del proyecto
      - M, R, derivados de R o archivos fuente del objetivo
      - materiales de otras celdas
  L_CORPUS:
    incluido: false
    razon: No se agrega por inercia en esta factibilidad.
  B:
    rol: REFERENCIA-ADICIONAL-SOLO-SI-CONSTRUIBLE-ANTES-DE-R
    estado: NO-CONSTRUIBLE-EN-LISTA-ACTUAL
    razon: >-
      No hay baseline temporal independiente predeclarado. Abrir un R para
      construir B contaminaría las emisiones afectadas; no se hace.
orden_posterior:
  - congelar spec, tarjetas, snapshot, identidad y orden
  - obtener firma explícita de mesa y autorización de llamadas
  - sellar emisiones M y L_SOLO; B sólo si ya era construible sin R
  - verificar commits y timestamps de emisiones anteriores a toda apertura R
  - abrir R y estimar únicamente las celdas autorizadas
  - comparar errores pareados y cobertura; publicar abstenciones
parada:
  - lista cerrada completada
  - identidad o contrato roto
  - exposición del objetivo
  - dependencia de R para construir una emisión o baseline
  - dos fallos técnicos sistémicos consecutivos en una ejecución autorizada
  - nunca por resultado favorable, significación o cruce de umbral
presupuesto:
  estado: PROPUESTO-NO-AUTORIZADO
  nominal_antes_de_gates:
    familias: 2
    celdas: 4
    posiciones_logicas_L_SOLO: 32
    emisiones_M: 4
    estimaciones_R: 4
    B: 0
  viable_con_tarjetas_actuales:
    familias: 0
    celdas: 0
    posiciones_logicas_L_SOLO: 0
    emisiones_M: 0
    estimaciones_R: 0
    B: 0
    intentos_maximos: 0
    turnos: 0
    unidades_facturadas: 0
  si_mesa_habilita_una_celda_en_spec_sucesora:
    posiciones_logicas_L_SOLO_por_celda: 8
    reintentos_tecnicos_maximos_por_posicion: 2
    intentos_maximos_por_celda: 24
    turnos_y_unidades_facturadas: MEDIR-CON-CLIENTE-FIRMADO
  coste_monetario: PENDIENTE-DE-MODELO-TARIFA-Y-CONTEO-VERIFICABLE
  llamadas_para_estimar_presupuesto: 0
