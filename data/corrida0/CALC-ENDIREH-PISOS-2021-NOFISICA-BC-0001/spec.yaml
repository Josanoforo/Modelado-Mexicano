  diseno.
filtros: 14.1 y 14.3 1-3/4; C1 sin 23AB/24AB/35AB-38AB; ayuda y denuncia 1/2; razones 1/0.
ponderador: FAC_MUJ positivo sin normalizar
transformacion: Union por acto y ventana; razones/instituciones multiples separadas.
estimando: Prevalencia descriptiva de pareja no fisica y ayuda/denuncia B/C; no suma de ambitos.
