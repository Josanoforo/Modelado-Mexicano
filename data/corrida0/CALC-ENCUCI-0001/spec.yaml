  spec_sellada: forense/prereg-caja/ENCUCI-MORDIDA-PROTESTA-spec-v1_0.md
  spec_sellada_sha256: 33add37841455a9da6402e2dce8c7edaaa33e8ecc9a94c3c5a9d44b10961a919
  demanda_que_releva: "CORR-0003 (ENCUCI2020) -> los 4 RESULT: RES-0005/RES-0006 (familia A, tramite.mordida.discrecional) y RES-0061/RES-0062 (familia B, civico.protesta.agravio_urbano_encuci2020). Son DOS constructos, no uno: el encargo nombra solo la mordida y la plaza trae ademas la protesta. NO releva CORR-0001 (ENCIG2023, sin payload) ni las cuatro corridas R de ENCUCI (CORR-0064..0067)."
  reglas_bajo_prueba: "NINGUNA cambia de cifra por esta corrida. tramite.mordida.discrecional (enmienda_encuci2020, FP-200=b) y civico.protesta.agravio_urbano_encuci2020 (R7.4, SELLADA) ya estan MEDIDAS en milpa/tramite.yaml. Este CALC monta la cadena E.2 sobre esas cantidades; la adopcion de P3 es CITA, no cambio de cifra, y su rama la deciden los RESULT *-ADOPCION-P3*."
  firma_de_contador: "FIRMA DE MESA 9/sep/2026 con OBJETO explicito, verbatim en el encargo archivado (forense/encargos/2026-09-09-GEN2-LOTE-ENCUCI-1.md): «cuenta_gen2 = SI para el CALC que este acto selle». Estandar FP-367/368 satisfecho (autoridad + fecha + OBJETO). El merge de mesa la perfecciona."
  contaminacion_declarada: "ADR-46 -- al congelar, la sesion YA habia leido (a) los cuatro valores GEN1 (0.125822 / 0.874178 / 0.112192 / 0.091912) en el encargo, en demanda-resultados.tsv y en milpa/tramite.yaml; (b) LA CODIFICACION GEN1 COMPLETA de la familia A en el bloque enmienda_encuci2020 (desenlace 'AP5_17|AP5_18', ponderador FAC_SEL, universo 'SEC_4_5 con contacto declarado AP5_16_1..10>=1', n=13435, ic95 [0.116323, 0.135544]); (c) la de la familia B en la regla civico.protesta.agravio_urbano_encuci2020 (AP7_3_5==1 x DOMINIO agrupado x AP4_3_2, universo 20187 de 21519, y los dos contrastes con sus IC); (d) las anotaciones SEMANTICA (D4, NC-0113) y DERIVADO-NO-MEDIDO (D1, NC-0108) de ACTO GEN2-MOTOR-SEMANTICA. Por eso las PRIMARIAS de esta spec NO son las de GEN1: en A la primaria es A-P-ENTREGA (AP5_18 solo, el unico reactivo que mide entrega y el que corresponde al nombre paga_mordida) y la celda GEN1 se mide como A-P-CUALQUIERA, unica adoptable; en B las primarias son las CUATRO celdas del eje, no solo las dos con agravio. Lo genuinamente desconocido al congelar: el peso de 9/blanco en cada reactivo, la separacion entre solicitud y entrega (nadie ha publicado A-P-ENTREGA), la prevalencia sobre la poblacion completa y no sobre el recorte de contacto, el reparto de DOMINIO entre sus TRES valores y el efecto de asignar 'C', el perfil de las llaves opacas, y si los tipos del header del DBF coinciden con los del descriptor -- ninguno aparece en fuente alguna leida."
  medidor_ejecutado_al_congelar: "NO -- escrito y congelado en el COMMIT-1, corrido en el COMMIT-2 del mismo acto"

