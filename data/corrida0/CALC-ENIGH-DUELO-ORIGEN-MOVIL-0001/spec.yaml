  contaminacion_declarada: "Se conocia la serie completa de remesas>0 (CALC-B-0001, sellado antes de este acto, no ciego -- E.6/ADR-46 heredado, ver DISENO-duelo-prospectivo-ENIGH2024-v1_0.md §8); no se conocia ningun resultado de esta validacion retrospectiva ni de ENIGH 2024 al congelar. Cero microdato de ENIGH 2024."

