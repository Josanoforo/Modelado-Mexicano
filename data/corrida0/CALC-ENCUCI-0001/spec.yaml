# CALC-ENCUCI-0001 -- cara mecanica de spec.md (ACTO GEN2-LOTE-ENCUCI-1).
# Gobierna spec.md y, sobre el, la spec SELLADA
# forense/prereg-caja/ENCUCI-MORDIDA-PROTESTA-spec-v1_0.md
# (`prereg-caja-ENCUCI-MORDIDA-PROTESTA`).
# Releva la demanda CORR-0003 (4 RESULT: RES-0005/0006/0061/0062) bajo GEN2.
# CONGELADO en el COMMIT-1, antes de leer un solo REGISTRO de un .dbf.
