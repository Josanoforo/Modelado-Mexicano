seed:
  aplica: true
  valor: 20260914
  rng: numpy.PCG64
  nota: La semilla solo gobierna el bootstrap de UPM (A y B). El punto, la Taylor y todos los conteos son deterministas. Misma semilla que CALC-EDER-0001.

tolerancia:
  tipo: flotante
  abs: 1.0e-10
  razon: 'Punto y Taylor deterministas; bootstrap fijado por seed y rng; sumas en orden fijo. Enteros y textos se comparan EXACTO. NO se afloja para que el control contra C1 pase: si no reproduce, eso es el hallazgo.'

