  cuenta_gen2: SI
  validacion_independiente: ADJUDICACION-PRE-REGISTRADA-ANTES-DEL-DATO (spec §5) + RECETA-DEL-ARBITRO-REPRODUCIDA-A-5e-7-EN-COMMIT-2
  fuente_acto: GEN2-CELDA-D-PILOTO-2 v1.1 (relanzamiento)
  celda_d: TRA.evade_norma.envipe2025.escolaridad_x_dominio
