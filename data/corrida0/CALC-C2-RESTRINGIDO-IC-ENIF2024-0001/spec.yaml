universo: 'T = personas elegidas 18+ de TMODULO.csv (universo de carga() del arbitro: todas las filas;
  PARA si EDAD_V no numerica o < 18, FAC_PER no positivo, o las 15 variables de la seccion 5 en blanco)
  con P3_13 en {1..7}. P3_13 == 9 (no sabe) o blanco por secuencia: fuera de T, contados. Ninguna fila
  se quita del marco de diseno: fuera de T, todo eje vale (fuera).'
filtros: Solo el de T, aplicado una vez en la construccion de la ola e identico para todos los ejes. Una
  celda es {eje == categoria} dentro de T sobre la columna que el arbitro derivo; nunca se combinan dos
  ejes (guardia en codigo, R3/R4).
ponderador: FAC_PER. Toda proporcion es razon de totales ponderados sum(w*y)/sum(w), en el punto y en
  cada replica.
transformacion: 'Ejes por Eje.deriva del arbitro, restringidos a T. D9 := alguna P5_1_1..6 == ''1'' AND
  ninguna P5_6_1..9 == ''1'' (desenlaces() del arbitro). Plan de replicas = el de _estimate del piso (CALC-PISOS-ENIF2021-EJES-0003/medidor.py:57-95):
  llaves EST\tUPM ordenadas, estratos ordenados, PCG64(42), bloques de 50, integers(0, n_h, (bloque, n_h))
  por estrato. C2R := piso_log_aditivo(p_T(a), p_T(b), p_T) con formalidad citada del arbitro GEN2; C2R_k
  replica a replica; valida <=> los tres en (0,1); IC95 = percentiles 2.5/97.5 si validas >= umbral.'
estimando: Piso C2 restringido al universo T (proporcion de personas de T) por celda de los 5 pares con
  formalidad del lote ENIF 2024, bajo ausencia de interaccion en escala logit, con IC95 que mide ruido
  muestral y no el error del supuesto. No es la conjunta, no es un efecto, no adopta; no se compara contra
  el universo poblacional. Estado EMITIDA-SIN-EVALUAR.
precision: IC95 por replica (10 000, PCG64(42), plan del arbitro GEN2) de cada marginal dentro de T y
  de C2R replica a replica. Cubre ruido muestral; no cubre error de especificacion.
dependencias_materiales:
- numpy
- pandas
- yaml
seed:
  aplica: true
  valor: 42
  rng: numpy.random.PCG64 (plan de replicas del piso, bloques de 50)
tolerancia:
  tipo: bootstrap
  exacto_por_seed: true
  abs: 1.0e-10
  razon: seed 42 + orden de consumo fijado (plan del piso). Enteros EXACTO; flotantes abs = 1e-10.
parametros:
  pregunta_consumidora: Que piso tienen los 5 pares formalidad x eje del lote ENIF 2024 cuando los tres
    marginales de la composicion viven en el mismo universo T de quien trabaja?
  desenlace: ahorra_solo_informal
  universo_t: P3_13 en {1,2,3,4,5,6,7}; 9 y blanco fuera
  bootstrap_replicas: 10000
  replicas_bloque: 50
  umbral_replicas_validas: 9900
  control_arbitro_tol_p: 1.0e-12
  control_arbitro_tol_ic: 1.0e-12
  control_arbitro_tol_den_w: 1.0e-06
  control_arbitro_ids:
    filas_universo: RESULT-ARBITRO-ENIF2024-G-FILAS-PERSONAS
    fuera_t: RESULT-ARBITRO-ENIF2024-G-EJE-FORMALIDAD-FUERA
  control_ramas: REPRODUCE -> IC publicados; NO-REPRODUCE -> todos los IC null, IC-ESTADO=IC-NO-PUBLICADO:CONTROL-ARBITRO-NO-REPRODUCE,
    G-IC-PUBLICADO=NO; se sella igual y no se ajusta nada
  c2_forma: 'log-aditiva en T: expit(logit p_T(a) + logit p_T(b) - logit p_T)'
  c2_funcion_de_referencia: tests/test_celda_d_c2.py::piso_log_aditivo (importada)
  c2_rotulo_supuesto: ausencia de interaccion en escala logit
  c2_rotulo_prohibido: independencia
  c2_rechazo: 'replica con algun marginal en {0,1} o sin denominador: EXCLUIDA y contada; punto SIN-DEFINIR
    -> IC-NO-CONSTRUIBLE:PUNTO-SIN-DEFINIR'
  degeneracion_cuenta_formalxformalidad: no colineales por texto (P3_13 derecho a servicios medicos por
    el trabajo; P5_4 tenencia de cuenta formal). Degenerado <=> algun marginal del par en {0,1} o una
    categoria sin filas en T -> celdas NO-CONSTRUIBLE, pregunta a mesa
  tipo_incertidumbre: IC95-BOOTSTRAP-REPLICA-POR-REPLICA-MARGINALES-COMPARTIDOS-UNIVERSO-T
  percentiles:
  - 2.5
  - 97.5
  adopcion: NINGUNA
  marcador_actualizado: 'NO'
