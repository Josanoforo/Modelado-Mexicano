# CALC-0003 -- cara mecanica de spec.md (ACTO GEN2-E5-0 · SPECS EJECUTABLES).
# Gobierna spec.md y, sobre el, la spec SELLADA
# forense/prereg-caja/S6-L16-spec-v1_2.md. CONGELADO en el COMMIT-1 de
# GEN2-E5-0; lo corre GEN2-E5. AQUI NO SE ABRE MICRODATO NI SE CALCULA.
#
# 🛑 Discrepancia con la spec sellada, DECLARADA y no absorbida (spec.md §1):
# S6 v1.2 §1 escribe «T1 = 0 si es09 == 0». El manual de codificacion
# (ehh02cb_b3b.pdf pag. 8 / ehh02cb_bx.pdf pag. 49) dice que «No» es el codigo
# 3 y que el 0 NO EXISTE. Se congela `no: 3`. Con el 0 las seis filas habrian
# salido degeneradas en silencio.
calc_id: CALC-0003
spec_md: spec.md
spec_md_sha256: 2ed3fc02ba1b8386ee567e4952122d018d2a789e5fcb64641fed63ae5d5e3b35

script: data/corrida0/CALC-0003/medidor.py

etiquetas:
  generacion: GEN2
  tipo: FALSADOR-S6-L16-ENNVIH2002-RAMA-A-PRIMA
  cuenta_gen2: PENDIENTE-DE-MESA
  validacion_independiente: NO-HECHA
  spec_sellada: forense/prereg-caja/S6-L16-spec-v1_2.md
  spec_sellada_sha256: c1cd3b6367d4edc4d38401e19752adb9656d238a81ae6cff9db11dacaf73da1c
  reglas_bajo_prueba: "R4.4 / salud.atencion.grave (NO se mueve por este CALC)"
  medidor_ejecutado_en_e5_0: "NO -- escrito y congelado, nunca corrido"

inputs:
  - id: ennvih1_2002_hogar_dta
    origen: manifiesto
  - id: ennvih1_2002_ponderador
    origen: manifiesto
  - id: IN-S6-SPEC-SELLADA
    origen: repo
    ruta: forense/prereg-caja/S6-L16-spec-v1_2.md
    sha256: c1cd3b6367d4edc4d38401e19752adb9656d238a81ae6cff9db11dacaf73da1c

variables:
  - {id: es09,    rol: "T1 -- disparador «grave»", codigos: "1=Si · 3=No · 8=NS (solo bx). NO existe 0", ventana: "a lo largo de su vida (cuestionario pag. 5)", fuente_codigos: "ehh02cb_b3b.pdf pag. 8 · ehh02cb_bx.pdf pag. 49"}
  - {id: "ec01a..ec01g,ec01h_1,ec01i_1", rol: "T2 -- disparador «cronico»", codigos: "1=Si", ventana: "alguna vez (cuestionario pag. 10)", fuente_codigos: "ehh02cb_b3b.pdf pag. 18", nota: "T2 no tiene brazo bx: p_ec.dta no existe"}
  - {id: hs01,    rol: "D-HS -- desenlace primario", codigos: "1=Si · 3=No · 8=NS (solo bx)", ventana: "ultimos 12 meses (cuestionario pag. 18)", fuente_codigos: "ehh02cb_b3b.pdf pag. 28 · ehh02cb_bx.pdf pag. 60"}
  - {id: ce01,    rol: "D-CE -- desenlace secundario", codigos: "1=Si · 3=No · 8=NS (solo bx)", ventana: "ultimas 4 semanas (cuestionario pag. 12)", fuente_codigos: "ehh02cb_b3b.pdf pag. 21 · ehh02cb_bx.pdf pag. 56"}
  - {id: "hs08_1a, hs08_1e", rol: "filtro de motivo (ENFERMEDAD / OPERACION), nivel episodio", codigos: "1=Si", nota: "solo b3b -- no hay p_hs1.dta"}
  - {id: "hs02* (Tabla A/B), ce04* (Tabla C)", rol: "bateria de institucion, respuesta multiple", nota: "clasificada por variable_id, NUNCA por etiqueta (S6 §0.4); 0 desajustes contra el .dta"}
  - {id: fac_3b,     rol: "ponderador brazo b3b",  etiqueta: "FACTOR DE EXPANSION LIBRO 3B"}
  - {id: fac_3b_px,  rol: "ponderador brazo bx (pareja)", etiqueta: "FACTOR DE EXPANSION LIBRO PROXY"}
  - {id: fac_3a_px,  rol: "ponderador brazo bx (pareja)", etiqueta: "FACTOR DE EXPANSION LIBRO PROXY -- IDENTICA a la de fac_3b_px: la etiqueta NO distingue"}
  - {id: fac_4_px,   rol: "NO ENTRA (S6 §3.2 punto 4)"}
  - {id: estrato,    rol: "estrato del bootstrap", archivo: "ehh02dta_bc/c_portad.dta"}
  - {id: "loc, id_loc", rol: "NO SE USA -- localidad SI existe en c_portad (corrige S6 §3.5), pero el diseno pre-registrado es hogar dentro de estrato y no se re-pre-registra aqui"}
  - {id: "folio, ls", rol: "llaves", nota: "NUMERICO en los ocho .dta y en c_portad; CADENA (%8s) en los DOS de ponderador -- el join en riesgo es microdato x ponderador"}

universo: >-
  Personas del Libro IIIB (brazo b3b, adultos presentes) y del Libro Proxy
  (brazo bx, miembros ausentes) de ENNViH-1 2002, NUNCA agrupadas. D-HS:
  hs01=1 y (solo b3b) >=1 episodio con hs08_1a o hs08_1e. D-CE: ce01=1.

filtros: >-
  T1: es09 en {1,3} (8=NS y faltante fuera de los dos grupos). T2: al menos una
  de las nueve ec01* = 1. D-HS b3b: filtro de motivo por episodio, agregado a
  persona. D-HS bx: SIN filtro de motivo -- no existe p_hs1.dta; asimetria
  declarada en spec.md §5 y rotulada en RESULT-C1-BX-FILTRO.

ponderador: >-
  b3b: fac_3b. bx: PAREJA fac_3b_px y fac_3a_px, las dos corridas y las dos
  reportadas; el veredicto del brazo bx solo cuenta si coinciden en signo
  (S6 §3.2), y si discrepan la fila sale NO-ESTIMABLE-PONDERADOR-INDETERMINADO.
  fac_4_px no entra.

transformacion: >-
  LUGAR de cuatro niveles mutuamente excluyentes (SOLO-PUBLICO / SOLO-PRIVADO /
  AMBOS / SOLO-OTRO) desde la bateria de respuesta multiple, por variable_id.
  P_PUB = SOLO-PUBLICO / (SOLO-PUBLICO + SOLO-PRIVADO), ponderada; AMBOS y
  SOLO-OTRO fuera del cociente y CONTADOS. Sensibilidad de S6 §2.4: el mismo
  Delta contando AMBOS como publico; la celda solo vale si base y sensibilidad
  coinciden en signo.

estimando: >-
  Delta = P_PUB(T=1) - P_PUB(T=0) con IC95, por celda y por brazo. Seis filas
  (C1 b3b/bx, C2 b3b/bx, C3 b3b, C4 b3b), jamas agrupadas ni promediadas.
  C1/b3b es la fila que decide el veredicto de la regla (S6 §2.5).

dependencias_materiales: [pyreadstat, numpy, pandas, zipfile_deflate64]

