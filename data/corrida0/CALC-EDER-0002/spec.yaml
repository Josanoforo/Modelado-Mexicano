  - {archivo: "persona.csv", variable: parentesco, rol: "UNIVERSO (ego con 1 o 2) y DESENLACE (otros integrantes del hogar con 6 o 7, invertidos si ego = 2) -- pregunta B5 del cuestionario basico, relativa al JEFE del hogar", codigos: "1=Jefe(a) 2=Esposa(o)/companera(o) 3=Hija(o) 4=Nieta(o) 5=Nuera o yerno 6=Madre o padre 7=Suegra(o) 8=Otro 9=Sin parentesco (eder2017_fd.pdf #8, p.37); se lee como texto strip", direccion: "d = 1 si existe otro integrante del hogar con el codigo que, traducido segun la posicion del ego, es su ascendiente o su suegro. MAS ALTO = MAS CORRESIDENCIA ACTUAL."}
  - {archivo: "historiavida.csv", variable: folioviv, rol: "llave (1/3) del universo respondiente EDER -- solo se leen las tres columnas de llave", codigos: "entero de 10 digitos"}
  - {archivo: "historiavida.csv", variable: foliohog, rol: "llave (2/3)", codigos: "1..5"}
  - {archivo: "historiavida.csv", variable: id_pobla, rol: "llave (3/3)", codigos: "entero"}
  - {archivo: "antecedentes.csv", variable: folioviv, rol: "llave (1/3) para la sensibilidad B", codigos: "entero de 10 digitos"}
  - {archivo: "antecedentes.csv", variable: foliohog, rol: "llave (2/3), B", codigos: "1..5"}
  - {archivo: "antecedentes.csv", variable: id_pobla, rol: "llave (3/3), B", codigos: "entero"}
  - {archivo: "antecedentes.csv", variable: factor_per, rol: "PONDERADOR de la sensibilidad B -- FD #52, ponderador oficial de las personas de 20-54 (FD §1.1.3, receta R weights=~factor_per); la reserva que C1 declaro y no ejecuto", codigos: "flotante tal cual; 0 = fuera de la poblacion objetivo"}

universo: >-
  EDER 2017 (INEGI), UNA sola ola. U_A (sucesor, identico al de C1): ego =
  filas de persona.csv cuya terna (folioviv, foliohog, id_pobla) esta en
  historiavida.csv (respondientes EDER, 20-54) y cuyo parentesco propio es '1'
  (Jefe) o '2' (Conyuge), en vivienda (join por folioviv) con tipo_adqui no
  nulo y no blanco y factor finito > 0. U_B (sensibilidad de ponderador): U_A
  con factor_per de antecedentes.csv (join por la terna) finito y > 0.

filtros: >-
  Sale de U_A, CONTADO y no imputado: vivienda con tipo_adqui nulo/blanco
  (A-N-VIVIENDAS-EXCLUIDAS-TIPO-ADQUI-BLANCO) y ego sin ponderador
  (A-N-SIN-PONDERADOR). Sale de U_B, contado: ego sin fila en antecedentes.csv
  (B-N-SIN-FACTOR-PER), con factor_per = 0 (B-N-FACTOR-PER-CERO) o no
  finito/negativo (B-N-FACTOR-PER-INVALIDO). Se cuenta pero NO sale del punto:
  ego sin est_dis o sin upm (*-N-SIN-DISENO). parentesco fuera de catalogo se
  cuenta (G-N-PARENTESCO-FUERA-DE-CATALOGO) y no se imputa. CERO NUNCA
  SUSTITUYE FALTA DE DATO. Miembro o columna ausente -> NO-ESTIMABLE-*;
  folioviv no unico en vivienda.csv o terna no unica en persona.csv ->
  NO-ESTIMABLE-LLAVE-NO-UNICA (A y B); terna no unica en antecedentes.csv ->
  solo B; universo vacio -> NO-ESTIMABLE-UNIVERSO-VACIO. El embudo de C1 es
  guardia con valor esperado (A-EMBUDO-C1): si discuerda se reporta, nunca se
  ajusta.

ponderador: >-
  A: factor (vivienda.csv), el que C1 uso -- por E.3 el sucesor conserva el
  estimando. B: factor_per (antecedentes.csv), ponderador oficial de persona
  de EDER 2017. Ambos flotante tal cual, sin normalizar.

transformacion: >-
  Lectura con pandas.read_csv(encoding='latin-1', low_memory=False) como C1;
  est_dis, upm y parentesco con dtype=str y strip. ids_eder = ternas de
  historiavida.csv como texto strip. Por hogar (folioviv, foliohog), sobre el
  roster COMPLETO de persona.csv: hay6 = algun parentesco == '6'; hay7 = algun
  parentesco == '7'. Ego jefe: d = 1 si hay6 (ascendiente) o hay7 (suegro).
  Ego conyuge: d = 1 si hay7 (ascendiente, invertido) o hay6 (suegro,
  invertido). p(U) = suma(w*d)/suma(w). Complemento contado directamente.
  Bootstrap: clave (est_dis, upm); upm con reemplazo dentro de est_dis, mismo
  numero de UPM por estrato; estrato con UPM unica se re-muestrea a si mismo.
  Taylor con aproximacion declarada de survey.lonely.psu='adjust'; IC = p +/-
  1.959964 EE. NO se promedia, no se imputa, no se re-escala, no se extrapola.

estimando: >-
  DESCRIPTIVO. (1) SUCESOR (adoptable por mesa): A-P con A-IC-LO/A-IC-HI de
  diseno. (2) SECUNDARIOS DECLARADOS: A-P-COMPLEMENTO, la Taylor de cotejo,
  toda la familia B (sensibilidad factor_per, NO adoptable como sucesor porque
  cambia el estimando), perfiles y embudo. NINGUN RESULT ES CAUSAL. El IC de
  C1 NO se compara con ninguno de esta corrida (A-bis.3). No existe clausula
  se_mueve_si escrita por mesa para esta regla: no se emite ninguna.

dependencias_materiales: [numpy, pandas]

parametros:
  fuente_acto: "ACTO GEN2-LOTE-MEDICION-PENDIENTE-1 · P1 (NC-0184) · CALC-EDER-0002 · sucesor con diseno de familia.corresidencia.adulto_familiar_actual"
  firma_que_lo_autoriza: "NINGUNA firma de mesa viaja en el encargo (brief de despacho, ver etiquetas.firma_de_contador). El acto ejecuta la fila NC-0184 tal como la dejo GEN2-DISENO-FASE1-CIERRE (PR #760); el contador queda PENDIENTE-DE-MESA."
  bootstrap_replicas: 2000
  z_95: 1.959964
  umbral_replica_gen1: 1.0e-6
  grano_milpa_decimales: 6
  metodo_ic: "bootstrap de upm CON REEMPLAZO dentro de est_dis, conservando el numero de UPM por estrato; percentiles 2.5/97.5. Taylor de cotejo con aproximacion declarada de lonely.psu=adjust, secundaria. Identico a CALC-EDER-0001."
  regla_estrato_upm_unica: >-
    Un estrato con exactamente una UPM se re-muestrea a si mismo: aporta
    varianza cero. NO se colapsa y NO se descarta. Si el conteo es > 0,
    METODO-IC sale IC-CON-ESTRATOS-DE-UPM-UNICA y el IC se lee como LIMITE
    INFERIOR de la anchura verdadera.
  llaves_opacas: >-
    est_dis y upm se agrupan como CADENA CRUDA (dtype=str). Nunca int() ni
    zfill(). El perfil observado de anchos se emite como RESULT.
  tablas:
    vivienda: "vivienda.csv"
    persona: "persona.csv"
    historiavida: "historiavida.csv"
    antecedentes: "antecedentes.csv"
  miembros_zip_declarados: ["persona.csv", "vivienda.csv", "antecedentes.csv", "historiavida.csv", "hogar.csv"]
  codificacion:
    jefe: "1"
    conyuge: "2"
    ascendiente: "6"
    suegro: "7"
    catalogo_parentesco: ["1", "2", "3", "4", "5", "6", "7", "8", "9"]
    llave_persona: [folioviv, foliohog, id_pobla]
    llave_hogar: [folioviv, foliohog]
    llave_vivienda: folioviv
  valores_gen1_referencia:
    A_P: 0.057531
    N_U: 9397
  embudo_c1_esperado:
    n_filas_persona: 94101
    n_personas_historiavida: 23831
    n_ego_jefe_o_conyuge: 16687
    n_u: 9397
  criterio_adopcion: >-
    El unico consumidor (milpa/tramite-ola5-propuesta-v0.yaml:192,
    SELLADA-SIN-CARGA) no tiene cita GEN2 vigente. A-ADOPCION =
    LISTADO-PARA-MESA-REPRODUCE si A-REPRODUCE-GEN1 = REPRODUCE y round(A-P, 6)
    == 0.057531; LISTADO-PARA-MESA-NO-REPRODUCE en otro caso estimable;
    NO-ADOPTABLE-NO-ESTIMABLE si no hay punto. Este acto NO escribe en milpa/.
