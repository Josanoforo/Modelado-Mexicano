  - {id: RESULT-ENUT-C-DELTA-CON-CP-VS-SIN-CP, tipo: flotante, unidad: "A-R menos C-P-SIN-CP, CON SIGNO: lo que vale la eleccion de cuidado pasivo", permite_no_estimable: true}
