    en un archivo de diseño separado. El peso cambia según la unidad de análisis de la tabla:
    `FAC_ELE` (persona 18+, en `TPer_Vic1`/`TPer_Vic2`), `FAC_HOG` (hogar, para ítems de robo
    de vehículo/vivienda), `FAC_DEL` (delito-tipo, en `TMod_Vic`, verificado contra `fd_envipe2025.pdf`
    p.2: "el cuarto expande cada delito captado en el módulo sobre victimización"). El estrato
    y la UPM de diseño (`EST_DIS`, `UPM_DIS`) son comunes a las tablas relacionadas por la llave
