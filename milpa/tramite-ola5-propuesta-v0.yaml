# ACTO MAESTRA34-L1 · MORDIDA-SERIE · 1/sep/2026
#
# Firmas de mesa (verbatim, mensaje único, 1/sep/2026): «D1 - a, D2-b,
# D3-a, D4-a, D5-b si ya dio frutos se mantiene.» D2-b autoriza P1+P2+P3
# completos; D3-a autoriza P4 (más abajo, en su propio bloque).
#
# P1 · CALIBRACIÓN ENCIG 2025 + P2 · SERIE HISTÓRICA 2011/2015/2019/2023.
# Hallazgo ADR-270 (1/sep) citaba R=0.045–0.077 con solo TRA-M-03/05/07
# (2013/2017/2021, ya públicas). Este acto añade 5 olas nuevas —
# codificacion-R-v1_0.tsv filas TRA-M-08 (2011) .. TRA-M-12 (2025),
# calibración, no celda del marco— y la serie queda COMPLETA en 8 olas:
#
#   2011: 6.83%  2013: 4.45%  2015: 4.77%  2017: 7.70%
#   2019: 8.45%  2021: 7.18%  2023: 7.29%  2025: 8.51%
#
# Rango actualizado 4.45%–8.51% (antes 4.45%–7.70% con solo 3 olas). Las
# 8 confirman lo mismo que ADR-270 ya establecía con 3: el 0.62 ASIGNADO
# de milpa/tramite.yaml:40-50 (`paga_mordida`) no tiene apoyo empírico de
# escala en NINGUNA de las 15 años de la serie ENCIG.
