universo: 'Identico al de las emisiones (DIN-ahorro-solo-informal-lxe8-spec-v1_2 §3.1): personas elegidas de 18
  anos y mas de TMODULO ENIF 2024 con 18 <= edad_v <= 97 (sin 98/99), tloc en {1,2,3,4}, fac_per > 0; los siete
  grupos comparten ese universo.'
filtros: Los tres de las emisiones, en el mismo orden, ejecutados desde sus bytes (_universo).
ponderador: fac_per
transformacion: D9 = alguna via informal (p5_1_1..6 = 1) y ninguna de las nueve formales (p5_6_1..9 = 1). L1 = tloc
  {3,4}; L2 = tloc {1,2}; E1..E4 = 18-29/30-44/45-59/60-97; NAC = todos.
estimando: C2(l,e) = expit(logit p24(l) + logit p24(e) - logit p24) en las 8 celdas localidad x edad; marginales
  de un eje de ENIF 2024; IC 2.5/97.5 de la composicion replica a replica.
