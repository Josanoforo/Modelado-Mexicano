# CALC-C0D-MARCADOR-v2 -- cara mecanica de spec.md (ACTO GEN2-C0-D · EL MARCADOR).
# Gobierna spec.md y, sobre el, la spec SELLADA
# forense/prereg-caja/C0D-MARCADOR-spec-v1_0.md (`prereg-caja-C0D-MARCADOR`).
# La pareada L_SOLO <-> L_CORPUS sobre las 14 celdas de marco-M-sorteado-v1_3.tsv.
# NINGUNA cifra suya entra a un veredicto de regla (T9).
# CONGELADO en el COMMIT-1 de GEN2-C0-D, antes de calcular una sola cifra.
calc_id: CALC-C0D-MARCADOR-v2
repite_de: CALC-C0D-MARCADOR
spec_md: spec.md
spec_md_sha256: 66330ddb92b80c4305c7b5586d814f4e51b4548f2d8c10ec8753153c6f767caa

script: data/corrida0/CALC-C0D-MARCADOR-v2/medidor.py

etiquetas:
  generacion: GEN2
  tipo: MARCADOR-PAREADO-DUELO
  cuenta_gen2: PENDIENTE-DE-MESA
  validacion_independiente: NO-HECHA
  spec_sellada: forense/prereg-caja/C0D-MARCADOR-spec-v1_1.md
  spec_sellada_sha256: 604008c7ae0d5f82e12bb8aacee39f73ae676c794d9c067de73b0e56ae3f40cd
  reglas_bajo_prueba: "NINGUNA. T9, verbatim: ninguna cifra de este marcador entra a un veredicto de regla. No mueve ningun tier, ningun p, ninguna banda z del duelo."
  contaminacion_declarada: "ADR-46 -- al congelar esta spec la sesion YA conocia, por el encargo de dirección, las tres cifras marginales D4 del 8/sep (L_CORPUS 19.60 · L_SOLO 11.69 · M 4.51). NO conocia ninguna cifra pareada, ningun d_i, ningun n de universo comun ni ningun err_pp por celda: la pareada L_SOLO<->L_CORPUS no existe en el arbol (§0.1 de la sellada). La sesion leyo ADEMAS, antes de congelar: la ESTRUCTURA del universo (14 celdas, encuesta/ola/conducta/escala/grado_DD), el CONTEO de capturas por brazo (8+8 en las 14; 15 celdas de piloto sin brazo L+corpus), los METADATOS de captura (modelo, temperatura, k, fecha_congelacion, timestamps), los IDs de RESULT de CALC-B-0001 y el CODIGO de agregado_v1_1/v1_2/v1_3. NO leyo ningun valor_extraido, ningun R, ningun valor_punto de M ni ninguna cifra de CALC-B-0001."
  medidor_ejecutado_al_congelar: "NO -- escrito y congelado en el COMMIT-3, corrido despues. La UNICA diferencia con CALC-C0D-MARCADOR es la fuente del punto L (L-extraido-v1_2.tsv en vez de valor_extraido) mas la guardia de correspondencia §3.5. Ninguna rama de veredicto se reescribio: v1.0 produjo NO-ADJUDICA-POR-CONTROL, que es la rama que mando escribir la sucesora."

variables:
  - {archivo: "forense/prereg-duelo-v2/marco-M-sorteado-v1_3.tsv", variable: id, rol: "identidad de la celda; las 14 filas son el universo"}
  - {archivo: "forense/prereg-duelo-v2/marco-M-sorteado-v1_3.tsv", variable: grado_DD, rol: "exclusion §5 del procedimiento sellado: VERIFICACION-NO-PUNTUA sale. Verificado: las 14 traen 'P1 PUNTUA', ninguna sale"}
  - {archivo: "forense/prereg-duelo-v2/marco-M-sorteado-v1_3.tsv", variable: escala, rol: "A-bis 3: las 14 son binaria, por eso err_pp es comparable entre celdas"}
  - {archivo: "forense/prereg-duelo-v2/marco-M-sorteado-v1_3.tsv", variable: "encuesta, ola, conducta", rol: "cobertura del piso B (§0.2): solo ENIGH x recibe_remesas con ola previa"}
  - {archivo: "forense/prereg-duelo-v2/L-extraido-v1_2.tsv", variable: "valor, estado", rol: "FUENTE VIGENTE del punto L: media de `valor` sobre las filas EXTRAIBLE de ese (id_celda, variante). Regla verbatim de agregado_v1_2._cargar_l_tsv_v1_2, que es la que corre", codigos: "estado in {EXTRAIBLE, ...}; solo EXTRAIBLE entra", direccion: "mas cerca de R es mejor"}
  - {archivo: "forense/prereg-duelo-v2/L-extraido-v1_2.tsv", variable: "id_celda, variante, indice", rol: "llave de la guardia §3.5: cada fila del TSV tiene que tener su captura y cada captura su fila"}
  - {archivo: "forense/prereg-duelo-v2/corridas-L/L-<id>-M__{L-solo,L+corpus}__NN.json", variable: valor_extraido, rol: "NO es la fuente del punto: es `null` en las 224 por diseno (hallazgo_declarado.nota_v1_2 del agregado). La captura entra por su EXISTENCIA (guardia §3.5) y por su metadato de alcance"}
  - {archivo: "forense/prereg-duelo-v2/corridas-L/L-<id>-M__{L-solo,L+corpus}__NN.json", variable: variante, rol: "brazo; se verifica contra el nombre de archivo y discorda PARA"}
  - {archivo: "forense/prereg-duelo-v2/corridas-M/M-<id>{__v1_3,,__v1_2}.json", variable: valor_punto, rol: "punto del corredor M; archivo resuelto por el orden §16 de MAESTRA38-M13"}
  - {archivo: "forense/prereg-duelo-v2/corridas-R/<id>.json", variable: "R, EE_R, estado", rol: "patron oro y su error estandar; solo estado == COMPUTADO entra"}
  - {archivo: "data/corrida0/CALC-B-0001/resultados.json", variable: "RESULT-B-{PERSISTENCIA,OPERATIVO}-<ola>-P y RESULT-B-ENIGH-<ola>-P", rol: "piso B citado por corrida0_resultado_id, y su observada para la guardia de conmensurabilidad"}
  - {archivo: "forense/prereg-duelo-v2/scoring-adv1-m3.py", variable: "generar_indices_bootstrap, derivar_seed_scope, _cuantil_7", rol: "maquinaria de bootstrap SELLADA del duelo, consumida desde los bytes verificados por sha256; no se reimplementa"}
  - {archivo: "forense/prereg-duelo-v2/agregado-v1_3-resultado.json", variable: "celdas.<id>.{L_solo,L_corpus}", rol: "control de convergencia §3.4: el punto que el agregado ya sello, contra el re-derivado de las capturas"}
  - {archivo: "data/manifiesto.yaml", variable: fecha_descarga, rol: "alcance §0.3: cuantas entradas entraron al corpus DESPUES de la ventana de captura del brazo L+corpus"}

universo: >-
  Las 14 filas de `forense/prereg-duelo-v2/marco-M-sorteado-v1_3.tsv`, ninguna mas y
  ninguna menos. Las 15 celdas del piloto (CIV-08, DIN-03/05/07/11, DOC-06,
  EMP-02/04/05, SFT-04/06, TIC-01/06/08/12) quedan FUERA: solo tienen brazo L-solo,
  asi que no admiten pareada -- declarado en §0.4 de la sellada, no descubierto al
  correr. Universo de la PAREADA PRIMARIA (U_LL): las celdas con R computado Y punto
  en L_SOLO Y punto en L_CORPUS. Universo COMUN (U-interseccion): las que ademas
  tienen punto en M.

filtros: >-
  Entra la celda cuyo `corridas-R/<id>.json` trae `estado == "COMPUTADO"` con `R` no
  nulo. Entra la replica L cuyo `valor_extraido` no es nulo; si las 8 de un brazo son
  nulas, ese punto es NO-DISPONIBLE y la celda sale de los agregados que lo
  necesiten -- no se sustituye por 0 ni por el otro brazo. Si el campo `variante` de
  una captura no coincide con el brazo que su nombre de archivo declara, PARA
  (ValueError): es el mismo control que `agregado_v1_1._leer_l_variante` ya hace.

ponderador: >-
  NO-APLICA a nivel de celda: los puntos L, M y R llegan ya agregados por sus
  procedimientos sellados, cada uno con su propio ponderador declarado en su fuente.
  Los agregados de este marcador (MAE_pp y las pareadas) son medias SIN PONDERAR
  sobre celdas -- cada celda del marco pesa uno, que es lo que `procedimiento-
  scoring-v1_2.md` §7 sello para D4 y lo que este marcador copia sin cambiar.

transformacion: >-
  err_pp(corredor, celda) = 100 * (punto - R), con signo, en puntos porcentuales.
  d_i = |err_pp(L_CORPUS, i)| - |err_pp(L_SOLO, i)|; d_i > 0 significa que el corpus
  ALEJO al corredor del patron oro en esa celda -- el signo se fija aqui, antes del
  dato. MAE_pp(corredor, U) = media de |err_pp| sobre U. IC95 de toda media = percentiles
  2.5/97.5 de 10000 replicas bootstrap sobre CELDAS (remuestreo con reemplazo del
  indice de celda), con `derivar_seed_scope(42, scope_id)` por cantidad.

estimando: >-
  DIAGNOSTICO, no gating. (1) PRIMARIO: la media de d_i sobre U_LL con su IC95 -- la
  comparacion pareada L_SOLO <-> L_CORPUS que D-2/FP-348 declara de primera clase y
  que `agregado_v1_3.py` NO implementa (§0.1). (2) SECUNDARIOS: las pareadas de cada
  brazo de L contra M sobre el universo comun, y el piso B en las 2 celdas que lo
  admiten. (3) DIAGNOSTICO DE UNIVERSO: si los MAE_pp marginales de D4 estaban
  calculados sobre conjuntos de celdas distintos (A-bis 4). NO es una estimacion de
  regla: ninguna cifra entra a un veredicto (T9) y la banda z primaria del duelo no
  se toca.

dependencias_materiales: []

parametros:
  fuente_acto: "ACTO GEN2-C0-D · EL MARCADOR · CALC-C0D-MARCADOR"
  firma_que_lo_autoriza: "D-2 / FP-348 (FIRMADA), verbatim de mesa: «la idea central de todo este proyecto es un LLM puede superar a LLM con dato (todo el corpus), si esto no esta claro ahorita entonces no estamos comparando correctamente.» -- de ahi que la pareada L_SOLO<->L_CORPUS sea la comparacion de primera clase."
  hallazgo_a_adjudicar: "asentado por direccion el 8/sep/2026: D4 (escala pp) marginal muestra L_CORPUS 19.60 · L_SOLO 11.69 · M 4.51. Este marcador lo convierte en veredicto o lo explica; §5 de la sellada fija las ramas por precedencia ANTES del dato."
  seed_duelo: 42
  bootstrap_replicas: 10000
  nivel_ic: 0.95
  n_minimo_pareada: 10
  k_umbral_conmensurabilidad: 1.96
  tolerancia_convergencia_L: 1.0e-9
  n_filas_l_tsv: 224
  fecha_corte_alcance: "2026-09-02"
  orden_resolucion_M: ["M-{id}__v1_3.json", "M-{id}.json", "M-{id}__v1_2.json"]
  scopes_bootstrap:
    mae_marginal: "mae_pp::marginal::{corredor}::c0d_v1_0"
    mae_comun: "mae_pp::comun::{corredor}::c0d_v1_0"
    pareada_primaria: "mae_pp::pareado::L_CORPUS_vs_L_SOLO::c0d_v1_0"
    pareada_sec_lsolo_m: "mae_pp::pareado::L_SOLO_vs_M::c0d_v1_0"
    pareada_sec_lcorpus_m: "mae_pp::pareado::L_CORPUS_vs_M::c0d_v1_0"
  piso_B:
    cobertura_sellada: "2 de 14 celdas -- FAM-M-06 (ENIGH 2018) y FAM-M-07 (ENIGH 2020). FAM-M-05 (ENIGH 2016) es SIN-BASELINE-PRIMERA-OLA: 2016 abre el universo congelado de B y no hay ola anterior. Las otras 11 son SIN-BASELINE-FUERA-DE-SERIE: B es una linea base temporal de la MISMA serie (ENIGH x recibe_remesas)."
    celdas: {FAM-M-06: "2018", FAM-M-07: "2020"}
    brazo_primario: PERSISTENCIA
    brazo_secundario: OPERATIVO
    nota: "MAE_pp(B) NO se calcula: n=2 no sostiene un agregado y compararlo contra un MAE de 14 celdas violaria A-bis 4. Se reporta PISO-CITADO-COBERTURA-PARCIAL."
  ramas_pareada_pre_declaradas:
    precedencia: ["NO-ESTIMABLE-POR-COBERTURA", "CORPUS-ESTORBA", "CORPUS-AYUDA", "NO-DISCRIMINA"]
    NO-ESTIMABLE-POR-COBERTURA: "n_LL < 10 -- no adjudica, cualquiera que sea el intervalo"
    CORPUS-ESTORBA: "ic_lo > 0 -- el corpus alejo a L del patron oro; CONFIRMA el hallazgo del 8/sep"
    CORPUS-AYUDA: "ic_hi < 0 -- el corpus acerco a L al patron oro; REFUTA el hallazgo del 8/sep"
    NO-DISCRIMINA: "ic_lo <= 0 <= ic_hi -- la pareada no distingue los dos brazos"
  ramas_adjudicacion_pre_declaradas:
    precedencia: ["NO-ADJUDICA-POR-CONTROL", "NO-ESTIMABLE-POR-COBERTURA", "EXPLICADO-POR-UNIVERSO", "EXPLICADO-POR-METRICA", "CONFIRMADO-CON-ALCANCE"]
    NO-ADJUDICA-POR-CONTROL: "el control de convergencia DIVERGE: el agregado vigente y las capturas no dicen lo mismo; adjudicar sobre una lectura desfasada seria adjudicar sobre nada"
    EXPLICADO-POR-UNIVERSO: "universos marginales NO identicos Y el orden de los MAE comunes difiere del orden de los marginales: 19.60/11.69/4.51 comparaba corredores medidos sobre conjuntos distintos (A-bis 4)"
    EXPLICADO-POR-METRICA: "universos identicos (o su correccion no cambia el orden) PERO la pareada da NO-DISCRIMINA: la diferencia de marginales no sobrevive al pareo"
    CONFIRMADO-CON-ALCANCE: "la pareada da CORPUS-ESTORBA; el alcance es el corpus del 1-2/sep/2026, claude-opus-4-6, k=8, temp 1.0, 14 celdas del marco v1_3"
    sucesor_de_5_3: "re-captura L_CORPUS con corpus GEN2 (fase 5 del plan de direccion) -- se NOMBRA aqui y NO se ejecuta en este acto"

seed:
  aplica: true
  valor: 42
  rng: "random.Random via generar_indices_bootstrap de scoring-adv1-m3.py (sellado); derivar_seed_scope(42, scope_id) por cantidad"

tolerancia:
  tipo: flotante
  abs: 1.0e-10
  razon: >-
    Sin microdato y sin RNG propio: el bootstrap es determinista por seed derivada y
    scope_id declarado, y las medias corren en orden fijo de celda. La unica
    diferencia esperable entre dos corridas del mismo arbol es redondeo de float64.
    Enteros y textos se comparan EXACTO. NO se afloja para que una adopcion pase: si
    el grano de un consumidor no cabe aqui, para eso existe `tolerancia_adopcion`
    (PRIMERA-SILLA §1), que esta spec deliberadamente NO declara -- adopta por la
    rama de defecto, redondeando al grano del consumidor.

