# ---------------------------------------------------------------------------
# `dispersion:` — LA ENMIENDA QUE E1 §4.4 DEBÍA.
#
# ADR-28.d obliga a que cada parámetro sea una DISTRIBUCIÓN, y §1.2 rechaza
# en compilación toda configuración con varianza cero dentro de la unidad.
# Bajo la tabla de perfiles eso se contaba como «90 parámetros de dispersión».
# Bajo el v4.0 la dispersión es parte de la especificación de cada condicional
# (§1.1.B), así que NO son 90 números sueltos sino QUINCE FAMILIAS DE
# DISTRIBUCIÓN SIN DECLARAR — `canon/modelo-decision-v4_0.md:806` («Las 15
# familias de distribución exigidas por ADR-28.d no están declaradas»), con
# el cambio de forma de la deuda explicado en :307 y :671.
#
# Los 15 pares gen×coef se derivan por código de
# `asignados_coeficiente.detalle` — no se transcriben a mano.
# Mientras las 15 sigan `NO-DECLARADA`, el check de varianza intra-celda de
# ADR-28.d NO PUEDE CORRER. Declararlas es alcance de mesa, no de este acto.
# ---------------------------------------------------------------------------
dispersion:
  deuda: "deuda_dispersion (milpa/procedencia.yaml:625) — ABIERTA, S2"
  unidad: "familia de distribución por par gen×coef (15), NO 90 parámetros"
  fuente_del_conteo: "canon/modelo-decision-v4_0.md:806 (y :307, :671)"
  familias:
    "G1×confianza_institucional": NO-DECLARADA
    "G1×radio_confianza": NO-DECLARADA
    "G2×sens_estatus": NO-DECLARADA
    "G2×aversion_riesgo": NO-DECLARADA
    "G3×horizonte_temporal": NO-DECLARADA
    "G3×aversion_riesgo": NO-DECLARADA
    "G3×familismo_apoyo": NO-DECLARADA
    "G4×exposicion_violencia": NO-DECLARADA
    "G4×confianza_institucional": NO-DECLARADA
    "G4×horizonte_temporal": NO-DECLARADA
    "G4×sens_estatus": NO-DECLARADA
    "G5×familismo_apoyo": NO-DECLARADA
    "G5×familismo_obligacion": NO-DECLARADA
    "G5×radio_confianza": NO-DECLARADA
    "G6×deferencia": NO-DECLARADA

# ---------------------------------------------------------------------------
# HALLAZGOS DE ESTE ACTO — medidos al derivar, no supuestos. Ninguno se
# corrige aquí (perímetro): se dejan legibles por máquina y van a NC.
# ---------------------------------------------------------------------------
hallazgos:
  colision_de_llave:
    que: "`Procedencia.consumibles()` devuelve 44 entradas pero `Theta.desde()` indexa por `llave` en un dict y entrega 43: la llave `0` colisiona entre `evidencia_experimental_terceros.0` y `coeficientes_generador_sellados.0`, y la segunda pisa a la primera."
    efecto: "la unica entrada EVIDENCIA_EXPERIMENTAL_TERCEROS del archivo (`dinero.credito.baja_friccion_usura_dano_downstream`, RCT de Compartamos, sellada por ADR-204) es INALCANZABLE por nombre desde `theta.py`, sin que se emita un solo error."
    no_corregido_aqui: "`milpa/src/theta.py` esta FUERA DE PERIMETRO de este acto. Va a NC con sucesor."
  universo_censado_presente_pero_sin_campo:
    que: "el censo E1 §3 declara `universo` PRESENTE para `condicionales_*` y `coeficientes_generador_medidos`, pero medido contra el arbol solo 3 de las 7 llaves (tras la reubicacion de P2; eran 6 antes, y G5_familismo_apoyo tampoco trae universo:) de `coeficientes_generador_medidos` traen campo `universo:`, y ninguna entrada de `condicionales_*` lo trae: el universo vive repartido en `fuente:` + `n_util:`."
    efecto: "esas filas llevan `universo_origen: DERIVADO de fuente:+n_util:`. No es un hueco del censo ni un valor inventado: es una discrepancia entre la prosa del censo y el arbol, declarada y no corregida."
