universo: Personas de LAPOP México 2023 con wt finito > 0, estratopri y upm no vacíos (prepara_diseno del contendiente,
  diseño de su ola 2019) y edad q2 >= 18
filtros: Un eje a la vez (TOTAL, SEXO, EDAD, ESCOLARIDAD, UR); nunca cruces (guardia E.6)
ponderador: wt
transformacion: Recodificación bin del contendiente con los códigos de la ola del piso (2019 o 2006; spec §1); columna
  ausente en 2023 -> NO-ESTIMABLE (sin recodificación ad hoc)
estimando: R = Σw·y/Σw por conducta×eje×categoría en LAPOP México 2023; cobertura de R en el IC de diseño sellado
  de la ola del piso del contendiente (IC-LO/IC-HI; sin ICC por FIRMAS-15 T)
seed:
  aplica: false
  razon: R es un punto; la cobertura usa el IC ya sellado del contendiente
parametros:
  nominal: 0.95
  z: 1.959964
  regla: cobertura R en [lo, hi] del contendiente; Wilson 95%; NO-ESTIMABLE > SUBCUBRE > SOBRECUBRE > CALIBRADO
  columna_ausente_en_catalogo: NO-ESTIMABLE (sin recodificación ad hoc)
tolerancia:
  tipo: flotante
  abs: 1.0e-10
  razon: 'determinista: sumas float64 sin remuestreo'
