  definicion: entidad de residencia (eje ENT 01-32)
- nombre: TLOC_RESID
  definicion: tamaño de localidad de residencia (eje TLOC)
- nombre: ESCOLARIDA
  definicion: escolaridad del fallecido (eje ESCOLARIDAD)
universo: Defunciones registradas en 2024 (todas las filas vivas de DEFUN24.dbf); universo por conducta según prepara()
  del contendiente (causa no vacía, suicidio CIE X60-X84, edad o sexo válidos)
filtros: Un eje a la vez (TOTAL, SEXO, EDAD, ENT de residencia, TLOC de residencia, ESCOLARIDAD); SUIC-HOMBRE sin
  eje SEXO y SUIC-15-* sin eje EDAD; nunca cruces (guardia E.6)
ponderador: 'ninguno (registro completo: w = 1 por defunción)'
transformacion: Recodificación del contendiente (spec EDR-SUICIDIO-PISOS §2); presunto suicidio = TIPO_DEFUN ==
  3 (como 2022-2023); columna ausente -> NO-ESTIMABLE
estimando: R = proporción exacta de defunciones registradas en 2024 con la conducta, por conducta×eje×categoría;
  cobertura de R en el ICC del piso 2023
seed:
  aplica: false
  razon: R es un punto; la cobertura usa el IC ya sellado del contendiente
parametros:
  nominal: 0.95
  z: 1.959964
  regla: cobertura R en [lo, hi] del contendiente; Wilson 95%; NO-ESTIMABLE > SUBCUBRE > SOBRECUBRE > CALIBRADO
  columna_ausente_en_catalogo: NO-ESTIMABLE (sin recodificación ad hoc)
tolerancia:
  tipo: flotante
  abs: 1.0e-10
  razon: 'determinista: sumas float64 sin remuestreo'
