universo: >-
  DELITOS (una fila por delito de tmod_vic) con BP1_20 in {1,2} -- la unidad y
  el universo EXACTOS de prereg-caja-ENVIPE-EVASION-NORMA (MAESTRA34-L5 P3).
  ENVIPE 2024 ENTERA para C1 (cruce escolaridad_proxy x dominio_urbano_rural,
  I24, n de soporte). ENVIPE 2023 ENTERA como insumo de C7 (cruce, I23).
  ENVIPE 2025 SOLO para los marginales de UN EJE (escolaridad_proxy,
  dominio_urbano_rural, nacional), a traves del modulo congelado
  tools/celda_d/marginales_reproduccion.py con la ola cargada reservada=True.
  El cruce de 2025 es COMMIT-3.
filtros: >-
  En este orden y sin ninguno mas, identico en las tres olas: (1) BP1_20 in
  {"1","2"}; las demas filas se cuentan (FILAS-BP1_20-FUERA) y salen; (2)
  FAC_DEL numerico y > 0, si no PARA; (3) EST_DIS y UPM_DIS no vacios, si no
  PARA. Sin filtro de edad, sexo ni tipo de delito. Delitos sin persona en
  tsdem NO paran: se cuentan y quedan (fuera) de escolaridad. ID_PER no unica
  en tsdem PARA. Convencion de universo por eje, la del arbitro: escolaridad
  sobre delitos clasificables; dominio y nacional sobre el universo entero;
  cruce sobre clasificables en ambos ejes.
ponderador: >-
  FAC_DEL (`Factor delito`, Numerico 6, 000001..999999 en las tres olas). Toda
  proporcion es razon de totales ponderados sum(w*y)/sum(w).
transformacion: >-
  evade_norma := (BP1_20 == "2") AND (BP1_23 a dos digitos in {04,05,06,08});
  b/blanco -> vacio, nunca cuenta. escolaridad_proxy := ESC_2DIG[NIV de la
  persona ID_PER en tsdem] (00,01,02 -> hasta primaria; 03 -> secundaria;
  04..07 -> media superior; 08,09 -> superior; 99/blanco/sin persona ->
  fuera), importado de tools/ejes_maestra35_l1.py (el objeto del arbitro).
  dominio_urbano_rural := {U: Urbano, C: Complemento urbano, R: Rural}[DOMINIO].
  I_w(s,d) := logit p_w(s,d) - [logit p_w(s) + logit p_w(d) - logit p_w] por
  ola, punto y replica a replica sobre el MISMO remuestreo de la ola;
  SIN-DEFINIR si algun termino es 0 o 1 (sin recorte). C1 := p24(s,d).
  C2 := expit(logit p25(s) + logit p25(d) - logit p25) con los marginales
  SELLADOS (parametro marginales_sellados), via tests/test_celda_d_c2.py::
  piso_log_aditivo. C6 := expit(logit C2 + I24). C7 := expit(logit C2 +
  (I23 + I24)/2).
estimando: >-
  p(evade_norma | escolaridad_proxy, dominio_urbano_rural) -- proporcion
  ponderada [0,1] de delitos, en 12 celdas SixDj. Este CALC emite C1
  (persistencia 2024), C2 (piso log-aditivo sobre marginales 2025 sellados),
  C6 (C2 + interaccion 2024) y C7 (C2 + interaccion promediada 2023-2024), con
  IC95 cada uno; asienta C4 INEJECUTABLE, C5 NO-APLICA y L NO-ENTRA. NO deriva
  el arbitro R del cruce: eso es COMMIT-3.
precision: >-
  Dos objetos, declarados en la spec humana §3.3: (1) IC del arbitro por
  wprop_ic_conglomerado (importada; seed 42, 10 000; default_rng), usado en
  los marginales del control de reproduccion; (2) replicas compartidas por
  ola (PCG64(42), n_h UPM con reemplazo por estrato, orden lexicografico,
  10 000), usadas en C1/C2/C6/C7 e interacciones; C6/C7 combinan la replica
  k de cada ola (muestras independientes entre olas; sin covarianzas
  inventadas). No cubre el error de especificacion de ningun candidato ni el
  de la extrapolacion temporal que C1 y C6/C7 SON.

dependencias_materiales: [numpy, pandas]
seed:
  aplica: true
  valor: 42
  rng: numpy.random.PCG64 (replicas compartidas) + numpy.random.default_rng (wprop_ic_conglomerado, receta del arbitro)
tolerancia:
  tipo: bootstrap
  exacto_por_seed: true
  abs: 1.0e-10
  razon: >-
    seed 42 + orden de consumo fijado en la spec humana §3.3 y en el modulo
    congelado: un generador por ola, estratos y UPM en orden lexicografico,
    replicas 0..9999. Los enteros se comparan EXACTO; los flotantes caen a
    abs = 1e-10.

parametros:
