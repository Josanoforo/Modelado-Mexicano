# corpus/indice.yaml
# Índice derivado de claves "report:X" / "validacion:Y" (milpa/*.yaml) contra
# archivos en corpus/reports/ y corpus/forense/.
#
# Metodología: una clave se marca "certeza" solo si hay UN único archivo cuyo
# título denota el mismo tema sin competir con otro archivo del corpus. Si dos
# archivos son candidatos plausibles, o si ningún archivo encaja, la clave NO
# se fuerza — queda en `residuales.claves_sin_archivo` con sus candidatos (si
# los hay). Generado a mano contra ce0658c; no hay script de regeneración.
#
# Números (ver ENTREGABLE en el encargo):
#   claves_unicas: 36
#   archivos: 36
#   claves_con_certeza: 27

