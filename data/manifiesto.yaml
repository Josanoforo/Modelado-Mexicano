- id: cpv2020_caas_eum_csv
  usado_para: 'CORREGIDO 2026-08-03 (ver forense/notas/2026-08-03-descarga-masiva-xml-mecanismo.md
    §6): NO es microdato de personas del Cuestionario Ampliado — la etiqueta original de esta
    entrada lo era por error, heredado de una premisa sin verificar. CAAS = Censo de Alojamientos
    de Asistencia Social: tres tablas, TI_TRA_CAAS_00.csv (trabajadores), TI_USU_CAAS_00.csv
    (usuarios), TR_ALO_CAAS_00.csv (alojamientos) — confirmado por listado del ZIP (unzip
    -l) y por las pestañas del descriptor (cpv2020_caas_descriptor_bd_xlsx: "CAAS_Alojamientos"
