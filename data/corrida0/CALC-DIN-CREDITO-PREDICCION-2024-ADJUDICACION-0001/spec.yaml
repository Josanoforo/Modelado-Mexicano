transformacion: "Columnas 2024 traducidas a columnas 2021 por COLUMNA_2024 (spec.md §1, nemonicos desplazados documentados campo por campo); misma dicotomizacion por conducta que #943; celdas y bootstrap importados por bytes de CALC-PISOS-ENIF2021-EJES-0003 (10000 replicas PCG64(42))."
estimando: "Marginal real ENIF 2024 (18-70) de las 9 conductas de credito que el encargo declara entrando, por 16 celdas de eje -- CONGELADO SIN CORRER en este acto; el valor real solo existe cuando otra sesion invoque medir() en COMMIT-2 (F3)."
parametros:
  bootstrap_replicas: 10000
  metodo_ic: "bootstrap UPM estratificado; percentiles 2.5/97.5 -- identico al marco de CALC-PISOS-ENIF2021-EJES-0003, para que el marginal 2024 sea conmensurable con la serie 2012-2021 sin funcion de enlace"
  n_soporte: NO-APLICA
  tolerancia_coherencia: NO-APLICA
dependencias_materiales: [numpy, pandas]
secuencia_commits:
  commit_1: "Este commit: guardia + mapa de columnas + medir() congelados; probado solo sobre sintetico; sin ejecucion.json"
  commit_2: "Otra sesion (F3): corrida0 run sobre este CALC, extrae el marginal real 2024 de las 9 conductas; sella ejecucion.json/resultados.json/sello.json"
  commit_3a: "Misma sesion del COMMIT-2, commit aparte, ANTES de derivar cualquier R: decide y escribe en este spec.yaml la regla de adjudicacion (spec.md §0/§4) contra las emisiones ya selladas de CALC-DIN-CREDITO-PREDICCION-2024-EMISIONES-0001 (resultados.json sha256 aa0db17c79581516fc326a4728f1b6969c75e8e837e350168771614db3a008cd, ya conocido y citable desde hoy porque esa pieza esta sellada en este mismo acto); preflight VERDE antes de seguir"
  commit_3: "Adjudica -- veredicto por (conducta, celda) con la regla fijada en 3a"
