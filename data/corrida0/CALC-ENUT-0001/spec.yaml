  - {id: RESULT-ENUT-A-GRANO-GEN1, tipo: entero, unidad: "decimales al que se compara contra GEN1 (4, declarado)"}
  - {id: RESULT-ENUT-A-ADOPCION, tipo: texto, unidad: "LISTADO-PARA-MESA-REPRODUCE / LISTADO-PARA-MESA-NO-REPRODUCE / NO-ADOPTABLE-NO-ESTIMABLE"}
  - {id: RESULT-ENUT-C-P-RESIDUO-15A59, tipo: proporcion, unidad: "SECUNDARIO: peso de CUID_INT_15A59 sobre el total de horas de cuidado si se incluyera -- mide el recorte por su tamano, no por su nombre", permite_no_estimable: true}
