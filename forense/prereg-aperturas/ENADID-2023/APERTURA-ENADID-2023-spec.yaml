universo: 'FAMILIA: hogares de THOGAR con fac_viv > 0, est_dis y upm_dis no vacíos, y residentes de TSDEM enlazados
  por llave_hog; COLA: mujeres de TMUJER2 15-54 con fac_per > 0 y diseño válido, y jefaturas (paren = 1) de TSDEM
  con fac_viv > 0 y diseño válido, emigrante varón fuera por TMIGRANTE (p4_6 = 1, p4_15 en {1, 3})'
filtros: Un eje a la vez (los de cada contendiente); nunca cruces (guardia E.6)
ponderador: fac_viv (hogares y residentes), fac_per (mujeres)
transformacion: Recodificación de cada contendiente (specs FAMILIA-ENADID-PISOS §2 y COLA-ENADID-PISOS) con códigos
  2018; renombre declarado p3_21 -> p3_27 (situación conyugal TSDEM 2023); columna ausente o con texto/códigos distintos
  -> NO-ESTIMABLE; llave/ponderador/diseño ausente -> PARO
estimando: R = Σw·y/Σw por contendiente×conducta×eje×categoría en ENADID 2023; cobertura de R en el ICC 2018 (FAMILIA)
  o en el IC95 de diseño 2018 (COLA)
seed:
  aplica: false
  razon: R es un punto; la cobertura usa el IC ya sellado del contendiente
parametros:
  nominal: 0.95
  z: 1.959964
  regla: cobertura R en [lo, hi] del contendiente; Wilson 95%; NO-ESTIMABLE > SUBCUBRE > SOBRECUBRE > CALIBRADO
  columna_ausente_en_catalogo: NO-ESTIMABLE (sin recodificación ad hoc)
tolerancia:
  tipo: flotante
  abs: 1.0e-10
  razon: 'determinista: sumas float64 sin remuestreo'
