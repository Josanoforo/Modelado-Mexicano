universo: DELITO con BP1_20 in {1,2} en tmod_vic (heredado verbatim de ENVIPE-EVASION-NORMA-spec-v1_0.md);
  FAC_DEL > 0; EST_DIS y UPM_DIS no vacios; join sec tmod_vic <- tsdem por ID_PER (m:1, validado).
filtros: escolaridad_proxy fuera de {00..09} de NIV, dominio fuera de {U,C,R}, sexo fuera de {1,2}, edad
  fuera de 18-96 -> (fuera), contado en meta.
ponderador: FAC_DEL
transformacion: 'evade_norma = (BP1_20==2) AND (BP1_23 in {04,05,06,08}); cuatro cruces: dominio_urbano_rural
  x sexo, edad x escolaridad_proxy, edad x sexo, escolaridad_proxy x sexo.'
seed:
  aplica: true
  valor: 42
  rng: numpy.PCG64
estimando: C1, C2, C7, C-ENCOGIDA por celda de cada uno de los cuatro cruces (38 celdas), con IC. lambda_cruce
  (metodo de momentos EB) por cruce, derivada de I23/I24. NO agrupa 2025 por dos variables; NO emite R.
parametros:
  ola_reservada: 2025
  bootstrap_replicas: 10000
  n_minimo_celda: 200
  control_arbitro_tol_p: 1.0e-06
  control_arbitro_tol_ic: 1.0e-06
  c_astra_estado: NO-ENTRA -- ningun CALC-ASTRA-* sellado al abrir este COMMIT (verificado 22/sep/2026,
    ADENDA-1)
guardia:
  allowlist_payloads:
  - envipe2023_csv
  - envipe2024_csv
  - envipe2025_csv
  agrupacion_maxima: UNA variable por eje en 2025 (E.6); el cruce vive solo en CALC-TRA-EVADE-NORMA-CRUCES-ENCOGIDA-ARBITRO-CRUCES-0001
  firmas_exigidas:
  - FP-260922-GEN2-CELDA-D-PILOTO-4-ENCOGIDA-1-a5a0-01
  - FP-260922-GEN2-CELDA-D-PILOTO-4-ENCOGIDA-1-a5a0-02
tolerancia:
  tipo: flotante
  abs: 1.0e-10
  razon: mismo payload, transformacion y sumas float64; bootstrap determinista por semilla
