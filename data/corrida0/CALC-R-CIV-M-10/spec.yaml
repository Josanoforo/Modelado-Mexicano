  - {id: RESULT-R-CIV-M-10-N-ESTRATOS-UPM-UNICA, tipo: entero, unidad: "estratos de U_R con una sola UPM -- si es > 0 el IC es LIMITE INFERIOR de la anchura verdadera"}
  - {id: RESULT-R-CIV-M-10-METODO-IC, tipo: texto, unidad: "IC-ULTIMATE-CLUSTER / IC-CON-ESTRATOS-DE-UPM-UNICA / NO-ESTIMABLE-DISENO-INCOMPLETO"}
  - {id: RESULT-R-CIV-M-10-PERFIL-DISENO, tipo: texto, unidad: "perfil OBSERVADO de las llaves opacas sobre U_R: longitudes de EST_DIS y de UPM_DIS con su conteo, y cuantas traen espacios en los bordes. El descriptor ya mintio sobre esto en la ola 2025"}
  - {id: RESULT-R-CIV-M-10-N-U1, tipo: entero, unidad: "n NO PONDERADO de U1, universo homologado a prereg-caja-ENVIPE-DENUNCIA: BPCOD 05..15, BP1_20 = 2, BP1_23 en {01..08}, FAC_DEL valido"}
  - {id: RESULT-R-CIV-M-10-MASA-FAC-DEL-U1, tipo: flotante, unidad: "suma de FAC_DEL sobre U1", permite_no_estimable: true}
  - {id: RESULT-R-CIV-M-10-P-C1-U1, tipo: proporcion, unidad: "[SECUNDARIO HOMOLOGADO -- PUNTO DE SERIE] proporcion ponderada de U1 con BP1_23 en {01,02,06}, ENVIPE 2021 (delitos de 2020), unidad DELITO, FAC_DEL, escala [0,1]. Mismo universo y misma codificacion que RESULT-ENVIPE-DEN-P-C1-U1 de la ola 2025", permite_no_estimable: true}
  - {id: RESULT-R-CIV-M-10-EE-C1-U1, tipo: flotante, unidad: "error estandar de diseno de P-C1-U1 por conglomerado ultimo", permite_no_estimable: true}
