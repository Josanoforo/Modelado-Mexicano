  - {archivo: conjunto_de_datos_tmod_vic_envipe2025.csv, variable: DOMINIO, rol: eje-dominio-SOLO-MARGINAL}
  - {archivo: conjunto_de_datos_tmod_vic_envipe2025.csv, variable: SEXO, rol: eje-sexo-SOLO-MARGINAL}
  - {archivo: conjunto_de_datos_tmod_vic_envipe2025.csv, variable: EDAD, rol: eje-edad-SOLO-MARGINAL}
  - {archivo: conjunto_de_datos_tsdem_envipe2025.csv, variable: ID_PER, rol: llave-persona}
  - {archivo: conjunto_de_datos_tsdem_envipe2025.csv, variable: NIV, rol: eje-escolaridad-proxy-SOLO-MARGINAL}

universo: >-
  DELITOS (una fila por delito de tmod_vic de ENVIPE 2025) con BP1_20 in {1,2}
  -- la unidad y el universo EXACTOS del arbitro (prereg-caja-ENVIPE-EVASION-NORMA,
  MAESTRA34-L5 P3; n sellado 40 280). SOLO marginales de UN EJE, cinco ejes,
  a traves del modulo congelado con la ola cargada reservada=True. Ningun cruce.
filtros: >-
  En este orden y sin ninguno mas: (1) BP1_20 in {"1","2"}; las demas filas se
  cuentan y salen; (2) FAC_DEL numerico y > 0, si no PARA; (3) EST_DIS y UPM_DIS
  no vacios, si no PARA. Sin filtro de edad, sexo ni tipo de delito: fuera de
  banda de un eje (SEXO no en {1,2}; EDAD < 18 o > 96, 99, blanco; NIV fuera
  de 00..09; delito sin persona) es (fuera) de ESE eje, contado y emitido.
  ID_PER no unica en tsdem PARA. Universo por eje, el del arbitro: cada eje
  sobre sus clasificables; nacional sobre el universo entero.
ponderador: >-
  FAC_DEL. Toda proporcion es razon de totales ponderados sum(w*y)/sum(w).
transformacion: >-
  evade_norma := (BP1_20 == "2") AND (BP1_23 a dos digitos in {04,05,06,08}).
  escolaridad_proxy := ESC_2DIG[NIV de ID_PER en tsdem]; dominio_urbano_rural :=
  {U: Urbano, C: Complemento urbano, R: Rural}[DOMINIO]; sexo := SEXO[tmod_vic.SEXO]
  ({1: "1 Hombre", 2: "2 Mujer"}); edad := tramos_edad(tmod_vic.EDAD) (18-29,
  30-44, 45-59, 60+ = 60..96) -- los cuatro objetos importados de
  tools/ejes_maestra35_l1.py, el del arbitro. C2(a,b) := expit(logit p(a) +
  logit p(b) - logit p) con los marginales SELLADOS (punto) y, replica a
  replica, con los tres p_k de la MISMA replica del MISMO remuestreo (IC).
estimando: >-
  IC95 de C2(a,b) = piso log-aditivo de p(evade_norma) para las 38 celdas de
  los 4 pares del dictamen de ENVIPE 2025 (dominio_urbano_rural x sexo 6,
  edad x escolaridad_proxy 16, edad x sexo 8, escolaridad_proxy x sexo 8);
  proporcion de delitos en [0,1]. Punto = el sellado en RESERVADAS-0001,
  reproducido; IC = ruido muestral del estimador bajo no-interaccion. No mide
  el error de ese supuesto. No deriva ningun R de cruce.
precision: >-
  Replicas compartidas por ola (PCG64(42), n_h UPM con reemplazo por estrato,
  orden lexicografico, 10 000), UNA por ola, compartida por los cinco
  marginales; IC95 = percentiles 2.5/97.5 de las replicas validas. Replica con
  algun p_k en {0,1}: SIN-DEFINIR, descartada y contada. El IC del arbitro por
  celda de eje (wprop_ic_conglomerado, receta del arbitro) se re-deriva SOLO
  para el control B.

dependencias_materiales: [numpy, pandas]
seed:
  aplica: true
  valor: 42
  rng: numpy.random.PCG64 (replicas compartidas) + numpy.random.default_rng (wprop_ic_conglomerado, control B)
  precedente: "data/corrida0/CALC-TRA-EVADE-NORMA-SXD-EMISIONES-0001/spec.yaml:111-114 y :140"
tolerancia:
  tipo: bootstrap
  exacto_por_seed: true
  abs: 1.0e-10
  razon: >-
    seed 42 + orden de consumo fijado en el modulo congelado: un generador por
    ola, estratos y UPM en orden lexicografico, replicas 0..9999. Enteros
    EXACTO; flotantes abs = 1e-10.

