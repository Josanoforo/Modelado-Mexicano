  - {archivo: "tper_vic.dbf", variable: VIV_SEL, rol: "llave de hogar (2/3)", codigos: "C2"}
  - {archivo: "tper_vic.dbf", variable: HOGAR, rol: "llave de hogar (3/3)", codigos: "C1"}
  - {archivo: "tper_vic.dbf", variable: N_INF, rol: "numero de renglon del informante -- solo leido para dejar constancia de que NO es la identidad de la fila (no se usa)", codigos: "C2"}
