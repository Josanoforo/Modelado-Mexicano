  - {archivo: "vivienda.csv", variable: factor, rol: "PONDERADOR del estimando sucesor (A) -- el que C1 uso por instruccion de su encargo; FD #109, N (5)", codigos: "flotante tal cual"}
  - {archivo: "vivienda.csv", variable: est_dis, rol: "ESTRATO de diseno (LLAVE DE TEXTO OPACA)", codigos: "FD #107 C (4); el archivo lo trae de ancho 3 -- cadena cruda"}
  - {archivo: "vivienda.csv", variable: upm, rol: "UPM -- conglomerado que se re-muestrea (LLAVE DE TEXTO OPACA)", codigos: "FD #108 C (5) -- cadena cruda"}
  - {archivo: "persona.csv", variable: folioviv, rol: "llave persona (1/3) y llave de hogar (1/2) -- con BOM, por sufijo", codigos: "entero de 10 digitos"}
