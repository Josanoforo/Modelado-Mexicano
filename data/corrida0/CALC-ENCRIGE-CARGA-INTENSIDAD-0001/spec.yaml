variables: []
universo: >-
  Empresas privadas del país con instalaciones fijas en industria, comercio
  y servicios cubiertos por ENCRIGE 2020, que durante enero a la entrevista
  realizaron al menos un trámite o fueron sujetas a una inspección. Unidad:
  empresa, que puede integrar uno o más establecimientos.
filtros: >-
  Dominios publicados Estados Unidos Mexicanos, Micro, Pequeña, Mediana y
  Grande. Las participaciones usan sólo los cuatro tamaños; el nacional se
  usa como contraste y nunca como quinta parte.
ponderador: >-
  NO-REESTIMADO. N, A y T son estimaciones expandidas publicadas por INEGI,
  no tamaños muestrales. No se abren pesos ni microdatos.
transformacion: >-
  p=A/N; m=T/N; r=T/A si A>0. Participaciones N_s/suma(N_s), A_s/suma(A_s)
  y T_s/suma(T_s). Descomposición simétrica de m_s-m_micro en contribuciones
  asociadas a prevalencia e intensidad condicional.
estimando: >-
  Alcance de la corrupción entre empresas expuestas, recuento por empresa
  expuesta, intensidad por empresa afectada y concentración de las tres masas.
  Descripción transversal, no efecto causal ni riesgo por interacción.
precision: >-
  Sin n muestral, EE, CV o IC utilizables. Decimal sobre absolutos publicados;
  tolerancia 0.0003 para masas y 1e-12 para razones e identidades.

dependencias_materiales: []
seed: {aplica: false, valor: null, rng: NO-APLICA}
tolerancia:
  tipo: mixta
  abs: 1.0e-12
  razon: >-
    Razones deterministas; las masas nacionales aceptan 0.0003 por cinco
    redondeos de absolutos publicados a cuatro decimales.

