# CALC-ENVIPE-U4-2012 -- cara mecanica de spec.md (ACTO GEN2-LOTE-MEDICION-PENDIENTE-1, pieza P2 / NC-0099).
# Gobierna spec.md y, sobre el, la spec SELLADA forense/prereg-caja/ENVIPE-2012-U4-spec-v1_0.md
# (`prereg-caja-ENVIPE-2012-U4`), sucesora por extension de R-ENVIPE-SERIE-DBF-spec-v1_0 (§5)
# y de ENVIPE-DENUNCIA-spec-v1_0 (U4). Ninguna spec previa se edita.
# CONGELADO en el COMMIT-1, antes de leer un solo VALOR del microdato.
