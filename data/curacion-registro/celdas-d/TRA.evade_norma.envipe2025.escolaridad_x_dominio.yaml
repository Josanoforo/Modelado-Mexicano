# Celda-D del SEGUNDO piloto, registrada por ACTO GEN2-CELDA-D-PILOTO-2 v1.1
# (relanzamiento, 17/sep/2026). Nace con este acto: no hubo careo de diseños
# ciegos previo (la cobertura retroactiva la declara el encargo, A.8 (3)).
#
# FIRMAS DE MESA (17/sep/2026), verbatim en el encargo archivado
# `forense/encargos/2026-09-17-GEN2-CELDA-D-PILOTO-2-V1_1.md`:
#   Firma 1 ("L no y 12"): 12 celdas de ENVIPE 2025 no derivadas hasta que las
#     emisiones estén selladas; sin L; candidatos C1/C2/C6/C7; C4 INEJECUTABLE;
#     emisor fuera; desenlace y universo exactos de ENVIPE-EVASION-NORMA-spec-v1_0.
#   Firma 2 (relanzamiento): el cruce edad × dominio queda RESERVA-CONSUMIDA-
#     SIN-PILOTO; este piloto corre sobre escolaridad_proxy × dominio_urbano_rural;
#     el control de reproducción se congela como CÓDIGO en COMMIT-1 con guardia
#     de una sola variable de agrupación.
#
# EL PILOTO CORRIÓ, y el orden lo prueba el registro, no el ejecutor:
#   COMMIT-1 (2ff0283): spec + `tools/celda_d/marginales_reproduccion.py` +
#     test de la guardia + contrato de emisiones, sin microdato.
#   COMMIT-2 (cdd78f9): CALC-TRA-EVADE-NORMA-SXD-EMISIONES-0001--2ff028319eed
#     sellado; `data/corrida0/CALC-TRA-EVADE-NORMA-SXD-ARBITRO-CRUCE-0001/` NO
#     EXISTE en ese commit (git log --diff-filter=A). La guardia se PROBÓ en la
#     corrida: G-RESERVA-CRUCE-2025-DERIVADO = NO. El control de reproducción
#     del árbitro dio REPRODUCE (|Δp| ≤ 4.8e-07, |ΔIC| ≤ 4.7e-07, Δn = 0 en
#     los ocho marginales).
#   COMMIT-3 (7e86d93 contrato; sello --7e86d93722ec): R del cruce y adjudicación.
#
#   VEREDICTO: SIN-CANDIDATO-SUPERIOR. 12/12 celdas PUNTUADA, 0 FUERA-DE-SOPORTE
#   (n_2025 de 769 a 13 858; n_2024 de 859 a 12 116; n_2023 de 819 a 10 905).
#   Ningún challenger vence a los dos pisos en ninguna celda (0 de 12). C6 y C7
#   vencen a C1 en 4 y 5 celdas, y a C2 en NINGUNA; contra C2 quedan
#   INDECIDIBLES en 10 y 9 celdas y pierden en 2 y 3.
#   MAE vs R (pp): C2 1.568052 · C7 2.664967 · C6 2.852944 · C1 4.314595.
#   Skill (se reporta, no adjudica): C6 vs C1 +0.339, vs C2 −0.819; C7 vs C1
#   +0.382, vs C2 −0.700.
#   B-BIS LEÍDO (dos cláusulas): nadie vence a C1 → persistencia anual
#   corroborada en TRA; nadie vence a C2 → «marginales actuales sin
#   interacción» es el estimador honesto de celda para esta familia; la
#   interacción de olas previas no aporta BAJO ESTOS CANDIDATOS. Y sólo eso
#   dice (H5). Añadir la interacción de 2024 (o el promedio 2023-2024) al piso
#   marginal EMPEORA el MAE (1.57 → 2.85 / 2.66 pp): las interacciones por
#   celda son inestables entre olas (sólo 4 de 12 I₂₄ y 5 de 12 I₂₃ tienen IC95
#   que excluye 0).
#   `champion_actual` = NINGUNO. ESTE ACTO NO ADOPTA NADA. Adoptar es de mesa.
#
# UNIDAD: la regla `tramite.evasion_norma` modela la conducta de una PERSONA
# ante una norma; el instrumento la observa por DELITO (tmod_vic, FAC_DEL) y el
# universo queda RESTRINGIDO A DELITOS, declarado (A-bis 4; spec §1). Por eso
# `unidad_objetivo: persona` (la del modelo) y `universo_instrumento` de cada
# candidato dice DELITO (la del dato). El enum v0.5 §3 no tiene `delito`.
# ─────────────────────────────────────────────────────────────────────────────
