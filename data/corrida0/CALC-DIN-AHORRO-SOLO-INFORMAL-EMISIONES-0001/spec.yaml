universo: >-
  Personas ELEGIDAS de 18 anos y mas del modulo TMODULO de ENIF, una fila por
  persona seleccionada. ENIF 2021 COMPLETA para C1 (el cruce localidad x edad y
  su n de soporte; es la ola de desarrollo). ENIF 2024 SOLO para los marginales
  de UN EJE (localidad, edad, nacional), que alimentan el IC de C2 por replicas
  compartidas y el control de reproduccion del arbitro. El cruce de 2024 es
  COMMIT-3.
filtros: >-
  En este orden y sin ninguno mas, identico en las dos olas: (1) edad valida,
  18 <= EDAD <= 97 en 2021 y 18 <= edad_v <= 97 en 2024, excluyendo 98 y 99 que
  el catalogo declara `edad no especificada` -- son CENTINELAS, no edades; no se
  imputan ni se reparten, y cuantas filas salen por este motivo se emite como
  RESULT propio por ola, no se esconde en el denominador; (2) TLOC en
  {1,2,3,4}; (3) ponderador presente y > 0. No se filtra por tenencia de cuenta
  ni por respuesta a P5_1_*: quien no ahorro de ninguna forma es un 0 legitimo.
  GUARDIA DE RESERVA DE ESTE CALC, mecanica y no promesa: sobre ENIF 2024 el
  medidor agrupa por UN SOLO EJE a la vez y NO construye en ningun punto la
  llave (localidad, edad); lo declara en
  RESULT-DIN-LXE8-G-C2-CRUCE-2024-DERIVADO = "NO" y
  RESULT-DIN-LXE8-G-R-EXISTE-AL-CERRAR = "NO".
ponderador: >-
  ENIF 2021 = FAC_ELE (`Factor de expansion`, FD `5,C,fac_ele`), ratificado por
  la FP-379·ENMIENDA: es el MISMO objeto que fac_per en 2024 -- factor de
  expansion de la persona elegida -- con otro nombre. FAC_PER NO EXISTE en
  ningun archivo de enif2021_csv. ENIF 2024 = fac_per (`Factor de expansion a
  nivel persona`, FD `6,C,fac_per`). Toda proporcion es razon de totales
  ponderados: sum(w_i*y_i)/sum(w_i).
transformacion: >-
  informal := alguna P5_1_1..P5_1_6 == '1'. D9 (PRIMARIO, FP-379·ENMIENDA) :=
  informal AND NOT (alguna de los NUEVE tipos de cuenta con `guardo o ahorro` ==
  '1'). D7 (SENSIBILIDAD, NO ADJUDICA) := informal AND NOT (alguna de los SIETE
  tipos {1,2,3,4,5,8,9}). La variable que transporta el constructo `guardo o
  ahorro en la cuenta tipo k` es P5_7_k en 2021 y p5_6_k en 2024 --
  correspondencia de TEXTO del FD para los NUEVE valores de k, ratificada por
  mesa; el P5_6_k de 2021 pregunta por tarjeta de debito, otro evento. Por
  construccion D9 subconjunto de D7, luego p(D7) >= p(D9): falsador del medidor.
  C1: cruce localidad {L1 = TLOC in {3,4}; L2 = TLOC in {1,2}} x edad {E1 18-29,
  E2 30-44, E3 45-59, E4 60+} sobre ENIF 2021. C2: expit(logit(p_l) + logit(p_e)
  - logit(p)) -- AUSENCIA DE INTERACCION EN ESCALA LOGIT, NO independencia --
  con el PUNTO sobre los marginales publicos sellados de nueve codigos y el IC95
  sobre las replicas de esos mismos marginales re-derivados aqui. Un valor
  distinto de '1' (incluido vacio) no cuenta como Si; toda fila con un valor
  fuera de {'1','2',''} se cuenta y se reporta.
estimando: >-
  p(ahorra_solo_informal | localidad, edad) -- proporcion ponderada [0,1] de
  personas elegidas 18+, en 8 celdas de cruce, bajo D9. Este CALC emite C1
  (persistencia ENIF 2021, IC bootstrap propio), C2 (piso log-aditivo sobre
  marginales de ENIF 2024, IC replica-por-replica) y C3 (elicitacion de L,
  dieta L-solo), y asienta C4 INEJECUTABLE y C5 NO-APLICA. NO deriva el arbitro
  R del cruce: eso es COMMIT-3.
precision: >-
  C1: IC95 muestral por bootstrap de conglomerados estratificado (10 000
  replicas, seed 42); NO incluye el error de la extrapolacion temporal
  2021->2024, que es el supuesto que C1 ES. C2 (FP-379 D3, sin cambio en la
  ENMIENDA): IC95 por bootstrap REPLICA POR REPLICA -- la replica r produce
  p_l^(r), p_e^(r) y p^(r) a la vez sobre el MISMO remuestreo de la MISMA
  muestra, y las tres se empujan juntas por la forma log-aditiva; sin delta, sin
  independencia entre estimadores, sin covarianzas inventadas, y sin exponer R.
  NO cubre el error de especificacion del piso. C3: dispersion entre las k=8
  corridas (minimo, mediana, maximo); NO es un IC muestral. El intervalo al 80 %
  declarado por L NO se extrae (la regla congelada devuelve un punto; una
  segunda regla escrita tras leer las capturas seria post-hoc).

dependencias_materiales: [numpy, pandas]
seed:
  aplica: true
  valor: 42
  rng: numpy.random.PCG64
tolerancia:
  tipo: bootstrap
  exacto_por_seed: true
  abs: 1.0e-10
  razon: >-
    seed 42 + numpy.random.PCG64 + orden de consumo fijado en la spec humana
    §3.3. Un generador por ola, estratos ordenados por EST_DIS, UPM por UPM_DIS,
    replicas 0..9999; las 8 celdas de 2021 comparten su remuestreo y los siete
    marginales de 2024 comparten el suyo. Los enteros se comparan EXACTO; los
    flotantes caen a abs = 1e-10.

parametros:
  pregunta_consumidora: >-
    Que candidato reproduce mejor p(ahorra_solo_informal | localidad, edad) en
    las 8 celdas de cruce de ENIF 2024, y con que margen -- sin que ninguno vea
    el cruce antes de emitir?
  consumidor: >-
    celda-D DIN.ahorro_solo_informal.enif2024.localidad_x_edad; el marcador NO
    la consume (FP-376, corte del modelo en `localidad`).
  celdas: [L1xE1, L1xE2, L1xE3, L1xE4, L2xE1, L2xE2, L2xE3, L2xE4]
  desenlace_primario: D9
  desenlace_sensibilidad: D7
  desenlace_sensibilidad_adjudica: false
  localidad_L1_tloc: ["3", "4"]
  localidad_L2_tloc: ["1", "2"]
  edad_tramos: {E1: [18, 29], E2: [30, 44], E3: [45, 59], E4: [60, 97]}
  edad_centinela: ["98", "99"]
  codigos_informal_2021: [P5_1_1, P5_1_2, P5_1_3, P5_1_4, P5_1_5, P5_1_6]
  codigos_informal_2024: [p5_1_1, p5_1_2, p5_1_3, p5_1_4, p5_1_5, p5_1_6]
  codigos_formal_D9_2021: [P5_7_1, P5_7_2, P5_7_3, P5_7_4, P5_7_5, P5_7_6, P5_7_7, P5_7_8, P5_7_9]
  codigos_formal_D7_2021: [P5_7_1, P5_7_2, P5_7_3, P5_7_4, P5_7_5, P5_7_8, P5_7_9]
  codigos_formal_D9_2024: [p5_6_1, p5_6_2, p5_6_3, p5_6_4, p5_6_5, p5_6_6, p5_6_7, p5_6_8, p5_6_9]
  codigo_si: "1"
  dominio_declarado_fd: ["1", "2"]
  bootstrap_replicas: 10000
  umbral_soporte_n: 200
  soporte_es_caveat_no_bloqueo: true
  soporte_n_2021_donde: "COMMIT-2, abriendo microdato de 2021 (ola de desarrollo)"
  soporte_n_2024_donde: "COMMIT-3, junto con R"
  salida_si_sin_soporte: >-
    la celda se rotula FUERA-DE-SOPORTE, se emite igual su punto y su IC
    marcados, NO puntua en la adjudicacion, y cuenta para la parada
    FUERA-DE-SOPORTE si ocurre en >= 3 de las 8. n = 0 -> punto e IC
    NO-ESTIMABLE (null), nunca 0.0.
  cotas_frechet_N: 13487
  firma_c2: "FP-379 D2+D3 sin cambio; D1 reescrita por la ENMIENDA"
  c2_dieta: "marginales publicos sellados del arbitro (nueve codigos) -- `lo que todos ya vieron`"
  c2_desenlace_id: "ahorra_solo_informal::P5_6_{1..9}"
  c2_punto_desde: "marginales sellados, citados y no recalculados"
  c2_ic_desde: "replicas bootstrap de esos mismos marginales re-derivados en este CALC"
  c2_forma: "log-aditiva: expit(logit(p_l) + logit(p_e) - logit(p))"
  c2_rotulo_supuesto: "ausencia de interaccion en escala logit"
  c2_rotulo_prohibido: "independencia"
  c2_rechazo: "SIN-DEFINIR si algun marginal es exactamente 0 o 1, en el punto o en una replica; si el PUNTO es SIN-DEFINIR la celda es NO-CONSTRUIBLE (null), sin recorte y sin sustitucion"
  c2_funcion_de_referencia: "tests/test_celda_d_c2.py::piso_log_aditivo -- el medidor la IMPORTA, no la reimplementa"
  c2_repliegue: "si la construccion no es viable, C2 pasa a DIAGNOSTICO y deja de ser piso admisible; el piloto pregunta solo si algo vence a la persistencia (C1)."
  c2_forma_diagnostico: "multiplicativa p_l*p_e/p -- SOLO dos escalares de control de rango; no hay RESULT multiplicativo por celda y no compite"
  c2_guardia_reserva: "el medidor no construye la llave (localidad, edad) sobre ENIF 2024 en ningun punto"
  marginales_sellados_D9:
    E1: {p: 0.432063, ic95: [0.407039, 0.457410], n: 2924, linea: 1447}
    E2: {p: 0.375709, ic95: [0.354484, 0.396905], n: 4256, linea: 1448}
    E3: {p: 0.327505, ic95: [0.307291, 0.347765], n: 3411, linea: 1449}
    E4: {p: 0.277317, ic95: [0.254739, 0.300803], n: 2896, linea: 1450}
    L1: {p: 0.409255, ic95: [0.387307, 0.429960], n: 4646, linea: 1472}
    L2: {p: 0.329868, ic95: [0.315113, 0.344834], n: 8856, linea: 1473}
    NAC: {p: 0.357153, ic95: NO-APLICA, n: 13502, fuente: "milpa/tramite.yaml:1312 y milpa/tramite-ola5-propuesta-v0.yaml:1127 -- clase DERIVADO, sin IC propio; no es MEDIDO"}
  marginales_sellados_fuente: "milpa/tramite-ola5-propuesta-v0.yaml:1447-1450 y :1472-1473 (el encargo los cita como :1437-1470; lineas corridas en este arbol, contenido identico -- verificado)"
  control_arbitro_umbral: 1.0e-6
  control_arbitro_ramas: "REPRODUCE si |delta| <= 1e-6 en las seis celdas marginales con IC sellado; NO-REPRODUCE en otro caso, con delta con signo y sin ajustar nada. Un NO-REPRODUCE no invalida el piloto: invalida la afirmacion de que este medidor reproduce la receta del arbitro."
  c3_protocolo: "ADV1 (CAREO-ADV-DUELO-diseno-v2-2026-08-19.md §B) + PAQUETE-L-v1_1.md §2"
  c3_k_corridas: 8
  c3_dieta_viva: L-solo
  c3_modelo_alias: opus
  c3_semilla_orden: 42
  c3_spec_sufijo_vigente: celda-d-piloto-v1_2
  c3_spec_sufijo_superado: celda-d-piloto-v1_0
  c3_capturas_superadas: "18 capturas bajo el prompt de SIETE tipos, estado SUPERADO-POR-SPEC; no se borran, no se editan, no se reusan. Manifiesto: forense/prereg-duelo-v2/corridas-L/CD-DIN-MANIFIESTO-SUPERADAS-v1_0.json"
  c3_extraccion: "tools/extrae_l_v1_1.py::extraer_valor (regla congelada regla-extraccion-L-v1_1.md); no se edita el script; el intervalo al 80 % NO se extrae"
  c3_capturas_dir: forense/prereg-duelo-v2/corridas-L
  c3_lcorpus: "DIFERIDO-A-SUCESOR por costo y tiempo (FP-379·ENMIENDA). Esta en el perimetro y en la spec. Impacto: el piloto prueba una sola dieta de L; L+corpus solo se vuelve necesario si L-solo vence a algun piso -- si pierde contra los dos, es moot. Hecho para el sucesor: paquete-corpus-F5-v1_0/manifiesto.json declara 14 celdas del marco-M y ninguna de este piloto."
  c3_control_memoria: >-
    NO-PUBLICADO-EN-LO-ALCANZADO. Busqueda en el arbol (git grep -icE
    "localidad ?[x×] ?edad", con control positivo git grep -cE "eje: localidad"
    -- milpa/ = 2 archivos) + busqueda web dirigida sobre los productos publicos
    de ENIF 2024 (ENIF2024_CP.pdf, ENIF2024_RR.pdf, reporte CNBV, portal del
    programa): la publicacion oficial desagrega por tamano de localidad y por
    sexo a nivel nacional, no el cruce localidad x edad de este desenlace.
    Acredita que el cruce no esta en el arbol ni en lo alcanzado; NO acredita
    que nadie lo haya visto.
  c4_faltantes:
