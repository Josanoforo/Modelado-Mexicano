  reglas_bajo_prueba: >-
    NINGUNA. Ninguna cifra de este CALC entra a un veredicto de regla (T9). No re-corre la triada ni toca su veredicto.
  contaminacion_declarada: >-
    ADR-46 -- contaminacion TOTAL declarada por el encargo y re-declarada aqui: los valores R/M/L de las 14 celdas
