    con matiz de que ESTRATO es proxy de ingreso, no estrato de varianza)'
  notas: 'Hallazgo genuino, no mención de paso: el archivo `2026-08-04-medicion-exposicion-violencia-envipe.md`
    tiene ENVIPE como tema exclusivo del acto completo (título, encargo K), y `2026-08-04-cal-conf-faseb-medicion-pos4.md`
    dedica su §1 al ponderador/dispersión de `TMod_Vic` de ENVIPE. Ambos verifican los campos
    contra el diccionario de datos (`fd_envipe2025.pdf`), no los citan de memoria -- el propio
    texto de `cal-conf-faseb-medicion-pos4.md:254-261` narra explícitamente el cuidado de NO
    copiar un ponderador de otra tabla sin verificar ("ningún ponderador se copia del acto anterior
    sin verificar que es el que corresponde a esta tabla").


    Matiz importante (posible falso-positivo evitado activamente por las propias notas, no por
    mí): ENVIPE tiene TRES ponderadores distintos según la tabla/unidad de análisis -- `FAC_ELE`
    (persona elegida, no `FAC_ELE_AM` que es solo para 34 áreas urbanas de interés), `FAC_HOG`
    (hogar) y `FAC_DEL` (delito-tipo en `TMod_Vic`). No existe un "el ponderador de ENVIPE"
    único; el campo `ponderador` de esta respuesta reporta el más general/documentado (`FAC_ELE`)
    y las variantes verificadas.


    Segundo matiz: `ESTRATO` (variable sustantiva 1-4, "estrato de área", usada como proxy de
    ingreso/marginación en el eje "Ingreso" del canon §1.1.A) y `EST_DIS` (estrato de diseño,
    para el estimador de "ultimate cluster"/Woodruff) son nombres parecidos pero campos distintos
    dentro del mismo bloque del layout -- una nota (`2026-08-04-envipe-tper-vic2-tmod-vic-paso1.md:351`)
    los menciona juntos ("`DOMINIO`/`ESTRATO` en el bloque de diseño muestral") lo cual podría
    inducir a confundirlos con el estrato de varianza si no se lee `2026-08-04-medicion-exposicion-violencia-envipe.md:106-109`,
    que aclara sin ambigüedad que el estrato de diseño usado para varianza es `EST_DIS`, no
    `ESTRATO`.


    Validación externa: el estimador con `FAC_ELE` sobre `TPer_Vic2` fue contrastado contra
    una cifra publicada por INEGI (incidencia de violación sexual, 279.3 calculado vs. 279 publicado,
    diferencia 0.09%), lo cual da soporte fuerte a que `FAC_ELE` es el ponderador correcto para
    esa tabla, no solo una lectura del diccionario.


    746 estratos de diseño con ≥2 UPM, cero estratos singleton -- dato reportado en la misma
    nota, útil como evidencia adicional de que `EST_DIS`/`UPM_DIS` son efectivamente los campos
    de diseño (varianza estimable en todos los estratos).'
