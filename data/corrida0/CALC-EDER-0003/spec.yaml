  - {id: RESULT-EDER-UNION-G-N-FILAS-ANTECEDENTES, tipo: entero, unidad: "filas de antecedentes.csv (el censo de L7 conto 23831)"}
  - {id: RESULT-EDER-UNION-G-N-FILAS-VIVIENDA, tipo: entero, unidad: "filas de vivienda.csv"}
  - {id: RESULT-EDER-UNION-G-LLAVE-ANTECEDENTES-TERNA-UNICA, tipo: texto, unidad: "SI / NO -- (folioviv,foliohog,id_pobla) unica en antecedentes.csv"}
  - {id: RESULT-EDER-UNION-G-LLAVE-VIVIENDA-UNICA, tipo: texto, unidad: "SI / NO -- folioviv unica en vivienda.csv"}
