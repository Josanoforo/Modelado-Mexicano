filtros: "Ninguno. Guardia unica: si alguno de los 6 insumos de §variables cambia de valor respecto al declarado aqui, la corrida sale NO-ESTIMABLE-INSUMO-CAMBIO -- senal de que un CALC sellado se modifico, lo cual E.3 prohibe."

ponderador: "No aplica -- sin microdato propio."

transformacion: >-
  Complemento simple: horizonte_no_corto_X = 1 - horizonte_corto_X, para
  X en {sin_ss, con_ss, no_trabajadores}. Inclusion-exclusion sobre la
  particion via_informal: ambas = A_solo_formal + B_solo_informal -
  tiene_ahorros_enif2024; solo_formal = A_solo_formal - ambas;
  solo_informal = B_solo_informal - ambas; no_ahorra =
  no_tiene_ahorros_enif2024 (= 1 - tiene_ahorros_enif2024, ya contado en
  CALC-TIENE-AHORROS-0001, no re-contado aqui). Guardia de identidad:
  ambas + solo_formal + solo_informal + no_ahorra debe sumar 1 dentro de
  tolerancia (A-SUMA-UNO-VIA); si no, NO-ESTIMABLE-PARTICION-INCONSISTENTE.

estimando: >-
  DESCRIPTIVO, sin incertidumbre nueva -- ningun RESULT lleva IC95 propio
  (declararlo exigiria la covarianza entre las corridas originales, no
  disponible sin re-correr un bootstrap conjunto; fuera de perimetro).
  Verificacion de no-independencia declarada: P(F)*P(I) = 0.160096 !=
  P(F∩I) = 0.204767 -- el dato real correlaciona mas que la independencia,
  la formula usada es la identidad exacta de conjuntos, no una
  aproximacion.

