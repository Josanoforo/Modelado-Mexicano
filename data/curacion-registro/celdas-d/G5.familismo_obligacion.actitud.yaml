# Primera celda-D del registro (data/curacion-registro/celdas-d/), esquema propuesta-motor-adaptativo-celda-v0_3.md §3.
# Conforme a §3 y a §4 donde §3/§4 y el resumen de ADR-68(f) difieran -- §4 manda (instrucción explícita del encargo E4b).
#
# Divergencia declarada: ADR-68(f) (canon/gobernanza-v1_15.md:888) resume esta celda como
# "familismo_obligacion (dos celdas ligadas por brecha-momento, rol COMPLEMENTO -- no competencia)".
# Ese "rol COMPLEMENTO" es un listado abreviado, no el contrato: v0.3 §3.1 y §4-bis son explícitos --
# ENASIC (actitud) y ENUT (conducta) son DOS celdas-D DISTINTAS ligadas por `relacion_complemento` con
# momento propio; NINGUNA de las dos lleva `rol: COMPLEMENTO` (ese rol es para una fuente que aporta
# contexto a una celda YA definida sin aspirar a ganarla -- no es este caso). Este archivo sigue §3.1/§4-bis,
# no la paráfrasis de ADR-68(f). Esta celda abre SOLO el componente actitudinal; la conducta es acto propio.
#
# RESUELTO 13/ago/2026, ADR-75(a), ACTO RES -- la reserva de encuadre de género de ADR-67(b) se firma
# RESUELTA-ACOTA (no RESUELTA-ADMITE, no NO-RESUELTA-CON-RAZÓN): ENASIC-SPLIT
# (forense/notas/2026-08-13-enasic-split-verificacion.md §2.1) confirmó lectura (ii) -- fórmula única
# administrada y capturada, sin bifurcación por sexo del informante reconstruible en el dato -- lo que
# cierra la única vía que justificaba seguir esperando más información. El reactivo, pese a eso, sigue
# siendo textualmente un enunciado normativo que asigna el deber de cuidado según el sexo de quien lo
# recibe ("se debe enseñar a la mujer (al hombre) que su deber es cuidar..."), no una creencia genérica
# de obligación familiar -- admitir la θ sin restricción bajo la sola etiqueta `familismo_obligacion`
# dejaría un nombre genérico cargando una creencia específicamente marcada por género, exactamente el
# defecto que la reserva existía para vigilar. Límite de constructo escrito en `supuesto_transporte`
# abajo (no borrado el encuadre, acotado). Mismo acto firma, aparte, la enmienda in situ de ENASIC-SPLIT
# sobre ADR-67(b) (gobernanza:866) que propone renombrar este estimando a `norma_de_género` -- ese
# renombre, y la celda-D propia de `obligación_medida` (P6_38), quedan pendientes de acto futuro con
# perímetro propio (no ejecutados aquí; ver forense/notas/2026-08-13-res-reserva.md §4). El titular
# `condicionales 9 de 14` NO se mueve por esta resolución -- README.md:37 y T19b
# (tests/check.py, T-CONTADOR-14-CRUZADO) derivan ese número de `grep -c 'clase: "MEDIDO·PARCIAL'
# milpa/procedencia.yaml`, fuera del perímetro de este acto; ver forense/notas/2026-08-13-res-reserva.md §5.

celda_d:
  id: G5.familismo_obligacion.actitud
  estimando: "G5·familismo_obligacion (componente actitudinal)"
  tipo_adjudicacion: CALIBRACION_CONJUNTA  # heredado del registro semilla (v0.3 §4-bis), provisional
  dominio: CUL  # cultura_valores_opinion -- coincide con data/inventarios/inventario_fuentes_cultura_valores_opinion_mexico.md;
                # el reactivo mide norma/creencia (Sección 7, "Percepción CULTURAL de los cuidados" en el propio
                # instrumento), no tiempo/conducta (eso sería TIE -- uso_del_tiempo_cuidados_hogar -- y le
                # correspondería a la celda .conducta/ENUT, acto propio, no a esta)
  poblacion_objetivo: "Personas de 15 a 60 años residentes en viviendas particulares de México, seleccionadas como 'persona elegida' (ENASIC 2022, tabla TPER_ELE) -- ver forense/notas/2026-08-11-e4b-sello-b-corrida-b.md §1/§4 para la justificación frente a TPOB_CUI/THOG_UNIP, que comparten el mismo reactivo sobre universos distintos"
  unidad_objetivo: persona
  universo_candidatos: "Único candidato conocido y barrido en este acto (E4b, 11/ago/2026): ENASIC 2022 P7_12_7, vía apertura de su descriptor (enasic_2022_fd_xlsx + 889463927082.pdf). No se barrieron fuentes adicionales para el componente actitudinal -- no era el encargo de este acto y no se declara exhaustivo."
  candidatos:
    - rol: BASELINE
      fuentes: [ENASIC]
      edicion_periodo: "2022"
      universo_instrumento: "Personas de 15-60 años, persona elegida (una por hogar), vivienda particular -- tabla TPER_ELE. Reactivo P7_12_7, formulado como norma de género explícita (ver reserva de encuadre, forense/notas/2026-08-11-e4b-sello-b-corrida-b.md §5)."
      diseno_datos: transversal
      estrategia: NO-APLICA  # distribución descriptiva de diseño con un único candidato BASELINE, no ruta de
                              # AJUSTADO (ADR-49 D2, gobernanza:439) -- esa enumeración acota `estrategia` a la
                              # clase AJUSTADO de milpa/procedencia.yaml; esta celda no alimenta esa clase.
                              # Mismo patrón que v0.2 §3 usa para un candidato de FALSACION ("NO-APLICA -- es un
                              # ejercicio de falsación, no de ajuste/comparación").
      regla_composicion: NO-APLICA
      production_spec_refs:
        - "data/curacion-registro/expedientes-produccion/t0-89f4c3a49c00c0e1/ESP-OPACA-B-d13ec4fe/resultado.tsv"
        - "data/curacion-registro/especificaciones-produccion.json#ESP-OPACA-B-d13ec4fe"
      resultado: >
        vigente -- CALCULO_REPRODUCIBLE (U1/E4b', 12/ago/2026, tras enmienda de periodo_levantamiento en
        forense/notas/2026-08-12-u1-e4b-prime-recorrida.md): P7_12_7 sobre TPER_ELE, n=5,579, suma_pesos=
        80,237,061; De acuerdo(Sí)=0.6933 [IC95 0.6725-0.7140], Desacuerdo(No)=0.2995 [0.2788-0.3203],
        No responde=0.0035, No sabe=0.0037 -- las cuatro categorías oficiales con ESTIMACION_SUSTENTADA,
        cero celdas vacías. verificacion_supervisor=REPRODUCIDA_EN_TEMP_Y_COMPARADA_BYTE_A_BYTE
        (integrate_production.py). "vigente" en el mismo sentido que
        G5.radio_confianza.encuci_vs_enbiare.yaml usa para su BASELINE/ENCUCI -- único candidato, nada que
        adjudicar todavía (ver `criterio_adjudicacion`), no un "GANO" que reclamaría una comparación que no
        ocurrió.
  criterio_adjudicacion:
    texto: "NO-APLICA en este acto -- un único candidato BASELINE, sin challenger con quien competir. CALIBRACION_CONJUNTA no adjudica aquí: el registro semilla (v0.3 §4-bis) la marcó 'provisional -- no se ejecuta en este acto'; el cálculo ya existe (ver `resultado` arriba) pero no hay challenger contra quien adjudicarlo."
    escala: "NO-APLICA -- un único candidato, nada que comparar en ninguna escala todavía"
  momentos_holdout_refs: []
  champion_actual: "BASELINE.ENASIC"  # mismo criterio que G5.radio_confianza.encuci_vs_enbiare.yaml:123
                                        # ("explícito, per encargo -- ENBIARE está registrado, no compite
                                        # todavía"): único candidato con cálculo vigente y verificado se
                                        # vuelve champion por default, sin que eso resuelva
                                        # `requiere_decision_mesa` (abajo) -- son dos ejes independientes,
                                        # igual que en esa celda hermana.
  output_nativo:
    tipo: DISTRIBUCION_DESCRIPTIVA
    escala: "proporción sobre respondientes de TPER_ELE (0-1 / %), 4 categorías oficiales (De acuerdo/Desacuerdo/No responde/No sabe) -- producida, ver `resultado` arriba para los cuatro valores"
    valor_ref: "data/curacion-registro/expedientes-produccion/t0-89f4c3a49c00c0e1/ESP-OPACA-B-d13ec4fe/resultado.tsv (estado=CALCULO_REPRODUCIBLE en la única fila)"
  incertidumbre:
    tipo: "IC95 por linealización de Taylor sobre conglomerados últimos (estrato EST_DIS, conglomerado UPM_DIS) -- método declarado antes de ver el dato (E4b SELLO-B, 11/ago), producido en esta corrida (ver `resultado` arriba)"
    ref: "tools/curador_registro/produce.py::taylor_distribution"
  supuesto_transporte: "ACOTADO-CON-SUPUESTO: RESUELTA-ACOTA (ADR-75(a), 13/ago/2026) -- la θ (ver `resultado`) se admite al modelo con el estimando restringido por escrito: representa acuerdo con una NORMA DE DEBER DE CUIDADO DIFERENCIADA POR SEXO del sujeto enseñado ('se debe enseñar a la mujer (al hombre) que su deber es cuidar...'), no obligación familiar genérica -- límite de constructo, no borrado. No se declara EXISTE-SATISFACE (eso afirmaría transportabilidad sin restricción, que es precisamente lo que la reserva impedía). Consistente con, y sin ejecutar, el renombre a `norma_de_género` que la enmienda in situ de ENASIC-SPLIT sobre ADR-67(b) propone (gobernanza:866) -- ese renombre y la celda-D de `obligación_medida` quedan pendientes de acto propio"
  fuerza_coeficiente: ASIGNADO  # el coeficiente `familismo_obligacion` de G5 (milpa/procedencia.yaml:117,
                            # "+1 · familismo_obligacion en G5, ASIGNADO y SIN MAGNITUD (spec: 'signo negativo
                            # o no monotónico')") está clasificado ASIGNADO -- la clasificación de procedencia
                            # no depende de que la magnitud numérica ya exista (SIN MAGNITUD es un eje aparte,
                            # ver también :629 "magnitud: asignada" a nivel de fila G5, y :899 "ruta: SIN-RUTA,
                            # sin magnitud asignada"). Derivado del archivo, no tecleado.
  procedencia_condicional: MEDICION_DIRECTA_MICRODATO  # P7_12_7 es una distribución marginal directa sobre
                            # TPER_ELE (un reactivo, un ponderador, sin condicionante analítico cruzando
                            # variables) -- contraste explícito contra el precedente del propio corpus,
                            # G5.radio_confianza.encuci_vs_enbiare.yaml:149-153, cuyo BASELINE/ENCUCI es
                            # MEDICION_CONDICIONAL_MICRODATO precisamente PORQUE condiciona por
                            # formalidad×edad; esta celda no condiciona nada -- no un proxy (eso sería un
                            # ítem sustituto, no es el caso), no ausencia de estimación (sí existe, vigente,
                            # ver `resultado` arriba). Objeto distinto del coeficiente de arriba -- es
                            # exactamente la distinción que v0.4 introduce.
  vocabulario_version: 0.4  # Reserva original conservada verbatim (campo `fuerza` retirado, resuelto por esta
                            # versión): "NO_DETERMINADO -- Ninguno de los tres valores del enum
                            # (ASIGNADO|AJUSTADO|IDENTIFICADO) describe correctamente 'no hay estimación
                            # todavía': los tres caracterizan un VALOR existente en milpa/procedencia.yaml, y
                            # aquí no hay valor que caracterizar. Se declara así en vez de forzar un valor del
                            # enum que sería falso." -- fue el mecanismo que detectó el defecto que v0.4
                            # corrige (propuesta-motor-adaptativo-celda-v0_4.md §3): el enum describía el
                            # coeficiente (arriba, ASIGNADO) y esta celda no tenía dónde declarar que la
                            # condicional (no el coeficiente) seguía sin estimar (procedencia_condicional, arriba).
  calibrado: false
  estado_operativo: LISTO  # RESUELTO 13/ago/2026, ADR-75(a) -- la reserva de encuadre de género que
                                 # bloqueaba esta celda (abajo) se firma RESUELTA-ACOTA; el cálculo ya
                                 # estaba listo desde U1/E4b' (12/ago), el bloqueo era la decisión, no el
                                 # cómputo. Contraste que motivó el criterio: idéntico a
                                 # G5.radio_confianza.encuci_vs_enbiare.yaml (requiere_decision_mesa: false,
                                 # LISTO).
  requiere_decision_mesa: false  # RESUELTA 13/ago/2026, ADR-75(a), ACTO RES -- ver nota fechada arriba
                                 # (encabezado del archivo) y `supuesto_transporte` abajo para el límite de
                                 # constructo escrito. Hereda el registro semilla (v0.3 §4-bis) y el
                                 # supervisor_link de la maestra (especificaciones-produccion.json#ESP-OPACA-B-d13ec4fe:
                                 # requiere_decision=SI -> NO, misma fecha); periodo_levantamiento (la otra
                                 # reserva, cerrada 12/ago por U1/E4b') y el encuadre de género (cerrada
                                 # aquí) eran dos reservas independientes -- ambas resueltas ya.
  fecha_declaracion: "2026-08-11"
  commit_declaracion: "8df61b0"  # SHA del commit 1 (SELLO-B), pusheado a origin/e4b/sello-b-corrida-b antes de este commit
  fecha_adjudicacion: "NO-APLICA"
  commit_adjudicacion: "NO-APLICA"
  relacion_complemento: G5.familismo_obligacion.conducta  # celda hermana (ENUT, capa conductual) -- NO existe
                                                             # todavía en este directorio; abrirla es acto propio,
                                                             # no este (ver forense/notas/2026-08-11-e4b-sello-b-corrida-b.md §7)
