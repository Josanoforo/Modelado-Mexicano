# data/diseno-muestral.yaml — censo de diseño muestral del corpus
# ACTO M, 2026-08-04. Archivo NUEVO -- cero traslape con canon/, milpa/, tests/, manifiesto.
#
# Qué es. Un mapa de qué fuentes del corpus tienen su diseño muestral
# (ponderador, estrato, UPM -- unidad primaria de muestreo) YA
# documentado con cita verificable (archivo:línea de una nota forense,
# o archivo:hoja/fila de un documento de diseño abierto en este acto).
# Toda sesión limpia futura congela una especificación de medición
# CITANDO este archivo, sin volver a abrir el instrumento.
#
# Por qué existe. El PARO de PR #96 (ENCUP paso 2, ADR-46) mostró que
# "¿esta fuente tiene diseño muestral resoluble?" no se sabía para
# ENCUP -- ni para cuántas otras. Este acto responde esa pregunta una
# vez, para las 17 fuentes con payload en data/manifiesto.yaml, y deja
# nombradas (PENDIENTE) las 26 operables del catálogo que aún no
# tienen payload.
#
# estado (cuatro valores, sin un quinto informal):
#   MAPEADO               ponderador + estrato + upm, los tres con
#                         nombre de COLUMNA citado archivo:línea/fila.
#   SIN_DISEÑO_PUBLICADO   la fuente no publica (en este corpus) un
#                         documento que nombre las tres variables de
#                         diseño a nivel de columna -- puede traer
#                         caracterización cualitativa del diseño sin
#                         llegar a nombre de campo (ver notas).
#   PENDIENTE              no examinado, examinado sin resolver del
#                         todo (falta 1 de 3 campos), o payload
#                         registrado pero AUSENTE en este entorno.
#   NO_APLICA_REGISTRO_ADMINISTRATIVO  la fuente NO ES UNA MUESTRA -- es
#                         un censo/registro administrativo (p. ej. actas
#                         del Registro Civil): no hay factor de expansión
#                         porque no hay muestra que expandir. Se distingue
#                         de SIN_DISEÑO_PUBLICADO, que describe una
#                         encuesta cuyo diseño simplemente no se publica
#                         (esa sí debería tener diseño y no lo tiene;
#                         ésta no debería tenerlo porque no es muestral).
#                         Valor añadido por mesa, ACTO SELLA-AGO24-D,
#                         2026-08-24 (firma "5, agreguémosla" -> FP-116
#                         FIRMADA+ejecutada), aplicado primero a la fila
#                         EDR (ver su nota).
#   DISENO_EXPERIMENTAL   la fuente NO ES UNA MUESTRA PROBABILISTICA sino un
#                         EXPERIMENTO ALEATORIZADO de terceros: no hay
#                         ponderador/estrato/UPM porque no hay marco muestral
#                         que expandir -- hay BRAZOS de asignacion, y la
#                         inferencia corre sobre la unidad de aleatorizacion,
#                         no sobre la UPM de un diseno de muestreo. Se
#                         distingue de NO_APLICA_REGISTRO_ADMINISTRATIVO (que
#                         describe un censo/registro: tampoco es muestra, pero
#                         tampoco tiene asignacion) y de SIN_DISENO_PUBLICADO
#                         (encuesta que si deberia publicar diseno y no lo
#                         hace). Valor anadido por ACTO EVAL-COMPARTAMOS-LLAVE3,
#                         2026-08-25, firma de mesa verbatim (D2): "Valor
#                         propio, GO, pero asegurandonos que el motor lo
#                         soporta y que va ligado a lo que queremos construir."
#                         -> FP-123 FIRMADA+ejecutada.
#
#                         CRITERIO PROPIO -- que llena una fila DISENO_EXPERIMENTAL.
#                         Los tres campos heredados (ponderador/estrato/upm) se
#                         escriben "no aplica -- experimento" y NO se dejan
#                         vacios; encima de ellos, cinco campos propios, cada
#                         uno con CITA (archivo-dentro-del-zip, tabla del repo,
#                         o columna del microdato), y los cinco son obligatorios:
#                           1. unidad_y_nivel_aleatorizacion -- que objeto se
#                              sorteo (individuo/conglomerado/localidad), a que
#                              nivel, cuantas unidades por brazo, y si hay
#                              bloqueo/estratificacion del sorteo.
#                           2. brazos -- cuantos, como se llaman, y que recibio
#                              cada uno. Si hay mas de dos, se enumeran.
#                           3. variable_asignacion -- el NOMBRE DE COLUMNA en el
#                              microdato que porta la asignacion, verificado
#                              constante dentro de la unidad de aleatorizacion.
#                              Sin este campo la fila no es DISENO_EXPERIMENTAL:
#                              es un paquete de replica sin asignacion legible.
#                           4. cumplimiento_y_atricion -- las columnas que miden
#                              toma-del-tratamiento y perdida de seguimiento, con
#                              su universo; "el paquete no lo reporta" si no las
#                              trae, nunca silencio.
#                           5. cita_publicacion -- la referencia bibliografica del
#                              articulo que el paquete replica, con su procedencia
#                              (si el propio zip no la trae, se dice y se cita de
#                              donde sale).
#                         Lo que este estado NO hace: no estima ningun efecto, no
#                         adjudica llave de identificacion (eso vive en
#                         forense/registro-llaves-identificacion-v1_0.md) y no
#                         autoriza al motor a consumir el paquete.
#
# supuesto_varianza (campo, no estado -- alta de vocabulario, ACTO
# PACK-NUBE2-CIERRE-R101, 2026-08-25, ADR-183, ejecuta FP-118 FIRMADA):
# campo propio de una fila SIN_DISEÑO_PUBLICADO cuando mesa firma qué
# hacer con la falta de estrato/UPM para efectos de VARIANZA (no de
# estimación puntual, que no la necesita). No es un quinto valor de
# `estado` -- no se buscó token existente que sirviera (precedente
# FP-116) porque esto no describe la fuente, describe una decisión de
# mesa sobre cómo correr sobre ella; se declara aquí como campo nuevo
# en vez de forzarlo dentro de `notas`. Valores hoy: SRS_ASUMIDO
# (mesa firmó declarar explícitamente un supuesto de muestreo aleatorio
# simple para toda corrida que exija varianza, con la subestimación del
# error estándar escrita en la ficha de esa corrida).
#
# Lo que este archivo NO decide: qué fuente se usa para qué constructo
# (eso es mesa/fichas), ni si el payload existe en disco AHORA MISMO en
# TU entorno (para eso, tests/manifiesto.py --verifica sigue siendo la
# fuente de verdad -- este censo describe documentación, no presencia
# de archivo).
#
# COMMIT 1 (07aa541): mapa parcial de FASE A -- barrido de notas
# forenses ya escritas, cero instrumento abierto.
# COMMIT 2 (este): FASE B -- declarada por adelantado (ver
# forense/notas/2026-08-04-censo-diseno-muestral.md), abrió cuatro
# documentos de diseño ya presentes en el corpus (CPV, ENADID, ENNViH,
# ENOE). Esta sesión queda inhabilitada por ADR-46 para pre-registrar
# contra esas cuatro fuentes. Detalle exacto de qué se abrió, en la
# nota forense.
#
# Verificación de receta: python3 -c "import yaml; d=yaml.safe_load(open('data/diseno-muestral.yaml')); print(len(d))"
# debe imprimir 43 (17 fuentes con payload + 26 operables sin payload,
# derivadas de data/catalogo_unico.json el 2026-08-04 -- si el catálogo
# cambia, esta cifra puede cambiar; no se teclea de memoria, se deriva).

- fuente: ENCIG (Encuesta Nacional de Calidad e Impacto Gubernamental)
  estado: MAPEADO
  ponderador: 'FAC_P18 (edición 2023, confirmado también para 2021; nota: dos tablas específicas
    del cruce trámites usan ponderadores distintos, FAC_TRA para encig2023_04_sec_7 y FAC_P18
    para encig2023_05_sec_8 -- sin ponderador único documentado por INEGI para ESE cruce específico)'
  estrato: EST_DIS
  upm: UPM_DIS
  donde_vive: Las tres variables de diseño (FAC_P18/EST_DIS/UPM_DIS) viven embebidas como columnas
    dentro de cada tabla de microdatos de ENCIG (ej. conjunto_de_datos_encig2021_01_sec_11;
    encig2023_01_sec_11.csv; encig2023_01_sec1_A_3_4_5_8_9_10.csv), no en un catálogo de diseño
    separado -- confirmado repetidamente para las ediciones 2021 y 2023.
  procedencia: 'forense/notas/2026-08-04-x-condicionamiento-y-forma.md:147 ("Ponderador `FAC_P18`,
    estrato `EST_DIS`, UPM `UPM_DIS` — ambas tablas, misma edición 2023, unidas por `ID_PER`",
    dentro de la sección expresamente titulada ''### 1.2 · W2 — G1 · `confianza_institucional`
    (ENCIG 2023)''); corroborado por forense/notas/2026-08-04-w-coeficientes-generador-paso1.md:177
    ("Ponderador: `FAC_P18`. Estrato: `EST_DIS`. UPM: `UPM_DIS`.", mismo contexto ENCIG 2023,
    instrumento `encig2023_01_sec_11`/`encig2023_01_sec1_A_3_4_5_8_9_10`); y por forense/notas/2026-08-03-cal-conf-faseb-medicion.md:113-114
    ("tabla `conjunto_de_datos_encig2021_01_sec_11` (reactivo, ponderador `FAC_P18`, diseño
    `EST_DIS`/`UPM_DIS`)", edición 2021) y línea 264 ("UPM_DIS/EST_DIS (ENCIG, ENCUCI) ... como
    conglomerado y estrato de diseño reales"). Matiz sobre ponderador de una tabla específica
    en forense/hitoD-R3_2-veredicto-v1_0.md:84 (dos tablas del cruce trámites usan FAC_TRA vs
    FAC_P18, sin ponderador único declarado por INEGI para ese cruce puntual) y la llave primaria
    documentada en la misma nota, línea 86 (`CVE_ENT+UPM+V_SEL+R_ELE+N_TRA`, donde `UPM` aparece
    como campo de la llave de fila, distinto de `UPM_DIS` que es la variable de diseño para
    estimación de varianza).'
  notas: 'La pista del encargo (FAC_P18, FAC_TRA) se verificó: FAC_P18 es efectivamente el ponderador
    estándar de ENCIG a nivel persona/tabla (confirmado en múltiples notas independientes, ediciones
    2021 y 2023), y FAC_TRA aparece SOLO como ponderador alternativo de una tabla específica
    del cruce de trámites (encig2023_04_sec_7), sin que INEGI declare un ponderador único para
    ese cruce puntual (hitoD-R3_2-veredicto-v1_0.md:84). No confundir el campo `UPM` que aparece
    dentro de la llave primaria documentada de las tablas de trámites (`CVE_ENT+UPM+V_SEL+R_ELE+N_TRA`,
    hitoD-R3_2-veredicto-v1_0.md:86) con la variable de diseño `UPM_DIS` usada como PSU para
    estimación de varianza -- son nombres de campo distintos que conviven en el mismo instrumento;
    el censo reporta `UPM_DIS` como la UPM de diseño porque es la que las notas usan explícitamente
    para el estimador de conglomerado último. Se descartó como falso positivo cualquier mención
    de ENCIG que fuera solo de paso (ej. comparaciones de universo con TMod_Vic/ENVIPE en hitoD-R7_2-veredicto-v1_0.md:180,
    o el bloqueo de acceso narrado en 2026-07-29-d-bloqueo-encig.md, que documenta un intento
    fallido de alcanzar el sitio de INEGI, no datos de diseño muestral) -- ninguna de esas se
    usó como cita de resolución. Todas las citas usadas son inequívocamente sobre ENCIG mismo
    (nombran tablas, instrumentos y ediciones específicas de ENCIG), no menciones de paso dentro
    de notas sobre otra fuente. No se leyó ningún archivo dentro de data/raw/ ni ningún .pdf/.xlsx/.dta/.csv/.dbf
    -- toda la evidencia proviene de archivos .md dentro de forense/ (notas y de nivel superior)
    según la regla del encargo.'
