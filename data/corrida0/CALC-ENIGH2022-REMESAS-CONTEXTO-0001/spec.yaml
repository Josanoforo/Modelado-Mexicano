  - {id: RESULT-ENIGH22-REMCTX-N-COLUMNAS, tipo: entero, unidad: columnas}
  - {id: RESULT-ENIGH22-REMCTX-LLAVE-HOGAR-UNICA, tipo: texto, unidad: SI/NO}
  - {id: RESULT-ENIGH22-REMCTX-CATALOGOS-JSON, tipo: texto, unidad: JSON}
  - {id: RESULT-ENIGH22-REMCTX-TABLA-JSON, tipo: texto, unidad: JSON}
  - {id: RESULT-ENIGH22-REMCTX-CONTRASTES-JSON, tipo: texto, unidad: JSON}
  - {id: RESULT-ENIGH22-REMCTX-DISENO-JSON, tipo: texto, unidad: JSON}
  - {id: RESULT-ENIGH22-REMCTX-CONTROLES-JSON, tipo: texto, unidad: JSON}
