etiquetas:
  generacion: GEN2
  tipo: DUELO-TRANSFERENCIA-MISMA-GENERACION
  cuenta_gen2: SI
  validacion_independiente: NO-HECHA
  spec_sellada: forense/prereg-duelo-v2/F5-duelo-contemporaneo-spec-v1_0.md
  spec_sellada_sha256: 3cf3e49771a8bf99b77044c3aadaefbcc9347020db98fd1757ad4568d087bfcb
  demanda_que_releva: "Ninguna demanda de milpa/ -- este acto no adopta a ningun consumidor: adjudica (o, en este caso, declara INCONCLUSO) la tesis de transferencia de la misma generacion (#651, marcador INCONCLUSO que este duelo sucede)."
  reglas_bajo_prueba: "NINGUNA regla de milpa/tramite.yaml cambia de cifra por esta corrida -- este acto no toca milpa/ ni ningun consumidor. Lo que se adjudica es la comparacion L_SOLO vs L_CORPUS contra R, no una regla del motor."
  firma_de_contador: "FIRMA DE MESA 9/sep/2026 con OBJETO explicito, citada verbatim en el encargo archivado forense/encargos/2026-09-10-GEN2-F5-DUELO-CALC.md: «cuenta_gen2 = SI para el CALC del duelo que este acto selle -- el acto la escribe citando este parrafo; el merge la perfecciona». Estandar FP-367/368 satisfecho (autoridad + fecha + OBJETO)."
  contaminacion_declarada: "Las 96 capturas leidas por este medidor viven en el repo publico desde PR #669 (RECAPTURA-L) -- no hay blindaje de caja en este acto porque no hace falta: el CALC no genera nuevas capturas, solo lee las ya selladas. Los valores R de las 6 celdas tambien son publicos (CALC-R-CIV-M-*), consistente con que la ceguera de captura ya se garantizo en el acto anterior, no en este."
  medidor_ejecutado_al_congelar: "NO -- escrito y congelado en el COMMIT-1 de este acto, corrido en el COMMIT-2"
  hallazgo_principal: "El unico extractor de valor_extraido para prosa libre de corridas-L/ (tools/extrae_l_v1_1.py, sellado contra el formato de captura v1.1/v1.2) no fue validado contra el formato real-corpus de las capturas v1_3 -- 0/96 capturas de las 6 celdas con arbitro traen el encabezado 'estimacion' que ese extractor busca, y el fallback a documento-completo captura, en los casos verificados a mano, cifras de contexto que el propio texto declara explicitamente que NO son la estimacion pedida. RESULT-DUELO-PAREADA-VEREDICTO-ADOPTADO = INCONCLUSO por esta razon, distinta de la fila 'universo vacio o n<3' que la spec sellada preveia -- ENMIENDA fechada, declarada en RESULT-DUELO-PAREADA-RAZON-VEREDICTO-ADOPTADO."

