  challenger_diferido: C3-LCORPUS
  criterio_indecidible_verbatim: si ambos caen dentro del IC de R o si |d_L-d_M| < 0.5*EE(R)
  criterio_indecidible_fuente: forense/CAREO-ADV-DUELO-diseno-v2-2026-08-19.md:38
  ee_r_formula: (IC95sup - IC95inf)/3.92
  umbral_celdas_gana: 6
  umbral_celdas_puntuadas: 6
  precedencia: si dos filas se satisfacen, manda INDECIDIBLE
  paradas_admisibles:
  - ADJUDICADA
  - INDECIDIBLE
  - SIN-CANDIDATO-SUPERIOR
  - FUERA-DE-SOPORTE
  b_bis_c1: si nadie vence a C1 -> la persistencia queda corroborada como piso en DIN
  b_bis_c2: 'si nadie vence a C2 -> los candidatos ensayados no superaron este piso, bajo esta evaluacion, en estas
    ocho celdas. Eso es TODO lo que dice (H5): no identifica ausencia de interaccion, ni ausencia de informacion
    aprovechable por otros metodos, ni una propiedad de la poblacion.'
  limite_de_la_evaluacion: si el ganador se ELIGE con las ocho celdas, esa misma evaluacion no lo valida de forma
    independiente (H5, fila 7 de la tabla fundida). El resultado se reporta como seleccion mas desempeno conjunto,
    nunca como desempeno independiente del ganador.
  p_nacional_c5: 0.357153
  p_nacional_c5_fuente: milpa/tramite.yaml:1312 -- clase DERIVADO, sin IC propio; no es MEDIDO
  c5_rol: COMPLEMENTO / diagnostico puro; fuera de la competencia porque el emisor es el arbitro con otro nombre
    (tramite.yaml:712)
  champion: NINGUNO
  adopcion: NINGUNA
  tol_oro_0001: 1.0e-10
secuencia_commits:
  commit_2: corrida0 run de CALC-ENIF2024-PISOS-AHORRO-INFORMAL-LXE-0001; sello; asiento de replay; commit y push.
  commit_3a: 'commit aparte: rellena el sha256 de piso_c2_resultados y piso_c2_sello; preflight VERDE. Ninguna otra
    linea cambia.'
  commit_3: corrida0 run de este CALC; sello; celda-D; decisiones.tsv; asientos.
  preflight_esperado_antes_del_commit_3a: BLOQUEADO exactamente por los dos inputs del piso -- y por nada mas.
