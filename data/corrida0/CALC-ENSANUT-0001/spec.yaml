  - {id: RESULT-ENSANUT-G-N-FILAS-ADULTOS, tipo: entero, unidad: "filas (personas) de adultos_ensanut2024_w.dta (milpa declara 12924)"}
  - {id: RESULT-ENSANUT-G-N-COLUMNAS-A0927, tipo: entero, unidad: "columnas del bloque a0927 presentes (se esperan 20: a0927{a..e}{1..4})"}
  - {id: RESULT-ENSANUT-G-SOPORTE-A0927, tipo: texto, unidad: "soporte observado del bloque a0927, ordenado: 'v:n;v:n' -- emitido ANTES de aplicar el mapa de mencion"}
  - {id: RESULT-ENSANUT-G-PERFIL-EST-SEL, tipo: texto, unidad: "perfil de anchos del texto crudo de est_sel"}
  - {id: RESULT-ENSANUT-G-PERFIL-ESTRATO, tipo: texto, unidad: "perfil de valores de `estrato` (urbanidad/ruralidad) -- DESCRIPTIVO: no estratifica el bootstrap"}
  - {id: RESULT-ENSANUT-G-PERFIL-UPM, tipo: texto, unidad: "perfil de anchos del texto crudo de upm"}
  - {id: RESULT-ENSANUT-G-N-ESTRATOS-UPM-UNICA, tipo: entero, unidad: "estratos est_sel con exactamente una UPM"}
  - {id: RESULT-ENSANUT-A-N-MENCIONES, tipo: entero, unidad: "menciones afirmativas del bloque a0927 (milpa declara 254)"}
