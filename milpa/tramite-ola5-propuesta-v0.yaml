# COMMIT-1 (veredicto A.4): ¿existe en ENCIG 2025 un ítem que distinga
# trámite con registro/testigo/digital vs presencial-discrecional?
# EXISTE-SATISFACE. Item: P7_3, sección VII ("¿A qué tipo de lugar
# acudió o a qué medio recurrió para realizar el trámite o pago?"),
# encig25_estructura_base_datos.pdf página 54 (extraído con pypdf,
# 72 páginas leídas completas). Categorías: 1=instalaciones de gobierno,
# 2=banco/super/tienda, 3=líneas telefónicas, 4=Internet (página web,
# apps), 5=cajero automático/kiosco, 6=módulos/oficinas móviles,
# 7=no concluido, 8=otro, 9=no sabe. Archivo examinado completo (A.13):
# encig2025_04_sec_7.csv (124314 filas, todas leídas).
#
# COMMIT-2: mide p condicionada por canal, JOIN a nivel TRÁMITE (no
# persona) entre sec_7 (P7_3, canal) y sec_8 (P8_4, "¿en cuál de los
# trámites se suscitaron las circunstancias [de corrupción ya
# declaradas en sección VIII]?", Sí/No por trámite). Detalle completo
# de la deduplicación (10597 duplicados exactos en sec_7), el filtro de
# universo (P8_4 solo válido para 21139 de 1083672 trámites -- gateado
# por P8_3_1/_2/_3 a nivel persona) y la clasificación de categorías
# (1=presencial vs 3/4/5=digital-registrado, excluyendo 2/6/7/8/9 por
# ambigüedad) en codificacion-R-v1_0.tsv (TRA-M-13 digital, TRA-M-14
# presencial) y en tools/calibracion_mordida_encig_serie.py.
#
# Ponderador es FAC_TRA (trámite), NO FAC_P18 (persona) -- unidad de
# análisis distinta de P1/P2 arriba. Declarado, no se homologa: TRA-M-13/
# 14 no son comparables punto-a-punto con la serie de 8 olas de arriba.
# ══════════════════════════════════════════════════════════════════
  - id: tramite.mordida.con_registro_encig2025
    enmienda_propuesta: true
    nota_enmienda: >
      Enmienda propuesta a la regla EXISTENTE de milpa/tramite.yaml:87-95
      (misma id base tramite.mordida.con_registro, p=0.12 ASIGNADO,
      disparadores sancion_creible=true/quien_observa=registro_o_testigos).
      Mapeo operacional declarado (juicio de este acto, no dictado por el
      dato): "registro_o_testigos" ≈ canal con registro automático de la
      transacción (P7_3 en {3 líneas telefónicas, 4 Internet, 5 cajero/
      kiosco}); "nadie observa" (regla discrecional) ≈ P7_3=1 (ventanilla
      presencial en instalaciones de gobierno). Es un mapeo razonable, no
      el único posible -- declarado como tal, tier PENDIENTE-DE-MESA.
    situacion: realiza_tramite_gobierno
    si:
      disparadores: PENDIENTE-DE-MESA  # ver nota_enmienda: el mapeo
        # canal-digital=registro_o_testigos es un supuesto operacional de
        # este acto, no un disparador verificado en el dato
    entonces:
      - {conducta: paga_mordida_canal_digital_encig2025, p: 0.027358, clase: "MEDIDO·p(tasa base ponderada, condicional a canal)"}
      - {conducta: tramite_normal_canal_digital_encig2025, p: 0.972642, clase: "MEDIDO·p(tasa base ponderada, condicional a canal)"}
    porque: {generador: [G1], mecanismo: "el registro rompe la trampa social"}
      # mecanismo copiado literal de la regla ASIGNADA que se enmienda
    tier: SELLADA  # ACTO MAESTRA34-N4 · PLOMERIA-v1_2, firma DM (1/sep/2026) -- sustituye a milpa/tramite.yaml:tramite.mordida.con_registro (enmienda_encig2025); tier FUERTE en el motor.
    falsable_si: "Si la digitalización no reduce la mordida, la hipótesis de trampa social falla"  # heredado del texto ASIGNADO que enmienda
    fuente: ["ENCIG2025", "codificacion-R-v1_0.tsv::TRA-M-13", "codificacion-R-v1_0.tsv::TRA-M-14"]
    ola_calibracion: "ENCIG 2025 (única ola con esta variable de canal examinada por este acto; no se buscó en 2021 por no hacer falta -- P7_3 ya EXISTE-SATISFACE en 2025)"
    ic95: [0.018670, 0.037891]
    n: 6337
    ponderador: FAC_TRA
    universo: "trámites (no personas) con P8_4 válido (0/1) Y P7_3 en {3,4,5} -- ver cabecera arriba y TRA-M-13 para detalle completo de join/dedup/filtro. n_efectivo=6337, estratos=361, UPM=2514."
    companero_presencial:
      # NO es una regla del motor -- cifra de comparación/contexto, misma
      # unidad de análisis, ver TRA-M-14.
      p: 0.116000
      ic95: [0.102671, 0.131105]
      n: 9937
      estratos: 381
      upm: 2992
      lectura: "canal presencial (P7_3=1) mide 11.60% vs 2.74% del canal digital/registrado -- razón ~4.2x, IC95 SIN traslape, en la dirección que predice el mecanismo 'el registro rompe la trampa social' de la regla que se enmienda."
    hallazgo: "Ambos ASIGNADOS de milpa/tramite.yaml (0.62 discrecional, 0.12 con_registro) quedan refutados en magnitud absoluta por esta medición trámite-nivel igual que por la serie persona-nivel de P1/P2 -- pero el ORDEN relativo que el motor asigna (discrecional > con_registro) SÍ se confirma empíricamente aquí, con brecha grande y significativa (11.60% vs 2.74%, IC95 sin traslape). Es el primer apoyo empírico directo -- de escala y de orden -- para el mecanismo 'trampa social: el registro rompe la trampa social' que la regla con_registro ya declaraba sin medir. Reserva: el mapeo canal→disparador (nota_enmienda) es un supuesto de este acto, no verificado contra el dato; P8_4 solo se pregunta a un subconjunto de trámites (los de personas que ya declararon alguna práctica de corrupción en sección VIII), así que esta p NO es 'p(mordida en este trámite | canal)' sobre el universo completo de trámites, sino sobre el subconjunto ya auto-seleccionado por P8_3 -- declarado, no resuelto por este acto."
    sha256_payload: "47daf2f732366ad842b7f60c784be9d61db68a00ae1a693980ec6a683e0d9e12"
    payload_manifiesto_id: encig25_base_datos_csv

