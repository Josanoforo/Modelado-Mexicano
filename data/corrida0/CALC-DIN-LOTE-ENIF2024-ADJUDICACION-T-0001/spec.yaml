        sin seguridad social: RESULT-C2R-ENIF2024-AHORRA-SOLO-INFORMAL-CUENTA-FORMALXFORMALIDAD-SIN-CUENTA-X-SIN-SEGURIDAD-SOCIAL-P
        con seguridad social: RESULT-C2R-ENIF2024-AHORRA-SOLO-INFORMAL-CUENTA-FORMALXFORMALIDAD-SIN-CUENTA-X-CON-SEGURIDAD-SOCIAL-P
      con cuenta:
        sin seguridad social: RESULT-C2R-ENIF2024-AHORRA-SOLO-INFORMAL-CUENTA-FORMALXFORMALIDAD-CON-CUENTA-X-SIN-SEGURIDAD-SOCIAL-P
        con seguridad social: RESULT-C2R-ENIF2024-AHORRA-SOLO-INFORMAL-CUENTA-FORMALXFORMALIDAD-CON-CUENTA-X-CON-SEGURIDAD-SOCIAL-P
  regla_v0_3: 'v0.3: dMAE = MAE(C2) - MAE(R2) en pp sobre las celdas PUNTUADAS de los 5 pares primarios,
    IC95 por réplica (misma réplica k en R, C2 y R2); VENCE-RETADOR si IC95inf > 0.5 pp; PROPUESTA-CON-RESERVA
    si 0 < IC95inf <= 0.5; NADIE-VENCE si incluye 0. Retador primario R2 (lambda = 1/2 fija); P2, R1,
    R3, L1, L2 y los 9 pares no primarios se adjudican con la misma regla rotulados SECUNDARIA. El conteo
    de 3/4 se reporta, no adjudica.'
