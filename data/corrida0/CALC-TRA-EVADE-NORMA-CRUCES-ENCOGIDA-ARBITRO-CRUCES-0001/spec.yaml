secuencia_commits:
  fuente: 'Precedente de la casa (piloto 1/2/3): COMMIT-2 emisiones selladas, R no existe -> COMMIT-3a
    fija sha de las emisiones ya selladas en ESTE spec.yaml (la unica edicion admitida) -> COMMIT-3 R
    y adjudicacion. E.6 se conserva: R se deriva DESPUES de fijar el arbitro.'
  commit_2: 'OTRA sesion: corrida0 run CALC-TRA-EVADE-NORMA-CRUCES-ENCOGIDA-EMISIONES-0001; sella; vista
    y replay (E.7); commit y push.'
  commit_3a: 'La misma sesion del COMMIT-2, en commit aparte y ANTES de derivar R: escribe en este spec.yaml
    la llave sha256 de emisiones_resultados/emisiones_sello (huellas de los archivos recien sellados)
    y verifica preflight VERDE. Ninguna otra linea cambia.'
  commit_3: 'corrida0 run CALC-TRA-EVADE-NORMA-CRUCES-ENCOGIDA-ARBITRO-CRUCES-0001: deriva R por celda
    de los cuatro cruces, soporte 2025, adjudicacion, DeltaMAE con IC, B-bis por cruce y agregado; sella;
    vista y replay.'
  preflight_esperado_antes_del_commit_3a: BLOQUEADO exactamente por input_repo_ausente/input_repo_no_commiteado
    de emisiones_resultados y emisiones_sello -- y por nada mas.
