  - {archivo: "Enut2014.zip/TMODULO3.dbf", variable: "P6_15_n_1..5", rol: "ítems 6.15 (2014)"}
  - {archivo: "Enut2014.zip/TMODULO2.dbf", variable: "TLOC, UPM_DIS, EDIS, FAC_PER", rol: "localidad, diseño (EDIS = estrato) y ponderador (2014)"}
  - {archivo: "Enut2014.zip/TMODULO1.dbf", variable: NIV, rol: "eje-escolaridad 2014 (0-9)"}
  - {archivo: "Enut2014.zip/TSDem.dbf", variable: "SEXO, EDAD", rol: "ejes sexo/edad 2014 (join por CONTROL+VIV_SEL+HOGAR+N_REN)"}
  - {archivo: "Enut2014.zip/THOGAR.dbf", variable: FAC_VIV, rol: "ponderador de hogar 2014 (no existe FAC_HOG; variante declarada)"}
  - {archivo: TModulo2.dbf, variable: "P5_11_n_1..5, P5_12_n_1..5, P5_13_n_1..5", rol: "ítems 5.11-5.13 (2009)"}
  - {archivo: TCuidados.dbf, variable: "P5_10_n_1..5, N_REF", rol: "ítems 5.10 por dependiente, sumados por cuidador (2009)"}
  - {archivo: TModulo2.dbf, variable: "LOC, EST_DIS, UPM_DIS, FAC_PER", rol: "localidad (2 = rural), diseño y ponderador (2009)"}
  - {archivo: TSDem.dbf, variable: "SEXO, EDAD, NIV", rol: "ejes 2009 (NIV 0-9 catálogo 2009)"}
  - {archivo: THogar.dbf, variable: FAC_VIV, rol: "ponderador de hogar 2009"}
universo: "Personas de 12 años y más con registro en la tabla del módulo de la base nacional de la ola (2024 TMODULO; 2019 enut_2019/TMODULO; 2014 Enut2014.zip/TMODULO2; 2009 TModulo2), incluidas las que no declaran ninguna hora (aportan 0). Las tablas _indígena/_PI no entran (extracción, no muestra adicional; P1). Hogares: todos los que tienen al menos una persona en el universo."
filtros: "Sale de todas las celdas, contado y no imputado: FAC_PER ausente, no numérico o ≤ 0 (N-SIN-PONDERADOR). Sale sólo del eje afectado: código de SEXO/EDAD/NIV/TLOC(LOC) inválido o ausente (FUERA-*). Hogar sin ponderador de hogar sale de la razón, contado. Tiempo en blanco = 0 y se cuenta (SI-SIN-TIEMPO). Miembro o columna ausente → ReservaRota (la corrida no sella)."
ponderador: "FAC_PER de la tabla del módulo para las medias; hogar: FAC_HOG (2024 tsdem, 2019 THOGAR) o FAC_VIV (2014 THOGAR, 2009 THogar) — variante de ponderador declarada en P1 (C4)."
transformacion: "Por persona y variante: horas = Σ ítems de ITEMS[ola][variante] con h_LV + min_LV/60 + h_SD + min_SD/60. Media ponderada Σw·y/Σw por celda de UN eje; razón C4 por hogar. 2024 además: CONCP = Σ cuatro *_CON_CP de tvar_crea; validación = |Σ ítems TODOS del bloque − *_CON_CP del bloque| por persona; oro = razón CONCP con SEXO/EDAD de tvar_crea y FAC_HOG de tsdem vs RESULT-ENUT-A-R sellado."
estimando: "DESCRIPTIVO, olas que completan la serie: ENUT 2014 (NUCLEO y MIN) y ENUT 2009 (MIN) por celda de eje, con IC95, y razón C4 por variante. Sólo para el origen móvil RETROSPECTIVA-MECÁNICA y las series de P4; todas las variantes entran (firma de dirección §2)."
seed: {aplica: true, valor: 42, rng: numpy.PCG64}
parametros:
  bootstrap_replicas: 10000
  metodo_ic: "bootstrap de UPM_DIS con reemplazo dentro de EST_DIS conservando el número de UPM por estrato; percentiles 2.5/97.5; UN plan de réplicas por frame (personas; hogares aparte, misma semilla); estrato con UPM única se re-muestrea a sí mismo (varianza cero, no se colapsa)"
  horas_por_item: "h_LV + min_LV/60 + h_SD + min_SD/60; blanco o no numérico = 0 y se cuenta en *-SI-SIN-TIEMPO cuando el ítem es Sí; sin tope"
  ejes: "nacional · sexo{1 hombre, 2 mujer} · edad{12-17, 18-29, 30-39, 40-59, 60+} · escolaridad homologada{hasta_primaria, secundaria, media_superior, superior} · localidad{urbano, rural} — UNA variable por celda (guardia 3D: celdas_de_eje + auditoría AST R1-R6 antes de abrir el zip)"
  items_por_variante: "tools/enut_nucleo.py::ITEMS, transcripción de data/enut-comparabilidad-texto-v1_0.tsv (C2, C3), cotejada por tests/test_enut_nucleo_conducto.py"
  razon_c4: "Σ_h w_h·num_h / Σ_h w_h·den_h sobre hogares con ponderador (0/0 dentro), num = horas de mujeres 40+; emitida SÓLO nacional; escala [0,1], nunca se compara con las medias (PARO b)"
  fuera_del_eje: "código inválido o ausente sale sólo del eje afectado (RESULT FUERA-*); FAC_PER no positivo sale de todas las celdas (N-SIN-PONDERADOR)"
  dbf: "campos leídos del descriptor del DBF como texto (dbfread, latin-1); 2014 vive en el zip anidado Enut2014.zip; 2009 TCuidados trae una fila por par cuidador×dependiente y se suma por cuidador antes del join 1:1"
