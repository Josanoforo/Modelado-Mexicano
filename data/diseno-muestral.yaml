# ACTO RECENSO-DISEÑO-2 (2026-08-24, ADR-153) -- re-derivación de FP-117 y alta
# de las llaves con payload material que la re-derivación confirmó, cruzando
# data/manifiesto.yaml (host de url_origen / slug /programas/<slug>/ de INEGI)
# contra las filas ya existentes arriba (script: scratchpad/deriva.py, no
# commiteado, reproducible con el comando documentado en la cabecera de este
# archivo mas el criterio de host/slug). La cifra de FP-117 era 37; la
# re-derivación de hoy da 13 llaves reales -- ver forense/notas/2026-08-24-recenso-diseno-2.md
# §1 para la conciliación completa (duplicados ya cubiertos por filas
# existentes -- ENSANUT/LAPOP -- y hosts administrativos/documentales que no
# son una encuesta muestral nombrada quedan fuera, no cuentan como "llave").
- fuente: ENGASTO (Encuesta Nacional de Gasto de los Hogares) 2012-2013
  estado: MAPEADO
  ponderador: 'FACTOR_VIV (columna FACTOR_VIV en la tabla vivienda, "Factor de expansión de la
    vivienda") y FACTOR_HOG (columna factor_hog en la tabla hogar, "Factor de expansión del
    hogar"), ambos N(5). Universo: vivienda y hogar respectivamente.'
  estrato: EST_DIS ("Estrato de diseño muestral", C(4) -- estratos de la segunda etapa, grupos
    de UPM por estrato geográfico entidad-ámbito-zona). NO confundir con EST_SOCIO ("Estrato
    socioeconómico"), campo distinto que convive en la misma tabla.
  upm: UPM (C(5) -- unidad primaria de muestreo, primera etapa del muestreo, agrupación de
    viviendas con límites geográficos identificables)
  donde_vive: Las cuatro variables viven como columnas de las tablas `vivienda.dbf` (EST_SOCIO,
    EST_DIS, UPM, FACTOR_VIV) y `hogar.dbf` (factor_hog) de ambas ediciones (2012 y 2013), dentro
    de `data/raw/engasto2012/` y `data/raw/engasto2013/` (vivienda_dbf.zip / hogar_dbf.zip,
    viviendas_dbf.zip / hogar_dbf.zip respectivamente).
  procedencia: 'data/raw/engasto2012/engasto12_fd.pdf (Ficha Descriptiva 2012, extraída con
    pdftotext -layout), definiciones a nivel de campo #66-69 y #161: línea 1909 ("#66 est_socio:
    Estrato socioeconómico"), línea 1937 ("#67 est_dis: Estrato de diseño muestral" -- "Son los
    estratos seleccionados en la segunda etapa del muestreo y corresponden a grupos de UPMs de
    acuerdo con su estrato geográfico (entidad-ámbito-zona)"), línea 1948 ("#68 upm: Unidad
    primaria de muestreo" -- "constituidas por agrupaciones de viviendas... seleccionadas en la
    primera etapa del muestreo"), línea 1965 ("#69 factor_viv: Factor de expansión de la
    vivienda"), línea 3818 ("#161 factor_hog: Factor de expansión del hogar"). Corroborado por
    línea 239-247 (sección "1.2.3 Factor de expansión": "En la ENGASTO 2012 hay dos factores de
    expansión, uno asociado a la vivienda... y otro asociado al hogar").'
  notas: 'La edición 2013 NO tiene FD propia en el corpus (solo los archivos de datos). Verificación
    cruda con tests/dbfmini.py sobre vivienda_dbf.zip/viviendas_dbf.zip de ambas ediciones: los
    nombres de columna de diseño (EST_SOCIO, EST_DIS, UPM, FACTOR_VIV) son byte-idénticos entre
    2012 y 2013 -- no se infirió el diseño de 2013 "por parecido", se confirmó identidad de
    columnas y se aplica la misma FD porque describe exactamente esas columnas, no un instrumento
    distinto. Si mesa prefiere una fila separada para 2013 hasta tener su propia FD, es una
    decisión de alcance, no de hecho: la estructura es idéntica. 46 payloads en data/manifiesto.yaml
    (host /programas/engasto/), 0 sin fila tras esta alta.'
