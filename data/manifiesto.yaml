# data/manifiesto.yaml — procedencia de dato externo usado en el corpus
# Convención: se commitea el manifiesto y el checksum, nunca el payload.
# El payload (CSV/ZIP crudo) vive en data/raw/, ignorado por git.
#
# Esquema ampliado 2026-07-30 (tests/manifiesto.py, cola I-08):
#   archivo           ruta relativa dentro de data/raw/; sin este campo
#                     --verifica no puede localizar el payload.
#   entorno_descarga  derivado por --registra al momento de registrar, nunca
#                     pedido por parámetro. Las dos entradas de payload de
#                     abajo son anteriores a este campo y a este script (se
#                     registraron a mano el 29/jul); no se les fabrica un
#                     valor retroactivo que nadie derivó entonces.
#
# Campo opcional url_origen_procedencia (30/jul, --promueve): presente solo
# en entradas que --promueve movió desde data/manifiesto-staging.yaml sin
# que el autor confirmara url_origen -- declara de dónde salió el valor
# ("derivada de <página guardada>", "asignada vía --grupo/--url en
# --escanea", o "no derivada" si url_origen quedó en "no determinada") y
# dice explícitamente NO CONFIRMADA POR EL AUTOR. Una entrada sin este
# campo tiene url_origen declarada por quien la registró (--registra).
#
# Campo opcional raiz (31/jul, tres raíces): el NOMBRE de la raíz donde vive
# el payload -- data_raw (integrada, repo/data/raw/), descargas_mx, downloads,
# o lo que declare data/raices.local.yaml (gitignorado -- la ruta real nunca
# se commitea, ni aquí ni ahí). Ausente = data_raw: las entradas de payload
# anteriores a este campo no se migran con un valor retroactivo.

