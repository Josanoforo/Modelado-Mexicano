schema_version: MOCIBA-flujo-documental-1-v1_0
estado: DEFINICION-RESUELTA · M-NO-ELEGIBLE · FIRMA-Y-R-CERRADOS
llamadas_autorizadas: false
apertura_R_autorizada: false
microdatos_autorizados: false
estimaciones_autorizadas: false
unidad: persona seleccionada del módulo
clasificador: forense/produccion/mociba-flujo-documental-1/clasifica_elegibilidad.py
salidas_elegibilidad: [ELEGIBLE, NO-ELEGIBLE, INDETERMINADO]
orden_filtros:
  - campo: EDAD
    operador: ">="
    valor: 12
    falso: NO-ELEGIBLE
    ausente_o_no_especificado: INDETERMINADO
  - campo: P7_1
    operador: "=="
    valor: 1
    etiqueta: Sí usó internet en los últimos tres meses
    falso_codigo_2: NO-ELEGIBLE
    ausente_o_invalido: INDETERMINADO
  - campos: P4_01..P4_13
    operador_entrada_P12: ANY_EQ
    valor_entrada: 1
    operador_salto_P13: ALL_IN
    valores_salto: [2, 9]
    bateria_incompleta_sin_un_si: INDETERMINADO
    codigo_fuera_de_1_2_9_sin_un_si: INDETERMINADO
    nota: Un 1 observado basta para abrir P5-P12 aunque otros P4 estén ausentes.
desenlace:
  campo: P12_5
  texto: Denunciar ante el Ministerio Público o policía
  naturaleza_instrumento: >-
    Opción 05 de una pregunta multirrespuesta de hasta tres códigos; el FD la
    expande a indicador P12_5.
  codigos:
    evento: [1]
    no_evento: [2]
    no_sabe_no_responde: "P12_99=1; no existe código 9/99 dentro de P12_5"
    rechazo: NO-DOCUMENTADO-COMO-CODIGO-P12_5
    salto: ausencia estructural cuando la fila no pertenece al universo P12
    blanco_2021: NO-DOCUMENTADO-COMO-CODIGO-EN-FD
    blanco_2022: [b]
  precedencia_no_respuesta: P12_99=1 excluye del denominador de respuestas válidas
denominadores:
  todos_elegibles:
    definicion: Cumple edad y P7_1 y tiene al menos un P4_01..P4_13=1.
    incluye_respuesta_ausente: true
    uso: base para declarar cobertura/no respuesta; no convierte faltantes en no-evento
  respuestas_validas:
    definicion: Todos los elegibles con P12_5 en {1,2} y sin P12_99=1.
    uso: >-
      denominador del estimando descriptivo entre respondentes. Debe nombrarse
      así y publicarse junto con elegibles totales/no respuesta; no es una tasa
      entre todos los elegibles.
fuera_universo:
  regla: Nunca se codifica como P12_5=2 ni como no denunció.
  respuesta_estado: NO-APLICA-ESTRUCTURAL
ponderacion_y_diseno:
  ponderador: FACTOR
  campos_documentados: [UPM_DIS, EST_DIS]
  alcance: >-
    El FD documenta nombres y etiquetas; este acto no afirma que basten para un
    estimador de varianza ni autoriza cálculo alguno.
