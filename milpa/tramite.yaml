# rules/tramite.yaml — Dominio: autoridad, trámite, relación con el Estado
dominio: tramite
version: "0.3.0"

# ══════════════════════════════════════════════════════════════════
# CAMBIOS v0.2.0 → v0.3.0  ·  4 de agosto de 2026 (ENCARGO MT-mantenimiento)
# ══════════════════════════════════════════════════════════════════
#   1. TODO `p:` GANA `clase: ASIGNADO`. Ninguna probabilidad de este YAML
#      tenía marca de procedencia -- exactamente el mismo defecto que
#      milpa-spec §5.1 documenta para `civico.voto.clientelar` (una cifra
#      de laboratorio viajando sin declarar que lo era, hasta que alguien
#      la leyó como si fuera de campo). Las 10 probabilidades de este
#      archivo (5 reglas × 2) no son de laboratorio ni de campo medido --
#      son ASIGNADAS por mesa, sin calibración (ver `nota_calibracion`,
#      que no se toca: es el mismo hecho dicho en prosa). Un número sin
#      clase es el peor lugar para él justo donde un motor lo consumiría
#      literal. Conteo derivado con comando, ver mensaje del commit que
#      introduce este cambio.
# ══════════════════════════════════════════════════════════════════

# ══════════════════════════════════════════════════════════════════
# CAMBIOS v0.1.0 → v0.2.0  ·  28 de julio de 2026
# ══════════════════════════════════════════════════════════════════
#   1. TIERS CORREGIDOS. Las cuatro reglas venían marcadas tier: FUERTE.
#      El motor (modelo §3.3) dice FUERTE · FUERTE · MEDIA · MEDIA-FUERTE.
#      Las dos de gobierno digital estaban INFLADAS. Un tier inflado en el
#      YAML es el mismo defecto que las reglas fantasma del Hito 2, sólo que
#      una capa más abajo y sin nadie que lo lea.
#   2. REGLA AUSENTE RESTITUIDA: tramite.evasion_norma (modelo §3.3, [MEDIA]).
#      El dominio tiene 4 reglas en el motor y el YAML sólo compilaba 3 de
#      ellas (la cuarta era el espejo de otra, no una regla propia).
#   3. REFERENCIA COLGANTE ELIMINADA: fuente "modelo:7.1" apuntaba al §7 del
#      modelo v1 —la extensión de esta regla a crédito—, que el cambio 11 del
#      v2 RETIRÓ. Citar la fuente retirada reintroduce el alcance retirado.
#   4. Alcance explícito: esta regla vale para GOBIERNO DIGITAL, no para
#      crédito ni para productos financieros privados.
# ══════════════════════════════════════════════════════════════════

reglas:
  - id: tramite.mordida.discrecional
    situacion: realiza_tramite_gobierno
    si:
      disparadores: {sancion_creible: false, quien_observa: "nadie"}
    entonces:
      # REFUTADA-POR-R (ACTO MAESTRA34-N4 · PLOMERIA-v1_2, 1-2/sep/2026,
      # firma DM «Si eso da eso da») -- ADR-270/ADR-276: la serie de 8 olas
      # ENCIG 2011-2025 (enmienda_encig2025 abajo) mide 4.45%-8.51%, siempre
      # muy por debajo. Se conserva como historia -- NO se borra --, se
      # sustituye por el MEDIDO de abajo en el cálculo del motor.
      - {conducta: paga_mordida, p: 0.62, clase: ASIGNADO}
      - {conducta: tramite_normal, p: 0.38, clase: ASIGNADO}
      # ── ENMIENDA ENCIG2025 · firma DM (1/sep/2026) · ACTO MAESTRA34-N4 ──
      # Sustituye el 0.62 ASIGNADO de arriba: serie de 8 olas ENCIG
      # 2011-2025, ola 2025 (más reciente) como θ informativa, copiada
      # verbatim de milpa/tramite-ola5-propuesta-v0.yaml:461+
      # (id tramite.mordida.discrecional_encig_serie). Desambiguada por
      # sufijo _encig2025 -- mismo patrón que la enmienda ENCUCI2020 de
      # abajo, por la misma razón: emisor.py:476-479 devuelve la PRIMERA
      # coincidencia.
      - {conducta: paga_mordida_encig2025, p: 0.085118, clase: "MEDIDO·p(tasa base ponderada)"}
      - {conducta: tramite_normal_encig2025, p: 0.914882, clase: "MEDIDO·p(tasa base ponderada)"}
      # ── ENMIENDA ENCUCI · FP-200=b (mesa, 31/ago/2026) · ACTO MAESTRA32-E20 ──
      # Las DOS salidas de arriba NO se tocan: siguen ASIGNADAS y siguen siendo
      # lo que emitir_binaria devuelve para `paga_mordida`/`tramite_normal`
      # ("texto original de la regla intacto", encargo). Las dos de abajo son la
      # enmienda MEDIDA que FP-200=b sella, con p/IC/fuente/universo/ponderador/
      # ola_calibracion copiados verbatim de milpa/tramite-ola5-propuesta-v0.yaml
      # (ADR-236). La `conducta` va desambiguada por ola porque
      # milpa/src/emisor.py:476-479 devuelve la PRIMERA coincidencia: sin sufijo,
      # la enmienda seria inverificable por el smoke con el original intacto.
      # Desviacion declarada ANTES de correr en
      # forense/notas/2026-08-31-lote-nube-1-spec.md §P0(b). Si mesa prefiere
      # SUSTITUCION en vez de convivencia, es firma nueva y acto nuevo.
      - {conducta: paga_mordida_encuci2020, p: 0.125822, clase: "MEDIDO·p(tasa base ponderada)"}
      - {conducta: tramite_normal_encuci2020, p: 0.874178, clase: "MEDIDO·p(tasa base ponderada)"}
    porque: {generador: [G1], mecanismo: "trampa social: cada quien paga porque supone que los demás pagan"}
    tier: FUERTE
    falsable_si: "Si al digitalizar y agregar testigos la mordida no baja, no es trampa social sino otra cosa"
    fuente: ["ENCIG2023", "Rothstein_trampa_social", "report:politica"]
    enmienda_encuci2020:
      sellada_por: "FP-200=b (mesa, 31/ago/2026) -- ACTO MAESTRA32-E20 · LOTE-NUBE-1"
      origen: "milpa/tramite-ola5-propuesta-v0.yaml:107-138 (ADR-236), copiada verbatim"
      aplica_a: [paga_mordida_encuci2020, tramite_normal_encuci2020]
      desenlace: "AP5_17|AP5_18 -- compuesto: 1 si AP5_17=1 o AP5_18=1 (procedencia.yaml:888)"
      ponderador: FAC_SEL
      ola_calibracion: "ENCUCI 2020 (unica ola)"
      ic95: [0.116323, 0.135544]
      n: 13435
      universo: "SEC_4_5 con contacto declarado AP5_16_1..10>=1 -- procedencia.yaml:888-889 (n≈13435 de 21519), re-verificado contra microdato 2026-08-31, n exacto reproducido"
      si_propuesto: {contacto_declarado: true}
      nota_si_propuesto: >
        La propuesta proponia este disparador para la regla enmendada. NO se
        aplica al bloque `si:` de arriba: el encargo manda dejar el texto
        original de la regla intacto, y `si.disparadores` es texto original.
        Queda declarado aqui, sin efecto sobre el motor, para que mesa lo vea.
      hallazgo: "0.1258 (IC95 [0.1163,0.1355]) es compatible con el techo de 13.38% ya citado en procedencia.yaml:785 (hitoD-R3.2, 'techo medido 13.38%, no 62%') sobre el mismo payload ENCUCI -- el 0.62 ASIGNADO de arriba sigue sin apoyo empirico de escala; esta enmienda no lo sustituye, convive con el."
      sha256_payload: "0414fd59e2afcc36294530687c721e8e86bd04e76ad95bfce4b7b2e70853f283"
      payload_manifiesto_id: encuci2020_bd_dbf
    enmienda_encig2025:
      sellada_por: "firma DM (1/sep/2026, «Si eso da eso da») -- ACTO MAESTRA34-N4 · PLOMERIA-v1_2"
      origen: "milpa/tramite-ola5-propuesta-v0.yaml:461-509 (id tramite.mordida.discrecional_encig_serie), copiada verbatim"
      aplica_a: [paga_mordida_encig2025, tramite_normal_encig2025]
      sustituye: "ASIGNADO 0.62/0.38 de arriba -- queda REFUTADA-POR-R, no se borra"
      ola_calibracion: "ENCIG 2025 (más reciente de 8 olas disponibles; las otras 7 van en serie_olas, NO promediadas)"
      ic95: [0.080935, 0.089260]
      n: 40042
      ponderador: FAC_P18
      universo: "sección VIII de ENCIG 2025 (encig2025_01_sec1_A_3_4_5_8_9_10.csv), variable P8_3_1 (y=1 si '1' Sí, y=0 si '2' No, 9 No-sabe y resto fuera); 40136 filas leídas, 94 fuera de universo, n_efectivo=40042."
      serie_olas:
        - {ola: 2011, p: 0.068328, ic95: [0.060955, 0.076391], n: 23784, estratos: 116, upm: 6544,  ponderador: FAC_P18, metodo: "bootstrap-conglomerado (ACTO MAESTRA34-L1)", variable: P4_11, sha256_payload: "5af6cb24a476a310e7906c42b1bb86d7084ba0a821226bac0bbbf4c0af6f7ca6", payload_manifiesto_id: encig_2011_base_datos_encig2011_dbf}
        - {ola: 2013, p: 0.044538, ic95: [0.038969, 0.050107], n: 22081, estratos: 180, upm: 6510,  ponderador: FAC_P18, metodo: "R-json (TRA-M-03, ya público)", variable: P8_3, sha256_payload: "48d29d560d3836309af61c4a82d46d8338d58ecb9d14d04ffc947c1e087caf1a", payload_manifiesto_id: encig_2013_encig13_base_datos_dbf}
        - {ola: 2015, p: 0.047684, ic95: [0.043130, 0.052521], n: 26417, estratos: 268, upm: 7415,  ponderador: FAC_P18, metodo: "bootstrap-conglomerado (ACTO MAESTRA34-L1)", variable: P8_3, sha256_payload: "656b258288ab67a378af3ea358bb2b8325251247e30cf82123d851c726203a0e", payload_manifiesto_id: encig2015_csv}
        - {ola: 2017, p: 0.077024, ic95: [0.072671, 0.081378], n: 39085, estratos: 357, upm: 9138,  ponderador: FAC_P18, metodo: "R-json (TRA-M-05, ya público)", variable: P8_3_1, sha256_payload: "fdc7f1c761bf871872bd04080d59c2b58f38f78d6e6384b4a7df82e909d33465", payload_manifiesto_id: encig2017_csv}
        - {ola: 2019, p: 0.084484, ic95: [0.079530, 0.089737], n: 39454, estratos: 358, upm: 9170,  ponderador: FAC_P18, metodo: "bootstrap-conglomerado (ACTO MAESTRA34-L1)", variable: P8_3_1, sha256_payload: "61f49f6149729a7f22c4a64310dd894ec645ebe8b40110cac3fb32125a6ed979", payload_manifiesto_id: encig2019_csv}
        - {ola: 2021, p: 0.071815, ic95: [0.067118, 0.076512], n: 39763, estratos: 353, upm: 9190,  ponderador: FAC_P18, metodo: "R-json (TRA-M-07, ya público)", variable: P8_3_1, sha256_payload: "c92ea34c7c57237c49ca3d8d99382e340b5939c371ce820332876f7c4c62c56a", payload_manifiesto_id: encig2021_csv}
        - {ola: 2023, p: 0.072863, ic95: [0.068865, 0.076988], n: 38838, estratos: 347, upm: 8928,  ponderador: FAC_P18, metodo: "bootstrap-conglomerado (ACTO MAESTRA34-L1)", variable: P8_3_1, sha256_payload: "4e3839cd90613fa7dd0f9a123d7636f017a2b8d08a98377a7a04459032bc2611", payload_manifiesto_id: encig2023_datosabiertos_csv}
        - {ola: 2025, p: 0.085118, ic95: [0.080935, 0.089260], n: 40042, estratos: 442, upm: 9172,  ponderador: FAC_P18, metodo: "bootstrap-conglomerado (ACTO MAESTRA34-L1)", variable: P8_3_1, sha256_payload: "47daf2f732366ad842b7f60c784be9d61db68a00ae1a693980ec6a683e0d9e12", payload_manifiesto_id: encig25_base_datos_csv}
      hallazgo: "Serie completa de 8 olas (2011-2025, 15 años): rango 4.45%-8.51%, sin tendencia monótona clara, SIEMPRE muy por debajo del 0.62 ASIGNADO -- confirma y extiende ADR-270 (que solo citaba 3 olas)."
      sha256_payload: "47daf2f732366ad842b7f60c784be9d61db68a00ae1a693980ec6a683e0d9e12"
      payload_manifiesto_id: encig25_base_datos_csv

  - id: tramite.mordida.con_registro
    situacion: realiza_tramite_gobierno
    si:
      disparadores: {sancion_creible: true, quien_observa: "registro_o_testigos"}
    entonces:
      # REFUTADA-POR-R (ACTO MAESTRA34-N4 · PLOMERIA-v1_2, firma DM «Si eso
      # da eso da») -- se conserva como historia, no se borra.
      - {conducta: tramite_normal, p: 0.88, clase: ASIGNADO}
      - {conducta: paga_mordida, p: 0.12, clase: ASIGNADO}
      # ── ENMIENDA ENCIG2025 · firma DM (1/sep/2026) · ACTO MAESTRA34-N4 ──
      # Sustituye el 0.12 ASIGNADO de arriba. Mapeo canal↔disparador
      # (aceptado por firma DM, ii): presencial (P7_3=1) ≈ "nadie observa"
      # (disparador de la regla discrecional, no de esta); digital/
      # registrado (P7_3 en {3,4,5}) ≈ "registro_o_testigos" (disparador
      # de esta regla). Copiado verbatim de
      # milpa/tramite-ola5-propuesta-v0.yaml:551-576
      # (id tramite.mordida.con_registro_encig2025 + companero_presencial).
      # CORRIDA 1 (1/sep, firma DM) -- presencial VENCIDA EN ALCANCE por 0.000817 y digital CORRECCION SIN CAMBIO MATERIAL (ACTO MAESTRA35-L1, ADR-291); sustituidas en el cálculo por la corrida 2 de abajo por coherencia de corrida (firma r1, mesa 2/sep/2026, ACTO MAESTRA35-N4). Se conservan como historia, no se borran.
      - {conducta: paga_mordida_encig2025_presencial, p: 0.116000, clase: "MEDIDO·p(tasa base ponderada, condicional a canal)"}
      - {conducta: tramite_normal_encig2025_presencial, p: 0.884000, clase: "MEDIDO·p(tasa base ponderada, condicional a canal)"}
      - {conducta: paga_mordida_encig2025_digital, p: 0.027358, clase: "MEDIDO·p(tasa base ponderada, condicional a canal)"}
      - {conducta: tramite_normal_encig2025_digital, p: 0.972642, clase: "MEDIDO·p(tasa base ponderada, condicional a canal)"}
      # CORRIDA 2 (2/sep, recorrida sin deduplicar, firma r1) -- ACTO MAESTRA35-N4 · SELLA-L1
      - {conducta: paga_mordida_encig2025_presencial_r2, p: 0.141041, clase: "MEDIDO·p(tasa base ponderada, condicional a canal, sin deduplicar)"}
      - {conducta: tramite_normal_encig2025_presencial_r2, p: 0.858959, clase: "MEDIDO·p(tasa base ponderada, condicional a canal, sin deduplicar)"}
      - {conducta: paga_mordida_encig2025_digital_r2, p: 0.029868, clase: "MEDIDO·p(tasa base ponderada, condicional a canal, sin deduplicar)"}
      - {conducta: tramite_normal_encig2025_digital_r2, p: 0.970132, clase: "MEDIDO·p(tasa base ponderada, condicional a canal, sin deduplicar)"}
    porque: {generador: [G1], mecanismo: "el registro rompe la trampa social"}
    tier: FUERTE
    falsable_si: "Si la digitalización no reduce la mordida, la hipótesis de trampa social falla"
    fuente: ["ENCIG2023", "report:politica"]
    enmienda_encig2025:
      sellada_por: "firma DM (1/sep/2026, «Si eso da eso da») -- ACTO MAESTRA34-N4 · PLOMERIA-v1_2"
      origen: "milpa/tramite-ola5-propuesta-v0.yaml:551-576 (id tramite.mordida.con_registro_encig2025), copiada verbatim"
      aplica_a: [paga_mordida_encig2025_presencial, tramite_normal_encig2025_presencial, paga_mordida_encig2025_digital, tramite_normal_encig2025_digital]
      sustituye: "ASIGNADO 0.12/0.88 de arriba -- queda REFUTADA-POR-R, no se borra"
      mapeo_canal_disparador:
        digital_registrado: {p7_3: [3, 4, 5], disparador: "registro_o_testigos", ic95: [0.018670, 0.037891], n: 6337, estratos: 361, upm: 2514}
        presencial: {p7_3: [1], disparador: "nadie observa (comparación -- regla discrecional)", ic95: [0.102671, 0.131105], n: 9937, estratos: 381, upm: 2992}
      ola_calibracion: "ENCIG 2025 (única ola con esta variable de canal examinada por MAESTRA34-L1; P7_3 EXISTE-SATISFACE en 2025)"
      ponderador: FAC_TRA
      universo: "trámites (no personas) con P8_4 válido (0/1) Y P7_3 en {1,3,4,5} -- join sec_7 (P7_3, canal) x sec_8 (P8_4, corrupción por trámite); detalle en codificacion-R-v1_0.tsv (TRA-M-13 digital, TRA-M-14 presencial)."
      hallazgo: "canal presencial mide 11.60% vs 2.74% del canal digital/registrado -- razón ~4.2x, IC95 sin traslape, en la dirección que predice 'el registro rompe la trampa social'. Reserva: P8_4 solo se pregunta a un subconjunto ya auto-seleccionado por P8_3 -- no es p(mordida|canal) sobre el universo completo de trámites."
      sha256_payload: "47daf2f732366ad842b7f60c784be9d61db68a00ae1a693980ec6a683e0d9e12"
      payload_manifiesto_id: encig25_base_datos_csv
    enmienda_encig2025_r2:
      sellada_por: "firma r1 (mesa, 2/sep/2026) -- ACTO MAESTRA35-N4 · SELLA-L1"
      origen: "milpa/tramite-ola5-propuesta-v0.yaml:589-672 (enmienda_maestra35_l1), copiada verbatim"
      aplica_a: [paga_mordida_encig2025_presencial_r2, tramite_normal_encig2025_presencial_r2, paga_mordida_encig2025_digital_r2, tramite_normal_encig2025_digital_r2]
      sustituye: "corrida 1 (139-142): deduplicacion por ID_TRA que descarto 3 835 eventos; la llave ID_TRA es unica en sec_8 y el join es uno-a-muchos exacto"
      mapeo_canal_disparador:
        digital_registrado: {p7_3: [3, 4, 5], disparador: "registro_o_testigos", p: 0.029868, ic95: [0.021133, 0.040452], n_eventos: 7219, id_tra_distintos: 6384, estratos: 362, upm: 2518}
        presencial: {p7_3: [1], disparador: "nadie observa (comparación -- regla discrecional)", p: 0.141041, ic95: [0.116817, 0.169579], n_eventos: 11167, id_tra_distintos: 9992, estratos: 381, upm: 2996}
      razon_presencial_digital: 4.7222
      sensibilidad_A: {digital: [4, 5], p: 0.025078, ic95: [0.015990, 0.036467], razon: 5.6241}
      que_estaba_mal: >
        No la llave del join, como el encargo suponía: la DEDUPLICACIÓN.
        MAESTRA34-L1 dedujo sec_7 por ID_TRA creyendo -- y escribiéndolo en
        TRA-M-13 -- que las filas repetidas eran «duplicados EXACTOS, mismos
        valores en P7_3/FAC_TRA/EST_DIS/UPM_DIS». Contado por el censo P0 de
        este acto sobre sec_7 completo: de los 7 430 ID_TRA repetidos, 501
        DIFIEREN en P7_3, y solo 5 860 de 18 027 filas repetidas son idénticas
        en todo lo demás. No eran duplicados: eran eventos de trámite distintos
        del mismo tipo hechos por la misma persona, que es para lo que existe
        NT_TIPO. La deduplicación borró 3 835 eventos del universo de medición.
      ola_calibracion: "ENCIG 2025 (recorrida sin deduplicar, ACTO MAESTRA35-L1)"
      ponderador: FAC_TRA
      universo: "eventos de trámite con P8_4 ∈ {0,1}, ENCIG 2025, SHA 57a365e"
      sha256_payload: "47daf2f732366ad842b7f60c784be9d61db68a00ae1a693980ec6a683e0d9e12"
      payload_manifiesto_id: encig25_base_datos_csv

  - id: tramite.gobierno_digital.coercitivo
    situacion: le_ofrecen_servicio_gobierno_digital
    si:
      disparadores: {cobertura_formal: false}
      contexto_producto: {coercitivo: true, riesgo_fiscal_percibido: true}
    entonces:
      # SIN DATO POR DEFECTO DE LA FUENTE -- EXISTE-NO-SATISFACE en ENCIG 2025 (ACTO MAESTRA34-L5 P0/P2, ADR-287): ninguna de 483 columnas de 2025 ni ~100 000 de cinco olas distingue obligatoriedad del canal; P7_3=7 es fracaso, no rechazo; cobertura_formal:false selecciona fuera del universo (sección VII solo la contesta quien hizo el trámite). No se propone sucesor en ENCIG. Queda como único prior ASIGNADO vigente sin dato al cierre de MAESTRA35-N1.
      - {conducta: rechaza_servicio, p: 0.91, clase: ASIGNADO}
      - {conducta: adopta, p: 0.09, clase: ASIGNADO}
    porque: {generador: [G1], mecanismo: "la utilidad predice adopción; la coerción con riesgo fiscal la mata"}
    tier: MEDIA-FUERTE          # corregido en v0.2.0 · el motor §3.3 dice MEDIA-FUERTE, no FUERTE
    alcance: "gobierno digital ÚNICAMENTE (cambio 11 del modelo v2)"
    falsable_si: "Si un servicio coercitivo con riesgo fiscal lograra adopción masiva, la regla se rompe"
    fuente: ["validacion:CoDi", "report:tecnologia"]
    nota_validacion: "Backtest: CoDi = 3.09M cuentas con >=1 transacción en 6 años."
    sin_dato_universo_examinado:
      # firma c1 (mesa, 2/sep/2026, CORREGIDA sobre su primera redaccion), sobre
      # ACTO MAESTRA35-L6 -- ADR-297. La regla SIGUE SIN DATO y el contador S1
      # SIGUE EN 1. p y tier NO se tocan (ASIGNADO 0.91/0.09, MEDIA-FUERTE) y el
      # backtest CoDi se queda. NO se declara "hueco de mundo": se declara un
      # universo EXAMINADO con su veredicto, y nada sobre el que no se examino.
      declarado_por: "firma c1 (mesa, 2/sep/2026) -- ACTO MAESTRA35-L6 · FUENTE-COERCITIVO-Y-PUENTE"
      firma_verbatim: >
        la regla sigue SIN DATO y el contador S1 sigue en 1. Clasificacion con
        universo declarado (A.4/A.10): NO-ENCONTRADO en encuestas de hogares del
        corpus -- ENCIG 2011-2025 (ADR-287), ENDUTIH 2023/2024/2025, ENIF 2024,
        ENCUCI 2020, serie CoDi (este acto: 7 piezas, 7 veredictos con refutador
        independiente) -- por defecto de universo de ESAS fuentes: la situacion
        solo se observa donde la conducta ya ocurrio. NO-ACCESIBLE en las dos
        fuentes que si tendrian denominador de obligacion (SAT: obligados vs
        cumplidores de buzon tributario/e.firma; CNGF), sondeadas y sin respuesta
        desde la caja. No se afirma nada sobre el universo no examinado.
      adr: [ADR-287, ADR-297]
      veredicto: NO-ENCONTRADO
      universo_examinado_encuestas_de_hogares:
        # SIETE instrumentos. Cada linea dice que se abrio y con que se conto.
        - {instrumento: "ENCIG 2011-2025 (8 olas)", adr: ADR-287, examinado: "483 columnas de 2025 y ~100 000 de cinco olas", veredicto: EXISTE-NO-SATISFACE}
        - {instrumento: "ENDUTIH 2023", adr: ADR-297, examinado: "FD 1 099 filas + tic_2023_usuarios.DBF, 229 variables, N=58 922", veredicto: EXISTE-NO-SATISFACE}
        - {instrumento: "ENDUTIH 2024", adr: ADR-297, examinado: "FD 477 variables en 5 tablas + 5 DBF, N=58 080", veredicto: EXISTE-NO-SATISFACE}
        - {instrumento: "ENDUTIH 2025", adr: ADR-297, examinado: "FD 8 hojas + ti25usu.dbf, 239 variables, N=57 810", veredicto: EXISTE-NO-SATISFACE}
        - {instrumento: "ENIF 2024", adr: ADR-297, examinado: "cuestionario 32 pag./2 534 lineas + FD 398 variables + TMODULO.csv, 13 502 personas 18+", veredicto: EXISTE-NO-SATISFACE}
        - {instrumento: "ENCUCI 2020", adr: ADR-297, examinado: "FD_ENCUCI2020.pdf 4 006 lineas/422 073 caracteres + 5 DBF, 458 campos (54+164+156+50+34), 21 519 personas", veredicto: NO-ENCONTRADO}
        - {instrumento: "serie CoDi/Banxico", adr: ADR-297, examinado: "cuentas_validadas_x_mil_hab_trimestral.xlsx 3 hojas 2022-T1..2026-T1 + HTML de avances", veredicto: "EXISTE-NO-SATISFACE (serie agregada: unidad cuenta, no persona)"}
      defecto_de_universo_de_esas_fuentes: >
        Uno solo: la SITUACION solo se observa donde la CONDUCTA ya ocurrio. En
        ENCIG, la seccion VII solo la contesta quien hizo el tramite (ADR-287
        iii). En ENDUTIH, P7_36_1 -- "declaracion de impuestos" por internet,
        el unico item de tramite fiscal explicito del corpus -- esta
        autoseleccionado al 100 % a quien ya interactuo con el gobierno en
        linea, medido por cruce sobre el DBF entero: 16 362/16 362 en 2025,
        15 557 en 2024, 15 083 en 2023. En ENIF, P5_15_2 esta gateado DOS veces
        (tener el producto Y haberlo comparado), asi que la adopcion vale 1 en
        todo su universo. En ENCUCI 2020, cero aciertos de fiscal|impuest|SAT|
        contribuy|RFC sobre las 4 006 lineas del FD, con control positivo
        confian=79. Y un faltante propio de ENDUTIH que ADR-287 no tenia: NO HAY
        DENOMINADOR DE OBLIGACION FISCAL -- ni RFC, ni regimen, ni condicion de
        contribuyente en 239 variables --, asi que P7_36_1=2 mezcla "rechaza el
        canal" con "no esta obligado a declarar". Es "fracaso != rechazo" un
        nivel mas arriba: NO OBLIGADO != RECHAZA.
      no_accesible:
        veredicto: NO-ACCESIBLE
        fuentes: >
          Las dos que SI tendrian denominador de obligacion: SAT (obligados vs
          cumplidores de buzon tributario / e.firma) y CNGF.
        sondas_con_codigo_crudo:
          # Se reportan crudas porque el codigo por si solo enganiaria: las dos
          # dieron 200 y ninguna de las dos entrego contenido legible desde la
          # caja, que es exactamente lo que hace el veredicto NO-ACCESIBLE.
          - {url: "https://www.sat.gob.mx", http_code: 200, curl_exit: 0, cuerpo: "1 477 bytes: shell de una SPA SvelteKit, SIN <title> y SIN texto; todo se renderiza por JavaScript"}
          - {url: "https://www.inegi.org.mx/programas/cngf/", http_code: 200, curl_exit: 0, cuerpo: "321 bytes: stub de redireccion por JavaScript; el programa vive en /programas/cngf/2025/ y su unidad de analisis son INSTITUCIONES, no personas (ficha RNM 1145)"}
          - {url: "https://datos.gob.mx (CKAN)", http_code: 404, curl_exit: 35, cuerpo: "1/sep/2026; NO se reintento -- el encargo ordena no reintentar sin ruta nueva"}
      universo_no_examinado: >
        No se afirma NADA sobre el. Este veredicto cubre exactamente los siete
        instrumentos de arriba y las tres sondas; fuera de ahi, el acto no
        midio y no opina.
      siguiente_universo_declarado: >
        Fuentes ADMINISTRATIVAS (SAT/CNGF), por navegador o por solicitud de
        transparencia -- no por sonda desde la caja, que ya se agoto. Receta
        para mesa en data/cola-adquisicion-v1_0.tsv, filas INEGI_CNGF y
        SAT_MEXICO (ACTO MAESTRA35-L6, P3).
      tablero: >
        "S1 = 1 · NO-ENCONTRADO en 7 instrumentos + 2 NO-ACCESIBLE" (firma c1).
        NO se dice "hueco de mundo" y NO se dice "S1 = 0": el contador no se
        mueve, y lo que se gana es el universo declarado del negativo.
      estampa_A10: >
        Describe el corpus del 2/sep/2026. ENDUTIH publica cada anio y ENIF cada
        tres: una ola futura puede anadir el reactivo que falta y este veredicto
        caduca. Lo que caduca es el veredicto sobre la fuente, no el defecto de
        diseno que lo produce.
      falsador_de_reapertura: >
        Si aparece una fuente con DENOMINADOR DE OBLIGACION (SAT, CNGF, o una
        ola futura de encuesta de hogares que lo traiga), la regla se reabre.

