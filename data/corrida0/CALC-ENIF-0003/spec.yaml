  - {archivo: "TMODULO.csv", variable: UPM_DIS, rol: "UPM -- LLAVE OPACA", codigos: "Alfanumerico(5), cadena cruda"}

universo: >-
  ENIF 2024 (INEGI), TMODULO.csv, unidad = persona elegida 18+. P3: TODAS las
  filas (recuentos) y las filas con FAC_PER finito > 0 (fracciones
  ponderadas). P4: D0_k = filas con FAC_PER valido y P4_10 = k (k = 1, 2,
  {3,4,5}); U_A_SIN = P3_13 = '7' y P4_10 en {1..5}; U_A_CON = P3_13 en
  {1,2,3,4} y P4_10 en {1..5} (los universos del lote ENIF-1, verbatim).

filtros: >-
  Filas sin FAC_PER valido: fuera de toda proporcion ponderada, dentro de los
  recuentos, contadas (G-N-SIN-FAC-PER). Codigos fuera de dominio en P3_13 o
  P4_10: contados, no imputados. Filas sin EST_DIS o UPM_DIS: fuera del
  bootstrap, dentro del punto. CERO NUNCA SUSTITUYE FALTA DE DATO. Miembro o
  columna ausente -> ESTADO NO-ESTIMABLE-*; cero filas ->
  NO-ESTIMABLE-UNIVERSO-VACIO.

ponderador: >-
  FAC_PER para toda proporcion ponderada; los recuentos y las fracciones
  NO-PONDERADAS no llevan ponderador, por construccion (es lo que GEN1
  calculo). Texto convertido a flotante despues.

transformacion: >-
  Lectura como CALC-ENIF-0001 (utf-8-sig con caida a latin-1 declarada, toda
  celda como cadena strip). ninguna_via = todas las P5_1_1..6 != '1' y todas
  las P5_6_1..9 != '1' ('2' y 'b' cuentan como no). Fracciones = conteo/n o
  suma(w*1[.])/suma(w). Veredictos al segundo decimal por round(100*x, 2) y a
  seis por round(x, 6). Bootstrap de UPM_DIS dentro de EST_DIS, 1000
  replicas, percentiles 2.5/97.5; estrato de UPM unica se re-muestrea a si
  mismo. NO se promedia, no se imputa, no se re-escala.

estimando: >-
  DESCRIPTIVO. P3: recuentos y siete fracciones de cobertura con veredictos
  mecanicos contra 68.97 / 67.53 / 68.06 / 66.89 / 0.668937 y contra la
  hipotesis H1 (66.89 = universo triple sin ponderar). P4: COTAS de la
  fraccion de 'no tiene ahorros' dentro de P4_10 = 1 (proxy 'ninguna via en
  12 meses', que no es equivalente y se declara asi), con contraste en
  P4_10 = 2 y {3,4,5} y en los universos del lote. NINGUN RESULT ES CAUSAL,
  ninguno adopta ni cambia un corte: la adjudicacion de NC-0126 es de mesa.

dependencias_materiales: [numpy]

