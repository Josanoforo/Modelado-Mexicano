    FAC_ELE finito > 0 -> ese, contado en
    N-HOGARES-FAC-ELE-RESUELTO-POR-UNICA-VALIDA; (3) ambiguo -> fuera de U4,
    contado en N-U4-FAC-ELE-AMBIGUO. EST/UPM: solo la rama (1); si hay mas de
    un par, la persona entra al punto sin diseno (N-U4-DISENO-AMBIGUO).
  regla_estrato_upm_unica: >-
    Un estrato con una sola UPM se re-muestrea a si mismo, no se colapsa ni se
    descarta; si el conteo es > 0, METODO-IC = IC-CON-ESTRATOS-DE-UPM-UNICA y
    el IC es LIMITE INFERIOR.
  llaves_opacas: EST y UPM como texto strip, nunca int() ni zfill(); perfil observado en G-PERFIL-DISENO-PERSONAS.
