  - {archivo: "encig2023_04_sec_7.csv", variable: CVE_ENT, rol: "componente de la llave primaria DECLARADA por el descriptor (guardia G-2, no bloqueante)", codigos: "Numerico(2) 01..32"}
  - {archivo: "encig2023_04_sec_7.csv", variable: UPM, rol: "componente de la llave primaria DECLARADA (guardia G-2). NO es UPM_DIS y NO se usa para el bootstrap", codigos: "Alfanumerico"}
  - {archivo: "encig2023_04_sec_7.csv", variable: V_SEL, rol: "componente de la llave primaria DECLARADA (guardia G-2)", codigos: "Numerico"}
  - {archivo: "encig2023_04_sec_7.csv", variable: R_ELE, rol: "componente de la llave primaria DECLARADA (guardia G-2)", codigos: "Alfanumerico"}
  - {archivo: "encig2023_05_sec_8.csv", variable: P8_4, rol: "DESENLACE -- reactivo 8.4, en cual de los tramites se suscitaron las anteriores circunstancias; vive SOLO en sec_8", codigos: "Numerico(1), mapa heredado de la v1.0 §2.2: 1=Si, 0=No, b=blanco. OJO: el 'no' es 0, NO 2. Soporte fuera de {0,1,blanco} -> NO-ESTIMABLE-CODIGO-FUERA-DE-MAPA:P8_4", direccion: "1 si P8_4=1; 0 si P8_4=0. MAS ALTO = MAS MORDIDA DECLARADA EN ESE TRAMITE"}
  - {archivo: "encig2023_05_sec_8.csv", variable: ID_TRA, rol: "LLAVE PRIMARIA DEL JOIN desde sec_7 (guardia G-4: de su unicidad depende que el join sea uno-a-muchos exacto)", codigos: "Alfanumerico -- cadena cruda"}
  - {archivo: "encig2023_05_sec_8.csv", variable: ID_VIV, rol: "componente 1/4 de la LLAVE DE CONTROL (guardia G-5)", codigos: "Alfanumerico"}
  - {archivo: "encig2023_05_sec_8.csv", variable: ID_PER, rol: "componente 2/4 de la LLAVE DE CONTROL (guardia G-5)", codigos: "Alfanumerico"}
  - {archivo: "encig2023_05_sec_8.csv", variable: N_TRA, rol: "componente 4/4 de la LLAVE DE CONTROL (guardia G-5)", codigos: "Numerico(2)", direccion: "NO-APLICA (nominal)"}
  - {archivo: "encig2023_05_sec_8.csv", variable: FAC_P18, rol: "NO-USADA, DECLARADA A PROPOSITO -- es el ponderador que SI trae sec_8, sobre el universo de persona 18+, y es EXACTAMENTE el que un medidor que resuelva el ponderador por nombre sobre la tabla unida tomaria sin avisar. La guardia G-6 comprueba que quedo sin usar", codigos: "Numerico", direccion: "NO-APLICA (no entra en ningun estimando)"}

universo: >-
  ENCIG 2023 (INEGI), payload encig23_base_datos_csv
  (sha256 af733d867a568cbb0dadef4a5a793b02488a71728d1157860f14501f3d4c393d,
  38309647 bytes, manifiesto 29/jul/2026), miembros encig2023_04_sec_7.csv y
  encig2023_05_sec_8.csv. NINGUN otro miembro del ZIP se abre, y ninguno de los
  cuatro gemelos RData/DBF/DTA/SAV entra, ni como respaldo ni como contraste.
  U_B, unidad EVENTO DE TRAMITE: filas de sec_7 emparejadas con sec_8 por
  ID_TRA, con P8_4 en {0,1} y FAC_TRA finito > 0.
  Rama SD (PRIMARIA), sin deduplicar: cada fila de sec_7 es un evento y entra
  una vez -- NT_TIPO existe en sec_7 de 2023 precisamente para distinguir
  eventos repetidos del mismo tipo, y colapsarlos borra lo que el instrumento
  capto a proposito. Rama CD (SECUNDARIA), deduplicando sec_7 por ID_TRA y
  conservando la primera fila en orden de archivo: existe SOLO para que el par
  2023 sea comparable con el par CD de 2025; no es primaria y no se adopta.
  Canal presencial = P7_3=1; digital_registrado = P7_3 en {3,4,5}; el residuo
  P7_3 en {2,6,7,8,9,blanco} se cuenta y se pesa, NO se reasigna.
  RESERVA HEREDADA Y NO RESUELTA: P8_4 pregunta por «las anteriores
  circunstancias» (las del reactivo 8.3) y por lo tanto se plantea sobre un
  subconjunto AUTO-SELECCIONADO. Se cuenta (B-COBERTURA, B-N-SEC7-SIN-PAREJA) y
  se declara; NO se corrige, porque corregirlo exigiria un universo que el
  instrumento no da. Si la cobertura es baja, el estimando no es
  p(mordida|canal) sobre el universo de tramites sino p(este tramite fue el
  senalado | tramite de alguien que ya declaro en 8.3), y se rotula asi.
  La estampa de universo del payload 2025 (82 areas urbanas de 100 mil
  habitantes o mas) NO se transporta a 2023: el manifiesto no la declara para
  este payload y esta spec NO la afirma. El RESULT G-UNIVERSO-DECLARADO emite
  lo que el propio microdato permita censar, sin heredar la frase de otra ola.

filtros: >-
  Sale de U_B, CONTADO y no imputado: fila con P8_4 blanco o no numerico
  (B-N-P84-BLANCO); fila con FAC_TRA vacio, no finito o <= 0
  (B-N-SIN-PONDERADOR); fila de sec_7 sin pareja en sec_8 (B-N-SEC7-SIN-PAREJA).
  Sale del brazo pero NO del universo, contado y pesado: P7_3 fuera del par de
  canal (B-N-RESIDUO-CANAL / B-P-RESIDUO-CANAL).
  Se cuenta pero NO sale del punto: fila sin EST_DIS o sin UPM_DIS
  (B-N-SIN-DISENO) -- afecta al IC, no al estimador.
  CERO NUNCA SUSTITUYE FALTA DE DATO. Blanco, 9 y no numerico se cuentan aparte
  y salen del denominador; no se imputan. NO-APLICA es un valor y se escribe.
  Guardias que producen NO-ESTIMABLE en vez de una cifra: miembro ausente del
  ZIP -> NO-ESTIMABLE-MIEMBRO-AUSENTE:<m>; columna declarada ausente ->
  NO-ESTIMABLE-COLUMNA-AUSENTE:<col> (incluida FAC_TRA, que NO tiene sustituto:
  FAC_P18 de sec_8 jamas la reemplaza); columna existente sin ningun valor
  valido -> NO-ESTIMABLE-COLUMNA-VACIA:<col>; P8_4 o P7_3 con soporte fuera de
  su mapa -> NO-ESTIMABLE-CODIGO-FUERA-DE-MAPA:<col>; ID_TRA NO UNICA en sec_8,
  o desacuerdo entre la llave primaria y la llave de control ->
  NO-ESTIMABLE-LLAVE-NO-UNICA y las ramas de B NO se estiman (no se deduplica
  sobre la marcha, no se toma la primera fila, no se elige otra llave);
  universo o brazo vacio -> NO-ESTIMABLE-UNIVERSO-VACIO. Si TODA fila carece de
  diseno -> B-METODO-IC = NO-ESTIMABLE-DISENO-INCOMPLETO, los IC salen null y
  el punto se reporta igual.

ponderador: >-
  FAC_TRA leido de encig2023_04_sec_7.csv -- POR ARCHIVO, NO POR NOMBRE. Es el
  hecho central 1 de la spec sellada y no un detalle de implementacion: sec_8
  NO trae FAC_TRA, trae FAC_P18, que es otro ponderador sobre otro universo
  (persona de 18 anos y mas seleccionada). Un medidor que resolviera el
  ponderador por nombre de variable sobre la tabla unida tomaria el equivocado
  SIN AVISAR y produciria una cifra plausible, del orden correcto y falsa.
  Flotante tal cual: sin normalizar, sin redondear, sin truncar. Ningun otro
  ponderador entra en ningun estimando de esta spec, y si FAC_TRA falta el
  RESULT sale NO-ESTIMABLE-COLUMNA-AUSENTE:FAC_TRA -- NO hay sustituto.

transformacion: >-
  Lectura de los dos miembros con el lector declarado; EST_DIS, UPM_DIS, ID_TRA,
  ID_VIV, ID_PER y NT_TIPO con dtype=str. Join sec_7 x sec_8 por ID_TRA
  (llave primaria), con la llave de control (ID_VIV, ID_PER, ID_TRA, N_TRA)
  computada EN PARALELO: su desacuerdo es un RESULT, no una correccion.
  d = 1 si P8_4=1, 0 si P8_4=0.
  p(U) = suma(w*d)/suma(w) sobre cada brazo, w = FAC_TRA, sumas en ORDEN FIJO
  DE FILA. Los complementos (B-P-NORMAL-*) se cuentan DIRECTAMENTE sobre d == 0
  sobre el MISMO denominador, NUNCA como 1 - p, y B-SUMA-* emite la suma como
  prueba mecanica de que el brazo se parte en dos bloques disjuntos que lo
  agotan.
  Bootstrap: clave de conglomerado = (EST_DIS, UPM_DIS) como cadenas; UPM con
  reemplazo dentro de EST_DIS conservando el numero de UPM por estrato; estrato
  con UPM unica se re-muestrea a si mismo. IC = percentiles 2.5/97.5 de las
  replicas.
  NO se promedia entre olas, no se ajusta tendencia, no se extrapola, no se
  imputa, no se re-escala, no se construye serie.

estimando: >-
  DESCRIPTIVO, y es EL MISMO ESTIMANDO de la familia B de CALC-ENCIG-0001
  medido sobre la ola 2023 -- no un estimando nuevo. (1) PRIMARIOS: B-P-PRE-SD
  y B-P-DIG-SD, proporcion ponderada de eventos de tramite con P8_4 = 1 en el
  canal presencial y en el digital/registrado, unidad EVENTO DE TRAMITE,
  ponderador FAC_TRA, escala [0,1], rama SD (sin deduplicar), con sus IC95 de
  diseno. (2) SECUNDARIOS DECLARADOS, NO adoptables: la rama CD (deduplicada
  por ID_TRA), que existe solo para comparabilidad con el par CD de 2025; los
  complementos contados con su denominador escrito; el peso residual de canal,
  que contesta si el par presencial/digital agota P7_3 o solo lo parece bajo el
  recorte; y la cobertura del join. (3) CONTRASTE DE OLA, rotulado
  CONTRASTE-DE-OLA-NO-SERIE: B-DELTA-2023-VS-2025-PRE-SD y -DIG-SD, con signo,
  contra 0.1410407168724654 y 0.029867554626649372. Dos olas del mismo
  instrumento NO son una serie y esta spec no la construye: su lectura correcta
  es «cuanto difiere esta ola de aquella», nunca «cuanto cambio la mordida».
  NINGUN RESULT ES CAUSAL: B-DIFERENCIA-PRE-DIG-SD y B-RAZON-PRE-DIG-SD van
  rotuladas ASOCIACION -- la eleccion de canal y la elegibilidad por canal
  confunden la comparacion, y la falsable_si de tramite.mordida.con_registro NO
  se declara probada por esta corrida.

dependencias_materiales: [numpy, pandas]

parametros:
  fuente_acto: "ACTO GEN2-FIRMAS-MESA-1 · OBJETO 4 · CALC-ENCIG-2023-0001 · sucesora de CALC-ENCIG-0001 (familia B) sobre la ola 2023"
  firma_que_lo_autoriza: "FIRMA DE MESA 15/sep/2026, verbatim: «Si a todas.» -- HOJA DE FIRMAS DE MESA 2026-09-15, archivada por A.3 en forense/encargos/2026-09-15-GEN2-FIRMAS-MESA-1.md, OBJETO 4 transcrito integro: «D1 / NC-0197 -- opcion (b): medir ENCIG 2023 con spec sucesora de CALC-ENCIG-0001. Spec aqui; corrida en caja.» La firma autoriza MEDIR y ordena congelar la spec en nube; NO declara OBJETO sobre el contador GEN2: por eso cuenta_gen2 queda PENDIENTE-DE-MESA."
  correccion_sin_reescribir_el_sello: >-
    NC-0197 (forense/no-corrido.tsv:193) registra que la frase «CORR-0001
    (ENCIG2023, sin payload, 4 RESULT)» de
    forense/prereg-caja/ENCIG-MORDIDA-spec-v1_0.md:142 es FALSA EN LA LETRA
    desde el 29/jul/2026 -- el payload esta en data/manifiesto.yaml desde esa
    fecha en cinco formatos (CSV, RData, DBF, DTA, SAV) -- y que NO se edita
    (E.3: lo sellado no se reescribe). ESTA SPEC SUCESORA ES EL VEHICULO
    CORRECTO de esa correccion, y se dice explicitamente: mide lo que la frase
    declaro no medible SIN TOCAR UN BYTE del sello. La v1.0 conserva su letra,
    su sha256 (00c7c4a6…) y su identidad de input; la v1.1 tampoco cambia. Lo
    que estaba mal no era el juicio del ejecutor de septiembre, que no tenia el
    payload en su perimetro: era un hecho que caduco, y un hecho que caduca se
    corrige con una sucesora fechada, no con un sed sobre un sello.
  bootstrap_replicas: 2000
  metodo_ic: "bootstrap de UPM_DIS CON REEMPLAZO dentro de EST_DIS, conservando el numero de UPM por estrato; percentiles 2.5/97.5."
  metodo_ic_heredado_no_elegido: >-
    El metodo NO lo elige el ejecutor de este acto: lo HEREDA.
    prereg-caja-ENCIG-MORDIDA v1.1 (enmienda fechada 9/sep/2026, que cierra
    NC-0112) elevo el metodo de §3.7 de la v1.0 a ESTANDAR PRE-REGISTRADO DE LA
    FAMILIA para toda ranura sin metodo propio. Esta spec es una de esas
    ranuras y lo toma sin volver a elegirlo. Lo unico propio es la semilla del
    acto (20260915). Por lo tanto NO aplica aqui la clausula de
    «ranura_no_preregistrada» que la v1.0 declaraba.
  regla_estrato_upm_unica: >-
    Un estrato con exactamente una UPM se re-muestrea a si mismo: aporta
    varianza cero. NO se colapsa (decision de diseno que esta spec no esta
    autorizada a tomar) y NO se descarta (sesgaria el punto). Si el conteo es
    > 0, B-METODO-IC sale IC-CON-ESTRATOS-DE-UPM-UNICA y el IC se lee como
    LIMITE INFERIOR de la anchura verdadera, nunca como IC exacto.
  llaves_opacas: >-
    EST_DIS y UPM_DIS se agrupan como CADENA CRUDA (dtype=str). Nunca se
    convierten a entero ni se re-rellenan a un ancho tomado de un descriptor:
    normalizarlas partiria o fusionaria estratos en silencio (leccion de ACTO
    GEN2-LOTE-ENVIPE-1 §3.4, donde el descriptor iba desfasado respecto de su
    propio microdato). Se toman del lado sec_7 de la tabla unida, el que
    corresponde a la unidad del ponderador.
  archivo_de_ponderador: "encig2023_04_sec_7.csv -- declarado como PARAMETRO y no como detalle. FAC_TRA existe SOLO en sec_7; sec_8 trae FAC_P18, otro ponderador sobre otro universo. Resolver el ponderador por nombre de variable sobre la tabla unida tomaria el equivocado SIN AVISO (A.15(c)) y la cifra resultante seria plausible y falsa. La guardia G-6 comprueba, y emite como RESULT, que FAC_TRA salio de sec_7 y que FAC_P18 quedo sin usar."
  llave_del_join:
    primaria: "ID_TRA -- presente en los DOS miembros de 2023 (verificado en data/inventario-reactivos-v1_2.tsv). Es la misma llave que uso CALC-ENCIG-0001 sobre 2025 y se elige POR CONTINUIDAD DEL ESTIMANDO: cambiar la llave cambiaria que filas se emparejan y, con ello, el estimando -- justo lo que una sucesora tiene prohibido cambiar."
    control: "(ID_VIV, ID_PER, ID_TRA, N_TRA) -- las cuatro estan en los dos miembros. Se computa TAMBIEN, y su resultado es un RESULT (G-JOIN-LLAVE-CONTROL-COINCIDE), NO una correccion."
    razon_de_existir: "P7_3 (canal) vive en sec_7 y P8_4 (desenlace) en sec_8; NINGUN miembro del ZIP trae los dos. El estimando NO es construible sin unir las dos tablas, y por eso la llave es parte del contrato y no del medidor."
    si_no_es_unica: >-
      Si ID_TRA NO es unica en sec_8 -- es decir, si el join no es uno-a-muchos
      exacto -- el estimando sale NO-ESTIMABLE-LLAVE-NO-UNICA. Si la llave
      primaria y la llave de control emparejan conjuntos DISTINTOS de filas, el
      join se declara JOIN-NO-EXACTO y las ramas de B salen tambien
      NO-ESTIMABLE-LLAVE-NO-UNICA. NO se deduplica sobre la marcha, NO se toma
      la primera fila, NO se promedia y NO se elige la llave que de mas filas.
      Esa decision es de mesa, no del medidor.
    no_se_usan_para_unir: "UPM y V_SEL existen en ambos miembros y sirven SOLO a la guardia de llave declarada (G-2), nunca para unir."
  miembros_zip_declarados:
  - "encig2023_04_sec_7.csv"
  - "encig2023_05_sec_8.csv"
  miembros_zip_no_abiertos:
  - "encig2023_01_sec1_A_3_4_5_8_9_10.csv"
  - "encig2023_01_sec_11.csv"
  - "encig2023_02_residentes_sec_2.csv"
  - "encig2023_03_sec_6.csv"
  tablas:
    tramites_calidad: "encig2023_04_sec_7.csv"
    tramites_corrupcion: "encig2023_05_sec_8.csv"
  codificacion:
    B_uno: [1]
    B_cero: [0]
    B_canal_presencial: [1]
    B_canal_digital: [3, 4, 5]
    B_canal_residuo: [2, 6, 7, 8, 9]
    llave_join_primaria: [ID_TRA]
    llave_join_control: [ID_VIV, ID_PER, ID_TRA, N_TRA]
    llave_declarada_sec7: [CVE_ENT, UPM, V_SEL, R_ELE, N_TRA]
  hipotesis_preregistrada:
    H1: >-
      DIRECCION, con signo pre-registrado: la mordida presencial de 2023 sera
      MAYOR que la digital de 2023 (B-P-PRE-SD > B-P-DIG-SD). Es la direccion
      que predice tramite.mordida.con_registro («el registro rompe la trampa
      social») y la que 2025 exhibio. H1-VEREDICTO sale H1-SOSTENIDA /
      H1-NO-SOSTENIDA / H1-NO-EVALUABLE. H1-NO-SOSTENIDA no invalida la
      corrida, no autoriza tocar el medidor y no se ajusta hacia atras.
    H2: >-
      NIVEL, SIN signo pre-registrado y a proposito: el contraste contra 2025 se
      emite rotulado CONTRASTE-DE-OLA-NO-SERIE, con los IC de las dos olas al
      lado. No se pre-registra ningun valor puntual esperado para 2023 porque
      NADA EN EL ARBOL LO DICE, y fabricar una expectativa numerica seria
      contaminar el pre-registro con la ola equivocada.
    H3: >-
      EXHAUSTIVIDAD: el residuo de canal pesara > 0, es decir B-VEREDICTO-CANAL
      = DICOTOMIA-ES-PROPIEDAD-DEL-RECORTE. P7_3 tiene ocho categorias
      sustantivas y el par {1}/{3,4,5} usa cuatro. Si el residuo pesa
      exactamente 0, la hipotesis cae y se dice.
  valores_2025_referencia:
    B-P-PRE-SD: 0.1410407168724654
    B-P-DIG-SD: 0.029867554626649372
  n_2025_referencia:
    B-PRE-SD: 11167
    B-DIG-SD: 7219
    B-ESTRATOS-PRE-SD: 381
    B-UPM-PRE-SD: 2996
    B-ESTRATOS-DIG-SD: 362
    B-UPM-DIG-SD: 2518
  grano_milpa_decimales: 6
  criterio_adopcion: >-
    B-ADOPCION sale LISTADO-PARA-MESA-ESTIMABLE si los dos primarios de la rama
    SD tienen punto y el join quedo exacto; LISTADO-PARA-MESA-CON-RESERVA si el
    punto existe pero B-COBERTURA o el residuo de canal obligan a rotular el
    estimando como condicional al grupo observado por P8_4;
    NO-ADOPTABLE-NO-ESTIMABLE si no hay punto. NO se declara REPRODUCE contra
    nada: NO EXISTE valor GEN1 de la ola 2023 contra el cual reproducir, y el
    valor de 2025 es OTRA OLA -- compararse contra el seria fabricar un falso
    NO-REPRODUCE. ESTE ACTO NO ESCRIBE CITA EN milpa/ BAJO NINGUNA RAMA, no
    crea conducta nueva y no cambia ninguna cifra vigente. La adopcion, y la
    correspondencia entre un medido POR CANAL y los ASIGNADO SIN CANAL de
    RES-0007/RES-0008, las decide mesa por merge.

seed:
  aplica: true
  valor: 20260915
  rng: numpy.PCG64

tolerancia:
  tipo: flotante
  abs: 1.0e-10
  razon: >-
    Bootstrap fijado por seed + rng declarados y sumas en orden fijo de fila: la
    unica diferencia esperable entre dos corridas del mismo arbol es redondeo de
    float64 al reasociar sumas ponderadas. Los enteros y los textos se comparan
    EXACTO. NO se afloja: aqui no hay ninguna cifra que deba «cuadrar» con nada
    previo, porque la ola 2023 no tiene sellado propio.

