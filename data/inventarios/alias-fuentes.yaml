# Identidad canonica de fuentes. Una entrada por fuente real.
# Generado por ENCARGO MAP-1 (2026-08-06) a partir del diagnostico de
# tests/catalogo.py:acron() sobre los 11 inventarios (ver
# forense/notas/2026-08-06-map1-lector.md para el metodo completo).
#
# canonico:     la sigla o nombre corto con el que el programa la cita.
# nombre:       nombre descriptivo completo, sin calificadores de dominio.
# institucion:  quien la produce, tal como lo declara el propio inventario
#               (campo "Institucion" ya extraido por catalogo.py; puede
#               venir vacio si esa fila del inventario no lo declaraba).
# alias:        TODAS las formas en que acron() produce su identidad hoy,
#               verbatim -- incluye espacios finales y truncamientos a 30
#               caracteres cuando ese es el resultado real de la rama de
#               fallback. El archivo documenta la realidad, no la limpia.
# procedencia:  de que inventario (archivo) y que linea de encabezado salio
#               cada alias, una entrada por ocurrencia cruda.
# slug_portal:  el slug bajo /programas/<slug>/ en
#               data/indice-descarga-masiva-2026-08-05.tsv, SOLO si se
#               verifico ahi (coincidencia exacta de slug + corroboracion
#               por contenido de url/carpeta/archivo). Si no aparece en ese
#               indice, se omite el campo -- no es evidencia de que la
#               fuente no exista, esa canasta es solo una de las que ofrece
#               el portal de descarga masiva.
#
# Dos identidades quedaron deliberadamente FUERA de esta tabla porque su
# forma truncada es AMBIGUA -- dos fuentes reales distintas producen la
# misma cadena de 30 caracteres y no hay forma de distinguirlas por ese
# string sin adivinar cual es cual:
#   - "ENCUESTA NACIONAL DE CALIDAD D" <- ENCAL (IMSS, clase-fuente:215)
#     Y "Encuesta Nacional de Calidad de la Ciudadania" (cultura_valores_
#     opinion:234, texto casi identico a ENCC en capital_social:224 pero
#     sin su parentesis -- candidato a ENCC, no confirmado aqui).
#   - "REGISTROS ADMINISTRATIVOS DE A" <- aseguramiento IMSS
#     (trabajo_ingreso_formalidad:36) Y aseguramiento ISSSTE
#     (trabajo_ingreso_formalidad:48) -- dos registros administrativos
#     distintos, no la misma fuente.
# Sus 4 filas de origen quedan SIN_RESOLVER a proposito tras el cambio de
# PASO 3. Ver la nota forense para el detalle completo.

