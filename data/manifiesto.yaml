- id: nota_metodologica_rotulo_pareada
  fecha: "2026-07-29"
  hecho: >
    Durante el análisis de hitoD-R3.2, una cifra reportada como "brecha pareada por
    N_TRA" resultó estar mal rotulada: era una brecha agrupada (pooled) restringida a
    los tipos de trámite con ambas modalidades observadas, no una brecha pareada ni
    estandarizada -- no reponderaba los tipos restantes a una mezcla común entre
    presencial y digital. Detectado por aritmética (n1 global vs. n1 dentro de la tabla
    "pareada": la diferencia era exactamente el n presencial del único tipo de trámite
    excluido). Corregido con estandarización directa (ver hitoD-R3.2 §2.3). Se deja esta
    nota porque la cifra mal rotulada circuló en el análisis antes de corregirse y el
    error de nomenclatura -- no solo el número -- es parte de la procedencia del dato.
