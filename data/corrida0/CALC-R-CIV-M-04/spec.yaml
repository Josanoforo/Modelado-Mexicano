# CALC-R-CIV-M-04 -- cara mecanica de spec.md (ACTO GEN2-R-SERIE-DBF).
# Gobierna spec.md y, sobre el, la spec SELLADA
# forense/prereg-caja/R-ENVIPE-SERIE-DBF-spec-v1_0.md, sucesora por extension de
# forense/prereg-caja/R-ENVIPE-SERIE-spec-v1_0.md, que NO se edita.
# Releva la demanda CORR-0032 (RES-0103) bajo el registro GEN2.
# CONGELADO en el COMMIT-1, antes de abrir un solo registro de TMod_Vic.dbf.
calc_id: CALC-R-CIV-M-04
spec_md: spec.md
spec_md_sha256: eaa66dde887bfaaa7b5805a1c22bd5d2d43934626b0e5e36b62aec940512f019
script: data/corrida0/CALC-R-CIV-M-04/medidor.py
etiquetas:
  generacion: GEN2
  tipo: ARBITRO-R-DE-CELDA
  cuenta_gen2: SI
  cuenta_gen2_firma: 'Firma de mesa 9/sep/2026, incluida en el encargo con OBJETO explicito (estandar
    FP-367/368), verbatim: «Decision 1 - Mas que barata es la mejor? Si es la mejor lo hacemos si no estamos
    seguro corremos de 0. Decision 2 - firmemos. la correspondencia puede esperar un dia mas. La decision
    va en el encargo no fuera y mi firma es el merge. Dame los encargos.» El encargo escribe: cuenta_gen2
    = SI para los tres CALC que este acto selle; el merge de mesa la perfecciona.'
  validacion_independiente: NO-HECHA
  spec_sellada: forense/prereg-caja/R-ENVIPE-SERIE-DBF-spec-v1_0.md
  spec_sellada_sha256: f5ce91e16cfd3ad0ae8a5a90ed8bbb74e7b7618cbe9a361002e1cf16d0e4d063
  spec_familia_madre: forense/prereg-caja/R-ENVIPE-SERIE-spec-v1_0.md
  spec_familia_madre_sha256: b9a29cf656b9fcfe2794eaa4e2b3de0a9df699d72af1d143e0059c64b051dba4
  spec_familia_madre_editada: NO -- sucesion por extension, no reescritura (perimetro del encargo)
  demanda_que_releva: 'CORR-0032 -> RES-0103 (arbitro R de la celda CIV-M-04 del marco M, consumidor forense/prereg-duelo-v2/marco-M-sorteado-v1_3.tsv:CIV-M-04:R).
    La ADOPCION no es de este acto: la decide mesa por lote (F3).'
  reglas_bajo_prueba: NINGUNA. Este CALC no toca milpa/, no mueve tier y no adopta.
  contaminacion_declarada: 'ADR-46 -- al congelar, la sesion YA habia leido el punto R de GEN1 de esta
    celda (0.24366832225578466) y los de las otras dos, porque el encargo los cita y el A.8 del ejecutor
    abrio los tres JSON. La codificacion primaria NO se elige aqui: se copia verbatim de codificacion-R-v1_0.tsv
    (sha cf5dfb18...), anterior a esta sesion. El mapeo de BPCOD se valida contra ETIQUETAS Y ESTRUCTURA
    (PERFIL-BPCOD), nunca contra resultados. El medidor NO abre los JSON de corridas-R/ ni recibe el valor
    GEN1 por ningun parametro: el control positivo lo corre un script aparte DESPUES de sellar (spec sellada
    7). NO se abrio tools/arbitra.py.'
  medidor_ejecutado_al_congelar: NO -- escrito y congelado en el COMMIT-1, corrido en el COMMIT-2 del
    mismo acto
  medidor_identico_a: CALC-R-CIV-M-01, CALC-R-CIV-M-02 y CALC-R-CIV-M-04 depositan el MISMO medidor.py
    byte a byte; que sus tres script_blob_sha256 coincidan es la prueba de que las tres olas corrieron
    el mismo codigo.
  guardia_tper_vic2: NO-APLICA -- la familia R-ENVIPE-SERIE mide U_R y U1, ambos unidad DELITO sobre tmod_vic
    con FAC_DEL, y no abre tper_vic2. Valor declarado, no omision (D-15). Spec sellada 5.
