  # ══════════════════════════════════════════════════════════════════

  - id: civico.participacion.contingente_escalonado_2016_2024
    misma_regla_motor: civico.participacion.contingente
    enmienda_a: civico.participacion.contingente
    situacion: SELLADA-SIN-CARGA  # firma a1 (mesa, 2/sep/2026), ACTO MAESTRA35-N3 -- veredicto REFUTADA-COMO-CAUSAL aceptado; NO se carga al motor: un Δ en pp no es una probabilidad
    si:
      disparadores: PENDIENTE-DE-MESA  # el diseno soporta UN disparador binario
        # -- la eleccion municipal es concurrente con la federal, si/no -- y lo
        # midio. Lo que el dato dice es que ese disparador NO es el que mueve la
        # participacion: ver falsable_si. Proponer disparadores al motor sobre
