  cuenta_gen2: PENDIENTE-DE-MESA
  validacion_independiente: PENDIENTE-DE-EJECUCION
  estado_adopcion: NO-ADOPTADO
  version_spec: "v1.0 serie (ACTO GEN2-ENIGH2024-SERIE-Y-COMMIT-1, P1); generalizacion parametrizada por ola de CALC-ENIGH2022-INTENSIDAD-REMESAS-0001 -- oro=reproduccion exacta de 2022 verificada en tests/test_enigh_serie_oro.py"
  contaminacion_declarada: "Se conocia la prevalencia ponderada padre de esta ola (0.04377543852935772, CALC-B-0001) y los 45 RESULT sellados 2022 de este mismo medidor; no se conocian los montos ni cocientes reales de 2020 al congelar. No es estudio ciego ni confirmatorio."

inputs:
