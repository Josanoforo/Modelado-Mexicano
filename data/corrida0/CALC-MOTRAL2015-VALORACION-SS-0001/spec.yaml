universo: >-
  MOTRAL 2015, persona seleccionada 18-54 con experiencia laboral, entrevista
  completa, nacional urbana (32 ciudades autorrepresentadas).
filtros: >-
  R_DEF=00; EDA 18..54; C_TRA in {1,2}. P17 valido 1/2. P16 requiere un
  primer lugar unico; calidad del ranking se cuantifica. Cruce: llave unica,
  enlace SDEM, CLASE2=1 y SEG_SOC 1/2.
ponderador: FAC_MOTRAL; FAC de ENOE no se usa.
transformacion: >-
  P17=1 binaria. P16 primer lugar por columna con rango 1; cinco opciones
  separadas, sin promedio cardinal. Cortes sexo y edad son dominios separados.
estimando: >-
  Cinco tasas P17, 25 participaciones P16 de primer lugar y dos tasas P17 por
  cobertura actual ENOE; 32 celdas descriptivas en una operacion.
precision: >-
  Conglomerados ultimos y Taylor: UPM anidada en CD_AxEST_D sobre muestra
  completa; IC95 normal bilateral truncado [0,1], sin FPC.

dependencias_materiales: []
