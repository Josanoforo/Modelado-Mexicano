# forense/prereg-caja/ENIF-AHORRO-spec-v1_0.md (`prereg-caja-ENIF-AHORRO`).
# Releva la demanda CORR-0009 (los 8 RESULT que el encargo nombra) bajo GEN2.
# CONGELADO en el COMMIT-1, antes de abrir un solo *.csv del microdato.
