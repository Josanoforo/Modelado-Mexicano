    por aritmética: 38309647/1048576 (MiB) = 36.53 -> coincide con lo anunciado; 38309647/1000000
    (MB decimal) = 38.31 -> no coincide. El anuncio está en MiB etiquetado como MB (convención
    Windows), no hay descuadre real de contenido.'

