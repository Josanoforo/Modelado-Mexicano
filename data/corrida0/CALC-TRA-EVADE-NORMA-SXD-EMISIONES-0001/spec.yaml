    Que candidato reproduce mejor p(evade_norma | escolaridad_proxy,
    dominio_urbano_rural) en las 12 celdas de ENVIPE 2025, y con que margen --
    sin que ninguno vea el cruce de 2025 antes de emitir? En particular: la
    interaccion de la ola anterior (C6) o promediada (C7) aporta sobre los
    marginales actuales sin interaccion (C2)?
  consumidor: "celda-D TRA.evade_norma.envipe2025.escolaridad_x_dominio; fila M05 de milpa/catalogo-momentos-v0_1.tsv; regla tramite.evasion_norma (milpa/tramite.yaml:487); el marcador rediseñado (FP-383) es el sucesor"
  celdas: [S1xD1, S1xD2, S1xD3, S2xD1, S2xD2, S2xD3, S3xD1, S3xD2, S3xD3, S4xD1, S4xD2, S4xD3]
  rotulos_escolaridad: {S1: "hasta primaria", S2: "secundaria", S3: "media superior", S4: "superior"}
  rotulos_dominio: {D1: "Rural", D2: "Complemento urbano", D3: "Urbano"}
  codigos_bp1_23_numerador: ["04", "05", "06", "08"]
  universo_bp1_20: ["1", "2"]
  escolaridad_niv_a_tramo: {"00": "hasta primaria", "01": "hasta primaria", "02": "hasta primaria", "03": "secundaria", "04": "media superior", "05": "media superior", "06": "media superior", "07": "media superior", "08": "superior", "09": "superior"}
  dominio_codigo_a_celda: {U: "Urbano", C: "Complemento urbano", R: "Rural"}
  bootstrap_replicas: 10000
  ola_desarrollo: 2024
  ola_insumo_c7: 2023
  ola_reservada: 2025
  umbral_soporte_n: 200
  soporte_es_caveat_no_bloqueo: true
  soporte_n_2023_2024_donde: "COMMIT-2 (este CALC)"
  soporte_n_2025_donde: "COMMIT-3, junto con R"
  salida_si_sin_soporte: >-
    la celda se rotula FUERA-DE-SOPORTE en esa ola, se emite igual su punto e
    IC marcados, NO puntua en la adjudicacion. n = 0 -> NO-ESTIMABLE (null),
    nunca 0.0.
  c2_dieta: "los ocho marginales publicos sellados del arbitro (tramite-ola5-propuesta-v0.yaml:1715-1718, :1729-1731; tramite.yaml:497)"
  c2_desenlace_id: "evade_norma::BP1_20==2 AND BP1_23 in {04,05,06,08}"
  c2_punto_desde: "marginales sellados, citados y no recalculados"
  c2_ic_desde: "replicas compartidas de esos mismos marginales re-derivados por el modulo congelado"
  c2_forma: "log-aditiva: expit(logit p_s + logit p_d - logit p)"
  c2_rotulo_supuesto: "ausencia de interaccion en escala logit"
  c2_rotulo_prohibido: "independencia"
  c2_rechazo: "SIN-DEFINIR si algun marginal es exactamente 0 o 1, en el punto o en una replica; si el PUNTO es SIN-DEFINIR la celda es NO-CONSTRUIBLE (null), sin recorte y sin sustitucion"
  c2_funcion_de_referencia: "tests/test_celda_d_c2.py::piso_log_aditivo -- el medidor la IMPORTA, no la reimplementa"
  c6_forma: "expit(logit C2 + I24(s,d))"
  c7_forma: "expit(logit C2 + (I23(s,d) + I24(s,d))/2)"
  interaccion_forma: "I_w(s,d) = logit p_w(s,d) - [logit p_w(s) + logit p_w(d) - logit p_w]"
  marginales_sellados:
    S1: {p: 0.493221, ic95: [0.462397, 0.524253], n: 3491, linea: "milpa/tramite-ola5-propuesta-v0.yaml:1715"}
    S2: {p: 0.567369, ic95: [0.548202, 0.586405], n: 7739, linea: "milpa/tramite-ola5-propuesta-v0.yaml:1716"}
    S3: {p: 0.543368, ic95: [0.522009, 0.564012], n: 11476, linea: "milpa/tramite-ola5-propuesta-v0.yaml:1717"}
    S4: {p: 0.590093, ic95: [0.574224, 0.605663], n: 17474, linea: "milpa/tramite-ola5-propuesta-v0.yaml:1718"}
    D1: {p: 0.403310, ic95: [0.377390, 0.428694], n: 3770, linea: "milpa/tramite-ola5-propuesta-v0.yaml:1729"}
    D2: {p: 0.522090, ic95: [0.503125, 0.540579], n: 8039, linea: "milpa/tramite-ola5-propuesta-v0.yaml:1730"}
    D3: {p: 0.592703, ic95: [0.579102, 0.606130], n: 28471, linea: "milpa/tramite-ola5-propuesta-v0.yaml:1731"}
    NAC: {p: 0.562774, ic95: [0.551982, 0.573448], n: 40280, linea: "milpa/tramite.yaml:497 y :522 (ic95); milpa/tramite-ola5-propuesta-v0.yaml:871; prereg-caja-ENVIPE-EVASION-NORMA §1"}
  marginales_sellados_cobertura_escolaridad: 0.997517
  control_arbitro_tol_p: 1.0e-6
  control_arbitro_tol_ic: 1.0e-4
  control_arbitro_ramas: "REPRODUCE si |delta p| <= 1e-6 Y |delta IC| <= 1e-4 en los ocho grupos; NO-REPRODUCE en otro caso, con delta con signo y delta n, sin ajustar nada. Un NO-REPRODUCE no invalida el piloto: invalida la afirmacion de que este medidor reproduce la receta del arbitro."
  guardia_reserva: "tools/celda_d/marginales_reproduccion.py: marginal(ola, grupo: str) UN eje por firma; huella de la ola; cruce() lanza ReservaRota sobre ola reservada; probado en cada corrida (RESULT-TRA-SXD12-G-RESERVA-CRUCE-2025-DERIVADO)"
  c4_faltantes:
