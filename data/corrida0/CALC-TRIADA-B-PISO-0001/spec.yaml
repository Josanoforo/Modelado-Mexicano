  rol: error absoluto por celda de los tres corredores de la triada, y pertenencia a U3
- archivo: data/corrida0/CALC-B-MARCO-MAE-0001/resultados.json
  variable: RESULT-BM-MAE-<celda>-PERSISTENCIA-ERR-PP
  rol: error con signo de B bajo el brazo PERSISTENCIA (se toma en valor absoluto)
- archivo: data/corrida0/CALC-TRIADA-0002/resultados.json
  variable: RESULT-F5C-MAE-{L-SOLO,L-CORPUS,M}-PP, RESULT-F5C-VEREDICTO-GLOBAL
  rol: los MAE sellados sobre U3 (control de derivacion) y el veredicto vigente, citado intacto
- archivo: forense/prereg-duelo-v2/marco-M-sorteado-v1_3.tsv
  variable: id
  rol: las 14 celdas del marco (guardia de identidad)
universo: >-
  U_COMUN = U3 interseccion {celdas con B bajo PERSISTENCIA} = 9 de las 14 celdas del marco. Las cinco
  ausentes se reportan con razon nominal (FUERA-DE-U3, SIN-B-PERSISTENCIA, FUERA-DE-U3-Y-SIN-B) y no se
  rellenan. Todo MAE se publica con su n y su lista: NO es comparable con el MAE de la 0002 (n=12) ni
  con el del asiento de B (n=10).
filtros: >-
  Una celda entra a U_COMUN si y solo si tiene punto en LOS CUATRO corredores: en_u3 = SI en celdas.tsv
  Y RESULT-BM-MAE-<celda>-PERSISTENCIA-ERR-PP no nulo. Nada se imputa, nada se sustituye.
ponderador: NO-APLICA (media simple de abs(err_pp) sobre celdas, como el MAE_pp del duelo).
transformacion: >-
  MAE_pp(corredor) = media de abs(err_pp) sobre las 9 celdas de U_COMUN, en orden fijo de id. Control de
  derivacion: los tres MAE de la 0002 recalculados sobre U3 desde celdas.tsv, contra los sellados, en
  tres ramas (1e-9 inclusivo, 0.005 estricto).
estimando: >-
  DESCRIPTIVO: cuanto yerra cada corredor sobre el universo donde los cuatro compiten, con su n y su
  lista. No es una estimacion de regla, no adjudica, no corona y no refuta ni corrobora nada (A-bis.4,
  B-bis §4.2). La ordenacion sale rotulada ORDEN-DESCRIPTIVA y el veredicto es NO-ADJUDICA-POR-DISENO.
