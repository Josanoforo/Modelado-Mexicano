      -- del signo que R7.6 predice, pero pequenia frente a la brecha que ya
      existe en la rama donde R7.3 esperaba cero.
      LO QUE ESTO NO ES. No es un efecto: es una asociacion transversal sin
      identificacion, y la direccion mas obvia de confusion esta abierta --
      quien apoya al oficialismo puede tener mas probabilidad de estar en un
      programa, no solo al reves. Lo que el dato refuta no es "la transferencia
      compra el voto" sino la afirmacion mas debil y mas concreta que R7.3 si
      hace: que BAJO SECRETO PERCIBIDO la asociacion se anula. No se anula.
      La rama SECRETO se apoya en 79 personas tratadas y su IC es ancho
      ([1.43, 27.44] pp): despeja el cero por poco. Se reporta como esta.
