universo: "Identico al -0001: persona elegida 18-70 en las 9 conductas de la lista blanca CONDUCTAS_AUTORIZADAS del -0001; ninguna otra columna de TMODULO 2024 es alcanzable desde este codigo."
filtros: "Los del -0001, por bytes: abre_conducta_2024 exige conducta_id en CONDUCTAS_AUTORIZADAS antes de leer el ZIP; edad_v en [18,70]."
ponderador: fac_per
transformacion: "Las del -0001, por bytes, salvo UNA: niv se lee con sus dos digitos intactos (_niv_dos_digitos) y se asigna a cubo con NIV_A_ESCOLARIDAD_POR_TEXTO (spec.md §1: 00-02 hasta_primaria, 03 secundaria, 04-07 media_superior, 08-11 superior, 99 sin cubo), en vez de pasar por _code() de -EJES-0003."
estimando: "Marginal real ENIF 2024 (18-70) de las 9 conductas de credito por 16 celdas de eje, con el eje escolaridad bien medido; oro de las 12 celdas no-escolaridad contra el -0001; y veredicto por conducta de PERSISTENCIA vs TENDENCIA-X con la regla sellada del -0001 sobre 16 celdas (ADJ16) y, como oro del conducto, sobre 12 (ORO12)."
parametros:
  bootstrap_replicas: 10000
  metodo_ic: "bootstrap UPM estratificado, percentiles 2.5/97.5 -- _estimate de CALC-PISOS-ENIF2021-EJES-0003, identico al -0001"
  oro_tolerancia_abs: 1.0e-10
  n_soporte: NO-APLICA
  tolerancia_coherencia: NO-APLICA
