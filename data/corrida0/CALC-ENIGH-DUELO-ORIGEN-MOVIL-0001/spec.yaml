  - {archivo: CALC-B-0001/resultados.json, variable: "RESULT-B-ENIGH-{ola}-IC-LO/IC-HI", rol: IC95 ya sellado del punto, por ola}

universo: "Las cuatro olas de la ventana de serie de este acto (2016, 2018, 2020, 2022), ya selladas por CALC-B-0001; 2012/2014 fuera por corte de serie (ver CALC-ENIGH2016-PERFIL-ESTRUCTURAL-0001/spec.md §2)."
filtros: "Ninguno: los cuatro puntos entran completos. NO-CONSTRUIBLE por contendiente/ola se declara, no se filtra en silencio."
ponderador: NO-APLICA
transformacion: "Regresion OLS en logit (C-T2/C-T3/C-TS), media en logit (C-MEDIA) o persistencia (C-PISO); origen movil: cada ola predicha solo con anteriores de la misma serie sellada."
estimando: "Error retrospectivo (MAE, sesgo, cobertura) de cinco contendientes prediciendo cada ola de la serie con las anteriores; NO es el duelo real de 2024, que necesita el punto de 2024 (COMMIT-3, fuera de este acto)."
precision: "Delta method desde el EE en proporcion de cada punto sellado, propagado a traves de los pesos de la prediccion OLS/media; ver tools/enigh_duelo_nacional.py docstring."
dependencias_materiales: [numpy]

parametros:
  olas_ventana: [2016, 2018, 2020, 2022]
  modulo_generico: tools/enigh_duelo_nacional.py
  razon_no_tools_duelo: "tools/duelo/ esta declarado ajeno al perimetro de este acto en la cabecera del encargo; codigo propio con el mismo diseno matematico, sha256 emitido como RESULT (mismo patron que CALC-DUELO-ORIGEN-MOVIL-0001 de ENVIPE)"

seed: {aplica: false}
tolerancia: {tipo: determinista, exacto_por_seed: true, abs: 0.0, razon: "regresion OLS cerrada, sin muestreo aleatorio"}

