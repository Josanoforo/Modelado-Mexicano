  # salud_mental. Sus 5 citas vivas (procedencia.yaml:246,252,257;
  # refutations.yaml:147,238) son, las 5, sobre acceso/sistema de salud
  # FÍSICA -- ninguna toca salud mental/estigma. Mapea al mismo archivo que
  # report:salud_cuerpo. Movida de residuales a mapeo (ver forense/hallazgos.md
  # 31/jul/2026). No se reescriben las citas en milpa/*.yaml -- el alias las
  # resuelve; eso es otra decisión.
  report:salud: corpus/reports/Health__Body__Food_and_Substance_Use_in_Mexico__The_Behavioral_Layer_of_Decisions__Environment_and_Structure.md
  report:sancion_social: corpus/reports/Sanción_Social_Horizontal_en_México__Chisme__Envidia_y_Mal_de_Ojo_como_Mecanismos_de_Nivelación.md
