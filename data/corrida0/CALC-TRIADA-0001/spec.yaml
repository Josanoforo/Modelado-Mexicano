variables: []
universo: "U0 = las 14 celdas de forense/prereg-duelo-v2/marco-M-sorteado-v1_3.tsv; UR = las 14 con arbitro R valido/sellado/de identidad compatible (universo-triada-v1_4.tsv, congelado por ENCARGO 3/5); U3 = interseccion de UR con punto valido de L_SOLO, L_CORPUS y M y no CONTAMINADA-POR-OBJETIVO. U3 lo DERIVA este acto por la regla congelada de F5-contrato-triada-spec-v1_1.md Sec.1.3, sin ampliar ni reducir UR."
filtros: "Unica puerta de entrada a U3 (Sec.1.3): insumo disponible/valido, nunca resultado del error. Ninguna celda se elimina por error grande. Replicas L: solo entran a la mediana las EXTRAIBLE bajo el extractor v1.3 validado; NO-EXTRAIBLE y AMBIGUA cuentan en cobertura y no se sustituyen por cero."
ponderador: "NO-APLICA -- las 14 celdas pesan igual en el MAE y en las Delta pareadas; dar mas peso a una familia esta prohibido por el encargo. Las k=8 replicas de una celda no son 8 tareas independientes: colapsan a un punto por celda antes de cualquier promedio."
transformacion: "error_X,i = |prediccion_X,i - R_i| expresado en puntos porcentuales (proporcion x100; la escala de R gobierna, columna escala de marco-M-sorteado-v1_3.tsv = binaria en las 14). Agregacion L por celda: mediana de las replicas EXTRAIBLE (pipeline-L-adv1-m2.py::agregar_continua), heredada sin cambio."
estimando: "MAE_X sobre el mismo U3 para X en {L_SOLO, L_CORPUS, M}; las tres Delta(A,B) = media(error_A - error_B) en pp con IC95 bootstrap pareado; el veredicto pareado por la escala exhaustiva de Sec.4 con delta=0.5 pp; y el veredicto global por la escala de Sec.4 (GANADOR-TRIADA-X / SIN-GANADOR-UNICO / NO-ADJUDICABLE-POR-CONTROL)."

dependencias_materiales: []

parametros:
  fuente_acto: "ACTO GEN2-F5-TRIADA-CALC (ENCARGO 5/5) . CALC-TRIADA-0001"
  bootstrap_seed: 42
  bootstrap_replicas: 10000
  nivel_ic: 0.95
  delta_banda_pp: 0.5
  scope_id_bootstrap: "GEN2-F5-TRIADA-CALC-tres-contendientes"
  k_replicas_l: 8
  contendientes: [L_SOLO, L_CORPUS, M]
  arbitro: R
  diagnostico_sin_veto: B
  celdas_u0: [CIV-M-01, CIV-M-02, CIV-M-04, CIV-M-10, CIV-M-12, CIV-M-13, DIN-M-01, FAM-M-01, FAM-M-05, FAM-M-06, FAM-M-07, TRA-M-02, TRA-M-03, TRA-M-07]

seed:
  aplica: true
  valor: 42
  rng: "random.Random (stdlib, via scoring-adv1-m3.py::generar_indices_bootstrap con semilla derivada por derivar_seed_scope, SHA-256; FP-168, misma semilla heredada de procedimiento-scoring-v1_2.md y F5 v1.0 Sec.5)"

tolerancia:
  tipo: flotante
  abs: 1.0e-9
  razon: >-
    Bootstrap fijado por seed + scope_id declarados y sumas en orden fijo de
    celda (el orden de universo-triada-v1_4.tsv): la unica diferencia esperable
    entre dos corridas de este medidor es redondeo de float por reasociacion de
    sumas. Los textos (veredictos, ids, notas de corte) se comparan EXACTO.

resultados:
  - {id: RESULT-TRIADA-U0-N, tipo: entero, unidad: "celdas del marco de 14 (U0), leidas de universo-triada-v1_4.tsv columna en_U0"}
  - {id: RESULT-TRIADA-UR-N, tipo: entero, unidad: "celdas de UR (arbitro R valido, sellado, identidad compatible), leidas del sidecar congelado columna en_UR"}
  - {id: RESULT-TRIADA-COBERTURA-CAPTURAS-EXAMINADAS, tipo: entero, unidad: "capturas L examinadas por este medidor (14 celdas x 2 variantes x k=8)"}
  - {id: RESULT-TRIADA-CONTROL-IDENTIDAD-CAPTURAS-FALLAS-N, tipo: entero, unidad: "fallas de identidad de captura contra el manifiesto sellado de F5-RECAPTURA-L (sha256 + tripleta id_celda/variante/indice)"}
  - {id: RESULT-TRIADA-CONTROL-IDENTIDAD-CAPTURAS-FALLAS, tipo: texto, unidad: "lista de fallas de identidad (hasta 20) o NINGUNA"}
  - {id: RESULT-TRIADA-CONTROL-REDERIVACION-EXTRACCION-DISCORDANCIAS-N, tipo: entero, unidad: "capturas donde la re-derivacion con el extractor v1.3 sellado discorda del manifiesto de extraccion de ENCARGO 1/5"}
  - {id: RESULT-TRIADA-CONTROL-REDERIVACION-EXTRACCION-DISCORDANCIAS, tipo: texto, unidad: "lista de discordancias (hasta 20) o NINGUNA"}
  - {id: RESULT-TRIADA-COBERTURA-L-SOLO-REPLICAS-EXTRAIBLES, tipo: entero, unidad: "replicas L-SOLO con estado EXTRAIBLE bajo el extractor v1.3 (de 14 celdas x k=8 = 112)"}
  - {id: RESULT-TRIADA-COBERTURA-L-SOLO-REPLICAS-NO-EXTRAIBLES, tipo: entero, unidad: "replicas L-SOLO NO-EXTRAIBLE (cuentan en cobertura; no se sustituyen por cero)"}
